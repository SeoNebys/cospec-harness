<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keep — Read later</title><style>:root{--ink:#14251d;--muted:#68736e;--line:#dfe6e2;--brand:#176b4b;--pale:#e5f4ec}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#f2f5f2}button{font:inherit}.shell{max-width:1060px;min-height:100vh;margin:auto;background:#fbfcfa;border-inline:1px solid #e8ece9}header{height:74px;display:flex;align-items:center;padding:0 38px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:760}.mark{width:32px;height:32px;display:grid;place-items:center;color:white;background:var(--brand);border-radius:10px 10px 10px 3px}.layout{display:grid;grid-template-columns:190px 1fr;gap:42px;padding:48px 38px}.side h3{margin:0 0 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.nav{padding:8px 10px;border-radius:8px;color:#44534c;cursor:pointer}.nav.active{color:var(--brand);background:var(--pale);font-weight:700}h1{margin:0 0 20px;font-size:28px}.card{position:relative;display:grid;grid-template-columns:100px 1fr auto;gap:16px;padding:17px;border:1px solid var(--line);border-radius:16px;background:white}.thumb{min-height:98px;display:grid;place-items:center;border-radius:11px;color:white;background:linear-gradient(145deg,#f2d0aa,#bc704d);font-size:28px}.domain{color:var(--muted);font-size:11px}.title{margin:4px 0;font-size:17px;font-weight:750}.desc{margin:0;color:var(--muted);font-size:13px}.more,.flag{width:40px;height:40px;border:0;border-radius:9px;background:#eef2ef;cursor:pointer;font-size:18px}.flag.active{color:white;background:var(--brand)}.menu{display:none;position:absolute;right:17px;top:58px;width:180px;padding:6px;border:1px solid var(--line);border-radius:10px;background:white;box-shadow:0 12px 30px #14251d22}.menu button{width:100%;padding:8px;border:0;background:white;text-align:left;cursor:pointer}.badge{display:none;align-items:center;gap:5px;margin-top:10px;color:var(--brand);font-size:12px;font-weight:700}.badge.show{display:flex}.empty{display:none;padding:50px;border:1px dashed #cad5ce;border-radius:15px;text-align:center;color:var(--muted)}@media(max-width:650px){.layout{grid-template-columns:1fr;padding:30px 18px}.side{display:none}.card{grid-template-columns:80px 1fr auto}}</style></head><body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark">↗</span> Keep</div></header><div class="layout"><aside class="side"><h3>Library</h3><div class="nav active" id="all">All bookmarks</div><div class="nav" id="later">Read later <span id="laterCount"></span></div><h3 style="margin-top:25px">Labels</h3><div class="nav">Design</div><div class="nav">Research</div></aside><main><h1 id="heading">All bookmarks</h1><article class="card" id="card"><div class="thumb">Aa</div><div><div class="domain">web.dev</div><div class="title">A practical guide to variable fonts</div><p class="desc">How variable fonts give you more control over typography.</p><div class="badge" id="badge">▣ Saved for later</div></div><div id="control"></div><div class="menu" id="menu"><button id="addLater">Add to Read later</button><button>Edit details</button></div></article><div class="empty" id="empty">Nothing in Read later yet.</div></main></div></div><script>const version=new URLSearchParams(location.search).get('v')||'a',control=document.querySelector('#control');let marked=false;if(version==='a')control.innerHTML='<button class="more" id="trigger" aria-label="More actions">•••</button>';else control.innerHTML='<button class="flag" id="trigger" aria-label="Save for later">▣</button>';const mark=()=>{marked=true;badge.classList.add('show');laterCount.textContent='1';if(version==='b')trigger.classList.add('active');menu.style.display='none'};if(version==='a'){trigger.onclick=()=>menu.style.display=menu.style.display==='block'?'none':'block';addLater.onclick=mark}else trigger.onclick=mark;later.onclick=()=>{heading.textContent='Read later';later.classList.add('active');all.classList.remove('active');card.style.display=marked?'grid':'none';empty.style.display=marked?'none':'block'};all.onclick=()=>{heading.textContent='All bookmarks';all.classList.add('active');later.classList.remove('active');card.style.display='grid';empty.style.display='none'};</script></body></html>
