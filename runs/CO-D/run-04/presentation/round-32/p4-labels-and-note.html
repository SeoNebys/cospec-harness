<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 4 (labels & note)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:20px 20px 60px; }

  .switch { background:#111827; color:#fff; border-radius:10px; padding:12px 14px; margin-bottom:22px; }
  .switch .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; opacity:.7; margin-bottom:8px; }
  .switch button { background:#374151; color:#d1d5db; border:0; border-radius:7px; padding:8px 12px; font-size:13px; cursor:pointer; margin-right:6px; }
  .switch button.on { background:var(--accent); color:#fff; font-weight:600; }
  .switch .desc { font-size:12px; opacity:.85; margin-top:9px; }

  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; position:relative; cursor:pointer; }
  li.card:hover .editbtn { opacity:1; }
  .editbtn { position:absolute; top:12px; right:12px; background:#f3f4f6; border:1px solid var(--line); border-radius:7px; font-size:12px; padding:4px 9px; cursor:pointer; opacity:0; }
  .title { font-size:15px; font-weight:600; margin:0; padding-right:60px; }
  .title .ext { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .note { color:#6d5100; background:#fffbeb; border:1px solid #fde68a; border-radius:7px; font-size:12px; margin:8px 0 0; padding:6px 9px; }
  .note b { font-weight:600; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#eef2ff; color:#3730a3; font-size:11px; border-radius:20px; padding:3px 10px; }

  .backdrop { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; }
  .backdrop.show { display:flex; }
  .dialog { background:#fff; border-radius:12px; padding:20px 22px; width:460px; max-width:92vw; box-shadow:0 20px 50px rgba(0,0,0,.3); max-height:90vh; overflow:auto; }
  .dialog h3 { margin:0 0 2px; font-size:16px; } .dialog .did { color:var(--muted); font-size:12px; margin-bottom:6px; }
  label.f { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 0 3px; }
  input.f, textarea.f { width:100%; border:1px solid #c7d2fe; border-radius:7px; padding:8px 10px; font-size:14px; font-family:inherit; }
  textarea.f { resize:vertical; min-height:48px; }
  .hintline { font-size:11px; color:var(--muted); margin-top:3px; }
  .row { display:flex; gap:8px; margin-top:16px; }
  .row button { border:0; border-radius:7px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .save { background:var(--accent); color:#fff; } .cancel { background:#f3f4f6; color:#374151; }

  /* tag entry */
  .chipbox { border:1px solid #c7d2fe; border-radius:7px; padding:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { background:#eef2ff; color:#3730a3; font-size:12px; border-radius:20px; padding:3px 6px 3px 11px; display:flex; align-items:center; gap:5px; }
  .chip button { background:none; border:0; color:#6366f1; cursor:pointer; font-size:13px; line-height:1; padding:0; }
  .chipbox input { border:0; outline:0; flex:1; min-width:120px; font-size:14px; padding:4px; }
  .suggest { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .suggest button { background:#f3f4f6; border:1px dashed #c7d2fe; color:#4338ca; font-size:12px; border-radius:20px; padding:3px 10px; cursor:pointer; }
  .suggest .new { border-style:solid; background:#eef2ff; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <div class="switch">
    <div class="lbl">Prototype control · try adding labels three ways</div>
    <button data-m="A" class="on">A · Type &amp; Enter</button>
    <button data-m="B">B · One comma list</button>
    <button data-m="C">C · Type with suggestions</button>
    <div class="desc" id="modeDesc"></div>
  </div>
  <ul id="list"></ul>
</main>
<div class="backdrop" id="backdrop"><div class="dialog" id="dialog"></div></div>

<script>
let tagMode='A';
const MODES={
  A:"Type a label and press Enter — it becomes a little removable pill. Repeat for each. Fully free-form.",
  B:"One text box: type your labels separated by commas, e.g. \"recipes, baking\". Simple, but no help avoiding near-duplicates.",
  C:"Type a label; labels you've used before pop up as suggestions to click, so \"recipes\" doesn't fork into \"recipe\"."
};
let items=[
  { url:"https://nytimes.com/2026/travel/kyoto", title:"36 Hours in Kyoto",
    desc:"Temples at dawn, a tofu lunch, and where to find the quiet streets.", note:"", tags:["travel"] },
  { url:"https://medium.com/@dev/p/9f3a2b", title:"Untitled draft",
    desc:"A page saved from medium.", note:"", tags:[] },
  { url:"https://wikipedia.org/wiki/Sourdough", title:"Sourdough — Wikipedia",
    desc:"Bread made by fermentation of dough.", note:"Try the 24h cold-proof method.", tags:["recipes","baking"] },
  { url:"https://stripe.com/blog/payment-api", title:"Designing the Stripe Payments API",
    desc:"API ergonomics, idempotency, and versioning at scale.", note:"", tags:["work","dev"] },
];
function allTags(){ const s=new Set(); items.forEach(i=>i.tags.forEach(t=>s.add(t))); return [...s].sort(); }

const list=document.getElementById('list'), backdrop=document.getElementById('backdrop'),
      dialog=document.getElementById('dialog'), modeDesc=document.getElementById('modeDesc');
let editIdx=null, draft=[]; // draft tags while dialog open (A/C)

function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } }
function full(u){ return /^https?:\/\//.test(u)?u:"https://"+u; }
function esc(s){ return (s||'').replace(/</g,'&lt;'); }

function render(){
  modeDesc.textContent=MODES[tagMode];
  list.innerHTML=items.map((it,i)=>`
    <li class="card" data-open="${i}">
      <button class="editbtn" data-edit="${i}">✎ Edit</button>
      <p class="title">${esc(it.title)}<span class="ext">↗ open</span></p>
      <p class="desc">${esc(it.desc)}</p>
      ${it.note?`<p class="note"><b>Note to self:</b> ${esc(it.note)}</p>`:''}
      <div class="url"><span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${host(it.url)}</div>
      ${it.tags.length?`<div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    </li>`).join('');
}
function tagSection(){
  if(tagMode==='B'){
    return `<label class="f">Labels</label>
      <input class="f" id="tagtext" value="${esc(draft.join(', '))}">
      <div class="hintline">Separate labels with commas.</div>`;
  }
  const chips=draft.map((t,k)=>`<span class="chip">${esc(t)}<button data-del="${k}">×</button></span>`).join('');
  let sug='';
  if(tagMode==='C'){
    sug=`<div class="suggest" id="suggest"></div>`;
  }
  return `<label class="f">Labels</label>
    <div class="chipbox" id="chipbox">${chips}<input id="taginput" placeholder="${draft.length?'add another…':'type a label…'}"></div>
    <div class="hintline">${tagMode==='C'?'Press Enter to add, or click a suggestion below.':'Press Enter after each label.'}</div>
    ${sug}`;
}
function openDialog(i){
  editIdx=i; const it=items[i]; draft=[...it.tags];
  dialog.innerHTML=`<h3>Edit this link</h3><div class="did">${host(it.url)}</div>
    <label class="f">Name</label><input class="f" id="d-title" value="${esc(it.title)}">
    <label class="f">Description</label><textarea class="f" id="d-desc">${esc(it.desc)}</textarea>
    <label class="f">My note (why I saved this)</label><textarea class="f" id="d-note" placeholder="A line to your future self…">${esc(it.note)}</textarea>
    <label class="f">Web address</label><input class="f" id="d-url" value="${esc(it.url)}">
    <div id="tagwrap">${tagSection()}</div>
    <div class="row"><button class="save" id="d-save">Save</button><button class="cancel" id="d-cancel">Cancel</button></div>`;
  backdrop.classList.add('show');
  wireTagEntry();
}
function refreshTags(){ document.getElementById('tagwrap').innerHTML=tagSection(); wireTagEntry(); const ti=document.getElementById('taginput'); if(ti) ti.focus(); }
function addTag(t){ t=t.trim().toLowerCase(); if(t && !draft.includes(t)){ draft.push(t); } }
function wireTagEntry(){
  const inp=document.getElementById('taginput');
  if(inp){
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(inp.value.trim()){ addTag(inp.value); refreshTags(); } }});
    if(tagMode==='C'){ inp.addEventListener('input',drawSuggest); drawSuggest(); }
  }
  document.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click',()=>{ draft.splice(+b.dataset.del,1); refreshTags(); }));
}
function drawSuggest(){
  const box=document.getElementById('suggest'); if(!box) return;
  const q=(document.getElementById('taginput').value||'').trim().toLowerCase();
  const pool=allTags().filter(t=>!draft.includes(t) && (!q||t.includes(q)));
  let html=pool.map(t=>`<button data-add="${t}">${t}</button>`).join('');
  if(q && !allTags().includes(q) && !draft.includes(q)) html+=`<button class="new" data-add="${q}">+ create "${q}"</button>`;
  box.innerHTML=html || `<span class="hintline">No matching labels yet — type to create one.</span>`;
  box.querySelectorAll('[data-add]').forEach(b=> b.addEventListener('click',()=>{ addTag(b.dataset.add); refreshTags(); }));
}
list.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]'), op=e.target.closest('[data-open]');
  if(ed){ e.stopPropagation(); openDialog(+ed.dataset.edit); return; }
  if(op){ window.open(full(items[+op.dataset.open].url),'_blank'); }
});
dialog.addEventListener('click',e=>{
  if(e.target.id==='d-cancel'){ backdrop.classList.remove('show'); return; }
  if(e.target.id==='d-save'){
    const it=items[editIdx];
    it.title=document.getElementById('d-title').value;
    it.desc=document.getElementById('d-desc').value;
    it.note=document.getElementById('d-note').value.trim();
    it.url=document.getElementById('d-url').value.trim();
    if(tagMode==='B'){ it.tags=document.getElementById('tagtext').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).filter((v,k,a)=>a.indexOf(v)===k); }
    else { const inp=document.getElementById('taginput'); if(inp&&inp.value.trim()) addTag(inp.value); it.tags=[...draft]; }
    backdrop.classList.remove('show'); render();
  }
});
document.querySelector('.switch').addEventListener('click',e=>{
  const b=e.target.closest('button[data-m]'); if(!b) return;
  tagMode=b.dataset.m; backdrop.classList.remove('show');
  document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.classList.remove('show'); });
render();
</script>
</body>
</html>
