<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 19 (note formatting)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --amber:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:#f7f7f8; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:24px 20px 60px; }

  li.card { list-style:none; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; position:relative; }
  .editbtn { position:absolute; top:12px; right:12px; background:#f3f4f6; border:1px solid var(--line); border-radius:7px; font-size:12px; padding:5px 10px; cursor:pointer; }
  .title { font-size:15px; font-weight:600; margin:0; padding-right:60px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; }
  .note { color:#6d5100; background:#fffbeb; border:1px solid #fde68a; border-radius:7px; font-size:13px; margin:9px 0 0; padding:8px 11px; line-height:1.5; }
  .note .lbl { font-weight:600; display:block; margin-bottom:3px; }
  .note ul { margin:4px 0 0; padding-left:20px; } .note li { margin:2px 0; }
  .note p { margin:0 0 6px; } .note p:last-child { margin:0; }
  .url { color:var(--muted); font-size:12px; margin-top:9px; }

  .backdrop { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; padding:20px; }
  .backdrop.show { display:flex; }
  .dialog { background:#fff; border-radius:12px; padding:20px 22px; width:460px; max-width:94vw; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .dialog h3 { margin:0 0 10px; font-size:16px; }
  label.f { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 0 4px; }
  .noteToolbar { display:flex; gap:6px; margin-bottom:6px; }
  .noteToolbar button { border:1px solid var(--line); background:#fff; border-radius:6px; width:32px; height:30px; cursor:pointer; font-size:13px; }
  .noteToolbar button:hover { background:#f3f4f6; }
  .noteToolbar .bb { font-weight:800; }
  .editor { min-height:80px; border:1px solid #c7d2fe; border-radius:8px; padding:9px 11px; font-size:14px; line-height:1.5; outline:none; }
  .editor:empty:before { content:attr(data-ph); color:#9ca3af; }
  .editor ul { margin:4px 0; padding-left:22px; }
  .hintline { font-size:11px; color:var(--muted); margin-top:6px; }
  .row { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
  .row button { border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; } .ghost { background:#f3f4f6; color:#374151; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <ul style="margin:0;padding:0"><li class="card" id="card"></li></ul>
</main>
<div class="backdrop" id="backdrop"><div class="dialog" id="dialog"></div></div>

<script>
let item={ title:"Designing the Stripe Payments API", desc:"Idempotency and versioning at scale.",
  url:"stripe.com/blog/payment-api",
  note:"<p>Read before the API review.</p><ul><li>Skim the <b>idempotency</b> section</li><li>Note the versioning approach</li></ul>" };

const card=document.getElementById('card'), backdrop=document.getElementById('backdrop'), dialog=document.getElementById('dialog');
function renderCard(){
  card.innerHTML=`<button class="editbtn" id="edit">✎ Edit</button>
    <p class="title">${item.title}</p><p class="desc">${item.desc}</p>
    ${item.note?`<div class="note"><span class="lbl">Note to self</span>${item.note}</div>`:''}
    <div class="url">${item.url}</div>`;
  document.getElementById('edit').addEventListener('click',openEditor);
}
function openEditor(){
  dialog.innerHTML=`<h3>Edit this link</h3>
    <label class="f">Description</label>
    <div style="font-size:13px;color:#6b7280">${item.desc} <span style="font-size:11px">(the page's own — plain)</span></div>
    <label class="f">My note (why I saved this)</label>
    <div class="noteToolbar">
      <button class="bb" data-cmd="bold" title="Bold (make a word stand out)">B</button>
      <button data-cmd="insertUnorderedList" title="Bulleted list">•—</button>
    </div>
    <div class="editor" id="editor" contenteditable="true" data-ph="A line — or a little list — to your future self…">${item.note||''}</div>
    <div class="hintline">Keep it quick: <b>bold</b> a word, or add a bullet or two. Nothing fancier — it's a sticky note, not an essay.</div>
    <div class="row"><button class="ghost" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>`;
  const ed=document.getElementById('editor');
  dialog.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('mousedown',e=>{ e.preventDefault();
    ed.focus(); document.execCommand(b.dataset.cmd,false,null); }));
  document.getElementById('cancel').addEventListener('click',()=>backdrop.classList.remove('show'));
  document.getElementById('save').addEventListener('click',()=>{
    item.note=ed.innerHTML.trim(); backdrop.classList.remove('show'); renderCard(); });
  backdrop.classList.add('show'); ed.focus();
}
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.classList.remove('show'); });
renderCard();
</script>
</body>
</html>
