<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🔖 Bookmarks</h1>
    <div class="search">
      <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" />
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <button id="new-btn" class="btn primary block">+ New bookmark</button>
      <h2>Tags</h2>
      <ul id="tag-list" class="tag-list">
        <li><button class="tag-filter active" data-tag="">All</button></li>
      </ul>
    </aside>

    <section class="content">
      <div id="empty" class="empty hidden">No bookmarks yet. Add your first one!</div>
      <ul id="bookmark-list" class="bookmark-list"></ul>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modal-title">New bookmark</h2>
      <form id="form">
        <input type="hidden" id="edit-id" />
        <label>URL *
          <input id="f-url" type="text" required placeholder="https://example.com" />
        </label>
        <label>Title
          <input id="f-title" type="text" placeholder="Optional — defaults to URL" />
        </label>
        <label>Description
          <textarea id="f-description" rows="3" placeholder="Optional notes"></textarea>
        </label>
        <label>Tags
          <input id="f-tags" type="text" placeholder="comma, separated, tags" />
        </label>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
