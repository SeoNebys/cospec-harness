<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>🔖 Bookmarks</h1>
      <p class="subtitle">Save and manage your links</p>
    </header>

    <main>
      <section class="panel form-panel">
        <h2 id="form-title">Add bookmark</h2>
        <form id="bookmark-form">
          <input type="hidden" id="edit-id" />
          <label>
            URL
            <input type="text" id="url" placeholder="example.com" required />
          </label>
          <label>
            Title
            <input type="text" id="title" placeholder="Optional title" />
          </label>
          <label>
            Description
            <textarea id="description" rows="2" placeholder="Optional notes"></textarea>
          </label>
          <label>
            Tags
            <input type="text" id="tags" placeholder="comma, separated, tags" />
          </label>
          <div class="form-actions">
            <button type="submit" id="submit-btn">Save</button>
            <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="list-header">
          <input type="search" id="search" placeholder="Search bookmarks..." />
          <span id="count" class="count"></span>
        </div>
        <div id="tag-filters" class="tag-filters"></div>
        <ul id="bookmark-list" class="bookmark-list"></ul>
        <p id="empty" class="empty" hidden>No bookmarks yet. Add your first one!</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
