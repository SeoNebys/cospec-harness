<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keep — Labels</title><style>
:root{--ink:#14251d;--muted:#68736e;--line:#dfe6e2;--brand:#176b4b;--pale:#e5f4ec}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#f2f5f2}button,input{font:inherit}.shell{max-width:1040px;min-height:100vh;margin:auto;background:#fbfcfa;border-inline:1px solid #e8ece9}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:760}.mark{width:32px;height:32px;display:grid;place-items:center;color:white;background:var(--brand);border-radius:10px 10px 10px 3px}main{max-width:780px;margin:auto;padding:60px 28px}h1{margin:0;font-size:31px;letter-spacing:-.04em}.lead{margin:7px 0 25px;color:var(--muted)}.card{position:relative;display:grid;grid-template-columns:110px 1fr auto;gap:18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:white}.thumb{min-height:105px;border-radius:12px;background:linear-gradient(145deg,#d9eadf,#82b49d);display:grid;place-items:center;color:white;font-size:35px}.domain{color:var(--muted);font-size:12px}.title{margin:5px 0 4px;font-size:18px;font-weight:750}.desc{margin:0;color:var(--muted);font-size:14px}.labels{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{padding:4px 9px;border-radius:99px;color:#1b684b;background:var(--pale);font-size:12px;font-weight:650}.more{width:38px;height:38px;border:0;border-radius:9px;background:#eef2ef;font-size:18px;cursor:pointer}.menu{display:none;position:absolute;right:18px;top:58px;width:160px;padding:6px;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #14251d22}.menu button{width:100%;padding:8px;border:0;text-align:left;background:white;cursor:pointer}dialog{width:min(540px,calc(100% - 32px));border:0;border-radius:20px;padding:0;color:var(--ink);box-shadow:0 24px 80px #12281d47}dialog::backdrop{background:#11231a6b}.modal{padding:26px}.modal h2{margin:0;font-size:22px}.sub{margin:6px 0 18px;color:var(--muted)}label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:720}.tagbox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px;border:1px solid #cad6cf;border-radius:10px}.tagbox input{min-width:120px;flex:1;padding:5px;border:0;outline:0}.small-chip{padding:4px 8px;border-radius:99px;background:var(--pale);font-size:12px}.suggestions{display:flex;gap:7px;margin-top:10px}.suggestions button{padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:white;cursor:pointer}.checklist{border:1px solid var(--line);border-radius:10px;overflow:hidden}.search{width:100%;padding:10px;border:0;border-bottom:1px solid var(--line);outline:0}.choice{display:flex;align-items:center;gap:9px;padding:10px 12px}.choice+ .choice{border-top:1px solid #edf0ee}.choice input{accent-color:var(--brand)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.actions button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:680}.secondary{background:#edf1ee}.primary{color:white;background:var(--brand)}
</style></head><body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark">↗</span> Keep</div><span style="color:var(--muted);font-size:13px">1 bookmark</span></header><main><h1>Your bookmarks</h1><p class="lead">Everything you’ve saved, ready when you need it.</p><article class="card"><div class="thumb">✦</div><div><div class="domain">▣ fortelabs.com</div><div class="title">My PARA reference</div><p class="desc">A simple system for organizing digital information.</p><div class="labels" id="cardLabels"><span class="chip">Productivity</span></div></div><button class="more" id="more">•••</button><div class="menu" id="menu"><button id="editLabels">Edit labels</button><button>Edit details</button></div></article></main></div><dialog id="dialog"><div class="modal"><h2>Edit labels</h2><p class="sub">Group this bookmark so it’s easier to find later.</p><div id="chooser"></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save labels</button></div></div></dialog>
<script>
const version=new URLSearchParams(location.search).get('v')||'a',menu=document.querySelector('#menu'),dialog=document.querySelector('#dialog'),chooser=document.querySelector('#chooser');
more.onclick=()=>menu.style.display=menu.style.display==='block'?'none':'block';editLabels.onclick=()=>{menu.style.display='none';dialog.showModal()};cancel.onclick=()=>dialog.close();
if(version==='a')chooser.innerHTML=`<label for="tagInput">Labels</label><div class="tagbox"><span class="small-chip">Productivity ×</span><input id="tagInput" placeholder="Type a label and press Enter"></div><div class="suggestions"><button data-tag="Research">+ Research</button><button data-tag="Reading">+ Reading</button></div>`;
if(version==='b')chooser.innerHTML=`<label for="findLabel">Choose labels</label><div class="checklist"><input class="search" id="findLabel" placeholder="Find or create a label…"><label class="choice"><input type="checkbox" value="Productivity" checked> Productivity</label><label class="choice"><input type="checkbox" value="Research"> Research</label><label class="choice"><input type="checkbox" value="Reading"> Reading</label></div>`;
let added=[];if(version==='a'){chooser.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{added=[b.dataset.tag];b.style.background='#e5f4ec'});tagInput.oninput=e=>chooser.querySelectorAll('[data-tag]').forEach(b=>b.style.display=b.dataset.tag.toLowerCase().includes(e.target.value.toLowerCase())?'':'none');tagInput.onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){e.preventDefault();const match=[...chooser.querySelectorAll('[data-tag]')].find(b=>b.dataset.tag.toLowerCase()===e.target.value.trim().toLowerCase());added=[match?match.dataset.tag:e.target.value.trim()];e.target.value=''}}}
if(version==='b'){findLabel.oninput=e=>chooser.querySelectorAll('.choice').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')}
save.onclick=()=>{let labels=['Productivity'];if(version==='a')labels.push(...added);else labels=[...chooser.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);cardLabels.innerHTML=labels.map(x=>`<span class="chip">${x}</span>`).join('');dialog.close()};
</script></body></html>
