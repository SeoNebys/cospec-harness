<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keepwell — Empty read-later state</title><style>
  :root{--ink:#1d2722;--muted:#647069;--line:#dce2dd;--paper:#fffef9;--wash:#f2f3ec;--green:#245f49;--dark:#194735;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--wash);color:var(--ink)}button{font:inherit;cursor:pointer}.shell{min-height:100vh}header{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--paper)}.brand{display:flex;align-items:center;gap:10px;font-weight:780;font-size:20px}.mark{width:28px;height:34px;border-radius:4px 4px 10px 10px;background:var(--green)}.profile{width:34px;height:34px;border:0;border-radius:50%;background:#dce9e1;color:var(--dark);font-weight:750}main{width:min(1000px,92vw);margin:0 auto;padding:38px 0 70px}.layout{display:grid;grid-template-columns:190px 1fr;gap:34px}.nav{display:grid;align-content:start;gap:7px}.nav button{display:flex;justify-content:space-between;width:100%;border:0;border-radius:10px;background:transparent;padding:11px 12px;color:var(--muted)}.nav button.active{background:#dfe9e2;color:var(--dark);font-weight:750}.count{min-width:24px;border-radius:999px;padding:2px 7px;background:rgba(36,95,73,.12);font-size:12px}.content h1{margin:0;font:500 clamp(34px,5vw,48px)/1 Georgia,serif}.subtitle{margin:8px 0 24px;color:var(--muted)}.card{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:14px}.icon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:#e7eee9;color:var(--dark);font:700 20px Georgia,serif}.card h2{margin:0 0 5px;font-size:18px}.card p{margin:0;color:var(--muted)}.done{border:1px solid #bfcac2;border-radius:9px;background:white;color:var(--dark);padding:9px 12px;font-weight:700}.notice{margin-bottom:14px;padding:12px 14px;border-radius:10px;background:#e4f1e8;color:var(--dark);font-weight:680}.empty{padding:55px 28px;text-align:center;border:1px dashed #bdc8c0;border-radius:15px;background:var(--paper)}.empty .symbol{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:#e7eee9;color:var(--green);display:grid;place-items:center;font-size:29px}.empty h2{margin:0 0 7px;font:500 26px Georgia,serif}.empty p{margin:0 0 19px;color:var(--muted)}.primary{border:0;border-radius:9px;background:var(--green);color:white;padding:10px 14px;font-weight:700}[hidden]{display:none!important}@media(max-width:700px){header{padding:0 18px}main{width:calc(100vw - 28px)}.layout{grid-template-columns:1fr;gap:18px}.nav{grid-template-columns:1fr 1fr}.card{grid-template-columns:42px 1fr}.card .done{grid-column:2;justify-self:start}}
</style></head><body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark"></span>Keepwell</div><button class="profile" aria-label="Profile">AM</button></header><main><div class="layout"><nav class="nav"><button id="libraryNav">Library <span class="count">4</span></button><button class="active">Read later <span class="count" id="count">1</span></button></nav><section class="content"><div class="notice" id="notice" hidden>Marked as read. The bookmark is still in your library.</div><h1>Read later</h1><p class="subtitle">A focused pile for when you have time.</p><article class="card" id="card"><div class="icon">H</div><div><h2>How ancient cities managed water</h2><p>Aqueducts, fountains, and daily life in Rome.</p></div><button class="done" id="done">Mark read</button></article><section class="empty" id="empty" hidden><div class="symbol">✓</div><h2>You’re all caught up</h2><p>Your bookmarks are safe in the library whenever you need them.</p><button class="primary" id="browse">Browse library</button></section></section></div></main></div><script>
  document.querySelector('#done').addEventListener('click',()=>{document.querySelector('#card').hidden=true;document.querySelector('#count').textContent='0';document.querySelector('#notice').hidden=false;document.querySelector('#empty').hidden=false});document.querySelector('#browse').addEventListener('click',()=>{document.querySelector('#libraryNav').classList.add('active');document.querySelector('.content h1').textContent='Your library';document.querySelector('.subtitle').textContent='Everything you’ve saved remains here.';document.querySelector('#empty').innerHTML='<div class="symbol">4</div><h2>Your library is ready</h2><p>Four saved bookmarks, including the item you just read.</p>'});
</script></body></html>
