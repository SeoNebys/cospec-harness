<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tagging — A: while saving</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; background:#f4f5f7; color:#1a1a1a; }
  .bar { background:#111827; color:#fff; font-size:13px; padding:6px 16px; text-align:center; }
  .wrap { max-width:640px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .savebox { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; margin-bottom:24px; }
  .savebox input.url { width:100%; border:1px solid #d1d5db; border-radius:8px; padding:10px 12px; font-size:15px; margin-bottom:8px; }
  .tagfield { border:1px solid #d1d5db; border-radius:8px; padding:6px 8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; position:relative; }
  .tagfield input { border:0; outline:0; flex:1; min-width:120px; font-size:14px; padding:4px; }
  .chip { background:#eef2ff; color:#4338ca; border:1px solid #dbe1ff; border-radius:20px; font-size:12.5px; padding:2px 8px; display:inline-flex; gap:5px; align-items:center; }
  .chip b { cursor:pointer; color:#818cf8; font-weight:700; }
  .savebtn { border:0; background:#2563eb; color:#fff; font-size:15px; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; margin-top:10px; }
  .sugg { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #e5e7eb; border-radius:8px; margin-top:4px; box-shadow:0 6px 20px rgba(0,0,0,.08); z-index:5; overflow:hidden; }
  .sugg div { padding:8px 12px; font-size:14px; cursor:pointer; }
  .sugg div:hover, .sugg div.hl { background:#eef2ff; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:13px 15px; margin-bottom:10px; }
  .title { font-size:15px; font-weight:600; margin:0 0 2px; }
  .url { font-size:12.5px; color:#6b7280; margin:0 0 6px; }
  .rowchips .chip { margin-right:5px; }
</style>
</head>
<body>
<div class="bar">VERSION A — add tags WHILE saving (before you hit Save)</div>
<div class="wrap">
  <h1>Save a link</h1>
  <div class="savebox">
    <input class="url" id="url" placeholder="Paste a link…" />
    <div class="tagfield" id="tagfield">
      <span id="chips"></span>
      <input id="taginput" placeholder="Add tags…" autocomplete="off" />
      <div class="sugg" id="sugg" style="display:none"></div>
    </div>
    <button class="savebtn" id="save">Save</button>
  </div>
  <ul id="list"></ul>
</div>
<script>
  const KNOWN = ['Travel','Japan','Tech','AI','Web Dev','Cooking','Gadgets','Reviews'];
  let pending = [];
  const items = [];
  const chipsEl = document.getElementById('chips');
  const taginput = document.getElementById('taginput');
  const sugg = document.getElementById('sugg');
  const listEl = document.getElementById('list');
  let hl = -1;

  function renderChips() {
    chipsEl.innerHTML = pending.map((t,i)=>'<span class="chip">'+t+' <b data-i="'+i+'">×</b></span>').join('');
    chipsEl.querySelectorAll('b').forEach(b=>b.onclick=()=>{ pending.splice(+b.dataset.i,1); renderChips(); });
  }
  function addTag(t){ t=t.trim(); if(t && !pending.includes(t)) pending.push(t); taginput.value=''; renderChips(); renderSugg(); }
  function renderSugg(){
    const q=taginput.value.trim().toLowerCase();
    const m=KNOWN.filter(t=>t.toLowerCase().includes(q) && !pending.includes(t));
    if(!q || !m.length){ sugg.style.display='none'; return; }
    sugg.innerHTML=m.map((t,i)=>'<div class="'+(i===hl?'hl':'')+'" data-t="'+t+'">'+t+'</div>').join('');
    sugg.style.display='block';
    sugg.querySelectorAll('div').forEach(d=>d.onclick=()=>addTag(d.dataset.t));
  }
  taginput.addEventListener('input',()=>{hl=-1;renderSugg();});
  taginput.addEventListener('keydown',e=>{
    const opts=sugg.querySelectorAll('div');
    if(e.key==='ArrowDown'){e.preventDefault();hl=Math.min(hl+1,opts.length-1);renderSugg();}
    else if(e.key==='ArrowUp'){e.preventDefault();hl=Math.max(hl-1,0);renderSugg();}
    else if(e.key==='Enter'||e.key===','){e.preventDefault(); if(hl>=0&&opts[hl])addTag(opts[hl].dataset.t); else addTag(taginput.value);}
    else if(e.key==='Backspace'&&!taginput.value&&pending.length){pending.pop();renderChips();}
  });
  function niceTitle(u){ const b=(u.replace(/^https?:\/\//,'').replace(/^www\./,'').split('.')[0])||u; return b.charAt(0).toUpperCase()+b.slice(1); }
  document.getElementById('save').onclick=()=>{
    const u=document.getElementById('url').value.trim(); if(!u) return;
    items.unshift({title:niceTitle(u),host:u.replace(/^https?:\/\//,''),tags:[...pending]});
    document.getElementById('url').value=''; pending=[]; renderChips(); render();
  };
  function render(){
    listEl.innerHTML=items.map(it=>'<li><p class="title">'+it.title+'</p><p class="url">'+it.host+'</p>'+
      '<div class="rowchips">'+(it.tags.length?it.tags.map(t=>'<span class="chip">'+t+'</span>').join(''):'<span class="url">no tags</span>')+'</div></li>').join('')
      || '<li class="url" style="border:none;background:none">Nothing saved yet.</li>';
  }
  renderChips(); render();
</script>
</body>
</html>
