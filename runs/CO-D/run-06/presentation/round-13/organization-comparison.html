<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuck — Organization comparison</title>
  <style>
    :root { --ink:#18211b; --muted:#69736c; --paper:#f5f2e9; --card:#fffdf8; --line:#dedbd1; --green:#245b46; --mint:#dbe9dd; --soft:#edf1eb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 88% 5%, #cfdeca, transparent 24rem),var(--paper); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; }
    .shell { width:min(1220px,calc(100% - 40px)); margin:0 auto; padding:28px 0 70px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:42px; }
    .brand { display:inline-flex; align-items:center; gap:10px; font-family:Georgia,"Times New Roman",serif; font-size:22px; font-weight:700; }
    .mark { display:grid; place-items:center; width:32px; height:32px; color:white; background:var(--green); border-radius:9px 9px 13px 9px; }
    .label { color:var(--muted); font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
    .intro { max-width:760px; margin:0 auto 28px; text-align:center; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:8px 0 9px; font-family:Georgia,"Times New Roman",serif; font-size:38px; font-weight:500; letter-spacing:-.03em; }
    .intro p { margin:0; color:var(--muted); line-height:1.5; }
    .comparison { display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start; }
    .panel { min-width:0; min-height:590px; padding:22px; background:var(--card); border:1px solid var(--line); border-radius:17px; box-shadow:0 16px 42px rgba(38,51,41,.08); }
    .panel-name { margin-bottom:18px; color:var(--green); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h2 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:24px; font-weight:500; }
    .panel-head { display:flex; align-items:end; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid var(--line); }
    .count { color:var(--muted); font-size:13px; }

    .collections-layout { display:grid; grid-template-columns:124px 1fr; gap:18px; }
    .rail { padding-right:14px; border-right:1px solid var(--line); }
    .rail-title { margin:2px 0 9px; color:var(--muted); font-size:11px; font-weight:750; letter-spacing:.08em; text-transform:uppercase; }
    .rail button { width:100%; margin-bottom:4px; padding:9px 10px; color:var(--ink); background:transparent; border:0; border-radius:8px; text-align:left; cursor:pointer; }
    .rail button.active { color:var(--green); background:var(--mint); font-weight:750; }

    .tagbar { display:flex; gap:7px; margin-bottom:17px; }
    .tagbar button { padding:7px 12px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:999px; cursor:pointer; }
    .tagbar button.active { color:white; background:var(--green); border-color:var(--green); font-weight:700; }

    .bookmark { display:flex; align-items:center; gap:11px; min-height:93px; padding:14px 1px; border-bottom:1px solid var(--line); }
    .bookmark[hidden] { display:none; }
    .favicon { flex:0 0 auto; display:grid; place-items:center; width:38px; height:38px; color:var(--green); background:var(--mint); border-radius:10px; font-family:Georgia,"Times New Roman",serif; font-weight:700; }
    .copy { min-width:0; flex:1; }
    .title { overflow:hidden; display:block; font-weight:720; text-overflow:ellipsis; white-space:nowrap; }
    .description { overflow:hidden; display:block; margin-top:3px; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .badges { display:flex; gap:5px; margin-top:6px; }
    .badge { padding:3px 7px; color:var(--green); background:var(--soft); border-radius:999px; font-size:10px; font-weight:750; }
    .empty { padding:55px 10px; color:var(--muted); text-align:center; }
    .empty[hidden] { display:none; }

    @media(max-width:880px){ .shell{width:min(100% - 24px,1220px)} .comparison{grid-template-columns:1fr} .label{display:none} }
  </style>
</head>
<body>
  <div class="shell" data-harness-ready="true">
    <header><div class="brand"><span class="mark">↘</span> Tuck</div><div class="label">Organization comparison</div></header>
    <div class="intro"><div class="eyebrow">Keeping links organized</div><h1>Find your recipe links in both collections</h1><p>Select “Recipes” in each panel and compare how the two arrangements feel.</p></div>
    <main class="comparison">
      <section class="panel" data-mode="collections">
        <div class="panel-name">Collections</div>
        <div class="collections-layout">
          <nav class="rail" aria-label="Collections">
            <div class="rail-title">My collections</div>
            <button class="active" data-filter="all">All links</button>
            <button data-filter="work">Work</button>
            <button data-filter="recipes">Recipes</button>
            <button data-filter="reading">Reading</button>
          </nav>
          <div><div class="panel-head"><h2>All links</h2><span class="count">5 bookmarks</span></div><div class="items"></div></div>
        </div>
      </section>
      <section class="panel" data-mode="tags">
        <div class="panel-name">Tags</div>
        <div class="tagbar" aria-label="Filter by tag">
          <button class="active" data-filter="all">All</button>
          <button data-filter="work">Work</button>
          <button data-filter="recipes">Recipes</button>
          <button data-filter="reading">Reading</button>
        </div>
        <div class="panel-head"><h2>Saved links</h2><span class="count">5 bookmarks</span></div><div class="items"></div>
      </section>
    </main>
  </div>
  <script>
    const bookmarks = [
      {icon:'S', title:'Serious Eats — Recipes and techniques', description:'Reliable recipes, kitchen techniques, and food guides.', tags:['recipes']},
      {icon:'N', title:'A beginner’s guide to meal prep', description:'A practical weekly cooking and planning guide.', tags:['recipes','reading']},
      {icon:'M', title:'HTML: HyperText Markup Language', description:'A reference for structuring web pages.', tags:['work','reading']},
      {icon:'A', title:'Atlas Obscura', description:'Curious places, hidden histories, and unusual travel stories.', tags:['reading']},
      {icon:'F', title:'Quarterly planning notes', description:'Team goals and project ideas for the next quarter.', tags:['work']}
    ];

    document.querySelectorAll('.panel').forEach((panel) => {
      const items = panel.querySelector('.items');
      bookmarks.forEach((bookmark) => {
        const row = document.createElement('article');
        row.className = 'bookmark';
        row.dataset.tags = bookmark.tags.join(' ');
        const badges = panel.dataset.mode === 'tags' ? `<span class="badges">${bookmark.tags.map(tag => `<span class="badge">${tag}</span>`).join('')}</span>` : '';
        row.innerHTML = `<span class="favicon">${bookmark.icon}</span><span class="copy"><span class="title">${bookmark.title}</span><span class="description">${bookmark.description}</span>${badges}</span>`;
        items.append(row);
      });

      panel.querySelectorAll('button[data-filter]').forEach((button) => {
        button.addEventListener('click', () => {
          panel.querySelectorAll('button[data-filter]').forEach(item => item.classList.remove('active'));
          button.classList.add('active');
          const filter = button.dataset.filter;
          let visible = 0;
          panel.querySelectorAll('.bookmark').forEach((row) => {
            const matches = filter === 'all' || row.dataset.tags.split(' ').includes(filter);
            row.hidden = !matches;
            if (matches) visible += 1;
          });
          panel.querySelector('.count').textContent = `${visible} bookmarks`;
          if (panel.dataset.mode === 'collections') panel.querySelector('h2').textContent = button.textContent;
        });
      });
    });
  </script>
</body>
</html>
