<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <header class="app-header">
      <h1>Bookmarks</h1>
    </header>

    <section class="add-form" aria-label="Add or edit bookmark">
      <form id="bookmark-form" autocomplete="off">
        <input type="hidden" id="edit-id" value="" />
        <div class="field">
          <label for="address">Web address</label>
          <input type="text" id="address" placeholder="https://example.com" required />
        </div>
        <div class="field edit-only">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Title" />
        </div>
        <div class="field edit-only">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Description" />
        </div>
        <div class="field">
          <label for="tags">Tags (comma-separated)</label>
          <input type="text" id="tags" placeholder="news, reading" list="tag-suggestions" />
          <datalist id="tag-suggestions"></datalist>
        </div>
        <p id="form-error" class="error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Save bookmark</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="controls" aria-label="Search and filter">
      <input type="search" id="search" placeholder="Search bookmarks…" />
      <div id="tag-filter" class="tag-filter"></div>
    </section>

    <section class="list-region" aria-label="Saved bookmarks">
      <ul id="bookmark-list" class="bookmark-list"></ul>
      <p id="empty-state" class="empty" hidden></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
