<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --green:#059669; }
  * { box-sizing:border-box; }
  body { width:320px; margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; }
  .top { padding:14px 16px; border-bottom:1px solid var(--line); }
  .top .h { font-size:14px; font-weight:700; }
  .body { padding:14px 16px; }
  .pg-title { font-size:14px; font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
  .pg-host { color:var(--muted); font-size:12px; margin-top:4px; }
  button.save { margin-top:14px; width:100%; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; padding:11px; cursor:pointer; }
  button.save:disabled { opacity:.5; }
  .done { display:none; margin-top:14px; border-radius:8px; padding:12px; font-size:14px; font-weight:700; text-align:center; }
  .done.show { display:block; animation:pop .25s ease; }
  @keyframes pop { from { transform:scale(.96); opacity:0 } to { transform:none; opacity:1 } }
  .done.ok { background:#ecfdf5; color:var(--green); border:1px solid #a7f3d0; }
  .done.dup { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
  .lib { display:block; margin-top:12px; font-size:12px; color:var(--accent); background:none; border:0; cursor:pointer; padding:0; }
</style>
</head>
<body>
  <div class="top"><span class="h">Save to My Links</span></div>
  <div class="body">
    <div class="pg-title" id="t">…</div>
    <div class="pg-host" id="h"></div>
    <button class="save" id="save" disabled>Save this page</button>
    <div class="done" id="done"></div>
    <button class="lib" id="lib">Open my library →</button>
  </div>
<script type="module" src="popup.js"></script>
</body>
</html>
