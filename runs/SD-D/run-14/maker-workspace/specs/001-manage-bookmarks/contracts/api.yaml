openapi: 3.1.0
info:
  title: Bookmark Manager API
  version: 1.0.0
  description: Same-origin JSON API for the approved single-user bookmark manager.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Migrations and worker initialization are complete.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ready }
        '503': { $ref: '#/components/responses/Error' }
  /bookmarks:
    get:
      operationId: listBookmarks
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/FavoriteFilter'
        - $ref: '#/components/parameters/ReadFilter'
        - $ref: '#/components/parameters/ArchiveFilter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current matching page and total count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookmarkPage' }
        '422': { $ref: '#/components/responses/SearchError' }
    post:
      operationId: createBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookmark' }
      responses:
        '202':
          description: Bookmark saved; enrichment/capture queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '409':
          description: Normalized destination already exists.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      existingBookmarkId: { type: string, format: uuid }
        '422': { $ref: '#/components/responses/Error' }
  /bookmarks/{bookmarkId}:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    get:
      operationId: getBookmark
      responses:
        '200':
          description: Bookmark details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookmark' }
      responses:
        '200':
          description: Updated bookmark.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteBookmark
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { const: true }
      responses:
        '204': { description: Bookmark and its snapshot were deleted. }
        '404': { $ref: '#/components/responses/Error' }
  /bookmarks/{bookmarkId}/refresh:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    post:
      operationId: refreshBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replaceUserMetadata]
              properties:
                replaceUserMetadata: { type: boolean }
      responses:
        '202':
          description: Refresh queued; prior snapshot remains available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /bookmarks/{bookmarkId}/snapshot:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    get:
      operationId: getSnapshotMetadata
      responses:
        '200':
          description: Snapshot state and view URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '404': { $ref: '#/components/responses/Error' }
  /assets/{assetId}:
    get:
      operationId: getAsset
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Inert locally stored image with fixed content type, nosniff, and restrictive CSP.
          content:
            image/webp: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/x-icon: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
  /tags:
    get:
      operationId: suggestTags
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Reusable tag suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
  /bulk/preview:
    post:
      operationId: previewBulkAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkRequest' }
      responses:
        '200':
          description: Server-resolved current scope before confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [targetCount, action]
                properties:
                  targetCount: { type: integer, minimum: 0 }
                  action: { $ref: '#/components/schemas/BulkAction' }
        '422': { $ref: '#/components/responses/SearchError' }
  /bulk/execute:
    post:
      operationId: executeBulkAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BulkRequest'
                - type: object
                  required: [confirmedTargetCount]
                  properties:
                    confirmedTargetCount: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Bulk-action outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '409':
          description: Matching target count changed; preview again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/SearchError' }
  /saved-views:
    get:
      operationId: listSavedViews
      responses:
        '200':
          description: Saved view definitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedView' }
    post:
      operationId: createSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewInput' }
      responses:
        '201':
          description: Saved view created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/SearchError' }
  /saved-views/{savedViewId}:
    parameters:
      - name: savedViewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewInput' }
      responses:
        '200':
          description: Updated definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/SearchError' }
    delete:
      operationId: deleteSavedView
      responses:
        '204': { description: Saved view deleted; bookmarks unchanged. }
        '404': { $ref: '#/components/responses/Error' }
  /preferences:
    get:
      operationId: getPreferences
      responses:
        '200':
          description: Current display preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
    patch:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Persisted display preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
components:
  parameters:
    BookmarkId:
      name: bookmarkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Query:
      name: q
      in: query
      schema: { type: string, maxLength: 2000, default: '' }
    TagFilter:
      name: tag
      in: query
      schema:
        type: array
        items: { type: string, maxLength: 80 }
    FavoriteFilter:
      name: favorite
      in: query
      schema: { type: boolean }
    ReadFilter:
      name: readState
      in: query
      schema: { type: string, enum: [read, unread] }
    ArchiveFilter:
      name: archiveState
      in: query
      schema: { type: string, enum: [active, archived, all], default: active }
    Sort:
      name: sort
      in: query
      schema: { $ref: '#/components/schemas/SortField' }
    Direction:
      name: direction
      in: query
      schema: { $ref: '#/components/schemas/SortDirection' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Error:
      description: Request could not be completed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SearchError:
      description: Search expression or another field is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            position: { type: integer, minimum: 0 }
            length: { type: integer, minimum: 0 }
    Tag:
      type: object
      required: [id, name, usageCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        usageCount: { type: integer, minimum: 0 }
    Snapshot:
      type: object
      required: [status, available]
      properties:
        status: { type: string, enum: [pending, complete, partial, failed] }
        available: { type: boolean }
        assetUrl: { type: [string, 'null'] }
        capturedAt: { type: [string, 'null'], format: date-time }
        capturedUrl: { type: [string, 'null'], format: uri }
        limitationCode: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        refreshStatus: { type: [string, 'null'], enum: [pending, failed, null] }
    Bookmark:
      type: object
      required: [id, url, title, tags, isFavorite, readState, archiveState, metadataStatus, snapshot, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        title: { type: string }
        description: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        faviconUrl: { type: [string, 'null'] }
        previewUrl: { type: [string, 'null'] }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        isFavorite: { type: boolean }
        readState: { type: string, enum: [read, unread] }
        archiveState: { type: string, enum: [active, archived] }
        metadataStatus: { type: string, enum: [pending, complete, partial, failed] }
        metadataErrorCode: { type: [string, 'null'] }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateBookmark:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 4096 }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 20000 }
        tags:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 80 }
        isFavorite: { type: boolean, default: false }
        readState: { type: string, enum: [read, unread], default: read }
    UpdateBookmark:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 4096 }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 2000 }
        notes: { type: [string, 'null'], maxLength: 20000 }
        tags:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 80 }
        isFavorite: { type: boolean }
        readState: { type: string, enum: [read, unread] }
        archiveState: { type: string, enum: [active, archived] }
        faviconAssetId: { type: [string, 'null'], format: uuid }
        previewAssetId: { type: [string, 'null'], format: uuid }
    BookmarkPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Bookmark' }
        total: { type: integer, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
    SortField:
      type: string
      enum: [createdAt, updatedAt, title, destination]
      default: createdAt
    SortDirection:
      type: string
      enum: [asc, desc]
      default: desc
    Filters:
      type: object
      additionalProperties: false
      properties:
        tags:
          type: array
          items: { type: string, maxLength: 80 }
        favorite: { type: [boolean, 'null'] }
        readState: { type: [string, 'null'], enum: [read, unread, null] }
        archiveState: { type: string, enum: [active, archived, all], default: active }
    ResultSelector:
      oneOf:
        - type: object
          required: [mode, ids]
          properties:
            mode: { const: explicit }
            ids:
              type: array
              minItems: 1
              maxItems: 10000
              uniqueItems: true
              items: { type: string, format: uuid }
        - type: object
          required: [mode, query, filters, excludedIds]
          properties:
            mode: { const: allResults }
            query: { type: string, maxLength: 2000 }
            filters: { $ref: '#/components/schemas/Filters' }
            excludedIds:
              type: array
              maxItems: 10000
              uniqueItems: true
              items: { type: string, format: uuid }
    BulkAction:
      oneOf:
        - type: object
          required: [type, tag]
          properties:
            type: { const: addTag }
            tag: { type: string, minLength: 1, maxLength: 80 }
        - type: object
          required: [type]
          properties:
            type: { const: archive }
        - type: object
          required: [type]
          properties:
            type: { const: delete }
    BulkRequest:
      type: object
      required: [selector, action]
      properties:
        selector: { $ref: '#/components/schemas/ResultSelector' }
        action: { $ref: '#/components/schemas/BulkAction' }
    BulkResult:
      type: object
      required: [targetCount, affectedCount, failed]
      properties:
        targetCount: { type: integer, minimum: 0 }
        affectedCount: { type: integer, minimum: 0 }
        failed:
          type: array
          items:
            type: object
            required: [bookmarkId, code]
            properties:
              bookmarkId: { type: string, format: uuid }
              code: { type: string }
    SavedViewInput:
      type: object
      required: [name, query, filters, sort, direction]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        query: { type: string, maxLength: 2000 }
        filters: { $ref: '#/components/schemas/Filters' }
        sort: { $ref: '#/components/schemas/SortField' }
        direction: { $ref: '#/components/schemas/SortDirection' }
    SavedView:
      allOf:
        - $ref: '#/components/schemas/SavedViewInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Preferences:
      type: object
      required: [theme, density]
      additionalProperties: false
      properties:
        theme: { type: string, enum: [system, light, dark] }
        density: { type: string, enum: [comfortable, compact] }
