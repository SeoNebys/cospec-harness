openapi: 3.1.0
info:
  title: Bookmark Manager API
  version: 1.0.0
  description: Same-origin private API for the approved bookmark manager.
servers:
  - url: /api
security:
  - ownerSession: []
tags:
  - name: Session
    description: Single-owner login and revocable session lifecycle.
  - name: Metadata
    description: Safe, reviewable page metadata proposals.
  - name: Bookmarks
    description: Bookmark collection, detail, and bulk operations.
  - name: Tags
    description: Tags currently attached to bookmarks.
  - name: Imports
    description: Browser bookmark HTML preview and confirmation.
  - name: Exports
    description: Full browser-compatible bookmark export.
  - name: Icons
    description: Authenticated locally stored icon assets.

paths:
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Get the current owner session
      responses:
        "200":
          description: Current authenticated session and mutation token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Session]
      operationId: createSession
      summary: Sign in as the configured owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        "201":
          description: Session created; opaque token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Session]
      operationId: deleteSession
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /metadata/preview:
    post:
      tags: [Metadata]
      operationId: previewMetadata
      summary: Retrieve a safe metadata proposal for an address
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, requestId]
              properties:
                url:
                  $ref: "#/components/schemas/HttpUrl"
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 100
                bypassCache:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Complete, partial, failed, or safely blocked metadata proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Exact address already exists; no duplicate or enrichment is created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    required: [existingBookmark]
                    properties:
                      existingBookmark:
                        $ref: "#/components/schemas/BookmarkSummary"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /bookmarks:
    get:
      tags: [Bookmarks]
      operationId: listBookmarks
      summary: List a searched and filtered bookmark collection
      parameters:
        - $ref: "#/components/parameters/Collection"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A stable page of the requested collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkPage"
        "400":
          description: Invalid filters or structured query, including an error source span.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryError"
    post:
      tags: [Bookmarks]
      operationId: createBookmark
      summary: Create a bookmark from accepted values
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkCreate"
      responses:
        "201":
          description: Bookmark created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Duplicate"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /bookmarks/{bookmarkId}:
    parameters:
      - $ref: "#/components/parameters/BookmarkId"
    get:
      tags: [Bookmarks]
      operationId: getBookmark
      summary: Get bookmark detail
      responses:
        "200":
          description: Bookmark detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Bookmarks]
      operationId: updateBookmark
      summary: Update accepted bookmark fields or status
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkUpdate"
      responses:
        "200":
          description: Bookmark updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Duplicate"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Bookmarks]
      operationId: deleteBookmark
      summary: Permanently delete one confirmed bookmark
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: confirm
          in: query
          required: true
          schema:
            const: permanent
      responses:
        "204":
          description: Bookmark permanently deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /bookmarks/{bookmarkId}/metadata-preview:
    parameters:
      - $ref: "#/components/parameters/BookmarkId"
    post:
      tags: [Metadata]
      operationId: previewBookmarkMetadataRefresh
      summary: Preview refreshed metadata without applying it
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Field-level proposal; no bookmark field has changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataProposal"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookmarks/bulk:
    post:
      tags: [Bookmarks]
      operationId: bulkUpdateBookmarks
      summary: Apply one action to a resolved bookmark selection
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRequest"
      responses:
        "200":
          description: Bulk operation result.
          content:
            application/json:
              schema:
                type: object
                required: [matchedCount, changedCount, unchangedCount]
                properties:
                  matchedCount: { type: integer, minimum: 0 }
                  changedCount: { type: integer, minimum: 0 }
                  unchangedCount: { type: integer, minimum: 0 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags for a collection
      parameters:
        - $ref: "#/components/parameters/Collection"
      responses:
        "200":
          description: Tags currently attached in the requested collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /imports/preview:
    post:
      tags: [Imports]
      operationId: previewImport
      summary: Parse and stage a bookmark HTML preview
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: X-Import-Filename
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          text/html:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Durable import preview; collection remains unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [Imports]
      operationId: getImport
      summary: Get an import preview or committed result
      responses:
        "200":
          description: Preview or committed import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Imports]
      operationId: cancelImport
      summary: Cancel an uncommitted import preview
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Uncommitted preview cancelled; library unchanged.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already committed or otherwise terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /imports/{importId}/commit:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [Imports]
      operationId: commitImport
      summary: Confirm and atomically apply an import
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Idempotent committed result, including confirmation-time duplicate changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Preview expired or cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /exports/bookmarks.html:
    get:
      tags: [Exports]
      operationId: exportBookmarks
      summary: Export the full collection as bookmark HTML
      responses:
        "200":
          description: Full active and archived collection, each bookmark exactly once.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /icons/{hash}:
    get:
      tags: [Icons]
      operationId: getIcon
      summary: Get a normalized local bookmark icon
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: Authenticated normalized local icon.
          headers:
            X-Content-Type-Options:
              schema:
                const: nosniff
          content:
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: bookmark_session

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    BookmarkId:
      name: bookmarkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Collection:
      name: collection
      in: query
      required: false
      schema:
        type: string
        enum: [active, unread, archive]
        default: active
    Query:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 1000
    TagFilter:
      name: tag
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [updated_desc, title_asc, title_desc]
        default: updated_desc
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid owner session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Origin or CSRF validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Duplicate:
      description: Exact address already exists in active or archived bookmarks.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  existingBookmark:
                    $ref: "#/components/schemas/BookmarkSummary"
    Unprocessable:
      description: Validly encoded request violates field, state, or safety rules.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Upload or body exceeds the documented limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many login or resource-intensive requests.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    HttpUrl:
      type: string
      format: uri
      maxLength: 8192
      pattern: "^https?://"

    Session:
      type: object
      additionalProperties: false
      required: [authenticated, csrfToken, idleExpiresAt, absoluteExpiresAt]
      properties:
        authenticated: { const: true }
        csrfToken: { type: string }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    QueryError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [span]
          properties:
            span:
              type: object
              required: [start, end]
              properties:
                start: { type: integer, minimum: 0 }
                end: { type: integer, minimum: 0 }

    Tag:
      type: object
      additionalProperties: false
      required: [id, name, bookmarkCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        bookmarkCount: { type: integer, minimum: 1 }

    BookmarkSummary:
      type: object
      required: [id, url, displayLabel, tags, isRead, isArchived, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        url: { $ref: "#/components/schemas/HttpUrl" }
        displayLabel: { type: string }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        iconUrl: { type: [string, "null"] }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        isRead: { type: boolean }
        isArchived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Bookmark:
      allOf:
        - $ref: "#/components/schemas/BookmarkSummary"
        - type: object
          required: [noteMarkdown, metadataStatus]
          properties:
            noteMarkdown: { type: string, maxLength: 50000 }
            metadataStatus:
              type: string
              enum: [idle, pending, complete, partial, failed, blocked]
            metadataFetchedAt: { type: [string, "null"], format: date-time }
            metadataErrorCode: { type: [string, "null"] }
            archivedAt: { type: [string, "null"], format: date-time }

    BookmarkWriteFields:
      type: object
      properties:
        url: { $ref: "#/components/schemas/HttpUrl" }
        title: { type: [string, "null"], maxLength: 300 }
        description: { type: [string, "null"], maxLength: 2000 }
        noteMarkdown: { type: string, maxLength: 50000 }
        tags:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }
        isRead: { type: boolean }
        iconAssetToken: { type: [string, "null"], maxLength: 512 }
        removeIcon: { type: boolean }

    BookmarkCreate:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/BookmarkWriteFields"
        - type: object
          required: [url]

    BookmarkUpdate:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/BookmarkWriteFields"
        - type: object
          minProperties: 1
          properties:
            archived:
              type: boolean

    MetadataValue:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: [string, "null"] }
        source: { type: [string, "null"] }

    MetadataProposal:
      type: object
      additionalProperties: false
      required: [requestId, outcome, url, title, description, warnings, fetchedAt]
      properties:
        requestId: { type: string }
        outcome:
          type: string
          enum: [complete, partial, failed, blocked]
        url: { $ref: "#/components/schemas/HttpUrl" }
        title: { $ref: "#/components/schemas/MetadataValue" }
        description: { $ref: "#/components/schemas/MetadataValue" }
        icon:
          type: [object, "null"]
          required: [assetToken, previewUrl, source]
          properties:
            assetToken: { type: string }
            previewUrl: { type: string }
            source: { type: string }
        warnings:
          type: array
          items: { type: string }
        fetchedAt: { type: string, format: date-time }

    BookmarkPage:
      type: object
      additionalProperties: false
      required: [items, total, nextCursor, queryFingerprint]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BookmarkSummary" }
        total: { type: integer, minimum: 0 }
        nextCursor: { type: [string, "null"] }
        queryFingerprint: { type: string }

    Selection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, ids]
          properties:
            mode: { const: ids }
            ids:
              type: array
              minItems: 1
              maxItems: 10000
              uniqueItems: true
              items: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [mode, collection, queryFingerprint]
          properties:
            mode: { const: query }
            collection: { type: string, enum: [active, unread, archive] }
            q: { type: string, maxLength: 1000, default: "" }
            tag: { type: [string, "null"], maxLength: 100 }
            sort: { type: string, enum: [updated_desc, title_asc, title_desc] }
            queryFingerprint: { type: string }
            excludedIds:
              type: array
              maxItems: 10000
              uniqueItems: true
              items: { type: string, format: uuid }

    BulkRequest:
      type: object
      additionalProperties: false
      required: [selection, action]
      properties:
        selection: { $ref: "#/components/schemas/Selection" }
        action:
          type: string
          enum: [add_tags, remove_tags, mark_read, mark_unread, archive, restore, delete]
        tags:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }
        confirmPermanentDelete:
          type: boolean
          default: false

    ImportIssue:
      type: object
      additionalProperties: false
      required: [ordinal, classification, reasonCode]
      properties:
        ordinal: { type: integer, minimum: 0 }
        classification: { type: string, enum: [duplicate, invalid] }
        reasonCode: { type: string }
        displayLabel: { type: [string, "null"] }
        existingBookmarkId: { type: [string, "null"], format: uuid }

    ImportBatch:
      type: object
      additionalProperties: false
      required: [id, status, newCount, duplicateCount, invalidCount, issues, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [previewed, committing, committed, cancelled, expired] }
        newCount: { type: integer, minimum: 0 }
        duplicateCount: { type: integer, minimum: 0 }
        invalidCount: { type: integer, minimum: 0 }
        issues:
          type: array
          maxItems: 200
          description: Bounded details; aggregate counts remain authoritative.
          items: { $ref: "#/components/schemas/ImportIssue" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        committedAt: { type: [string, "null"], format: date-time }
