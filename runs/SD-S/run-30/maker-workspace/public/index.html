<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Bookmark Manager</h1>
    </header>

    <main class="layout" id="app">
      <!-- Add bookmark -->
      <section class="panel add-panel" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a bookmark</h2>
        <form id="add-form" autocomplete="off">
          <div class="field">
            <label for="add-url">Web address</label>
            <input id="add-url" name="url" type="text" placeholder="https://example.com" required />
          </div>
          <div class="field">
            <label for="add-title">Title <span class="muted">(optional)</span></label>
            <input id="add-title" name="title" type="text" placeholder="Leave blank to fetch automatically" />
          </div>
          <div class="field">
            <label for="add-tags">Tags <span class="muted">(comma separated)</span></label>
            <input id="add-tags" name="tags" type="text" placeholder="reading, tech" />
          </div>
          <div class="field">
            <label for="add-note">Note <span class="muted">(optional)</span></label>
            <textarea id="add-note" name="note" rows="2" placeholder="Why keep this?"></textarea>
          </div>
          <button type="submit" class="btn primary">Save bookmark</button>
          <p id="add-message" class="message" role="alert" hidden></p>
        </form>
      </section>

      <!-- List + controls -->
      <section class="panel list-panel" aria-labelledby="list-heading">
        <div class="list-controls">
          <h2 id="list-heading">Your bookmarks</h2>
          <div class="controls-row">
            <input id="search" type="search" placeholder="Search title, address, or note…" />
            <select id="tag-filter" aria-label="Filter by tag">
              <option value="">All tags</option>
            </select>
          </div>
        </div>

        <ul id="bookmark-list" class="bookmark-list"></ul>
        <p id="empty-state" class="empty" hidden></p>
      </section>
    </main>

    <!-- Edit dialog -->
    <dialog id="edit-dialog">
      <form id="edit-form" method="dialog">
        <h2>Edit bookmark</h2>
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label for="edit-url">Web address</label>
          <input id="edit-url" type="text" required />
        </div>
        <div class="field">
          <label for="edit-title">Title</label>
          <input id="edit-title" type="text" />
        </div>
        <div class="field">
          <label for="edit-tags">Tags <span class="muted">(comma separated)</span></label>
          <input id="edit-tags" type="text" />
        </div>
        <div class="field">
          <label for="edit-note">Note</label>
          <textarea id="edit-note" rows="2"></textarea>
        </div>
        <p id="edit-message" class="message" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="btn" id="edit-cancel">Cancel</button>
          <button type="submit" class="btn primary">Save changes</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
