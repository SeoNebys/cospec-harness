<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep — search interaction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" data-harness-ready="true">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Keep home"><span class="brand-mark">K</span><span>Keep</span></a>
      <div class="avatar" aria-label="Personal library">You</div>
    </header>

    <section class="hero search-hero">
      <p class="eyebrow">YOUR LIBRARY</p>
      <h1>Find your way back.</h1>
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="Search titles, descriptions, sites, addresses, and labels" autocomplete="off" aria-label="Search bookmarks">
        <kbd>/</kbd>
      </div>
    </section>

    <section class="library search-library" aria-labelledby="results-heading">
      <div class="section-heading">
        <div><p class="eyebrow">ALL BOOKMARKS</p><h2 id="results-heading">Your saved links</h2></div>
        <span id="result-count" class="count">5 bookmarks</span>
      </div>
      <div id="search-results" class="bookmark-list" aria-live="polite"></div>
      <div id="no-results" class="empty-state" hidden>
        <div class="empty-icon">⌕</div><h3>Nothing found</h3><p>Try another word or clear the search to see your whole library.</p>
      </div>
    </section>
  </main>
  <script src="search.js"></script>
</body>
</html>
