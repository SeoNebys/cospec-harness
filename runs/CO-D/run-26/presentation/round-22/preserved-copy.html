<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preserved copy (simulation)</title>
<style>
  body { margin:0; font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:#1c2330; background:#f6f7f9; }
  .bar { background:#1c2330; color:#fff; padding:12px 18px; font-size:13px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar .tag { background:#2f6df6; padding:2px 9px; border-radius:20px; font-weight:700; }
  .wrap { max-width:760px; margin:24px auto; background:#fff; border:1px solid #e4e7ec; border-radius:12px; padding:26px; box-shadow:0 4px 16px rgba(16,24,40,.06); }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:#6b7686; font-size:13px; }
  .doc { margin-top:18px; }
  .doc p { color:#414b5a; }
  .skeleton { height:12px; background:linear-gradient(90deg,#eef1f5,#e4e7ec,#eef1f5); border-radius:6px; margin:9px 0; }
  .pdfbox { margin-top:18px; border:1px solid #e4e7ec; border-radius:10px; padding:40px; text-align:center; background:#fbfbfc; }
  .pdfbox .big { font-size:40px; }
</style>
</head>
<body>
<div class="bar"><span class="tag">Preserved copy</span><span>Simulated snapshot for prototype review — not a real capture</span></div>
<div class="wrap" id="wrap"></div>
<script>
  const q = new URLSearchParams(location.search);
  const title = q.get("title") || "Saved page";
  const url = q.get("url") || "";
  const at = q.get("at");
  const kind = q.get("kind") || "page";
  const when = at ? new Date(Number(at)).toLocaleString() : "";
  const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let body;
  if (kind === "pdf") {
    body = `<div class="pdfbox"><div class="big">📄</div><p><strong>Preserved PDF</strong></p>
      <p class="muted">The saved copy of a PDF link is the PDF file itself. In the real app this would open the stored PDF.</p></div>`;
  } else {
    body = `<div class="doc"><p>This is a preserved copy of the page as it looked when saved.</p>
      <div class="skeleton" style="width:92%"></div><div class="skeleton" style="width:98%"></div>
      <div class="skeleton" style="width:85%"></div><div class="skeleton" style="width:95%"></div>
      <div class="skeleton" style="width:70%"></div></div>`;
  }
  document.getElementById("wrap").innerHTML =
    `<h1>${esc(title)}</h1><div class="muted">${esc(url)}</div>` +
    (when ? `<div class="muted">Preserved on ${esc(when)}</div>` : "") + body;
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
