<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Bookmarks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232f6feb' d='M4 2h8a1 1 0 0 1 1 1v11l-5-3-5 3V3a1 1 0 0 1 1-1z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="wrap">
      <h1>My Bookmarks</h1>
      <p>Save a link, tag it, keep a reading list, and find it again.</p>
    </div>
  </header>

  <main class="wrap">
    <form class="saver" id="saver" autocomplete="off">
      <label for="url">Save a link</label>
      <div class="row">
        <input id="url" type="text" placeholder="Paste a link, e.g. https://example.com/article" />
        <button class="primary" type="submit" id="saveBtn">Save</button>
      </div>
      <p class="hint">Just paste the link — its title, description and icon are filled in for you.</p>
      <p class="savemsg" id="savemsg" role="status"></p>
    </form>

    <div class="toolbar">
      <div class="searchbox">
        <span class="mag" aria-hidden="true">⌕</span>
        <input id="search" type="text" placeholder="Search by title, description, address, tag or note…" aria-label="Search your links" />
        <button class="clr" id="clr" title="Clear search" type="button" aria-label="Clear search">×</button>
      </div>
      <div class="views" id="views"></div>
      <div class="filters" id="filters"></div>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
    <ul class="links" id="list"></ul>
  </main>

  <datalist id="known-tags"></datalist>

  <script type="module" src="app.js"></script>
</body>
</html>
