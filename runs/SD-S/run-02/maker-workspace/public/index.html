<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>🔖 Bookmarks</h1>
    <div class="search-bar">
      <input id="search" type="search" placeholder="Search title, address, description, note, or tag…" autocomplete="off" />
      <button id="clear-search" class="ghost" title="Clear search" hidden>Clear</button>
    </div>
  </header>

  <main class="container">
    <section class="add-panel">
      <form id="add-form" autocomplete="off">
        <div class="add-row">
          <input id="add-url" type="text" placeholder="https://example.com" required />
          <button type="submit" id="add-submit">Add bookmark</button>
        </div>
        <details class="add-details">
          <summary>Add title, tags, or a note</summary>
          <input id="add-title" type="text" placeholder="Title (optional — auto-filled if left blank)" />
          <input id="add-tags" type="text" list="tag-suggestions" placeholder="Tags (comma-separated, optional)" />
          <textarea id="add-note" rows="2" placeholder="Note (optional)"></textarea>
        </details>
        <p id="add-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <div id="active-filter" class="active-filter" hidden>
      Filtering by tag: <span id="active-tag" class="tag"></span>
      <button id="clear-filter" class="ghost">Clear filter</button>
    </div>

    <section id="list" class="bookmark-list" aria-live="polite"></section>

    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-title">No bookmarks yet</p>
      <p>Add your first bookmark using the field above.</p>
    </div>

    <div id="no-results" class="empty-state" hidden>
      <p class="empty-title">No matching bookmarks</p>
      <p>Try a different search or clear the filter.</p>
    </div>
  </main>

  <datalist id="tag-suggestions"></datalist>

  <!-- Edit dialog -->
  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2 id="edit-heading">Edit bookmark</h2>
      <label>Address<input id="edit-url" type="text" required /></label>
      <label>Title<input id="edit-title" type="text" /></label>
      <label>Description<textarea id="edit-description" rows="2"></textarea></label>
      <label>Tags<input id="edit-tags" type="text" list="tag-suggestions" placeholder="comma-separated" /></label>
      <label>Note<textarea id="edit-note" rows="3"></textarea></label>
      <p id="edit-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="edit-refresh" class="ghost">Refresh details</button>
        <span class="spacer"></span>
        <button type="button" id="edit-cancel" class="ghost">Cancel</button>
        <button type="button" id="edit-save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation -->
  <dialog id="delete-dialog">
    <p id="delete-message">Delete this bookmark?</p>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel" class="ghost">Cancel</button>
      <button type="button" id="delete-confirm" class="danger">Delete</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
