<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Home — Empty Done collection</title><style>:root{--ink:#17201d;--muted:#66736e;--line:#dce4df;--green:#236b4b;--soft:#edf6f0}*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{width:min(900px,calc(100% - 32px));margin:44px auto}h1{font:700 30px/1.1 Georgia,serif;margin:0}.sub{color:var(--muted);margin:6px 0 22px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}.tab{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}.tab.active{background:var(--green);color:#fff}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.card h2{font-size:18px;margin:6px 0}.eyebrow{color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase}.empty{padding:64px 20px;text-align:center;background:#fff;border:1px dashed #b9c5be;border-radius:14px}.empty h2{font:700 23px/1.2 Georgia,serif;margin:0 0 7px}.empty p{color:var(--muted);margin:0 0 17px}.return{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}</style></head><body><main data-harness-ready="true"><h1>Link Home</h1><p class="sub">Your personal collection</p><nav class="tabs"><button class="tab active" data-view="read">To read 3</button><button class="tab" data-view="done">Done 0</button></nav><section id="read" class="view active"><div class="cards"><article class="card"><div class="eyebrow">To read</div><h2>JavaScript | MDN</h2></article><article class="card"><div class="eyebrow">To read</div><h2>Designing for the Web</h2></article><article class="card"><div class="eyebrow">To read</div><h2>A Weekend in Rome</h2></article></div></section><section id="done" class="view"><div class="empty"><h2>Nothing in Done yet</h2><p>Bookmarks you finish will collect here. Your To read links are unchanged.</p><button class="return">View To read</button></div></section></main><script>function show(id){document.querySelectorAll('.view,.tab').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');document.querySelector('[data-view="'+id+'"]').classList.add('active')}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelector('.return').onclick=()=>show('read');</script></body></html>
