<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="app__header">
        <h1>Bookmarks</h1>
        <p class="app__subtitle">Save, find, and organize your links.</p>
      </header>

      <section class="card" aria-label="Add a bookmark">
        <h2>Add a bookmark</h2>
        <form id="add-form" class="form" autocomplete="off">
          <div class="form__row">
            <label for="url">Web address <span class="req">*</span></label>
            <input id="url" name="url" type="text" placeholder="example.com/article" required />
          </div>
          <div class="form__row">
            <label for="title">Title <span class="hint">(optional — derived if blank)</span></label>
            <input id="title" name="title" type="text" placeholder="Leave blank to auto-fill" />
          </div>
          <div class="form__row">
            <label for="tags">Tags <span class="hint">(comma separated)</span></label>
            <input id="tags" name="tags" type="text" placeholder="reading, reference" />
          </div>
          <div class="form__row">
            <label for="note">Note <span class="hint">(optional)</span></label>
            <input id="note" name="note" type="text" placeholder="Why you saved it" />
          </div>
          <div class="form__actions">
            <button type="submit" class="btn btn--primary">Save bookmark</button>
          </div>
          <p id="add-message" class="message" role="status"></p>
        </form>
      </section>

      <section class="card" aria-label="Your bookmarks">
        <div class="toolbar">
          <input id="search" type="search" class="toolbar__search" placeholder="Search title, address, or tags…" />
          <div id="active-filter" class="active-filter" hidden>
            <span>Filtered by tag: <strong id="active-filter-name"></strong></span>
            <button id="clear-filter" type="button" class="btn btn--link">Clear</button>
          </div>
        </div>
        <div id="tag-cloud" class="tag-cloud" aria-label="Filter by tag"></div>
        <div id="list" class="list"></div>
      </section>
    </div>

    <!-- Edit dialog -->
    <dialog id="edit-dialog" class="dialog">
      <form id="edit-form" method="dialog" class="form">
        <h2>Edit bookmark</h2>
        <input type="hidden" id="edit-id" />
        <div class="form__row">
          <label>Web address</label>
          <p id="edit-url" class="readonly-url"></p>
        </div>
        <div class="form__row">
          <label for="edit-title">Title <span class="req">*</span></label>
          <input id="edit-title" type="text" required />
        </div>
        <div class="form__row">
          <label for="edit-tags">Tags <span class="hint">(comma separated)</span></label>
          <input id="edit-tags" type="text" />
        </div>
        <div class="form__row">
          <label for="edit-note">Note</label>
          <input id="edit-note" type="text" />
        </div>
        <p id="edit-message" class="message"></p>
        <div class="form__actions">
          <button type="button" class="btn" id="edit-cancel">Cancel</button>
          <button type="button" class="btn btn--primary" id="edit-save">Save changes</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
