<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f3ed" />
  <title>Shelf — Your corner of the internet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell" data-harness-ready="true">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Shelf home"><span class="brand-mark">S</span><span>Shelf</span></a>
      <nav aria-label="Bookmark views">
        <button class="nav-item active" data-view="all"><span class="nav-icon">⌂</span>All bookmarks <span class="count" id="allCount"></span></button>
        <button class="nav-item" data-view="favorites"><span class="nav-icon">☆</span>Favorites <span class="count" id="favCount"></span></button>
        <button class="nav-item" data-view="unread"><span class="nav-icon">◔</span>Unread <span class="count" id="unreadCount"></span></button>
        <button class="nav-item" data-view="archive"><span class="nav-icon">▣</span>Archive <span class="count" id="archiveCount"></span></button>
      </nav>
      <div class="sidebar-section">
        <p>COLLECTIONS</p>
        <div id="collectionNav"></div>
        <button class="new-collection" id="newCollection"><span>＋</span> New collection</button>
      </div>
      <div class="sidebar-foot">
        <div class="tip-icon">⌘</div>
        <div><strong>Quick save</strong><span>Press N anywhere</span></div>
      </div>
    </aside>

    <main>
      <header>
        <div class="mobile-brand"><span class="brand-mark">S</span><strong>Shelf</strong></div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="search" type="search" placeholder="Search your shelf…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </div>
        <button class="primary" id="addBookmark"><span>＋</span> Add bookmark</button>
      </header>

      <section class="content">
        <div class="heading-row">
          <div><p class="eyebrow" id="eyebrow">YOUR LIBRARY</p><h1 id="pageTitle">All bookmarks</h1></div>
          <div class="view-tools">
            <button class="icon-button active" id="gridView" aria-label="Grid view">▦</button>
            <button class="icon-button" id="listView" aria-label="List view">☷</button>
            <select id="sortSelect" aria-label="Sort bookmarks"><option value="newest">Recently added</option><option value="oldest">Oldest first</option><option value="title">Title A–Z</option></select>
          </div>
        </div>
        <div class="filter-row" id="filterRow"></div>
        <div class="bookmark-grid" id="bookmarkGrid"></div>
        <div class="empty" id="emptyState" hidden>
          <span>◌</span><h2>Nothing on this shelf yet</h2><p>Save something worth returning to.</p><button class="primary" id="emptyAdd">Add your first bookmark</button>
        </div>
      </section>
    </main>
  </div>

  <dialog id="bookmarkDialog">
    <form method="dialog" id="bookmarkForm">
      <div class="modal-head"><div><p class="eyebrow">SAVE FOR LATER</p><h2 id="modalTitle">Add a bookmark</h2></div><button class="close" value="cancel" aria-label="Close">×</button></div>
      <label>URL<div class="url-field"><input id="urlInput" type="url" placeholder="https://example.com" required /><span id="fetchStatus"></span></div></label>
      <label>Title<input id="titleInput" type="text" placeholder="Filled automatically from the page" /></label>
      <label>Note<textarea id="noteInput" placeholder="Why are you saving this?"></textarea></label>
      <div class="form-row"><label>Collection<select id="collectionInput"></select></label><label>Tags<input id="tagsInput" type="text" placeholder="design, reading" /></label></div>
      <label class="check-label"><input id="unreadInput" type="checkbox" checked /><span><strong>Save as unread</strong><small>Keep it in your reading queue</small></span></label>
      <div class="modal-actions"><button class="secondary" value="cancel">Cancel</button><button class="primary" id="saveBookmark" value="default">Save bookmark</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
