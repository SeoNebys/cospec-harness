<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmark app — prototype</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6feb;
    --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 20px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }

  .saver {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .saver label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
  }
  .field { margin-bottom: 12px; }
  button.primary {
    padding: 10px 16px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary:hover { filter: brightness(0.95); }

  .count { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  ul.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li.link {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  li.link .title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  li.link .title a { color: var(--ink); text-decoration: none; }
  li.link .title a:hover { text-decoration: underline; }
  li.link .url { font-size: 13px; color: var(--accent); word-break: break-all; margin: 0 0 6px; }
  li.link .meta { font-size: 12px; color: var(--muted); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    background: var(--card);
  }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Prototype — for exploring how saving a link should feel.</p>
</header>
<main>
  <form class="saver" id="saver">
    <div class="field">
      <label for="url">Link</label>
      <div class="row">
        <input id="url" type="text" placeholder="Paste a link here, e.g. https://example.com/article" autocomplete="off" />
        <button class="primary" type="submit">Save</button>
      </div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="title">Title (optional)</label>
      <input id="title" type="text" placeholder="Leave blank to just show the link" autocomplete="off" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;" />
    </div>
  </form>

  <p class="count" id="count"></p>
  <ul class="links" id="list"></ul>
</main>

<script>
  var STORE_KEY = "bm_proto_v1";
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch (e) { return []; }
  }
  function save(items) { localStorage.setItem(STORE_KEY, JSON.stringify(items)); }

  function fmtDate(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function displayTitle(item) {
    if (item.title && item.title.trim()) return item.title.trim();
    return item.url.replace(/^https?:\/\//, "");
  }

  function render() {
    var items = load();
    var list = document.getElementById("list");
    var count = document.getElementById("count");
    list.innerHTML = "";
    if (items.length === 0) {
      count.textContent = "";
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No links saved yet. Paste a link above and press Save.";
      list.appendChild(li);
      return;
    }
    count.textContent = items.length + (items.length === 1 ? " link saved" : " links saved");
    items.slice().reverse().forEach(function (item) {
      var li = document.createElement("li");
      li.className = "link";
      var t = document.createElement("p");
      t.className = "title";
      var a = document.createElement("a");
      a.href = item.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = displayTitle(item);
      t.appendChild(a);
      var u = document.createElement("p");
      u.className = "url";
      u.textContent = item.url;
      var m = document.createElement("p");
      m.className = "meta";
      m.textContent = "Saved " + fmtDate(item.savedAt);
      li.appendChild(t); li.appendChild(u); li.appendChild(m);
      list.appendChild(li);
    });
  }

  document.getElementById("saver").addEventListener("submit", function (e) {
    e.preventDefault();
    var urlEl = document.getElementById("url");
    var titleEl = document.getElementById("title");
    var url = urlEl.value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    var items = load();
    items.push({ url: url, title: titleEl.value, savedAt: Date.now() });
    save(items);
    urlEl.value = ""; titleEl.value = "";
    urlEl.focus();
    render();
  });

  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
