<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 21 (keep-a-copy: the whole feel)</title>
<style>
  :root{--line:#e2e2e6;--muted:#6b6b72;--accent:#3b5bdb;--bg:#f7f7f9;--note:#8a6d00;--notebg:#fff8e1;--dead:#c0392b;--ok:#2f9e44}
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:#1a1a1e}
  .wrap{max-width:680px;margin:0 auto;padding:22px 20px 80px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .searchbar{position:relative;margin-bottom:6px}
  #search{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:22px;font-size:14px}
  .searchbar .icon{position:absolute;left:13px;top:9px;color:var(--muted)}
  .count{font-size:13px;color:var(--muted);margin:10px 2px 12px}

  .card{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .card:hover{box-shadow:0 3px 14px rgba(0,0,0,.08);border-color:#cfd6ef}
  .title{font-size:15px;font-weight:600;margin:0 0 2px} .url{font-size:12px;color:var(--accent)}
  .meta{margin-top:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .note{font-size:13px;color:var(--note);background:var(--notebg);border-left:3px solid #f0cf5a;border-radius:0 6px 6px 0;padding:6px 9px;margin:8px 0 0}
  .copychip{font-size:11px;border-radius:10px;padding:2px 9px;display:inline-flex;gap:5px;align-items:center}
  .copychip.kept{background:#eaf7ee;color:#1a7f37} .copychip.none{background:#f3f0ec;color:#9a8a70}
  .viewcopy{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
  .viewcopy:hover{border-color:#cfd6ef}
  mark{background:#fff3bf;border-radius:3px;padding:0 1px}
  .hint{font-size:12px;color:#9a9aa2;margin:6px 2px 14px;line-height:1.5}

  .backdrop{position:fixed;inset:0;background:rgba(20,20,28,.45);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:50;overflow:auto}
  .backdrop.show{display:flex}
  .reader{background:#fff;border-radius:14px;width:100%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,.28);overflow:hidden}
  .rhead{padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;background:#fafafb}
  .rhead .x{border:0;background:transparent;font-size:18px;cursor:pointer;color:#888}
  .deadbar{background:#fdecea;border-bottom:1px solid #f5c6c0;color:var(--dead);padding:9px 16px;font-size:13px}
  .rnote{font-size:14px;color:var(--note);background:var(--notebg);border-bottom:1px solid #f0e2a8;padding:10px 16px}
  .rbody{padding:16px 20px}
  .rbody .hero{width:100%;height:140px;border-radius:8px;background:linear-gradient(135deg,#f08c00,#00000022);margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  .rbody h2{font-size:19px;margin:0 0 8px} .rbody p{font-size:14.5px;line-height:1.6;color:#2c2c33;margin:0 0 12px}
  .ext{text-align:center;padding:10px 0} .ext .big{font-size:26px} .ext a{color:var(--accent);font-weight:600;text-decoration:none} .ext .disc{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Prototype 21 — how keeping a copy feels across the whole flow</p>

  <div class="searchbar"><span class="icon">⌕</span><input id="search" type="text" placeholder="Search — including inside your saved copies…" autocomplete="off"></div>
  <div class="hint">Try searching <b>parmesan rind</b> — those words are only inside the beans recipe's saved copy, not its title, note, or address.</div>
  <div class="count" id="count"></div>
  <div id="cards"></div>
</div>

<div class="backdrop" id="back"><div class="reader" id="reader"></div></div>

<script>
  const el=id=>document.getElementById(id);
  const cards=el("cards"), countEl=el("count"), back=el("back"), reader=el("reader"), search=el("search");

  const DATA=[
    {id:1,title:"Simplest Brothy Beans and Rice",url:"smittenkitchen.com/beans",note:"Needs double the garlic.",
     copy:{kind:"readable",dead:false,
       body:"A weeknight one-pot dinner: creamy beans simmered with garlic, herbs, and a parmesan rind until the broth turns silky, then spooned over rice. Ingredients: white beans, garlic, olive oil, a parmesan rind, rice. Method: soften the garlic, add beans and the rind, simmer 25 minutes, serve over rice."}},
    {id:2,title:"A Deep Dive into Database Indexes",url:"use-the-index-luke.com",note:"",
     copy:{kind:"readable",dead:true,
       body:"How database indexes work: a b-tree keeps rows sorted so lookups stay fast as data grows. Design indexes around the columns your queries filter and sort on."}},
    {id:3,title:"Members-Only Market Report 2026",url:"paywalledsite.com/report",note:"The Q2 figures I needed.",
     copy:{kind:"none",dead:true}}   // couldn't capture (login/paywall) -> external fallback
  ];

  function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
  function hl(t,q){if(!q)return esc(t);let o=esc(t);q.trim().split(/\s+/).filter(Boolean).forEach(w=>{o=o.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>")});return o}
  function haystack(b){return [b.title,b.url,b.note,(b.copy&&b.copy.body)||""].join(" ").toLowerCase()}

  function render(){
    const q=search.value.trim().toLowerCase();
    const list=DATA.filter(b=>!q||q.split(/\s+/).filter(Boolean).every(t=>haystack(b).includes(t)));
    countEl.textContent=list.length+(list.length===1?" bookmark":" bookmarks")+(q?" match":"");
    cards.innerHTML="";
    list.forEach(b=>{
      const c=document.createElement("div");c.className="card";
      const kept=b.copy.kind!=="none";
      c.innerHTML='<p class="title">'+hl(b.title,q)+'</p><div class="url">'+hl(b.url,q)+'</div>'+
        (b.note?'<div class="note"><b>My note:</b> '+hl(b.note,q)+'</div>':'')+
        '<div class="meta">'+
          (kept?'<span class="copychip kept">✓ copy kept</span>':'<span class="copychip none">no copy — couldn\'t capture</span>')+
          '<button class="viewcopy">'+(kept?'View saved copy':'Find an archived copy')+'</button>'+
        '</div>';
      c.querySelector(".viewcopy").addEventListener("click",e=>{e.stopPropagation();openCopy(b,false)});
      c.addEventListener("click",()=>openCopy(b,true)); // simulate visiting; dead ones show the gone-bar
      cards.appendChild(c);
    });
  }

  function openCopy(b,viaVisit){
    const dead=b.copy.dead, kept=b.copy.kind!=="none";
    let html='<div class="rhead"><span>'+(kept?'Your saved copy · readable':'No copy stored')+'</span><button class="x">×</button></div>';
    if(viaVisit && dead) html+='<div class="deadbar">⚠ The original page didn\'t load — it may be gone. Showing '+(kept?'your saved copy.':'options below.')+'</div>';
    if(b.note) html+='<div class="rnote"><b>My note:</b> '+esc(b.note)+'</div>';
    if(kept){
      html+='<div class="rbody"><div class="hero">[ saved photo ]</div><h2>'+esc(b.title)+'</h2><p>'+esc(b.copy.body)+'</p></div>';
    } else {
      html+='<div class="rbody ext"><div class="big">🌐</div><p>This one couldn\'t be copied (it needed a login). We kept your note, and can look for a public archive:</p>'+
            '<p><a href="#">Search the Internet Archive →</a></p><p class="disc">That copy lives on someone else\'s service and may not exist.</p></div>';
    }
    reader.innerHTML=html;
    reader.querySelector(".x").addEventListener("click",()=>back.classList.remove("show"));
    back.classList.add("show");
  }
  back.addEventListener("click",e=>{if(e.target===back)back.classList.remove("show")});
  search.addEventListener("input",render);
  render();
</script>
</body>
</html>
