<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — prototype</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Save a link — confirm the pre-filled details, edit anytime, and never save the same link twice.</p>
</header>
<main>
  <div class="saver">
    <label for="url">Paste a link to save</label>
    <div class="saver-row">
      <input id="url" type="url" placeholder="https://…" autocomplete="off" />
      <button id="saveBtn" class="btn">Save</button>
    </div>
    <div class="hint">A ready-to-confirm preview appears. If it looks right, just press Save.</div>
  </div>
  <div id="stage"></div>
  <p class="section-title">Saved</p>
  <div id="list"></div>
  <div id="empty" class="empty">Nothing saved yet.</div>
</main>
<script>window.DUP_MODE = "openedit";</script>
<script src="dup.js"></script>
</body>
</html>
