<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>📑 Bookmarks</h1>
    <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" />
  </header>

  <main>
    <aside id="sidebar">
      <button id="add-btn" class="primary">+ Add bookmark</button>
      <h2>Tags</h2>
      <ul id="tag-list"></ul>
    </aside>

    <section id="content">
      <div id="active-filter" class="hidden"></div>
      <ul id="bookmark-list"></ul>
      <p id="empty" class="empty hidden">No bookmarks yet. Add your first one!</p>
    </section>
  </main>

  <!-- Add / edit dialog -->
  <dialog id="editor">
    <form id="editor-form" method="dialog">
      <h2 id="editor-title">Add bookmark</h2>
      <label>URL
        <input id="f-url" name="url" type="text" required placeholder="example.com" />
      </label>
      <label>Title <span class="hint">(leave blank to auto-fetch)</span>
        <input id="f-title" name="title" type="text" placeholder="Auto-fetched from the page" />
      </label>
      <label>Notes
        <textarea id="f-description" name="description" rows="3"></textarea>
      </label>
      <label>Tags <span class="hint">(comma-separated)</span>
        <input id="f-tags" name="tags" type="text" placeholder="reading, work, recipes" />
      </label>
      <div class="actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
