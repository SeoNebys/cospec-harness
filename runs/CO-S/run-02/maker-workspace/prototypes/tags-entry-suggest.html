<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — tag entry: suggestions</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 760px; margin: 0 auto; padding: 32px 20px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .variant { font-size: 12px; color: #2563eb; margin: 0 0 20px; font-weight: 600; }
  .save-box { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .save-box label { display: block; font-size: 12px; color: #666; margin: 0 0 4px; }
  .save-box .hint { font-size: 11px; color: #999; margin: -8px 0 12px; min-height: 14px; }
  .save-box input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d5d5d5; border-radius: 7px; margin-bottom: 12px; }
  .save-box button { background: #2563eb; color: #fff; border: 0; border-radius: 7px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tagfield { border: 1px solid #d5d5d5; border-radius: 7px; padding: 6px 8px; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #fff; }
  .tagfield .pill { background: #4338ca; color: #fff; font-size: 12px; padding: 3px 8px 3px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; }
  .tagfield .pill b { cursor: pointer; font-weight: 700; }
  .tagfield input { border: 0; outline: 0; flex: 1; min-width: 120px; padding: 6px 2px; margin: 0; font-size: 14px; }
  .suggest { margin: 0 0 12px; min-height: 22px; }
  .suggest .s { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px dashed #a5b4fc; color: #4338ca; background: #eef2ff; cursor: pointer; margin: 0 6px 6px 0; }
  .suggest .s .new { color: #16a34a; font-weight: 600; }
  .search input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid #d5d5d5; border-radius: 9px; margin-bottom: 14px; }
  .chip { display: inline-block; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #d5d5d5; background: #fff; color: #333; cursor: pointer; margin: 0 6px 8px 0; }
  .chip.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
  .count { font-size: 12px; color: #888; margin: 6px 0 10px; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  ul.list li .title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  ul.list li a { color: #2563eb; text-decoration: none; font-size: 13px; word-break: break-all; display: block; margin-bottom: 8px; }
  .itemtag { display: inline-block; font-size: 11px; background: #eef2ff; color: #4338ca; padding: 1px 8px; border-radius: 20px; margin-right: 5px; }
</style>
</head>
<body>
  <h1>📑 My Bookmarks</h1>
  <p class="variant">Tag entry — suggestions: as you type, tags you already use are offered so you reuse them</p>

  <div class="save-box">
    <label>Link</label>
    <input id="url" placeholder="Paste a link here…" />
    <label>Name</label>
    <input id="title" placeholder="Grabbed automatically — edit if you like" />
    <div class="hint" id="hint"></div>
    <label>Tags</label>
    <div class="tagfield" id="tagfield">
      <input id="tagInput" placeholder="Type a tag…" />
    </div>
    <div class="suggest" id="suggest"></div>
    <button id="save">Save</button>
  </div>

  <div class="search"><input id="search" placeholder="🔍 Search your bookmarks…" /></div>
  <div id="tagbar"></div>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>

  <script>
    const DATA = [
      { title: 'World News - The New York Times', url: 'https://www.nytimes.com/section/world', tags: ['news','read-later'], t: 5 },
      { title: 'Classic Banana Bread Recipe', url: 'https://www.seriouseats.com/banana-bread', tags: ['cooking','recipes'], t: 4 },
      { title: 'How to Prune Tomatoes - YouTube', url: 'https://www.youtube.com/watch?v=abc', tags: ['gardening','video','cooking'], t: 3 },
      { title: 'torvalds/linux - GitHub', url: 'https://github.com/torvalds/linux', tags: ['tech','reference'], t: 2 },
      { title: 'Technology - BBC News', url: 'https://www.bbc.com/news/technology', tags: ['news','tech'], t: 1 },
    ];
    let activeTag = null;
    let pending = []; // tags chosen for the bookmark being saved
    const $ = id => document.getElementById(id);

    let titleTouched=false, deb;
    $('title').addEventListener('input', ()=>titleTouched=true);
    $('url').addEventListener('input', ()=>{ const u=$('url').value.trim(); clearTimeout(deb);
      if(!u){$('hint').textContent='';return;} $('hint').textContent='Looking up the page title…';
      deb=setTimeout(()=>{ if(!titleTouched||!$('title').value.trim()){ let h=u; try{h=new URL(u.match(/^https?:\/\//)?u:'https://'+u).hostname.replace(/^www\./,'');}catch(e){} const w=h.split('.')[0].replace(/[-_]/g,' '); $('title').value=w.charAt(0).toUpperCase()+w.slice(1)+' — page'; titleTouched=false;} $('hint').textContent='Filled in the page title — edit it if you like.'; },600);
    });

    function knownTags(){ const s={}; DATA.forEach(d=>d.tags.forEach(t=>s[t]=1)); return Object.keys(s).sort(); }
    function renderPills(){
      const f=$('tagfield'); f.querySelectorAll('.pill').forEach(e=>e.remove());
      pending.forEach(tag=>{ const p=document.createElement('span'); p.className='pill'; p.innerHTML=tag+' <b>×</b>';
        p.querySelector('b').onclick=()=>{ pending=pending.filter(x=>x!==tag); renderPills(); renderSuggest(); };
        f.insertBefore(p, $('tagInput')); });
    }
    function addTag(t){ t=t.trim(); if(!t) return; if(!pending.includes(t)) pending.push(t); $('tagInput').value=''; renderPills(); renderSuggest(); $('tagInput').focus(); }
    function renderSuggest(){
      const q=$('tagInput').value.trim().toLowerCase(); const box=$('suggest'); box.innerHTML='';
      if(!q){ const hintTags=knownTags().filter(t=>!pending.includes(t)).slice(0,5);
        hintTags.forEach(t=>{ const s=document.createElement('span'); s.className='s'; s.textContent=t; s.onclick=()=>addTag(t); box.appendChild(s); });
        return; }
      const matches=knownTags().filter(t=>t.includes(q)&&!pending.includes(t));
      matches.forEach(t=>{ const s=document.createElement('span'); s.className='s'; s.textContent=t; s.onclick=()=>addTag(t); box.appendChild(s); });
      if(!knownTags().includes(q)){ const s=document.createElement('span'); s.className='s'; s.innerHTML='<span class="new">+ create</span> “'+q+'”'; s.onclick=()=>addTag(q); box.appendChild(s); }
    }
    $('tagInput').addEventListener('input', renderSuggest);
    $('tagInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTag($('tagInput').value); } });

    function allTags(){ const s={}; DATA.forEach(d=>d.tags.forEach(t=>s[t]=(s[t]||0)+1)); return Object.entries(s).sort((a,b)=>a[0].localeCompare(b[0])); }
    function renderTagbar(){ const bar=$('tagbar'); bar.innerHTML='';
      const all=document.createElement('span'); all.className='chip'+(activeTag===null?' active':''); all.textContent='All'; all.onclick=()=>{activeTag=null;render();}; bar.appendChild(all);
      allTags().forEach(([t,n])=>{ const c=document.createElement('span'); c.className='chip'+(activeTag===t?' active':''); c.textContent=t+' · '+n; c.onclick=()=>{activeTag=(activeTag===t?null:t);render();}; bar.appendChild(c); });
    }
    function render(){ renderTagbar();
      const q=$('search').value.trim().toLowerCase(); let items=DATA.slice().sort((a,b)=>b.t-a.t);
      if(activeTag) items=items.filter(d=>d.tags.includes(activeTag));
      if(q) items=items.filter(d=>d.title.toLowerCase().includes(q)||d.url.toLowerCase().includes(q)||d.tags.some(t=>t.includes(q)));
      $('count').textContent=items.length+(items.length===1?' bookmark':' bookmarks');
      const list=$('list'); list.innerHTML='';
      items.forEach(it=>{ const li=document.createElement('li'); li.innerHTML='<div class="title">'+it.title+'</div><a href="'+it.url+'" target="_blank">'+it.url+'</a>'+it.tags.map(t=>'<span class="itemtag">'+t+'</span>').join(''); list.appendChild(li); });
    }
    $('save').onclick=()=>{ const u=$('url').value.trim(); if(!u) return;
      DATA.push({title:$('title').value.trim()||u, url:u, tags:pending.slice(), t:Date.now()});
      pending=[]; $('url').value=$('title').value=$('tagInput').value=''; $('hint').textContent=''; titleTouched=false; renderPills(); renderSuggest(); render();
    };
    $('search').addEventListener('input', render);
    renderPills(); renderSuggest(); render();
  </script>
</body>
</html>
