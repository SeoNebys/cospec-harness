<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — prototype 14 (import history & dead links)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a2e; }
  header { background: #fff; border-bottom: 1px solid #e3e5e8; padding: 18px 28px; position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .hbtns { display: flex; gap: 8px; }
  .hbtn { font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid #cfd3d8; background: #fff; color: #3f4b5b; cursor: pointer; }
  main { max-width: 900px; margin: 0 auto; padding: 22px 28px 60px; }
  .toolsrow { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolsrow label { font-size: 12.5px; color: #6b7280; }
  .toolsrow select { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid #cfd3d8; background: #fff; }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 14px 2px; }
  .card { display: flex; gap: 14px; background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 13px; margin-bottom: 10px; }
  .card.needsinfo { border-left: 4px solid #d9534f; }
  .card.dead { border-left: 4px solid #9aa1ab; background: #fbfbfc; }
  .thumb { width: 92px; height: 62px; flex: none; border-radius: 8px; object-fit: cover; background: #e9ebef; }
  .thumb.ph { display:flex; align-items:center; justify-content:center; color:#b3b8c0; font-size:22px; background:#eef0f3; border:1px dashed #cfd3d8; }
  .thumb.dead { filter: grayscale(1); opacity:.5; }
  .body { min-width: 0; flex: 1; }
  .titlerow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
  .title { font-size: 15px; font-weight: 600; } .title.untitled { color:#9aa1ab; font-style:italic; }
  .badge { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
  .badge.red { color:#b13b36; background:#fdecea; border:1px solid #f2c4c0; }
  .badge.grey { color:#566072; background:#e7eaef; border:1px solid #ccd2db; }
  .url { font-size: 12px; color: #2f6fed; margin: 0 0 5px; word-break: break-all; }
  .meta { font-size: 11.5px; color: #9aa1ab; margin-bottom: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #eef1f5; color: #3f4b5b; }
  .copychip { font-size: 11px; border-radius: 999px; padding: 2px 9px; }
  .copychip.ok { color: #1a7a3c; background: #eafaf0; border: 1px solid #b6e0c2; }
  .copychip.no { color: #8a5b00; background: #fff6e6; border: 1px solid #f0dca8; }
  .welcome { text-align: center; padding: 56px 20px; }
  .welcome .big { font-size: 42px; } .welcome h2 { margin: 8px 0 6px; }
  .welcome p { color: #6b7280; max-width: 460px; margin: 0 auto 18px; line-height: 1.55; }
  .welcome .cta { background: #2f6fed; color: #fff; border: none; border-radius: 9px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal.show { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 540px; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .sheet h3 { margin: 0; padding: 18px 22px; border-bottom: 1px solid #eceef1; font-size: 17px; }
  .sheet .in { padding: 20px 22px; }
  .sheet p { color: #4b5563; line-height: 1.55; font-size: 14px; margin: 0 0 14px; }
  .filepick { border: 2px dashed #cfd3d8; border-radius: 10px; padding: 22px; text-align: center; color: #6b7280; font-size: 14px; cursor: pointer; background: #fafbfc; }
  .filepick:hover { background: #f2f5f9; border-color: #a9c2f2; }
  .filepick .fname { color: #1a1a2e; font-weight: 600; margin-top: 8px; }
  .foldopt { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 4px; font-size: 13.5px; color: #3f4b5b; }
  .bar { height: 10px; background: #eceef1; border-radius: 999px; overflow: hidden; margin: 6px 0 10px; }
  .bar > span { display: block; height: 100%; width: 0; background: #2f6fed; transition: width .1s linear; }
  .prog { font-size: 13px; color: #6b7280; }
  .summary { font-size: 14px; color: #1a1a2e; line-height: 1.75; }
  .summary b { color: #1a7a3c; } .summary .warn { color:#8a5b00; }
  .actions { padding: 14px 22px; border-top: 1px solid #eceef1; display: flex; gap: 8px; justify-content: flex-end; }
  .actions button { font-size: 14px; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid #cfd3d8; background: #fff; color: #3f4b5b; }
  .actions button.primary { background: #2f6fed; color: #fff; border-color: #2f6fed; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="hbtns"><button class="hbtn" id="importBtn">⇪ Import</button><button class="hbtn" id="exportBtn">⇩ Export</button></div>
</header>
<main>
  <div class="toolsrow" id="toolsrow" style="display:none">
    <label>Order: <select id="sortSel">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="name">By name (A–Z)</option>
    </select></label>
    <span style="font-size:12px;color:#9aa1ab">(showing that your original save-dates survived the move)</span>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<div class="modal" id="importModal"><div class="sheet">
  <h3>Bring in your existing bookmarks</h3>
  <div class="in" id="importIn"></div>
  <div class="actions" id="importActions"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
// simulated browser file: each carries the date it was originally saved; some links are already dead
const importFile = {
  name: "bookmarks_2026_07_13.html",
  items: [
    {folder:"Cooking", title:"No-Knead Bread in a Dutch Oven", url:"https://kitchenlab.example/no-knead-bread", date:"2024-11-02"},
    {folder:"Cooking", title:"The Sourdough Starter Guide", url:"https://kitchenlab.example/sourdough-starter", date:"2023-06-18"},
    {folder:"Reading", title:"The Article You Meant to Keep", url:"https://blog.example/great-article", date:"2025-09-30"},
    {folder:"Reading", title:"Why We Sleep — notes", url:"https://readingnook.example/why-we-sleep", date:"2022-02-14"},
    {folder:"Travel", title:"12 Hidden Gems in Lisbon", url:"https://travelmore.example/lisbon", date:"2019-03-11"},
    {folder:"Travel", title:"Kyoto in Autumn (old blog)", url:"https://gone.example/kyoto-autumn", date:"2019-10-05", dead:true},
    {folder:"Finance", title:"A Practical Guide to Index Funds", url:"https://moneywise.example/index-funds", date:"2021-07-22"},
    {folder:"Old stuff", title:"That tool I used once", url:"https://defunct.example/tool", date:"2018-05-01", dead:true},
    {folder:null, title:"", url:"https://broken.example/unreadable", date:"2020-08-08"}, // reachable but unreadable
  ]
};
const dead=new Set(importFile.items.filter(x=>x.dead).map(x=>x.url));
const unreadable=new Set(["https://broken.example/unreadable"]);
function foldersToLabels(f){ return f? f.split('/').map(s=>s.trim().toLowerCase()).filter(Boolean):[]; }
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{month:'short',year:'numeric'}); }

let bookmarks=[]; let sortMode='new';
const listEl=document.getElementById('list'), countEl=document.getElementById('count'), toolsrow=document.getElementById('toolsrow');
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function sorted(){ const arr=[...bookmarks]; if(sortMode==='new') arr.sort((a,b)=>b.date.localeCompare(a.date)); else if(sortMode==='old') arr.sort((a,b)=>a.date.localeCompare(b.date)); else arr.sort((a,b)=>(a.title||'~').toLowerCase().localeCompare((b.title||'~').toLowerCase())); return arr; }

function render(){
  if(bookmarks.length===0){
    toolsrow.style.display='none'; countEl.textContent='';
    listEl.innerHTML=`<div class="welcome"><div class="big">🔖</div><h2>Move your bookmarks in</h2>
      <p>Bring your whole pile across in one go — every link, with the date you first saved it and your folders as labels. We'll keep a readable copy of each page that's still alive, and be straight with you about any that aren't.</p>
      <button class="cta" id="welcomeImport">⇪ Import my existing bookmarks</button></div>`;
    document.getElementById('welcomeImport').onclick=openImport; return;
  }
  toolsrow.style.display='flex';
  countEl.textContent=bookmarks.length+' bookmarks';
  listEl.innerHTML=sorted().map(b=>{
    const dcls = b.dead?'dead':(!b.title?'needsinfo':'');
    const badges = b.dead? '<span class="badge grey">original gone · no copy</span>' : (!b.title? '<span class="badge red">needs a title</span>':'');
    const copy = b.dead? '<span class="copychip no">⚠ no copy — page already gone</span>' : '<span class="copychip ok">✓ copy kept</span>';
    return `<div class="card ${dcls}">
      ${b.img?`<img class="thumb ${b.dead?'dead':''}" src="${b.img}">`:`<div class="thumb ph">🔗</div>`}
      <div class="body">
        <div class="titlerow"><div class="title ${b.title?'':'untitled'}">${b.title?esc(b.title):'Untitled — needs a title'}</div>${badges}</div>
        <div class="url">${esc(b.url)}</div>
        <div class="meta">saved ${fmtDate(b.date)}</div>
        <div class="tags">${b.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${copy}</div>
      </div></div>`;
  }).join('');
}
document.getElementById('sortSel').addEventListener('change',e=>{ sortMode=e.target.value; render(); });

const importModal=document.getElementById('importModal'), importIn=document.getElementById('importIn'), importActions=document.getElementById('importActions');
let picked=false;
function openImport(){ picked=false; stepPick(); importModal.classList.add('show'); }
document.getElementById('importBtn').onclick=openImport;
function stepPick(){
  importIn.innerHTML=`<p>Export your bookmarks to a file from your browser, then choose it here.</p>
    <div class="filepick" id="filepick">📄 Click to choose your bookmarks file<div class="fname" id="fname" style="display:none"></div></div>
    <label class="foldopt"><input type="checkbox" id="foldChk" checked><span>Turn my browser folders into labels (rename or drop them later)</span></label>`;
  importActions.innerHTML=`<button id="impCancel">Cancel</button><button class="primary" id="impStart" disabled style="opacity:.5">Import</button>`;
  document.getElementById('filepick').onclick=()=>{ picked=true; const f=document.getElementById('fname'); f.style.display='block'; f.textContent='Selected: '+importFile.name+'  ('+importFile.items.length+' links, back to 2018)'; const s=document.getElementById('impStart'); s.disabled=false; s.style.opacity='1'; };
  document.getElementById('impCancel').onclick=()=>importModal.classList.remove('show');
  document.getElementById('impStart').onclick=()=>{ if(picked) runImport(document.getElementById('foldChk').checked); };
}
function runImport(useFolders){
  const total=importFile.items.length;
  importIn.innerHTML=`<p>Bringing your bookmarks in, keeping each one's original date, and saving a readable copy where the page is still alive…</p><div class="bar"><span id="barfill"></span></div><div class="prog" id="prog">Starting…</div>`;
  importActions.innerHTML=`<button id="impBg">Run in background</button>`;
  document.getElementById('impBg').onclick=()=>importModal.classList.remove('show');
  let i=0, added=0, deadN=0, unreadN=0;
  function tick(){
    if(i>=total) return finishImport(added,deadN,unreadN);
    const it=importFile.items[i]; const isDead=dead.has(it.url), isUnread=unreadable.has(it.url);
    let host="the page"; try{host=new URL(it.url).hostname.replace(/^www\./,'');}catch(e){}
    const seed=encodeURIComponent(it.url).slice(-10)||'x';
    bookmarks.push({ url:it.url, date:it.date, title: isUnread? '' : (it.title|| ('Saved page from '+host)),
      img: (isDead||isUnread)? null : 'https://picsum.photos/seed/'+seed+'/200/140',
      tags: useFolders? foldersToLabels(it.folder):[], dead:isDead });
    added++; if(isDead) deadN++; if(isUnread) unreadN++;
    i++; document.getElementById('barfill').style.width=Math.round(i/total*100)+'%'; document.getElementById('prog').textContent=`Importing ${i} of ${total}…`;
    setTimeout(tick,200);
  }
  setTimeout(tick,220);
}
function finishImport(added,deadN,unreadN){
  importIn.innerHTML=`<div class="summary">✓ Moved in! <b>${added}</b> bookmarks brought across.<br>
    • Kept the <b>original date</b> each was saved — your history goes back to 2018, so "newest first" means something.<br>
    • Folders became labels you can rename or drop.<br>
    ${unreadN?`<span class="warn">• <b>${unreadN}</b> page couldn't be read right now — saved and flagged "needs a title", nothing lost.</span><br>`:''}
    ${deadN?`<span class="warn">• <b>${deadN}</b> links were <b>already dead</b> before the move — brought in with their title and date, but honestly flagged “original gone · no copy”. We can't copy a page that's already offline, and we won't pretend we did.</span><br>`:''}
    • A readable copy was kept for every page that was still alive.</div>`;
  importActions.innerHTML=`<button class="primary" id="impDone">See my bookmarks</button>`;
  document.getElementById('impDone').onclick=()=>{ importModal.classList.remove('show'); render(); toast('Welcome in — history and all.'); };
}
document.getElementById('exportBtn').onclick=()=>toast('Export carries links, labels, dates, and saved copies — standard format, nothing locked in.');
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3200); }
render();
</script>
</body>
</html>
