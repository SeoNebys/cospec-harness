<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app" class="app">
      <header class="app-header">
        <h1>📑 Bookmarks</h1>
        <p class="tagline">Save a link — the title, description and preview fill in automatically.</p>
      </header>

      <!-- Add form -->
      <form id="add-form" class="add-form" autocomplete="off">
        <div class="add-row">
          <input
            id="add-url"
            name="url"
            type="text"
            placeholder="Paste or type a web address (e.g. example.com)"
            aria-label="Web address"
            required
          />
          <button type="submit" id="add-submit">Save</button>
        </div>
        <div class="add-row secondary">
          <input id="add-notes" name="notes" type="text" placeholder="Notes (optional)" aria-label="Notes" />
          <input id="add-tags" name="tags" type="text" placeholder="Tags, comma separated (optional)" aria-label="Tags" />
        </div>
        <p id="add-error" class="error-msg" role="alert" hidden></p>
      </form>

      <!-- Controls -->
      <div class="controls">
        <input id="search" type="search" placeholder="Search title, address or description…" aria-label="Search bookmarks" />
        <select id="tag-filter" aria-label="Filter by tag">
          <option value="">All tags</option>
        </select>
      </div>

      <!-- List -->
      <section id="list" class="list" aria-live="polite"></section>
      <div id="empty-state" class="empty-state" hidden></div>
    </main>

    <!-- Edit dialog -->
    <dialog id="edit-dialog" class="edit-dialog">
      <form id="edit-form" method="dialog">
        <h2>Edit bookmark</h2>
        <label>Address<input id="edit-url" type="text" required /></label>
        <label>Title<input id="edit-title" type="text" /></label>
        <label>Description<textarea id="edit-description" rows="3"></textarea></label>
        <label>Notes<input id="edit-notes" type="text" /></label>
        <label>Tags (comma separated)<input id="edit-tags" type="text" /></label>
        <p id="edit-error" class="error-msg" role="alert" hidden></p>
        <div class="edit-actions">
          <button type="button" id="edit-delete" class="danger">Delete</button>
          <span class="spacer"></span>
          <button type="button" id="edit-cancel">Cancel</button>
          <button type="button" id="edit-save" class="primary">Save changes</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
