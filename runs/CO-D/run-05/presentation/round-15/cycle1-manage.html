<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks — delete & put away</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#6b7480; --line:#e6e9ee;
    --accent:#2f6df6; --flash:#fff6d6; --chip:#eef1f6; --chipink:#3a4658; --mark:#fff1a8;
    --read:#2a9d55; --danger:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:40px 20px 100px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .saver { display:flex; gap:10px; margin-bottom:14px; }
  .saver input { flex:1; padding:13px 15px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); outline:none; }
  .saver button { padding:0 20px; font-size:15px; font-weight:600; color:#fff;
    background:var(--accent); border:none; border-radius:10px; cursor:pointer; }
  .searchwrap { position:relative; margin-bottom:16px; }
  .searchwrap .ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .searchwrap input { width:100%; padding:11px 38px 11px 40px; font-size:14.5px; border:1px solid var(--line);
    border-radius:10px; background:#fbfcfe; outline:none; }
  .searchwrap .clr { position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none;
    background:none; color:var(--muted); cursor:pointer; font-size:18px; display:none; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 16px; }

  .filterbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 6px; }
  .filterbar .fb { border:1px solid var(--line); background:#fff; color:var(--chipink); border-radius:999px;
    padding:6px 13px; font:inherit; font-size:13px; cursor:pointer; }
  .filterbar .fb:hover { border-color:#cdd3db; }
  .filterbar .fb.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .filterbar .fb.toread { border-color:#d9c68a; color:#8a6d1f; font-weight:600; }
  .filterbar .fb.toread.on { background:#caa93f; border-color:#caa93f; color:#fff; }
  .filterbar .fb.away { border-color:#c9ccd1; color:#6b7480; margin-left:auto; }
  .filterbar .fb.away.on { background:#6b7480; border-color:#6b7480; color:#fff; }
  .filterbar .fb .n { opacity:.6; margin-left:5px; }
  .filterbar .sep { width:1px; height:20px; background:var(--line); margin:0 2px; }
  .statusline { color:var(--muted); font-size:13px; margin:0 0 12px; min-height:18px; }
  .statusline b { color:var(--ink); } .statusline a { color:var(--accent); }

  ul { list-style:none; margin:0; padding:0; }
  li.item { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start;
    transition:opacity .3s,transform .3s; }
  li.item.leaving { opacity:0; transform:translateX(12px); }
  li.item.away { background:#f4f5f7; }
  .readck { flex:none; width:22px; height:22px; margin-top:5px; border-radius:50%;
    border:2px solid #cfd6df; background:#fff; cursor:pointer; display:grid; place-items:center;
    color:#fff; font-size:13px; padding:0; }
  .readck.done { background:var(--read); border-color:var(--read); }
  .readck.spacer { visibility:hidden; }
  .favicon { width:32px; height:32px; border-radius:8px; flex:none; background:#eef1f6;
    display:grid; place-items:center; font-size:16px; }
  .body { min-width:0; flex:1; }
  .title { font-weight:600; font-size:15.5px; margin:0 0 2px; }
  .title a { color:var(--ink); text-decoration:none; } .title a:hover { text-decoration:underline; }
  .desc { color:var(--muted); font-size:13.5px; margin:0 0 6px; }
  .meta { color:var(--muted); font-size:12.5px; margin:0 0 6px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .lchip { background:var(--chip); color:var(--chipink); border-radius:999px; padding:3px 10px; font-size:12.5px; cursor:pointer; }
  .state { font-size:12px; border-radius:999px; padding:2px 9px; }
  .state.toread { background:#fdf3d6; color:#8a6d1f; } .state.read { background:#e6f4ea; color:var(--read); }
  .state.away { background:#e3e5e9; color:#5b636e; }
  mark { background:var(--mark); border-radius:3px; padding:0 1px; }
  .actions { flex:none; display:flex; flex-direction:column; gap:6px; }
  .btn { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:8px;
    padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#cdd3db; color:var(--ink); }

  /* edit / manage panel */
  .mgmt { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); display:flex; gap:8px; align-items:center; }
  .mgmt .away { border:1px solid var(--line); background:#fff; color:#5b636e; border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  .mgmt .del { border:1px solid #eecbc6; background:#fff; color:var(--danger); border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; margin-left:auto; }
  .mgmt .del:hover { background:#fdf3f2; }

  .empty { text-align:center; color:var(--muted); padding:40px 20px; }

  /* undo toast */
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#1c2330; color:#fff;
    border-radius:12px; padding:12px 16px; display:none; align-items:center; gap:16px; box-shadow:0 8px 30px rgba(0,0,0,.25);
    font-size:14px; z-index:20; }
  .toast button { background:none; border:none; color:#8db4ff; font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Paste a link. It sorts itself out.</p>
    <div class="saver">
      <input id="url" type="text" placeholder="Paste a link and press Save…" autocomplete="off">
      <button id="save">Save</button>
    </div>
    <div class="searchwrap"><span class="ic">🔍</span>
      <input id="search" type="text" placeholder="Search your bookmarks…" autocomplete="off">
      <button class="clr" id="clr" title="clear">×</button>
    </div>
    <p class="hint">Click <b>Edit</b> on a link to find <b>Put away</b> and <b>Delete</b>. Delete gives you an
       <b>Undo</b> moment; Put away hides it from your list &amp; search but keeps it safe in <b>🗄 Put away</b> (top-right).</p>
    <div class="filterbar" id="filterbar"></div>
    <p class="statusline" id="statusline"></p>
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none"></div>
  </div>
  <div class="toast" id="toast"><span id="toastmsg"></span><button id="toastaction"></button></div>

<script>
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const TOREAD="__toread__", AWAY="__away__";
const items=[
  { id:"a", url:"https://cooking.nytimes.com/recipes/lemon-pasta", host:"cooking.nytimes.com", site:"NYT Cooking",
    emoji:"🍝", title:"Lemon pasta", desc:"A bright weeknight pasta with lemon and parmesan.", labels:["recipes"], toRead:false, read:false, archived:false },
  { id:"b", url:"https://www.bbc.com/news/future-of-work", host:"bbc.com", site:"BBC", emoji:"📰",
    title:"The future of work", desc:"How remote and hybrid patterns are reshaping the office.", labels:["work stuff","articles to read"], toRead:true, read:false, archived:false },
  { id:"c", url:"https://github.com/acme/dashboard", host:"github.com", site:"GitHub", emoji:"🐙",
    title:"Acme Dashboard", desc:"Internal metrics dashboard repository.", labels:["work stuff"], toRead:false, read:false, archived:false },
  { id:"d", url:"https://en.wikipedia.org/wiki/Espresso", host:"wikipedia.org", site:"Wikipedia", emoji:"📚",
    title:"Espresso", desc:"A concentrated coffee brewing method.", labels:[], toRead:true, read:false, archived:false },
  { id:"e", url:"https://example.com/old-thing", host:"example.com", site:"Example", emoji:"🔖",
    title:"An old reference I filed ages ago", desc:"Kept just in case.", labels:["work stuff"], toRead:false, read:false, archived:true },
];
const list=document.getElementById("list"), empty=document.getElementById("empty"),
  filterbar=document.getElementById("filterbar"), statusline=document.getElementById("statusline"),
  toast=document.getElementById("toast"), toastmsg=document.getElementById("toastmsg"), toastaction=document.getElementById("toastaction");
let editing=null, filter=null, query="";

function active(){ return items.filter(it=>!it.archived); }
function archived(){ return items.filter(it=>it.archived); }
function knownLabels(){ const s=new Set(); active().forEach(it=>it.labels.forEach(l=>s.add(l))); return [...s].sort(); }
function countFor(l){ return active().filter(it=>it.labels.includes(l)).length; }
function toReadCount(){ return active().filter(it=>it.toRead).length; }
function tokenize(q){ const t=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(q))!==null){ const s=(m[1]!==undefined?m[1]:m[2]).trim().toLowerCase(); if(s) t.push(s);} return t; }
function matches(it,tk){ const h=(it.title+" "+it.desc+" "+it.site).toLowerCase(); return tk.every(t=>h.includes(t)); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function hi(text,tk){ if(!tk.length) return esc(text); const re=new RegExp("("+tk.map(reEsc).join("|")+")","gi");
  const out=[]; let last=0,m; while((m=re.exec(text))!==null){ if(m.index===re.lastIndex) re.lastIndex++;
    out.push(esc(text.slice(last,m.index)),"<mark>",esc(m[0]),"</mark>"); last=m.index+m[0].length; } out.push(esc(text.slice(last))); return out.join(""); }

let toastTimer=null;
function showToast(msg,label,fn){ toastmsg.textContent=msg; toastaction.textContent=label;
  toast.style.display="flex"; clearTimeout(toastTimer);
  toastaction.onclick=()=>{ fn(); toast.style.display="none"; clearTimeout(toastTimer); };
  toastTimer=setTimeout(()=>toast.style.display="none",6000); }

function renderFilterbar(){
  filterbar.innerHTML="";
  const mk=(cls,html,on,fn)=>{ const b=document.createElement("button"); b.className="fb "+cls+(on?" on":""); b.innerHTML=html; b.onclick=fn; filterbar.appendChild(b); };
  mk("toread",`📖 To read <span class="n">${toReadCount()}</span>`, filter===TOREAD, ()=>{ filter=filter===TOREAD?null:TOREAD; query=""; document.getElementById("search").value=""; render(); });
  mk("",`All <span class="n">${active().length}</span>`, filter===null&&!query, ()=>{ filter=null; query=""; document.getElementById("search").value=""; render(); });
  if(knownLabels().length){ const s=document.createElement("span"); s.className="sep"; filterbar.appendChild(s); }
  knownLabels().forEach(l=>mk("",`${esc(l)} <span class="n">${countFor(l)}</span>`, filter===l, ()=>{ filter=filter===l?null:l; query=""; document.getElementById("search").value=""; render(); }));
  mk("away",`🗄 Put away <span class="n">${archived().length}</span>`, filter===AWAY, ()=>{ filter=filter===AWAY?null:AWAY; query=""; document.getElementById("search").value=""; render(); });
}

function render(){
  renderFilterbar();
  const tk=tokenize(query);
  let shown;
  if(filter===AWAY){ shown=archived(); }           // the back room — normal search doesn't reach here
  else if(query){ shown=active().filter(it=>matches(it,tk)); }  // search excludes put-away
  else if(filter===TOREAD){ shown=active().filter(it=>it.toRead); }
  else shown=filter?active().filter(it=>it.labels.includes(filter)):active();

  if(filter===AWAY) statusline.innerHTML=`<b>Put away</b> — hidden from your list and search, kept safe. ${shown.length} tucked away. <a href="#" id="c2">back</a>`;
  else if(query) statusline.innerHTML=`${shown.length} result${shown.length===1?"":"s"} for <b>“${esc(query)}”</b> · <a href="#" id="c2">clear</a>`;
  else if(filter===TOREAD) statusline.innerHTML= shown.length?`Your <b>to-read</b> pile — ${shown.length} to go. <a href="#" id="c2">show all</a>`:`🎉 Nothing left to read. <a href="#" id="c2">show all</a>`;
  else if(filter) statusline.innerHTML=`Showing <b>${esc(filter)}</b> — ${shown.length}. <a href="#" id="c2">show all</a>`;
  else statusline.innerHTML="";
  const c2=document.getElementById("c2"); if(c2) c2.onclick=e=>{e.preventDefault(); filter=null; query=""; document.getElementById("search").value=""; render();};

  list.innerHTML="";
  empty.style.display=shown.length?"none":"block";
  if(!shown.length) empty.textContent = filter===AWAY?"Nothing put away.":query?`No bookmarks match “${query}”.`:filter===TOREAD?"Your to-read pile is empty — nicely done.":filter?`No links labelled "${filter}".`:"Nothing saved yet. Paste your first link above.";

  shown.forEach(it=>{
    const li=document.createElement("li"); li.className="item"+(it.archived?" away":"")+(it.read?" isread":""); li.dataset.id=it.id;
    if(editing===it.id){ renderEdit(li,it); list.appendChild(li); return; }
    const ck = (it.archived) ? `<span class="readck spacer"></span>`
      : (it.toRead||it.read) ? `<button class="readck${it.read?" done":""}">${it.read?"✓":""}</button>` : `<span class="readck spacer"></span>`;
    const chips=it.labels.map(l=>`<span class="lchip" data-l="${esc(l)}">${esc(l)}</span>`).join("");
    const stateBadge = it.archived?`<span class="state away">🗄 Put away</span>`
      : it.toRead?`<span class="state toread">📖 To read</span>` : it.read?`<span class="state read">✓ Read</span>`:"";
    const rightBtn = it.archived
      ? `<button class="btn putback">↩ Put back</button><button class="btn del2" style="color:var(--danger);border-color:#eecbc6">Delete</button>`
      : `<button class="btn edit">Edit</button>`;
    li.innerHTML=`${ck}<div class="favicon">${it.emoji}</div>
      <div class="body">
        <p class="title"><a href="${it.url}" target="_blank" rel="noopener">${hi(it.title,tk)}</a></p>
        <p class="desc">${hi(it.desc,tk)}</p>
        <p class="meta">${esc(it.site)} · ${esc(it.host)}</p>
        <div class="badges">${stateBadge}${chips}</div>
      </div><div class="actions">${rightBtn}</div>`;
    const ckEl=li.querySelector(".readck:not(.spacer)"); if(ckEl) ckEl.onclick=()=>toggleRead(it,li);
    const ed=li.querySelector(".edit"); if(ed) ed.onclick=()=>{ editing=it.id; render(); };
    const pb=li.querySelector(".putback"); if(pb) pb.onclick=()=>{ it.archived=false; showToast(`Put back “${trim(it.title)}”.`,"OK",()=>{}); render(); };
    const d2=li.querySelector(".del2"); if(d2) d2.onclick=()=>del(it);
    li.querySelectorAll(".lchip").forEach(c=>c.onclick=()=>{ filter=c.dataset.l; query=""; document.getElementById("search").value=""; render(); });
    list.appendChild(li);
  });
}
function trim(s){ return s.length>34?s.slice(0,31)+"…":s; }

function toggleRead(it,li){ if(it.read){ it.read=false; it.toRead=true; render(); return; }
  it.read=true; it.toRead=false;
  if(filter===TOREAD){ li.classList.add("leaving"); setTimeout(render,300); } else render(); }

function del(it){
  const idx=items.indexOf(it); if(idx<0) return;
  const removed=items.splice(idx,1)[0]; editing=null; render();
  showToast(`Deleted “${trim(removed.title)}”.`,"Undo",()=>{ items.splice(idx,0,removed); render(); });
}

function renderEdit(li,it){
  li.innerHTML=`<span class="readck spacer"></span><div class="favicon">${it.emoji}</div>
    <div style="flex:1">
      <label style="display:block;font-size:12px;color:var(--muted);margin:0 0 3px">Title</label>
      <input class="t" style="width:100%;font:inherit;border:1px solid var(--accent);border-radius:6px;padding:6px 8px" value="${esc(it.title)}">
      <label style="display:block;font-size:12px;color:var(--muted);margin:8px 0 3px">Summary</label>
      <textarea class="d" style="width:100%;font:inherit;border:1px solid var(--accent);border-radius:6px;padding:6px 8px;min-height:44px">${esc(it.desc)}</textarea>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="done" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer">Done</button>
        <button class="cancel" style="background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:8px 6px">Cancel</button>
      </div>
      <div class="mgmt">
        <button class="away">🗄 Put away</button>
        <span style="font-size:12px;color:var(--muted)">tuck it out of sight, keep it safe</span>
        <button class="del">🗑 Delete…</button>
      </div>
    </div>`;
  li.querySelector(".t").focus();
  li.querySelector(".done").onclick=()=>{ const t=li.querySelector(".t").value.trim(), d=li.querySelector(".d").value.trim(); if(t) it.title=t; if(d) it.desc=d; editing=null; render(); };
  li.querySelector(".cancel").onclick=()=>{ editing=null; render(); };
  li.querySelector(".away").onclick=()=>{ it.archived=true; it.toRead=false; editing=null; render(); showToast(`Put “${trim(it.title)}” away. It's safe in 🗄 Put away.`,"Undo",()=>{ it.archived=false; render(); }); };
  li.querySelector(".del").onclick=()=>del(it);
  li.querySelectorAll(".t,.d").forEach(el=>el.onclick=null);
  li.querySelectorAll(".t,.d").forEach(el=>el.addEventListener("keydown",e=>{ if(e.key==="Escape"){editing=null;render();} }));
}

const search=document.getElementById("search"), clrBtn=document.getElementById("clr");
search.addEventListener("input",()=>{ query=search.value.trim(); clrBtn.style.display=query?"block":"none"; if(query&&filter===AWAY) filter=null; render(); });
clrBtn.onclick=()=>{ search.value=""; query=""; clrBtn.style.display="none"; render(); };
document.getElementById("save").onclick=()=>{ /* saving covered in earlier prototypes */ showToast("Saving is demonstrated in the earlier screens — this one focuses on delete & put-away.","OK",()=>{}); };
render();
</script>
</body>
</html>
