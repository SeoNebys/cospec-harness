<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-density="comfortable" data-text-size="medium">
  <header class="topbar">
    <h1>Bookmarks</h1>
    <form id="add-form" class="add-form" autocomplete="off">
      <input id="add-url" type="text" placeholder="Paste a link to save…" aria-label="Address to save" />
      <button type="submit">Add</button>
    </form>
    <div class="topbar-actions">
      <button id="btn-import" type="button" title="Import browser bookmarks">Import</button>
      <a id="btn-export" href="/api/export" title="Export bookmarks">Export</a>
      <button id="btn-prefs" type="button" title="Display preferences">Preferences</button>
      <input id="import-file" type="file" accept=".html,text/html" hidden />
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="views" aria-label="Views">
        <button class="view-tab active" data-view="all">All</button>
        <button class="view-tab" data-view="unread">Unread</button>
        <button class="view-tab" data-view="archived">Archived</button>
      </nav>

      <section class="panel">
        <h2>Tags</h2>
        <ul id="tag-list" class="tag-list"></ul>
      </section>

      <section class="panel">
        <h2>Saved filters</h2>
        <ul id="filter-list" class="filter-list"></ul>
        <button id="btn-save-filter" type="button" class="link-btn">Save current search…</button>
      </section>
    </aside>

    <main class="content">
      <div class="toolbar">
        <input id="search" type="search" placeholder='Search — try  #tag  "exact phrase"  (a OR b) NOT c' aria-label="Search" />
        <label class="sort">Sort
          <select id="sort">
            <option value="date_added_desc">Newest first</option>
            <option value="date_added_asc">Oldest first</option>
            <option value="title_asc">Title A–Z</option>
            <option value="title_desc">Title Z–A</option>
          </select>
        </label>
      </div>

      <div id="active-filter" class="active-filter" hidden></div>

      <div id="bulk-bar" class="bulk-bar" hidden>
        <label><input type="checkbox" id="select-all" /> <span id="sel-count">0 selected</span></label>
        <button type="button" id="bulk-select-matching" class="link-btn"></button>
        <span class="spacer"></span>
        <button type="button" data-bulk="add_tags">Add tag…</button>
        <button type="button" data-bulk="remove_tags">Remove tag…</button>
        <button type="button" data-bulk="mark_read">Mark read</button>
        <button type="button" data-bulk="mark_unread">Mark unread</button>
        <button type="button" data-bulk="archive">Archive</button>
        <button type="button" data-bulk="restore">Restore</button>
        <button type="button" data-bulk="delete" class="danger">Delete</button>
      </div>

      <ul id="bookmark-list" class="bookmark-list" aria-live="polite"></ul>
      <div id="empty-state" class="empty-state" hidden></div>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal-root" class="modal-root" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
