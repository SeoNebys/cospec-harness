<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🔖 Bookmarks</h1>
    <div class="search">
      <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" />
    </div>
  </header>

  <main>
    <section class="panel">
      <form id="form" autocomplete="off">
        <input type="hidden" id="editId" />
        <h2 id="formTitle">Add a bookmark</h2>
        <label>URL
          <input id="url" type="url" placeholder="https://example.com" required />
        </label>
        <label>Title
          <input id="title" type="text" placeholder="Example Site" required />
        </label>
        <label>Description
          <textarea id="description" rows="2" placeholder="Optional notes"></textarea>
        </label>
        <label>Tags
          <input id="tags" type="text" placeholder="comma, separated, tags" />
        </label>
        <div class="form-actions">
          <button type="submit" id="submitBtn">Save</button>
          <button type="button" id="cancelBtn" class="ghost" hidden>Cancel</button>
        </div>
        <p id="formError" class="error" role="alert"></p>
      </form>

      <div class="tagcloud" id="tagcloud"></div>
    </section>

    <section class="list-wrap">
      <div class="list-head">
        <span id="count"></span>
        <span id="activeFilter"></span>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>No bookmarks yet. Add your first one!</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
