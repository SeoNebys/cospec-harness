<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — personal notes</title><style>
:root{--ink:#17211b;--muted:#68736c;--line:#dfe5df;--paper:#fbfcf8;--green:#256b4b;--wash:#eef5ee;--note:#fff8df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5vw}.brand{font:700 21px Georgia,serif}.mark{display:inline-block;width:22px;height:27px;background:var(--green);border-radius:3px 3px 8px 8px;margin-right:10px;vertical-align:middle}main{width:min(760px,90vw);margin:auto;padding:54px 0}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.13em;text-transform:uppercase}h1{font:500 43px Georgia,serif;margin:12px 0 28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 32px rgba(30,54,40,.06)}.image{height:210px;background:url('serious-eats-preview.jpg') center/cover}.body{padding:22px}.domain{color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.card h2{font:500 25px Georgia,serif;margin:7px 0}.desc{color:var(--muted);font-size:14px;line-height:1.5;margin:0}.labels{display:flex;gap:6px;margin:13px 0}.chip{background:var(--wash);color:#315a43;padding:5px 9px;border-radius:18px;font-size:11px;font-weight:700}.add-note{border:1px solid #b8cbbd;background:#fff;color:var(--green);border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.editor{display:none;margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px}textarea{width:100%;min-height:110px;border:1px solid #b9c8bc;border-radius:10px;padding:12px;font:inherit;line-height:1.5;resize:vertical;outline:none}textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(37,107,75,.1)}.save{margin-top:9px;border:0;border-radius:9px;background:var(--green);color:#fff;padding:10px 15px;font-weight:700;cursor:pointer}.note{display:none;margin-top:18px;padding:15px 16px;background:var(--note);border-left:3px solid #d0aa35;border-radius:0 10px 10px 0}.note-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#7d681e;margin-bottom:6px}.note p{font-size:14px;line-height:1.5;margin:0}.note button{margin-top:9px;border:0;background:transparent;color:var(--green);font-weight:700;padding:0;cursor:pointer}
</style></head><body><header><div class="brand"><span class="mark"></span>Trove</div></header><main data-harness-ready="true"><div class="eyebrow">Bookmark details</div><h1>Add what matters to you.</h1><article class="card"><div class="image"></div><div class="body"><div class="domain">seriouseats.com</div><h2>Recipes I want to try</h2><p class="desc">Reliable cooking ideas for weekends.</p><div class="labels"><span class="chip">Cooking</span><span class="chip">Weekend</span></div><button class="add-note" id="add-note">Add note</button><div class="editor" id="editor"><label for="note-input">Your note</label><textarea id="note-input" placeholder="Why did you save this?"></textarea><button class="save" id="save-note">Save note</button></div><div class="note" id="note"><div class="note-title">Your note</div><p id="note-text"></p><button id="edit-note">Edit note</button></div></div></article></main><script>
const editor=document.querySelector('#editor'),note=document.querySelector('#note'),input=document.querySelector('#note-input');document.querySelector('#add-note').onclick=()=>{editor.style.display='block';document.querySelector('#add-note').style.display='none';input.focus()};document.querySelector('#save-note').onclick=()=>{const value=input.value.trim();if(!value){input.focus();return}document.querySelector('#note-text').textContent=value;editor.style.display='none';note.style.display='block'};document.querySelector('#edit-note').onclick=()=>{note.style.display='none';editor.style.display='block';input.focus()};
</script></body></html>
