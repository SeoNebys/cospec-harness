<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — prototype 9 (search ranking)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a2e; }
  header { background: #fff; border-bottom: 1px solid #e3e5e8; padding: 18px 28px; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .searchrow { position: relative; }
  .searchrow input { width: 100%; padding: 13px 14px 13px 42px; font-size: 16px; border: 1px solid #cfd3d8; border-radius: 10px; }
  .searchrow .mag { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9aa1ab; font-size: 17px; }
  .searchhint { font-size: 12.5px; color: #9aa1ab; margin: 8px 2px 0; }
  main { max-width: 900px; margin: 0 auto; padding: 22px 28px 60px; }
  .try { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .try .lead { font-size: 12.5px; color: #6b7280; }
  .try button { font-size: 12.5px; background: #fff; border: 1px solid #cfd3d8; border-radius: 999px; padding: 5px 12px; cursor: pointer; color: #3f4b5b; }
  .try button:hover { background: #eef1f5; }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 14px 2px; }
  .card { display: flex; gap: 14px; background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .rankwrap { display:flex; align-items:flex-start; gap: 12px; }
  .rankno { flex: none; width: 22px; text-align: center; font-size: 13px; font-weight: 700; color: #b3b8c0; padding-top: 14px; }
  .thumb { width: 96px; height: 68px; flex: none; border-radius: 8px; object-fit: cover; background: #e9ebef; }
  .body { min-width: 0; flex: 1; }
  .body .title { font-size: 16px; font-weight: 600; margin: 2px 0 4px; }
  .body .url { font-size: 12px; color: #2f6fed; margin: 0 0 5px; word-break: break-all; }
  .body .desc { font-size: 13.5px; color: #4b5563; margin: 0 0 8px; line-height: 1.45; }
  .why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .hit { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 9px; }
  .hit.strong { color: #1c4fbf; background: #e2ecff; border: 1px solid #c3d8ff; }
  .hit.body { color: #6b6455; background: #f3eede; border: 1px solid #e3d9b8; }
  .snippet { font-size: 12.5px; color: #6b7280; margin: 8px 0 0; line-height: 1.5; border-left: 3px solid #e3d9b8; padding: 2px 0 2px 10px; }
  mark { background: #fff2a8; padding: 0 1px; border-radius: 3px; }
  .divider { display: flex; align-items: center; gap: 10px; color: #9aa1ab; font-size: 12px; margin: 6px 2px 14px; }
  .divider::before, .divider::after { content: ""; height: 1px; background: #e3e5e8; flex: 1; }
  .empty { text-align: center; color: #9aa1ab; padding: 50px 0; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="searchrow"><span class="mag">⌕</span><input id="searchInput" type="text" placeholder="Search everything — title, summary, labels, and the page contents…" autocomplete="off"></div>
  <div class="searchhint">Tip: type a couple of half-remembered words — they don't have to be next to each other, or even in the same place.</div>
</header>

<main>
  <div class="try"><span class="lead">Try:</span>
    <button data-q="bread">bread</button>
    <button data-q="attention">attention</button>
    <button data-q="bread crust">bread crust</button>
    <button data-q="willpower focus">willpower focus</button>
    <button data-q="sleep memory">sleep memory</button>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<script>
const bookmarks = [
  { id:1, title:"No-Knead Bread in a Dutch Oven", url:"https://kitchenlab.example/no-knead-bread", desc:"A four-ingredient loaf with a crackly crust and open crumb.", img:"https://picsum.photos/seed/dutchoven/216/152", tags:["cooking"],
    copy:"There is almost no work in this loaf. You stir together flour, water, salt, and a pinch of yeast. The long slow rise builds an open crumb, and baking in a covered pot traps steam to give a thin, crackly crust." },
  { id:2, title:"The Article You Meant to Keep", url:"https://blog.example/great-article", desc:"A long read on focus and attention in a distracted world.", img:"https://picsum.photos/seed/focus/216/152", tags:["read"],
    copy:"We treat attention as if it were infinite. Every notification is a small withdrawal. The people who focus effortlessly are rarely more disciplined; they have built an environment where willpower is barely needed because the distractions are simply out of reach." },
  { id:3, title:"The Sourdough Starter Guide for Beginners", url:"https://kitchenlab.example/sourdough-starter", desc:"Feeding schedules, the float test, and troubleshooting a starter.", img:"https://picsum.photos/seed/bread/216/152", tags:["cooking"],
    copy:"A healthy starter is the engine of any good sourdough bread. Once it doubles reliably you can bake a loaf with a springy crumb and a deeply coloured crust. Troubleshooting mostly comes down to temperature and feeding rhythm." },
  { id:4, title:"Understanding CSS Grid Layout", url:"https://webnotes.example/css-grid", desc:"Grid areas, fractional units, and responsive galleries.", img:"https://picsum.photos/seed/grid/216/152", tags:["web dev"],
    copy:"CSS grid lets you place items into columns and rows directly. Named grid areas make complex layouts readable, and fractional units keep everything responsive without media queries." },
  { id:5, title:"Why We Sleep — key takeaways", url:"https://readingnook.example/why-we-sleep", desc:"Notes on sleep, memory, and caffeine.", img:"https://picsum.photos/seed/sleep/216/152", tags:["health","read"],
    copy:"Deep sleep is when the brain consolidates memory. Skimp on it and attention, mood, and focus all suffer the next day. Caffeine has a long half-life that quietly steals from the sleep you most need." },
  { id:6, title:"A Practical Guide to Index Funds", url:"https://moneywise.example/index-funds", desc:"Expense ratios, dollar-cost averaging, compounding.", img:"https://picsum.photos/seed/money/216/152", tags:["finance"],
    copy:"A low expense ratio compounds in your favour over decades. Most active funds fail to beat a simple broad-market index once fees are counted." },
];

const W = { title:100, summary:40, labels:40, url:20, body:10 };
const listEl=document.getElementById('list'), countEl=document.getElementById('count'), searchEl=document.getElementById('searchInput');

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hl(text,terms){ let safe=esc(text); terms.forEach(t=>{ if(!t) return; const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); safe=safe.replace(re,'<mark>$1</mark>'); }); return safe; }
function fields(b){ return { title:b.title, summary:b.desc, labels:(b.tags||[]).join(' '), url:b.url, body:b.copy }; }

function scoreOf(b, terms){
  const f=fields(b); let total=0; const perTerm=[];
  for(const term of terms){
    let best=0, bestField=null;
    for(const k in f){ if(f[k].toLowerCase().includes(term)){ if(W[k]>best){ best=W[k]; bestField=k; } } }
    if(best===0) return null;            // every word must appear somewhere (AND)
    total+=best; perTerm.push({term, field:bestField});
  }
  const strong = perTerm.some(p=>['title','summary','labels'].includes(p.field));
  return { total, perTerm, strong };
}

function snippetFor(b, terms){
  const body=b.copy; const low=body.toLowerCase();
  for(const t of terms){ const i=low.indexOf(t); if(i>=0){ const s=Math.max(0,i-40), e=Math.min(body.length,i+60); return (s>0?'…':'')+body.slice(s,e)+(e<body.length?'…':''); } }
  return '';
}

function render(){
  const q=searchEl.value.trim();
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  let results = bookmarks.map(b=>({b, s: terms.length?scoreOf(b,terms):{total:0,perTerm:[],strong:true}})).filter(r=>r.s!==null);
  results.sort((a,b)=> b.s.total-a.s.total || a.b.id-b.b.id);

  if(terms.length && results.length===0){ countEl.textContent=''; listEl.innerHTML='<div class="empty">Nothing matched “'+esc(q)+'”.</div>'; return; }
  countEl.textContent = terms.length ? results.length+' of '+bookmarks.length+' match, best first' : bookmarks.length+' saved';

  let firstWeakShown=false, html='';
  results.forEach((r,idx)=>{
    const b=r.b, strong=r.s.strong;
    if(terms.length && !strong && !firstWeakShown && idx>0){ firstWeakShown=true; html+='<div class="divider">matched only inside the page contents — further down on purpose</div>'; }
    const hits = terms.length ? r.s.perTerm.map(p=>{
      const label = p.field==='title'?'in title':p.field==='summary'?'in summary':p.field==='labels'?'in label':p.field==='url'?'in link':'in page text';
      const cls = ['title','summary','labels'].includes(p.field)?'strong':'body';
      return `<span class="hit ${cls}">“${esc(p.term)}” ${label}</span>`;
    }).join('') : '';
    const showSnip = terms.length && !strong;
    html+=`
    <div class="card">
      <div class="rankwrap">
        ${terms.length?`<div class="rankno">${idx+1}</div>`:''}
        <img class="thumb" src="${b.img}">
        <div class="body">
          <div class="title">${hl(b.title,terms)}</div>
          <div class="url">${esc(b.url)}</div>
          <div class="desc">${hl(b.desc,terms)}</div>
          <div class="why">${hits}</div>
          ${showSnip?`<p class="snippet">${hl(snippetFor(b,terms),terms)}</p>`:''}
        </div>
      </div>
    </div>`;
  });
  listEl.innerHTML=html;
}

searchEl.addEventListener('input',render);
document.querySelectorAll('.try button').forEach(btn=>btn.addEventListener('click',()=>{ searchEl.value=btn.dataset.q; searchEl.focus(); render(); }));
render();
</script>
</body>
</html>
