<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Bookmarks</h1>
      <p class="tagline">Save a page, get back to it later.</p>
    </header>

    <main class="layout" id="app">
      <section class="panel add-panel">
        <h2>Add a bookmark</h2>
        <form id="add-form" class="bookmark-form" autocomplete="off">
          <label>
            Web address
            <input type="text" name="url" id="add-url" placeholder="example.com" required />
          </label>
          <label>
            Title <span class="optional">(optional)</span>
            <input type="text" name="title" id="add-title" placeholder="Page title" />
          </label>
          <label>
            Tags <span class="optional">(comma separated)</span>
            <input type="text" name="tags" id="add-tags" placeholder="reading, reference" />
          </label>
          <label>
            Notes <span class="optional">(optional)</span>
            <textarea name="notes" id="add-notes" rows="2"></textarea>
          </label>
          <p class="form-error" id="add-error" role="alert" hidden></p>
          <p class="form-warning" id="add-warning" role="status" hidden></p>
          <button type="submit">Save bookmark</button>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="list-controls">
          <input
            type="search"
            id="search"
            placeholder="Search title, address, notes or tags…"
            aria-label="Search bookmarks"
          />
          <select id="tag-filter" aria-label="Filter by tag">
            <option value="">All tags</option>
          </select>
        </div>

        <ul id="bookmark-list" class="bookmark-list"></ul>

        <div id="empty-state" class="state" hidden>
          <p>No bookmarks yet.</p>
          <p class="muted">Add your first one using the form on the left.</p>
        </div>
        <div id="no-results" class="state" hidden>
          <p>No bookmarks match your search.</p>
          <p class="muted">Try a different keyword or clear the tag filter.</p>
        </div>
      </section>
    </main>

    <!-- Edit dialog -->
    <dialog id="edit-dialog">
      <form id="edit-form" class="bookmark-form" method="dialog">
        <h2>Edit bookmark</h2>
        <input type="hidden" name="id" id="edit-id" />
        <label>
          Web address
          <input type="text" name="url" id="edit-url" required />
        </label>
        <label>
          Title <span class="optional">(optional)</span>
          <input type="text" name="title" id="edit-title" />
        </label>
        <label>
          Tags <span class="optional">(comma separated)</span>
          <input type="text" name="tags" id="edit-tags" />
        </label>
        <label>
          Notes <span class="optional">(optional)</span>
          <textarea name="notes" id="edit-notes" rows="2"></textarea>
        </label>
        <p class="form-error" id="edit-error" role="alert" hidden></p>
        <menu class="dialog-actions">
          <button type="button" id="edit-cancel" class="secondary">Cancel</button>
          <button type="submit" value="save">Save changes</button>
        </menu>
      </form>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
