<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — Search everything you remember</title>
  <style>
    :root{--ink:#17231e;--muted:#68736d;--paper:#f5f2e9;--card:#fffdf7;--line:#d9d5ca;--green:#235d45;--pale:#e0eee5}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 82% 5%,#dce8dd,transparent 30rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,sans-serif}input{font:inherit}.shell{width:min(980px,calc(100% - 44px));margin:auto;padding-bottom:70px}header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(23,35,30,.1)}.brand{display:flex;align-items:center;font-weight:760}.mark{width:34px;height:34px;margin-right:10px;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:11px}.count{color:var(--muted);font-size:13px}main{padding-top:55px}h1{margin:0;font:500 51px/1 Georgia,serif;letter-spacing:-.04em}.lead{margin:12px 0 31px;color:var(--muted);font-size:17px}.search{display:flex;align-items:center;gap:10px;padding:10px 15px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 13px 38px rgba(36,48,41,.08)}.search svg{color:var(--muted);flex:none}.search input{width:100%;padding:7px 0;border:0;outline:0;color:var(--ink);background:transparent;font-size:16px}.scope{margin:10px 4px 36px;color:var(--muted);font-size:12px}.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.head h2{margin:0;font:500 27px Georgia,serif}.head span{color:var(--muted);font-size:13px}.list{display:grid;gap:11px}.card{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:start;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.thumb{width:54px;height:54px;display:grid;place-items:center;border-radius:11px;background:#f1d9b7;font:24px Georgia,serif}.thumb.blue{background:#dce7ed}.thumb.rose{background:#ebdcd4}.card h3{margin:0 0 5px;font-size:15px}.card p{margin:0 0 8px;color:var(--muted);font-size:12px;line-height:1.45}.domain{color:var(--green);font-size:11px;font-weight:700}.note{margin-top:10px!important;padding:8px 10px;border-left:2px solid #a7c4b3;background:#f1f6f2;color:#41584c!important;border-radius:0 7px 7px 0}.date{color:var(--muted);font-size:11px}.empty{display:none;padding:48px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.match{display:inline-block;margin-left:7px;padding:3px 6px;color:var(--green);background:var(--pale);border-radius:999px;font-size:9px;font-weight:750;text-transform:uppercase;letter-spacing:.06em}@media(max-width:640px){.card{grid-template-columns:45px 1fr}.thumb{width:45px;height:45px}.date{display:none}}
  </style>
</head>
<body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark">T</span>Trove</div><span class="count">3 saved links</span></header><main>
    <h1>Find it when you need it.</h1><p class="lead">Search with whatever fragment you still remember.</p>
    <label class="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="query" aria-label="Search saved links" placeholder="Search saved links" autofocus></label>
    <p class="scope">Looks through titles, descriptions, notes, and web addresses.</p>
    <div class="head"><h2>All bookmarks</h2><span id="resultCount">3 links · newest first</span></div><div class="list" id="list"></div><div class="empty" id="empty">No saved links match that search.</div>
  </main></div>
  <script>
    const items=[
      {letter:'R',tone:'',title:'My perfect risotto guide',description:'A careful guide to creamy, deeply flavorful risotto.',url:'https://www.seriouseats.com/how-to-make-perfect-risotto-recipe',domain:'seriouseats.com',note:'Try this for Sunday dinner.',date:'3 days ago'},
      {letter:'B',tone:'blue',title:'A loaf for every weekend',description:'Approachable bread recipes and home baking notes.',url:'https://www.theperfectloaf.com/beginners-sourdough-bread/',domain:'theperfectloaf.com',note:'Scale this down for weeknight cooking.',date:'1 week ago'},
      {letter:'D',tone:'rose',title:'Designing calmer workdays',description:'Practical ideas for focus, attention, and sustainable routines.',url:'https://nesslabs.com/mindful-productivity',domain:'nesslabs.com',note:'Discuss with the team next month.',date:'2 weeks ago'}
    ];
    const input=document.querySelector('#query'),list=document.querySelector('#list'),empty=document.querySelector('#empty'),resultCount=document.querySelector('#resultCount');
    function render(){const q=input.value.trim().toLowerCase();const found=items.filter(x=>[x.title,x.description,x.note,x.url].join(' ').toLowerCase().includes(q));list.innerHTML=found.map(x=>`<article class="card"><div class="thumb ${x.tone}">${x.letter}</div><div><h3>${x.title}</h3><p>${x.description}</p><span class="domain">${x.domain}</span>${x.note?`<p class="note">${x.note}</p>`:''}</div><span class="date">${x.date}</span></article>`).join('');resultCount.textContent=`${found.length} ${found.length===1?'link':'links'} · newest first`;empty.style.display=found.length?'none':'block'}
    input.addEventListener('input',render);render();
  </script>
</body>
</html>
