<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 05 (find + sort)</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#3b5bdb; --bg:#f7f7f9; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         margin:0; background:var(--bg); color:#1a1a1e; }
  .top { background:#fff; border-bottom:1px solid var(--line); padding:16px 22px; }
  .top h1 { font-size:19px; margin:0 0 12px; }
  .searchbar { position:relative; max-width:560px; }
  #search { width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line);
            border-radius:22px; font-size:14px; }
  .searchbar .icon { position:absolute; left:13px; top:10px; color:var(--muted); }
  .active { margin-top:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;
            font-size:13px; color:var(--muted); min-height:24px; }
  .active .fchip { background:#eaefff; color:var(--accent); border-radius:14px;
            padding:3px 10px; display:inline-flex; gap:6px; align-items:center; }
  .active .fchip button { border:0; background:transparent; color:var(--accent);
            cursor:pointer; font-size:14px; line-height:1; padding:0; }
  .active .clear { border:0; background:transparent; color:var(--accent);
            cursor:pointer; text-decoration:underline; font-size:13px; }

  .layout { display:flex; max-width:1040px; margin:0 auto; gap:24px; padding:22px; align-items:flex-start; }
  .side { width:210px; flex:none; background:#fff; border:1px solid var(--line);
          border-radius:12px; padding:12px; position:sticky; top:22px; }
  .side h2 { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); margin:4px 6px 10px; }
  .side .lbl { display:flex; justify-content:space-between; align-items:center;
             padding:7px 9px; border-radius:8px; font-size:14px; cursor:pointer; }
  .side .lbl:hover { background:#f2f3f7; }
  .side .lbl.on { background:var(--accent); color:#fff; }
  .side .lbl .n { font-size:12px; color:var(--muted); }
  .side .lbl.on .n { color:#dfe6ff; }
  .side .all { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; }

  .main { flex:1; min-width:0; }
  .mainhead { display:flex; justify-content:space-between; align-items:center; margin:2px 2px 14px; }
  .count { font-size:13px; color:var(--muted); }
  .sortwrap { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .sortwrap select { font-size:13px; padding:6px 8px; border:1px solid var(--line);
            border-radius:8px; background:#fff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:10px; }
  .card .title { font-size:15px; font-weight:600; margin:0 0 2px; }
  .card .url { font-size:12px; color:var(--accent); word-break:break-all; }
  .card .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .card .desc { font-size:13px; color:#3a3a42; margin:8px 0 0; }
  .card .lbls { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .card .lbls span { background:#eef0f4; color:#444; border-radius:12px; padding:2px 9px;
          font-size:12px; cursor:pointer; }
  .card .lbls span.match { background:#eaefff; color:var(--accent); }
  mark { background:#fff3bf; border-radius:3px; padding:0 1px; }
  .empty { background:#fff; border:1px dashed var(--line); border-radius:10px;
          padding:30px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
  <div class="top">
    <h1>My Bookmarks</h1>
    <div class="searchbar">
      <span class="icon">⌕</span>
      <input id="search" type="text" placeholder="Search everything — titles, descriptions, addresses, labels…" autocomplete="off" />
    </div>
    <div class="active" id="activeRow"></div>
  </div>

  <div class="layout">
    <div class="side">
      <h2>Labels</h2>
      <div id="labels"></div>
      <div class="all"><div class="lbl" id="showAll">All bookmarks <span class="n" id="allN"></span></div></div>
    </div>
    <div class="main">
      <div class="mainhead">
        <div class="count" id="count"></div>
        <div class="sortwrap">
          <label for="sort">Sort</label>
          <select id="sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="az">Title A–Z</option>
          </select>
        </div>
      </div>
      <div id="cards"></div>
    </div>
  </div>

<script>
  const DATA = [
    {t:"Simplest Brothy Beans and Rice", u:"smittenkitchen.com/beans", dt:"2026-07-12",
     d:"A weeknight one-pot dinner: creamy beans simmered with garlic and herbs over rice.", l:["recipes","dinner"]},
    {t:"Sheet-Pan Chicken with Lemon and Potatoes", u:"cooking.nytimes.com/sheet-pan-chicken", dt:"2026-06-29",
     d:"Everything roasts on one tray for an easy dinner with almost no cleanup.", l:["recipes","dinner"]},
    {t:"The Best Banana Bread", u:"kingarthurbaking.com/banana-bread", dt:"2026-06-18",
     d:"A moist, deeply banana-flavored loaf. Uses very ripe bananas and a little brown butter.", l:["recipes","baking"]},
    {t:"Overnight Oats, Five Ways", u:"minimalistbaker.com/overnight-oats", dt:"2026-07-02",
     d:"Make-ahead breakfast you assemble the night before. No cooking required.", l:["recipes","breakfast"]},
    {t:"ripgrep — recursively search directories for a regex pattern", u:"github.com/BurntSushi/ripgrep", dt:"2026-07-08",
     d:"A line-oriented search tool that recursively searches your directory for a regex pattern, respecting gitignore.", l:["tools","coding"]},
    {t:"Use The Index, Luke — a guide to database performance", u:"use-the-index-luke.com", dt:"2026-06-22",
     d:"How database indexes work and how to design them so your queries stay fast as data grows.", l:["coding","reference"]},
    {t:"Figma: the collaborative interface design tool", u:"figma.com", dt:"2026-06-15",
     d:"Design, prototype, and gather feedback all in one place.", l:["design","tools","work"]},
    {t:"How to Read More Books This Year", u:"nytimes.com/read-more-books", dt:"2026-07-10",
     d:"Practical habits from lifelong readers for fitting more reading into a busy schedule.", l:["reading","articles"]},
    {t:"The Case for Slow Reading", u:"theatlantic.com/slow-reading", dt:"2026-06-25",
     d:"A longform essay on why reading slowly and rereading can matter more than volume.", l:["reading","articles"]},
    {t:"A Perfect Day in Kyoto", u:"nationalgeographic.com/kyoto", dt:"2026-07-05",
     d:"A walking itinerary through temples, gardens, and the best places to eat along the way.", l:["travel"]},
    {t:"How to Find Cheap Flights", u:"nomadicmatt.com/cheap-flights", dt:"2026-06-20",
     d:"Strategies for tracking fares, using flexible dates, and booking at the right time.", l:["travel","finance"]},
    {t:"Obsidian — a knowledge base on local Markdown files", u:"obsidian.md", dt:"2026-06-30",
     d:"A note-taking app for linking your thinking, stored as plain files you own.", l:["tools","reference"]},
    {t:"Raycast — a blazingly fast launcher", u:"raycast.com", dt:"2026-07-01",
     d:"Control your tools with a few keystrokes: launch apps, run scripts, search everything.", l:["tools"]},
    {t:"A Beginner's Marathon Training Plan", u:"runnersworld.com/marathon-plan", dt:"2026-06-17",
     d:"An 18-week schedule building from a base of a few miles up to race day.", l:["health"]},
    {t:"Why We Sleep, summarized", u:"blas.com/why-we-sleep", dt:"2026-07-06",
     d:"Key takeaways on how sleep affects memory, mood, and long-term health.", l:["health","reading"]},
    {t:"The Cost of Living Alone, Explained", u:"vox.com/cost-of-living-alone", dt:"2026-06-27",
     d:"How housing and everyday expenses add up differently for solo households.", l:["finance","articles"]},
    {t:"A Field Guide to Houseplants That Survive Neglect", u:"gardenista.com/tough-houseplants", dt:"2026-06-13",
     d:"Low-light, low-water plants that tolerate a forgetful owner.", l:["garden","home"]},
    {t:"Best Noise-Cancelling Headphones", u:"wirecutter.com/headphones", dt:"2026-07-09",
     d:"Independent testing of the top picks for commuting, focus, and travel.", l:["shopping","reference"]},
    {t:"An Interactive Introduction to CSS Grid", u:"css-tricks.com/css-grid", dt:"2026-06-24",
     d:"Learn grid layout by example, with live editable demos for each property.", l:["coding","reference","design"]},
    {t:"Homemade Pizza Dough, No-Knead", u:"kingarthurbaking.com/pizza-dough", dt:"2026-07-11",
     d:"A slow-rise dough you mix in minutes for a weekend dinner. Rests overnight.", l:["recipes","baking","dinner"]}
  ];

  const norm = s => s.toLowerCase();
  const counts = {};
  DATA.forEach(b=>b.l.forEach(l=>counts[l]=(counts[l]||0)+1));
  const allLabels = Object.keys(counts).sort((a,b)=>counts[b]-counts[a] || a.localeCompare(b));

  let activeLabels = new Set();
  let query = "";
  let sort = "new";

  const labelsEl=document.getElementById("labels"), cardsEl=document.getElementById("cards"),
        countEl=document.getElementById("count"), activeRow=document.getElementById("activeRow"),
        searchEl=document.getElementById("search"), showAll=document.getElementById("showAll"),
        allN=document.getElementById("allN"), sortEl=document.getElementById("sort");
  allN.textContent=DATA.length;

  function fmtDate(iso){
    const [y,m,d]=iso.split("-").map(Number);
    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return "Saved "+months[m-1]+" "+d;
  }

  function renderLabels(){
    labelsEl.innerHTML="";
    allLabels.forEach(l=>{
      const d=document.createElement("div");
      d.className="lbl"+(activeLabels.has(l)?" on":"");
      d.innerHTML='<span>'+l+'</span><span class="n">'+counts[l]+'</span>';
      d.addEventListener("click",()=>{ activeLabels.has(l)?activeLabels.delete(l):activeLabels.add(l); render(); });
      labelsEl.appendChild(d);
    });
    showAll.classList.toggle("on", activeLabels.size===0 && !query);
  }

  function matchesQuery(b,q){
    if(!q) return true;
    const hay=[b.t,b.d,b.u,...b.l].join(" ").toLowerCase();
    return q.split(/\s+/).filter(Boolean).every(term=>hay.includes(term));
  }
  function hasAllLabels(b){ for(const l of activeLabels) if(!b.l.includes(l)) return false; return true; }

  function sortResults(list){
    const s=[...list];
    if(sort==="new") s.sort((a,b)=>b.dt.localeCompare(a.dt));
    else if(sort==="old") s.sort((a,b)=>a.dt.localeCompare(b.dt));
    else s.sort((a,b)=>a.t.localeCompare(b.t));
    return s;
  }

  function hl(text,q){
    if(!q) return escapeHtml(text);
    let out=escapeHtml(text);
    q.split(/\s+/).filter(Boolean).forEach(term=>{
      const re=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
      out=out.replace(re,"<mark>$1</mark>");
    });
    return out;
  }
  function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  function render(){
    const q=norm(query.trim());
    let results=DATA.filter(b=>hasAllLabels(b) && matchesQuery(b,q));
    results=sortResults(results);

    activeRow.innerHTML="";
    if(activeLabels.size===0 && !q){ activeRow.textContent="Showing everything."; }
    else {
      [...activeLabels].forEach(l=>{
        const c=document.createElement("span"); c.className="fchip";
        c.innerHTML=l+' <button title="remove">×</button>';
        c.querySelector("button").addEventListener("click",()=>{activeLabels.delete(l);render();});
        activeRow.appendChild(c);
      });
      if(q){ const c=document.createElement("span"); c.className="fchip";
        c.innerHTML='“'+escapeHtml(query.trim())+'” <button title="clear">×</button>';
        c.querySelector("button").addEventListener("click",()=>{query="";searchEl.value="";render();});
        activeRow.appendChild(c); }
      const clr=document.createElement("button"); clr.className="clear"; clr.textContent="clear all";
      clr.addEventListener("click",()=>{activeLabels.clear();query="";searchEl.value="";render();});
      activeRow.appendChild(clr);
    }

    countEl.textContent = results.length+(results.length===1?" bookmark":" bookmarks")+
      (activeLabels.size||q ? " match" : "");

    if(!results.length){
      cardsEl.innerHTML='<div class="empty">Nothing matches that yet.<br>Try removing a label or a search word.</div>';
      renderLabels(); return;
    }
    cardsEl.innerHTML="";
    results.forEach(b=>{
      const c=document.createElement("div"); c.className="card";
      c.innerHTML='<p class="title">'+hl(b.t,q)+'</p>'+
        '<div class="url">'+hl(b.u,q)+'</div>'+
        '<div class="meta">'+fmtDate(b.dt)+'</div>'+
        '<p class="desc">'+hl(b.d,q)+'</p>'+
        '<div class="lbls">'+b.l.map(l=>'<span class="'+(activeLabels.has(l)?"match":"")+'" data-l="'+l+'">'+l+'</span>').join('')+'</div>';
      c.querySelectorAll("[data-l]").forEach(s=>s.addEventListener("click",()=>{
        const l=s.dataset.l; activeLabels.has(l)?activeLabels.delete(l):activeLabels.add(l); render();
      }));
      cardsEl.appendChild(c);
    });
    renderLabels();
  }

  searchEl.addEventListener("input",e=>{ query=e.target.value; render(); });
  showAll.addEventListener("click",()=>{ activeLabels.clear(); query=""; searchEl.value=""; render(); });
  sortEl.addEventListener("change",e=>{ sort=e.target.value; render(); });
  render();
</script>
</body>
</html>
