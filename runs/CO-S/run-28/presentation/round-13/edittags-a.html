<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit tags — Version A (edit form)</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--muted:#6b7684;--line:#e3e7ec;--accent:#2f6bff;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;}
  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;}
  header.top h1{font-size:18px;margin:0;}
  header.top .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);}
  .badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
  main{max-width:760px;margin:0 auto;padding:20px;}
  .section-label{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:0 2px 12px;}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  li.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;}
  .titlerow{display:flex;align-items:center;gap:8px;}
  li.item .title{font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;}
  .pencil{border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;padding:4px;border-radius:8px;}
  .pencil:hover{background:#eef1f5;color:var(--ink);}
  li.item .url{font-size:13px;color:var(--muted);word-break:break-all;margin-top:2px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .chip{font-size:12px;background:#eef1f5;color:#48566a;border-radius:999px;padding:3px 10px;}
  .editform{display:flex;flex-direction:column;gap:10px;}
  .editform label{font-size:12px;color:var(--muted);font-weight:600;}
  .editform input{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:9px;outline:none;}
  .editform input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.12);}
  .tagfield{position:relative;}
  .suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:9;overflow:hidden;display:none;}
  .suggest.open{display:block;}
  .suggest .opt{padding:9px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;}
  .suggest .opt:hover{background:#eef1f5;}
  .suggest .cnt{color:var(--muted);font-size:12px;}
  .actions{display:flex;gap:8px;margin-top:2px;}
  .save{padding:9px 16px;border:none;background:var(--accent);color:#fff;font-weight:600;border-radius:9px;cursor:pointer;}
  .cancel{padding:9px 14px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;cursor:pointer;}
</style>
</head>
<body>
  <header class="top"><div class="dot"></div><h1>My Bookmarks</h1><span class="badge">Version A · one edit form</span></header>
  <main>
    <div class="section-label">Recent</div>
    <ul class="list" id="list"></ul>
  </main>
<script>
  const items=[
    {url:'https://en.wikipedia.org/wiki/Bookmark',title:'Bookmark - Wikipedia',tags:['reading','referance'],editing:false},
    {url:'https://developer.mozilla.org/en-US/docs/Web/JavaScript',title:'JavaScript | MDN',tags:['work'],editing:false},
  ];
  const listEl=document.getElementById('list');
  function allTags(){const c={};items.forEach(i=>i.tags.forEach(t=>c[t]=(c[t]||0)+1));return c;}
  function render(){
    listEl.innerHTML='';
    items.forEach(it=>{
      const li=document.createElement('li');li.className='item';
      if(it.editing){
        li.innerHTML=`<div class="editform">
          <div><label>Title</label><input class="ftitle" value="${it.title.replace(/"/g,'&quot;')}" /></div>
          <div class="tagfield"><label>Tags (comma-separated)</label><input class="ftags" value="${it.tags.join(', ')}" /><div class="suggest"></div></div>
          <div class="actions"><button class="save">Save</button><button class="cancel">Cancel</button></div>
        </div>`;
        const ftitle=li.querySelector('.ftitle');const ftags=li.querySelector('.ftags');const sug=li.querySelector('.suggest');
        const commit=()=>{const t=ftitle.value.trim();if(t)it.title=t;it.tags=ftags.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);it.editing=false;render();};
        li.querySelector('.save').onclick=commit;
        li.querySelector('.cancel').onclick=()=>{it.editing=false;render();};
        function showSug(){
          const parts=ftags.value.split(',');const frag=parts[parts.length-1].trim().toLowerCase();
          const already=ftags.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
          const c=allTags();let opts=Object.keys(c).filter(t=>t.includes(frag)&&!already.slice(0,-1).includes(t));
          if(frag==='')opts=Object.keys(c).filter(t=>!already.slice(0,-1).includes(t));
          opts=opts.sort((a,b)=>c[b]-c[a]).slice(0,6);
          if(!opts.length){sug.classList.remove('open');return;}
          sug.innerHTML=opts.map(t=>`<div class="opt" data-t="${t}">#${t}<span class="cnt">${c[t]} saved</span></div>`).join('');
          sug.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{const p=ftags.value.split(',');p[p.length-1]=o.dataset.t;ftags.value=p.map(x=>x.trim()).filter(Boolean).join(', ')+', ';sug.classList.remove('open');ftags.focus();});
          sug.classList.add('open');
        }
        ftags.addEventListener('input',showSug);ftags.addEventListener('focus',showSug);
        ftags.addEventListener('blur',()=>setTimeout(()=>sug.classList.remove('open'),150));
        setTimeout(()=>{ftitle.focus();},0);
      }else{
        const chips=it.tags.map(t=>`<span class="chip">#${t}</span>`).join('');
        li.innerHTML=`<div class="titlerow"><a class="title" href="${it.url}" target="_blank" rel="noopener">${it.title}</a><button class="pencil" title="Edit">✎</button></div><div class="url">${it.url}</div><div class="chips">${chips}</div>`;
        li.querySelector('.pencil').onclick=()=>{items.forEach(x=>x.editing=false);it.editing=true;render();};
      }
      listEl.appendChild(li);
    });
  }
  render();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
