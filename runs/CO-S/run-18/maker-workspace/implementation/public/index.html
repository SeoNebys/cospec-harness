<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keepmark</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/" aria-label="Keepmark home"><span class="brand-mark"></span><span>Keepmark</span></a><span class="personal">Personal library</span></header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Library sections">
      <nav id="sections">
        <button class="nav-item active" data-section="active"><span>All bookmarks</span><span class="nav-count" id="active-count">0</span></button>
        <button class="nav-item" data-section="read-later"><span>Read later</span><span class="nav-count" id="read-later-count">0</span></button>
        <button class="nav-item" data-section="archive"><span>Archive</span><span class="nav-count" id="archive-count">0</span></button>
      </nav>
      <section class="tag-panel" id="tag-panel"><div class="side-title">Tags</div><div id="tag-filters"></div></section>
    </aside>
    <main id="main">
      <section class="page-heading"><div><div class="eyebrow" id="eyebrow">Your bookmark library</div><h1 id="section-title">All bookmarks</h1><p id="section-subtitle">The useful parts of the web, kept close.</p></div><button class="outline-button" id="open-save">＋ Save a link</button></section>
      <section class="save-panel" id="save-panel" aria-labelledby="save-title">
        <div class="save-heading"><div><div class="eyebrow">Quick capture</div><h2 id="save-title">Save a link</h2></div><button class="icon-button" id="close-save" aria-label="Close save form">×</button></div>
        <form id="save-form" novalidate>
          <div class="url-row"><div class="field-grow"><label for="url">Web address</label><input id="url" name="url" placeholder="https://example.com/article" autocomplete="off" aria-describedby="url-error"><p class="field-error" id="url-error"></p></div><button class="primary-button save-submit" type="submit">Save link</button></div>
          <div class="save-options">
            <div class="tag-entry-wrap"><label for="tag-entry">Tags <span>— optional</span></label><div class="tag-entry" id="tag-entry-box"><div id="pending-tags"></div><input id="tag-entry" placeholder="Type a tag and press Enter" autocomplete="off"></div><div class="suggestion-row" id="suggestions"></div></div>
            <div><button class="text-button" type="button" id="add-note">＋ Add a note</button><div class="note-field" id="note-field"><label for="note">Your note <span>— optional</span></label><textarea id="note" placeholder="What do you want to remember?"></textarea></div></div>
            <label class="check-label"><input type="checkbox" id="read-later"> <span>Add to Read later</span></label>
          </div>
        </form>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <label class="search-wrap"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Search titles, notes, addresses, and tags…" aria-label="Search bookmarks"></label>
      <div class="list-head"><h2 id="list-title">Recently saved</h2><span id="result-count">0 bookmarks</span></div>
      <section class="bookmark-list" id="bookmark-list" aria-live="polite"></section>
      <div class="load-wrap"><button class="outline-button" id="load-more">Show older bookmarks</button></div>
    </main>
  </div>

  <dialog id="edit-dialog"><form method="dialog" id="edit-form"><div class="dialog-heading"><div><div class="eyebrow">Bookmark details</div><h2>Edit bookmark</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div><input id="edit-id" type="hidden"><label for="edit-title">Title</label><input id="edit-title"><label for="edit-description">Description</label><textarea id="edit-description"></textarea><label for="edit-note">Your note</label><textarea id="edit-note"></textarea><label for="edit-tags">Tags <span>— separated by commas</span></label><input id="edit-tags"><label class="check-label"><input id="edit-read-later" type="checkbox"> <span>Add to Read later</span></label><div class="dialog-actions"><button class="outline-button" value="cancel">Cancel</button><button class="primary-button" id="save-edit" value="default">Save changes</button></div></form></dialog>
  <dialog id="delete-dialog"><form method="dialog"><div class="dialog-heading"><div><div class="eyebrow danger-text">Permanent removal</div><h2 id="delete-title">Delete bookmark?</h2></div></div><p>This permanently removes the bookmark and can’t be undone.</p><div class="dialog-actions"><button class="outline-button" value="cancel">Cancel</button><button class="danger-button" id="confirm-delete" value="default">Delete permanently</button></div></form></dialog>
  <script type="module" src="/app.js"></script>
</body></html>
