<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — rough edges</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#2f6fed; --bg:#fafafb; --warn:#c0392b; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: var(--bg); color: #1c1c20; }
  .wrap { max-width: 660px; margin: 0 auto; padding: 40px 20px 90px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:8px; }
  .card .row { display:flex; gap:8px; }
  .card input { flex:1; padding:11px 13px; font-size:14.5px; border:1px solid var(--line); border-radius:8px; }
  .card input:focus { outline:none; border-color:var(--accent); }
  .card button { padding:0 18px; font-weight:600; color:#fff; background:var(--accent); border:none; border-radius:8px; cursor:pointer; }
  .card .tagline { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .card .lbl { font-size:12px; color:var(--muted); white-space:nowrap; }
  .notice { font-size:13px; margin:8px 2px 22px; min-height:18px; }
  .notice.err { color:var(--warn); }
  .notice.dup { color:#9a6a00; }
  .search { position: relative; margin-bottom: 4px; }
  .search input { width:100%; padding: 13px 14px 13px 40px; font-size: 15.5px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); }
  .count { font-size: 12.5px; color: var(--muted); margin: 12px 0 10px; min-height:16px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  li:first-child { border-top: 1px solid var(--line); }
  .favicon { width: 22px; height: 22px; flex: none; border-radius: 5px; margin-top:2px; background: #dfe3ea; display: grid; place-items: center; font-size: 11px; color: #7a8395; font-weight: 700; }
  .meta { min-width: 0; flex:1; }
  .title { font-size: 15px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title a { color: inherit; text-decoration: none; }
  .url { font-size: 12.5px; color: var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tags { margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; }
  .tags .t { font-size:11px; font-weight:600; color:#345; background:#eef2f8; border:1px solid #e0e6ef; padding:2px 9px; border-radius:12px; cursor:pointer; }
  mark { background:#fff2a8; border-radius:2px; padding:0 1px; }
  .empty { color: var(--muted); font-size: 14px; padding: 32px 0; text-align:center; border: 1px dashed var(--line); border-radius: 8px; }
  .flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%{background:#fff7d6;} 100%{background:transparent;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Same screen as before — now with a few rough edges to feel out.</p>

  <div class="card">
    <form id="adder" autocomplete="off">
      <div class="row">
        <input id="url" type="text" placeholder="Paste a link…" aria-label="Link">
        <button type="submit">Save</button>
      </div>
      <div class="tagline">
        <span class="lbl">Tags (optional):</span>
        <input id="tags" type="text" placeholder="e.g. travel, cooking" aria-label="Tags">
      </div>
    </form>
  </div>
  <p class="notice" id="notice"></p>

  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Search your links…" aria-label="Search">
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<script>
  const items = [
    {t:"How to Cook Perfect Rice Every Time — a Long, Overly Detailed Title That Just Keeps Going and Going Well Past What Fits on One Line", h:"seriouseats.com/2023/recipes/the-absolute-complete-definitive-guide-to-stovetop-rice-with-notes", tags:["cooking"]},
    {t:"Kyoto Travel Itinerary (5 days)", h:"japan-guide.com", tags:["travel","japan"]},
    {t:"Rust Ownership Explained", h:"doc.rust-lang.org", tags:["coding","rust"]},
    {t:"Index Funds for Beginners", h:"bogleheads.org", tags:["finance"]}
  ];
  const listEl=document.getElementById('list'), emptyEl=document.getElementById('empty'),
        countEl=document.getElementById('count'), qEl=document.getElementById('q'),
        urlEl=document.getElementById('url'), tagsEl=document.getElementById('tags'),
        noticeEl=document.getElementById('notice');
  function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function hl(s,q){ if(!q) return esc(s); const i=s.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(s);
    return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); }
  function looksLikeLink(u){ return /^(https?:\/\/)?[^\s.]+\.[^\s]{2,}/.test(u); }
  function hostOf(u){ try{ return new URL(u.match(/^https?:\/\//)?u:'https://'+u).hostname.replace(/^www\./,''); }catch(e){ return u; } }
  function keyOf(u){ return u.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,'').toLowerCase(); }
  function titleGuess(u){ const seg=u.replace(/^https?:\/\//,'').split(/[?#]/)[0].split('/').filter(Boolean).slice(1).join(' / ');
    return seg ? decodeURIComponent(seg.replace(/[-_]/g,' ')).replace(/\.\w+$/,'') : hostOf(u); }
  function render(flashKey){
    const q=qEl.value.trim().toLowerCase();
    const rows=items.filter(d=>(d.t+' '+d.h+' '+d.tags.join(' ')).toLowerCase().includes(q));
    listEl.innerHTML='';
    if(!items.length){ emptyEl.style.display='block'; emptyEl.textContent='Nothing saved yet. Paste a link above to get started.'; countEl.textContent=''; return; }
    if(!rows.length){ emptyEl.style.display='block'; emptyEl.textContent='No links match “'+qEl.value.trim()+'”.'; countEl.textContent=''; return; }
    emptyEl.style.display='none';
    countEl.textContent=q?rows.length+' of '+items.length+' links':items.length+' links';
    rows.forEach(d=>{ const li=document.createElement('li');
      if(flashKey && keyOf(d.h)===flashKey) li.className='flash';
      const tagHtml=d.tags.map(t=>'<span class="t" data-tag="'+esc(t)+'">'+hl(t,q)+'</span>').join('');
      li.innerHTML='<div class="favicon">'+(d.h[0]||'?').toUpperCase()+'</div><div class="meta">'+
        '<div class="title"><a href="#">'+hl(d.t,q)+'</a></div><div class="url">'+hl(d.h,q)+'</div>'+
        (d.tags.length?'<div class="tags">'+tagHtml+'</div>':'')+'</div>';
      listEl.appendChild(li); });
    listEl.querySelectorAll('.t').forEach(el=>el.onclick=()=>{ qEl.value=el.dataset.tag; render(); qEl.focus(); });
  }
  document.getElementById('adder').addEventListener('submit',function(e){
    e.preventDefault(); noticeEl.className='notice'; noticeEl.textContent='';
    const raw=urlEl.value.trim(); if(!raw) return;
    if(!looksLikeLink(raw)){ noticeEl.className='notice err'; noticeEl.textContent="That doesn't look like a link — a link usually has a dot in it, like example.com/page. (Save blocked.)"; return; }
    const k=keyOf(raw); const dup=items.find(d=>keyOf(d.h)===k);
    if(dup){ noticeEl.className='notice dup'; noticeEl.textContent="You've already saved this one — jumping to it below instead of adding a duplicate."; qEl.value=''; render(k); return; }
    const tags=tagsEl.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    items.unshift({t:titleGuess(raw),h:hostOf(raw),tags}); urlEl.value=''; tagsEl.value=''; qEl.value='';
    render(keyOf(hostOf(raw)));
  });
  qEl.addEventListener('input',()=>render());
  render();
</script>
</body>
</html>
