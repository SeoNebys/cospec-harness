<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepwell — Empty collection</title><style>:root{--ink:#202722;--muted:#6b746e;--paper:#f4f1e9;--card:#fffdf8;--green:#315c4b;--lime:#dce7a7;--line:#d8d7ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button{font:inherit}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center;font:700 23px Georgia,serif}.mark{width:28px;height:34px;background:var(--green);border-radius:5px 5px 10px 10px;position:relative}.mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lime);top:8px;left:10px}.count{color:var(--muted);font-size:13px}.shell{display:grid;grid-template-columns:190px 1fr;gap:48px;width:min(1000px,90vw);margin:52px auto}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:9px;padding:10px 12px;display:flex;justify-content:space-between;color:var(--ink);text-align:left}.nav button.active{background:var(--green);color:white}.nav span{opacity:.65}.head h1{margin:0;font:700 42px Georgia,serif;letter-spacing:-1px}.empty{margin-top:25px;min-height:390px;display:grid;place-items:center;text-align:center;background:var(--card);border:1px dashed #cbcbc1;border-radius:17px;padding:40px}.illustration{position:relative;margin:0 auto 21px;width:86px;height:94px}.sheet{position:absolute;width:58px;height:70px;left:14px;top:8px;border:2px solid #91a092;border-radius:8px;background:#f9faf3;transform:rotate(-5deg)}.sheet:before,.sheet:after{content:"";position:absolute;height:2px;background:#c6cebb;left:12px;right:12px}.sheet:before{top:20px}.sheet:after{top:32px}.mini-mark{position:absolute;width:25px;height:34px;right:5px;bottom:3px;background:var(--green);border-radius:4px 4px 8px 8px}.empty h2{margin:0 0 7px;font:700 25px Georgia,serif}.empty p{margin:0 auto 20px;max-width:370px;color:var(--muted)}.primary{border:0;border-radius:10px;padding:12px 18px;background:var(--green);color:white;font-weight:750;cursor:pointer}@media(max-width:700px){.shell{grid-template-columns:1fr;margin-top:30px}.nav{display:flex}.head h1{font-size:36px}}</style></head><body><header><div class="brand"><span class="mark"></span>Keepwell</div><span class="count">0 bookmarks</span></header><main class="shell" data-harness-ready="true"><aside><nav class="nav"><button class="active">All bookmarks <span>0</span></button><button>Read later <span>0</span></button><button>Archive <span>0</span></button></nav></aside><section><div class="head"><h1>Your bookmarks</h1></div><div class="empty"><div><div class="illustration"><span class="sheet"></span><span class="mini-mark"></span></div><h2>Your collection starts here</h2><p>Save your first page and we’ll gather its useful details for you.</p><button class="primary" id="save">Save your first bookmark</button></div></div></section></main><script>document.querySelector('#save').onclick=()=>{location.href='index.html'};</script></body></html>
