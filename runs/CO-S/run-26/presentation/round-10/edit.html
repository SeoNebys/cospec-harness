<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edge cases — editing &amp; long text</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --accent:#2f6feb; --accent-soft:#eaf1fe; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:18px 24px; }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .wrap { max-width:760px; margin:0 auto; padding:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card .title { font-size:16px; font-weight:600; margin:0 0 4px; overflow-wrap:anywhere; }
  .card .title a { color:var(--ink); text-decoration:none; }
  .card .site { color:var(--accent); font-size:12px; margin:0 0 8px; overflow-wrap:anywhere; }
  .card .desc { color:var(--muted); font-size:13px; margin:0 0 10px; line-height:1.45; overflow-wrap:anywhere; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip { background:var(--accent-soft); color:var(--accent); font-size:12px; padding:3px 10px; border-radius:999px; display:inline-flex; gap:6px; align-items:center; }
  .chip button { border:none; background:none; color:var(--accent); cursor:pointer; font-size:13px; padding:0; }
  .note { color:#8a5a00; background:#fff8e6; border-radius:8px; padding:8px 10px; font-size:13px; margin:0 0 8px; overflow-wrap:anywhere; white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:12px; }
  .btn { border:1px solid var(--line); background:#fff; color:var(--ink); font-size:13px; padding:6px 12px; border-radius:8px; cursor:pointer; margin-top:6px; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .edit label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.03em; }
  .edit input[type=text], .edit textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  .edit textarea { min-height:60px; resize:vertical; }
  .taginput { border:1px solid var(--line); border-radius:8px; padding:6px 8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .taginput input { border:none; padding:4px; flex:1; min-width:120px; outline:none; }
  .editrow { display:flex; gap:8px; margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Prototype — editing a saved bookmark, and how long text looks</p>
</header>
<div class="wrap"><div id="list"></div></div>
<script>
  const DATA = [
    { url:"https://reactjs.org/docs/hooks-intro.html", title:"Introducing Hooks - React", site:"reactjs.org",
      desc:"Use state and other React features without writing a class.",
      tags:["frontend","react"], note:"Re-read before refactoring.", editing:false },
    { url:"https://unreachable.example/broken-page", title:"Broken Page", site:"unreachable.example",
      desc:"", tags:[], note:"", editing:false },
    { url:"https://example.org/some/really/long/path/to/an/article-about-distributed-systems-consensus",
      title:"An Exhaustive, Very Long Title About Distributed Systems Consensus, Raft, Paxos, and Why Getting Agreement Among Unreliable Machines Is Surprisingly Hard in Practice",
      site:"example.org",
      desc:"This description is intentionally long to show wrapping: it keeps going and going across several lines so we can confirm the layout stays tidy and nothing overflows off the side of the card regardless of how much text a page provides.",
      tags:["distributed-systems","reference","to-read","architecture","reading-list"],
      note:"A very long personal note as well — I want to check that my own notes wrap nicely too, even when I ramble on about why I saved this and what I hope to get out of reading it later on a quiet weekend.",
      editing:false }
  ];
  const listEl = document.getElementById("list");
  function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  function viewCard(b,i){
    return `<div class="card">
      <p class="title"><a href="${b.url}" target="_blank" rel="noreferrer">${esc(b.title)}</a></p>
      <p class="site">${esc(b.site)}</p>
      ${b.desc?`<p class="desc">${esc(b.desc)}</p>`:""}
      ${b.tags.length?`<div class="chips">${b.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}
      ${b.note?`<p class="note">📝 ${esc(b.note)}</p>`:""}
      <p class="meta">Saved recently</p>
      <button class="btn" data-edit="${i}">✎ Edit</button>
    </div>`;
  }
  function editCard(b,i){
    return `<div class="card edit" data-i="${i}">
      <label>Title</label><input type="text" class="f-title" value="${esc(b.title)}" />
      <label>Description</label><textarea class="f-desc">${esc(b.desc)}</textarea>
      <label>Tags</label>
      <div class="taginput" data-tags='${JSON.stringify(b.tags)}'>
        <input type="text" class="f-tag" placeholder="Type a tag, press Enter…" />
      </div>
      <label>Note</label><textarea class="f-note">${esc(b.note)}</textarea>
      <div class="editrow">
        <button class="btn primary" data-save="${i}">Save changes</button>
        <button class="btn" data-cancel="${i}">Cancel</button>
      </div>
    </div>`;
  }
  function render(){
    listEl.innerHTML = DATA.map((b,i)=> b.editing?editCard(b,i):viewCard(b,i)).join("");
    // wire view buttons
    listEl.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>{ DATA[+el.dataset.edit].editing=true; render(); });
    listEl.querySelectorAll("[data-cancel]").forEach(el=>el.onclick=()=>{ DATA[+el.dataset.cancel].editing=false; render(); });
    // wire edit cards
    listEl.querySelectorAll(".card.edit").forEach(cardEl=>{
      const i=+cardEl.dataset.i;
      const box=cardEl.querySelector(".taginput");
      let tags=JSON.parse(box.getAttribute("data-tags"));
      const field=box.querySelector(".f-tag");
      function renderChips(){
        box.querySelectorAll(".chip").forEach(c=>c.remove());
        tags.forEach((t,ti)=>{
          const chip=document.createElement("span"); chip.className="chip";
          chip.innerHTML=`${esc(t)} <button>×</button>`;
          chip.querySelector("button").onclick=()=>{ tags.splice(ti,1); renderChips(); };
          box.insertBefore(chip,field);
        });
        box.setAttribute("data-tags",JSON.stringify(tags));
      }
      field.addEventListener("keydown",e=>{
        if(e.key==="Enter"){ e.preventDefault(); const v=field.value.trim(); if(v&&!tags.includes(v)){tags.push(v); field.value=""; renderChips();} }
        else if(e.key==="Backspace"&&!field.value&&tags.length){ tags.pop(); renderChips(); }
      });
      box.addEventListener("click",()=>field.focus());
      renderChips();
      cardEl.querySelector("[data-save]").onclick=()=>{
        const b=DATA[i];
        b.title=cardEl.querySelector(".f-title").value.trim()||b.title;
        b.desc=cardEl.querySelector(".f-desc").value.trim();
        b.note=cardEl.querySelector(".f-note").value.trim();
        b.tags=tags.slice();
        b.editing=false; render();
      };
    });
  }
  render();
  document.body.setAttribute("data-harness-ready","true");
</script>
</body>
</html>
