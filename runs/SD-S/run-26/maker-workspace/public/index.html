<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <h1 class="brand">🔖 Bookmarks</h1>
        <form id="add-form" class="add-form" autocomplete="off">
          <input
            id="add-input"
            type="text"
            placeholder="Paste a link and press Save…"
            aria-label="Web address"
          />
          <button type="submit" id="add-btn">Save</button>
        </form>
        <div class="porting">
          <label class="btn-secondary" for="import-file">Import</label>
          <input id="import-file" type="file" accept=".html,text/html" hidden />
          <a class="btn-secondary" href="/api/export">Export</a>
        </div>
      </header>

      <div id="add-error" class="add-error" hidden></div>

      <nav class="views">
        <button class="view-tab active" data-view="all">All</button>
        <button class="view-tab" data-view="unread">Unread</button>
        <button class="view-tab" data-view="archive">Archive</button>
      </nav>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search…" aria-label="Search bookmarks" />
        <select id="tag-filter" aria-label="Filter by tag">
          <option value="">All tags</option>
        </select>
        <select id="sort" aria-label="Sort">
          <option value="created:desc">Newest first</option>
          <option value="created:asc">Oldest first</option>
          <option value="title:asc">Title A–Z</option>
          <option value="title:desc">Title Z–A</option>
        </select>
      </div>

      <main id="list" class="list" aria-live="polite"></main>
      <div id="empty" class="empty" hidden></div>
    </div>

    <!-- Detail / edit panel -->
    <div id="overlay" class="overlay" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <button id="panel-close" class="panel-close" aria-label="Close">×</button>
        <div id="panel-notice" class="panel-notice" hidden></div>
        <img id="panel-preview" class="panel-preview" alt="" hidden />
        <h2 id="panel-title" class="panel-title"></h2>
        <a id="panel-link" class="panel-link" target="_blank" rel="noopener"></a>

        <label class="field-label">Title</label>
        <input id="edit-title" type="text" />

        <label class="field-label">Description</label>
        <textarea id="edit-description" rows="3"></textarea>

        <label class="field-label">Notes</label>
        <textarea id="edit-notes" rows="3" placeholder="Your private notes…"></textarea>

        <label class="field-label">Tags (comma-separated)</label>
        <input id="edit-tags" type="text" />

        <div id="snapshot-row" class="snapshot-row"></div>

        <div class="panel-actions">
          <button id="save-edit" class="btn-primary">Save changes</button>
          <button id="toggle-read" class="btn-secondary"></button>
          <button id="toggle-archive" class="btn-secondary"></button>
          <button id="delete-btn" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
