<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — Tags</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 860px; margin: 0 auto; padding: 32px 20px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .variant { font-size: 12px; color: #2563eb; margin: 0 0 20px; font-weight: 600; }
  .tagbar { margin: 0 0 18px; }
  .chip { display: inline-block; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #d5d5d5;
    background: #fff; color: #333; cursor: pointer; margin: 0 6px 6px 0; }
  .chip:hover { border-color: #2563eb; }
  .chip.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
  .count { font-size: 12px; color: #888; margin: 0 0 10px; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  ul.list li .title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  ul.list li a { color: #2563eb; text-decoration: none; font-size: 13px; word-break: break-all; display: block; margin-bottom: 8px; }
  .itemtag { display: inline-block; font-size: 11px; background: #eef2ff; color: #4338ca; padding: 1px 8px; border-radius: 20px; margin-right: 5px; }
  .itemtag.on { background: #4338ca; color: #fff; }
</style>
</head>
<body>
  <h1>📑 My Bookmarks</h1>
  <p class="variant">Version “Tags” — a bookmark can carry several tags at once</p>
  <div class="tagbar" id="tagbar"></div>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>

  <script>
    const DATA = [
      { title: 'Bookmark - Wikipedia', url: 'https://en.wikipedia.org/wiki/Bookmark', tags: ['reference'] },
      { title: 'World News - The New York Times', url: 'https://www.nytimes.com/section/world', tags: ['news', 'read-later'] },
      { title: 'Classic Banana Bread Recipe', url: 'https://www.seriouseats.com/banana-bread', tags: ['cooking', 'recipes'] },
      { title: 'torvalds/linux - GitHub', url: 'https://github.com/torvalds/linux', tags: ['tech', 'reference'] },
      { title: 'How to Prune Tomatoes - YouTube', url: 'https://www.youtube.com/watch?v=abc', tags: ['gardening', 'video', 'cooking'] },
      { title: 'Technology - BBC News', url: 'https://www.bbc.com/news/technology', tags: ['news', 'tech'] },
    ];
    let active = null; // selected tag, or null = all
    function allTags() {
      const set = {}; DATA.forEach(d => d.tags.forEach(t => set[t] = (set[t]||0)+1));
      return Object.entries(set).sort((a,b) => a[0].localeCompare(b[0]));
    }
    function renderTags() {
      const bar = document.getElementById('tagbar'); bar.innerHTML = '';
      const all = document.createElement('span'); all.className = 'chip' + (active===null?' active':'');
      all.textContent = 'All'; all.onclick = () => { active = null; render(); }; bar.appendChild(all);
      allTags().forEach(([t, n]) => {
        const c = document.createElement('span'); c.className = 'chip' + (active===t?' active':'');
        c.textContent = t + ' · ' + n; c.onclick = () => { active = (active===t? null : t); render(); }; bar.appendChild(c);
      });
    }
    function render() {
      renderTags();
      const items = active===null ? DATA : DATA.filter(d => d.tags.includes(active));
      document.getElementById('count').textContent = items.length + (items.length===1?' bookmark':' bookmarks') + (active? ' tagged “' + active + '”' : '');
      const list = document.getElementById('list'); list.innerHTML = '';
      items.forEach(it => {
        const li = document.createElement('li');
        const tagsHtml = it.tags.map(t => '<span class="itemtag' + (t===active?' on':'') + '">' + t + '</span>').join('');
        li.innerHTML = '<div class="title">' + it.title + '</div>' +
          '<a href="' + it.url + '" target="_blank">' + it.url + '</a>' + tagsHtml;
        list.appendChild(li);
      });
    }
    render();
  </script>
</body>
</html>
