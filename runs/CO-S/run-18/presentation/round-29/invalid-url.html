<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — invalid address</title><style>
:root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--accent:#176b4d;--danger:#a33b32;--dangerwash:#faecea;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(920px,calc(100% - 40px));margin:58px auto}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:42px;letter-spacing:-.04em;margin:9px 0 13px}.intro{color:var(--muted);font-size:17px;margin:0 0 27px}.capture{display:flex;gap:10px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 35px rgba(30,55,43,.08)}.field{flex:1}.field input{width:100%;border:0;outline:0;font:inherit;font-size:16px;padding:11px 12px}.capture.error{border-color:#d78d86;box-shadow:0 0 0 3px var(--dangerwash)}.message{display:none;color:var(--danger);font-size:13px;font-weight:650;padding:3px 12px 6px}.capture.error .message{display:block}.save{align-self:start;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:720;padding:12px 20px;cursor:pointer}.head{display:flex;justify-content:space-between;margin-top:46px;padding-bottom:12px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0}.count{font-size:14px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:65px}@media(max-width:620px){header{padding:0 20px}.capture{flex-direction:column}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Personal library</div></header><main data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>Save a link</h1><p class="intro">Paste a link. Keepmark fills in the useful details so it’s ready to find later.</p><form class="capture" id="form"><div class="field"><input id="url" value="not a link" aria-label="Web address" aria-describedby="error"><div class="message" id="error">Enter a complete web address, such as https://example.com</div></div><button class="save">Save link</button></form><div class="head"><h2>All bookmarks</h2><span class="count">0 bookmarks</span></div><div class="empty">Your saved links will appear here.</div></main><script>
document.querySelector('#form').onsubmit=e=>{e.preventDefault();e.currentTarget.classList.add('error');document.querySelector('#url').focus()};document.querySelector('#url').oninput=()=>document.querySelector('#form').classList.remove('error');
</script></body></html>
