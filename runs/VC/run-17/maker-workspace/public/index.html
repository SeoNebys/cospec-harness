<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand"><span class="brand-mark">🔖</span> Bookmarks</h1>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search title, URL, description, tags…" autocomplete="off" />
      </div>
      <button id="new-btn" class="btn btn-primary">+ New bookmark</button>
    </div>
  </header>

  <main class="container">
    <div id="tag-bar" class="tag-bar" hidden></div>
    <div id="count" class="count"></div>
    <div id="list" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <p class="empty-title">No bookmarks yet</p>
      <p class="empty-sub">Add your first bookmark to get started.</p>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="modal-title">New bookmark</h2>
      <form id="form">
        <input type="hidden" id="f-id" />
        <label>URL
          <input id="f-url" type="text" placeholder="example.com" required />
        </label>
        <label>Title
          <input id="f-title" type="text" placeholder="Optional — defaults to the URL" />
        </label>
        <label>Description
          <textarea id="f-description" rows="3" placeholder="Optional notes"></textarea>
        </label>
        <label>Tags
          <input id="f-tags" type="text" placeholder="Comma separated, e.g. work, reading" />
        </label>
        <p id="form-error" class="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
