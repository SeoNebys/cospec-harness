<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-text-size="medium">
  <header class="app-header">
    <h1><a href="#/all" data-nav>🔖 Bookmarks</a></h1>
    <nav class="views">
      <a href="#/all" data-nav>All</a>
      <a href="#/unread" data-nav>Unread</a>
      <a href="#/archive" data-nav>Archive</a>
      <a href="#/saved" data-nav>Saved searches</a>
      <a href="#/preferences" data-nav>Preferences</a>
    </nav>
    <button id="add-button" class="primary">+ Add bookmark</button>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
