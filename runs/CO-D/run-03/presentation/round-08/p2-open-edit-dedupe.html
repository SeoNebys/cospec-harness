<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — prototype 2</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a2e;
  }
  header {
    background: #fff; border-bottom: 1px solid #e3e5e8;
    padding: 18px 28px; position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .savebar { display: flex; gap: 8px; }
  .savebar input {
    flex: 1; padding: 11px 14px; font-size: 15px;
    border: 1px solid #cfd3d8; border-radius: 8px;
  }
  .savebar button {
    padding: 11px 20px; font-size: 15px; font-weight: 600;
    background: #2f6fed; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .savebar button:hover { background: #235bce; }
  main { max-width: 900px; margin: 0 auto; padding: 22px 28px 60px; }
  .searchrow { position: relative; margin-bottom: 20px; }
  .searchrow input {
    width: 100%; padding: 12px 14px 12px 40px; font-size: 15px;
    border: 1px solid #cfd3d8; border-radius: 10px; background: #fff;
  }
  .searchrow .mag {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: #9aa1ab; font-size: 16px;
  }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 14px 2px; }
  .card {
    display: flex; gap: 14px; background: #fff; border: 1px solid #e3e5e8;
    border-radius: 12px; padding: 14px; margin-bottom: 12px; animation: pop .25s ease;
    position: relative;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px);} to {opacity:1;transform:none;} }
  .card.new { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47,111,237,.12); }
  .card.flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%,100%{box-shadow:none;} 30%{box-shadow:0 0 0 4px rgba(255,180,0,.55);} }
  .clickable { cursor: pointer; }
  .clickable:hover .title { text-decoration: underline; }
  .thumb {
    width: 108px; height: 76px; flex: none; border-radius: 8px; object-fit: cover;
    background: #e9ebef;
  }
  .body { min-width: 0; flex: 1; }
  .body .title { font-size: 16px; font-weight: 600; margin: 2px 0 4px; }
  .body .url { font-size: 12.5px; color: #2f6fed; margin: 0 0 6px; word-break: break-all; }
  .body .desc { font-size: 13.5px; color: #4b5563; margin: 0; line-height: 1.45; }
  mark { background: #fff2a8; padding: 0 1px; border-radius: 3px; }
  .edit-btn {
    position: absolute; top: 12px; right: 12px; font-size: 12.5px; color: #6b7280;
    background: #f4f5f7; border: 1px solid #e3e5e8; border-radius: 7px;
    padding: 5px 10px; cursor: pointer;
  }
  .edit-btn:hover { background: #e9ebef; }
  .edit-form input, .edit-form textarea {
    width: 100%; font-size: 14px; padding: 8px 10px; margin-bottom: 8px;
    border: 1px solid #cfd3d8; border-radius: 7px; font-family: inherit;
  }
  .edit-form .lbl { font-size: 11.5px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .edit-form textarea { min-height: 62px; resize: vertical; }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions .save { background: #2f6fed; color: #fff; border: none; border-radius: 7px; padding: 7px 16px; font-weight: 600; cursor: pointer; }
  .edit-actions .cancel { background: #fff; color: #4b5563; border: 1px solid #cfd3d8; border-radius: 7px; padding: 7px 16px; cursor: pointer; }
  .savenote { font-size: 12.5px; color: #2f6fed; margin: 0 0 8px; }
  .empty { text-align: center; color: #9aa1ab; padding: 50px 0; font-size: 15px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: #fff; padding: 12px 20px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20;
  }
  .toast.show { opacity: 1; }
  /* simulated destination page */
  .browser {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
    display: none; align-items: flex-start; justify-content: center; padding: 40px 20px;
  }
  .browser.show { display: flex; }
  .win { background: #fff; width: 100%; max-width: 760px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .chrome { display: flex; align-items: center; gap: 10px; background: #ececf0; padding: 10px 14px; border-bottom: 1px solid #dcdee3; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 11px; height: 11px; border-radius: 50%; background: #c9ccd2; }
  .addr { flex: 1; background: #fff; border-radius: 7px; padding: 6px 12px; font-size: 12.5px; color: #4b5563; border: 1px solid #dcdee3; }
  .closex { cursor: pointer; color: #6b7280; font-size: 18px; padding: 0 4px; }
  .page { padding: 34px 40px 46px; }
  .page h2 { margin: 0 0 10px; }
  .page p { color: #4b5563; line-height: 1.6; }
  .page .hint { color: #9aa1ab; font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="savebar">
    <input id="urlInput" type="text" placeholder="Paste a link to save…" autocomplete="off">
    <button id="saveBtn">Save</button>
  </div>
</header>

<main>
  <div class="searchrow">
    <span class="mag">⌕</span>
    <input id="searchInput" type="text" placeholder="Search everything you saved…" autocomplete="off">
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>

<div class="browser" id="browser">
  <div class="win">
    <div class="chrome">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="addr" id="addr"></div>
      <div class="closex" id="closeBrowser">✕</div>
    </div>
    <div class="page">
      <h2 id="pageTitle"></h2>
      <p id="pageBody"></p>
      <p class="hint">(Simulated: in the real app this is the actual web page opening. Close this to go back.)</p>
    </div>
  </div>
</div>

<script>
let bookmarks = [
  { id: 1, title: "The Sourdough Starter Guide for Beginners",
    url: "https://kitchenlab.example/sourdough-starter",
    desc: "How to make and maintain a wild-yeast starter. Covers feeding schedules, the float test, and troubleshooting a starter that won't rise.",
    img: "https://picsum.photos/seed/bread/216/152" },
  { id: 2, title: "Understanding CSS Grid Layout",
    url: "https://webnotes.example/css-grid-deep-dive",
    desc: "A visual walkthrough of grid-template-areas, fractional units, and building a responsive photo gallery without media queries.",
    img: "https://picsum.photos/seed/grid/216/152" },
  { id: 3, title: "Why We Sleep — key takeaways",
    url: "https://readingnook.example/why-we-sleep-notes",
    desc: "Notes on Matthew Walker's book. The role of deep sleep in memory, caffeine's half-life, and the danger of chronic sleep debt.",
    img: "https://picsum.photos/seed/sleep/216/152" },
  { id: 4, title: "12 Hidden Gems in Lisbon",
    url: "https://travelmore.example/lisbon-hidden-gems",
    desc: "Neighbourhood viewpoints, a family-run tram cafe, and the best pastel de nata away from the tourist crowds.",
    img: "https://picsum.photos/seed/lisbon/216/152" },
  { id: 5, title: "A Practical Guide to Index Funds",
    url: "https://moneywise.example/index-funds-101",
    desc: "What an expense ratio really costs you over 30 years, dollar-cost averaging, and why most active funds underperform.",
    img: "https://picsum.photos/seed/money/216/152" },
];

const canned = {
  "https://kitchenlab.example/no-knead-bread": {
    title: "No-Knead Bread in a Dutch Oven",
    desc: "A four-ingredient loaf with a crackly crust and open crumb. Long overnight rise, no kneading, baked in a covered pot.",
    img: "https://picsum.photos/seed/dutchoven/216/152" },
};
function autoCapture(url) {
  if (canned[url]) return canned[url];
  let host = "the page";
  try { host = new URL(url).hostname.replace(/^www\./,''); } catch(e){}
  const seed = encodeURIComponent(url).slice(-12) || "link";
  return {
    title: "Saved page from " + host,
    desc: "We grabbed this automatically from " + host + ". You didn't have to type any of it in.",
    img: "https://picsum.photos/seed/" + seed + "/216/152"
  };
}
// normalize a URL so trivial differences don't count as new (dedupe)
function normUrl(u){
  let s = u.trim().toLowerCase();
  s = s.replace(/\/+$/,'');            // trailing slashes
  s = s.replace(/^https?:\/\//,'');    // scheme
  s = s.replace(/^www\./,'');          // www
  return s;
}

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('searchInput');
let lastNewId = null;
let editingId = null;
let flashId = null;

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return safe.replace(re, '<mark>$1</mark>');
}

function cardHtml(b, q, isNew){
  if(b.id === editingId){
    return `
    <div class="card ${isNew?'new':''}" data-id="${b.id}">
      <img class="thumb" src="${b.img}" alt="">
      <div class="body">
        ${isNew?'<p class="savenote">Saved — the details below were filled in for you. Fix anything you like.</p>':''}
        <div class="edit-form">
          <div class="lbl">Title</div>
          <input class="e-title" type="text" value="${esc(b.title)}">
          <div class="lbl">Summary</div>
          <textarea class="e-desc">${esc(b.desc)}</textarea>
          <div class="edit-actions">
            <button class="save" data-act="commit">Save changes</button>
            <button class="cancel" data-act="cancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  return `
    <div class="card ${isNew?'new':''} ${b.id===flashId?'flash':''}" data-id="${b.id}">
      <img class="thumb clickable" src="${b.img}" alt="" data-act="open">
      <button class="edit-btn" data-act="edit">Edit</button>
      <div class="body clickable" data-act="open">
        <div class="title">${highlight(b.title, q)}</div>
        <div class="url">${highlight(b.url, q)}</div>
        <div class="desc">${highlight(b.desc, q)}</div>
      </div>
    </div>`;
}

function render(){
  const q = searchEl.value.trim();
  const ql = q.toLowerCase();
  const matches = bookmarks.filter(b => !ql ||
    b.title.toLowerCase().includes(ql) ||
    b.url.toLowerCase().includes(ql) ||
    b.desc.toLowerCase().includes(ql));

  if(matches.length === 0){
    countEl.textContent = '';
    listEl.innerHTML = '<div class="empty">Nothing matched “'+esc(q)+'”.</div>';
    return;
  }
  countEl.textContent = q
    ? matches.length + ' of ' + bookmarks.length + ' match'
    : bookmarks.length + ' saved';

  listEl.innerHTML = matches.slice().reverse()
    .map(b => cardHtml(b, q, b.id===lastNewId)).join('');
  flashId = null;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function openPage(b){
  document.getElementById('addr').textContent = b.url;
  document.getElementById('pageTitle').textContent = b.title;
  document.getElementById('pageBody').textContent = b.desc;
  document.getElementById('browser').classList.add('show');
}
document.getElementById('closeBrowser').addEventListener('click',
  ()=>document.getElementById('browser').classList.remove('show'));

// save with duplicate detection
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const url = document.getElementById('urlInput').value.trim();
  if(!url) return;
  const existing = bookmarks.find(b => normUrl(b.url) === normUrl(url));
  if(existing){
    document.getElementById('urlInput').value = '';
    searchEl.value = '';
    lastNewId = null;
    flashId = existing.id;
    render();
    const card = listEl.querySelector('[data-id="'+existing.id+'"]');
    if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
    toast("You already saved this — here it is.");
    return;
  }
  const cap = autoCapture(url);
  const id = Date.now();
  bookmarks.push({ id, url, title: cap.title, desc: cap.desc, img: cap.img });
  lastNewId = id;
  editingId = id;               // open the fresh item in edit mode (edit-at-save)
  document.getElementById('urlInput').value = '';
  searchEl.value = '';
  render();
  toast('Saved — title and image grabbed automatically');
});
document.getElementById('urlInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('saveBtn').click();
});
searchEl.addEventListener('input', ()=>{ lastNewId=null; editingId=null; render(); });

// delegate card clicks: open / edit / commit / cancel
listEl.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(!card) return;
  const id = Number(card.dataset.id);
  const b = bookmarks.find(x=>x.id===id);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(act === 'open'){ openPage(b); }
  else if(act === 'edit'){ editingId = id; lastNewId=null; render(); }
  else if(act === 'cancel'){ editingId = null; lastNewId=null; render(); }
  else if(act === 'commit'){
    b.title = card.querySelector('.e-title').value.trim() || b.title;
    b.desc  = card.querySelector('.e-desc').value.trim() || b.desc;
    editingId = null; lastNewId=null; flashId = id;
    render();
    toast('Updated');
  }
});

render();
</script>
</body>
</html>
