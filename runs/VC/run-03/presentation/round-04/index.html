<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🔖 Bookmarks</h1>
    <div class="header-actions">
      <button id="export-btn" class="ghost">Export</button>
      <label class="ghost" for="import-file">Import</label>
      <input id="import-file" type="file" accept="application/json" hidden />
    </div>
  </header>

  <main>
    <form id="add-form" class="card">
      <div class="row">
        <input id="url" type="text" placeholder="https://example.com" required />
        <button type="submit">Add</button>
      </div>
      <div class="row">
        <input id="title" type="text" placeholder="Title (optional — auto-fetched)" />
        <input id="tags" type="text" placeholder="tags, comma, separated" />
      </div>
      <textarea id="description" placeholder="Notes (optional)" rows="2"></textarea>
    </form>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search title, URL, notes…" />
    </div>

    <div id="tag-cloud" class="tag-cloud"></div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>No bookmarks yet. Add one above.</p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
