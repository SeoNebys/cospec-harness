<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepwell</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="logo" href="#" aria-label="Keepwell home"><span>k</span> Keepwell</a>
      <nav class="view-nav" aria-label="Collections">
        <button class="nav-item active" data-view="all"><span>All bookmarks</span><b data-count="all">0</b></button>
        <button class="nav-item" data-view="readLater"><span>Read later</span><b data-count="readLater">0</b></button>
        <button class="nav-item" data-view="archive"><span>Archive</span><b data-count="archive">0</b></button>
      </nav>
      <section class="tag-nav">
        <h2>Tags</h2>
        <button class="tag-filter active" data-tag="">All</button>
        <div id="tag-list"></div>
      </section>
    </aside>

    <main class="main">
      <header class="page-header">
        <div><p class="kicker">YOUR PERSONAL LIBRARY</p><h1 id="page-title">All bookmarks</h1><p id="page-subtitle">Everything you’ve saved, newest first.</p></div>
        <button id="open-save" class="save-open">+ Save a link</button>
      </header>

      <section id="save-panel" class="save-panel" hidden>
        <form id="save-form" novalidate>
          <label for="url-input">Paste a web address</label>
          <div class="save-line"><input id="url-input" type="text" inputmode="url" autocomplete="url" placeholder="https://example.com/article"><button type="submit">Save link</button></div>
          <p id="url-error" class="field-error" role="alert" hidden></p>
        </form>
      </section>

      <section class="tools">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search titles, descriptions, notes, and URLs"></label>
        <label class="sort-label">Sort <select id="sort-select"><option value="added">Recently added</option><option value="title">Title A–Z</option></select></label>
      </section>

      <div class="result-line"><span id="result-context">All bookmarks</span><span id="result-count">0 bookmarks</span></div>
      <section id="bookmark-list" class="bookmark-list" aria-live="polite"></section>
      <section id="empty-state" class="empty-state" hidden><div class="empty-symbol">◎</div><h2 id="empty-title"></h2><p id="empty-text"></p></section>
    </main>
  </div>

  <div id="bulk-bar" class="bulk-bar" hidden><strong id="bulk-count">0 selected</strong><button data-bulk="tag">+ Add tag</button><button data-bulk="archive">Archive</button><button class="danger-text" data-bulk="delete">Delete…</button></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <div id="dialog-layer" class="dialog-layer" hidden>
    <section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section>
  </div>

  <template id="card-template">
    <article class="bookmark-card">
      <input class="select-bookmark" type="checkbox" aria-label="Select bookmark">
      <div class="card-media"><img alt="" hidden><span class="media-fallback">↗</span></div>
      <div class="card-content">
        <div class="site-row"><img class="site-icon" alt="" hidden><span class="site-name"></span><span>·</span><time></time></div>
        <h2><a class="bookmark-title" target="_blank" rel="noopener noreferrer"></a></h2>
        <p class="bookmark-description"></p>
        <p class="fallback-notice" hidden>Page details weren’t available. You can add your own below.</p>
        <div class="tag-row"></div>
        <p class="note-block" hidden></p>
        <p class="bookmark-url"></p>
        <div class="inline-editor" hidden></div>
      </div>
      <div class="card-actions">
        <button class="read-later-action"></button>
        <button class="more-action" aria-label="More actions">•••</button>
        <div class="card-menu" hidden></div>
      </div>
    </article>
  </template>
  <script type="module" src="app.js"></script>
</body>
</html>
