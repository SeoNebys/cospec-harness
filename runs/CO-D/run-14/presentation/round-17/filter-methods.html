<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepwell — Compare combined search</title>
  <style>
    :root{--ink:#1d2722;--muted:#647069;--line:#dce2dd;--paper:#fffef9;--wash:#f2f3ec;--green:#245f49;--dark:#194735;--accent:#e6a34c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.page{width:min(1180px,95vw);margin:0 auto;padding:30px 0 60px}.intro{text-align:center;margin-bottom:24px}.intro h1{margin:0 0 8px;font:500 clamp(29px,4vw,43px)/1.1 Georgia,serif}.intro p{margin:0;color:var(--muted)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:22px}.version{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(35,56,45,.07)}.version-label{padding:10px 16px;background:#e5ebe6;color:var(--dark);font-size:13px;font-weight:750;letter-spacing:.04em;text-transform:uppercase}.app{padding:22px;min-height:610px}.app h2{margin:0 0 16px;font:500 28px Georgia,serif}.searchline{display:flex;gap:8px}.searchline input{min-width:0;flex:1;border:1px solid #cbd3cd;border-radius:9px;padding:11px}.searchline input:focus{outline:3px solid rgba(230,163,76,.42);border-color:var(--accent)}.primary{border:0;border-radius:9px;background:var(--green);color:white;padding:10px 14px;font-weight:700}.parsed{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}.criterion{padding:6px 9px;border-radius:999px;background:#e7eee9;color:var(--dark);font-size:12px;font-weight:680}.filterbox{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8f9f5}.filterbox strong{display:block;margin-bottom:10px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag-toggle{border:1px solid #c9d3cb;border-radius:999px;background:white;color:var(--dark);padding:7px 10px;font-size:13px}.tag-toggle.selected{background:var(--green);border-color:var(--green);color:white}.logic{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:13px}.logic b{color:var(--ink)}.result-line{margin:19px 0 10px;color:var(--muted);font-size:14px}.cards{display:grid;gap:9px}.card{padding:14px;border:1px solid var(--line);border-radius:11px;background:white}.card h3{margin:0 0 5px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.card .tags{margin-top:8px}.card .criterion{padding:4px 7px}.nonmatch{display:block}.applied .nonmatch{display:none}.applied .result-line::after{content:"3 matching bookmarks"}.result-line::after{content:"5 bookmarks"}@media(max-width:840px){.compare{grid-template-columns:1fr}.page{width:min(580px,92vw)}}
    .result-line::after{content:none!important}
  </style>
</head>
<body>
  <main class="page" data-harness-ready="true">
    <div class="intro"><h1>How should combined search work?</h1><p>Run the same Rome + article-or-book search in both versions.</p></div>
    <section class="compare">
      <article class="version" id="versionA">
        <div class="version-label">Version A</div><div class="app"><h2>Your library</h2><div class="searchline"><input aria-label="Search request in Version A" value="Rome in articles or books"><button class="primary apply">Search</button></div><div class="parsed" hidden><span class="criterion">Text: Rome</span><span class="criterion">Tag: articles</span><span class="criterion">or</span><span class="criterion">Tag: books</span></div><div class="result-line"></div><div class="cards"></div></div>
      </article>
      <article class="version" id="versionB">
        <div class="version-label">Version B</div><div class="app"><h2>Your library</h2><div class="searchline"><input aria-label="Search text in Version B" value="Rome"><button class="primary apply">Apply</button></div><div class="filterbox"><strong>Tags</strong><div class="tags"><button class="tag-toggle selected">articles</button><button class="tag-toggle selected">books</button><button class="tag-toggle">travel</button><button class="tag-toggle">research</button></div><div class="logic">Include bookmarks with <b>any selected tag</b></div></div><div class="result-line"></div><div class="cards"></div></div>
      </article>
    </section>
  </main>
  <template id="cardsTemplate">
    <article class="card match"><h3>A local’s walking guide to Rome</h3><p>Quiet streets and neighborhood stops.</p><div class="tags"><span class="criterion">articles</span><span class="criterion">travel</span></div></article>
    <article class="card match"><h3>Four roads through Italy</h3><p>Personal note: recommended for the Rome trip.</p><div class="tags"><span class="criterion">books</span><span class="criterion">travel</span></div></article>
    <article class="card match"><h3>How ancient cities managed water</h3><p>Aqueducts and daily life in Rome.</p><div class="tags"><span class="criterion">articles</span><span class="criterion">research</span></div></article>
    <article class="card nonmatch"><h3>Rome neighborhood map</h3><p>A saved map for wandering on foot.</p><div class="tags"><span class="criterion">travel</span></div></article>
    <article class="card nonmatch"><h3>A field guide to Lisbon’s tiles</h3><p>Patterns and workshops across the city.</p><div class="tags"><span class="criterion">articles</span></div></article>
  </template>
  <script>
    document.querySelectorAll('.cards').forEach(cards=>cards.append(document.querySelector('#cardsTemplate').content.cloneNode(true)));
    document.querySelectorAll('.result-line').forEach(line=>line.textContent='5 bookmarks');
    document.querySelectorAll('.apply').forEach(button=>button.addEventListener('click',()=>{const app=button.closest('.app');app.classList.add('applied');app.querySelector('.result-line').textContent='3 matching bookmarks';const parsed=app.querySelector('.parsed');if(parsed)parsed.hidden=false}));
    document.querySelectorAll('.tag-toggle').forEach(button=>button.addEventListener('click',()=>button.classList.toggle('selected')));
  </script>
</body>
</html>
