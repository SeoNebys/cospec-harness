<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rename — Version B (dialog)</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--muted:#6b7684;--line:#e3e7ec;--accent:#2f6bff;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;}
  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
  header.top h1{font-size:18px;margin:0;}
  header.top .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);}
  .badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
  main{max-width:760px;margin:0 auto;padding:20px;}
  .section-label{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:0 2px 12px;}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  li.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;}
  .titlerow{display:flex;align-items:center;gap:8px;}
  li.item .title{font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;}
  li.item .title:hover{color:var(--accent);}
  .renamebtn{margin-left:auto;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:9px;}
  .renamebtn:hover{border-color:var(--accent);color:var(--accent);}
  li.item .url{font-size:13px;color:var(--muted);word-break:break-all;margin-top:2px;}
  li.item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .overlay{position:fixed;inset:0;background:rgba(20,30,50,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;}
  .overlay.open{display:flex;}
  .dialog{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(20,30,50,.3);width:100%;max-width:420px;padding:22px;}
  .dialog h2{margin:0 0 4px;font-size:17px;}
  .dialog p{margin:0 0 16px;font-size:13px;color:var(--muted);word-break:break-all;}
  .dialog input{width:100%;padding:11px 13px;font-size:15px;border:1px solid var(--line);border-radius:10px;outline:none;}
  .dialog input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.12);}
  .dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .dialog .save{padding:10px 18px;border:none;background:var(--accent);color:#fff;font-weight:600;border-radius:10px;cursor:pointer;}
  .dialog .cancel{padding:10px 16px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;cursor:pointer;}
</style>
</head>
<body>
  <header class="top"><div class="dot"></div><h1>My Bookmarks</h1><span class="badge">Version B</span></header>
  <main>
    <div class="section-label">Recent</div>
    <ul class="list" id="list"></ul>
  </main>

  <div class="overlay" id="overlay">
    <div class="dialog" role="dialog" aria-modal="true">
      <h2>Rename bookmark</h2>
      <p id="dlgUrl"></p>
      <input type="text" id="dlgInput" aria-label="New title" />
      <div class="actions">
        <button class="cancel" id="dlgCancel">Cancel</button>
        <button class="save" id="dlgSave">Save</button>
      </div>
    </div>
  </div>
<script>
  const items=[
    {url:'https://en.wikipedia.org/wiki/Bookmark',title:'Bookmark - Wikipedia',when:'just now'},
    {url:'https://developer.mozilla.org/en-US/docs/Web/JavaScript',title:'JavaScript | MDN',when:'2 minutes ago'},
  ];
  const listEl=document.getElementById('list');
  const overlay=document.getElementById('overlay');
  const dlgInput=document.getElementById('dlgInput');
  const dlgUrl=document.getElementById('dlgUrl');
  let editingIdx=-1;
  function render(){
    listEl.innerHTML='';
    items.forEach((it,i)=>{
      const li=document.createElement('li');li.className='item';
      li.innerHTML=`<div class="titlerow"><a class="title" href="${it.url}" target="_blank" rel="noopener">${it.title}</a><button class="renamebtn">Rename</button></div><div class="url">${it.url}</div><div class="meta">Saved ${it.when}</div>`;
      li.querySelector('.renamebtn').onclick=()=>openDialog(i);
      listEl.appendChild(li);
    });
  }
  function openDialog(i){
    editingIdx=i;dlgInput.value=items[i].title;dlgUrl.textContent=items[i].url;
    overlay.classList.add('open');setTimeout(()=>{dlgInput.focus();dlgInput.select();},0);
  }
  function closeDialog(){overlay.classList.remove('open');editingIdx=-1;}
  function commit(){if(editingIdx<0)return;const v=dlgInput.value.trim();if(v)items[editingIdx].title=v;closeDialog();render();}
  document.getElementById('dlgSave').onclick=commit;
  document.getElementById('dlgCancel').onclick=closeDialog;
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog();});
  dlgInput.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape')closeDialog();});
  render();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
