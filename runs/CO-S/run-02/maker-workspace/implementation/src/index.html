<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Bookmarks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>📑 My Bookmarks</h1>

    <section class="save-box" aria-label="Save a bookmark">
      <label for="url">Link</label>
      <input id="url" type="text" autocomplete="off" placeholder="Paste a link here…" />

      <label for="title">Name</label>
      <input id="title" type="text" autocomplete="off" placeholder="Grabbed automatically — edit if you like" />
      <div class="hint" id="hint" role="status" aria-live="polite"></div>

      <label for="tagInput">Tags</label>
      <div class="tagfield" id="tagfield">
        <input id="tagInput" type="text" autocomplete="off" placeholder="Type a tag…" />
      </div>
      <div class="suggest" id="suggest"></div>

      <div class="banner-slot" id="banner"></div>
      <button id="save" type="button">Save</button>
    </section>

    <div class="search">
      <input id="search" type="text" autocomplete="off" placeholder="🔍 Search your bookmarks…" />
    </div>

    <div class="tagbar" id="tagbar" aria-label="Browse by tag"></div>

    <p class="count" id="count"></p>
    <ul class="list" id="list"></ul>
  </main>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
