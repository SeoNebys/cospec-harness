<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔖</span>
      <h1>Bookmarks</h1>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Search title, URL, tags…" autocomplete="off" />
    </div>
    <button id="new-btn" class="btn primary">+ New bookmark</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="filters">
        <button class="filter active" data-filter="all">All bookmarks</button>
        <button class="filter" data-filter="favorites">★ Favorites</button>
      </nav>
      <h2 class="side-title">Tags</h2>
      <div id="tag-list" class="tag-list"></div>
    </aside>

    <main class="content">
      <div id="active-tag-bar" class="active-tag-bar" hidden>
        Filtering by tag: <span id="active-tag" class="chip"></span>
        <button id="clear-tag" class="link-btn">clear</button>
      </div>
      <div id="list" class="grid"></div>
      <div id="empty" class="empty" hidden>
        <p>No bookmarks yet.</p>
        <button class="btn primary" onclick="document.getElementById('new-btn').click()">Add your first bookmark</button>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 id="modal-title">New bookmark</h2>
      <form id="form">
        <input type="hidden" id="edit-id" />
        <label>URL
          <input id="f-url" type="text" placeholder="example.com" required />
        </label>
        <label>Title
          <input id="f-title" type="text" placeholder="Optional — defaults to URL" />
        </label>
        <label>Description
          <textarea id="f-description" rows="3" placeholder="Optional notes"></textarea>
        </label>
        <label>Tags
          <input id="f-tags" type="text" placeholder="comma, separated, tags" />
        </label>
        <label class="checkbox">
          <input id="f-favorite" type="checkbox" /> Mark as favorite
        </label>
        <div id="form-error" class="form-error" hidden></div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn primary" id="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
