<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="fs-medium">
<header><h1>My Bookmarks</h1><button class="btn ghost" id="gear" title="Settings">⚙ Settings</button></header>
<main>
  <div class="card">
    <div class="addrow">
      <input id="url" type="text" placeholder="Paste a link, e.g. https://…" autocomplete="off" />
      <button class="btn" id="add">Add</button>
    </div>
    <div id="slot"></div>
  </div>
  <div class="status" id="status" role="status"></div>

  <div class="views" id="views"></div>
  <div class="collections" id="collections"></div>
  <div class="searchbar">
    <input id="search" type="text" placeholder='Search — try:  css  |  #read-later  |  grid AND #css  |  "grid layout" OR figma  |  design NOT tools' />
    <select id="sort" title="Sort">
      <option value="newest">Newest first</option>
      <option value="recent">Recently updated</option>
      <option value="oldest">Oldest first</option>
      <option value="title-az">Title A–Z</option>
      <option value="title-za">Title Z–A</option>
    </select>
  </div>
  <div class="searcherr" id="searcherr"></div>
  <div class="sortnote" id="sortnote"></div>
  <div class="filters" id="filters"></div>
  <div class="resultcount" id="count"></div>
  <div class="bulkbar hidden" id="bulkbar"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pager"></div>
</main>

<script src="/lib/normalize.js"></script>
<script src="/lib/search.js"></script>
<script src="/app.js"></script>
</body>
</html>
