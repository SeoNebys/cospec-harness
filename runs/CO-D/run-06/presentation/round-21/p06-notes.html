<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 06 (my own notes)</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#3b5bdb; --bg:#f7f7f9; --note:#8a6d00; --notebg:#fff8e1; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         margin:0; background:var(--bg); color:#1a1a1e; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 20px 80px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }

  .saver { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; }
  .row { display:flex; gap:8px; }
  input[type=url], input[type=text], textarea {
      width:100%; padding:10px 12px; border:1px solid var(--line);
      border-radius:8px; font-size:14px; font-family:inherit; background:#fff; }
  textarea { resize:vertical; min-height:52px; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:8px;
      padding:10px 16px; font-size:14px; cursor:pointer; }
  button.ghost { background:#eee; color:#333; border:0; border-radius:8px;
      padding:10px 16px; font-size:14px; cursor:pointer; }

  .fields { margin-top:14px; display:none; }
  .fields.show { display:block; }
  label.fld { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  label.fld .side { color:#9a9aa2; font-weight:400; }
  .noteField { background:var(--notebg); border-color:#f0e2a8; }
  .fetching { margin-top:14px; font-size:13px; color:var(--muted); display:none; }
  .fetching.show { display:block; }
  .save-actions { margin-top:16px; display:flex; gap:8px; align-items:center; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:6px; border:1px solid var(--line);
           border-radius:8px; align-items:center; }
  .chips input { border:0; outline:0; flex:1; min-width:140px; padding:6px; font-size:14px; }
  .chip { background:#eaefff; color:var(--accent); border-radius:14px; padding:4px 10px; font-size:13px; }

  .searchbar { position:relative; margin:26px 0 4px; }
  #search { width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line);
            border-radius:22px; font-size:14px; }
  .searchbar .icon { position:absolute; left:13px; top:10px; color:var(--muted); }
  .count { font-size:13px; color:var(--muted); margin:8px 2px 14px; }

  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:10px; }
  .card .title { font-size:15px; font-weight:600; margin:0 0 2px; }
  .card .url { font-size:12px; color:var(--accent); word-break:break-all; }
  .card .desc { font-size:13px; color:#3a3a42; margin:8px 0 0; }
  .card .note { font-size:13px; color:var(--note); background:var(--notebg);
          border-left:3px solid #f0cf5a; border-radius:0 6px 6px 0;
          padding:7px 10px; margin:9px 0 0; }
  .card .note b { font-weight:600; }
  .card .lbls { margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; }
  .card .lbls span { background:#eef0f4; color:#444; border-radius:12px; padding:2px 9px; font-size:12px; }
  mark { background:#fff3bf; border-radius:3px; padding:0 1px; }
  .empty { color:var(--muted); font-size:14px; padding:16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Prototype 06 — a spot for my own notes, separate from the page's description; search covers my notes too</p>

  <div class="saver">
    <div class="row">
      <input id="urlInput" type="url" placeholder="Paste a link here…" autocomplete="off" />
      <button id="addBtn" class="primary">Add</button>
    </div>
    <div id="fetching" class="fetching">Reading the page…</div>
    <div id="fields" class="fields">
      <label class="fld">Title <span class="side">— from the page</span></label>
      <input id="titleField" type="text" />
      <label class="fld">Description <span class="side">— the page's own words</span></label>
      <textarea id="descField"></textarea>
      <label class="fld">My notes <span class="side">— your words (optional)</span></label>
      <textarea id="noteField" class="noteField" placeholder="e.g. the sauce needs double the garlic"></textarea>
      <label class="fld">Labels</label>
      <div class="chips"><input id="labelInput" type="text" placeholder="type a label, press Enter…"></div>
      <div id="chipRow" class="lbls" style="margin-top:6px"></div>
      <div class="save-actions">
        <button id="saveBtn" class="primary">Save bookmark</button>
        <button id="cancelBtn" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

  <div class="searchbar">
    <span class="icon">⌕</span>
    <input id="search" type="text" placeholder="Search everything — including your own notes…" autocomplete="off" />
  </div>
  <div class="count" id="count"></div>
  <div id="cards"></div>
</div>

<script>
  const KNOWN = {
    "seriouseats.com": { title:"The Best Pesto alla Genovese", desc:"Classic basil pesto with pine nuts, garlic, and good olive oil, pounded to a paste." },
    "smittenkitchen.com": { title:"Simplest Brothy Beans and Rice", desc:"A weeknight one-pot dinner: creamy beans simmered with garlic and herbs over rice." }
  };
  function lookup(url){ let h=""; try{h=new URL(url).hostname.replace(/^www\./,"");}catch(e){}
    if(KNOWN[h]) return KNOWN[h];
    const n=h?h.split(".")[0]:"Saved page";
    return {title:n.charAt(0).toUpperCase()+n.slice(1)+" — page", desc:""}; }

  // Library already has some bookmarks; two carry the client's OWN notes.
  const saved = [
    {t:"Simplest Brothy Beans and Rice", u:"smittenkitchen.com/beans",
     d:"A weeknight one-pot dinner: creamy beans simmered with garlic and herbs over rice.",
     note:"Needs double the garlic. Great with crusty bread.", l:["recipes","dinner"]},
    {t:"Q3 Platform Strategy (internal doc)", u:"docs.company.com/q3-strategy",
     d:"Company planning document outlining priorities for the next quarter.",
     note:"Read this before the Monday leadership meeting — skim section 3.", l:["work"]},
    {t:"How to Read More Books This Year", u:"nytimes.com/read-more-books",
     d:"Practical habits from lifelong readers for fitting more reading into a busy schedule.",
     note:"", l:["reading","articles"]},
    {t:"ripgrep — recursively search directories for a regex pattern", u:"github.com/BurntSushi/ripgrep",
     d:"A line-oriented search tool that recursively searches your directory for a regex pattern.",
     note:"", l:["tools","coding"]}
  ];

  let pendingUrl="", currentLabels=[];
  const el=id=>document.getElementById(id);
  const urlInput=el("urlInput"),addBtn=el("addBtn"),fetching=el("fetching"),fields=el("fields"),
        titleF=el("titleField"),descF=el("descField"),noteF=el("noteField"),
        labelInput=el("labelInput"),chipRow=el("chipRow"),saveBtn=el("saveBtn"),
        cancelBtn=el("cancelBtn"),cards=el("cards"),countEl=el("count"),searchEl=el("search");

  function renderChips(){
    chipRow.innerHTML=currentLabels.map(l=>'<span>'+l+'</span>').join('');
  }
  labelInput.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&labelInput.value.trim()){
      const v=labelInput.value.trim();
      if(!currentLabels.some(l=>l.toLowerCase()===v.toLowerCase())) currentLabels.push(v);
      labelInput.value=""; renderChips();
    }
  });

  function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function hl(text,q){ if(!q) return escapeHtml(text);
    let out=escapeHtml(text);
    q.split(/\s+/).filter(Boolean).forEach(t=>{
      const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); out=out.replace(re,"<mark>$1</mark>"); });
    return out; }

  function matches(b,q){ if(!q) return true;
    const hay=[b.t,b.d,b.u,b.note,...b.l].join(" ").toLowerCase();
    return q.split(/\s+/).filter(Boolean).every(t=>hay.includes(t)); }

  function render(){
    const q=searchEl.value.trim().toLowerCase();
    const list=saved.filter(b=>matches(b,q));
    countEl.textContent=list.length+(list.length===1?" bookmark":" bookmarks")+(q?" match":"");
    if(!list.length){ cards.innerHTML='<div class="empty">Nothing matches that.</div>'; return; }
    cards.innerHTML="";
    list.forEach(b=>{
      const c=document.createElement("div"); c.className="card";
      c.innerHTML='<p class="title">'+hl(b.t,q)+'</p>'+
        '<div class="url">'+hl(b.u,q)+'</div>'+
        (b.d?'<p class="desc">'+hl(b.d,q)+'</p>':'')+
        (b.note?'<div class="note"><b>My note:</b> '+hl(b.note,q)+'</div>':'')+
        (b.l.length?'<div class="lbls">'+b.l.map(l=>'<span>'+hl(l,q)+'</span>').join('')+'</div>':'');
      cards.appendChild(c);
    });
  }

  function startAdd(){
    const url=urlInput.value.trim(); if(!url) return; pendingUrl=url;
    fields.classList.remove("show"); fetching.classList.add("show");
    setTimeout(()=>{ const m=lookup(url); titleF.value=m.title; descF.value=m.desc; noteF.value="";
      currentLabels=[]; renderChips();
      fetching.classList.remove("show"); fields.classList.add("show"); titleF.focus(); },600);
  }
  addBtn.addEventListener("click",startAdd);
  urlInput.addEventListener("keydown",e=>{if(e.key==="Enter")startAdd();});
  saveBtn.addEventListener("click",()=>{
    saved.unshift({t:titleF.value.trim(),u:pendingUrl,d:descF.value.trim(),
      note:noteF.value.trim(),l:[...currentLabels]});
    urlInput.value="";titleF.value="";descF.value="";noteF.value="";currentLabels=[];pendingUrl="";
    fields.classList.remove("show"); renderChips(); render(); urlInput.focus();
  });
  cancelBtn.addEventListener("click",()=>{ fields.classList.remove("show");
    titleF.value="";descF.value="";noteF.value="";currentLabels=[]; renderChips(); urlInput.focus(); });

  render();
</script>
</body>
</html>
