<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — find by search (A)</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#2f6fed; --bg:#fafafb; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: var(--bg); color: #1c1c20; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.06em;
         color:#255fd4; background:#e9f0ff; padding:4px 9px; border-radius:20px; margin-bottom:14px;}
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .search { position: relative; margin-bottom: 6px; }
  .search input { width:100%; padding: 13px 14px 13px 40px; font-size: 15px;
         border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); }
  .count { font-size: 12.5px; color: var(--muted); margin: 12px 0 10px; min-height:16px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 14px 4px;
       border-bottom: 1px solid var(--line); }
  li:first-child { border-top: 1px solid var(--line); }
  .favicon { width: 22px; height: 22px; flex: none; border-radius: 5px;
       background: #dfe3ea; display: grid; place-items: center;
       font-size: 11px; color: #7a8395; font-weight: 700; }
  .meta { min-width: 0; }
  .title { font-size: 15px; font-weight: 600; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .url { font-size: 12.5px; color: var(--muted); }
  mark { background:#fff2a8; border-radius:2px; padding:0 1px; }
  .empty { color: var(--muted); font-size: 14px; padding: 32px 0; text-align:center;
       border: 1px dashed var(--line); border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">APPROACH A · SEARCH</span>
  <h1>My Bookmarks</h1>
  <p class="sub">Find a link by typing a word you remember about it.</p>

  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Search your links…" aria-label="Search" autocomplete="off">
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<script>
  const DATA = [
    {t:"Best Hikes Near Portland", h:"nytimes.com"},
    {t:"How to Cook Perfect Rice Every Time", h:"seriouseats.com"},
    {t:"Rust Ownership Explained", h:"doc.rust-lang.org"},
    {t:"The Psychology of Money — summary", h:"jamesclear.com"},
    {t:"Tax Deductions for Freelancers", h:"irs.gov"},
    {t:"CSS Grid: A Complete Guide", h:"css-tricks.com"},
    {t:"20-Minute Weeknight Pasta", h:"bonappetit.com"},
    {t:"Kyoto Travel Itinerary (5 days)", h:"japan-guide.com"},
    {t:"Index Funds for Beginners", h:"bogleheads.org"},
    {t:"Sleep and Productivity", h:"hubermanlab.com"},
    {t:"SQLite Internals", h:"sqlite.org"},
    {t:"Cheap Flights to Tokyo", h:"google.com/flights"}
  ];
  const listEl=document.getElementById('list'), emptyEl=document.getElementById('empty'),
        countEl=document.getElementById('count'), qEl=document.getElementById('q');
  function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function hl(s,q){ if(!q) return esc(s);
    const i=s.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return esc(s);
    return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); }
  function render(){
    const q=qEl.value.trim();
    const rows = DATA.filter(d => (d.t+' '+d.h).toLowerCase().includes(q.toLowerCase()));
    listEl.innerHTML='';
    if(!rows.length){ emptyEl.style.display='block'; emptyEl.textContent='No links match “'+q+'”.'; countEl.textContent=''; return; }
    emptyEl.style.display='none';
    countEl.textContent = q ? rows.length+' of '+DATA.length+' links' : DATA.length+' links';
    rows.forEach(d=>{
      const li=document.createElement('li');
      li.innerHTML='<div class="favicon">'+d.h.charAt(0).toUpperCase()+'</div>'+
        '<div class="meta"><div class="title"><a href="#">'+hl(d.t,q)+'</a></div>'+
        '<div class="url">'+hl(d.h,q)+'</div></div>';
      listEl.appendChild(li);
    });
  }
  qEl.addEventListener('input', render);
  render();
</script>
</body>
</html>
