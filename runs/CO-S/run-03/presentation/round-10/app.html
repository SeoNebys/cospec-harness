<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks — prototype</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:var(--bg); color:#111; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:16px 28px; }
  header h1 { font-size:18px; margin:0; }
  .layout { max-width:920px; margin:0 auto; padding:24px; display:grid; grid-template-columns:190px 1fr; gap:24px; }
  .side { display:flex; flex-direction:column; gap:4px; }
  .side .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:4px 12px 6px; }
  .side button { text-align:left; background:none; border:none; padding:9px 12px; border-radius:8px; font-size:14px; cursor:pointer; color:#374151; }
  .side button.active { background:#fff; border:1px solid var(--line); font-weight:600; }
  .side button:hover { background:#eee; }
  .saver { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .saver .row { display:flex; gap:10px; }
  .saver input.url { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .saver button.save { padding:10px 18px; border:none; background:var(--accent); color:#fff; font-size:15px; border-radius:8px; cursor:pointer; }
  .chipbox { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#3730a3; background:#eef2ff; padding:3px 6px 3px 10px; border-radius:20px; }
  .chip b { cursor:pointer; color:#6366f1; font-weight:700; }
  .chipbox input { border:none; outline:none; font-size:14px; padding:4px; flex:1; min-width:120px; }
  .hint { color:var(--muted); font-size:12px; margin:6px 2px 0; }
  .savemsg { font-size:13px; margin:9px 2px 0; display:none; }
  .savemsg.error { display:block; color:#b91c1c; }
  .savemsg.warn { display:block; color:#92660b; }
  li.card.flash { animation:flash 1.2s ease; }
  @keyframes flash { 0%{ background:#fff9db; } 100%{ background:#fff; } }
  .searchbar { margin-top:18px; }
  .searchbar input { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; }
  .count { color:var(--muted); font-size:13px; margin:14px 2px 10px; }
  .noresult { color:var(--muted); text-align:center; padding:36px 0; font-size:15px; }
  ul.list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
  li.card .title { font-size:15px; font-weight:600; color:#111; text-decoration:none; }
  li.card .title:hover { color:var(--accent); text-decoration:underline; }
  li.card .url { display:block; color:var(--muted); font-size:13px; margin-top:3px; }
  li.card .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  li.card .tag { font-size:12px; color:#3730a3; background:#eef2ff; padding:2px 10px; border-radius:20px; }
  li.card .actions { margin-top:11px; display:flex; gap:14px; }
  li.card .actions button { background:none; border:none; padding:0; font-size:12px; color:var(--muted); cursor:pointer; }
  li.card .actions button:hover { color:#111; text-decoration:underline; }
  li.card .actions button.danger:hover { color:#dc2626; }
  .editor { margin-top:10px; border-top:1px dashed var(--line); padding-top:11px; }
  .editor .chipbox2 { display:flex; flex-wrap:wrap; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .editor .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#3730a3; background:#eef2ff; padding:3px 6px 3px 10px; border-radius:20px; }
  .editor .chip b { cursor:pointer; color:#6366f1; font-weight:700; }
  .editor .chipbox2 input { border:none; outline:none; font-size:14px; padding:4px; flex:1; min-width:120px; }
  .editor .done { margin-top:9px; font-size:13px; background:var(--accent); color:#fff; border:none; padding:7px 14px; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<header><h1>🔖 My Bookmarks</h1></header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main>
    <form class="saver" id="saver">
      <div class="row">
        <input class="url" id="url" type="text" placeholder="Paste a link here…" autocomplete="off">
        <button class="save" type="submit">Save</button>
      </div>
      <div class="chipbox" id="chipbox">
        <input id="groupinput" list="grouplist" placeholder="Add a group and press Enter (optional)…" autocomplete="off">
        <datalist id="grouplist"></datalist>
      </div>
      <div class="hint">Reuse a group like “Work”, or type a new name to create one. Add as many as you like — a link can be in several groups.</div>
      <div class="savemsg" id="savemsg"></div>
    </form>
    <div class="searchbar">
      <input id="search" type="search" placeholder="🔍  Search your bookmarks by a word or two…" autocomplete="off">
    </div>
    <div class="count" id="count"></div>
    <ul class="list" id="list"></ul>
  </main>
</div>
<script>
  // Groups are just labels on links — the set of groups is whatever links currently use.
  function usedGroups(){ const set=new Set(); items.forEach(it=>it.groups.forEach(g=>set.add(g))); return [...set]; }
  const items = [
    {url:"https://example.com/quarterly-plan", title:"Quarterly plan — page title", groups:["Work"]},
    {url:"https://example.com/pasta-essay", title:"The history of pasta — page title", groups:["Recipes","Read later"]},
    {url:"https://example.com/long-read", title:"A long essay to read — page title", groups:["Read later"]},
  ];
  let filter = "All";
  let pending = []; // groups being attached to the link about to be saved
  let editing = null; // the saved item whose groups are being edited inline
  let flashUrl = null; // url of a card to briefly highlight (e.g. duplicate found)

  function fakeTitle(url){ try{ const h=new URL(url.match(/^https?:/)?url:'https://'+url).hostname.replace(/^www\./,''); const n=h.split('.')[0]; return n.charAt(0).toUpperCase()+n.slice(1)+" — page title";}catch{return "Saved link";} }

  function renderDatalist(){ const dl=document.getElementById('grouplist'); dl.innerHTML=''; usedGroups().forEach(g=>{ const o=document.createElement('option'); o.value=g; dl.appendChild(o); }); }

  function renderChips(){
    const box=document.getElementById('chipbox'); const input=document.getElementById('groupinput');
    box.querySelectorAll('.chip').forEach(c=>c.remove());
    pending.forEach((g,idx)=>{ const c=document.createElement('span'); c.className='chip';
      c.innerHTML = g+' <b title="remove">×</b>'; c.querySelector('b').onclick=()=>{ pending.splice(idx,1); renderChips(); };
      box.insertBefore(c, input); });
  }

  function renderSide(){ const s=document.getElementById('side'); s.innerHTML='';
    const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent='Browse'; s.appendChild(lbl);
    // If the currently-filtered group has emptied out, fall back to "All".
    if(filter!=="All" && !usedGroups().includes(filter)) filter="All";
    ["All",...usedGroups()].forEach(g=>{ const b=document.createElement('button'); b.textContent=g==="All"?"All bookmarks":g;
      if(g===filter)b.className='active'; b.onclick=()=>{filter=g;render();}; s.appendChild(b); }); }

  function render(){ renderSide(); renderDatalist();
    const list=document.getElementById('list'); const count=document.getElementById('count');
    const q = (document.getElementById('search').value || '').trim().toLowerCase();
    let shown;
    if(q){
      // Searching spans ALL bookmarks, regardless of which group is selected.
      shown = items.filter(it =>
        it.title.toLowerCase().includes(q) ||
        it.url.toLowerCase().includes(q) ||
        it.groups.some(g => g.toLowerCase().includes(q)));
      count.textContent = shown.length + (shown.length===1?' match':' matches') + ' for “' + q + '”';
    } else {
      shown = items.filter(it=> filter==="All" || it.groups.includes(filter));
      count.textContent = shown.length + (shown.length===1?' bookmark':' bookmarks') + (filter==="All"?'':' in '+filter);
    }
    list.innerHTML='';
    if(shown.length===0){
      let msg;
      if(q) msg = 'No bookmarks match “'+q+'”.';
      else if(filter!=="All") msg = 'No bookmarks in “'+filter+'” yet.';
      else if(items.length===0) msg = 'Nothing saved yet. Paste a link above to save your first bookmark.';
      else msg = 'Nothing here yet.';
      list.innerHTML = '<li class="noresult">'+msg+'</li>';
      return;
    }
    shown.forEach(it=>{ const li=document.createElement('li'); li.className='card';
      if(it.url===flashUrl){ li.classList.add('flash'); }
      const a=document.createElement('a'); a.className='title'; a.href=it.url; a.target='_blank'; a.textContent=it.title;
      const u=document.createElement('span'); u.className='url'; u.textContent=it.url;
      li.appendChild(a); li.appendChild(u);
      if(it.groups.length){ const t=document.createElement('div'); t.className='tags';
        it.groups.forEach(g=>{ const s=document.createElement('span'); s.className='tag'; s.textContent=g; t.appendChild(s); }); li.appendChild(t); }

      if(editing===it){
        const ed=document.createElement('div'); ed.className='editor';
        const box=document.createElement('div'); box.className='chipbox2';
        it.groups.forEach((g,idx)=>{ const c=document.createElement('span'); c.className='chip';
          c.innerHTML=g+' <b title="remove">×</b>'; c.querySelector('b').onclick=()=>{ it.groups.splice(idx,1); render(); };
          box.appendChild(c); });
        const gin=document.createElement('input'); gin.setAttribute('list','grouplist');
        gin.placeholder='Add a group and press Enter…';
        gin.onkeydown=e=>{ if(e.key==='Enter'||e.key===','){ e.preventDefault(); const v=gin.value.trim();
          if(v && !it.groups.includes(v)){ it.groups.push(v); } render();
          setTimeout(()=>{ editing===it && document.querySelector('.editor input')?.focus(); },0); } };
        box.appendChild(gin); ed.appendChild(box);
        const done=document.createElement('button'); done.className='done'; done.textContent='Done'; done.onclick=()=>{ editing=null; render(); };
        ed.appendChild(done); li.appendChild(ed);
      } else {
        const act=document.createElement('div'); act.className='actions';
        const edit=document.createElement('button'); edit.textContent='Edit groups'; edit.onclick=()=>{ editing=it; render(); setTimeout(()=>document.querySelector('.editor input')?.focus(),0); };
        const del=document.createElement('button'); del.className='danger'; del.textContent='Remove';
        del.onclick=()=>{ if(confirm('Remove “'+it.title+'” from your bookmarks?')){ const i=items.indexOf(it); if(i>-1) items.splice(i,1); render(); } };
        act.appendChild(edit); act.appendChild(del); li.appendChild(act);
      }
      list.appendChild(li); });
    flashUrl=null;
  }

  const gi=document.getElementById('groupinput');
  gi.addEventListener('keydown',e=>{
    if(e.key==='Enter' || e.key===','){ e.preventDefault(); const v=gi.value.trim();
      if(v && !pending.includes(v)){ pending.push(v); }
      gi.value=''; renderChips(); renderDatalist(); }
  });

  function showMsg(kind, text){ const m=document.getElementById('savemsg'); m.className='savemsg '+kind; m.textContent=text; }
  function clearMsg(){ const m=document.getElementById('savemsg'); m.className='savemsg'; m.textContent=''; }
  function looksLikeLink(raw){ try{ const u=new URL(raw.match(/^https?:/)?raw:'https://'+raw);
      return /^[^\s.]+(\.[^\s.]+)+$/.test(u.hostname); }catch{ return false; } }
  function normalize(url){ return url.replace(/\/+$/,'').toLowerCase(); }

  document.getElementById('url').addEventListener('input', clearMsg);

  document.getElementById('saver').addEventListener('submit',e=>{ e.preventDefault();
    let raw=document.getElementById('url').value.trim(); if(!raw)return;
    if(!looksLikeLink(raw)){ showMsg('error', 'That doesn’t look like a web link. Try something like example.com/page.'); return; }
    let url = raw.match(/^https?:/)?raw:'https://'+raw;
    const dupe = items.find(it => normalize(it.url)===normalize(url));
    if(dupe){ showMsg('warn', 'You’ve already saved this link — it’s highlighted below.');
      flashUrl = dupe.url; render(); return; }
    // include any group left typed but not yet entered
    const leftover=gi.value.trim(); if(leftover && !pending.includes(leftover)){ pending.push(leftover); }
    items.unshift({url, title:fakeTitle(url), groups:[...pending]});
    document.getElementById('url').value=''; gi.value=''; pending=[]; clearMsg(); renderChips(); render(); });

  document.getElementById('search').addEventListener('input', render);

  renderChips(); render();
</script>
</body>
</html>
