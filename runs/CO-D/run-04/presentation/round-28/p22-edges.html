<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 22 (rough edges)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; --amber:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:22px 20px 60px; }

  .adder { display:flex; gap:8px; margin-bottom:6px; }
  .adder input { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:9px; font-size:15px; background:#fff; }
  .adder input.bad { border-color:#fca5a5; background:#fef2f2; }
  .adder button { padding:12px 18px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .msg { font-size:13px; margin:2px 2px 20px; min-height:20px; }
  .msg.err { color:var(--amber); } .msg.ok { color:var(--muted); }
  .msg .link { color:var(--accent); cursor:pointer; text-decoration:underline; }

  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; overflow:hidden; }
  li.card.fresh { border-color:#a7f3d0; }
  .title { font-size:15px; font-weight:600; margin:0; overflow-wrap:anywhere; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; overflow-wrap:anywhere;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .note { color:#6d5100; background:#fffbeb; border:1px solid #fde68a; border-radius:7px; font-size:12px; margin:8px 0 0; padding:6px 9px; overflow-wrap:anywhere; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; overflow-wrap:anywhere; }
  .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#eef2ff; color:#3730a3; font-size:11px; border-radius:20px; padding:3px 10px; white-space:nowrap; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <div class="adder">
    <input id="url" placeholder="Paste a link…" autocomplete="off">
    <button id="save">Save</button>
  </div>
  <div class="msg" id="msg"></div>
  <ul id="list"></ul>
</main>

<script>
let items=[
  { title:"A perfectly ordinary bookmark", url:"example.com/normal", desc:"Nothing unusual here.", note:"", tags:["misc"] },
  { title:"On the Absolutely Interminable and Self-Indulgent Art of Writing Web-Page Titles That Simply Will Not End, Part Seven: In Which the Author, Having Exhausted Every Reasonable Clause, Presses Valiantly Onward",
    url:"blog.example.com/2026/03/the-very-long-slug-that-also-goes-on-and-on-and-on-forever-and-ever",
    desc:"This description is also far longer than anyone would sensibly write, rambling well past the point of usefulness and continuing to add clause upon clause upon clause until it is clamped.",
    note:"Reminder to future me: this is a stress-test of very long text so make sure nothing spills off the edge or breaks the card layout.",
    tags:["research","longreads","to-revisit","design","typography","edge-cases","misc","reference","2026","inbox","maybe-someday","work"] },
];
const list=document.getElementById('list'), input=document.getElementById('url'), msg=document.getElementById('msg');
function host(u){ try{ return new URL(/^https?:/.test(u)?u:'https://'+u).hostname.replace(/^www\./,''); }catch{ return u; } }
function looksLikeUrl(s){ s=s.trim();
  if(/\s/.test(s) && !/^https?:\/\//.test(s)) return false;         // spaces = probably not a URL
  return /^https?:\/\/\S+\.\S+/.test(s) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s); // has a dotted domain
}
function render(freshN=0){
  list.innerHTML=items.map((it,i)=>`<li class="card ${i<freshN?'fresh':''}">
    <p class="title">${it.title}</p>
    ${it.desc?`<p class="desc">${it.desc}</p>`:''}
    ${it.note?`<p class="note"><b>Note to self:</b> ${it.note}</p>`:''}
    <div class="url">${host(it.url)}</div>
    ${it.tags&&it.tags.length?`<div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
  </li>`).join('');
}
function save(){
  const v=input.value.trim(); if(!v){ return; }
  if(!looksLikeUrl(v)){
    input.classList.add('bad');
    msg.className='msg err';
    msg.innerHTML=`That doesn't look like a web address — nothing was saved. Check it, or `+
      `<span class="link" id="asSearch">search your library for “${v.replace(/</g,'&lt;').slice(0,40)}”</span> instead?`;
    const s=document.getElementById('asSearch'); if(s) s.addEventListener('click',()=>{ msg.className='msg ok'; msg.textContent='(This would run a search — in the real app.)'; });
    return;
  }
  input.classList.remove('bad'); msg.className='msg'; msg.textContent='';
  items.unshift({ title:host(v).split('.')[0].replace(/^\w/,c=>c.toUpperCase())+' — saved page', url:v, desc:'', note:'', tags:[] });
  input.value=''; render(1);
}
input.addEventListener('input',()=>{ input.classList.remove('bad'); if(msg.classList.contains('err')){ msg.className='msg'; msg.textContent=''; } });
document.getElementById('save').addEventListener('click',save);
input.addEventListener('keydown',e=>{ if(e.key==='Enter') save(); });
render();
</script>
</body>
</html>
