<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="app-header">
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="tagline">Save a link, tag it, find it again, and keep a clear read-later list.</p>
  </div>
</header>

<main class="wrap">
  <section class="save card-panel">
    <div class="save-row">
      <input id="url" type="text" autocomplete="off"
             placeholder="Paste or type a link (e.g. https://example.com/article)" />
      <button id="saveBtn" type="button">Save link</button>
    </div>
    <label class="readlater-choice">
      <input type="checkbox" id="readLaterChoice" />
      Add this to my read-later list (it's something I want to read)
    </label>
    <div class="err" id="err" role="alert"></div>
    <div class="notice" id="notice" role="status"></div>
  </section>

  <section class="controls">
    <div class="search-row">
      <input id="search" type="search" placeholder="Search by title, address, or tag" />
      <button id="clearSearch" type="button" class="ghost">Clear</button>
    </div>
    <div id="activeFilter" class="active-filter" hidden></div>
    <div class="views" id="views" role="tablist">
      <button class="view active" data-view="all" type="button">All</button>
      <button class="view" data-view="unread" type="button">To read <span class="badge" id="unreadCount">0</span></button>
      <button class="view" data-view="read" type="button">Read</button>
    </div>
  </section>

  <h2 class="list-heading">Saved links (<span id="count">0</span>)</h2>
  <ul id="list" class="list"></ul>
  <div class="empty" id="emptyState" hidden></div>
</main>

<script src="app.js"></script>
</body>
</html>
