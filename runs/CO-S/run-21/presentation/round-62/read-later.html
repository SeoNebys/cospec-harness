<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepwell — Read later</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .later-shell { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding-bottom: 70px; }
    .later-head { padding: 60px 0 30px; }
    .later-head h1 { font-size: 50px; }
    .later-card { position: relative; display: grid; grid-template-columns: 180px 1fr auto; gap: 22px; padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    .later-preview { min-height: 165px; border-radius: 10px; background: linear-gradient(145deg, #183d4d, #e79a54); }
    .later-body { align-self: center; }
    .later-body h2 { margin: 7px 0 8px; font-family: Georgia, serif; font-size: 24px; font-weight: 500; }
    .later-body p { margin: 0 0 13px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .later-button { align-self: start; display: flex; align-items: center; gap: 7px; border: 1px solid #aab5ac; border-radius: 9px; padding: 9px 11px; background: transparent; color: var(--green); cursor: pointer; font-size: 11px; font-weight: 750; }
    .later-button.active { border-color: var(--green); background: var(--green-light); }
    .overflow { align-self: start; position: relative; }
    .overflow-trigger { width: 38px; height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
    .overflow-trigger:hover { background: #eceee8; }
    .overflow-menu { position: absolute; z-index: 2; top: 42px; right: 0; width: 170px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,.12); }
    .overflow-menu button { width: 100%; border: 0; border-radius: 7px; padding: 9px; background: white; color: var(--ink); cursor: pointer; text-align: left; font-size: 12px; }
    .overflow-menu button:hover { background: #eef1ec; }
    .later-status { display: inline-flex; gap: 6px; align-items: center; margin-top: 3px; padding: 5px 9px; border-radius: 999px; background: #f0e5d7; color: #7b4e2e; font-size: 10px; font-weight: 750; }
    .toast-local { position: fixed; right: 24px; bottom: 24px; padding: 12px 16px; border-radius: 11px; background: var(--ink); color: white; font-size: 12px; box-shadow: 0 12px 28px rgba(0,0,0,.18); }
    @media (max-width: 650px) { .later-card { grid-template-columns: 1fr; } .later-button, .overflow { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,.94); } }
  </style>
</head>
<body>
  <main class="later-shell" data-harness-ready="true">
    <header class="topbar"><a class="brand" href="#"><span class="brand-mark">K</span><span>Keepwell</span></a><span class="prototype-badge">Read-later prototype</span></header>
    <section class="later-head"><p class="eyebrow">YOUR COLLECTION</p><h1>Keep this one for later.</h1></section>
    <article class="later-card">
      <div class="later-preview"></div>
      <div class="later-body"><p class="site-line"><span class="site-icon">F</span> Field Notes · Saved today</p><h2>A calmer way to keep what you discover online</h2><p>A practical guide to building a personal reading collection that stays useful.</p><span id="later-status" class="later-status" hidden>◷ In Read later</span></div>
      <button id="visible-action" class="later-button" type="button">◷ <span>Read later</span></button>
      <div id="overflow" class="overflow" hidden><button id="overflow-trigger" class="overflow-trigger" aria-label="More actions">•••</button><div id="overflow-menu" class="overflow-menu" hidden><button id="menu-later">◷ Add to Read later</button></div></div>
    </article>
  </main>
  <div id="later-toast" class="toast-local" hidden>Added to Read later</div>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'button';
    const visible = document.querySelector('#visible-action');
    const overflow = document.querySelector('#overflow');
    const menu = document.querySelector('#overflow-menu');
    if (mode === 'menu') { visible.hidden = true; overflow.hidden = false; }
    function addLater() {
      document.querySelector('#later-status').hidden = false;
      visible.classList.add('active'); visible.querySelector('span').textContent = 'In Read later';
      menu.hidden = true;
      const toast = document.querySelector('#later-toast'); toast.hidden = false; setTimeout(() => { toast.hidden = true; }, 2500);
    }
    visible.addEventListener('click', addLater);
    document.querySelector('#overflow-trigger').addEventListener('click', () => { menu.hidden = !menu.hidden; });
    document.querySelector('#menu-later').addEventListener('click', addLater);
  </script>
</body>
</html>
