<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookmarks</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Your one spot for links.</p>

    <form class="adder" id="adder" autocomplete="off">
      <input id="url" type="text" placeholder="Paste a link here…" aria-label="Paste a link">
      <button type="submit">Save</button>
    </form>

    <div class="notice" id="notice" role="alert"></div>

    <div class="searchbar" id="searchbar" hidden>
      <input id="search" type="text" placeholder="Search your links…" aria-label="Search your links">
    </div>

    <div class="count" id="count"></div>
    <ul id="list" class="list"></ul>
  </div>

  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button id="undoBtn" type="button">Undo</button>
  </div>

  <script src="/search.js"></script>
  <script src="/app.js"></script>
</body>
</html>
