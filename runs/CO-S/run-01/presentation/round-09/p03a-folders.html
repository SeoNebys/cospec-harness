<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — p03a Folders</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a1a; }
  .bar { background:#111827; color:#fff; font-size:13px; padding:6px 16px; text-align:center; }
  .layout { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; display: grid;
    grid-template-columns: 200px 1fr; gap: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; grid-column: 1 / -1; }
  .side { }
  .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: #9ca3af; margin: 0 0 8px; }
  .folder { display:flex; justify-content:space-between; align-items:center;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color:#374151; }
  .folder:hover { background: #e9ebef; }
  .folder.active { background: #2563eb; color: #fff; }
  .folder.active .num { color:#dbeafe; }
  .num { color:#9ca3af; font-size:12px; }
  .main { min-width: 0; }
  .searchbar { position: relative; margin-bottom: 16px; }
  .searchbar input { width:100%; border:1px solid #d1d5db; border-radius:10px;
    padding:11px 14px 11px 38px; font-size:14px; background:#fff; }
  .searchbar .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#9ca3af; }
  .count { color:#6b7280; font-size:13px; margin:0 0 10px; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:13px 15px;
    margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .favicon { width:32px; height:32px; border-radius:8px; background:#eef2ff; display:flex;
    align-items:center; justify-content:center; font-size:15px; color:#4f46e5; font-weight:700; flex-shrink:0; }
  .meta { min-width:0; flex:1; }
  .title { font-size:15px; font-weight:600; margin:0 0 2px; }
  .title a { color:#111827; text-decoration:none; }
  .url { font-size:12.5px; color:#6b7280; margin:0; }
  .folder-tag { font-size:11px; color:#6b7280; background:#f3f4f6; border:1px solid #e5e7eb;
    padding:2px 8px; border-radius:20px; flex-shrink:0; }
</style>
</head>
<body>
<div class="bar">VERSION A — FOLDERS: each link lives in exactly one folder</div>
<div class="layout">
  <h1>My Bookmarks</h1>
  <div class="side">
    <h2>Folders</h2>
    <div id="folders"></div>
  </div>
  <div class="main">
    <div class="searchbar"><span class="icon">&#128269;</span>
      <input id="search" placeholder="Search…" /></div>
    <p class="count" id="count"></p>
    <ul id="list"></ul>
  </div>
</div>
<script>
  const data = [
    { title:'A 3-Day Guide to Kyoto in Autumn', host:'nytimes.com', folder:'Travel' },
    { title:'A weekend itinerary for Lisbon on a budget', host:'lonelyplanet.com', folder:'Travel' },
    { title:'The state of AI agents in 2026', host:'arstechnica.com', folder:'Tech' },
    { title:'openai/whisper: Speech Recognition', host:'github.com', folder:'Tech' },
    { title:'Understanding CSS Grid, once and for all', host:'css-tricks.com', folder:'Web Dev' },
    { title:'Rust vs Go for backend services in 2026', host:'infoq.com', folder:'Web Dev' },
    { title:'How to make Neapolitan pizza dough', host:'seriouseats.com', folder:'Cooking' },
    { title:'The best noise-cancelling headphones of 2026', host:'theverge.com', folder:'Gadgets' }
  ];
  const folders = ['All', ...Array.from(new Set(data.map(d => d.folder)))];
  let active = 'All';
  const foldersEl = document.getElementById('folders');
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const search = document.getElementById('search');

  function renderFolders() {
    foldersEl.innerHTML = '';
    folders.forEach(f => {
      const n = f === 'All' ? data.length : data.filter(d => d.folder === f).length;
      const div = document.createElement('div');
      div.className = 'folder' + (f === active ? ' active' : '');
      div.innerHTML = '<span>' + f + '</span><span class="num">' + n + '</span>';
      div.onclick = () => { active = f; renderFolders(); renderList(); };
      foldersEl.appendChild(div);
    });
  }
  function renderList() {
    const q = search.value.trim().toLowerCase();
    const items = data.filter(d =>
      (active === 'All' || d.folder === active) &&
      (!q || d.title.toLowerCase().includes(q) || d.host.toLowerCase().includes(q)));
    countEl.textContent = items.length + ' link' + (items.length===1?'':'s') +
      (active==='All'?'':' in ' + active);
    listEl.innerHTML = items.length ? '' : '<li class="url" style="border:none;background:none">No links here.</li>';
    items.forEach(d => {
      const li = document.createElement('li');
      li.innerHTML = '<div class="favicon">'+d.title.charAt(0)+'</div>'+
        '<div class="meta"><p class="title"><a href="#">'+d.title+'</a></p><p class="url">'+d.host+'</p></div>'+
        '<span class="folder-tag">'+d.folder+'</span>';
      listEl.appendChild(li);
    });
  }
  search.addEventListener('input', renderList);
  renderFolders(); renderList();
</script>
</body>
</html>
