<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keeplist</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="logo" href="#all" aria-label="Keeplist home"><span>K</span>Keeplist</a>
      <nav aria-label="Bookmark views">
        <button class="nav-item active" data-view="all"><span>▦</span>All bookmarks</button>
        <button class="nav-item" data-view="later"><span>★</span>Read later <b id="later-count"></b></button>
      </nav>
      <div class="sidebar-foot">Your private link library</div>
    </aside>
    <main id="app" class="main" aria-busy="true">
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow">LIBRARY</p><h1 id="page-title">All bookmarks</h1></div>
        <span id="bookmark-count" class="total"></span>
      </header>

      <section class="capture" id="capture" aria-labelledby="capture-title">
        <div class="capture-copy"><h2 id="capture-title">Save something worth returning to</h2><p>Paste a web address. We’ll collect the useful details.</p></div>
        <div class="url-row"><label class="sr-only" for="url-input">Web address</label><input id="url-input" type="url" placeholder="https://example.com/article" autocomplete="off"><button id="fetch-button" disabled>Get details</button></div>
        <p id="url-message" class="field-message" aria-live="polite"></p>
        <form id="save-form" class="details-form" hidden>
          <div id="fetch-notice" class="notice" hidden></div>
          <label for="title-input">Title</label><input id="title-input" maxlength="500" required>
          <label for="description-input">Description <small>optional</small></label><textarea id="description-input" maxlength="2000" rows="3"></textarea>
          <label for="tag-input">Tags <small>optional</small></label>
          <div class="tag-editor" id="tag-editor"><div id="chosen-tags" class="chosen-tags"></div><input id="tag-input" placeholder="Type a tag and press Enter" autocomplete="off"></div>
          <div id="tag-suggestions" class="suggestions" hidden></div>
          <div class="form-actions"><button type="submit" id="save-button">Save bookmark</button><button type="button" class="quiet" id="cancel-save">Cancel</button></div>
        </form>
      </section>

      <section class="tools" aria-label="Find bookmarks">
        <label class="search"><span>⌕</span><input id="search-input" placeholder="Search titles, descriptions, and tags" autocomplete="off"></label>
        <div id="active-filter" class="active-filter" hidden>Tag: <strong></strong><button aria-label="Clear tag filter">×</button></div>
      </section>

      <p id="global-message" class="global-message" aria-live="polite" hidden></p>
      <section id="bookmark-list" class="bookmark-list" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">BOOKMARK</p><h2>Edit details</h2></div><button type="button" class="icon-button" data-close aria-label="Close">×</button></div>
      <input id="edit-id" type="hidden">
      <label for="edit-url">Web address</label><input id="edit-url" type="url" required>
      <label for="edit-title">Title</label><input id="edit-title" maxlength="500" required>
      <label for="edit-description">Description <small>optional</small></label><textarea id="edit-description" maxlength="2000" rows="4"></textarea>
      <label for="edit-tag-input">Tags <small>optional</small></label>
      <div class="tag-editor"><div id="edit-chosen-tags" class="chosen-tags"></div><input id="edit-tag-input" placeholder="Type a tag and press Enter" autocomplete="off"></div>
      <div id="edit-tag-suggestions" class="suggestions" hidden></div>
      <p id="edit-error" class="error-text" hidden></p>
      <div class="form-actions"><button value="save">Save changes</button><button type="button" class="quiet" data-close>Cancel</button></div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="danger-dialog">
    <form id="delete-form" method="dialog"><h2>Delete this bookmark?</h2><p id="delete-copy"></p><input id="delete-id" type="hidden"><div class="form-actions"><button class="danger" value="delete">Delete bookmark</button><button type="button" class="quiet" data-close>Cancel</button></div></form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
