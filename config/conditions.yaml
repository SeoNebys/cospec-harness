# Condition DEFINITIONS — what each experimental condition is.
# (Execution schedule lives separately in run-plan.yaml.)
#
# method     : maker seeding strategy
#                vibe   -> empty workspace (default Code Generator behaviour)
#                sdd    -> `specify init` bootstrap inside the maker container
#                cospec -> copy method-configs/cospec/ into the maker workspace
# engagement : director engagement policy -> director-configs/<engagement>/
#                satisficing | diligent

conditions:
  VC:   { method: vibe,   engagement: satisficing }
  SD-S: { method: sdd,    engagement: satisficing }
  SD-D: { method: sdd,    engagement: diligent }
  CO-S: { method: cospec, engagement: satisficing }
  CO-D: { method: cospec, engagement: diligent }
