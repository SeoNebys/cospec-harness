<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep — precise search interaction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" data-harness-ready="true">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Keep home"><span class="brand-mark">K</span><span>Keep</span></a>
      <div class="avatar" aria-label="Personal library">You</div>
    </header>
    <section class="hero search-hero">
      <p class="eyebrow">YOUR LIBRARY</p><h1>Find exactly what you mean.</h1>
      <div class="search-box">
        <span aria-hidden="true">⌕</span><input id="advanced-input" type="search" placeholder="Search your bookmarks" autocomplete="off" aria-label="Search bookmarks"><kbd>/</kbd>
      </div>
      <div id="query-help" class="query-help">
        <span><b>“exact words”</b> together</span><span><b>OR</b> either one</span><span><b>−word</b> leave it out</span><span><b>label:design</b> exact label</span>
      </div>
      <div id="visual-controls" class="visual-controls" hidden>
        <div class="match-choice" aria-label="How words should match">
          <span>Match</span><button type="button" data-match="all">all words</button><button type="button" data-match="phrase">exact wording</button><button type="button" data-match="any">any word</button>
        </div>
        <div><span class="control-label">Labels — select once to include, twice to leave out</span><div id="advanced-labels" class="toolbar-labels"></div></div>
      </div>
      <div id="search-meaning" class="search-meaning" hidden></div>
    </section>
    <section class="library search-library" aria-labelledby="advanced-results-heading">
      <div class="section-heading">
        <div><p class="eyebrow">RESULTS</p><h2 id="advanced-results-heading">Your saved links</h2></div>
        <span id="advanced-count" class="count">6 bookmarks</span>
      </div>
      <div id="advanced-results" class="bookmark-list" aria-live="polite"></div>
      <div id="advanced-empty" class="empty-state" hidden><div class="empty-icon">⌕</div><h3>No exact matches</h3><p>Adjust the search to widen your results.</p></div>
    </section>
  </main>
  <script src="advanced-search.js"></script>
</body>
</html>
