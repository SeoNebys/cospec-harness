<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepwell — Tidy bookmarks</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .manage-shell { width: min(1060px, calc(100% - 40px)); margin: 0 auto; padding-bottom: 70px; }
    .manage-layout { display: grid; grid-template-columns: 190px 1fr; gap: 42px; }
    .manage-nav { padding-top: 58px; }
    .manage-nav button { width: 100%; margin-bottom: 5px; border: 0; border-radius: 9px; padding: 11px 12px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-size: 13px; font-weight: 750; }
    .manage-nav button.active { background: var(--green-light); color: var(--green); }
    .manage-nav span { float: right; }
    .manage-view { padding-top: 58px; }
    .manage-view h1 { font-size: 50px; }
    .manage-intro { margin: 12px 0 28px; color: var(--muted); }
    .manage-list { display: grid; gap: 13px; }
    .manage-card { position: relative; display: grid; grid-template-columns: 100px 1fr auto; gap: 16px; padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .manage-image { min-height: 100px; border-radius: 9px; background: linear-gradient(145deg, #183d4d, #e79a54); }
    .manage-card:nth-child(2) .manage-image { background: linear-gradient(145deg, #514475, #d9b7d7); }
    .manage-body { align-self: center; }
    .manage-body h2 { margin: 0 0 5px; font-family: Georgia, serif; font-size: 20px; font-weight: 500; }
    .manage-body p { margin: 0; color: var(--muted); font-size: 12px; }
    .card-actions { align-self: center; display: flex; gap: 6px; }
    .archive-action { border: 1px solid #aab5ac; border-radius: 8px; padding: 8px 10px; background: transparent; color: var(--green); cursor: pointer; font-size: 11px; font-weight: 750; }
    .more-wrap { position: relative; align-self: start; }
    .more-manage { width: 38px; height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
    .manage-menu { position: absolute; z-index: 2; right: 0; top: 41px; width: 160px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,.12); }
    .manage-menu button { width: 100%; border: 0; border-radius: 7px; padding: 9px; background: transparent; cursor: pointer; text-align: left; font-size: 12px; }
    .manage-menu button:hover { background: #eef1ec; }
    .archive-toast { position: fixed; right: 24px; bottom: 24px; padding: 12px 16px; border-radius: 11px; background: var(--ink); color: white; font-size: 12px; }
    @media (max-width: 700px) { .manage-layout { grid-template-columns: 1fr; } .manage-nav { display: flex; padding-top: 20px; } .manage-nav button { width: auto; } }
  </style>
</head>
<body>
  <main class="manage-shell" data-harness-ready="true">
    <header class="topbar"><a class="brand" href="#"><span class="brand-mark">K</span><span>Keepwell</span></a><span class="prototype-badge">Archive prototype</span></header>
    <div class="manage-layout">
      <nav class="manage-nav"><button class="active">All bookmarks <span id="all-count">2</span></button><button>◫ Archive <span id="archive-count">0</span></button></nav>
      <section class="manage-view"><p class="eyebrow">YOUR COLLECTION</p><h1>All bookmarks</h1><p class="manage-intro">Everything you’ve saved and kept active.</p>
        <div class="manage-list">
          <article class="manage-card"><div class="manage-image"></div><div class="manage-body"><h2>A calmer way to keep what you discover online</h2><p>Field Notes · Added today</p></div><div class="card-actions"><button class="archive-action">Archive</button><div class="more-wrap"><button class="more-manage">•••</button><div class="manage-menu" hidden><button class="menu-archive">◫ Move to Archive</button></div></div></div></article>
          <article class="manage-card"><div class="manage-image"></div><div class="manage-body"><h2>How small teams make better product decisions</h2><p>Workbench · Added yesterday</p></div><div class="card-actions"><button class="archive-action">Archive</button><div class="more-wrap"><button class="more-manage">•••</button><div class="manage-menu" hidden><button class="menu-archive">◫ Move to Archive</button></div></div></div></article>
        </div>
      </section>
    </div>
  </main>
  <div id="archive-toast" class="archive-toast" hidden>Moved to Archive · Kept safe</div>
  <script>
    const mode = new URLSearchParams(location.search).get('actions') || 'menu';
    document.querySelectorAll('.archive-action').forEach((button) => { button.hidden = mode !== 'buttons'; });
    document.querySelectorAll('.more-wrap').forEach((wrap) => { wrap.hidden = mode !== 'menu'; });
    function archive(card) {
      card.remove();
      document.querySelector('#all-count').textContent = '1';
      document.querySelector('#archive-count').textContent = '1';
      const toast = document.querySelector('#archive-toast'); toast.hidden = false; setTimeout(() => { toast.hidden = true; }, 3000);
    }
    document.querySelectorAll('.archive-action').forEach((button) => button.addEventListener('click', () => archive(button.closest('.manage-card'))));
    document.querySelectorAll('.more-manage').forEach((button) => button.addEventListener('click', () => { const menu = button.nextElementSibling; menu.hidden = !menu.hidden; }));
    document.querySelectorAll('.menu-archive').forEach((button) => button.addEventListener('click', () => archive(button.closest('.manage-card'))));
  </script>
</body>
</html>
