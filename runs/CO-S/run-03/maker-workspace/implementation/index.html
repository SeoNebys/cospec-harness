<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>🔖 My Bookmarks</h1></header>

<div class="layout">
  <nav class="side" id="side" aria-label="Groups"></nav>

  <main>
    <form class="saver" id="saver" novalidate>
      <div class="row">
        <input class="url" id="url" type="text" placeholder="Paste a link here…" autocomplete="off" aria-label="Link to save">
        <button class="save" type="submit">Save</button>
      </div>
      <div class="chipbox" id="chipbox">
        <input id="groupinput" list="grouplist" placeholder="Add a group and press Enter (optional)…" autocomplete="off" aria-label="Add a group">
        <datalist id="grouplist"></datalist>
      </div>
      <div class="hint">Reuse a group like “Work”, or type a new name to create one. Add as many as you like — a link can be in several groups.</div>
      <div class="savemsg" id="savemsg" role="status"></div>
    </form>

    <div class="searchbar">
      <input id="search" type="search" placeholder="🔍  Search your bookmarks by a word or two…" autocomplete="off" aria-label="Search bookmarks">
    </div>

    <div class="count" id="count"></div>
    <ul class="list" id="list"></ul>
  </main>
</div>

<script src="core.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
