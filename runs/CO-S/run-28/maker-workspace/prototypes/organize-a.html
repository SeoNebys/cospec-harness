<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Organize — Version A (one category / folder)</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--muted:#6b7684;--line:#e3e7ec;--accent:#2f6bff;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;}
  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
  header.top h1{font-size:18px;margin:0;}
  header.top .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);}
  .badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
  main{max-width:820px;margin:0 auto;padding:20px;}
  .saver{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:22px;}
  .saver .row{display:flex;gap:10px;flex-wrap:wrap;}
  .saver input[type=url]{flex:1 1 260px;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;outline:none;}
  .saver select{padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .saver button{padding:12px 18px;font-size:15px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px;cursor:pointer;}
  .saver .hint{color:var(--muted);font-size:13px;margin:10px 2px 0;}
  .folders{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .folder{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink);}
  .folder.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .folder .count{opacity:.7;margin-left:6px;font-size:12px;}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  li.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;}
  .titlerow{display:flex;align-items:center;gap:8px;}
  li.item .title{font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;}
  li.item .title:hover{color:var(--accent);}
  .chip{font-size:12px;background:#eef1f5;color:#48566a;border-radius:999px;padding:3px 10px;white-space:nowrap;}
  li.item .url{font-size:13px;color:var(--muted);word-break:break-all;margin-top:2px;}
  li.item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
  <header class="top"><div class="dot"></div><h1>My Bookmarks</h1><span class="badge">Version A · one folder each</span></header>
  <main>
    <form class="saver" id="saver" autocomplete="off">
      <div class="row">
        <input type="url" id="urlInput" placeholder="Paste a link to save…" />
        <select id="folderSelect">
          <option value="Reading">Reading</option>
          <option value="Work">Work</option>
          <option value="Recipes">Recipes</option>
          <option value="Uncategorized" selected>Uncategorized</option>
        </select>
        <button type="submit">Save link</button>
      </div>
      <div class="hint">Pick one folder for the link when you save it.</div>
    </form>

    <div class="folders" id="folders"></div>
    <ul class="list" id="list"></ul>
  </main>
<script>
  const items=[
    {url:'https://en.wikipedia.org/wiki/Bookmark',title:'Bookmark - Wikipedia',folder:'Reading',when:'just now'},
    {url:'https://developer.mozilla.org/en-US/docs/Web/JavaScript',title:'JavaScript | MDN',folder:'Work',when:'2 minutes ago'},
    {url:'https://www.seriouseats.com/the-food-lab',title:'The Food Lab | Serious Eats',folder:'Recipes',when:'yesterday'},
    {url:'https://news.ycombinator.com',title:'Hacker News',folder:'Reading',when:'yesterday'},
  ];
  let active='All';
  const listEl=document.getElementById('list');
  const foldersEl=document.getElementById('folders');
  function folders(){
    const set={};items.forEach(i=>set[i.folder]=(set[i.folder]||0)+1);
    return set;
  }
  function renderFolders(){
    foldersEl.innerHTML='';
    const all=document.createElement('button');all.className='folder'+(active==='All'?' active':'');
    all.innerHTML=`All <span class="count">${items.length}</span>`;all.onclick=()=>{active='All';renderAll();};
    foldersEl.appendChild(all);
    const set=folders();
    Object.keys(set).forEach(name=>{
      const b=document.createElement('button');b.className='folder'+(active===name?' active':'');
      b.innerHTML=`${name} <span class="count">${set[name]}</span>`;b.onclick=()=>{active=name;renderAll();};
      foldersEl.appendChild(b);
    });
  }
  function render(){
    listEl.innerHTML='';
    items.filter(i=>active==='All'||i.folder===active).forEach(it=>{
      const li=document.createElement('li');li.className='item';
      li.innerHTML=`<div class="titlerow"><a class="title" href="${it.url}" target="_blank" rel="noopener">${it.title}</a><span class="chip">${it.folder}</span></div><div class="url">${it.url}</div><div class="meta">Saved ${it.when}</div>`;
      listEl.appendChild(li);
    });
  }
  function renderAll(){renderFolders();render();}
  document.getElementById('saver').addEventListener('submit',e=>{
    e.preventDefault();const inp=document.getElementById('urlInput');let val=inp.value.trim();if(!val)return;
    if(!/^https?:\/\//i.test(val))val='https://'+val;
    items.unshift({url:val,title:'(title would fill in)…',folder:document.getElementById('folderSelect').value,when:'just now'});
    inp.value='';renderAll();
  });
  renderAll();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
