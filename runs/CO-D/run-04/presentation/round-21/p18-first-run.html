<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 18 (day one)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; --green:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:#fff; display:flex; align-items:center; gap:14px; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  .htools { margin-left:auto; display:flex; gap:8px; }
  .hbtn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; color:#374151; font-weight:600; }
  main { max-width:760px; margin:0 auto; padding:24px 20px 60px; }

  .adder { display:flex; gap:8px; margin-bottom:24px; }
  .adder input { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:9px; font-size:15px; background:#fff; }
  .adder button { padding:12px 18px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .adder button:disabled { opacity:.5; cursor:default; }

  .hero { text-align:center; padding:44px 24px; }
  .hero .art { font-size:52px; }
  .hero h2 { font-size:20px; margin:14px 0 6px; }
  .hero p { color:var(--muted); font-size:14px; max-width:440px; margin:0 auto 22px; line-height:1.55; }
  .hero .ways { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .way { border:1px solid var(--line); background:#fff; border-radius:12px; padding:18px 20px; width:230px; text-align:left; }
  .way .em { font-size:22px; } .way .t { font-weight:600; margin:8px 0 3px; font-size:14px; }
  .way .d { color:var(--muted); font-size:12px; line-height:1.5; }
  .way .go { margin-top:12px; }
  .way .go button { width:100%; border:0; border-radius:8px; padding:9px; font-weight:600; cursor:pointer; }
  .way.primary .go button { background:var(--accent); color:#fff; }
  .way.second .go button { background:#f3f4f6; color:#374151; }
  .hint { color:var(--muted); font-size:12px; margin-top:24px; }

  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:13px 16px; margin-bottom:10px; }
  li.card.fresh { animation:pop .5s ease; border-color:#a7f3d0; }
  @keyframes pop { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
  .title { font-size:15px; font-weight:600; margin:0; }
  .url { color:var(--muted); font-size:12px; margin-top:6px; }
  .count { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:4px 2px 10px; }
</style>
</head>
<body>
<header>
  <div><h1>My Links</h1><div class="sub">Your personal library of saved links</div></div>
  <div class="htools"><button class="hbtn">⬇ Import</button><button class="hbtn">⬆ Export</button></div>
</header>
<main>
  <div class="adder">
    <input id="url" placeholder="Paste your first link here…" autocomplete="off">
    <button id="save" disabled>Save</button>
  </div>
  <div id="stage"></div>
</main>

<script>
let items=[];
const stage=document.getElementById('stage'), input=document.getElementById('url'), btn=document.getElementById('save');
function host(u){ try{ return new URL(/^https?:/.test(u)?u:'https://'+u).hostname.replace(/^www\./,''); }catch{ return u; } }

function render(freshN=0){
  if(!items.length){
    stage.innerHTML=`<div class="hero">
      <div class="art">📚</div>
      <h2>Your library starts here</h2>
      <p>This is where every interesting link lives — and, unlike the pile you have now,
         where you can actually find it again. Two ways to begin:</p>
      <div class="ways">
        <div class="way primary">
          <div class="em">➕</div><div class="t">Save your first link</div>
          <div class="d">Paste any web address in the box above. It'll fetch the page's
            name for you — no typing.</div>
          <div class="go"><button id="focusAdd">Paste a link</button></div>
        </div>
        <div class="way second">
          <div class="em">⬇</div><div class="t">Bring in what you already have</div>
          <div class="d">Already got a mountain of browser bookmarks? Import them all in one go
            (with a preview first — nothing dumped on you).</div>
          <div class="go"><button id="importNow">Import bookmarks</button></div>
        </div>
      </div>
      <div class="hint">Nothing here is public. It's your private library — just you.</div>
    </div>`;
    document.getElementById('focusAdd').addEventListener('click',()=>input.focus());
    document.getElementById('importNow').addEventListener('click',()=>{
      // simulate a quick import so the client sees the empty state resolve
      items=[{url:'https://example.com/imported-1',title:'(imported) Getting Things Done'},
             {url:'https://example.com/imported-2',title:'(imported) The Pragmatic Programmer'}];
      render(2);
    });
    return;
  }
  stage.innerHTML=`<div class="count">${items.length} link${items.length>1?'s':''}</div><ul>`+
    items.map((it,i)=>`<li class="card ${i<freshN?'fresh':''}"><p class="title">${it.title}</p>
      <div class="url">${host(it.url)}</div></li>`).join('')+`</ul>`;
}
input.addEventListener('input',()=>btn.disabled=input.value.trim().length<4);
function save(){ const u=input.value.trim(); if(u.length<4) return; input.value=''; btn.disabled=true;
  items.unshift({url:u,title:'…'});
  render(1);
  setTimeout(()=>{ const key=host(u); items[0].title = key.split('.')[0].replace(/^\w/,c=>c.toUpperCase())+' — saved page'; render(1); },500);
}
btn.addEventListener('click',save);
input.addEventListener('keydown',e=>{ if(e.key==='Enter') save(); });
render();
</script>
</body>
</html>
