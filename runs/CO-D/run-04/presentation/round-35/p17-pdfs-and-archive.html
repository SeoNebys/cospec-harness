<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 17 (PDFs & public archive)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; --green:#059669; --purple:#7c3aed; --red:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:22px 20px 60px; }
  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .title { font-size:15px; font-weight:600; margin:0; }
  .kind { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; border-radius:5px; padding:2px 6px; margin-left:8px; vertical-align:middle; }
  .kind.pdf { background:#fee2e2; color:#b91c1c; } .kind.web { background:#dbeafe; color:#1d4ed8; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .safety { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:6px; }
  .row1 { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chk { color:var(--green); font-weight:600; }
  .pub { color:var(--purple); font-weight:600; }
  .acts { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; font-size:13px; padding:7px 12px; cursor:pointer; color:#374151; }
  .btn.live { border-color:#c7d2fe; color:var(--accent); font-weight:600; }
  .btn.copy { border-color:#a7f3d0; color:var(--green); font-weight:600; }
  .btn.arch { border-color:#ddd6fe; color:var(--purple); font-weight:600; }
  .btn.arch.on { background:#f5f3ff; }
  .archline { font-size:12px; color:var(--purple); display:none; align-items:center; gap:6px; }
  .archline.show { display:flex; }
  .archline a { color:var(--purple); }
  .privacy { font-size:11px; color:var(--muted); background:#faf5ff; border:1px solid #ede9fe; border-radius:8px; padding:8px 10px; display:none; margin-top:4px; }
  .privacy.show { display:block; }

  .backdrop { position:fixed; inset:0; background:rgba(17,24,39,.5); display:none; align-items:stretch; justify-content:center; padding:24px; }
  .backdrop.show { display:flex; }
  .viewer { background:#fff; border-radius:14px; width:720px; max-width:96vw; box-shadow:0 24px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden; }
  .vbar { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:#fafafa; }
  .vbar .vt { font-weight:600; font-size:14px; } .vbar .vs { color:var(--muted); font-size:12px; }
  .vbar .x { margin-left:auto; border:0; background:#eef0f3; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:16px; }
  .vbody { overflow:auto; }
  .reader { padding:30px 40px; } .reader h2 { font-size:22px; margin:0 0 4px; } .reader p { font-size:15px; line-height:1.7; margin:0 0 14px; }
  /* pdf-ish view */
  .pdfwrap { background:#525659; padding:22px; }
  .pdfpage { background:#fff; max-width:520px; margin:0 auto 14px; padding:40px 44px; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .pdfpage h2 { font-size:19px; margin:0 0 4px; text-align:center; }
  .pdfpage .aut { text-align:center; color:#555; font-size:12px; margin-bottom:20px; }
  .pdfpage .ln { height:9px; background:#e5e7eb; border-radius:4px; margin:7px 0; } .pdfpage .ln.s { width:60%; }
  .pdftag { text-align:center; color:#cbd5e1; font-size:11px; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <ul id="list"></ul>
</main>
<div class="backdrop" id="backdrop"><div class="viewer" id="viewer"></div></div>

<script>
let items=[
  { id:1, kind:'web', title:"Designing the Stripe Payments API", url:"https://stripe.com/blog/payment-api",
    desc:"Idempotency and versioning at scale.", saved:"12 Mar 2026", pubArchive:false,
    article:["We treat every API surface as a long-term contract.",
             "Idempotency keys let a client safely retry without double charges."] },
  { id:2, kind:'pdf', title:"Attention Is All You Need", url:"https://arxiv.org/pdf/1706.03762.pdf",
    desc:"The transformer paper — a PDF I want the actual document of.", saved:"08 Feb 2026", size:"2.1 MB", pubArchive:false },
  { id:3, kind:'web', title:"Project Aurora — design notes", url:"https://oldstartup.example.com/aurora",
    desc:"Irreplaceable write-up; the company is already gone.", saved:"19 Aug 2019", precious:true, pubArchive:true,
    article:["Aurora's core idea was a single event log every service could replay.",
             "These notes outlived the company that hosted them."] },
];
const list=document.getElementById('list'), backdrop=document.getElementById('backdrop'), viewer=document.getElementById('viewer');
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } }

function render(){
  list.innerHTML=items.map(it=>`
    <li class="card" data-id="${it.id}">
      <p class="title">${it.title}<span class="kind ${it.kind}">${it.kind==='pdf'?'PDF':'Web'}</span></p>
      <p class="desc">${it.desc}</p>
      <div class="url"><span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${host(it.url)}</div>
      <div class="safety">
        <div class="row1">
          ${it.kind==='pdf'
            ? `<span class="chk">✓ Saved copy kept</span> · the actual PDF file (${it.size}) from ${it.saved}`
            : `<span class="chk">✓ Saved copy kept</span> · readable copy from ${it.saved}`}
        </div>
        <div class="acts">
          <button class="btn live" data-live="${it.id}">↗ Open live</button>
          <button class="btn copy" data-copy="${it.id}">${it.kind==='pdf'?'📄 Open saved PDF':'📄 View saved copy'}</button>
          <button class="btn arch ${it.pubArchive?'on':''}" data-arch="${it.id}">${it.pubArchive?'🌐 Public copy kept ✓':'🌐 Also keep a public copy'}</button>
        </div>
        <div class="archline ${it.pubArchive?'show':''}" id="al-${it.id}">
          🌐 Also safe at the public web archive — <a href="#" onclick="return false">view the public copy ↗</a>
        </div>
        <div class="privacy" id="pv-${it.id}"></div>
      </div>
    </li>`).join('');
  list.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>openViewer(+b.dataset.copy)));
  list.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{
    const it=byId(+b.dataset.live);
    if(it.precious) alert("The live page couldn't be reached — but your saved copy is right here.");
    else window.open(it.url,'_blank'); }));
  list.querySelectorAll('[data-arch]').forEach(b=>b.addEventListener('click',()=>toggleArchive(+b.dataset.arch)));
}
const byId=id=>items.find(x=>x.id===id);
function toggleArchive(id){
  const it=byId(id);
  if(it.pubArchive){ it.pubArchive=false; render(); return; }
  // turning ON — show the honest, one-time privacy note, then confirm
  const pv=document.getElementById('pv-'+id);
  pv.classList.add('show');
  pv.innerHTML=`This sends <b>${host(it.url)}</b> to an independent public web archive and makes a
    <b>public</b> copy that lives outside this app and outside your computer — belt &amp; braces for
    something you can't lose. Only happens for links you choose.
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn arch" id="cf-${id}">Yes, archive it publicly</button>
      <button class="btn" id="nc-${id}">Not this one</button></div>`;
  document.getElementById('cf-'+id).addEventListener('click',()=>{ it.pubArchive=true; render(); });
  document.getElementById('nc-'+id).addEventListener('click',()=>{ pv.classList.remove('show'); pv.innerHTML=''; });
}
function openViewer(id){
  const it=byId(id);
  let body, kindlabel;
  if(it.kind==='pdf'){
    kindlabel='the actual PDF';
    body=`<div class="pdfwrap">
      <div class="pdfpage"><h2>${it.title}</h2><div class="aut">Vaswani et al. · saved ${it.saved}</div>
        <div class="ln"></div><div class="ln"></div><div class="ln s"></div>
        <div class="ln"></div><div class="ln"></div><div class="ln s"></div></div>
      <div class="pdftag">Page 1 of 15 · your saved PDF (${it.size}) — the real document, not a scrape</div></div>`;
  } else {
    kindlabel='readable copy';
    body=`<div class="reader"><h2>${it.title}</h2>${(it.article||[]).map(p=>`<p>${p}</p>`).join('')}</div>`;
  }
  viewer.innerHTML=`<div class="vbar"><span class="vt">${it.title}</span><span class="vs">saved copy · ${kindlabel}</span>
     <button class="x" id="vx">×</button></div><div class="vbody">${body}</div>`;
  viewer.querySelector('#vx').addEventListener('click',()=>backdrop.classList.remove('show'));
  backdrop.classList.add('show');
}
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.classList.remove('show'); });
render();
</script>
</body>
</html>
