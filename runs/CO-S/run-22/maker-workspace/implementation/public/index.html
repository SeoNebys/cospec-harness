<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Keeper</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <h1>Bookmark Keeper</h1>
      <p>Save links, tag them, find them again — and keep a copy of the important ones.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="panel" aria-labelledby="save-h">
      <h2 id="save-h">Save a link</h2>
      <label for="url">Link address</label>
      <input type="url" id="url" placeholder="https://example.com/article" autocomplete="off" />

      <label for="title">Title <span id="titleStatus" class="muted"></span></label>
      <input type="text" id="title" placeholder="Fills in automatically from the page — edit if you like" />

      <label for="tagInput">Tags</label>
      <div id="tagBox" class="tag-box">
        <span id="tagChips" class="chips"></span>
        <input type="text" id="tagInput" placeholder="Type a tag, press Enter" />
      </div>

      <label for="note">Why are you saving this? (optional)</label>
      <textarea id="note" placeholder="e.g. Good explanation of X — read before the Tuesday meeting"></textarea>

      <label class="check"><input type="checkbox" id="toread" checked /> I still want to read this</label>
      <label class="check"><input type="checkbox" id="keepcopy" /> Keep a copy in case this page disappears</label>

      <div class="row-btn"><button class="primary" id="saveBtn">Save link</button></div>
      <div id="formMsg" class="form-msg" role="status"></div>
    </section>

    <section class="panel" aria-labelledby="list-h">
      <h2 id="list-h">Saved links</h2>
      <input type="search" id="search" placeholder="Search your links…" />
      <div id="readTabs" class="read-tabs"></div>
      <div id="filterBar" class="filter-bar"></div>
      <div class="count" id="count"></div>
      <div id="list"></div>
    </section>
  </main>

  <div id="overlayRoot"></div>
  <script src="/app.js"></script>
</body>
</html>
