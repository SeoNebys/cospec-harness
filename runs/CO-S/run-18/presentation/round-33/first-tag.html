<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — first tag</title><style>
:root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--accent:#176b4d;--wash:#eaf3ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(920px,calc(100% - 40px));margin:50px auto}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;letter-spacing:-.04em;margin:9px 0 12px}.intro{color:var(--muted);font-size:17px;margin:0 0 25px}.capture{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 35px rgba(30,55,43,.08)}.row{display:flex;gap:10px}.url{flex:1;border:0;outline:0;font:inherit;font-size:15px;padding:11px 12px}.save{border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:720;padding:12px 20px;cursor:pointer}.tag-area{border-top:1px solid var(--line);margin-top:10px;padding:13px 12px 5px}.label{font-size:13px;font-weight:700;margin-bottom:8px}.label span{font-weight:400;color:var(--muted)}.tag-box{display:flex;align-items:center;gap:7px;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:6px 9px}.tag-box input{flex:1;min-width:150px;border:0;outline:0;font:inherit}.tag{background:var(--wash);color:#10533b;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.help{font-size:12px;color:var(--muted);margin-top:7px}.collection{margin-top:36px}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}h2{margin:0;font-size:19px}.count{color:var(--muted);font-size:14px}.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}.title{font-size:18px;font-weight:730}.description{color:var(--muted);margin:7px 0 9px}.address{font-size:12px;color:var(--accent)}@media(max-width:620px){header{padding:0 20px}.row{flex-direction:column}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Personal library</div></header><main data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>Save your first link</h1><p class="intro">There are no existing tags yet. Create one now, or leave tags empty.</p><form class="capture" id="form"><div class="row"><input class="url" value="https://developer.mozilla.org/en-US/docs/Web/JavaScript" aria-label="Web address"><button class="save">Save link</button></div><div class="tag-area"><div class="label">Tags <span>— optional</span></div><div class="tag-box"><div id="chosen"></div><input id="tag-input" placeholder="Type a new tag and press Enter"></div><div class="help">New tags will be suggested the next time you save a link.</div></div></form><section class="collection"><div class="head"><h2>All bookmarks</h2><span class="count" id="count">0 bookmarks</span></div><div id="result"></div></section></main><script>
let tag='';const input=document.querySelector('#tag-input');input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tag=input.value.trim().toLowerCase();if(tag){document.querySelector('#chosen').innerHTML=`<span class="tag">${tag}</span>`;input.value=''}}});document.querySelector('#form').onsubmit=e=>{e.preventDefault();document.querySelector('#count').textContent='1 bookmark';document.querySelector('#result').innerHTML=`<article class="card"><div class="title">JavaScript | MDN</div><p class="description">JavaScript is a scripting language that enables you to create dynamically updating content and much more.</p><div class="address">https://developer.mozilla.org/en-US/docs/Web/JavaScript</div>${tag?`<div style="margin-top:12px"><span class="tag">${tag}</span></div>`:''}</article>`};
</script></body></html>
