<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepwell — Add tags</title>
<style>
:root{--ink:#202722;--muted:#6b746e;--paper:#f4f1e9;--card:#fffdf8;--green:#315c4b;--lime:#dce7a7;--line:#d8d7ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button,input{font:inherit}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center;font:700 23px Georgia,serif}.mark{width:28px;height:34px;background:var(--green);border-radius:5px 5px 10px 10px;position:relative}.mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lime);top:8px;left:10px}.back{color:var(--green);text-decoration:none;font-weight:700}main{width:min(720px,90vw);margin:55px auto}h1{margin:0 0 8px;font:700 40px Georgia,serif;letter-spacing:-1px}.lead{margin:0 0 26px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 35px rgba(47,57,48,.06);padding:25px}.bookmark{display:grid;grid-template-columns:120px 1fr;gap:17px;padding-bottom:22px;border-bottom:1px solid var(--line)}.image{border-radius:11px;background:linear-gradient(145deg,#29364f,#637499 62%,#c2cbe1);color:white;padding:13px;display:flex;align-items:end;font:700 17px Georgia,serif}.site{color:var(--muted);font-size:12px}.bookmark h2{font:700 22px Georgia,serif;margin:8px 0 5px}.bookmark p{margin:0;color:var(--muted)}.tag-area{padding-top:22px}.eyebrow{display:block;margin-bottom:10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px;min-height:28px}.tag{display:inline-flex;gap:7px;align-items:center;border-radius:99px;padding:5px 10px;background:#eaeee5;color:var(--green);font-size:13px;font-weight:700}.tag button{border:0;background:transparent;color:inherit;padding:0;cursor:pointer}.row{display:flex;gap:9px}input{width:100%;border:1px solid #bbbdb5;border-radius:10px;background:white;padding:11px 13px;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(49,92,75,.11)}button{border:0;border-radius:10px;padding:11px 17px;cursor:pointer;font-weight:750}.primary{background:var(--green);color:white}.secondary{background:#e7e8df;color:var(--ink)}.suggestions{display:flex;flex-wrap:wrap;gap:8px}.suggestion{border:1px solid var(--line);background:white;color:var(--ink)}.suggestion.selected{background:var(--lime);border-color:#b6c178;color:var(--green)}.select-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.select-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:10px;background:white}.select-item input{width:auto}.create{margin-top:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.notice{display:none;margin-top:15px;border-radius:10px;background:#edf2d4;color:var(--green);padding:11px 14px;font-weight:700}@media(max-width:560px){.bookmark{grid-template-columns:1fr}.image{min-height:90px}.select-list{grid-template-columns:1fr}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepwell</div><a class="back" href="tags.html">← Collection</a></header><main data-harness-ready="true"><h1>Edit bookmark</h1><p class="lead">Keep this bookmark easy to find later.</p><section class="panel"><div class="bookmark"><div class="image">Cities & memory</div><div><span class="site">atlasnotes.example</span><h2>The hidden life of public squares</h2><p>How shared spaces gather stories across generations.</p></div></div><div class="tag-area"><span class="eyebrow">Tags</span><div class="tags" id="tags"><span class="tag">reading <button aria-label="Remove reading">×</button></span></div><div id="control"></div><div class="actions"><button class="secondary">Cancel</button><button class="primary" id="save">Save changes</button></div><div class="notice" id="notice">Saved with tags: <span id="savedTags"></span></div></div></section></main>
<script>
const mode=new URLSearchParams(location.search).get('mode')||'a', control=document.querySelector('#control'), tags=document.querySelector('#tags');
const addTag=name=>{name=name.trim().toLowerCase();if(!name||[...tags.querySelectorAll('.tag')].some(x=>x.textContent.trim().replace('×','').trim()===name))return;const tag=document.createElement('span');tag.className='tag';tag.innerHTML=name+' <button aria-label="Remove '+name+'">×</button>';tag.querySelector('button').onclick=()=>tag.remove();tags.append(tag)};
tags.querySelector('button').onclick=e=>e.target.parentElement.remove();
if(mode==='a'){control.innerHTML='<div class="row"><input id="entry" placeholder="Type a tag"><button class="secondary" id="add">Add</button></div>';const entry=document.querySelector('#entry');document.querySelector('#add').onclick=()=>{addTag(entry.value);entry.value='';entry.focus()};entry.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('#add').click()}}}
if(mode==='b'){control.innerHTML='<div class="suggestions"><button class="suggestion">recipes</button><button class="suggestion">work</button><button class="suggestion">travel</button><button class="suggestion">ideas</button></div>';document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');b.classList.contains('selected')?addTag(b.textContent):[...tags.children].find(t=>t.textContent.trim().replace('×','').trim()===b.textContent)?.remove()})}
if(mode==='c'){control.innerHTML='<div class="select-list"><label class="select-item"><input type="checkbox" value="recipes"> recipes</label><label class="select-item"><input type="checkbox" value="work"> work</label><label class="select-item"><input type="checkbox" value="travel"> travel</label></div><div class="row create"><input id="entry" placeholder="Or create a new tag"><button class="secondary" id="add">Create</button></div>';document.querySelectorAll('[type=checkbox]').forEach(c=>c.onchange=()=>c.checked?addTag(c.value):[...tags.children].find(t=>t.textContent.trim().replace('×','').trim()===c.value)?.remove());const entry=document.querySelector('#entry');document.querySelector('#add').onclick=()=>{addTag(entry.value);entry.value=''}}
document.querySelector('#save').onclick=()=>{document.querySelector('#savedTags').textContent=[...tags.children].map(t=>t.textContent.trim().replace('×','').trim()).join(', ');document.querySelector('#notice').style.display='block'};
</script></body></html>
