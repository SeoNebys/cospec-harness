<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — first run</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 760px; margin: 0 auto; padding: 32px 20px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  .save-box { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .save-box label { display: block; font-size: 12px; color: #666; margin: 0 0 4px; }
  .save-box input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d5d5d5; border-radius: 7px; margin-bottom: 12px; }
  .save-box button { background: #2563eb; color: #fff; border: 0; border-radius: 7px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .search input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid #e2e2e2; border-radius: 9px; margin-bottom: 14px; background: #f4f4f4; color: #aaa; }
  .welcome { text-align: center; padding: 48px 24px; color: #666; }
  .welcome .big { font-size: 40px; margin-bottom: 12px; }
  .welcome h2 { font-size: 17px; margin: 0 0 8px; color: #333; }
  .welcome p { font-size: 14px; margin: 0; line-height: 1.5; }
  .welcome .arrow { margin-top: 18px; font-size: 13px; color: #2563eb; }
</style>
</head>
<body>
  <h1>📑 My Bookmarks</h1>

  <div class="save-box">
    <label>Link</label>
    <input placeholder="Paste a link here…" />
    <label>Name</label>
    <input placeholder="Grabbed automatically — edit if you like" />
    <label>Tags</label>
    <input placeholder="Type a tag…" />
    <button>Save</button>
  </div>

  <div class="search"><input placeholder="🔍 Search your bookmarks…" disabled /></div>

  <div class="welcome">
    <div class="big">📑</div>
    <h2>Your bookmarks live here</h2>
    <p>Save your first link above and it’ll show up right here.<br/>
       Give it a tag or two, and later you can find it by searching<br/>
       or by clicking a tag — however it comes to mind.</p>
    <div class="arrow">↑ Start by pasting a link</div>
  </div>
</body>
</html>
