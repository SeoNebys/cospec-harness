<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Bookmarks</span>
      </div>

      <button id="add-btn" class="btn btn-primary add-btn">
        <span class="plus">+</span> Add bookmark
      </button>

      <nav class="nav" id="scope-nav">
        <button class="nav-item" data-scope="active">
          <span>All</span><span class="nav-count" data-count="active">0</span>
        </button>
        <button class="nav-item" data-scope="read-later">
          <span>Read later</span><span class="nav-count" data-count="read_later">0</span>
        </button>
        <button class="nav-item" data-scope="archived">
          <span>Archived</span><span class="nav-count" data-count="archived">0</span>
        </button>
        <button class="nav-item" data-scope="all">
          <span>Everything</span><span class="nav-count" data-count="all">0</span>
        </button>
      </nav>

      <div class="nav-section">
        <div class="nav-section-head">
          <span>Saved filters</span>
        </div>
        <div id="saved-filters" class="saved-filters"></div>
      </div>

      <div class="nav-section">
        <div class="nav-section-head"><span>Tags</span></div>
        <div id="tag-cloud" class="tag-cloud"></div>
      </div>

      <div class="sidebar-footer">
        <button id="prefs-btn" class="link-btn">Preferences</button>
        <button id="io-btn" class="link-btn">Import / Export</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="search-wrap">
          <input id="search" class="search" type="search" autocomplete="off"
            placeholder='Search — try  react  "exact phrase"  tag:design  -video  site:github.com' />
          <button id="save-filter-btn" class="ghost-btn" title="Save this filter">☆ Save</button>
        </div>
        <div class="toolbar">
          <label class="sort-label">
            Sort
            <select id="sort">
              <option value="created_desc">Newest first</option>
              <option value="created_asc">Oldest first</option>
              <option value="updated_desc">Recently updated</option>
              <option value="title_asc">Title A→Z</option>
              <option value="title_desc">Title Z→A</option>
              <option value="domain_asc">Domain</option>
            </select>
          </label>
          <div class="view-toggle" id="view-toggle">
            <button data-view="grid" title="Grid view" class="active">▦</button>
            <button data-view="list" title="List view">☰</button>
          </div>
        </div>
      </header>

      <!-- Bulk action bar -->
      <div id="bulk-bar" class="bulk-bar hidden">
        <span id="bulk-count" class="bulk-count">0 selected</span>
        <div class="bulk-actions">
          <button data-bulk="read_later">Read later</button>
          <button data-bulk="unread_later">Unmark read</button>
          <button data-bulk="archive">Archive</button>
          <button data-bulk="unarchive">Unarchive</button>
          <button data-bulk="add_tag">Add tag…</button>
          <button data-bulk="remove_tag">Remove tag…</button>
          <button data-bulk="delete" class="danger">Delete</button>
        </div>
        <button id="bulk-clear" class="ghost-btn">Clear</button>
      </div>

      <div class="result-meta">
        <label class="select-all-wrap">
          <input type="checkbox" id="select-all" /> Select all
        </label>
        <span id="result-count" class="muted"></span>
      </div>

      <div id="cards" class="cards"></div>
      <div id="empty" class="empty hidden"></div>
    </main>
  </div>

  <!-- Toasts -->
  <div id="toasts" class="toasts"></div>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
