<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — label suggestions</title>
<style>
:root{--ink:#17211b;--muted:#68736c;--line:#dfe5df;--paper:#fbfcf8;--green:#256b4b;--wash:#eef5ee}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6vw}.brand{font:700 21px Georgia,serif}.mark{display:inline-block;width:22px;height:27px;background:var(--green);border-radius:3px 3px 8px 8px;margin-right:10px;vertical-align:middle}main{width:min(760px,90vw);margin:auto;padding:56px 0}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.13em;text-transform:uppercase}h1{font:500 43px Georgia,serif;margin:12px 0}.intro{color:var(--muted);margin:0 0 30px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 32px rgba(30,54,40,.06)}.domain{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.card h2{font:500 25px Georgia,serif;margin:8px 0}.desc{color:var(--muted);font-size:14px}.labels{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}.entry{display:flex;gap:8px;position:relative}input{min-width:0;flex:1;border:1px solid #aebfb2;border-radius:9px;padding:11px;font:inherit;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(37,107,75,.1)}button{border:0;border-radius:9px;background:var(--green);color:white;padding:10px 15px;font-weight:700;cursor:pointer}.suggestions{display:none;position:absolute;z-index:2;left:0;right:73px;top:48px;background:#fff;border:1px solid #cdd7cf;border-radius:10px;box-shadow:0 12px 25px rgba(30,54,40,.13);overflow:hidden}.suggestion{display:block;width:100%;margin:0;border:0;border-radius:0;background:#fff;color:var(--ink);text-align:left;padding:11px 13px;font-weight:500}.suggestion:hover,.suggestion:focus{background:var(--wash)}.suggestion small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.helper{font-size:12px;color:#849087;margin-top:8px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.chip{display:inline-flex;align-items:center;gap:7px;border-radius:20px;background:var(--wash);color:#315a43;padding:6px 8px 6px 11px;font-size:12px;font-weight:700}.remove{background:transparent;color:#587362;padding:0;width:18px;height:18px;font-size:15px;line-height:1}.save{width:100%;margin-top:18px}.status{display:none;text-align:center;margin-top:12px;color:var(--green);font-size:13px;font-weight:700}
</style></head><body><header><div class="brand"><span class="mark"></span>Trove</div></header><main data-harness-ready="true"><div class="eyebrow">Edit bookmark</div><h1>Use a label or make a new one.</h1><p class="intro">Suggestions come from labels already used elsewhere in your collection.</p><article class="card"><div class="domain">seriouseats.com</div><h2>Recipes I want to try</h2><p class="desc">Reliable cooking ideas for weekends.</p><div class="labels"><label for="label-input">Labels</label><div class="entry"><input id="label-input" autocomplete="off" placeholder="Type a label"><button id="add">Add</button><div class="suggestions" id="suggestions"></div></div><div class="helper">Choose a suggestion, or add what you typed as a new label.</div><div class="chips" id="chips"></div><button class="save" id="save">Save labels</button><div class="status" id="status">Labels saved to this bookmark</div></div></article></main>
<script>
const existing=['Cooking','Research','Work'];const input=document.querySelector('#label-input');const menu=document.querySelector('#suggestions');const chips=document.querySelector('#chips');
function addLabel(value){if(!value||[...chips.querySelectorAll('.chip')].some(c=>c.dataset.label.toLowerCase()===value.toLowerCase()))return;const chip=document.createElement('span');chip.className='chip';chip.dataset.label=value;chip.append(document.createTextNode(value));const remove=document.createElement('button');remove.className='remove';remove.type='button';remove.setAttribute('aria-label',`Remove ${value}`);remove.textContent='×';remove.onclick=()=>chip.remove();chip.append(remove);chips.append(chip);input.value='';menu.style.display='none';input.focus()}
function update(){const query=input.value.trim().toLowerCase();const matches=query?existing.filter(x=>x.toLowerCase().includes(query)&&![...chips.children].some(c=>c.dataset.label===x)):[];menu.innerHTML='';matches.forEach(value=>{const button=document.createElement('button');button.className='suggestion';button.type='button';button.innerHTML=`${value}<small>Already used in your collection</small>`;button.onclick=()=>addLabel(value);menu.append(button)});menu.style.display=matches.length?'block':'none'}
input.addEventListener('input',update);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addLabel(input.value.trim())}});document.querySelector('#add').onclick=()=>addLabel(input.value.trim());document.querySelector('#save').onclick=()=>document.querySelector('#status').style.display='block';
</script></body></html>
