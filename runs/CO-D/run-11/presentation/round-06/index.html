<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e4e6eb; --ink:#1c1e21; --sub:#65676b; --accent:#2f6fed; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 20px; }
  header h1 { margin:0; font-size:18px; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  .capture { background:var(--card); border:1px solid var(--line); border-radius:12px;
             padding:16px; margin-bottom:20px; }
  .capture label { display:block; font-size:13px; color:var(--sub); margin:0 0 4px; }
  .capture input { width:100%; padding:11px 12px; border:1px solid var(--line);
                   border-radius:9px; font-size:15px; }
  .capture input:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; margin-top:12px; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:9px;
                   padding:11px 18px; font-size:15px; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line); border-radius:8px;
                 padding:7px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  .hint { font-size:12px; color:var(--sub); }
  .examples { margin:10px 0 0; font-size:12px; color:var(--sub); }
  .chip { display:inline-block; background:#eef1f6; border:0; border-radius:20px; padding:5px 11px;
          margin:4px 6px 0 0; font-size:12px; cursor:pointer; color:var(--ink); }
  .list-head { font-size:13px; color:var(--sub); margin:6px 0 10px; text-transform:uppercase;
               letter-spacing:.04em; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:0; margin-bottom:12px; overflow:hidden; transition:box-shadow .3s; }
  .item.flash { box-shadow:0 0 0 3px rgba(47,111,237,.45); }
  .item .preview { width:100%; height:150px; object-fit:cover; display:block; background:#eef1f6; }
  .item .content { padding:14px 16px; display:flex; gap:12px; align-items:flex-start; }
  .fav { width:28px; height:28px; border-radius:7px; background:#eef1f6; flex:0 0 auto;
         display:flex; align-items:center; justify-content:center; font-size:15px; overflow:hidden; }
  .fav img { width:100%; height:100%; object-fit:cover; }
  .item .body { min-width:0; flex:1; }
  .item .title { font-size:15px; font-weight:600; margin:0 0 3px; word-break:break-word; }
  .item .title a { color:var(--ink); text-decoration:none; }
  .item .title a:hover { text-decoration:underline; }
  .item .desc { font-size:13px; color:#3a3c40; margin:0 0 6px; }
  .item .url { font-size:12px; color:var(--sub); word-break:break-all; margin:0; }
  .item .meta { font-size:12px; color:var(--sub); margin-top:6px; }
  .item .actions { margin-top:10px; }
  .edit { padding:14px 16px; border-top:1px solid var(--line); background:#fafbfc; }
  .edit label { display:block; font-size:12px; color:var(--sub); margin:0 0 4px; }
  .edit input, .edit textarea { width:100%; padding:9px 11px; border:1px solid var(--line);
        border-radius:8px; font-size:14px; margin-bottom:10px; font-family:inherit; }
  .edit textarea { resize:vertical; min-height:56px; }
  .empty { text-align:center; color:var(--sub); padding:40px 10px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#1c1e21; color:#fff; padding:10px 16px; border-radius:9px; font-size:14px;
           opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; text-align:center; }
  .toast.show { opacity:1; }
  @media (max-width:480px){ .row{flex-wrap:wrap;} button.primary{width:100%;} }
</style>
</head>
<body>
<header><h1>My Bookmarks</h1></header>
<main>
  <section class="capture">
    <label for="url">Paste a link to save</label>
    <input id="url" type="text" placeholder="https://…" autocomplete="off" />
    <div class="row">
      <button id="save" class="primary" disabled>Save link</button>
      <span class="hint" id="cap-hint">Enter a link to enable saving.</span>
    </div>
    <p class="examples">No link handy? Try one of these examples:
      <br><button class="chip" data-ex="https://www.nasa.gov/mars-exploration">nasa.gov · Mars article</button>
      <button class="chip" data-ex="https://realpython.com/python-decorators">realpython.com · tutorial</button>
      <button class="chip" data-ex="https://www.seriouseats.com/perfect-pasta">seriouseats.com · recipe</button>
    </p>
  </section>

  <p class="list-head">Saved links</p>
  <div id="list"></div>
</main>
<div class="toast" id="toast"></div>

<script>
  // --- Simulated page-metadata lookup ---------------------------------------
  // In the real app this is read from the actual page. Here a few example links
  // carry realistic details; anything else gets a reasonable fallback.
  var CANNED = {
    'https://www.nasa.gov/mars-exploration': {
      title:'Mars Exploration Program — NASA',
      desc:'NASA’s ongoing robotic exploration of Mars, including rovers, orbiters and future crewed mission planning.',
      icon:'https://www.google.com/s2/favicons?domain=nasa.gov&sz=64',
      image:'https://images.unsplash.com/photo-1614728263952-84ea256f9679?w=800&q=60'
    },
    'https://realpython.com/python-decorators': {
      title:'Primer on Python Decorators – Real Python',
      desc:'Learn how decorators work and how to use them to wrap and extend the behaviour of your functions and classes.',
      icon:'https://www.google.com/s2/favicons?domain=realpython.com&sz=64',
      image:'https://images.unsplash.com/photo-1526379095098-d400fd0bf935?w=800&q=60'
    },
    'https://www.seriouseats.com/perfect-pasta': {
      title:'The Food Lab: How to Cook Perfect Pasta',
      desc:'A step-by-step guide to cooking pasta properly, from salting the water to timing the sauce.',
      icon:'https://www.google.com/s2/favicons?domain=seriouseats.com&sz=64',
      image:'https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=800&q=60'
    }
  };

  var items = [];
  var seq = 0;
  var urlEl = document.getElementById('url');
  var saveEl = document.getElementById('save');
  var listEl = document.getElementById('list');
  var hintEl = document.getElementById('cap-hint');
  var toastEl = document.getElementById('toast');

  function normalize(u){
    u = (u||'').trim();
    if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u.replace(/\/+$/,''); // trailing slash ignored for duplicate matching
  }
  function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return u; } }
  function fmtDate(d){
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' +
           d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ toastEl.classList.remove('show'); },2400);
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function fetchMeta(url){
    if(CANNED[url]) return CANNED[url];
    var h = hostOf(url);
    return { title: h.charAt(0).toUpperCase()+h.slice(1), desc:'',
             icon:'https://www.google.com/s2/favicons?domain='+h+'&sz=64', image:'' };
  }

  function render(){
    if(items.length === 0){
      listEl.innerHTML = '<div class="empty">No links saved yet. Paste one above to get started.</div>';
      return;
    }
    listEl.innerHTML = '';
    items.forEach(function(it){
      var el = document.createElement('div');
      el.className = 'item'; el.id = 'item-'+it.id;
      var preview = it.image ? '<img class="preview" src="'+it.image+'" alt="" onerror="this.style.display=\'none\'">' : '';
      var favInner = it.icon ? '<img src="'+it.icon+'" alt="" onerror="this.parentNode.textContent=\'🔖\'">' : '🔖';
      var descHtml = it.desc ? '<p class="desc">'+escapeHtml(it.desc)+'</p>' : '';
      el.innerHTML =
        preview +
        '<div class="content">' +
          '<div class="fav">'+favInner+'</div>' +
          '<div class="body">' +
            '<p class="title"><a href="'+it.url+'" target="_blank" rel="noopener">'+escapeHtml(it.title)+'</a></p>' +
            descHtml +
            '<p class="url">'+escapeHtml(it.url)+'</p>' +
            '<p class="meta">Saved '+fmtDate(it.saved)+'</p>' +
            '<div class="actions"><button class="ghost" data-edit="'+it.id+'">Edit</button></div>' +
          '</div>' +
        '</div>';
      if(it.editing) el.appendChild(buildEditor(it));
      listEl.appendChild(el);
    });
  }

  function buildEditor(it){
    var box = document.createElement('div');
    box.className = 'edit';
    box.innerHTML =
      '<label>Title</label><input data-f="title" value="'+escapeHtml(it.title)+'">' +
      '<label>Web address</label><input data-f="url" value="'+escapeHtml(it.url)+'">' +
      '<label>Description</label><textarea data-f="desc">'+escapeHtml(it.desc||'')+'</textarea>' +
      '<div class="row" style="margin-top:0"><button class="primary" data-save-edit="'+it.id+'">Save changes</button>' +
      '<button class="ghost" data-cancel-edit="'+it.id+'">Cancel</button></div>';
    return box;
  }

  function findByUrl(url){ for(var i=0;i<items.length;i++){ if(items[i].url===url) return items[i]; } return null; }
  function flash(id){
    var el=document.getElementById('item-'+id); if(!el) return;
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); },1400);
  }

  function refreshButton(){
    var has = urlEl.value.trim().length > 0;
    saveEl.disabled = !has;
    hintEl.textContent = has ? 'Ready to save.' : 'Enter a link to enable saving.';
  }

  function save(){
    var raw = urlEl.value.trim(); if(!raw) return;
    var url = normalize(raw);
    var existing = findByUrl(url);
    if(existing){
      items.forEach(function(x){ x.editing=false; });
      existing.editing = true;
      urlEl.value=''; refreshButton(); render();
      flash(existing.id);
      toast('You already saved this link — opened it for editing.');
      return;
    }
    var m = fetchMeta(url);
    var it = { id:++seq, url:url, title:m.title, desc:m.desc, icon:m.icon, image:m.image,
               saved:new Date(), editing:false };
    items.unshift(it);
    urlEl.value=''; refreshButton(); render(); urlEl.focus();
    toast('Saved “'+it.title+'”');
  }

  listEl.addEventListener('click', function(e){
    var t = e.target;
    if(t.dataset.edit){ var it=byId(+t.dataset.edit); items.forEach(function(x){x.editing=false;}); it.editing=true; render(); }
    else if(t.dataset.cancelEdit){ var c=byId(+t.dataset.cancelEdit); c.editing=false; render(); }
    else if(t.dataset.saveEdit){
      var s=byId(+t.dataset.saveEdit);
      var box=t.closest('.edit');
      var newUrl=normalize(box.querySelector('[data-f=url]').value);
      if(!newUrl){ toast('A web address is required.'); return; }
      var clash=findByUrl(newUrl);
      if(clash && clash.id!==s.id){
        toast('Another bookmark already uses that address — showing it.');
        s.editing=false; render(); flash(clash.id); return;
      }
      s.title=(box.querySelector('[data-f=title]').value.trim())||s.title;
      s.url=newUrl;
      s.desc=box.querySelector('[data-f=desc]').value.trim();
      s.editing=false; render(); flash(s.id); toast('Changes saved.');
    }
  });
  function byId(id){ for(var i=0;i<items.length;i++) if(items[i].id===id) return items[i]; return null; }

  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ urlEl.value=c.dataset.ex; refreshButton(); urlEl.focus(); });
  });
  urlEl.addEventListener('input', refreshButton);
  urlEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); save(); }});
  saveEl.addEventListener('click', save);

  render(); refreshButton();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
