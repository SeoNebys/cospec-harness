<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nest — Bookmark prototype</title>
  <style>
    :root {
      --ink: #212523;
      --muted: #707572;
      --line: #dfe3df;
      --paper: #fbfaf6;
      --surface: #fff;
      --accent: #315f4d;
      --accent-soft: #e9f0ec;
      --shadow: 0 18px 48px rgba(34, 45, 39, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 238px 1fr; min-height: 100vh; }
    aside {
      padding: 32px 24px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.54);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-family: Georgia, serif; font-size: 24px; margin-bottom: 42px; }
    .brand-mark { width: 29px; height: 29px; border: 2px solid var(--accent); border-radius: 50% 50% 45% 45%; position: relative; }
    .brand-mark::after { content: ""; position: absolute; width: 10px; height: 7px; border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg); left: 8px; top: 7px; }
    nav { display: grid; gap: 7px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 9px; color: #5d625f; font-size: 14px; }
    .nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 650; }
    .nav-icon { width: 18px; text-align: center; font-size: 17px; }
    main { padding: 38px 48px; max-width: 1180px; width: 100%; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    h1 { font-family: Georgia, serif; font-size: 34px; font-weight: 500; margin: 0; letter-spacing: -.5px; }
    .sub { color: var(--muted); margin-top: 7px; font-size: 14px; }
    .primary { border: 0; border-radius: 9px; background: var(--accent); color: white; padding: 11px 17px; font-weight: 650; box-shadow: 0 4px 14px rgba(49,95,77,.18); }
    .empty { min-height: 540px; display: grid; place-items: center; text-align: center; }
    .empty-inner { margin-top: -40px; max-width: 360px; }
    .empty-art { width: 84px; height: 84px; margin: 0 auto 24px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); font-size: 36px; }
    .empty h2 { font-family: Georgia, serif; font-weight: 500; font-size: 24px; margin: 0 0 10px; }
    .empty p { color: var(--muted); line-height: 1.55; margin: 0; }
    .cards { padding-top: 36px; display: grid; gap: 14px; }
    .card { display: grid; grid-template-columns: 44px 1fr auto; gap: 15px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 20px; box-shadow: 0 5px 18px rgba(35,43,38,.04); }
    .site-icon { width: 44px; height: 44px; border-radius: 10px; background: #171918; color: white; display: grid; place-items: center; font-family: Georgia, serif; font-size: 22px; }
    .card h2 { font-size: 17px; margin: 1px 0 6px; }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0 0 10px; max-width: 700px; }
    .domain { color: #8a8e8b; font-size: 12px; }
    .saved { color: var(--accent); background: var(--accent-soft); border-radius: 999px; font-size: 12px; font-weight: 650; padding: 6px 10px; }
    dialog { border: 0; border-radius: 16px; width: min(520px, calc(100% - 32px)); padding: 0; box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(23, 30, 26, .42); backdrop-filter: blur(2px); }
    .modal { padding: 28px; }
    .modal h2 { font-family: Georgia, serif; font-size: 25px; font-weight: 500; margin: 0 0 7px; }
    .modal p { margin: 0 0 23px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
    input { width: 100%; border: 1px solid #cdd2ce; border-radius: 9px; padding: 12px 13px; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(49,95,77,.12); }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .secondary { border: 1px solid var(--line); border-radius: 9px; background: white; padding: 10px 16px; color: #555b57; }
    #save:disabled { opacity: .45; cursor: default; }
    .fetching { display: none; margin-top: 14px; color: var(--accent); font-size: 13px; }
    .fetching.show { display: block; }
    @media (max-width: 720px) { .shell { grid-template-columns: 1fr; } aside { display: none; } main { padding: 28px 20px; } }
  </style>
</head>
<body>
  <div class="shell" data-harness-ready="true">
    <aside>
      <div class="brand"><span class="brand-mark"></span>Nest</div>
      <nav>
        <div class="nav-item active"><span class="nav-icon">▦</span>All bookmarks</div>
        <div class="nav-item"><span class="nav-icon">◷</span>Read later</div>
        <div class="nav-item"><span class="nav-icon">□</span>Archive</div>
      </nav>
    </aside>
    <main>
      <header>
        <div><h1>Your bookmarks</h1><div class="sub" id="count">No bookmarks yet</div></div>
        <button class="primary" id="add">＋ Add bookmark</button>
      </header>
      <section class="empty" id="empty">
        <div class="empty-inner">
          <div class="empty-art">⌁</div>
          <h2>A calmer place for your links</h2>
          <p>Save your first page and its useful details will appear here automatically.</p>
        </div>
      </section>
      <section class="cards" id="cards" hidden></section>
    </main>
  </div>

  <dialog id="dialog">
    <form class="modal" method="dialog" id="form">
      <h2>Save a bookmark</h2>
      <p>Paste a link. We’ll collect the page details for you.</p>
      <label for="url">Web address</label>
      <input id="url" type="url" placeholder="https://example.com/article" autocomplete="off" required>
      <div class="fetching" id="fetching">Collecting the title and page details…</div>
      <div class="actions">
        <button type="button" class="secondary" id="cancel">Cancel</button>
        <button type="submit" class="primary" id="save">Save bookmark</button>
      </div>
    </form>
  </dialog>
  <script>
    const dialog = document.querySelector('#dialog');
    const form = document.querySelector('#form');
    const url = document.querySelector('#url');
    const fetching = document.querySelector('#fetching');
    const save = document.querySelector('#save');
    document.querySelector('#add').addEventListener('click', () => { dialog.showModal(); setTimeout(() => url.focus(), 50); });
    document.querySelector('#cancel').addEventListener('click', () => { dialog.close(); form.reset(); });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      fetching.classList.add('show');
      save.disabled = true;
      setTimeout(() => {
        dialog.close();
        fetching.classList.remove('show');
        save.disabled = false;
        form.reset();
        document.querySelector('#empty').hidden = true;
        const cards = document.querySelector('#cards');
        cards.hidden = false;
        cards.innerHTML = `<article class="card">
          <div class="site-icon">A</div>
          <div><h2>A guide to building a personal knowledge garden</h2>
          <p>Practical ideas for collecting, connecting, and returning to the things you learn online.</p>
          <div class="domain">articles.example.com</div></div>
          <span class="saved">Saved</span>
        </article>`;
        document.querySelector('#count').textContent = '1 bookmark';
      }, 750);
    });
  </script>
</body>
</html>
