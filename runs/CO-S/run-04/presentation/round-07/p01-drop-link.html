<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — prototype 01</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; background: #f4f5f7; color: #1c1e21;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #65676b; margin: 0 0 28px; font-size: 14px; }
  .adder {
    display: flex; gap: 8px; background: #fff; padding: 12px;
    border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .adder input {
    flex: 1; border: 1px solid #d0d3d8; border-radius: 8px;
    padding: 10px 12px; font-size: 15px;
  }
  .adder input:focus { outline: 2px solid #2d6cdf; border-color: transparent; }
  .adder button {
    border: 0; background: #2d6cdf; color: #fff; font-size: 15px;
    padding: 0 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .count { margin: 30px 0 12px; font-size: 13px; color: #65676b; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); word-break: break-all;
  }
  li a { color: #2d6cdf; text-decoration: none; font-size: 15px; }
  li a:hover { text-decoration: underline; }
  .empty { color: #90949c; font-size: 14px; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Your one spot for links.</p>

    <form class="adder" id="adder">
      <input id="url" type="text" placeholder="Paste a link here…" autocomplete="off" autofocus>
      <button type="submit">Save</button>
    </form>

    <div class="count" id="count"></div>
    <ul id="list"></ul>
  </div>

<script>
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const form = document.getElementById('adder');
  const input = document.getElementById('url');
  const items = [];

  function render() {
    if (items.length === 0) {
      count.textContent = '';
      list.innerHTML = '<li class="empty">Nothing saved yet. Paste a link above to get started.</li>';
      return;
    }
    count.textContent = items.length + (items.length === 1 ? ' link saved' : ' links saved');
    list.innerHTML = '';
    items.forEach(function (url) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = url; a.textContent = url; a.target = '_blank'; a.rel = 'noopener';
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const url = input.value.trim();
    if (!url) return;
    items.unshift(url);   // newest on top
    input.value = '';
    input.focus();
    render();
  });

  render();
</script>
</body>
</html>
