<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="text-medium">
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Save a link, find it again, keep what matters.</p>

  <div class="topbar">
    <button class="topbtn" id="exportBtn">⭳ Export bookmarks</button>
    <button class="topbtn" id="importBtn">⭱ Import bookmarks</button>
    <input type="file" id="importFile" accept=".html,.htm" hidden>
    <button class="topbtn" id="prefsBtn">⚙ Display</button>
    <span class="msg" id="msg"></span>
  </div>

  <div class="prefspanel" id="prefspanel" hidden>
    <div class="pref"><label>Default sort</label>
      <select id="pref-sort">
        <option value="added_desc">Newest first</option>
        <option value="added_asc">Oldest first</option>
        <option value="title_asc">Title A–Z</option>
        <option value="title_desc">Title Z–A</option>
      </select>
    </div>
    <div class="pref"><label>Items shown at a time</label>
      <select id="pref-page">
        <option value="10">10</option><option value="25">25</option>
        <option value="50">50</option><option value="100">100</option>
        <option value="all">All</option>
      </select>
    </div>
    <div class="pref"><label>Text size</label>
      <select id="pref-text">
        <option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option>
      </select>
    </div>
  </div>

  <div class="dupbanner" id="dupbanner" hidden></div>

  <form class="composer" id="composer">
    <div class="row">
      <label for="url">Link</label>
      <input id="url" type="text" placeholder="Paste or type a web address" autocomplete="off">
    </div>
    <div class="preview" id="preview" hidden><span class="spinner"></span><span>Fetching page details…</span></div>
    <div class="fetchnote" id="fetchnote" hidden></div>
    <div class="fields" id="fields" hidden>
      <div class="previmg" id="previmg" hidden></div>
      <div class="row two">
        <div style="flex:0 0 auto">
          <label>Icon</label>
          <span class="favicon" id="favicon"></span>
        </div>
        <div style="flex:1">
          <label for="title">Title</label>
          <input id="title" type="text" autocomplete="off">
        </div>
      </div>
      <div class="row"><label for="desc">Description</label><textarea id="desc"></textarea></div>
      <div class="row tagwrap">
        <label for="tags">Tags</label>
        <input id="tags" type="text" placeholder="Type a tag, comma to add another" autocomplete="off">
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <div class="row"><label for="note">Note (private)</label>
        <textarea id="note" placeholder="Optional reminder to yourself"></textarea>
        <div class="hint">Markdown: # headings, **bold**, *italic*, `code`, fenced code, &gt; quotes, - bullets, 1. numbered, [link](https://…).</div>
      </div>
      <label class="readlater"><input type="checkbox" id="readlater" checked>
        <span>Save to read later <em>(add it to your “To read” list)</em></span></label>
      <button class="save" type="submit">Save bookmark</button>
    </div>
  </form>

  <div class="tabs" id="tabs">
    <button class="tab active" data-f="all">All <span class="tc" id="tc-all"></span></button>
    <button class="tab" data-f="unread">To read <span class="tc" id="tc-unread"></span></button>
    <button class="tab" data-f="done">Finished <span class="tc" id="tc-done"></span></button>
    <button class="tab" data-f="archived">Archived <span class="tc" id="tc-archived"></span></button>
  </div>

  <div class="searchbar">
    <span class="mag">🔍</span>
    <input id="search" type="text" placeholder="Search by title, note, tag, description, or address" autocomplete="off">
    <button class="clearsearch" id="clearsearch" title="Clear" hidden>✕</button>
    <button class="savesearch" id="savesearch" title="Save this search" disabled>＋ Save search</button>
  </div>
  <div class="savedsearches" id="savedsearches"></div>

  <div class="listhead">
    <h2>Saved</h2>
    <div class="listhead-right">
      <span class="count" id="count"></span>
      <label class="sortlabel">Sort:
        <select id="sortsel">
          <option value="added_desc">Newest first</option>
          <option value="added_asc">Oldest first</option>
          <option value="title_asc">Title A–Z</option>
          <option value="title_desc">Title Z–A</option>
        </select>
      </label>
    </div>
  </div>

  <div class="selectrow">
    <label class="selectall"><input type="checkbox" id="selectall"> <span>Select all in this view</span></label>
  </div>
  <div class="bulkbar" id="bulkbar" hidden>
    <span class="bulkcount" id="bulkcount"></span>
    <div class="bulkactions" id="bulkactions"></div>
    <button class="bulkclear" id="bulkclear">Clear selection</button>
    <div class="bulktagpanel" id="bulktagpanel"></div>
  </div>

  <div id="list"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
