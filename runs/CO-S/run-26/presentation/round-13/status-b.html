<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading status — variant 2 (sections)</title>
<link rel="stylesheet" href="status.css" />
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Prototype — separating "to read" from "finished"</p>
  <span class="variant-tag">Variant 2 of 2 — grouped sections</span>
</header>

<div class="wrap">
  <div class="searchbar">
    <input id="search" type="text" placeholder="Search your bookmarks…" autocomplete="off" />
  </div>
  <p class="browse-label">Browse by tag</p>
  <div class="tagfilters" id="tagfilters"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<script>window.MODE = "sections";</script>
<script src="status-base.js"></script>
</body>
</html>
