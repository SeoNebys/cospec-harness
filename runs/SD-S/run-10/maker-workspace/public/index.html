<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app">
    <header class="app__header">
      <h1>Bookmark Manager</h1>
      <p class="app__subtitle">Save, search, and organize your links.</p>
    </header>

    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading" class="card__title">Add a bookmark</h2>
      <form id="bookmark-form" class="form" autocomplete="off">
        <input type="hidden" id="bookmark-id" />
        <label class="form__field">
          <span>Web address <span class="required">*</span></span>
          <input type="text" id="url" name="url" placeholder="example.com" required />
        </label>
        <label class="form__field">
          <span>Title</span>
          <input type="text" id="title" name="title" placeholder="Optional title" />
        </label>
        <label class="form__field">
          <span>Notes</span>
          <textarea id="notes" name="notes" rows="2" placeholder="Optional notes"></textarea>
        </label>
        <label class="form__field">
          <span>Tags</span>
          <input type="text" id="tags" name="tags" placeholder="Comma-separated, e.g. work, reading" />
        </label>
        <div class="form__actions">
          <button type="submit" id="submit-btn" class="btn btn--primary">Save bookmark</button>
          <button type="button" id="cancel-edit" class="btn btn--ghost hidden">Cancel</button>
        </div>
        <p id="form-message" class="form__message" role="alert" aria-live="assertive"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <div class="toolbar">
        <h2 id="list-heading" class="card__title">Your bookmarks</h2>
        <div class="toolbar__filters">
          <input type="search" id="search" placeholder="Search title, address, notes…" aria-label="Search bookmarks" />
          <select id="tag-filter" aria-label="Filter by tag">
            <option value="">All tags</option>
          </select>
        </div>
      </div>
      <p id="list-status" class="list-status" aria-live="polite"></p>
      <ul id="bookmark-list" class="bookmark-list"></ul>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
