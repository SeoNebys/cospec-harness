<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepwell — Read later complete</title><style>:root{--ink:#202722;--muted:#6b746e;--paper:#f4f1e9;--card:#fffdf8;--green:#315c4b;--lime:#dce7a7;--line:#d8d7ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button{font:inherit}header{height:72px;display:flex;align-items:center;padding:0 5vw;border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center;font:700 23px Georgia,serif}.mark{width:28px;height:34px;background:var(--green);border-radius:5px 5px 10px 10px;position:relative}.mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lime);top:8px;left:10px}.shell{display:grid;grid-template-columns:190px 1fr;gap:48px;width:min(940px,90vw);margin:52px auto}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:9px;padding:10px 12px;display:flex;justify-content:space-between;color:var(--ink)}.nav button.active{background:var(--green);color:white}.nav span{opacity:.65}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.head h1{margin:0;font:700 42px Georgia,serif}.head span{color:var(--muted)}.card{display:grid;grid-template-columns:160px 1fr;background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}.image{padding:15px;display:flex;align-items:end;color:white;font:700 19px Georgia,serif;background:linear-gradient(145deg,#29364f,#637499 62%,#c2cbe1)}.body{padding:20px}.site{color:var(--muted);font-size:12px}.card h2{margin:6px 0 5px;font:700 21px Georgia,serif}.desc{margin:0 0 14px;color:var(--muted)}button.action{border:1px solid #bcc77d;background:var(--lime);color:var(--green);border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:750}.empty{display:none;min-height:330px;place-items:center;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:15px;padding:35px}.empty.show{display:grid}.check{margin:0 auto 15px;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--lime);color:var(--green);font-size:23px;font-weight:900}.empty h2{margin:0 0 7px;font:700 25px Georgia,serif}.empty p{margin:0 0 19px;color:var(--muted)}.browse{border:0;background:var(--green);color:white;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer}.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:99px;padding:10px 16px;font-weight:700}.toast.show{display:block}@media(max-width:650px){.shell{grid-template-columns:1fr}.card{grid-template-columns:1fr}.image{min-height:100px}}</style></head><body><header><div class="brand"><span class="mark"></span>Keepwell</div></header><main class="shell" data-harness-ready="true"><aside><nav class="nav"><button>All bookmarks <span>4</span></button><button class="active">Read later <span id="count">1</span></button><button>Archive <span>0</span></button></nav></aside><section><div class="head"><h1>Read later</h1><span id="result">1 bookmark</span></div><article class="card" id="card"><div class="image">Cities & memory</div><div class="body"><span class="site">atlasnotes.example</span><h2>The hidden life of public squares</h2><p class="desc">How shared spaces gather stories across generations.</p><button class="action" id="read">✓ Mark as read</button></div></article><div class="empty" id="empty"><div><div class="check">✓</div><h2>You’re all caught up</h2><p>There’s nothing waiting in Read later.</p><button class="browse">Browse all bookmarks</button></div></div></section></main><div class="toast" id="toast">Marked as read — still in your collection</div><script>document.querySelector('#read').onclick=()=>{document.querySelector('#card').style.display='none';document.querySelector('#count').textContent='0';document.querySelector('#result').textContent='0 bookmarks';document.querySelector('#empty').classList.add('show');const toast=document.querySelector('#toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)};</script></body></html>
