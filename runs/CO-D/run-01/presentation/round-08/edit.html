<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keep — Editing prototype</title>
  <style>
    :root{--ink:#14251d;--muted:#68736e;--line:#dfe6e2;--brand:#176b4b;--pale:#e5f4ec}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#f2f5f2}button,input,textarea{font:inherit}.shell{max-width:1040px;min-height:100vh;margin:auto;background:#fbfcfa;border-inline:1px solid #e8ece9}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:760}.mark{width:32px;height:32px;display:grid;place-items:center;color:#fff;background:var(--brand);border-radius:10px 10px 10px 3px}main{max-width:780px;margin:auto;padding:66px 28px}h1{margin:0;font-size:32px;letter-spacing:-.04em}.lead{margin:8px 0 28px;color:var(--muted)}.card{position:relative;display:grid;grid-template-columns:116px 1fr auto;gap:18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 7px 20px rgba(31,61,46,.05)}.thumb{min-height:108px;border-radius:12px;background:linear-gradient(145deg,#d9eadf,#82b49d);display:grid;place-items:center;color:#fff;font-size:36px}.domain{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.favicon{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;color:#fff;background:#202a25;font-size:10px;font-weight:800}.title{margin:7px 0 5px;font-size:18px;font-weight:750}.desc{margin:0;color:var(--muted);font-size:14px}.control{align-self:start}button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:680}.edit{color:var(--brand);background:var(--pale)}.more{width:38px;padding:8px;color:var(--ink);background:#eef2ef;font-size:18px}.menu{display:none;position:absolute;right:18px;top:58px;width:150px;padding:6px;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(20,40,30,.18);z-index:2}.menu button{width:100%;text-align:left;background:white}.hover-edit{position:absolute;right:14px;top:14px;width:38px;height:38px;padding:0;display:none;color:var(--brand);background:var(--pale);font-size:18px}.card:hover .hover-edit,.hover-edit:focus{display:block}dialog{width:min(560px,calc(100% - 32px));border:0;border-radius:20px;padding:0;color:var(--ink);box-shadow:0 24px 80px rgba(18,40,29,.28)}dialog::backdrop{background:rgba(17,35,26,.42);backdrop-filter:blur(2px)}.modal{padding:26px}.modal h2{margin:0;font-size:22px}.sub{margin:6px 0 20px;color:var(--muted)}label{display:block;margin:13px 0 5px;font-size:12px;font-weight:740;color:var(--muted)}input,textarea{width:100%;padding:10px;border:1px solid #cad6cf;border-radius:9px;outline:0}input:focus,textarea:focus{border-color:#68a78e;box-shadow:0 0 0 3px #dff2e9}textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{background:#edf1ee}.primary{color:white;background:var(--brand)}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);padding:11px 17px;color:#fff;background:#18372a;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.card{grid-template-columns:1fr}.thumb{min-height:130px}}
  </style>
</head>
<body>
  <div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark">↗</span> Keep</div><span style="color:var(--muted);font-size:13px">1 bookmark</span></header><main><h1>Your bookmarks</h1><p class="lead">Everything you’ve saved, ready when you need it.</p>
    <article class="card" id="card"><div class="thumb">✦</div><div><div class="domain"><span class="favicon">F</span> fortelabs.com</div><div class="title">My PARA reference</div><p class="desc">A simple, comprehensive system for organizing any type of digital information across any platform.</p></div><div class="control" id="control"></div><div class="menu" id="menu"><button id="menuEdit">Edit details</button></div></article>
  </main></div>
  <dialog id="dialog"><div class="modal"><h2>Edit bookmark</h2><p class="sub">Make this bookmark easier to recognize later.</p><label for="title">Title</label><input id="title" value="My PARA reference"><label for="desc">Description</label><textarea id="desc">A simple, comprehensive system for organizing any type of digital information across any platform.</textarea><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save changes</button></div></div></dialog><div class="toast" id="toast">Changes saved</div>
  <script>
    const version=new URLSearchParams(location.search).get('v')||'a', control=document.querySelector('#control'), dialog=document.querySelector('#dialog'), menu=document.querySelector('#menu');
    const openEdit=()=>{menu.style.display='none';dialog.showModal()};
    if(version==='a'){control.innerHTML='<button class="edit" id="trigger">Edit</button>'}
    if(version==='b'){control.innerHTML='<button class="more" id="trigger" aria-label="More actions">•••</button>';document.querySelector('#trigger').onclick=()=>menu.style.display=menu.style.display==='block'?'none':'block';document.querySelector('#menuEdit').onclick=openEdit}
    if(version==='c'){control.innerHTML='<button class="hover-edit" id="trigger" aria-label="Edit bookmark">✎</button>'}
    if(version!=='b')document.querySelector('#trigger').onclick=openEdit;
    document.querySelector('#cancel').onclick=()=>dialog.close();
    document.querySelector('#save').onclick=()=>{document.querySelector('.title').textContent=document.querySelector('#title').value;document.querySelector('.desc').textContent=document.querySelector('#desc').value;dialog.close();const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)};
  </script>
</body></html>
