<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepwell — Invalid link</title><style>:root{--ink:#202722;--muted:#6b746e;--paper:#f4f1e9;--card:#fffdf8;--green:#315c4b;--lime:#dce7a7;--line:#d8d7ce;--red:#a23b35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button,input{font:inherit}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center;font:700 23px Georgia,serif}.mark{width:28px;height:34px;background:var(--green);border-radius:5px 5px 10px 10px;position:relative}.mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lime);top:8px;left:10px}.count{color:var(--muted);font-size:13px}main{width:min(720px,90vw);margin:70px auto}h1{margin:0;font:700 45px Georgia,serif}.lead{margin:10px 0 28px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:24px;box-shadow:0 14px 35px rgba(47,57,48,.06)}label{display:block;margin-bottom:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.row{display:flex;gap:9px}input{width:100%;border:1px solid #bbbdb5;border-radius:10px;background:white;padding:12px 14px;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(49,92,75,.11)}input.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(162,59,53,.09)}button{border:0;border-radius:10px;padding:12px 18px;background:var(--green);color:white;cursor:pointer;font-weight:750;white-space:nowrap}.error{display:none;margin:8px 0 0;color:var(--red);font-size:13px;font-weight:650}.error.show{display:block}@media(max-width:560px){.row{display:block}.row button{width:100%;margin-top:9px}}</style></head><body><header><div class="brand"><span class="mark"></span>Keepwell</div><span class="count">4 bookmarks</span></header><main data-harness-ready="true"><h1>Save a bookmark</h1><p class="lead">Paste a link and we’ll fill in the useful details.</p><section class="panel"><label for="url">Web address</label><div class="row"><input id="url" value="remember that article"><button id="fetch">Get details</button></div><p class="error" id="error">Enter a web address, like https://example.com/page</p></section></main><script>const input=document.querySelector('#url'),error=document.querySelector('#error');document.querySelector('#fetch').onclick=()=>{input.classList.add('invalid');input.setAttribute('aria-invalid','true');error.classList.add('show');input.focus();input.select()};input.oninput=()=>{input.classList.remove('invalid');input.removeAttribute('aria-invalid');error.classList.remove('show')};</script></body></html>
