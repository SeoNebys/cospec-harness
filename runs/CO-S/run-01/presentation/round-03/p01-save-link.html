<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype p01</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a1a;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; margin: 0 0 24px; }
  .addbar {
    display: flex; gap: 8px; background: #fff; padding: 12px;
    border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 24px;
  }
  .addbar input {
    flex: 1; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 10px 12px; font-size: 15px;
  }
  .addbar button {
    border: 0; background: #2563eb; color: #fff; font-size: 15px;
    padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .addbar button:hover { background: #1d4ed8; }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .favicon {
    width: 32px; height: 32px; border-radius: 8px; background: #eef2ff;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    color: #4f46e5; font-weight: 700; flex-shrink: 0;
  }
  .meta { min-width: 0; }
  .title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .title a { color: #111827; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .url { font-size: 12.5px; color: #6b7280; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Save a link and it shows up below.</p>

  <div class="addbar">
    <input id="urlInput" type="text" placeholder="Paste a link here, e.g. https://…" autofocus />
    <button id="addBtn">Save</button>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
</div>

<script>
  const list = document.getElementById('list');
  const input = document.getElementById('urlInput');
  const countEl = document.getElementById('count');
  const bookmarks = [];

  function niceTitleFromUrl(raw) {
    try {
      let u = raw.trim();
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      const url = new URL(u);
      const host = url.hostname.replace(/^www\./, '');
      // derive a readable name from the domain, e.g. "nytimes.com" -> "Nytimes"
      const base = host.split('.')[0];
      const name = base.charAt(0).toUpperCase() + base.slice(1);
      return { title: name, host, href: u };
    } catch (e) {
      return { title: raw, host: raw, href: raw };
    }
  }

  function render() {
    countEl.textContent = bookmarks.length
      ? bookmarks.length + (bookmarks.length === 1 ? ' saved link' : ' saved links')
      : '';
    if (!bookmarks.length) {
      list.innerHTML = '<li class="empty">Nothing saved yet.</li>';
      return;
    }
    list.innerHTML = '';
    bookmarks.forEach(b => {
      const li = document.createElement('li');
      li.innerHTML =
        '<div class="favicon">' + b.title.charAt(0).toUpperCase() + '</div>' +
        '<div class="meta">' +
          '<p class="title"><a href="' + b.href + '" target="_blank">' + b.title + '</a></p>' +
          '<p class="url">' + b.host + '</p>' +
        '</div>';
      list.appendChild(li);
    });
  }

  function add() {
    const raw = input.value.trim();
    if (!raw) return;
    const b = niceTitleFromUrl(raw);
    bookmarks.unshift(b);
    input.value = '';
    input.focus();
    render();
  }

  document.getElementById('addBtn').addEventListener('click', add);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  render();
</script>
</body>
</html>
