<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 16 (saved copy)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; --green:#059669; --amber:#b45309; --red:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:18px 20px 60px; }

  .protoctl { background:#111827; color:#fff; border-radius:10px; padding:10px 13px; margin-bottom:18px; font-size:12px; }
  .protoctl .lbl { text-transform:uppercase; letter-spacing:.06em; opacity:.7; margin-right:8px; }
  .protoctl button { background:#374151; color:#d1d5db; border:0; border-radius:7px; padding:6px 11px; font-size:12px; cursor:pointer; margin-right:6px; }
  .protoctl button.on { background:var(--accent); color:#fff; font-weight:600; }
  .protoctl .d { opacity:.85; margin-top:8px; }

  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; position:relative; }
  li.card.dead { border-left:3px solid var(--amber); }
  .title { font-size:15px; font-weight:600; margin:0; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .saved { color:var(--muted); font-size:11px; margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chk { color:var(--green); } .warn { color:var(--amber); }
  .acts { margin-top:11px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; font-size:13px; padding:7px 12px; cursor:pointer; color:#374151; }
  .btn.live { border-color:#c7d2fe; color:var(--accent); font-weight:600; }
  .btn.copy { border-color:#a7f3d0; color:var(--green); font-weight:600; }

  .backdrop { position:fixed; inset:0; background:rgba(17,24,39,.5); display:none; align-items:stretch; justify-content:center; padding:24px; }
  .backdrop.show { display:flex; }
  .viewer { background:#fff; border-radius:14px; width:720px; max-width:96vw; box-shadow:0 24px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden; }
  .vbar { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:#fafafa; }
  .vbar .vt { font-weight:600; font-size:14px; } .vbar .vs { color:var(--muted); font-size:12px; }
  .vbar .x { margin-left:auto; border:0; background:#eef0f3; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:16px; }
  .snapnote { background:#fffbeb; border-bottom:1px solid #fde68a; color:var(--amber); font-size:13px; padding:9px 16px; }
  .vbody { padding:0; overflow:auto; }

  /* readable capture style */
  .reader { padding:30px 40px; max-width:100%; }
  .reader h2 { font-size:22px; margin:0 0 4px; } .reader .byline { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .reader p { font-size:15px; line-height:1.7; color:#1f2937; margin:0 0 14px; }
  .reader img.hero { width:100%; height:150px; object-fit:cover; border-radius:8px; margin-bottom:16px; background:linear-gradient(120deg,#c7d2fe,#a7f3d0); }

  /* visual capture style */
  .shot { background:#eef0f3; padding:16px; }
  .shotpage { background:#fff; border:1px solid #d1d5db; border-radius:6px; box-shadow:0 8px 20px rgba(0,0,0,.08); overflow:hidden; }
  .shotpage .navbar { background:#111827; color:#fff; padding:10px 14px; font-size:12px; display:flex; gap:10px; }
  .shotpage .hero2 { height:130px; background:linear-gradient(120deg,#6366f1,#22c55e); }
  .shotpage .body2 { padding:18px 22px; } .shotpage .body2 h2 { margin:0 0 10px; font-size:20px; }
  .shotpage .body2 .ln { height:10px; background:#e5e7eb; border-radius:5px; margin:8px 0; }
  .shotpage .body2 .ln.s { width:70%; } .shotpage .body2 .ln.m { width:88%; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <div class="protoctl">
    <span class="lbl">Prototype control · what the saved copy captures</span>
    <button data-cap="reader" class="on">A · Readable copy</button>
    <button data-cap="visual">B · Visual snapshot</button>
    <div class="d" id="capdesc"></div>
  </div>
  <ul id="list"></ul>
</main>
<div class="backdrop" id="backdrop"><div class="viewer" id="viewer"></div></div>

<script>
let cap='reader';
const CAP={
  reader:"Saves the page's words — title, text, key images — as a clean, readable copy. Small to store, always readable, but not the exact visual layout.",
  visual:"Saves a picture of the whole page as it looked. Pixel-faithful to what you saw, but heavier to store and you can't select/search its text as easily."
};
let items=[
  { id:1, title:"Designing the Stripe Payments API", url:"https://stripe.com/blog/payment-api",
    desc:"Idempotency and versioning at scale.", saved:"12 Mar 2026", alive:true,
    article:["We treat every API surface as a long-term contract.",
             "Idempotency keys let a client safely retry a request without fear of double charges.",
             "Versioning by date means old integrations keep working for years."] },
  { id:2, title:"36 Hours in Kyoto", url:"https://nytimes.com/2026/travel/kyoto",
    desc:"Temples at dawn and quiet streets.", saved:"03 Jan 2026", alive:true,
    article:["Begin before sunrise at Fushimi Inari, before the crowds.",
             "A tofu lunch in Arashiyama, then the bamboo grove.",
             "End the day on the quiet streets of Gion."] },
  { id:3, title:"Project Aurora — design notes", url:"https://oldstartup.example.com/aurora",
    desc:"The original architecture write-up.", saved:"19 Aug 2019", alive:false,
    article:["Aurora's core idea was a single event log every service could replay.",
             "We chose eventual consistency for the read models.",
             "These notes outlived the company that hosted them."] },
];
const list=document.getElementById('list'), backdrop=document.getElementById('backdrop'),
      viewer=document.getElementById('viewer'), capdesc=document.getElementById('capdesc');
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } }

function render(){
  capdesc.textContent=CAP[cap];
  list.innerHTML=items.map(it=>`
    <li class="card ${it.alive?'':'dead'}" data-id="${it.id}">
      <p class="title">${it.title}</p>
      <p class="desc">${it.desc}</p>
      <div class="url"><span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${host(it.url)}</div>
      <div class="saved">
        ${it.alive
          ? `<span class="chk">✓ Saved copy kept</span> · from ${it.saved}`
          : `<span class="warn">⚠ Original page no longer reachable</span> · your saved copy from ${it.saved} is safe`}
      </div>
      <div class="acts">
        <button class="btn live" data-live="${it.id}">↗ Open live page</button>
        <button class="btn copy" data-copy="${it.id}">📄 View saved copy</button>
      </div>
    </li>`).join('');
  list.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>openViewer(+b.dataset.copy)));
  list.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{
    const it=items.find(x=>x.id===+b.dataset.live);
    if(it.alive) window.open(/^https?:/.test(it.url)?it.url:'https://'+it.url,'_blank');
    else alert("The live page couldn't be reached — but your saved copy is right here. Try “View saved copy”.");
  }));
}
function openViewer(id){
  const it=items.find(x=>x.id===id);
  const note = it.alive ? '' : `<div class="snapnote">⚠ The live page is gone or changed — this is your saved copy from ${it.saved}.</div>`;
  const content = cap==='reader'
    ? `<div class="reader"><img class="hero"><h2>${it.title}</h2>
        <div class="byline">${host(it.url)} · saved ${it.saved}</div>
        ${it.article.map(p=>`<p>${p}</p>`).join('')}</div>`
    : `<div class="shot"><div class="shotpage">
         <div class="navbar"><span>${host(it.url)}</span><span style="opacity:.6">▲ ▼ ⟳</span></div>
         <div class="hero2"></div>
         <div class="body2"><h2>${it.title}</h2>
           ${it.article.map(()=>`<div class="ln m"></div><div class="ln s"></div>`).join('')}
         </div></div>
         <div style="text-align:center;color:#6b7280;font-size:11px;margin-top:10px">picture of the page as it looked when saved</div></div>`;
  viewer.innerHTML=`<div class="vbar"><span class="vt">${it.title}</span>
      <span class="vs">saved copy · ${cap==='reader'?'readable':'visual'}</span>
      <button class="x" id="vx">×</button></div>
    ${note}<div class="vbody">${content}</div>`;
  viewer.querySelector('#vx').addEventListener('click',()=>backdrop.classList.remove('show'));
  backdrop.classList.add('show');
}
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.classList.remove('show'); });
document.querySelector('.protoctl').addEventListener('click',e=>{ const b=e.target.closest('button[data-cap]'); if(!b) return;
  cap=b.dataset.cap; document.querySelectorAll('.protoctl button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
render();
</script>
</body>
</html>
