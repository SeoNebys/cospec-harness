<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Save a link with any tags you like — then just type a word to find it again.</p>

  <!-- Save (SCN-001) + optional multi-tags (SCN-003) -->
  <div class="card">
    <form id="adder" autocomplete="off">
      <div class="row">
        <input id="url" type="text" placeholder="Paste a link…" aria-label="Link to save">
        <button type="submit">Save</button>
      </div>
      <div class="tagline">
        <span class="lbl">Tags (optional):</span>
        <input id="tags" type="text" placeholder="e.g.  travel, cooking   — add as many as you like" aria-label="Tags">
      </div>
    </form>
  </div>
  <p class="notice" id="notice"></p>

  <!-- Find by search (SCN-002) -->
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
    </svg>
    <input id="q" type="text" placeholder="Search your links (title, site, or tag)…" aria-label="Search your links">
    <button class="clear" id="clear" title="Clear search" aria-label="Clear search">&times;</button>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<script src="core.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
