<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Home</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/card.css"></head>
<body><main id="app"><header><div><h1>Link Home</h1><p>Your personal collection</p></div><div class="total"><strong id="visible-count">0</strong> visible</div></header>
<section class="save-panel"><h2>Save a link</h2><form id="save-form" novalidate><input id="save-url" aria-label="Web address" placeholder="Paste a web address…"><button>Save link</button></form><p id="save-message" class="message" role="status"></p></section>
<section class="tools"><input id="search" type="search" aria-label="Search saved links" placeholder="Search text, #labels, phrases, AND, OR, NOT…"><nav id="labels" aria-label="Filter by label"></nav><nav class="tabs"><button data-status="read" class="active">To read <span>0</span></button><button data-status="done">Done <span>0</span></button></nav></section>
<section id="cards" class="cards"></section><section id="empty" class="empty" hidden><h2></h2><p></p><button hidden></button></section><p id="summary" class="summary"></p></main>
<div id="shade" class="shade"></div><aside id="editor" aria-label="Edit bookmark" aria-hidden="true"><button id="close-edit" class="quiet">Close</button><h2>Edit bookmark</h2><p>Update the details you want to remember.</p><label>Title<input id="edit-title"></label><label>Description<textarea id="edit-description"></textarea></label><label>Web address<input id="edit-url"></label><label>Your note<textarea id="edit-note" placeholder="Why did you save this?"></textarea></label><label>Labels<input id="edit-labels" list="label-options" placeholder="Comma-separated labels"></label><datalist id="label-options"></datalist><p id="edit-error" class="message error" role="alert"></p><div class="editor-actions"><button id="cancel-edit" class="quiet">Cancel</button><button id="save-edit">Save changes</button></div></aside>
<dialog id="snapshot"><div class="dialog-head"><strong>Saved page copy</strong><button>Close</button></div><iframe title="Saved page copy"></iframe></dialog>
<template id="card-template"><article class="card"><div class="card-top"><div><div class="status"></div><h2><a target="_blank" rel="noopener"></a></h2></div><div class="card-actions"><button class="edit quiet">Edit bookmark</button><button class="toggle"></button></div></div><div class="long-text"><p class="description"></p><div class="note-wrap" hidden><strong>Your note</strong><p class="note"></p></div><button class="show-more" hidden>Show more</button></div><div class="source"></div><div class="chips"></div><div class="quick-label"><input aria-label="Add a label" placeholder="Add a label…" list="label-options"><button>Add label</button></div><div class="snapshot-line"></div></article></template>
<script type="module" src="/app.js"></script></body></html>
