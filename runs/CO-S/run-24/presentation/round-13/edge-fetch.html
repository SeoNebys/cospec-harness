<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmark app — edge: page details couldn't load</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2430; --muted:#6b7280; --faint:#9aa1ac; --line:#e5e7eb; --accent:#2f6feb; --chip:#eef2ff; --chip-ink:#3949ab; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 64px; }
  .row { display:flex; gap:8px; margin-bottom:16px; }
  .row input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  button.primary { padding:10px 16px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  ul.links { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  li.link { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; gap:12px; }
  .favicon { flex:0 0 auto; width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; background:#9aa1ac; }
  .body { flex:1; min-width:0; }
  .title { font-size:15px; font-weight:600; margin:0 0 3px; }
  .title a { color:var(--ink); text-decoration:none; }
  .warn { font-size:12px; color:#b26a00; background:#fff3e0; border-radius:6px; padding:5px 9px; display:inline-flex; align-items:center; gap:6px; margin:0 0 8px; }
  .fixbtn { font-size:12px; padding:4px 10px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
  .fixbtn:hover { border-color:var(--accent); color:var(--accent); }
  .titleedit { display:flex; gap:6px; margin:0 0 8px; }
  .titleedit input { flex:1; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .secondary { font-size:12px; color:var(--faint); margin:6px 0 0; word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Edge situation — the app couldn't read a page's details automatically.</p>
</header>
<main>
  <div class="row">
    <input type="text" value="https://internal.example.com/report?id=8842" readonly />
    <button class="primary" disabled>Saved ✓</button>
  </div>
  <ul class="links">
    <li class="link" id="card">
      <div class="favicon">?</div>
      <div class="body">
        <p class="title"><a href="#" onclick="return false">internal.example.com/report?id=8842</a></p>
        <span class="warn">⚠︎ Couldn't load this page's title or description automatically.</span>
        <div id="editwrap"></div>
        <p class="secondary">internal.example.com · Saved just now</p>
      </div>
    </li>
  </ul>
</main>
<script>
  var editing=false, savedTitle="";
  var wrap=document.getElementById("editwrap");
  function render(){
    wrap.innerHTML="";
    if(editing){
      var e=document.createElement("div"); e.className="titleedit";
      var inp=document.createElement("input"); inp.placeholder="Give this link a title you'll recognise"; inp.value=savedTitle;
      var b=document.createElement("button"); b.className="primary"; b.textContent="Save"; b.style.padding="7px 12px";
      b.onclick=function(){ savedTitle=inp.value.trim(); editing=false;
        document.querySelector(".title a").textContent = savedTitle || "internal.example.com/report?id=8842"; render(); };
      e.appendChild(inp); e.appendChild(b); wrap.appendChild(e);
      setTimeout(function(){inp.focus();},0);
    } else {
      var btn=document.createElement("button"); btn.className="fixbtn";
      btn.textContent = savedTitle ? "Edit the title" : "＋ Add a title yourself";
      btn.onclick=function(){ editing=true; render(); };
      wrap.appendChild(btn);
    }
  }
  render();
  document.body.setAttribute("data-harness-ready","true");
</script>
</body>
</html>
