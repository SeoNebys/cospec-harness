<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🔖 Bookmarks</h1>
    <div class="search">
      <input id="search" type="search" placeholder="Search title, url, tags…" autocomplete="off" />
    </div>
    <button id="addBtn" class="primary">+ Add bookmark</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Tags</h2>
      <ul id="tagList" class="tag-list"></ul>
    </aside>

    <section class="content">
      <div id="activeFilter" class="active-filter" hidden></div>
      <div id="list" class="cards"></div>
      <p id="empty" class="empty" hidden>No bookmarks yet. Add your first one!</p>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="modalTitle">Add bookmark</h2>
      <form id="form">
        <input type="hidden" id="bmId" />
        <label>URL <span class="req">*</span>
          <input id="url" type="text" placeholder="example.com" required />
        </label>
        <label>Title
          <input id="title" type="text" placeholder="Optional — defaults to URL" />
        </label>
        <label>Description
          <textarea id="description" rows="2" placeholder="Optional notes"></textarea>
        </label>
        <label>Tags
          <input id="tags" type="text" placeholder="comma,separated,tags" />
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
