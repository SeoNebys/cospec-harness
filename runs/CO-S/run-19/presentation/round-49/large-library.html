<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keepwell — Large library</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="organize.css" />
    <link rel="stylesheet" href="large-library.css" />
  </head>
  <body>
    <div class="app-shell" data-harness-ready="true">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Keepwell home"><span class="brand-mark" aria-hidden="true">K</span><span>Keepwell</span></a>
        <nav aria-label="Main navigation"><a class="nav-item active" href="#"><span aria-hidden="true">⌂</span>All bookmarks<span class="nav-count">347</span></a><a class="nav-item" href="#"><span aria-hidden="true">◷</span>Read later<span class="nav-count">18</span></a><a class="nav-item" href="#"><span aria-hidden="true">□</span>Archive<span class="nav-count">42</span></a></nav>
        <div class="sidebar-section"><p>TAGS</p><a href="#"><span class="tag-dot animals"></span>research<span>86</span></a><a href="#"><span class="tag-dot reading"></span>reading<span>64</span></a><a href="#"><span class="tag-dot design"></span>design<span>51</span></a><a href="#"><span class="tag-dot more"></span>24 more tags<span>…</span></a></div>
        <div class="sidebar-foot"><p>Your personal library</p><span>Only visible to you</span></div>
      </aside>
      <main>
        <header class="topbar"><div><p class="eyebrow">LIBRARY</p><h1>All bookmarks</h1></div><button class="quiet-button" type="button" aria-label="Open settings">•••</button></header>
        <section class="large-search" aria-label="Search bookmarks"><span aria-hidden="true">⌕</span><input type="search" placeholder="Search titles, descriptions, or websites…" /></section>
        <section class="organize-toolbar large-controls"><div class="filter-group"><button class="filter-chip active" type="button">All <span>347</span></button><button class="filter-chip" type="button">research <span>86</span></button><button class="filter-chip" type="button">reading <span>64</span></button><button class="filter-chip" type="button">design <span>51</span></button></div><label class="sort-control">Sort<select><option>Newest first</option><option>Oldest first</option><option>Title A–Z</option><option>Title Z–A</option></select></label></section>
        <div class="list-heading large-heading"><p><strong>347 bookmarks</strong><span id="range-label">Showing 1–8</span></p></div>
        <section id="large-list" class="large-list" aria-live="polite"></section>
        <nav id="page-controls" class="page-controls" aria-label="Bookmark pages"><button id="previous-page" type="button" disabled>← Previous</button><div><button class="current-page" type="button">1</button><button type="button">2</button><button type="button">3</button><span>…</span><button type="button">44</button></div><button id="next-page" type="button">Next →</button></nav>
        <div id="load-controls" class="load-controls" hidden><button id="load-more" type="button">Show 8 more</button><span id="load-progress">Showing 8 of 347</span></div>
      </main>
    </div>
    <script src="large-library.js"></script>
  </body>
</html>
