<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#f7f8fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:720px; margin:0 auto; padding:32px 20px 80px; }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .add-btn { border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; padding:10px 16px; border-radius:10px; cursor:pointer; white-space:nowrap; }
  .add-btn:hover { background:#1d4ed8; }

  .adder { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin:0 0 20px; display:none; }
  .adder.open { display:block; }
  .adder h2 { font-size:15px; margin:0 0 12px; }
  .field { margin:0 0 12px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin:0 0 4px; }
  .field input, .field textarea { width:100%; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; outline:none; background:#fff; font-family:inherit; }
  .field input:focus, .field textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .field textarea { min-height:56px; resize:vertical; }
  .autofilled { font-size:11px; color:#059669; margin-left:6px; }
  .preview { display:none; }
  .preview.show { display:block; }
  .row-btns { display:flex; gap:8px; margin-top:4px; }
  .save { border:none; background:var(--accent); color:#fff; font-weight:600; font-size:14px; padding:10px 18px; border-radius:8px; cursor:pointer; }
  .save:disabled { background:#cbd5e1; cursor:default; }
  .cancel { border:1px solid var(--line); background:#fff; color:#334155; font-size:14px; padding:10px 16px; border-radius:8px; cursor:pointer; }
  .chips-in { display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .chips-in input { border:none; outline:none; box-shadow:none !important; flex:1; min-width:120px; padding:4px; }
  .chip-editable { font-size:12px; padding:3px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; border:1px solid #c7d2fe; display:inline-flex; gap:6px; align-items:center; }
  .chip-editable button { border:none; background:none; color:#3730a3; cursor:pointer; font-size:13px; line-height:1; padding:0; }
  .suggest { margin-top:8px; font-size:12px; color:var(--muted); }
  .suggest button { font-size:12px; padding:3px 9px; border-radius:999px; background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; cursor:pointer; margin:0 4px 4px 0; }
  .suggest button:hover { border-color:#c7d2fe; }

  .search { position:sticky; top:0; background:var(--bg); padding:12px 0 10px; z-index:2; }
  .search input { width:100%; font-size:17px; padding:14px 16px; border:1px solid var(--line); border-radius:10px; outline:none; background:#fff; }
  .search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .tagbar { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px; padding-bottom:6px; }
  .tagbar .label { font-size:12px; color:var(--muted); align-self:center; margin-right:2px; }
  .filter { font-size:13px; padding:5px 12px; border-radius:999px; background:#fff; color:#334155; border:1px solid #e2e8f0; cursor:pointer; }
  .filter:hover { border-color:#c7d2fe; }
  .filter.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .clear { font-size:13px; padding:5px 12px; border-radius:999px; background:#fee2e2; color:#991b1b; border:1px solid #fecaca; cursor:pointer; margin-left:4px; }
  .count { color:var(--muted); font-size:13px; margin:4px 2px 14px; }
  ul { list-style:none; margin:0; padding:0; }
  li { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  li.fresh { animation:pop .5s ease; border-color:#86efac; }
  @keyframes pop { from { background:#f0fdf4; } to { background:#fff; } }
  .title { font-size:16px; font-weight:600; margin:0 0 3px; }
  .title a { color:var(--ink); text-decoration:none; }
  .title a:hover { text-decoration:underline; }
  .site { color:var(--accent); font-size:12px; margin:0 0 6px; }
  .desc { color:#374151; font-size:14px; margin:0 0 8px; line-height:1.45; }
  .date { color:var(--muted); font-size:12px; margin:0 0 8px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:12px; padding:3px 9px; border-radius:999px; background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; cursor:pointer; }
  .tag:hover { background:#e0e7ff; border-color:#c7d2fe; color:#3730a3; }
  .tag.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  mark { background:#fde68a; color:inherit; padding:0 1px; border-radius:2px; }
  .empty { color:var(--muted); text-align:center; padding:48px 12px; }
  .empty strong { color:var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>My Bookmarks</h1>
        <p class="sub">Everything you've saved, all in one place.</p>
      </div>
      <button class="add-btn" id="addBtn">＋ Add bookmark</button>
    </div>

    <div class="adder" id="adder">
      <h2>Save a new bookmark</h2>
      <div class="field">
        <label>Paste the link</label>
        <input id="url" type="text" placeholder="https://…" autocomplete="off" />
      </div>

      <div class="preview" id="preview">
        <div class="field">
          <label>Title <span class="autofilled" id="tFill"></span></label>
          <input id="fTitle" type="text" />
        </div>
        <div class="field">
          <label>Site <span class="autofilled" id="sFill"></span></label>
          <input id="fSite" type="text" />
        </div>
        <div class="field">
          <label>What it's about <span class="autofilled" id="dFill"></span></label>
          <textarea id="fDesc"></textarea>
        </div>
        <div class="field">
          <label>Labels (type and press Enter)</label>
          <div class="chips-in" id="chipsIn">
            <input id="labelInput" type="text" placeholder="e.g. recipe" autocomplete="off" />
          </div>
          <div class="suggest" id="suggest"></div>
        </div>
      </div>

      <div class="row-btns">
        <button class="save" id="saveBtn" disabled>Save it</button>
        <button class="cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <div class="search"><input id="q" type="text" placeholder="Search your bookmarks…" autocomplete="off" /></div>
    <div class="tagbar" id="tagbar"></div>
    <div class="count" id="count"></div>

    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none;"></div>
  </div>

<script>
  const bookmarks = [
    { title:"The best way to cook pasta, according to science", source:"Serious Eats", site:"seriouseats.com", desc:"Why you don't need a huge pot of water, and how much salt actually matters when boiling pasta.", date:"Saved 3 weeks ago", tags:["recipe"] },
    { title:"How to structure a large React application", source:"Martin Fowler", site:"martinfowler.com", desc:"Folder structure, state management, and where to draw module boundaries as a front-end project grows.", date:"Saved 5 days ago", tags:["work","reference"] },
    { title:"The psychology of why we procrastinate", source:"The Atlantic", site:"theatlantic.com", desc:"A long read on why we put things off, and what actually helps. Been meaning to finish this one.", date:"Saved 6 weeks ago", tags:["read later"] },
    { title:"A no-knead bread recipe anyone can make", source:"The New York Times", site:"nytimes.com", desc:"Four ingredients, no kneading, overnight rise. The crustiest loaf from a home oven.", date:"Saved 4 months ago", tags:["recipe"] }
  ];

  // Simulated "the app reads the page for you" — keyed by something in the URL.
  const fetchMock = [
    { match:"smittenkitchen", title:"The best olive oil cake, ever", source:"Smitten Kitchen", desc:"A one-bowl olive oil cake with a crackly top — plush, citrusy, and impossible to mess up." },
    { match:"nytimes", title:"A weeknight sheet-pan chicken dinner", source:"The New York Times", desc:"Everything roasts on one tray: chicken thighs, potatoes and lemon. Minimal cleanup." },
    { match:"css-tricks", title:"A complete guide to Flexbox", source:"CSS-Tricks", desc:"The go-to visual reference for the flexbox layout properties, with diagrams for each one." }
  ];

  let pendingTags = [];
  const $ = id => document.getElementById(id);
  const list=$('list'), empty=$('empty'), count=$('count'), q=$('q'), tagbar=$('tagbar');
  let activeTag=null;

  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
  function highlight(text,tokens){const safe=escapeHtml(text);if(!tokens.length)return safe;const re=new RegExp('\\b('+tokens.map(esc).join('|')+')','ig');return safe.replace(re,'<mark>$1</mark>');}

  // ---------- Add flow ----------
  function guessFromUrl(u){
    const hit = fetchMock.find(m=>u.toLowerCase().includes(m.match));
    if(hit) return {...hit, autofilled:true};
    // fallback: pull a readable-ish name from the address
    let host=''; try { host=new URL(u).hostname.replace(/^www\./,''); } catch(e){}
    if(!host) return null;
    const name = host.split('.')[0].replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    return { title:'(couldn\'t read the title — type it here)', source:name, site:host, desc:'', autofilled:false };
  }

  function renderChips(){
    const box=$('chipsIn');
    box.querySelectorAll('.chip-editable').forEach(e=>e.remove());
    pendingTags.forEach((t,i)=>{
      const c=document.createElement('span'); c.className='chip-editable';
      c.innerHTML=`${escapeHtml(t)} <button data-i="${i}">✕</button>`;
      c.querySelector('button').addEventListener('click',()=>{ pendingTags.splice(i,1); renderChips(); });
      box.insertBefore(c,$('labelInput'));
    });
  }
  function renderSuggest(){
    const existing=[...new Set(bookmarks.flatMap(b=>b.tags))].filter(t=>!pendingTags.includes(t));
    $('suggest').innerHTML = existing.length ? 'Reuse a label: '+existing.map(t=>`<button data-t="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('') : '';
    $('suggest').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ pendingTags.push(b.getAttribute('data-t')); renderChips(); renderSuggest(); }));
  }
  function addLabelFromInput(){
    const v=$('labelInput').value.trim();
    if(v && !pendingTags.includes(v)){ pendingTags.push(v); renderChips(); renderSuggest(); }
    $('labelInput').value='';
  }

  function openAdder(){ $('adder').classList.add('open'); $('url').focus(); }
  function closeAdder(){
    $('adder').classList.remove('open'); $('preview').classList.remove('show');
    $('url').value=''; $('fTitle').value=''; $('fSite').value=''; $('fDesc').value='';
    pendingTags=[]; renderChips(); renderSuggest(); $('saveBtn').disabled=true;
    $('tFill').textContent=''; $('sFill').textContent=''; $('dFill').textContent='';
  }

  $('addBtn').addEventListener('click',openAdder);
  $('cancelBtn').addEventListener('click',closeAdder);

  $('url').addEventListener('input',()=>{
    const u=$('url').value.trim();
    const g = u ? guessFromUrl(u) : null;
    if(!g){ $('preview').classList.remove('show'); $('saveBtn').disabled=true; return; }
    $('preview').classList.add('show');
    $('fTitle').value=g.title; $('fSite').value=g.source; $('fDesc').value=g.desc;
    const tag = g.autofilled ? 'filled in for you' : '';
    $('tFill').textContent=tag; $('sFill').textContent=tag; $('dFill').textContent=g.autofilled?'filled in for you':'';
    renderSuggest();
    $('saveBtn').disabled=false;
  });

  $('labelInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addLabelFromInput(); }});

  $('saveBtn').addEventListener('click',()=>{
    const b={ title:$('fTitle').value.trim()||'(untitled)', source:$('fSite').value.trim()||'Unknown site',
      site:'', desc:$('fDesc').value.trim(), date:'Saved just now', tags:[...pendingTags], _fresh:true };
    bookmarks.unshift(b);
    closeAdder();
    q.value=''; activeTag=null;
    render();
  });

  // ---------- Find + roundup (approved SCN-001 / SCN-002) ----------
  function renderTagbar(){
    const allTags=[...new Set(bookmarks.flatMap(b=>b.tags))];
    tagbar.innerHTML = (allTags.length?'<span class="label">Round up:</span>':'') + allTags.map(t=>
      `<button class="filter ${t===activeTag?'on':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')
      + (activeTag?'<button class="clear" id="clearBtn">✕ Show all again</button>':'');
    tagbar.querySelectorAll('.filter').forEach(el=>el.addEventListener('click',()=>{ const t=el.getAttribute('data-tag'); activeTag=(activeTag===t)?null:t; render(); }));
    const cb=$('clearBtn'); if(cb) cb.addEventListener('click',()=>{ activeTag=null; render(); });
  }

  function render(){
    const term=q.value;
    const tokens=term.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const tokenRes=tokens.map(tok=>new RegExp('\\b'+esc(tok),'i'));
    const matches=bookmarks.filter(b=>{
      if(activeTag && !b.tags.includes(activeTag)) return false;
      if(!tokens.length) return true;
      const hay=(b.title+' '+b.desc+' '+b.source+' '+b.site).toLowerCase();
      return tokenRes.every(re=>re.test(hay));
    });
    renderTagbar();

    if(matches.length===0){
      list.innerHTML=''; empty.style.display='block'; empty.innerHTML='Nothing to show for that.'; count.textContent=''; return;
    }
    empty.style.display='none';
    count.textContent = matches.length + (matches.length===1?' bookmark':' bookmarks') + (activeTag?' tagged "'+escapeHtml(activeTag)+'"':'');

    list.innerHTML = matches.map(b=>`
      <li class="${b._fresh?'fresh':''}">
        <p class="title"><a href="#" onclick="return false;">${highlight(b.title,tokens)}</a></p>
        <p class="site">${highlight(b.source,tokens)}</p>
        ${b.desc?`<p class="desc">${highlight(b.desc,tokens)}</p>`:''}
        <p class="date">${escapeHtml(b.date)}</p>
        <div class="tags">${b.tags.map(t=>`<span class="tag ${t===activeTag?'on':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}</div>
      </li>`).join('');
    list.querySelectorAll('.tag').forEach(el=>el.addEventListener('click',()=>{ const t=el.getAttribute('data-tag'); activeTag=(activeTag===t)?null:t; render(); window.scrollTo({top:0,behavior:'smooth'}); }));
    bookmarks.forEach(b=>{ if(b._fresh) delete b._fresh; });
  }

  q.addEventListener('input',render);
  render();
</script>
</body>
</html>
