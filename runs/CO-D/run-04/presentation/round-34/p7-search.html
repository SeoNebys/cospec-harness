<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 7 (search)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:22px 20px 60px; }

  .searchwrap { position:relative; margin-bottom:16px; }
  .searchwrap input { width:100%; padding:13px 40px 13px 40px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; }
  .searchwrap .ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .searchwrap .x { position:absolute; right:11px; top:50%; transform:translateY(-50%); border:0; background:#eef0f3; color:#6b7280; border-radius:50%; width:22px; height:22px; cursor:pointer; display:none; }
  .searchwrap .x.show { display:block; }

  .barlabel { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 2px 8px; }
  .topicsbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .topicsbar .t { background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .topicsbar .t .c { color:var(--muted); font-size:11px; margin-left:5px; }
  .topicsbar .t.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .topicsbar .t.on .c { color:#dbe3ff; }

  .count { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:0 2px 10px; }
  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .title { font-size:15px; font-weight:600; margin:0; } .title .ext { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .note { color:#6d5100; background:#fffbeb; border:1px solid #fde68a; border-radius:7px; font-size:12px; margin:8px 0 0; padding:6px 9px; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#eef2ff; color:#3730a3; font-size:11px; border-radius:20px; padding:3px 10px; }
  mark { background:#fde68a; color:inherit; border-radius:3px; padding:0 2px; }
  .where { display:inline-block; margin-top:8px; font-size:11px; color:#3730a3; background:#eef2ff; border-radius:6px; padding:2px 8px; }
  .empty { color:var(--muted); text-align:center; padding:38px 14px; font-size:14px; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <div class="searchwrap">
    <span class="ico">🔍</span>
    <input id="q" type="text" placeholder="Search your links — name, description, your note, or address…" autocomplete="off">
    <button class="x" id="clearq">×</button>
  </div>

  <div class="barlabel">Topics</div>
  <div class="topicsbar" id="bar"></div>

  <div class="count" id="count"></div>
  <ul id="list"></ul>
</main>

<script>
let q='', selected=[];
let items=[
  { url:"https://wikipedia.org/wiki/Sourdough", title:"Sourdough — Wikipedia", desc:"Bread by fermentation of dough.", note:"24h cold-proof for extra tang.", tags:["recipes","baking"] },
  { url:"https://seriouseats.com/pizza-dough", title:"The Best Pizza Dough", desc:"A cold-ferment dough for blistered crust.", note:"", tags:["recipes","baking"] },
  { url:"https://cooking.com/weeknight-ramen", title:"Weeknight Ramen", desc:"A fast broth for busy evenings.", note:"", tags:["recipes"] },
  { url:"https://nytimes.com/2026/travel/kyoto", title:"36 Hours in Kyoto", desc:"Temples at dawn and quiet streets.", note:"Book a ryokan early — they fill up.", tags:["travel"] },
  { url:"https://atlasobscura.com/lisbon", title:"Hidden Lisbon", desc:"Miradouros, trams, and pastel de nata.", note:"", tags:["travel"] },
  { url:"https://stripe.com/blog/payment-api", title:"Designing the Stripe Payments API", desc:"Idempotency and versioning at scale.", note:"", tags:["work","dev"] },
  { url:"https://linear.app/method", title:"The Linear Method", desc:"How a focused team ships software.", note:"", tags:["work"] },
  { url:"https://reactjs.org/hooks", title:"Thinking in Hooks", desc:"State and effects without classes.", note:"", tags:["dev"] },
];
function tagCounts(){ const m={}; items.forEach(i=>i.tags.forEach(t=>m[t]=(m[t]||0)+1)); return m; }

const qEl=document.getElementById('q'), clearq=document.getElementById('clearq'),
      bar=document.getElementById('bar'), count=document.getElementById('count'), list=document.getElementById('list');
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } }
function full(u){ return /^https?:\/\//.test(u)?u:"https://"+u; }
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hl(s){ s=esc(s); if(!q) return s;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return s.replace(re,'<mark>$1</mark>'); }

function inField(it){ const n=q.toLowerCase();
  return { title:it.title.toLowerCase().includes(n), desc:(it.desc||'').toLowerCase().includes(n),
           note:(it.note||'').toLowerCase().includes(n), url:it.url.toLowerCase().includes(n) }; }
function hits(it){ const f=inField(it); return f.title||f.desc||f.note||f.url; }
function whereText(it){ const f=inField(it); const w=[];
  if(f.note) w.push('your note'); if(f.url) w.push('the web address');
  // only surface the non-obvious places (note/address); title/desc are visible with highlight
  return w.length? 'Found in '+w.join(' & ') : ''; }

function renderBar(){
  const c=tagCounts();
  bar.innerHTML=Object.keys(c).sort().map(t=>`<span class="t ${selected.includes(t)?'on':''}" data-topic="${t}">${t}<span class="c">${c[t]}</span></span>`).join('');
  bar.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>{
    const t=el.dataset.topic; selected.includes(t)? selected=selected.filter(x=>x!==t): selected.push(t); render(); }));
}
function render(){
  let shown=items.filter(it=> selected.every(t=>it.tags.includes(t)));
  if(q) shown=shown.filter(hits);
  const label = q ? `${shown.length} match ${JSON.stringify(q)}` : (selected.length? `${shown.length} shown` : `${items.length} links`);
  count.textContent=label;
  clearq.classList.toggle('show', !!q);
  if(!shown.length){
    list.innerHTML=`<div class="empty">No links ${q?`match “${esc(q)}”`:''}${q&&selected.length?' in ':''}${selected.length?`your selected topics`:''}.<br>Try a different word${selected.length?', or clear a topic':''}.</div>`;
    return;
  }
  list.innerHTML=shown.map(it=>{ const i=items.indexOf(it); const w=q?whereText(it):'';
    return `<li class="card" data-open="${i}">
      <p class="title">${hl(it.title)}<span class="ext">↗ open</span></p>
      <p class="desc">${hl(it.desc)}</p>
      ${it.note?`<p class="note"><b>Note to self:</b> ${hl(it.note)}</p>`:''}
      <div class="url"><span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${hl(host(it.url))}</div>
      <div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      ${w?`<span class="where">${w}</span>`:''}
    </li>`; }).join('');
  list.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>window.open(full(items[+el.dataset.open].url),'_blank')));
}
qEl.addEventListener('input',()=>{ q=qEl.value.trim(); render(); });
clearq.addEventListener('click',()=>{ q=''; qEl.value=''; qEl.focus(); render(); });
renderBar(); render();
</script>
</body>
</html>
