<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — Page details unavailable</title><style>
:root{--ink:#17231e;--muted:#68736d;--paper:#f5f2e9;--card:#fffdf7;--line:#d9d5ca;--green:#235d45;--red:#8b3f31;--redpale:#f7e8e3}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 80% 10%,#dce8dd,transparent 30rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea{font:inherit}.shell{width:min(860px,calc(100% - 44px));margin:auto}header{height:78px;display:flex;align-items:center;border-bottom:1px solid rgba(23,35,30,.1);font-weight:760}.mark{width:34px;height:34px;margin-right:10px;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:11px}main{padding:65px 0 90px}h1{margin:0;font:500 49px/1 Georgia,serif;letter-spacing:-.04em}.lead{margin:12px 0 31px;color:var(--muted);font-size:16px}.savebox{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 14px 40px rgba(36,48,41,.08)}.savebox input{flex:1;min-width:0;padding:11px;border:0;outline:0;color:var(--ink);background:transparent}.savebox button,.actions button{padding:11px 16px;border:0;border-radius:9px;color:#fff;background:var(--green);font-weight:730;cursor:pointer}.error{display:none;margin-top:16px;padding:15px;gap:11px;align-items:start;border:1px solid #e5bfb4;border-radius:12px;color:var(--red);background:var(--redpale)}.error.visible{display:flex;animation:rise .22s ease both}.error strong{display:block;margin-bottom:3px;font-size:13px}.error p{margin:0;font-size:12px;line-height:1.45}.icon{width:25px;height:25px;display:grid;place-items:center;flex:none;border:1px solid #d9a79a;border-radius:50%;font-weight:800}.manual{display:none;margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:15px;background:var(--card)}.manual.visible{display:block;animation:rise .22s ease both}.manual h2{margin:0 0 15px;font:500 24px Georgia,serif}.field{display:block;margin-bottom:14px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}.field input,.field textarea{width:100%;margin-top:6px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;resize:none;outline:none}.actions{display:flex;justify-content:flex-end;margin-top:17px}.status{display:none;margin-top:12px;color:var(--green);font-size:12px;font-weight:700}.status.visible{display:block}@keyframes rise{from{opacity:0;transform:translateY(6px)}}@media(max-width:620px){.savebox{flex-direction:column}}
</style></head><body><div class="shell" data-harness-ready="true"><header><span class="mark">T</span>Trove</header><main><h1>Save a link.</h1><p class="lead">Paste an address and Trove will get the details ready.</p><form class="savebox" id="form"><input type="url" aria-label="Web address" value="https://small-journal.example/article"><button>Get details</button></form><div class="error" id="error" role="alert"><span class="icon">!</span><div><strong>We couldn’t get this page’s details.</strong><p>The link can still be saved. Add the title yourself, and a description if you want one.</p></div></div><section class="manual" id="manual"><h2>Fill in what you know</h2><label class="field">Title<input aria-label="Title" placeholder="Give this bookmark a title" required></label><label class="field">Description · optional<textarea aria-label="Description" rows="3" placeholder="Add a short description"></textarea></label><div class="actions"><button id="save" type="button">Save bookmark</button></div><p class="status" id="status">Bookmark saved with your details</p></section></main></div><script>
document.querySelector('#form').onsubmit=e=>{e.preventDefault();e.currentTarget.querySelector('button').textContent='Couldn’t get details';document.querySelector('#error').classList.add('visible');document.querySelector('#manual').classList.add('visible');document.querySelector('[aria-label="Title"]').focus()};document.querySelector('#save').onclick=()=>{const title=document.querySelector('[aria-label="Title"]');if(!title.value.trim()){title.focus();title.style.borderColor='#8b3f31';return}document.querySelector('#status').classList.add('visible')};
</script></body></html>
