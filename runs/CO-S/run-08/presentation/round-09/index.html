<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e4e7ec;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 18px 24px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px; }

  .add-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 28px;
  }
  .add-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
  .field label { font-size: 12px; color: var(--muted); }
  input {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
  }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    align-self: flex-end;
  }
  button.primary:hover { background: #1d4ed8; }

  .topic-group { margin-bottom: 26px; }
  .topic-head {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topic-count {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 20px;
    padding: 1px 9px;
    font-size: 11px;
    font-weight: 600;
  }
  .bm {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .bm a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
  .bm a:hover { text-decoration: underline; }
  .bm .url { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .bm { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .bm .bm-main { min-width: 0; flex: 1; }
  .bm-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .bm-actions button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .bm-actions .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
  .bm-actions .del-btn:hover { border-color: #dc2626; color: #dc2626; }
  .edit-form { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .edit-form .add-row { gap: 8px; }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions .save-edit { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .edit-actions .cancel-edit { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .confirm-del { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; align-items: center; gap: 10px; width: 100%; }
  .confirm-del button { border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; border: 1px solid transparent; }
  .confirm-del .yes { background: #dc2626; color: #fff; }
  .confirm-del .no { background: #fff; border-color: var(--line); color: var(--muted); }
  .search-card { margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .chip { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #search {
    font-size: 15px;
    padding: 12px 14px;
  }
  .search-meta { color: var(--muted); font-size: 12px; margin-top: 6px; min-height: 16px; }
  mark { background: #fde68a; color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 50px 20px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .flash { animation: flash 1.2s ease; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: var(--card); } }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Save a link, and it lands under its topic.</p>
</header>

<div class="wrap">
  <div class="add-card">
    <div class="add-row">
      <div class="field">
        <label for="url">Link address</label>
        <input id="url" type="text" placeholder="https://…" />
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="What is this link?" />
      </div>
      <div class="field">
        <label for="topic">Topic</label>
        <input id="topic" type="text" placeholder="e.g. Design, Recipes" />
      </div>
      <button class="primary" id="save">Save link</button>
    </div>
  </div>

  <div class="search-card">
    <input id="search" type="text" placeholder="Search your links by word, title or topic…" />
    <div id="search-meta" class="search-meta"></div>
  </div>

  <div class="chips" id="chips"></div>

  <div id="list"></div>
</div>

<script>
  const seed = [
    { url: "https://www.smashingmagazine.com/", title: "Smashing Magazine", topic: "Design" },
    { url: "https://refactoring.guru/", title: "Refactoring Guru", topic: "Development" },
    { url: "https://www.bbcgoodfood.com/", title: "BBC Good Food", topic: "Recipes" },
  ];
  const params = new URLSearchParams(location.search);
  const stateParam = params.get("state");
  let bookmarks;
  if (stateParam === "empty") {
    bookmarks = [];
  } else if (stateParam === "long") {
    bookmarks = [
      { url: "https://example.com/a-very-long-address/" + "segment-".repeat(20) + "end?ref=newsletter&utm_source=looooong", title: "A remarkably long bookmark title that keeps going well past what you would normally expect a link name to be, just to see how the layout copes", topic: "Research" },
      { url: "https://example.com/short", title: "", topic: "" },
    ];
  } else {
    bookmarks = JSON.parse(localStorage.getItem("bm") || "null") || seed.slice();
  }

  let activeTopic = "All";
  let editingId = null;
  let confirmingDeleteId = null;
  function persist() { if (!stateParam) localStorage.setItem("bm", JSON.stringify(bookmarks)); }

  function allTopics() { return [...new Set(bookmarks.map(b => b.topic || "Uncategorized"))].sort((a, b) => a.localeCompare(b)); }
  function renderChips() {
    const c = document.getElementById("chips");
    c.innerHTML = "";
    if (bookmarks.length === 0) return;
    if (activeTopic !== "All" && !allTopics().includes(activeTopic)) activeTopic = "All";
    ["All", ...allTopics()].forEach(t => {
      const el = document.createElement("button");
      el.className = "chip" + (t === activeTopic ? " active" : "");
      el.textContent = t;
      el.onclick = () => {
        activeTopic = t;
        if (t === "All") document.getElementById("search").value = "";
        renderChips();
        render();
      };
      c.appendChild(el);
    });
  }

  function render(flashId) {
    const list = document.getElementById("list");
    const meta = document.getElementById("search-meta");
    const q = document.getElementById("search").value.trim().toLowerCase();
    list.innerHTML = "";
    if (bookmarks.length === 0) {
      list.innerHTML = '<div class="empty">No links saved yet.<br>Add your first one above.</div>';
      meta.textContent = "";
      return;
    }
    let matches = bookmarks.map((b, i) => ({ ...b, i }));
    if (activeTopic !== "All") {
      matches = matches.filter(b => (b.topic || "Uncategorized") === activeTopic);
    }
    if (q) {
      matches = matches.filter(b =>
        (b.title || "").toLowerCase().includes(q) ||
        (b.url || "").toLowerCase().includes(q) ||
        (b.topic || "").toLowerCase().includes(q));
      meta.textContent = matches.length + (matches.length === 1 ? " link found" : " links found");
    } else {
      meta.textContent = "";
    }
    if (q && matches.length === 0) {
      list.innerHTML = '<div class="empty">No links match "' + escapeHtml(q) + '".<br>Try a different word.</div>';
      return;
    }
    const topics = {};
    matches.forEach(b => { (topics[b.topic || "Uncategorized"] ||= []).push(b); });
    Object.keys(topics).sort((a, b) => a.localeCompare(b)).forEach(topic => {
      const group = document.createElement("div");
      group.className = "topic-group";
      group.innerHTML = `<h2 class="topic-head">${escapeHtml(topic)} <span class="topic-count">${topics[topic].length}</span></h2>`;
      topics[topic].forEach(b => {
        const el = document.createElement("div");
        el.className = "bm" + (b.i === flashId ? " flash" : "");
        if (b.i === editingId) {
          renderEditForm(el, b);
        } else if (b.i === confirmingDeleteId) {
          renderDeleteConfirm(el, b);
        } else {
          el.innerHTML = `<div class="bm-main">
              <a href="${escapeAttr(b.url)}" target="_blank" rel="noopener">${highlight(b.title || b.url, q)}</a>
              <div class="url">${highlight(b.url, q)}</div>
            </div>
            <div class="bm-actions">
              <button class="edit-btn">Edit</button>
              <button class="del-btn">Delete</button>
            </div>`;
          el.querySelector(".edit-btn").onclick = () => { editingId = b.i; confirmingDeleteId = null; render(); };
          el.querySelector(".del-btn").onclick = () => { confirmingDeleteId = b.i; editingId = null; render(); };
        }
        group.appendChild(el);
      });
      list.appendChild(group);
    });
  }

  function renderEditForm(el, b) {
    el.classList.add("editing");
    el.innerHTML = `<div class="edit-form">
        <div class="add-row">
          <div class="field"><label>Link address</label><input class="e-url" type="text"></div>
          <div class="field"><label>Title</label><input class="e-title" type="text"></div>
          <div class="field"><label>Topic</label><input class="e-topic" type="text"></div>
        </div>
        <div class="edit-actions">
          <button class="save-edit">Save changes</button>
          <button class="cancel-edit">Cancel</button>
        </div>
      </div>`;
    el.querySelector(".e-url").value = b.url || "";
    el.querySelector(".e-title").value = b.title || "";
    el.querySelector(".e-topic").value = b.topic || "";
    el.querySelector(".save-edit").onclick = () => {
      const url = el.querySelector(".e-url").value.trim();
      if (!url) { el.querySelector(".e-url").focus(); return; }
      bookmarks[b.i] = { url, title: el.querySelector(".e-title").value.trim(), topic: el.querySelector(".e-topic").value.trim() };
      editingId = null;
      persist();
      renderChips();
      render();
    };
    el.querySelector(".cancel-edit").onclick = () => { editingId = null; render(); };
  }

  function renderDeleteConfirm(el, b) {
    el.innerHTML = `<div class="confirm-del">
        <span>Delete “${escapeHtml(b.title || b.url)}”?</span>
        <button class="yes">Delete</button>
        <button class="no">Keep</button>
      </div>`;
    el.querySelector(".yes").onclick = () => {
      bookmarks.splice(b.i, 1);
      confirmingDeleteId = null;
      persist();
      renderChips();
      render();
    };
    el.querySelector(".no").onclick = () => { confirmingDeleteId = null; render(); };
  }

  function escapeHtml(s) { return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }
  function highlight(s, q) {
    const safe = escapeHtml(s || "");
    if (!q) return safe;
    const idx = safe.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + q.length) + "</mark>" + safe.slice(idx + q.length);
  }

  document.getElementById("save").addEventListener("click", () => {
    const url = document.getElementById("url").value.trim();
    const title = document.getElementById("title").value.trim();
    const topic = document.getElementById("topic").value.trim();
    if (!url) { document.getElementById("url").focus(); return; }
    bookmarks.push({ url, title, topic });
    persist();
    document.getElementById("url").value = "";
    document.getElementById("title").value = "";
    document.getElementById("topic").value = "";
    document.getElementById("url").focus();
    renderChips();
    render(bookmarks.length - 1);
  });

  document.getElementById("search").addEventListener("input", () => render());

  renderChips();
  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
