<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap" id="wrap">
    <header>
      <div class="head-row">
        <div>
          <h1>Bookmarks</h1>
          <p class="sub">One calm place for the links you want to keep.</p>
        </div>
        <div class="head-btns">
          <button type="button" id="prefBtn" class="ghost-btn">Preferences</button>
          <button type="button" id="ioBtn" class="ghost-btn">Import / Export</button>
        </div>
      </div>
    </header>

    <div id="prefMount"></div>
    <div id="ioMount"></div>

    <form class="saver" id="saver" autocomplete="off">
      <input id="url" type="text" placeholder="Paste a link to save…" autofocus />
      <button type="submit">Add</button>
    </form>
    <div class="hint" id="hint"></div>

    <div id="reviewMount"></div>

    <div class="views" id="views" hidden>
      <button type="button" class="view-tab on" data-view="all">Collection</button>
      <button type="button" class="view-tab" data-view="reading">Reading list</button>
      <button type="button" class="view-tab" data-view="archive">Archive</button>
    </div>

    <div class="searchbar" id="searchbar" hidden>
      <span class="mag">⌕</span>
      <input id="search" type="text" placeholder="Search your bookmarks…" />
      <button type="button" id="clearSearch" class="clear" aria-label="Clear search">×</button>
      <button type="button" id="saveSearch" class="save-search">☆ Save</button>
    </div>
    <div id="savedMount"></div>

    <div class="sortbar" id="sortbar" hidden>
      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="added-desc">Newest first</option>
        <option value="added-asc">Oldest first</option>
        <option value="updated-desc">Recently updated</option>
        <option value="title-asc">Title A–Z</option>
        <option value="title-desc">Title Z–A</option>
      </select>
    </div>

    <div id="bulkMount"></div>
    <div class="list" id="list"></div>
  </div>

  <script src="query.js"></script>
  <script src="app.js"></script>
</body>
</html>
