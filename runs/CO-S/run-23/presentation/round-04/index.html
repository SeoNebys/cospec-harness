<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trove — bookmark prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #19231f;
      --muted: #63706a;
      --paper: #f4f0e6;
      --card: #fffdf7;
      --line: #d9d3c5;
      --accent: #176b51;
      --accent-dark: #0e513c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 5%, rgba(239, 181, 82, .17), transparent 26rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, main { width: min(980px, calc(100% - 40px)); margin-inline: auto; }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 32px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .brand { font: 700 1.55rem Georgia, serif; letter-spacing: -.02em; }
    .count { color: var(--muted); font-size: .9rem; }
    main { padding: 56px 0 100px; }
    h1 { max-width: 600px; margin: 0 0 10px; font: 700 clamp(2rem, 5vw, 3.25rem)/1.04 Georgia, serif; letter-spacing: -.035em; }
    .lede { margin: 0 0 28px; color: var(--muted); font-size: 1.05rem; }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      max-width: 760px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 10px 35px rgba(38, 47, 42, .07);
    }
    input {
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      padding: 12px 13px;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      padding: 0 21px;
      min-height: 46px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .status { min-height: 24px; margin: 12px 4px; color: var(--muted); font-size: .91rem; }
    .status.success { color: var(--accent-dark); }
    .collection { margin-top: 54px; }
    .collection-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    h2 { margin: 0; font: 700 1.25rem Georgia, serif; }
    .empty {
      border: 1px dashed #c7c0b2;
      border-radius: 14px;
      padding: 44px 24px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 253, 247, .45);
    }
    .bookmark {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 21px 22px;
      background: var(--card);
      box-shadow: 0 8px 25px rgba(38, 47, 42, .055);
    }
    .bookmark h3 { margin: 5px 0 7px; font: 700 1.18rem Georgia, serif; }
    .bookmark p { max-width: 650px; margin: 0; color: var(--muted); line-height: 1.45; }
    .domain { color: var(--accent); font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .saved { color: var(--muted); font-size: .82rem; white-space: nowrap; }
    @media (max-width: 620px) {
      main { padding-top: 38px; }
      form { grid-template-columns: 1fr; }
      button { min-height: 48px; }
      .bookmark { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Trove</div>
    <div class="count" id="count">0 bookmarks</div>
  </header>
  <main data-harness-ready="true">
    <h1>Keep what’s worth finding again.</h1>
    <p class="lede">Save a page now. We’ll fill in the useful details.</p>

    <form id="save-form">
      <input id="url" type="url" aria-label="Web address" value="https://example.com/articles/calm-reading-habit" required>
      <button type="submit">Save bookmark</button>
    </form>
    <div class="status" id="status" aria-live="polite">The sample address is ready to save.</div>

    <section class="collection" aria-labelledby="collection-title">
      <div class="collection-head">
        <h2 id="collection-title">Your bookmarks</h2>
      </div>
      <div id="bookmarks">
        <div class="empty">Your saved pages will appear here.</div>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#save-form');
    const input = document.querySelector('#url');
    const status = document.querySelector('#status');
    const list = document.querySelector('#bookmarks');
    const count = document.querySelector('#count');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const parsed = new URL(input.value);
      const title = parsed.hostname === 'example.com'
        ? 'A calmer way to build a reading habit'
        : `Saved page from ${parsed.hostname.replace(/^www\\./, '')}`;
      const description = parsed.hostname === 'example.com'
        ? 'A practical guide to choosing what to read, making time for it, and retaining the ideas that matter.'
        : 'Page details were collected automatically so this bookmark is easy to recognize later.';
      list.innerHTML = `
        <article class="bookmark">
          <div>
            <div class="domain">${parsed.hostname.replace(/^www\\./, '')}</div>
            <h3>${title}</h3>
            <p>${description}</p>
          </div>
          <div class="saved">Saved just now</div>
        </article>`;
      count.textContent = '1 bookmark';
      status.textContent = 'Saved — title and description added automatically.';
      status.className = 'status success';
      input.value = '';
    });
  </script>
</body>
</html>
