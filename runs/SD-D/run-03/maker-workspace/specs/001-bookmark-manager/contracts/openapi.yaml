openapi: 3.1.0
info:
  title: Personal Bookmark Manager API
  version: 1.0.0
  description: Same-origin JSON contract for the approved single-user application.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
security: []
paths:
  /health:
    get:
      summary: Check application readiness
      operationId: getHealth
      responses:
        '200':
          description: Server and migrated database are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ready
        '400':
          $ref: '#/components/responses/ValidationError'

  /metadata/preview:
    post:
      summary: Preview metadata for an address
      operationId: previewMetadata
      description: Begins automatically after a valid address is entered. The client may save independently while this bounded request is pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address:
                  type: string
      responses:
        '200':
          description: Retrieved metadata or a usable fallback result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataPreview'
        '409':
          $ref: '#/components/responses/DuplicateBookmark'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bookmarks:
    get:
      summary: List and search bookmarks
      operationId: listBookmarks
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/Favorite'
        - $ref: '#/components/parameters/Unread'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current result page and total result count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkPage'
        '422':
          $ref: '#/components/responses/SearchError'
    post:
      summary: Save a bookmark
      operationId: createBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkCreate'
      responses:
        '201':
          description: Bookmark saved; metadata may still be pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '409':
          $ref: '#/components/responses/DuplicateBookmark'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bookmarks/{bookmarkId}:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    get:
      summary: Get a bookmark
      operationId: getBookmark
      responses:
        '200':
          description: Bookmark detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a bookmark
      operationId: updateBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkPatch'
      responses:
        '200':
          description: Updated bookmark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateBookmark'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Permanently delete a bookmark
      operationId: deleteBookmark
      description: The client must obtain explicit user confirmation before sending this request.
      responses:
        '204':
          description: Permanently deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /bookmarks/{bookmarkId}/metadata-refresh:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    post:
      summary: Refresh bookmark metadata
      operationId: refreshBookmarkMetadata
      responses:
        '202':
          description: A revision-guarded metadata refresh was queued.
          content:
            application/json:
              schema:
                type: object
                required: [bookmarkId, metadataStatus]
                properties:
                  bookmarkId:
                    type: integer
                  metadataStatus:
                    const: pending
        '404':
          $ref: '#/components/responses/NotFound'

  /bookmarks/{bookmarkId}/icon:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    get:
      summary: Get a safe bookmark icon
      operationId: getBookmarkIcon
      responses:
        '200':
          description: Validated app-origin PNG icon.
          headers:
            X-Content-Type-Options:
              schema:
                const: nosniff
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        '404':
          description: Use the client placeholder icon.

  /tags:
    get:
      summary: List tags
      operationId: listTags
      responses:
        '200':
          description: Existing tags and active bookmark counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSummary'
        '400':
          $ref: '#/components/responses/ValidationError'

  /selections:
    post:
      summary: Snapshot a bookmark selection
      operationId: createSelection
      description: Snapshots individual IDs or every bookmark matching the current criteria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [mode, ids, criteriaHash]
                  properties:
                    mode:
                      const: ids
                    ids:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items:
                        type: integer
                    criteriaHash:
                      type: string
                - type: object
                  additionalProperties: false
                  required: [mode, criteria, criteriaHash]
                  properties:
                    mode:
                      const: all_results
                    criteria:
                      $ref: '#/components/schemas/SearchCriteria'
                    criteriaHash:
                      type: string
      responses:
        '201':
          description: Stable expiring selection snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '422':
          $ref: '#/components/responses/SearchError'

  /selections/{selectionId}:
    parameters:
      - $ref: '#/components/parameters/SelectionId'
    delete:
      summary: Clear a bookmark selection
      operationId: clearSelection
      responses:
        '204':
          description: Selection cleared or already absent.
        '400':
          $ref: '#/components/responses/ValidationError'

  /selections/{selectionId}/actions:
    parameters:
      - $ref: '#/components/parameters/SelectionId'
    post:
      summary: Apply a bulk action
      operationId: applyBulkAction
      description: Consumes the stable selection in one transaction. The client confirms permanent deletion before requesting it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAction'
      responses:
        '200':
          description: Selection consumed and action committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '404':
          $ref: '#/components/responses/SelectionNotFound'
        '409':
          description: Selection expired before it could be consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /saved-views:
    get:
      summary: List saved views
      operationId: listSavedViews
      responses:
        '200':
          description: Saved views ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create a saved view
      operationId: createSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewWrite'
      responses:
        '201':
          description: Saved view created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '409':
          $ref: '#/components/responses/DuplicateSavedView'
        '422':
          $ref: '#/components/responses/SearchError'

  /saved-views/{savedViewId}:
    parameters:
      - $ref: '#/components/parameters/SavedViewId'
    patch:
      summary: Update a saved view
      operationId: updateSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewWrite'
      responses:
        '200':
          description: Saved view renamed or criteria replaced atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateSavedView'
        '422':
          $ref: '#/components/responses/SearchError'
    delete:
      summary: Delete a saved view
      operationId: deleteSavedView
      description: The client must obtain explicit user confirmation before sending this request.
      responses:
        '204':
          description: Saved view deleted without changing bookmarks.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    BookmarkId:
      name: bookmarkId
      in: path
      required: true
      schema:
        type: integer
    SavedViewId:
      name: savedViewId
      in: path
      required: true
      schema:
        type: integer
    SelectionId:
      name: selectionId
      in: path
      required: true
      schema:
        type: string
    Scope:
      name: scope
      in: query
      schema:
        $ref: '#/components/schemas/Scope'
    Query:
      name: q
      in: query
      schema:
        type: string
        default: ''
    Tags:
      name: tag
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    Favorite:
      name: favorite
      in: query
      schema:
        type: boolean
    Unread:
      name: unread
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        $ref: '#/components/schemas/SortOrder'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    DuplicateBookmark:
      description: The normalized address already belongs to a bookmark; open it in edit mode.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                required: [existingBookmarkId]
                properties:
                  code:
                    const: DUPLICATE_BOOKMARK
                  existingBookmarkId:
                    type: integer
                  existingScope:
                    $ref: '#/components/schemas/Scope'
    DuplicateSavedView:
      description: A case-insensitive normalized name already exists.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  code:
                    const: DUPLICATE_SAVED_VIEW_NAME
                  field:
                    const: name
    ValidationError:
      description: Request fields are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    SearchError:
      description: Search syntax or criteria are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchProblem'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    SelectionNotFound:
      description: Selection not found or already consumed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Scope:
      type: string
      enum: [active, read_later, archived]
      default: active
    SortOrder:
      type: string
      enum: [created_desc, created_asc, updated_desc, title_asc]
      default: created_desc
    MetadataStatus:
      type: string
      enum: [pending, complete, partial, failed, skipped_unsafe]
    Provenance:
      type: string
      enum: [fallback, retrieved, user]
    Tag:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    TagSummary:
      allOf:
        - $ref: '#/components/schemas/Tag'
        - type: object
          required: [activeBookmarkCount]
          properties:
            activeBookmarkCount:
              type: integer
              minimum: 0
    Bookmark:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - title
        - titleProvenance
        - description
        - descriptionProvenance
        - iconUrl
        - metadataStatus
        - noteMarkdown
        - tags
        - favorite
        - unread
        - archived
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        address:
          type: string
          format: uri
        title:
          type: string
        titleProvenance:
          $ref: '#/components/schemas/Provenance'
        retrievedTitleCandidate:
          type: [string, 'null']
        description:
          type: string
        descriptionProvenance:
          $ref: '#/components/schemas/Provenance'
        retrievedDescriptionCandidate:
          type: [string, 'null']
        iconUrl:
          type: [string, 'null']
        metadataStatus:
          $ref: '#/components/schemas/MetadataStatus'
        metadataErrorCode:
          type: [string, 'null']
        noteMarkdown:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        favorite:
          type: boolean
        unread:
          type: boolean
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BookmarkCreate:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
        title:
          type: string
          description: Omit unless the user manually overrides the automatic/fallback title.
        description:
          type: string
          description: Omit unless the user manually overrides the automatic description.
        noteMarkdown:
          type: string
          default: ''
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        favorite:
          type: boolean
          default: false
        unread:
          type: boolean
          default: false
    BookmarkPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        address:
          type: string
        title:
          type: string
        description:
          type: string
        noteMarkdown:
          type: string
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        favorite:
          type: boolean
        unread:
          type: boolean
        archived:
          type: boolean
        acceptRetrievedTitle:
          type: boolean
        acceptRetrievedDescription:
          type: boolean
    MetadataPreview:
      type: object
      additionalProperties: false
      required: [address, status, fallbackTitle, title, description, iconAvailable]
      properties:
        address:
          type: string
        status:
          $ref: '#/components/schemas/MetadataStatus'
        fallbackTitle:
          type: string
        title:
          type: string
        description:
          type: string
        iconAvailable:
          type: boolean
        errorCode:
          type: [string, 'null']
    BookmarkPage:
      type: object
      additionalProperties: false
      required: [items, total, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bookmark'
        total:
          type: integer
          minimum: 0
        nextCursor:
          type: [string, 'null']
    SearchCriteria:
      type: object
      additionalProperties: false
      required: [scope, query, tags, sort]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        query:
          type: string
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        favorite:
          type: [boolean, 'null']
        unread:
          type: [boolean, 'null']
        sort:
          $ref: '#/components/schemas/SortOrder'
    Selection:
      type: object
      additionalProperties: false
      required: [id, selectedCount, criteriaHash, expiresAt]
      properties:
        id:
          type: string
        selectedCount:
          type: integer
          minimum: 1
        criteriaHash:
          type: string
        expiresAt:
          type: string
          format: date-time
    BulkAction:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, tags]
          properties:
            type:
              enum: [add_tags, remove_tags]
            tags:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              enum: [favorite, unfavorite, mark_unread, mark_read, archive, restore, delete]
    BulkResult:
      type: object
      additionalProperties: false
      required: [selectedCount, processedCount, changedCount]
      properties:
        selectedCount:
          type: integer
        processedCount:
          type: integer
        changedCount:
          type: integer
    SavedViewWrite:
      allOf:
        - $ref: '#/components/schemas/SearchCriteria'
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
    SavedView:
      allOf:
        - $ref: '#/components/schemas/SavedViewWrite'
        - type: object
          required: [id, grammarVersion, createdAt, updatedAt]
          properties:
            id:
              type: integer
            grammarVersion:
              const: 1
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
    SearchProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [start, end, hint]
          properties:
            start:
              type: integer
              minimum: 0
            end:
              type: integer
              minimum: 0
            hint:
              type: string
