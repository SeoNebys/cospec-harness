<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <h1>Bookmarks</h1>
      <p>Your personal place for links.</p>
    </div>
  </header>

  <main class="wrap">
    <form class="saver" id="saver" autocomplete="off">
      <input id="urlInput" type="text" placeholder="Paste a link to save…" aria-label="Link to save" />
      <button id="saveBtn" type="submit">Save</button>
    </form>

    <div class="notice" id="notice" hidden></div>

    <nav class="viewbar" id="viewbar" aria-label="Views">
      <button class="viewtab" data-view="all" aria-pressed="true">All</button>
      <button class="viewtab" data-view="readlater" aria-pressed="false">Read Later</button>
      <button class="viewtab" data-view="archive" aria-pressed="false">Archive</button>
    </nav>

    <div class="finder">
      <input id="searchInput" type="search"
             placeholder="Search…  e.g.  testing AND #frontend"
             aria-label="Search bookmarks" />
      <p class="searchhint">
        Words, <code>"exact phrases"</code>, <code>#tag</code>, and
        <code>AND</code> / <code>OR</code> / <code>NOT</code> with <code>( )</code>. Not case-sensitive.
      </p>
      <div class="filterbar" id="filterbar"></div>
    </div>

    <p class="resultmeta" id="resultmeta" aria-live="polite"></p>

    <section class="list" id="list" aria-label="Bookmarks"></section>

    <div class="empty" id="empty" hidden></div>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
