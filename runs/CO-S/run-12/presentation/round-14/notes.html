<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepwell — Bookmark notes</title>
<style>
:root{--ink:#202722;--muted:#6b746e;--paper:#f4f1e9;--card:#fffdf8;--green:#315c4b;--lime:#dce7a7;--line:#d8d7ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button,textarea{font:inherit}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center;font:700 23px Georgia,serif}.mark{width:28px;height:34px;background:var(--green);border-radius:5px 5px 10px 10px;position:relative}.mark:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lime);top:8px;left:10px}.back{color:var(--green);text-decoration:none;font-weight:700}main{width:min(720px,90vw);margin:55px auto}h1{margin:0 0 8px;font:700 40px Georgia,serif;letter-spacing:-1px}.lead{margin:0 0 26px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 35px rgba(47,57,48,.06);padding:25px}.bookmark{display:grid;grid-template-columns:130px 1fr;gap:18px;padding-bottom:23px;border-bottom:1px solid var(--line)}.image{border-radius:11px;background:linear-gradient(145deg,#29364f,#637499 62%,#c2cbe1);color:white;padding:13px;display:flex;align-items:end;font:700 17px Georgia,serif}.site{color:var(--muted);font-size:12px}.bookmark h2{font:700 22px Georgia,serif;margin:8px 0 5px}.bookmark p{margin:0;color:var(--muted)}.edit{padding-top:22px}.label{display:block;margin-bottom:9px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.helper{color:var(--muted);font-size:13px;margin:7px 0 0}textarea{display:block;width:100%;min-height:130px;resize:vertical;border:1px solid #bbbdb5;border-radius:10px;background:white;padding:13px;outline:none;color:var(--ink)}textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(49,92,75,.11)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}button{border:0;border-radius:10px;padding:11px 17px;cursor:pointer;font-weight:750}.primary{background:var(--green);color:white}.secondary{background:#e7e8df;color:var(--ink)}.details{display:none}.details.show{display:block}.edit.hide{display:none}.note{margin-top:22px;border-left:4px solid var(--lime);background:#f0f3df;border-radius:0 10px 10px 0;padding:16px 18px}.note .label{color:var(--green)}.note p{white-space:pre-wrap;margin:0}.tags{display:flex;gap:7px;margin-top:14px}.tag{border-radius:99px;padding:5px 10px;background:#eaeee5;color:var(--green);font-size:13px;font-weight:700}@media(max-width:560px){.bookmark{grid-template-columns:1fr}.image{min-height:90px}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepwell</div><a class="back" href="tags.html">← Collection</a></header><main data-harness-ready="true"><h1 id="heading">Edit bookmark</h1><p class="lead" id="lead">Add context your future self will understand.</p><section class="panel"><div class="bookmark"><div class="image">Cities & memory</div><div><span class="site">atlasnotes.example</span><h2>The hidden life of public squares</h2><p>How shared spaces gather stories across generations.</p><div class="tags"><span class="tag">reading</span></div></div></div><div class="edit" id="edit"><label class="label" for="notes">Your notes</label><textarea id="notes" placeholder="Why did you save this? What do you want to remember?"></textarea><p class="helper">These notes belong to this bookmark.</p><div class="actions"><button class="secondary">Cancel</button><button class="primary" id="save">Save changes</button></div></div><div class="details" id="details"><div class="note"><span class="label">Your note</span><p id="noteText"></p></div><div class="actions"><button class="secondary" id="editAgain">Edit note</button><button class="primary">Open page ↗</button></div></div></section></main>
<script>const notes=document.querySelector('#notes'),edit=document.querySelector('#edit'),details=document.querySelector('#details');document.querySelector('#save').onclick=()=>{document.querySelector('#noteText').textContent=notes.value||'No note added.';edit.classList.add('hide');details.classList.add('show');document.querySelector('#heading').textContent='Bookmark details';document.querySelector('#lead').textContent='Everything you kept about this page.'};document.querySelector('#editAgain').onclick=()=>{details.classList.remove('show');edit.classList.remove('hide');document.querySelector('#heading').textContent='Edit bookmark';document.querySelector('#lead').textContent='Add context your future self will understand.';notes.focus()};</script></body></html>
