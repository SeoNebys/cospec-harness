<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-harness-ready="false">
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔖</span>
      <h1>Bookmarks</h1>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" />
    </div>
    <button id="new-btn" class="btn btn-primary">+ New bookmark</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="filters">
        <button class="filter active" data-filter="all">All bookmarks</button>
        <button class="filter" data-filter="favorites">★ Favorites</button>
      </nav>
      <h2 class="sidebar-heading">Tags</h2>
      <ul id="tag-list" class="tag-list"></ul>
    </aside>

    <main class="content">
      <div id="active-tag-bar" class="active-tag-bar" hidden>
        Filtering by tag: <span id="active-tag-name" class="chip"></span>
        <button id="clear-tag" class="link-btn">clear</button>
      </div>
      <div id="list" class="grid"></div>
      <div id="empty" class="empty" hidden>
        <p>No bookmarks yet.</p>
        <button class="btn btn-primary" onclick="document.getElementById('new-btn').click()">Add your first bookmark</button>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modal-title">New bookmark</h2>
      <form id="bookmark-form">
        <input type="hidden" id="bm-id" />
        <label>URL
          <input type="text" id="bm-url" placeholder="https://example.com" required />
        </label>
        <label>Title
          <input type="text" id="bm-title" placeholder="Optional — defaults to the URL" />
        </label>
        <label>Description
          <textarea id="bm-description" rows="3" placeholder="Optional notes"></textarea>
        </label>
        <label>Tags
          <input type="text" id="bm-tags" placeholder="Comma-separated, e.g. work, reading" />
        </label>
        <label class="checkbox">
          <input type="checkbox" id="bm-favorite" /> Mark as favorite
        </label>
        <p id="form-error" class="error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
