<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header>
  <div class="hgrow">
    <h1>My Bookmarks</h1>
    <p>One dependable place for every link you save.</p>
  </div>
  <div class="headctrls">
    <button id="settingsBtn" class="hbtn" type="button">Settings</button>
    <button id="importBtn" class="hbtn" type="button">Import…</button>
    <button id="exportBtn" class="hbtn" type="button">Export</button>
    <input id="importFile" type="file" accept=".html,.htm" hidden />
  </div>
</header>
<div id="ioMsg" class="iomsg" hidden></div>

<main>
  <div id="settings" class="settings" hidden></div>

  <form class="save" id="saveForm" autocomplete="off">
    <input id="urlInput" type="text" placeholder="Paste a link to save…" />
    <button id="saveBtn" class="btn" type="submit" disabled>Save</button>
  </form>
  <div id="notice"></div>
  <div id="composeSlot"></div>

  <div class="toolbar">
    <button id="saveSearchBtn" class="linkbtn2" type="button">☆ Save this search</button>
    <label class="sortlabel">Sort
      <select id="sortSelect"></select>
    </label>
  </div>
  <div id="savedbar" class="savedbar" hidden></div>

  <div class="searchwrap">
    <input id="searchInput" type="search" placeholder="Search title, description, address, tags or notes…" />
  </div>

  <nav class="segmented" id="segmented" aria-label="Views">
    <button data-f="all" class="active" type="button">All</button>
    <button data-f="toread" type="button">To read</button>
    <button data-f="reference" type="button">Reference</button>
    <button data-f="archived" type="button">Archived</button>
  </nav>

  <div class="count" id="count"></div>
  <div id="bulkbar" class="bulkbar" hidden></div>
  <ul class="list" id="list"></ul>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
