<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — prototype</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e4e7eb; --text:#1c2430; --muted:#6b7684; --accent:#2f6fed; --warn:#b46a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:18px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:20px; }
  .save { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; gap:10px; }
  .save input { flex:1; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .btn { padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  .btn.secondary { background:#eef0f3; color:var(--text); }
  .btn:disabled { opacity:.5; cursor:default; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label { font-size:12px; color:var(--muted); font-weight:600; }
  .field input, .field textarea { padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  .field textarea { resize:vertical; min-height:52px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:12px; }
  .compose-head { font-size:13px; color:var(--muted); margin-bottom:10px; }
  .preview { display:flex; gap:14px; }
  .thumb { width:120px; height:80px; border-radius:8px; flex:0 0 auto; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; text-align:center; }
  .icon { width:20px; height:20px; border-radius:5px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:11px; }
  .count { color:var(--muted); font-size:13px; margin:24px 4px 8px; }
  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  li.item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .item-top { display:flex; gap:14px; }
  .item-body { flex:1; min-width:0; }
  .item .titlerow { display:flex; align-items:center; gap:8px; }
  .item a.title { font-size:15px; font-weight:600; color:var(--text); text-decoration:none; }
  .item a.title:hover { color:var(--accent); text-decoration:underline; }
  .item .desc { color:#43505f; font-size:13px; margin-top:5px; }
  .item a.link { color:var(--accent); text-decoration:none; font-size:12px; word-break:break-all; display:inline-block; margin-top:7px; }
  .item a.link:hover { text-decoration:underline; }
  .item .meta { color:var(--muted); font-size:12px; margin-top:7px; display:flex; gap:12px; align-items:center; }
  .linkbtn { background:none; border:0; color:var(--accent); font-size:12px; cursor:pointer; padding:0; }
  .empty { color:var(--muted); font-size:14px; padding:24px 4px; }
  .flash { animation:flash 1.6s ease; }
  @keyframes flash { 0%{ background:#fff4e0;} 100%{ background:var(--card);} }
  .dupnote { color:var(--warn); font-size:13px; margin:10px 4px 0; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>One dependable place for every link you save.</p>
</header>
<main>
  <form class="save" id="saveForm">
    <input id="urlInput" type="text" placeholder="Paste a link to save…" autocomplete="off" />
    <button id="saveBtn" class="btn" type="submit" disabled>Save</button>
  </form>
  <div id="dupnote"></div>

  <div id="composeSlot"></div>

  <div class="count" id="count"></div>
  <ul class="list" id="list"></ul>
</main>

<script>
  var items = [];
  var COLORS = ['#2f6fed','#e0567a','#2fa96b','#8b5cf6','#e08a2f','#0ea5b7'];
  function colorFor(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return COLORS[h%COLORS.length]; }
  function normalizeUrl(u){ return /^https?:\/\//i.test(u)? u : 'https://'+u; }
  function hostOf(u){ try{ return new URL(normalizeUrl(u)).hostname.replace(/^www\./,''); }catch(e){ return u; } }
  function keyOf(u){ // duplicate detection: host is case-insensitive (ignore www + trailing slash),
    try{ var x=new URL(normalizeUrl(u)); // but the path keeps its original capitalisation.
      var host=x.hostname.replace(/^www\./,'').toLowerCase();
      var path=(x.pathname+ (x.search||'')).replace(/\/$/,'');
      return host+path; }
    catch(e){ return u; }
  }

  // ---- simulated metadata fetch (a real app would read the actual page) ----
  function fetchMeta(url){
    var host = hostOf(url);
    var seg='';
    try{ seg = decodeURIComponent(new URL(normalizeUrl(url)).pathname.split('/').filter(Boolean).pop()||''); }catch(e){}
    seg = seg.replace(/[-_]+/g,' ').replace(/\.\w+$/,'').trim();
    var pretty = seg ? seg.replace(/\b\w/g, function(c){return c.toUpperCase();}) : host;
    var siteName = host.split('.')[0].replace(/\b\w/g,function(c){return c.toUpperCase();});
    return {
      title: seg ? (pretty + ' · ' + siteName) : (siteName + ' — homepage'),
      description: 'A page on ' + host + '. This description is what the app pulled from the page so you can recognise it later.',
      host: host,
      iconLetter: host.charAt(0).toUpperCase(),
      color: colorFor(host)
    };
  }

  function render(){
    var list=document.getElementById('list'), count=document.getElementById('count');
    list.innerHTML='';
    if(items.length===0){ count.textContent=''; var d=document.createElement('div'); d.className='empty'; d.textContent='Nothing saved yet. Paste a link above to get started.'; list.appendChild(d); return; }
    count.textContent = items.length + (items.length===1?' saved link':' saved links');
    items.forEach(function(it){
      var li=document.createElement('li'); li.className='item'+(it._new?' flash':''); li.id='item-'+it.id; it._new=false;
      var top=document.createElement('div'); top.className='item-top';
      var thumb=document.createElement('div'); thumb.className='thumb'; thumb.style.background='linear-gradient(135deg,'+it.color+',#0d1b3a)'; thumb.textContent=it.host;
      var body=document.createElement('div'); body.className='item-body';
      if(it._editing){
        body.innerHTML='';
        var f1=field('Title', 'input', it.title), f2=field('Description','textarea', it.description), f3=field('Address (link)','input', it.url);
        var row=document.createElement('div'); row.style.display='flex'; row.style.gap='8px';
        var save=document.createElement('button'); save.className='btn'; save.textContent='Save changes';
        var cancel=document.createElement('button'); cancel.className='btn secondary'; cancel.textContent='Cancel';
        save.onclick=function(){
          it.title=f1.querySelector('input').value.trim()||it.title;
          it.description=f2.querySelector('textarea').value.trim();
          var newUrl=f3.querySelector('input').value.trim();
          if(newUrl){ it.url=normalizeUrl(newUrl); it.host=hostOf(newUrl); it.iconLetter=it.host.charAt(0).toUpperCase(); it.color=colorFor(it.host); }
          it._editing=false; render();
        };
        cancel.onclick=function(){ it._editing=false; render(); };
        row.appendChild(save); row.appendChild(cancel);
        body.appendChild(f1); body.appendChild(f2); body.appendChild(f3); body.appendChild(row);
      } else {
        var titlerow=document.createElement('div'); titlerow.className='titlerow';
        var ic=document.createElement('span'); ic.className='icon'; ic.style.background=it.color; ic.textContent=it.iconLetter;
        var a=document.createElement('a'); a.className='title'; a.href=it.url; a.target='_blank'; a.rel='noopener'; a.textContent=it.title;
        titlerow.appendChild(ic); titlerow.appendChild(a);
        var desc=document.createElement('div'); desc.className='desc'; desc.textContent=it.description;
        var link=document.createElement('a'); link.className='link'; link.href=it.url; link.target='_blank'; link.rel='noopener'; link.textContent=it.url;
        var meta=document.createElement('div'); meta.className='meta';
        var when=document.createElement('span'); when.textContent='Saved '+it.saved;
        var edit=document.createElement('button'); edit.className='linkbtn'; edit.textContent='Edit'; edit.onclick=function(){ it._editing=true; render(); };
        meta.appendChild(when); meta.appendChild(edit);
        body.appendChild(titlerow); body.appendChild(desc); body.appendChild(link); body.appendChild(meta);
      }
      top.appendChild(thumb); top.appendChild(body); li.appendChild(top); list.appendChild(li);
    });
  }

  function field(label, kind, value){
    var w=document.createElement('div'); w.className='field';
    var l=document.createElement('label'); l.textContent=label;
    var el=document.createElement(kind==='textarea'?'textarea':'input'); el.value=value||'';
    w.appendChild(l); w.appendChild(el); return w;
  }

  function goToExisting(it){
    var el=document.getElementById('item-'+it.id);
    document.getElementById('dupnote').innerHTML='<div class="dupnote">You already saved this link — here it is, ready to edit.</div>';
    it._editing=true; render();
    setTimeout(function(){ var e=document.getElementById('item-'+it.id); if(e){ e.classList.add('flash'); e.scrollIntoView({behavior:'smooth',block:'center'}); } },30);
  }

  function openCompose(url){
    var meta=fetchMeta(url);
    var slot=document.getElementById('composeSlot');
    slot.innerHTML='';
    var card=document.createElement('div'); card.className='card';
    var head=document.createElement('div'); head.className='compose-head'; head.textContent='We pulled these details from the page — adjust anything before saving:';
    var preview=document.createElement('div'); preview.className='preview';
    var thumb=document.createElement('div'); thumb.className='thumb'; thumb.style.background='linear-gradient(135deg,'+meta.color+',#0d1b3a)'; thumb.textContent=meta.host;
    var right=document.createElement('div'); right.style.flex='1'; right.style.minWidth='0';
    var f1=field('Title','input',meta.title), f2=field('Description','textarea',meta.description);
    var addr=document.createElement('div'); addr.className='item'; addr.style.padding='0'; addr.style.border='0';
    var alink=document.createElement('a'); alink.className='link'; alink.href=normalizeUrl(url); alink.target='_blank'; alink.rel='noopener'; alink.textContent=normalizeUrl(url); alink.style.marginTop='0';
    right.appendChild(f1); right.appendChild(f2); right.appendChild(alink);
    preview.appendChild(thumb); preview.appendChild(right);
    var actions=document.createElement('div'); actions.style.display='flex'; actions.style.gap='8px'; actions.style.marginTop='14px';
    var add=document.createElement('button'); add.className='btn'; add.textContent='Add to bookmarks';
    var cancel=document.createElement('button'); cancel.className='btn secondary'; cancel.textContent='Cancel';
    add.onclick=function(){
      items.unshift({ id:Date.now(), url:normalizeUrl(url), title:f1.querySelector('input').value.trim()||meta.title,
        description:f2.querySelector('textarea').value.trim(), host:meta.host, iconLetter:meta.iconLetter, color:meta.color, saved:'just now', _new:true });
      slot.innerHTML=''; render();
    };
    cancel.onclick=function(){ slot.innerHTML=''; };
    actions.appendChild(add); actions.appendChild(cancel);
    card.appendChild(head); card.appendChild(preview); card.appendChild(actions);
    slot.appendChild(card);
  }

  var input=document.getElementById('urlInput'), btn=document.getElementById('saveBtn');
  input.addEventListener('input', function(){ btn.disabled=input.value.trim()===''; document.getElementById('dupnote').innerHTML=''; });
  document.getElementById('saveForm').addEventListener('submit', function(e){
    e.preventDefault();
    var raw=input.value.trim(); if(!raw) return;
    document.getElementById('dupnote').innerHTML='';
    var k=keyOf(raw);
    var existing=null; for(var i=0;i<items.length;i++){ if(keyOf(items[i].url)===k){ existing=items[i]; break; } }
    input.value=''; btn.disabled=true;
    if(existing){ document.getElementById('composeSlot').innerHTML=''; goToExisting(existing); return; }
    openCompose(raw);
  });

  render();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
