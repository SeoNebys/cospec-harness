<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Bookmarks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Auth view (SCN-011) -->
  <main id="auth-view" class="auth-view" hidden>
    <div class="auth-card">
      <h1 id="auth-heading">Welcome back</h1>
      <p class="sub" id="auth-sub">Sign in to see your bookmarks on this device.</p>

      <label for="auth-email">Email</label>
      <input id="auth-email" type="email" autocomplete="username" placeholder="you@example.com" />

      <label for="auth-password">Password</label>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="Your password" />

      <div id="auth-confirm-row" hidden>
        <label for="auth-confirm">Confirm password</label>
        <input id="auth-confirm" type="password" autocomplete="new-password" placeholder="Repeat your password" />
      </div>

      <label class="stay"><input id="auth-stay" type="checkbox" checked /> Keep me signed in on this device</label>

      <button class="primary" id="auth-submit">Sign in</button>
      <div class="auth-msg" id="auth-msg" role="alert"></div>
      <div class="toggle" id="auth-toggle"></div>
    </div>
  </main>

  <!-- App view -->
  <div id="app-view" hidden>
    <header class="app-header">
      <div>
        <h1>My Bookmarks</h1>
        <p class="tagline">Save a link, and it lands under its topic.</p>
      </div>
      <div class="account">
        <span id="account-email" class="account-email"></span>
        <button id="signout" class="ghost">Sign out</button>
      </div>
    </header>

    <div class="wrap">
      <section class="add-card">
        <div class="add-row">
          <div class="field">
            <label for="url">Link address</label>
            <input id="url" type="text" placeholder="https://…" />
          </div>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" placeholder="What is this link?" />
          </div>
          <div class="field">
            <label for="topic">Topic</label>
            <input id="topic" type="text" placeholder="e.g. Design, Recipes" />
          </div>
          <button class="primary" id="save">Save link</button>
        </div>
        <div id="save-notice" class="save-notice" role="status"></div>
      </section>

      <section class="search-card">
        <input id="search" type="text" placeholder="Search your links by word, title or topic…" />
        <div id="search-meta" class="search-meta"></div>
      </section>

      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
