<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — saved search</title><style>
:root{--ink:#17211b;--muted:#68736c;--line:#dfe5df;--paper:#fbfcf8;--green:#256b4b;--wash:#eef5ee}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5vw}.brand{font:700 21px Georgia,serif}.mark{display:inline-block;width:22px;height:27px;background:var(--green);border-radius:3px 3px 8px 8px;margin-right:10px;vertical-align:middle}main{width:min(1080px,92vw);margin:auto;padding:46px 0}.layout{display:grid;grid-template-columns:210px 1fr;gap:36px}.sidebar{border-right:1px solid var(--line);padding-right:24px}.sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}.saved-item{display:none;width:100%;border:0;border-radius:9px;background:var(--wash);color:#315a43;padding:10px 11px;text-align:left;font-weight:700;cursor:pointer}.saved-item small{display:block;color:var(--muted);font-weight:400;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.13em;text-transform:uppercase}h1{font:500 39px Georgia,serif;margin:10px 0 21px}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;border:1px solid #b8c7bb;border-radius:10px;padding:11px 13px;font:inherit}.search button,.save-search{border:0;border-radius:9px;background:var(--green);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}.result-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 13px}.result-head h2{font:500 22px Georgia,serif;margin:0}.save-search{background:#fff;color:var(--green);border:1px solid #b8cbbd;padding:9px 12px}.cards{display:grid;gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.domain{color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.card h3{font:500 20px Georgia,serif;margin:5px 0}.chip{display:inline-block;background:var(--wash);color:#315a43;padding:4px 8px;border-radius:16px;font-size:10px;font-weight:700}.naming{display:none;margin-top:14px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:11px}.naming label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.naming-row{display:flex;gap:8px}.naming input{flex:1;border:1px solid #b8c7bb;border-radius:9px;padding:10px;font:inherit}.naming button{border:0;border-radius:9px;background:var(--green);color:#fff;padding:10px 14px;font-weight:700}.status{display:none;margin-top:12px;padding:11px 13px;background:var(--wash);color:#315a43;border-radius:9px;font-size:13px}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{border:0;border-bottom:1px solid var(--line);padding:0 0 18px}}
</style></head><body><header><div class="brand"><span class="mark"></span>Trove</div></header><main data-harness-ready="true"><div class="layout"><aside class="sidebar"><h2>Saved searches</h2><button class="saved-item" id="saved-item">Pasta weekends<small>pasta AND #weekend</small></button><p id="none" style="color:var(--muted);font-size:13px">None saved yet.</p></aside><section><div class="eyebrow">Search results</div><h1>Keep a useful search close.</h1><form class="search"><input id="query" value="pasta AND #weekend" aria-label="Search query"><button type="button">Search</button></form><div class="result-head"><h2>2 matching bookmarks</h2><button class="save-search" id="save-search">Save this search</button></div><div class="cards"><article class="card"><div class="domain">seriouseats.com</div><h3>Pasta for a dinner party</h3><span class="chip">Weekend</span></article><article class="card"><div class="domain">eater.com</div><h3>Pasta shops worth visiting in Rome</h3><span class="chip">Weekend</span></article></div><div class="naming" id="naming"><label for="name">Name this search</label><div class="naming-row"><input id="name" value="Pasta weekends"><button id="confirm-save">Save search</button></div></div><div class="status" id="status">Saved search added to the sidebar.</div></section></div></main><script>
document.querySelector('#save-search').onclick=()=>{document.querySelector('#naming').style.display='block';document.querySelector('#name').focus()};document.querySelector('#confirm-save').onclick=()=>{const name=document.querySelector('#name').value.trim();if(!name)return;document.querySelector('#saved-item').firstChild.textContent=name;document.querySelector('#saved-item').style.display='block';document.querySelector('#none').style.display='none';document.querySelector('#naming').style.display='none';document.querySelector('#status').style.display='block'};document.querySelector('#saved-item').onclick=()=>{document.querySelector('#query').value='pasta AND #weekend';document.querySelector('#status').textContent='Saved search opened. Results refreshed with your current collection.';document.querySelector('#status').style.display='block'};
</script></body></html>
