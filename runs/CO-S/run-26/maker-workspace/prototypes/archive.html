<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archiving — prototype</title>
<link rel="stylesheet" href="status.css" />
<style>
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions .status-toggle { margin-top: 0; }
  .status-toggle.restore { color: var(--accent); border-color: var(--accent); }
  .card.archived { opacity: .82; background: #fbfbfc; border-style: dashed; }
  .tab.archived-tab { margin-left: auto; }
  .archive-banner { background: #f0f1f4; border: 1px solid var(--line); color: var(--muted);
    font-size: 13px; padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Prototype — archiving without deleting</p>
</header>

<div class="wrap">
  <div class="searchbar">
    <input id="search" type="text" placeholder="Search your bookmarks…" autocomplete="off" />
  </div>
  <p class="browse-label">Browse by tag</p>
  <div class="tagfilters" id="tagfilters"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<script src="archive.js"></script>
</body>
</html>
