<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔖</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🔖</span>
      <h1>Bookmarks</h1>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search title, description, url, tags…" autocomplete="off" />
    </div>
    <button id="add-btn" class="btn btn-primary">+ Add bookmark</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Tags</h2>
      <ul id="tag-list" class="tag-list">
        <li><button class="tag-chip active" data-tag="">All <span id="count-all" class="tag-count"></span></button></li>
      </ul>
    </aside>

    <section class="content">
      <div id="status" class="status" hidden></div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>
        <p class="empty-title">No bookmarks here yet</p>
        <p class="empty-sub">Add your first bookmark to get started.</p>
      </div>
    </section>
  </main>

  <!-- Add / Edit dialog -->
  <dialog id="dialog" class="dialog">
    <form id="form" method="dialog">
      <h2 id="dialog-title">Add bookmark</h2>
      <label>URL
        <input id="f-url" name="url" type="text" placeholder="https://example.com" required />
      </label>
      <label>Title
        <input id="f-title" name="title" type="text" placeholder="Optional — defaults to the site host" />
      </label>
      <label>Description
        <textarea id="f-description" name="description" rows="3" placeholder="Optional note"></textarea>
      </label>
      <label>Tags
        <input id="f-tags" name="tags" type="text" placeholder="Comma separated, e.g. webdev, reference" />
      </label>
      <p id="form-error" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="save-btn" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
