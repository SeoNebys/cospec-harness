<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>🔖 Bookmarks</h1>
      <nav class="views" id="views">
        <button class="view-tab active" data-view="active">All</button>
        <button class="view-tab" data-view="unread">Read later</button>
        <button class="view-tab" data-view="archive">Archive</button>
      </nav>
    </header>

    <main class="layout" id="app" data-harness-ready="false">
      <section class="sidebar">
        <form id="add-form" class="card add-form">
          <h2 id="form-heading">Add bookmark</h2>
          <input type="hidden" id="edit-id" value="" />
          <label>Address
            <input type="text" id="f-address" placeholder="https://example.com" autocomplete="off" />
          </label>
          <label>Title <span class="hint">(optional)</span>
            <input type="text" id="f-title" placeholder="Auto-filled if left blank" autocomplete="off" />
          </label>
          <label>Description <span class="hint">(optional)</span>
            <textarea id="f-description" rows="2"></textarea>
          </label>
          <label>Tags <span class="hint">(comma-separated)</span>
            <input type="text" id="f-tags" placeholder="reading, tech" autocomplete="off" />
          </label>
          <div class="form-actions">
            <button type="submit" id="save-btn" class="primary">Save</button>
            <button type="button" id="cancel-btn" class="ghost" hidden>Cancel</button>
          </div>
          <p class="form-error" id="form-error" role="alert"></p>
        </form>

        <div class="card filters">
          <input type="search" id="search" placeholder="Search bookmarks…" />
          <select id="tag-filter">
            <option value="">All tags</option>
          </select>
        </div>
      </section>

      <section class="content">
        <h2 id="list-heading" class="list-heading">All bookmarks</h2>
        <ul class="bookmark-list" id="bookmark-list"></ul>
        <p class="empty-state" id="empty-state" hidden></p>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
