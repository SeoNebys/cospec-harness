<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Bookmarks</h1>
      <button id="add-btn" class="btn btn-primary" type="button">+ Add bookmark</button>
    </header>

    <section class="toolbar">
      <input
        id="search"
        class="search-input"
        type="search"
        placeholder="Search title, address, notes, or tags…"
        autocomplete="off"
      />
      <select id="tag-filter" class="tag-select" aria-label="Filter by tag">
        <option value="">All tags</option>
      </select>
      <button id="clear-filters" class="btn btn-link" type="button" hidden>Clear</button>
    </section>

    <!-- Main list region; marked ready once initial data (or empty state) loads. -->
    <main id="list-region" class="list-region">
      <ul id="bookmark-list" class="bookmark-list"></ul>

      <div id="empty-state" class="state" hidden>
        <p>No bookmarks yet.</p>
        <button class="btn btn-primary" type="button" data-open-add>Add your first bookmark</button>
      </div>

      <div id="no-results" class="state" hidden>
        <p>No bookmarks match your search or filter.</p>
        <button class="btn btn-link" type="button" data-clear-filters>Clear filters</button>
      </div>
    </main>

    <!-- Add / edit modal -->
    <div id="form-overlay" class="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title">
        <h2 id="form-title">Add bookmark</h2>
        <form id="bookmark-form">
          <input type="hidden" id="bookmark-id" />
          <label>
            Address <span class="req">*</span>
            <input id="field-url" type="text" placeholder="example.com/page" required />
          </label>
          <label>
            Title
            <input id="field-title" type="text" placeholder="Left blank? We'll try to fetch it." />
          </label>
          <label>
            Notes
            <textarea id="field-notes" rows="3" placeholder="Optional notes"></textarea>
          </label>
          <label>
            Tags
            <input id="field-tags" type="text" placeholder="Comma-separated, e.g. reading, tech" />
          </label>
          <p id="form-error" class="form-error" hidden></p>
          <div id="dup-warning" class="dup-warning" hidden>
            <p id="dup-message"></p>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-link" id="form-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="form-submit">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete confirmation -->
    <div id="confirm-overlay" class="overlay" hidden>
      <div class="modal modal-small" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">Delete bookmark?</h2>
        <p id="confirm-message">This cannot be undone.</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-link" id="confirm-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
        </div>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
