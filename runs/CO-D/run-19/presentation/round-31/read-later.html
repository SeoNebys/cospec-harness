<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep — read later interaction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" data-harness-ready="true">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Keep home"><span class="brand-mark">K</span><span>Keep</span></a>
      <div class="avatar" aria-label="Personal library">You</div>
    </header>
    <section class="hero compact-hero">
      <p class="eyebrow">YOUR LIBRARY</p><h1>Keep the next read close.</h1>
    </section>
    <nav class="library-tabs" aria-label="Bookmark views">
      <button id="all-tab" class="library-tab active" type="button">All bookmarks <span>4</span></button>
      <button id="later-tab" class="library-tab" type="button">Read later <span id="later-count">1</span></button>
    </nav>
    <section class="library read-later-library" aria-labelledby="read-later-heading">
      <div class="section-heading">
        <div><p id="view-eyebrow" class="eyebrow">ALL BOOKMARKS</p><h2 id="read-later-heading">Your saved links</h2></div>
        <span id="view-count" class="count">4 bookmarks</span>
      </div>
      <div id="read-later-results" class="bookmark-list" aria-live="polite"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status">Added to Read later.</div>
  <script src="read-later.js"></script>
</body>
</html>
