<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — invalid address</title><style>
:root{--ink:#17211b;--muted:#68736c;--line:#dfe5df;--paper:#fbfcf8;--green:#256b4b;--red:#a53b35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6vw}.brand{font:700 21px Georgia,serif}.mark{display:inline-block;width:22px;height:27px;background:var(--green);border-radius:3px 3px 8px 8px;margin-right:10px;vertical-align:middle}main{width:min(850px,88vw);margin:auto;padding:72px 0}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.13em;text-transform:uppercase}h1{font:500 48px Georgia,serif;margin:12px 0 13px}.intro{color:var(--muted);font-size:17px;margin:0 0 30px}.savebox{display:flex;gap:9px;background:#fff;border:1px solid #bdcbbf;border-radius:14px;padding:7px;box-shadow:0 12px 30px rgba(30,54,40,.07)}.savebox.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(165,59,53,.1)}input{flex:1;border:0;outline:0;padding:11px;font:inherit}button{border:0;border-radius:9px;background:var(--green);color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}.error-message{display:none;color:var(--red);font-size:13px;font-weight:700;margin:9px 4px}.empty{margin-top:65px;padding:42px;text-align:center;border-top:1px solid var(--line);color:var(--muted)}.empty strong{display:block;color:var(--ink);font:500 23px Georgia,serif;margin-bottom:7px}
</style></head><body><header><div class="brand"><span class="mark"></span>Trove</div></header><main data-harness-ready="true"><div class="eyebrow">Your library</div><h1>Save something worth keeping.</h1><p class="intro">Paste a web address and Trove gathers its details.</p><form id="form" class="savebox" novalidate><input id="url" value="not a link" aria-label="Web address"><button>Save bookmark</button></form><div class="error-message" id="error" role="alert">That doesn’t look like a complete web address. Try something like https://example.com.</div><div class="empty"><strong>No new bookmark was added</strong>Your existing collection stays unchanged.</div></main><script>
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const value=document.querySelector('#url').value.trim();let valid=false;try{const u=new URL(value);valid=['http:','https:'].includes(u.protocol)&&Boolean(u.hostname)}catch{}const box=document.querySelector('#form'),error=document.querySelector('#error');box.classList.toggle('error',!valid);error.style.display=valid?'none':'block';if(!valid)document.querySelector('#url').focus()};
</script></body></html>
