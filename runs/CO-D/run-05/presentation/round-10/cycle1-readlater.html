<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks — read later</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#6b7480; --line:#e6e9ee;
    --accent:#2f6df6; --flash:#fff6d6; --chip:#eef1f6; --chipink:#3a4658; --mark:#fff1a8;
    --read:#2a9d55; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }

  .saver { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
  .saver input { flex:1; padding:13px 15px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); outline:none; }
  .saver input:focus { border-color:var(--accent); }
  .saver button { padding:0 20px; height:47px; font-size:15px; font-weight:600; color:#fff;
    background:var(--accent); border:none; border-radius:10px; cursor:pointer; }
  .savetoread { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; margin:0 0 14px; }

  .searchwrap { position:relative; margin-bottom:16px; }
  .searchwrap .ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .searchwrap input { width:100%; padding:11px 38px 11px 40px; font-size:14.5px; border:1px solid var(--line);
    border-radius:10px; background:#fbfcfe; outline:none; }
  .searchwrap input:focus { border-color:var(--accent); background:#fff; }
  .searchwrap .clr { position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none;
    background:none; color:var(--muted); cursor:pointer; font-size:18px; display:none; }

  .hint { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .notice { background:#eef3ff; border:1px solid #d4e0ff; border-radius:10px; padding:10px 14px;
    font-size:13.5px; margin:0 0 16px; display:none; }

  .filterbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 6px; }
  .filterbar .fb { border:1px solid var(--line); background:#fff; color:var(--chipink); border-radius:999px;
    padding:6px 13px; font:inherit; font-size:13px; cursor:pointer; }
  .filterbar .fb:hover { border-color:#cdd3db; }
  .filterbar .fb.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .filterbar .fb.toread { border-color:#d9c68a; color:#8a6d1f; font-weight:600; }
  .filterbar .fb.toread.on { background:#caa93f; border-color:#caa93f; color:#fff; }
  .filterbar .fb .n { opacity:.6; margin-left:5px; }
  .filterbar .sep { width:1px; height:20px; background:var(--line); margin:0 2px; }
  .filterbar.dim { opacity:.4; pointer-events:none; }
  .statusline { color:var(--muted); font-size:13px; margin:0 0 12px; min-height:18px; }
  .statusline b { color:var(--ink); } .statusline a { color:var(--accent); }

  ul { list-style:none; margin:0; padding:0; }
  li.item { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start;
    transition:background .3s,border-color .3s,opacity .35s,transform .35s; }
  li.item.flash { background:var(--flash); border-color:#f0e3a8; }
  li.item.leaving { opacity:0; transform:translateX(12px); }

  /* read-state checkbox */
  .readck { flex:none; width:22px; height:22px; margin-top:5px; border-radius:50%;
    border:2px solid #cfd6df; background:#fff; cursor:pointer; display:grid; place-items:center;
    color:#fff; font-size:13px; line-height:1; transition:all .15s; padding:0; }
  .readck:hover { border-color:var(--read); }
  .readck.done { background:var(--read); border-color:var(--read); }
  .readck.spacer { visibility:hidden; }

  .favicon { width:32px; height:32px; border-radius:8px; flex:none; background:#eef1f6;
    display:grid; place-items:center; font-size:16px; }
  .body { min-width:0; flex:1; }
  .title { font-weight:600; font-size:15.5px; margin:0 0 2px; }
  .title a { color:var(--ink); text-decoration:none; }
  .title a:hover { text-decoration:underline; }
  .item.isread .title a { color:var(--muted); }
  .desc { color:var(--muted); font-size:13.5px; margin:0 0 6px; }
  .meta { color:var(--muted); font-size:12.5px; margin:0 0 6px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .lchip { background:var(--chip); color:var(--chipink); border-radius:999px; padding:3px 10px;
    font-size:12.5px; cursor:pointer; border:1px solid transparent; }
  .lchip:hover { border-color:#cdd3db; }
  .state { font-size:12px; border-radius:999px; padding:2px 9px; }
  .state.toread { background:#fdf3d6; color:#8a6d1f; }
  .state.read { background:#e6f4ea; color:var(--read); }
  mark { background:var(--mark); border-radius:3px; padding:0 1px; }
  .actions { flex:none; display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .btn { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:8px;
    padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#cdd3db; color:var(--ink); }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; }
  .celebrate { color:var(--read); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Paste a link. It sorts itself out.</p>

    <div class="saver">
      <input id="url" type="text" placeholder="Paste a link and press Save…" autocomplete="off">
      <button id="save">Save</button>
    </div>
    <label class="savetoread"><input type="checkbox" id="savetoread"> Add it to my “to read” pile</label>

    <div class="searchwrap">
      <span class="ic">🔍</span>
      <input id="search" type="text" placeholder="Search your bookmarks…" autocomplete="off">
      <button class="clr" id="clr" title="clear">×</button>
    </div>

    <p class="hint">Click <b>📖 To read</b> above the list to see just that pile, then tick the circle on the left
       of a link to mark it read — watch it drop out of the pile (but it stays saved). Tick again to undo.</p>

    <div class="notice" id="notice"></div>
    <div class="filterbar" id="filterbar"></div>
    <p class="statusline" id="statusline"></p>
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

<script>
const KNOWN={ "nytimes.com":{site:"The New York Times",emoji:"🗞️"},
  "cooking.nytimes.com":{site:"NYT Cooking",emoji:"🍝"}, "github.com":{site:"GitHub",emoji:"🐙"},
  "youtube.com":{site:"YouTube",emoji:"▶️"}, "wikipedia.org":{site:"Wikipedia",emoji:"📚"},
  "bbc.com":{site:"BBC",emoji:"📰"}, "stackoverflow.com":{site:"Stack Overflow",emoji:"💬"} };
const JUNK=new Set(["utm_source","utm_medium","utm_campaign","utm_term","utm_content",
  "fbclid","gclid","mc_cid","mc_eid","igshid","ref","ref_src","spm","_hsenc","_hsmi"]);
const TOREAD="__toread__";
function titleCase(s){return s.replace(/[-_]+/g," ").replace(/\.[a-z]{2,4}$/i,"").trim()
  .replace(/\s+/g," ").replace(/\b\w/g,c=>c.toUpperCase());}
function parse(raw){ try { return new URL(raw.includes("://")?raw:"https://"+raw); } catch { return null; } }
function normalize(raw){ const u=parse(raw); if(!u) return null;
  const host=u.hostname.replace(/^www\./,"").toLowerCase(); const path=u.pathname.replace(/\/+$/,"");
  const kept=[...u.searchParams.entries()].filter(([k])=>!JUNK.has(k.toLowerCase()))
    .sort((a,b)=>a[0]<b[0]?-1:1).map(([k,v])=>k+"="+v).join("&");
  return host+path+(kept?"?"+kept:""); }
function resolve(raw){ const u=parse(raw); if(!u) return null;
  const host=u.hostname.replace(/^www\./,""); const key=Object.keys(KNOWN).find(k=>host===k||host.endsWith("."+k))||host;
  const known=KNOWN[key]||{site:titleCase(host.split(".")[0]),emoji:"🔖"};
  const seg=u.pathname.split("/").filter(Boolean).pop()||""; let title=seg?titleCase(decodeURIComponent(seg)):known.site+" — home";
  if(title.length>70) title=title.slice(0,67)+"…";
  return { id:normalize(raw), url:u.href, host, site:known.site, emoji:known.emoji, title,
    desc:"A page on "+known.site+".", labels:[], toRead:false, read:false }; }

const list=document.getElementById("list"), empty=document.getElementById("empty"),
  notice=document.getElementById("notice"), filterbar=document.getElementById("filterbar"),
  statusline=document.getElementById("statusline");

const items=[
  { id:normalize("cooking.nytimes.com/recipes/lemon-pasta"), url:"https://cooking.nytimes.com/recipes/lemon-pasta",
    host:"cooking.nytimes.com", site:"NYT Cooking", emoji:"🍝", title:"Lemon pasta",
    desc:"A bright weeknight pasta with lemon and parmesan.", labels:["recipes","dinner ideas"], toRead:false, read:false },
  { id:normalize("bbc.com/news/future-of-work"), url:"https://www.bbc.com/news/future-of-work",
    host:"bbc.com", site:"BBC", emoji:"📰", title:"The future of work",
    desc:"How remote and hybrid patterns are reshaping the office.", labels:["work stuff","articles to read"], toRead:true, read:false },
  { id:normalize("github.com/acme/dashboard"), url:"https://github.com/acme/dashboard",
    host:"github.com", site:"GitHub", emoji:"🐙", title:"Acme Dashboard",
    desc:"Internal metrics dashboard repository.", labels:["work stuff"], toRead:false, read:false },
  { id:normalize("en.wikipedia.org/wiki/Espresso"), url:"https://en.wikipedia.org/wiki/Espresso",
    host:"wikipedia.org", site:"Wikipedia", emoji:"📚", title:"Espresso",
    desc:"A concentrated coffee brewing method forcing hot water through fine grounds.", labels:[], toRead:true, read:false },
  { id:normalize("medium.com/@writer/deep-work-notes"), url:"https://medium.com/@writer/deep-work-notes",
    host:"medium.com", site:"Medium", emoji:"✍️", title:"Notes on deep work",
    desc:"A summary of strategies for focused, distraction-free work.", labels:["articles to read"], toRead:true, read:false },
];
const knownLabels=new Set(); items.forEach(it=>it.labels.forEach(l=>knownLabels.add(l)));
let editing=null, filter=null, query="";

function showNotice(m,cls){ notice.textContent=m; notice.className="notice"+(cls?" "+cls:""); notice.style.display="block";
  clearTimeout(showNotice._t); showNotice._t=setTimeout(()=>notice.style.display="none",4000); }
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function cssEsc(s){return s.replace(/["\\]/g,"\\$&");}
function countFor(l){ return items.filter(it=>it.labels.includes(l)).length; }
function toReadCount(){ return items.filter(it=>it.toRead).length; }
function tokenize(q){ const t=[]; const re=/"([^"]+)"|(\S+)/g; let m;
  while((m=re.exec(q))!==null){ const s=(m[1]!==undefined?m[1]:m[2]).trim().toLowerCase(); if(s) t.push(s); } return t; }
function matches(it,tokens){ const hay=(it.title+" "+it.desc+" "+it.site).toLowerCase(); return tokens.every(t=>hay.includes(t)); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function hi(text,tokens){ if(!tokens.length) return esc(text);
  const re=new RegExp("("+tokens.map(reEsc).join("|")+")","gi"); const out=[]; let last=0,m;
  while((m=re.exec(text))!==null){ if(m.index===re.lastIndex) re.lastIndex++;
    out.push(esc(text.slice(last,m.index)),"<mark>",esc(m[0]),"</mark>"); last=m.index+m[0].length; }
  out.push(esc(text.slice(last))); return out.join(""); }

function renderFilterbar(){
  filterbar.innerHTML=""; filterbar.classList.toggle("dim", !!query);
  const tr=document.createElement("button"); tr.className="fb toread"+(filter===TOREAD?" on":"");
  tr.innerHTML=`📖 To read <span class="n">${toReadCount()}</span>`;
  tr.addEventListener("click",()=>{ filter=(filter===TOREAD?null:TOREAD); render(); });
  filterbar.appendChild(tr);
  const all=document.createElement("button"); all.className="fb"+(filter===null?" on":"");
  all.innerHTML=`All <span class="n">${items.length}</span>`;
  all.addEventListener("click",()=>{ filter=null; render(); });
  filterbar.appendChild(all);
  if(knownLabels.size){ const sep=document.createElement("span"); sep.className="sep"; filterbar.appendChild(sep); }
  [...knownLabels].sort().forEach(l=>{
    const b=document.createElement("button"); b.className="fb"+(filter===l?" on":"");
    b.innerHTML=`${esc(l)} <span class="n">${countFor(l)}</span>`;
    b.addEventListener("click",()=>{ filter=(filter===l?null:l); render(); });
    filterbar.appendChild(b);
  });
}

function render(){
  renderFilterbar();
  const tokens=tokenize(query);
  let shown;
  if(query){ shown=items.filter(it=>matches(it,tokens)); }
  else if(filter===TOREAD){ shown=items.filter(it=>it.toRead); }
  else { shown=filter?items.filter(it=>it.labels.includes(filter)):items; }

  if(query){ statusline.innerHTML=`${shown.length} result${shown.length===1?"":"s"} for <b>“${esc(query)}”</b> · <a href="#" id="clr2">clear search</a>`; }
  else if(filter===TOREAD){ const n=shown.length;
    statusline.innerHTML = n ? `Your <b>to-read</b> pile — ${n} to go. <a href="#" id="clr2">show all</a>`
      : `<span class="celebrate">🎉 Nothing left to read — pile’s empty.</span> <a href="#" id="clr2">show all</a>`; }
  else if(filter){ statusline.innerHTML=`Showing <b>${esc(filter)}</b> — ${shown.length} link${shown.length===1?"":"s"} · <a href="#" id="clr2">show all</a>`; }
  else statusline.innerHTML="";
  const c2=document.getElementById("clr2"); if(c2) c2.addEventListener("click",e=>{e.preventDefault(); if(query){document.getElementById("search").value="";query="";} else filter=null; render();});

  list.innerHTML="";
  if(!shown.length){ empty.style.display="block";
    empty.textContent = query ? `No bookmarks match “${query}”.`
      : (filter===TOREAD ? "Your to-read pile is empty — nicely done."
      : (filter ? `No links labelled "${filter}" yet.` : "Nothing saved yet. Paste your first link above.")); }
  else empty.style.display="none";

  shown.forEach(it=>{
    const li=document.createElement("li"); li.className="item"+(it.read?" isread":""); li.dataset.id=it.id;
    if(editing===it.id){ renderEdit(li,it); list.appendChild(li); return; }

    // read-state control
    let ck;
    if(it.toRead||it.read){
      ck=`<button class="readck${it.read?" done":""}" title="${it.read?"Mark as still to read":"Mark as read"}">${it.read?"✓":""}</button>`;
    } else { ck=`<span class="readck spacer"></span>`; }

    const chips=it.labels.map(l=>`<span class="lchip" data-l="${esc(l)}">${esc(l)}</span>`).join("");
    const stateBadge = it.toRead?`<span class="state toread">📖 To read</span>`
      : it.read?`<span class="state read">✓ Read</span>`:"";
    const markBtn = (!it.toRead && !it.read)?`<button class="btn markread">📖 To read</button>`:"";

    li.innerHTML=`${ck}
      <div class="favicon">${it.emoji}</div>
      <div class="body">
        <p class="title"><a href="${it.url}" target="_blank" rel="noopener">${hi(it.title,tokens)}</a></p>
        <p class="desc">${hi(it.desc,tokens)}</p>
        <p class="meta">${it.site} · ${it.host}</p>
        <div class="badges">${stateBadge}${chips}</div>
      </div>
      <div class="actions"><button class="btn edit">Edit</button>${markBtn}</div>`;

    const ckEl=li.querySelector(".readck:not(.spacer)");
    if(ckEl) ckEl.addEventListener("click",()=>toggleRead(it,li));
    li.querySelector(".edit").addEventListener("click",()=>{ editing=it.id; render(); });
    const mb=li.querySelector(".markread"); if(mb) mb.addEventListener("click",()=>{ it.toRead=true; it.read=false; render(); });
    li.querySelectorAll(".lchip").forEach(c=>c.addEventListener("click",()=>{ filter=c.dataset.l; document.getElementById("search").value=""; query=""; render(); }));
    list.appendChild(li);
  });
}

function toggleRead(it,li){
  if(it.read){ it.read=false; it.toRead=true; render(); return; } // undo → back to pile
  // marking read
  it.read=true; it.toRead=false;
  if(filter===TOREAD){ // animate it leaving the pile, then re-render
    li.classList.add("leaving");
    setTimeout(()=>render(),340);
  } else render();
}

function renderEdit(li,it){
  li.innerHTML=`<span class="readck spacer"></span><div class="favicon">${it.emoji}</div>
    <div style="flex:1">
      <label style="display:block;font-size:12px;color:var(--muted);margin:0 0 3px">Title</label>
      <input class="t" style="width:100%;font:inherit;border:1px solid var(--accent);border-radius:6px;padding:6px 8px" value="${esc(it.title)}">
      <label style="display:block;font-size:12px;color:var(--muted);margin:8px 0 3px">Summary</label>
      <textarea class="d" style="width:100%;font:inherit;border:1px solid var(--accent);border-radius:6px;padding:6px 8px;min-height:44px">${esc(it.desc)}</textarea>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="done" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer">Done</button>
        <button class="cancel" style="background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:8px 6px">Cancel</button>
      </div>
    </div>`;
  li.querySelector(".t").focus();
  li.querySelector(".done").addEventListener("click",()=>{ const t=li.querySelector(".t").value.trim(), d=li.querySelector(".d").value.trim();
    if(t) it.title=t; if(d) it.desc=d; editing=null; render(); });
  li.querySelector(".cancel").addEventListener("click",()=>{ editing=null; render(); });
  li.querySelectorAll(".t,.d").forEach(el=>el.addEventListener("keydown",e=>{ if(e.key==="Escape"){editing=null;render();} }));
}

function flash(id){ const li=list.querySelector(`li[data-id="${cssEsc(id)}"]`); if(!li) return;
  li.classList.add("flash"); li.scrollIntoView({behavior:"smooth",block:"center"}); setTimeout(()=>li.classList.remove("flash"),1600); }

const input=document.getElementById("url"), btn=document.getElementById("save"), saveToRead=document.getElementById("savetoread");
function save(){
  const raw=input.value.trim(); if(!raw) return;
  const r=resolve(raw); if(!r){ alert("That doesn't look like a link yet."); return; }
  input.value="";
  const existing=items.find(x=>x.id===r.id);
  if(existing){ filter=null; query=""; document.getElementById("search").value=""; showNotice("You already saved this one — here it is."); render(); flash(existing.id); return; }
  r.toRead=saveToRead.checked; saveToRead.checked=false;
  filter=null; query=""; document.getElementById("search").value=""; render();
  const li=document.createElement("li"); li.className="item"; empty.style.display="none";
  li.innerHTML=`<span class="readck spacer"></span><div class="favicon">…</div><div class="body"><p class="title">Figuring out this page…</p><p class="meta">Reading the title and summary</p></div>`;
  list.insertBefore(li,list.firstChild);
  setTimeout(()=>{ items.unshift(r); render(); },850);
}
btn.addEventListener("click",save);
input.addEventListener("keydown",e=>{ if(e.key==="Enter") save(); });

const search=document.getElementById("search"), clrBtn=document.getElementById("clr");
search.addEventListener("input",()=>{ query=search.value.trim(); clrBtn.style.display=query?"block":"none"; render(); });
clrBtn.addEventListener("click",()=>{ search.value=""; query=""; clrBtn.style.display="none"; render(); });
render();
</script>
</body>
</html>
