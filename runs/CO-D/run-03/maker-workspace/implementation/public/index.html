<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-density="comfortable" data-text="medium">
  <header class="topbar">
    <div class="brand">🔖 My Bookmarks</div>
    <div class="saver">
      <input id="saveUrl" type="text" placeholder="Paste a link and press Save…" autocomplete="off" />
      <button id="saveBtn">Save</button>
    </div>
    <div class="topactions">
      <button class="ghost" id="importBtn" title="Import / export">Import / export</button>
      <button class="ghost" id="prefsBtn" title="Display preferences">⚙ Preferences</button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <h2>Library</h2>
      <nav id="statusNav" class="nav"></nav>
      <div class="collhead"><h2>Collections</h2><button class="linkbtn" id="newCollBtn">＋ New</button></div>
      <nav id="collNav" class="nav"></nav>
    </aside>

    <main class="main">
      <div class="searchrow">
        <div class="searchbox">
          <span class="mag">🔍</span>
          <input id="search" type="text" placeholder="Search — try focus, #book, &quot;read later&quot;, rome (#article OR #book)…" autocomplete="off" />
          <button id="searchClear" class="clearbtn" title="Clear">✕</button>
        </div>
        <div class="sortwrap">
          <label for="sort">Sort</label>
          <select id="sort">
            <option value="newest">Newest added</option>
            <option value="oldest">Oldest added</option>
            <option value="updated">Recently updated</option>
            <option value="az">Title A–Z</option>
            <option value="za">Title Z–A</option>
          </select>
        </div>
      </div>
      <div class="tips">Tips: <code>#tag</code> · <code>"exact phrase"</code> · <code>AND</code> <code>OR</code> <code>NOT</code> <code>( )</code> · quote a word like <code>"OR"</code> for the literal word.</div>

      <div class="toolbar">
        <div id="count" class="count"></div>
        <div class="toolright">
          <label class="selall"><input type="checkbox" id="selPage" /> Select page</label>
        </div>
      </div>
      <div id="matchBanner"></div>

      <div id="list" class="list"></div>
      <div id="sentinel"></div>
      <div id="loadingMore" class="loadingmore" hidden><span class="spin"></span> Loading more bookmarks…</div>
      <div id="emptyState" class="empty" hidden></div>
    </main>
  </div>

  <div id="bulkBar" class="bulkbar" hidden></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toastroot"></div>

  <script src="app.js"></script>
</body>
</html>
