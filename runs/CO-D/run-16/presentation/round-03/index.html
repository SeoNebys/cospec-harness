<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — prototype</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1c2430; --muted:#6b7686;
    --line:#e6e9ef; --accent:#2f6fed; --accent-soft:#eaf1ff; --chip:#eef1f6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  .composer{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:28px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .composer label{display:block;font-size:12px;font-weight:600;color:var(--muted);
    margin:0 0 4px;letter-spacing:.02em;text-transform:uppercase}
  .composer input,.composer textarea{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .composer input:focus,.composer textarea:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}
  .row{margin-bottom:12px}
  .two{display:flex;gap:12px}
  .two>div{flex:1}
  textarea{resize:vertical;min-height:52px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .save{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 18px;
    font-size:15px;font-weight:600;cursor:pointer}
  .save:hover{background:#255fd6}

  .listhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
  .listhead h2{font-size:15px;margin:0}
  .count{color:var(--muted);font-size:13px}

  .empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);
    border-radius:14px;background:#fff}
  .empty .big{font-size:15px;color:var(--ink);margin-bottom:4px}

  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .item .title{font-size:16px;font-weight:600;margin:0 0 2px}
  .item .title a{color:var(--ink);text-decoration:none}
  .item .title a:hover{text-decoration:underline}
  .item .url{font-size:13px;color:var(--accent);word-break:break-all;margin:0 0 8px;display:inline-block}
  .item .note{font-size:14px;color:#37414f;margin:6px 0 10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:var(--chip);color:#41505f;font-size:12px;padding:3px 9px;border-radius:20px}
  .just-added{animation:flash 1.2s ease}
  @keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--card)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Save a link, add tags or a note, and keep it in one place.</p>

  <form class="composer" id="composer">
    <div class="row">
      <label for="url">Link</label>
      <input id="url" type="text" placeholder="Paste or type a web address" autocomplete="off">
    </div>
    <div class="row two">
      <div>
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="What is this? (optional)" autocomplete="off">
      </div>
      <div>
        <label for="tags">Tags</label>
        <input id="tags" type="text" placeholder="e.g. recipes, work (comma separated)" autocomplete="off">
      </div>
    </div>
    <div class="row">
      <label for="note">Note</label>
      <textarea id="note" placeholder="A few words to help you remember it later (optional)"></textarea>
    </div>
    <button class="save" type="submit">Save bookmark</button>
  </form>

  <div class="listhead">
    <h2>Saved</h2>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</div>

<script>
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  let items = [];

  function render(justAddedId){
    countEl.textContent = items.length ? items.length + (items.length===1?' bookmark':' bookmarks') : '';
    if(items.length===0){
      listEl.innerHTML = '<div class="empty"><div class="big">No bookmarks yet</div>'+
        'Save your first link using the form above.</div>';
      return;
    }
    listEl.innerHTML = items.map(function(b){
      var display = b.title && b.title.trim() ? b.title : b.url;
      var tags = (b.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
      return '<div class="item'+(b.id===justAddedId?' just-added':'')+'">'+
        '<div class="title"><a href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(display)+'</a></div>'+
        '<a class="url" href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(b.url)+'</a>'+
        (b.note?'<div class="note">'+esc(b.note)+'</div>':'')+
        (tags?'<div class="tags">'+tags+'</div>':'')+
      '</div>';
    }).join('');
  }

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  document.getElementById('composer').addEventListener('submit', function(e){
    e.preventDefault();
    var url = document.getElementById('url').value.trim();
    if(!url) return;
    var tagsRaw = document.getElementById('tags').value.trim();
    var b = {
      id: Date.now(),
      url: url,
      title: document.getElementById('title').value.trim(),
      note: document.getElementById('note').value.trim(),
      tags: tagsRaw ? tagsRaw.split(',').map(function(t){return t.trim();}).filter(Boolean) : []
    };
    items.unshift(b);
    this.reset();
    document.getElementById('url').focus();
    render(b.id);
  });

  render();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
