openapi: 3.1.0
info:
  title: Bookmark Manager API
  version: 1.0.0
  license:
    name: Private project
    identifier: UNLICENSED
  description: >-
    Same-origin authenticated API for the approved bookmark-manager feature.
    All owned resources are scoped to the user in the encrypted session cookie.
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: Session
    description: Sign-in state for provisioned accounts.
  - name: Bookmarks
    description: User-owned bookmark capture and lifecycle.
  - name: Metadata
    description: Guarded publisher metadata and image retrieval.
  - name: Tags
    description: Reusable bookmark labels.
  - name: Collections
    description: Single-collection bookmark grouping.
  - name: Saved views
    description: Named live search and filter criteria.
  - name: Bulk actions
    description: Previewed multi-bookmark mutations.

paths:
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Return the current user, CSRF token, and library revision
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Session]
      operationId: deleteSession
      summary: Sign out
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Session cleared }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /session/login:
    post:
      tags: [Session]
      operationId: loginSession
      summary: Sign in to a provisioned account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /metadata-preview:
    post:
      tags: [Metadata]
      operationId: previewMetadata
      summary: Retrieve safe, bounded publisher metadata for a candidate URL
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Complete, partial, or graceful fallback result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetadataPreview' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /bookmarks:
    get:
      tags: [Bookmarks]
      operationId: listBookmarks
      summary: Search, filter, sort, and page through one library location
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Location'
        - $ref: '#/components/parameters/TagIds'
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/ReadState'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of bookmarks and canonical criteria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookmarkPage' }
        '400':
          description: Invalid query grammar or filters, including source span
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/SearchProblem' }
    post:
      tags: [Bookmarks]
      operationId: createBookmark
      summary: Create a bookmark
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarkCreate' }
      responses:
        '201':
          description: Bookmark created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '409':
          description: Normalized destination already exists in active or archive
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/DuplicateProblem' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /bookmarks/{bookmarkId}:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    get:
      tags: [Bookmarks]
      operationId: getBookmark
      summary: Return one owned bookmark
      responses:
        '200':
          description: Bookmark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Bookmarks]
      operationId: updateBookmark
      summary: Edit fields or transition read/archive state
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarkPatch' }
      responses:
        '200':
          description: Updated bookmark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale bookmark version or duplicate normalized URL
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Bookmarks]
      operationId: deleteBookmark
      summary: Permanently delete one bookmark after client confirmation
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Permanently deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Record changed after confirmation
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /bookmarks/{bookmarkId}/assets/{kind}:
    get:
      tags: [Metadata]
      operationId: getBookmarkAsset
      summary: Return a verified publisher icon or preview through the owned proxy
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [icon, preview] }
      responses:
        '200':
          description: Verified raster image bytes
          headers:
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Asset missing, unsafe, too large, or not a supported raster image
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags or return ranked suggestions
      parameters:
        - name: suggest
          in: query
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          description: Owned tags with usage counts
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: '#/components/schemas/Label' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/LabelCreate'
      responses:
        '201':
          description: Created tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '409': { $ref: '#/components/responses/NameConflict' }

  /tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    patch:
      tags: [Tags]
      operationId: updateTag
      summary: Rename a tag
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/LabelCreate'
      responses:
        '200':
          description: Renamed tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameConflict' }
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Delete a tag after confirming its affected bookmark count
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ExpectedCount'
      responses:
        '204': { description: Tag removed; bookmarks retained }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleImpact' }

  /collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List owned collections with usage counts
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Label' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/LabelCreate'
      responses:
        '201':
          description: Created collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '409': { $ref: '#/components/responses/NameConflict' }

  /collections/{collectionId}:
    parameters:
      - $ref: '#/components/parameters/CollectionIdPath'
    patch:
      tags: [Collections]
      operationId: updateCollection
      summary: Rename a collection
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/LabelCreate'
      responses:
        '200':
          description: Renamed collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameConflict' }
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Delete a collection after confirming its affected bookmark count
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ExpectedCount'
      responses:
        '204': { description: Collection removed; bookmarks retained }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleImpact' }

  /saved-views:
    get:
      tags: [Saved views]
      operationId: listSavedViews
      summary: List saved views and unresolved-reference warnings
      responses:
        '200':
          description: Saved views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedView' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Saved views]
      operationId: createSavedView
      summary: Save current live criteria
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewWrite' }
      responses:
        '201':
          description: Saved view created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '409': { $ref: '#/components/responses/NameConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /saved-views/{viewId}:
    parameters:
      - $ref: '#/components/parameters/ViewId'
    patch:
      tags: [Saved views]
      operationId: updateSavedView
      summary: Rename or replace a saved view's criteria
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewWrite' }
      responses:
        '200':
          description: Updated saved view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameConflict' }
    delete:
      tags: [Saved views]
      operationId: deleteSavedView
      summary: Delete a saved view without changing bookmarks
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Saved view deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /bulk-actions/preview:
    post:
      tags: [Bulk actions]
      operationId: previewBulkAction
      summary: Resolve an explicit or all-matches selection and return exact impact
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkPreviewRequest' }
      responses:
        '200':
          description: Scope to show before commitment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkPreview' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /bulk-actions/execute:
    post:
      tags: [Bulk actions]
      operationId: executeBulkAction
      summary: Execute the exact previously previewed bulk scope
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkExecuteRequest' }
      responses:
        '200':
          description: Exact item-level outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '409':
          description: Library changed, criteria changed, or count no longer matches
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bookmark_session

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 512 }
    BookmarkId:
      name: bookmarkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CollectionIdPath:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ViewId:
      name: viewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Query:
      name: q
      in: query
      schema: { type: string, maxLength: 1000, default: '' }
    Location:
      name: location
      in: query
      schema: { $ref: '#/components/schemas/Location' }
    TagIds:
      name: tagId
      in: query
      explode: true
      schema:
        type: array
        maxItems: 50
        items: { type: string, format: uuid }
    CollectionId:
      name: collectionId
      in: query
      schema: { type: string, format: uuid }
    ReadState:
      name: readState
      in: query
      schema: { $ref: '#/components/schemas/ReadState' }
    Sort:
      name: sort
      in: query
      schema: { $ref: '#/components/schemas/Sort' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ExpectedCount:
      name: expectedCount
      in: query
      required: true
      schema: { type: integer, minimum: 0 }

  requestBodies:
    LabelCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 50 }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found for the current user
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: One or more fields failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    RateLimited:
      description: Metadata retrieval rate limit reached
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NameConflict:
      description: Normalized name already exists
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    StaleImpact:
      description: Affected count changed after confirmation; refresh required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Session:
      type: object
      additionalProperties: false
      required: [user, csrfToken, libraryRevision]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
        csrfToken: { type: string }
        libraryRevision: { type: integer, minimum: 0 }

    MetadataPreview:
      type: object
      additionalProperties: false
      required: [normalizedUrl, finalUrl, title, status, warnings]
      properties:
        normalizedUrl: { type: string, format: uri }
        finalUrl: { type: string, format: uri }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        siteIconUrl: { type: [string, 'null'], format: uri }
        previewImageUrl: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [complete, partial, unavailable, blocked, timeout] }
        warnings:
          type: array
          maxItems: 20
          items: { type: string }

    Bookmark:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - normalizedUrl
        - title
        - notesMarkdown
        - tagIds
        - readState
        - archived
        - metadataStatus
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        normalizedUrl: { type: string, format: uri }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        notesMarkdown: { type: [string, 'null'], maxLength: 20000 }
        siteIconAvailable: { type: boolean }
        previewImageAvailable: { type: boolean }
        metadataStatus: { type: string, enum: [complete, partial, unavailable, blocked, timeout] }
        metadataWarnings:
          type: array
          items: { type: string }
        tagIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { type: string, format: uuid }
        collectionId: { type: [string, 'null'], format: uuid }
        readState: { $ref: '#/components/schemas/ReadState' }
        archived: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BookmarkCreate:
      type: object
      additionalProperties: false
      required: [url, title]
      properties:
        url: { type: string, minLength: 1, maxLength: 4096 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        notesMarkdown: { type: [string, 'null'], maxLength: 20000 }
        siteIconUrl: { type: [string, 'null'], format: uri }
        previewImageUrl: { type: [string, 'null'], format: uri }
        metadataStatus: { type: string, enum: [complete, partial, unavailable, blocked, timeout] }
        metadataWarnings:
          type: array
          maxItems: 20
          items: { type: string }
        tagIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { type: string, format: uuid }
        collectionId: { type: [string, 'null'], format: uuid }
        readState: { $ref: '#/components/schemas/ReadState' }

    BookmarkPatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        url: { type: string, minLength: 1, maxLength: 4096 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        notesMarkdown: { type: [string, 'null'], maxLength: 20000 }
        tagIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { type: string, format: uuid }
        collectionId: { type: [string, 'null'], format: uuid }
        readState: { $ref: '#/components/schemas/ReadState' }
        archived: { type: boolean }

    BookmarkPage:
      type: object
      additionalProperties: false
      required: [items, total, nextCursor, criteria, libraryRevision, warnings]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Bookmark' }
        total: { type: integer, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
        criteria: { $ref: '#/components/schemas/SearchCriteria' }
        libraryRevision: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }

    SearchCriteria:
      type: object
      additionalProperties: false
      required: [query, location, tagIds, collectionId, readState, sort]
      properties:
        query: { type: string, maxLength: 1000, default: '' }
        location: { $ref: '#/components/schemas/Location' }
        tagIds:
          type: array
          maxItems: 50
          uniqueItems: true
          description: Multiple filter chips use ALL semantics.
          items: { type: string, format: uuid }
        collectionId: { type: [string, 'null'], format: uuid }
        readState:
          oneOf:
            - $ref: '#/components/schemas/ReadState'
            - type: 'null'
        sort: { $ref: '#/components/schemas/Sort' }

    Label:
      type: object
      additionalProperties: false
      required: [id, name, bookmarkCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50 }
        bookmarkCount: { type: integer, minimum: 0 }

    SavedViewWrite:
      type: object
      additionalProperties: false
      required: [name, criteria]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        criteria: { $ref: '#/components/schemas/SearchCriteria' }
        replaceConflicting: { type: boolean, default: false }

    SavedView:
      allOf:
        - $ref: '#/components/schemas/SavedViewWrite'
        - type: object
          required: [id, parserVersion, warnings, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            parserVersion: { type: integer, minimum: 1 }
            warnings:
              type: array
              items: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    Selection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, bookmarkIds]
          properties:
            mode: { type: string, const: explicit }
            bookmarkIds:
              type: array
              minItems: 1
              maxItems: 10000
              uniqueItems: true
              items: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [mode, criteria]
          properties:
            mode: { type: string, const: allMatching }
            criteria: { $ref: '#/components/schemas/SearchCriteria' }

    BulkAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [markRead, markUnread, archive, restore, addTags, removeTags, deletePermanently]
        tagIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }

    BulkPreviewRequest:
      type: object
      additionalProperties: false
      required: [selection, action]
      properties:
        selection: { $ref: '#/components/schemas/Selection' }
        action: { $ref: '#/components/schemas/BulkAction' }

    BulkPreview:
      type: object
      additionalProperties: false
      required: [criteriaHash, libraryRevision, matchedCount, applicableCount, rejectedCount, requiresConfirmation]
      properties:
        criteriaHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        libraryRevision: { type: integer, minimum: 0 }
        matchedCount: { type: integer, minimum: 0 }
        applicableCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        requiresConfirmation: { type: boolean }
        rejectionSummary:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { type: string }
              count: { type: integer, minimum: 1 }

    BulkExecuteRequest:
      allOf:
        - $ref: '#/components/schemas/BulkPreviewRequest'
        - type: object
          required: [criteriaHash, libraryRevision, expectedCount, confirmed]
          properties:
            criteriaHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            libraryRevision: { type: integer, minimum: 0 }
            expectedCount: { type: integer, minimum: 0 }
            confirmed: { type: boolean, const: true }

    BulkResult:
      type: object
      additionalProperties: false
      required: [matchedCount, succeededCount, failedCount, failures, libraryRevision]
      properties:
        matchedCount: { type: integer, minimum: 0 }
        succeededCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        failures:
          type: array
          items:
            type: object
            required: [bookmarkId, reason]
            properties:
              bookmarkId: { type: string, format: uuid }
              reason: { type: string }
        libraryRevision: { type: integer, minimum: 0 }

    Location:
      type: string
      enum: [active, unread, archive]
      default: active
    ReadState:
      type: string
      enum: [unread, read]
      default: unread
    Sort:
      type: string
      enum: [newest, oldest, title]
      default: newest

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        requestId: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }

    SearchProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [start, end, query]
          properties:
            start: { type: integer, minimum: 0 }
            end: { type: integer, minimum: 0 }
            query: { type: string, maxLength: 1000 }

    DuplicateProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [existingBookmarkId, archived]
          properties:
            existingBookmarkId: { type: string, format: uuid }
            archived: { type: boolean }
