<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — prototype</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e4e7eb; --text:#1c2430; --muted:#6b7684; --accent:#2f6fed; --warn:#b46a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:18px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:20px; }
  .save { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; gap:10px; }
  .save input { flex:1; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .btn { padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  .btn.secondary { background:#eef0f3; color:var(--text); }
  .btn.danger { background:#c0392b; color:#fff; }
  .linkbtn.danger { color:#c0392b; }
  .confirm { border:1px solid #f0c6c0; background:#fdf3f2; border-radius:12px; padding:14px 16px; }
  .confirm h4 { margin:0 0 4px; font-size:15px; color:#7d241a; }
  .confirm p { margin:0 0 12px; font-size:13px; color:#7d241a; }
  .btn:disabled { opacity:.5; cursor:default; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label { font-size:12px; color:var(--muted); font-weight:600; }
  .field input, .field textarea { padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  .field textarea { resize:vertical; min-height:52px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:12px; }
  .compose-head { font-size:13px; color:var(--muted); margin-bottom:10px; }
  .preview { display:flex; gap:14px; }
  .thumb { width:120px; height:80px; border-radius:8px; flex:0 0 auto; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; text-align:center; }
  .icon { width:20px; height:20px; border-radius:5px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:11px; }
  .segmented { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:16px; background:var(--card); }
  .segmented button { border:0; background:transparent; padding:9px 16px; font-size:14px; cursor:pointer; color:var(--muted); border-right:1px solid var(--line); }
  .segmented button:last-child { border-right:0; }
  .segmented button.active { background:var(--accent); color:#fff; }
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; vertical-align:middle; }
  .badge.toread { background:#fdeccd; color:#8a5a00; }
  .badge.reference { background:#dfe9ff; color:#274690; }
  .choice { display:inline-flex; gap:6px; }
  .choice button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; color:var(--text); }
  .choice button.on { border-color:var(--accent); background:#eef3ff; color:var(--accent); font-weight:600; }
  .tagbox { display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .tagbox input { border:0; outline:none; flex:1; min-width:140px; font-size:14px; padding:4px; }
  .chip { display:inline-flex; align-items:center; gap:5px; background:#eef3ff; color:#274690; border-radius:999px; padding:3px 5px 3px 10px; font-size:12px; }
  .chip .chipx { border:0; background:none; color:#274690; cursor:pointer; font-size:14px; line-height:1; padding:0 2px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tags .tag { background:#eef3ff; color:#274690; border:0; border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .tags .tag:hover { background:#dde8ff; }
  .suggest { display:none; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .suggest .sugtag { background:#fff; border:1px solid var(--line); color:#274690; border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .suggest .sugtag:hover { background:#eef3ff; }
  .suggest .sughint { font-size:11px; color:var(--muted); align-self:center; margin-right:2px; }
  .searchwrap { margin-top:16px; }
  .searchwrap input { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:var(--card); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; }
  .savebtn { font-size:13px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--accent); cursor:pointer; }
  .savedbar { display:none; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  .savedbar .slabel { font-size:12px; color:var(--muted); }
  .savedbar .schip { display:inline-flex; align-items:center; gap:4px; background:#eef3ff; color:#274690; border:1px solid #d7e2fb; border-radius:999px; padding:4px 6px 4px 12px; font-size:13px; cursor:pointer; }
  .savedbar .schip .sx { border:0; background:none; color:#274690; cursor:pointer; font-size:14px; padding:0 2px; }
  .saveform { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .saveform input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; min-width:200px; }
  .sortlabel { font-size:13px; color:var(--muted); display:inline-flex; gap:6px; align-items:center; }
  .sortlabel select { font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  mark { background:#fff2b0; color:inherit; padding:0 1px; border-radius:2px; }
  .count { color:var(--muted); font-size:13px; margin:20px 4px 8px; }
  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  li.item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .item-top { display:flex; gap:14px; }
  .selbox { width:17px; height:17px; margin-top:2px; flex:0 0 auto; cursor:pointer; }
  li.item.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .bulkbar { display:none; position:sticky; top:0; z-index:5; background:#1c2430; color:#fff; border-radius:10px; padding:10px 12px; margin-bottom:12px; gap:8px; align-items:center; flex-wrap:wrap; }
  .bulkbar .bcount { font-weight:600; font-size:14px; margin-right:4px; }
  .bulkbar .scopehint { font-size:12px; color:#c7cdd6; width:100%; margin-top:2px; }
  .bulkbar button { border:0; border-radius:7px; padding:7px 11px; font-size:13px; cursor:pointer; background:#333d4c; color:#fff; }
  .bulkbar button.primary { background:var(--accent); }
  .bulkbar button.danger { background:#c0392b; }
  .bulkbar button.ghost { background:transparent; color:#c7cdd6; text-decoration:underline; padding:7px 4px; }
  .bulkbar input.btag { border:0; border-radius:7px; padding:7px 10px; font-size:13px; min-width:150px; }
  .item-body { flex:1; min-width:0; }
  .item .titlerow { display:flex; align-items:center; gap:8px; }
  .item .titlerow { flex-wrap:wrap; }
  .item a.title { font-size:15px; font-weight:600; color:var(--text); text-decoration:none; overflow-wrap:anywhere; }
  .item a.title:hover { color:var(--accent); text-decoration:underline; }
  .item .desc { color:#43505f; font-size:13px; margin-top:5px; overflow-wrap:anywhere; }
  .item .desc.clamped { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .item .note { margin-top:8px; padding:8px 11px; background:#fbfaf4; border-left:3px solid #d9c98a; border-radius:6px; font-size:13px; color:#4a4636; }
  .note.markdown h3,.note.markdown h4 { margin:4px 0; font-size:14px; }
  .note.markdown p { margin:4px 0; }
  .note.markdown ul,.note.markdown ol { margin:4px 0 4px 20px; padding:0; }
  .note.markdown code { background:#ece8d8; padding:0 3px; border-radius:3px; font-size:12px; }
  .note.markdown a { color:var(--accent); }
  .note.collapsed { max-height:6.5em; overflow:hidden; }
  .item a.link { color:var(--accent); text-decoration:none; font-size:12px; word-break:break-all; display:inline-block; margin-top:7px; }
  .item a.link:hover { text-decoration:underline; }
  .item .meta { color:var(--muted); font-size:12px; margin-top:7px; display:flex; gap:12px; align-items:center; }
  .linkbtn { background:none; border:0; color:var(--accent); font-size:12px; cursor:pointer; padding:0; }
  .empty { color:var(--muted); font-size:14px; padding:24px 4px; }
  .flash { animation:flash 1.6s ease; }
  @keyframes flash { 0%{ background:#fff4e0;} 100%{ background:var(--card);} }
  .dupnote { color:var(--warn); font-size:13px; margin:10px 4px 0; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>One dependable place for every link you save.</p>
</header>
<main>
  <form class="save" id="saveForm">
    <input id="urlInput" type="text" placeholder="Paste a link to save…" autocomplete="off" />
    <button id="saveBtn" class="btn" type="submit" disabled>Save</button>
  </form>
  <div id="dupnote"></div>

  <div id="composeSlot"></div>

  <div class="segmented" id="segmented">
    <button data-f="all" class="active">All</button>
    <button data-f="toread">To read</button>
    <button data-f="reference">Reference</button>
    <button data-f="archived">Archived</button>
  </div>

  <div class="searchwrap">
    <input id="searchInput" type="search" placeholder="Search your bookmarks by title, description or address…" autocomplete="off" />
  </div>

  <div class="toolbar">
    <button id="saveSearchBtn" class="savebtn">☆ Save this search</button>
    <label class="sortlabel">Sort
      <select id="sortSelect">
        <option value="added-desc">Date added — newest first</option>
        <option value="added-asc">Date added — oldest first</option>
        <option value="updated-desc">Recently updated</option>
        <option value="title-asc">Title — A to Z</option>
        <option value="title-desc">Title — Z to A</option>
      </select>
    </label>
  </div>

  <div id="savedbar" class="savedbar"></div>
  <div class="count" id="count"></div>
  <div id="bulkbar"></div>
  <ul class="list" id="list"></ul>
</main>

<script>
  var query = '';
  var COLORS = ['#2f6fed','#e0567a','#2fa96b','#8b5cf6','#e08a2f','#0ea5b7'];
  function mk(url,title,desc,saved){ var h=url.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
    return { id:Math.floor(Math.random()*1e9), url:url, title:title, description:desc, host:h, iconLetter:h.charAt(0).toUpperCase(), color:COLORS[0], saved:saved }; }
  // Example bookmarks preloaded ONLY to demonstrate searching (not a data decision).
  var items = [
    mk('https://developer.mozilla.org/en-US/docs/Web/CSS/grid','CSS grid layout · MDN','Complete reference for the CSS grid layout module with examples.','3 days ago'),
    mk('https://www.nytimes.com/2026/01/travel/kyoto-guide','A quiet guide to Kyoto · NYTimes','Where to walk, eat and stay away from the crowds in Kyoto.','2 weeks ago'),
    mk('https://arxiv.org/abs/2401.12345','Retrieval-augmented notes · arXiv','A paper on improving long-term retrieval of saved references.','1 month ago'),
    mk('https://news.ycombinator.com/item?id=39000000','Ask HN: how do you organise bookmarks?','A discussion thread on tools and habits for keeping links.','5 months ago'),
    mk('https://www.seriouseats.com/the-food-lab-roast-chicken','The best roast chicken · Serious Eats','A reliable weeknight method for crisp-skinned roast chicken.','8 months ago')
  ];
  var seedToRead=[false,true,true,false,false];
  var seedTags=[['css','reference','webdev'],['travel','japan'],['research','reading'],['discussion','bookmarks'],['recipe','cooking']];
  var seedNotes=['','Autumn trip — check the **temple** opening hours before going.',
    '### Why I saved this\nSkim **section 3** for the retrieval evaluation method.\n\nFollow-ups:\n- compare with my notes\n- email the [author page](https://arxiv.org/a/example)','',''];
  var seedAgoDays=[3,14,30,150,240];
  var NOW=Date.now();
  items.forEach(function(it,i){ it.color=COLORS[i%COLORS.length]; it.toRead=seedToRead[i]; it.archived=false; it.tags=seedTags[i]; it.notes=seedNotes[i]; it.ts=NOW - seedAgoDays[i]*864e5; it.updated=it.ts; });
  if(items[2]) items[2].updated = NOW - 1*864e5; // an old save edited recently, to show "Recently updated"
  var sortMode='added-desc';
  var selected={}, bulkTagMode=null, bulkConfirmDelete=false;
  var savedSearches=[ {id:1, name:'Recipes', query:'#recipe'}, {id:2, name:'Reference, not recipes', query:'#reference NOT #recipe'} ];
  var savingSearch=false;
  if(new URLSearchParams(location.search).get('state')==='empty'){ items=[]; }
  var statusFilter='all';
  function colorFor(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return COLORS[h%COLORS.length]; }
  function normalizeUrl(u){ return /^https?:\/\//i.test(u)? u : 'https://'+u; }
  function hostOf(u){ try{ return new URL(normalizeUrl(u)).hostname.replace(/^www\./,''); }catch(e){ return u; } }
  function keyOf(u){ // duplicate detection: host is case-insensitive (ignore www + trailing slash),
    try{ var x=new URL(normalizeUrl(u)); // but the path keeps its original capitalisation.
      var host=x.hostname.replace(/^www\./,'').toLowerCase();
      var path=(x.pathname+ (x.search||'')).replace(/\/$/,'');
      return host+path; }
    catch(e){ return u; }
  }

  // ---- simulated metadata fetch (a real app would read the actual page) ----
  function isValidUrl(raw){ try{ var u=new URL(normalizeUrl(raw)); return u.hostname.indexOf('.')>0 && !/\s/.test(u.hostname); }catch(e){ return false; } }
  function isPdf(url){ return /\.pdf($|[?#])/i.test(url); }
  function openOffline(it){ var w=window.open('','_blank'); if(!w) return;
    w.document.write('<html><head><title>Offline copy</title></head><body style="font-family:sans-serif;padding:40px;color:#1c2430">'
      +'<h2>Offline copy (simulated in prototype)</h2><h3>'+esc(it.title)+'</h3>'
      +'<p>Captured '+new Date(it.offline.at).toLocaleString()+'</p>'
      +'<p>In the real app this opens the saved '+(it.offline.type==='pdf'?'<b>PDF file</b>':'<b>single-page snapshot</b>')+' of:<br>'+esc(it.url)+'</p></body></html>');
    w.document.close();
  }
  function fetchMeta(url){
    var host = hostOf(url);
    if(/unreachable|\.invalid|broken/i.test(url)){
      return { failed:true, title:'', description:'', host:host, iconLetter:host.charAt(0).toUpperCase(), color:'#94a3b8' };
    }
    var seg='';
    try{ seg = decodeURIComponent(new URL(normalizeUrl(url)).pathname.split('/').filter(Boolean).pop()||''); }catch(e){}
    seg = seg.replace(/[-_]+/g,' ').replace(/\.\w+$/,'').trim();
    var pretty = seg ? seg.replace(/\b\w/g, function(c){return c.toUpperCase();}) : host;
    var siteName = host.split('.')[0].replace(/\b\w/g,function(c){return c.toUpperCase();});
    return {
      title: seg ? (pretty + ' · ' + siteName) : (siteName + ' — homepage'),
      description: 'A page on ' + host + '. This description is what the app pulled from the page so you can recognise it later.',
      host: host,
      iconLetter: host.charAt(0).toUpperCase(),
      color: colorFor(host)
    };
  }

  function esc(s){ return s.replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  var highlights = [];
  function hl(text){ var t=esc(text||''); if(!highlights.length) return t;
    var parts=highlights.filter(Boolean).map(function(h){ return h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
    if(!parts.length) return t;
    var rx=new RegExp('('+parts.join('|')+')','ig');
    return t.replace(rx,'<mark>$1</mark>');
  }
  // text of an entry that search looks through (notes/tags included once they exist)
  function textOf(it){ return (it.title+' '+it.description+' '+it.url+' '+(it.notes||'')+' '+((it.tags||[]).join(' '))).toLowerCase(); }

  // --- minimal, safe Markdown for notes (headings, lists, links, emphasis, code) ---
  function mdInline(s){
    s=s.replace(/`([^`]+)`/g, function(m,c){ return '<code>'+c+'</code>'; });
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m,t,u){ return /^(https?:|mailto:|\/)/i.test(u) ? '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>' : m; });
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
    s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/(^|[\s(])_([^_]+)_(?=[\s).,!?]|$)/g,'$1<em>$2</em>');
    return s;
  }
  function renderMarkdown(src){
    var lines=esc(src).split(/\r?\n/), html='', i=0;
    var isUL=function(l){return /^\s*[-*]\s+/.test(l);}, isOL=function(l){return /^\s*\d+\.\s+/.test(l);}, isH=function(l){return /^#{1,3}\s+/.test(l);};
    while(i<lines.length){ var line=lines[i];
      if(/^\s*$/.test(line)){ i++; continue; }
      var h=line.match(/^(#{1,3})\s+(.*)$/);
      if(h){ var lvl=Math.min(h[1].length+2,4); html+='<h'+lvl+'>'+mdInline(h[2])+'</h'+lvl+'>'; i++; continue; }
      if(isUL(line)){ html+='<ul>'; while(i<lines.length&&isUL(lines[i])){ html+='<li>'+mdInline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'; i++; } html+='</ul>'; continue; }
      if(isOL(line)){ html+='<ol>'; while(i<lines.length&&isOL(lines[i])){ html+='<li>'+mdInline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'; i++; } html+='</ol>'; continue; }
      var para=[]; while(i<lines.length&&!/^\s*$/.test(lines[i])&&!isH(lines[i])&&!isUL(lines[i])&&!isOL(lines[i])){ para.push(lines[i]); i++; }
      html+='<p>'+para.map(mdInline).join('<br>')+'</p>';
    }
    return html;
  }
  function highlightWithin(el){
    if(!highlights.length) return;
    var parts=highlights.filter(Boolean).map(function(h){return h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
    if(!parts.length) return;
    var rx=new RegExp('('+parts.join('|')+')','ig');
    var walker=document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){ if(n.parentNode.nodeName==='MARK') return; rx.lastIndex=0; if(!rx.test(n.nodeValue)) return;
      var span=document.createElement('span'); span.innerHTML=esc(n.nodeValue).replace(rx,'<mark>$1</mark>'); n.parentNode.replaceChild(span,n);
    });
  }

  // --- query language: "phrases", AND / OR / NOT, ( ), #tag; operators only when unquoted ---
  function tokenize(s){ var out=[], i=0, n=s.length;
    while(i<n){ var c=s[i];
      if(/\s/.test(c)){ i++; continue; }
      if(c==='('){ out.push({t:'LP'}); i++; continue; }
      if(c===')'){ out.push({t:'RP'}); i++; continue; }
      if(c==='"'){ var j=i+1, buf=''; while(j<n && s[j]!=='"'){ buf+=s[j]; j++; } i=(j<n)?j+1:j; out.push({t:'PHRASE', v:buf}); continue; }
      var w=''; while(i<n && !/\s/.test(s[i]) && s[i]!=='(' && s[i]!==')' && s[i]!=='"'){ w+=s[i]; i++; }
      var wu=w.toUpperCase();
      if(wu==='AND'||wu==='OR'||wu==='NOT') out.push({t:'OP', v:wu});
      else if(w.charAt(0)==='#' && w.length>1) out.push({t:'TAG', v:w});
      else out.push({t:'WORD', v:w});
    }
    return out;
  }
  function buildQuery(str){ var tokens=tokenize(str), pos=0, literals=[];
    function peek(){ return tokens[pos]; }
    function parseOr(){ var left=parseAnd(); while(peek()&&peek().t==='OP'&&peek().v==='OR'){ pos++; var r=parseAnd(), l=left; left=function(it){return l(it)||r(it);}; } return left; }
    function parseAnd(){ var left=parseNot(); while(peek() && !(peek().t==='OP'&&peek().v==='OR') && peek().t!=='RP'){ if(peek().t==='OP'&&peek().v==='AND') pos++; var r=parseNot(), l=left; left=function(it){return l(it)&&r(it);}; } return left; }
    function parseNot(){ if(peek()&&peek().t==='OP'&&peek().v==='NOT'){ pos++; var op=parseNot(); return function(it){return !op(it);}; } return parseTerm(); }
    function parseTerm(){ var tk=peek();
      if(!tk) return function(){return true;};
      if(tk.t==='LP'){ pos++; var e=parseOr(); if(peek()&&peek().t==='RP') pos++; return e; }
      if(tk.t==='RP'){ pos++; return function(){return true;}; }
      pos++;
      if(tk.t==='TAG'){ var tag=tk.v.slice(1).toLowerCase(); return function(it){ return (it.tags||[]).some(function(x){return x.toLowerCase()===tag;}); }; }
      var needle=(tk.v||'').toLowerCase(); if(needle) literals.push(needle);
      return function(it){ return needle==='' ? true : textOf(it).indexOf(needle)!==-1; };
    }
    var pred = tokens.length ? parseOr() : function(){return true;};
    return { pred:pred, literals:literals };
  }

  function selectedItems(){ return items.filter(function(it){ return selected[it.id]; }); }
  function pruneSelection(){ Object.keys(selected).forEach(function(id){ if(!items.some(function(x){return String(x.id)===id;})) delete selected[id]; }); }
  function bulkApply(fn){ selectedItems().forEach(function(it){ fn(it); it.updated=Date.now(); }); }
  function clearSelection(){ selected={}; bulkTagMode=null; }
  function buildBulkBar(visible){
    var bar=document.getElementById('bulkbar'); bar.className='bulkbar'; bar.innerHTML='';

    if(bulkConfirmDelete){

      var cn=document.createElement('button'); cn.textContent='Cancel'; cn.onclick=function(){ bulkConfirmDelete=false; render(); };
      var hint=document.createElement('span'); hint.className='scopehint'; hint.textContent='This cannot be undone — unlike Archive, which only hides them.';

    if(bulkTagMode==='add'){
      var lab=document.createElement('span'); lab.className='bcount'; lab.textContent='Add tag to '+count+' selected:';
      var inp=document.createElement('input'); inp.className='btag'; inp.placeholder='tag name';
      var ap=document.createElement('button'); ap.className='primary'; ap.textContent='Apply';

        bulkTagMode=null; render();
      }
      ap.onclick=doAdd; inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
      var cn2=document.createElement('button'); cn2.textContent='Cancel'; cn2.onclick=function(){ bulkTagMode=null; render(); };
      bar.appendChild(lab); bar.appendChild(inp); bar.appendChild(ap); bar.appendChild(cn2);
      setTimeout(function(){ inp.focus(); },0); return;
    }

      bar.appendChild(rlab);

    act('Mark to read',null,function(){ bulkApply(function(it){it.toRead=true;}); clearSelection(); render(); });
    act('Mark as read',null,function(){ bulkApply(function(it){it.toRead=false;}); clearSelection(); render(); });

    act('Clear','ghost',function(){ clearSelection(); render(); });

    var scoped = query.trim() || statusFilter!=='all';
    var hint=document.createElement('span'); hint.className='scopehint';
    hint.textContent = 'Actions apply to the '+count+' selected only'+(scoped ? ' — “Select all shown” covers just this '+(query.trim()?'search':'view')+', never your whole collection.' : '.');

    var inScope=items.filter(inView);

      if(sortMode==='title-desc') return b.title.toLowerCase().localeCompare(a.title.toLowerCase());

  function normTag(raw){ return raw.trim().replace(/^#/,'').toLowerCase().replace(/\s+/g,'-'); }
  function allTags(){ var set={}; items.forEach(function(it){ (it.tags||[]).forEach(function(t){ set[t]=1; }); }); return Object.keys(set).sort(); }
  function tagEditor(tags){
    var current=(tags||[]).slice();
    var w=document.createElement('div'); w.className='field';
    var l=document.createElement('label'); l.textContent='Tags';
    var box=document.createElement('div'); box.className='tagbox';
    var inp=document.createElement('input'); inp.type='text'; inp.placeholder='Add a tag, press Enter';
    var sug=document.createElement('div'); sug.className='suggest';
    function draw(){
      Array.prototype.slice.call(box.querySelectorAll('.chip')).forEach(function(c){ c.remove(); });
      current.forEach(function(t){
        var chip=document.createElement('span'); chip.className='chip'; chip.appendChild(document.createTextNode(t));
        var x=document.createElement('button'); x.type='button'; x.className='chipx'; x.textContent='×';
        x.onclick=function(){ current=current.filter(function(y){return y!==t;}); draw(); updateSug(); };
        chip.appendChild(x); box.insertBefore(chip, inp);
      });
    }
    function updateSug(){
      sug.innerHTML=''; var v=normTag(inp.value);
      if(!inp.value.trim()){ sug.style.display='none'; return; }
      var matches=allTags().filter(function(t){ return current.indexOf(t)===-1 && t.indexOf(v)!==-1; }).slice(0,8);
      if(!matches.length){ sug.style.display='none'; return; }
      sug.style.display='flex';
      var hint=document.createElement('span'); hint.className='sughint'; hint.textContent='Existing:'; sug.appendChild(hint);
      matches.forEach(function(t){ var s=document.createElement('button'); s.type='button'; s.className='sugtag'; s.textContent='#'+t;
        s.onclick=function(){ addTag(t); inp.focus(); }; sug.appendChild(s); });
    }
    function addTag(raw){ var t=normTag(raw); if(t && current.indexOf(t)===-1) current.push(t); inp.value=''; draw(); updateSug(); }
    inp.addEventListener('input', updateSug);
    inp.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===','){ e.preventDefault(); addTag(inp.value); }
      else if(e.key==='Backspace' && inp.value==='' && current.length){ current.pop(); draw(); updateSug(); }
    });
    box.appendChild(inp); draw();
    w.appendChild(l); w.appendChild(box); w.appendChild(sug);
    w.getTags=function(){ if(inp.value.trim()) addTag(inp.value); return current.slice(); };
    return w;
  }

    var right=document.createElement('div'); right.style.flex='1'; right.style.minWidth='0';

        toRead:cf.querySelector('.choice').getAttribute('data-value')==='1', archived:false, tags:tf.getTags(),

  var input=document.getElementById('urlInput'), btn=document.getElementById('saveBtn');

  document.getElementById('saveForm').addEventListener('submit', function(e){

      document.getElementById('dupnote').innerHTML='<div class="dupnote">That doesn’t look like a web address. Check the link and try again.</div>';

  });

  document.getElementById('searchInput').addEventListener('input', function(e){ query=e.target.value; clearSelection(); render(); });
  document.getElementById('sortSelect').addEventListener('change', function(e){ sortMode=e.target.value; render(); });
  document.getElementById('saveSearchBtn').addEventListener('click', function(){
    if(!query.trim()){ document.getElementById('dupnote').innerHTML='<div class="dupnote">Type a search (words and/or #tags, using NOT to exclude) first, then save it.</div>'; return; }
    document.getElementById('dupnote').innerHTML=''; savingSearch=true; renderSaved();
  });
  document.getElementById('segmented').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    statusFilter=b.getAttribute('data-f'); clearSelection();
    Array.prototype.forEach.call(this.children,function(x){ x.className = x===b ? 'active' : ''; });
    render();
  });

  render();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
