<!DOCTYPE html>
<html lang="en" data-text-size="medium">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>🔖 Bookmark Manager</h1>
    <form id="add-form" class="add-form">
      <input id="add-url" type="text" placeholder="Paste a URL to save…" autocomplete="off" required />
      <input id="add-title" type="text" placeholder="Title (optional)" autocomplete="off" />
      <button type="submit">Save</button>
    </form>
    <form id="search-form" class="search-form">
      <input id="search-input" type="search" placeholder='Search — try  react  "exact phrase"  #news  (a OR b) NOT old' autocomplete="off" />
      <button type="submit">Search</button>
      <button type="button" id="search-clear">Clear</button>
    </form>
  </header>

  <div class="app-body">
    <nav class="sidebar">
      <ul class="views">
        <li><button data-view="all" class="nav active">All</button></li>
        <li><button data-view="unread" class="nav">Unread</button></li>
        <li><button data-view="archive" class="nav">Archive</button></li>
      </ul>
      <div class="sidebar-section">
        <h3>Tags</h3>
        <ul id="tag-list" class="tag-list"></ul>
      </div>
      <div class="sidebar-section">
        <h3>Saved Views</h3>
        <ul id="saved-views" class="saved-views"></ul>
        <button id="save-view-btn" class="link-btn">＋ Save current view</button>
      </div>
      <div class="sidebar-section">
        <h3>Manage</h3>
        <button id="prefs-btn" class="link-btn">⚙ Preferences</button>
        <button id="export-btn" class="link-btn">⭳ Export</button>
        <button id="import-btn" class="link-btn">⭱ Import</button>
        <input id="import-file" type="file" accept=".html,text/html" hidden />
      </div>
    </nav>

    <main class="content">
      <div class="toolbar">
        <div class="toolbar-left">
          <label class="select-all"><input type="checkbox" id="select-all" /> Select all</label>
          <span id="result-summary" class="result-summary"></span>
        </div>
        <div class="toolbar-right">
          <label>Sort:
            <select id="sort-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="title">Title</option>
              <option value="recently_modified">Recently modified</option>
            </select>
          </label>
        </div>
      </div>

      <div id="bulk-bar" class="bulk-bar" hidden>
        <span id="bulk-count"></span>
        <input id="bulk-tags" type="text" placeholder="tag1, tag2" />
        <button data-bulk="addTags">Add tags</button>
        <button data-bulk="removeTags">Remove tags</button>
        <button data-bulk="markRead">Mark read</button>
        <button data-bulk="markUnread">Mark unread</button>
        <button data-bulk="archive">Archive</button>
        <button data-bulk="restore">Restore</button>
        <button data-bulk="delete" class="danger">Delete</button>
      </div>

      <div id="list" class="list" aria-live="polite"></div>
      <div id="empty" class="empty" hidden></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
