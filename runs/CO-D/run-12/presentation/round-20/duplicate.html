<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trove — Already saved</title>
  <style>
    :root{--ink:#17231e;--muted:#68736d;--paper:#f5f2e9;--card:#fffdf7;--line:#d9d5ca;--green:#235d45;--pale:#e0eee5}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 80% 10%,#dce8dd,transparent 30rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,sans-serif} button,input{font:inherit}
    .shell{width:min(1040px,calc(100% - 46px));margin:auto} header{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(23,35,30,.1)}
    .brand{display:flex;align-items:center;font-weight:750}.mark{width:34px;height:34px;margin-right:10px;display:grid;place-items:center;color:white;background:var(--green);border-radius:11px}.count{color:var(--muted);font-size:14px}
    main{padding:60px 0 100px} h1{margin:0;font:500 48px/1 Georgia,serif;letter-spacing:-.04em}.lead{margin:12px 0 34px;color:var(--muted);font-size:17px}
    .save-box{display:flex;gap:9px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 44px rgba(36,48,41,.09)}
    .save-box input{flex:1;min-width:0;padding:12px;border:0;outline:0;color:var(--ink);background:transparent}.save-box button{padding:12px 19px;border:0;border-radius:10px;color:white;background:var(--green);font-weight:720;cursor:pointer}
    .notice{display:none;margin-top:14px;padding:13px 15px;color:var(--green);background:var(--pale);border-radius:11px;font-size:14px;font-weight:650}.notice.visible{display:block;animation:rise .25s ease both}
    .collection{margin-top:58px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:17px}h2{margin:0;font:500 27px Georgia,serif}.section-head span{color:var(--muted);font-size:13px}
    .card{display:grid;grid-template-columns:70px 1fr auto;gap:17px;align-items:center;padding:19px;background:var(--card);border:1px solid var(--line);border-radius:17px;transition:.25s ease}
    .card.focused{border-color:#4d8a6c;background:#fbfffc;box-shadow:0 0 0 4px rgba(35,93,69,.12),0 14px 34px rgba(36,48,41,.09);transform:translateY(-2px)}
    .thumb{width:70px;height:70px;display:grid;place-items:center;border-radius:13px;background:#f1d9b7;font:30px Georgia,serif}.card h3{margin:0 0 5px;font-size:17px}.card p{margin:0 0 8px;color:var(--muted);font-size:13px}.domain{color:var(--green);font-size:12px;font-weight:700}.date{align-self:start;color:var(--muted);font-size:12px}
    @keyframes rise{from{opacity:0;transform:translateY(-5px)}} @media(max-width:650px){.save-box{flex-direction:column}.card{grid-template-columns:54px 1fr}.thumb{width:54px;height:54px}.date{display:none}}
  </style>
</head>
<body>
  <div class="shell" data-harness-ready="true">
    <header><div class="brand"><span class="mark">T</span>Trove</div><div class="count">1 saved link</div></header>
    <main>
      <h1>Keep the good things you find.</h1>
      <p class="lead">Paste an address and Trove will get it ready for you.</p>
      <form class="save-box" id="form"><input aria-label="Web address" value="https://www.seriouseats.com/how-to-make-perfect-risotto-recipe"><button>Get details</button></form>
      <div class="notice" id="notice" role="status">You already saved this link — here it is.</div>
      <section class="collection">
        <div class="section-head"><h2>Recently saved</h2><span>1 link</span></div>
        <article class="card" id="existing" tabindex="-1">
          <div class="thumb">R</div><div><h3>My perfect risotto guide</h3><p>A step-by-step guide to creamy, deeply flavorful risotto.</p><span class="domain">seriouseats.com</span></div><span class="date">Saved 3 days ago</span>
        </article>
      </section>
    </main>
  </div>
  <script>
    document.querySelector('#form').addEventListener('submit',(event)=>{
      event.preventDefault();
      const notice=document.querySelector('#notice');
      const existing=document.querySelector('#existing');
      notice.classList.add('visible');
      existing.classList.add('focused');
      existing.scrollIntoView({behavior:'smooth',block:'center'});
      existing.focus({preventScroll:true});
    });
  </script>
</body>
</html>
