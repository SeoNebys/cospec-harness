<!DOCTYPE html>

  .scope.show { display: block; } .scope a { color: #2f6fed; cursor: pointer; font-weight: 600; }

  .divider::before, .divider::after { content: ""; height: 1px; background: #e3e5e8; flex: 1; }
  .cardtools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }

  .tbtn.toread { color: #8a6d0b; border-color: #ecd98f; background: #fdf7e3; }

  .welcome { text-align: center; padding: 52px 20px; }

  .welcome .cta { background: #2f6fed; color: #fff; border: none; border-radius: 9px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }

  .filepick:hover { background: #f2f5f9; border-color: #a9c2f2; } .filepick .fname { color: #1a1a2e; font-weight: 600; margin-top: 8px; }

  .prog { font-size: 13px; color: #6b7280; }

  .actions button.primary { background: #2f6fed; color: #fff; border-color: #2f6fed; }
</style>

<body>
<header>
  <div class="topline">
    <h1>My Bookmarks</h1>
    <div class="hbtns"><button class="hbtn" id="importBtn">⇪ Import</button><button class="hbtn" id="exportBtn">⇩ Export / Back up</button></div>
  </div>
  <div class="savebar">
    <input class="url" id="urlInput" type="text" placeholder="Paste a link to save…" autocomplete="off">
    <label class="tr-toggle"><input type="checkbox" id="saveToRead"> 📖 To read</label>
    <button class="save" id="saveBtn">Save</button>
  </div>
  <div class="saveerr" id="saveerr"></div>
</header>

<main>
  <div class="backup" id="backup">
    <span id="backupMsg">You've made changes since your last backup. Your bookmarks live in this browser — save a copy to be safe.</span>
    <span><button id="backupNow">⇩ Back up now</button> <button class="later" id="backupLater">later</button></span>
  </div>
  <div class="searchrow"><span class="mag">⌕</span><input id="searchInput" type="text" placeholder="Search everything you saved…" autocomplete="off"></div>
  <div class="help">Type loose words · <code>"exact phrase"</code> · <code>coffee or tea</code> · <code>not sourdough</code> · a little word like <code>"or"</code> in quotes is literal.</div>
  <div class="scope" id="scope"></div>
  <div class="views" id="views"></div>
  <div class="labelbar" id="labelbar"></div>
  <div class="interp" id="interp"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<div class="modal" id="importModal"><div class="sheet">
  <h3>Bring in your existing bookmarks</h3>
  <div class="in" id="importIn"></div>
  <div class="actions" id="importActions"></div>
</div></div>

<input type="file" id="fileInput" accept=".html,.htm,.json" style="display:none">
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- tiny IndexedDB store (durable, on this device) ---------- */
const DB = (() => {
  let dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('mybookmarks', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  function tx(store, mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    }));
  }
  return {
    all: () => tx('items', 'readonly', s => s.getAll()),
    put: (v) => tx('items', 'readwrite', s => s.put(v)),
    del: (id) => tx('items', 'readwrite', s => s.delete(id)),
    putMany: (vs) => tx('items', 'readwrite', s => { vs.forEach(v => s.put(v)); return true; }),
    metaGet: (k) => tx('meta', 'readonly', s => s.get(k)),
    metaPut: (k, val) => tx('meta', 'readwrite', s => s.put({ k, val })),
  };
})();

/* ---------- url helpers ---------- */
function looksLikeUrl(raw) {
  if (raw == null) return null;
  let s = String(raw).trim(); if (!s || /\s/.test(s)) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try { const u = new URL(s); if (!u.hostname.includes('.')) return null; return u.href; } catch { return null; }
}
function normUrl(raw) { let s = String(raw || '').trim().toLowerCase(); s = s.replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/+$/, ''); return s; }
function guessTitle(url) {
  try {
    const u = new URL(url);
    const seg = u.pathname.split('/').filter(Boolean).pop();
    if (seg && !/^\d+$/.test(seg)) {
      const words = decodeURIComponent(seg).replace(/\.[a-z0-9]{1,5}$/i, '').replace(/[-_+]/g, ' ').trim();
      if (words) return words.replace(/\b\w/g, c => c.toUpperCase());
    }
    return u.hostname.replace(/^www\./, '');
  } catch { return ''; }
}

/* ---------- search (ranking, loose multi-word, operators) ---------- */
const WEIGHTS = { title: 100, summary: 40, labels: 40, url: 20 };
const STRONG = new Set(['title', 'summary', 'labels']);
const EXCLUDE = new Set(['not', 'without', 'except']);
function fieldsOf(b) { return { title: b.title || '', summary: b.summary || '', labels: (b.labels || []).join(' '), url: b.url || '' }; }
function parseQuery(q) {
  const raw = String(q || '').match(/-?"[^"]*"|\S+/g) || [];
  const groups = [], negs = []; let pOr = false, pNeg = false;
  for (const r0 of raw) {
    let r = r0, neg = false, phrase = false;
    if (r[0] === '-') { neg = true; r = r.slice(1); }
    if (r[0] === '"') { phrase = true; r = r.replace(/^"|"$/g, ''); }
    const text = r.toLowerCase().trim(); if (!text) continue;
    if (!phrase && !neg) { if (text === 'or' && groups.length) { pOr = true; continue; } if (text === 'and') continue; if (EXCLUDE.has(text)) { pNeg = true; continue; } }
    if (neg || pNeg) { negs.push({ text }); pNeg = false; continue; }
    const tok = { text, phrase };
    if (pOr && groups.length) { groups[groups.length - 1].push(tok); pOr = false; } else groups.push([tok]);
  }
  return { groups, negs };
}
function scoreRecord(b, parsed) {
  const f = fieldsOf(b); const flat = Object.values(f).join('   ').toLowerCase();
  for (const n of parsed.negs) if (flat.includes(n.text)) return null;
  let total = 0; const why = [];
  for (const grp of parsed.groups) {
    let best = 0, bf = null, bt = null;
    for (const alt of grp) for (const k in f) if (f[k].toLowerCase().includes(alt.text)) if (WEIGHTS[k] > best) { best = WEIGHTS[k]; bf = k; bt = alt.text; }
    if (best === 0) return null;
    total += best; why.push({ term: bt, field: bf });
  }
  return { total, why, strong: why.some(w => STRONG.has(w.field)) };
}
function describe(parsed) {
  const chips = [];
  for (const g of parsed.groups) { if (g.length > 1) chips.push({ kind: 'either', text: g.map(t => t.text).join(' / ') }); else if (g[0].phrase) chips.push({ kind: 'phrase', text: g[0].text }); else chips.push({ kind: 'word', text: g[0].text }); }
  for (const n of parsed.negs) chips.push({ kind: 'without', text: n.text });
  return { chips, special: parsed.groups.some(g => g.length > 1 || g[0].phrase) || parsed.negs.length > 0 };
}

/* ---------- import parsing (browser bookmarks HTML + our own JSON) ---------- */
function decodeEnt(s) { return String(s).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'"); }
function parseNetscape(html) {
  const items = [], stack = [];
  const re = /<h3[^>]*>([\s\S]*?)<\/h3>|<\/dl>|<a\s+([^>]*)>([\s\S]*?)<\/a>/gi; let m;
  while ((m = re.exec(html)) !== null) {
    if (m[1] !== undefined) stack.push(decodeEnt(m[1].replace(/<[^>]+>/g, '')).trim());
    else if (/^<\/dl>/i.test(m[0])) { if (stack.length) stack.pop(); }
    else if (m[2] !== undefined) {
      const href = (m[2].match(/href\s*=\s*"([^"]*)"/i) || [])[1];
      if (!href || /^(javascript|place):/i.test(href)) continue;
      const add = (m[2].match(/add_date\s*=\s*"([^"]*)"/i) || [])[1];
      let date = null; if (add) { const secs = parseInt(add, 10); if (secs > 0) { const ms = secs > 1e12 ? secs : secs * 1000; const d = new Date(ms); if (!isNaN(d)) date = d.toISOString(); } }
      items.push({ title: decodeEnt(m[3].replace(/<[^>]+>/g, '')).trim(), url: decodeEnt(href), folder: stack.length ? stack.join('/') : null, date });
    }
  }
  return items;
}
function foldersToLabels(f) { return f ? f.split('/').map(s => s.trim().toLowerCase()).filter(Boolean) : []; }
function parseFile(text) {
  try { const o = JSON.parse(text); if (o && Array.isArray(o.bookmarks)) return { kind: 'own', items: o.bookmarks }; } catch {}
  return { kind: 'netscape', items: parseNetscape(text) };
}

/* ---------- app state ---------- */
let bookmarks = [];
const state = { view: 'all', label: null, query: '' };
let editingId = null, draftLabels = [], justSavedId = null, flashId = null, lastDeleted = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function highlight(t, terms) { let s = esc(t); (terms || []).forEach(x => { if (!x) return; const re = new RegExp('(' + x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); s = s.replace(re, '<mark>$1</mark>'); }); return s; }
function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : 'saved ' + d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); }
function uid() { return 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---------- backup nudge ---------- */
let changes = 0;
async function loadChanges() { const m = await DB.metaGet('changes'); changes = (m && m.val) || 0; refreshBackup(); }
function bumpChanges(n) { changes += (n || 1); DB.metaPut('changes', changes); refreshBackup(); }
function refreshBackup() {
  const show = bookmarks.length > 0 && changes >= 8;
  $('backup').classList.toggle('show', show);
}

/* ---------- rendering ---------- */
const active = () => bookmarks.filter(b => !b.archived);
function counts() { const a = active(); return { all: a.length, toread: a.filter(b => b.unread).length, archived: bookmarks.filter(b => b.archived).length }; }
function labelList() { const s = new Set(); active().forEach(b => (b.labels || []).forEach(l => s.add(l))); return [...s].sort(); }
function scopedPool() {
  let pool = state.view === 'archived' ? bookmarks.filter(b => b.archived) : active();
  if (state.view === 'toread') pool = pool.filter(b => b.unread);
  if (state.view !== 'archived' && state.label) pool = pool.filter(b => (b.labels || []).includes(state.label));
  return pool;
}
function currentResults() {
  const pool = scopedPool();
  if (!state.query.trim()) {
    const items = pool.slice().sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
    return { searching: false, items: items.map(b => ({ b })) };
  }
  const parsed = parseQuery(state.query);
  const scored = [];
  for (const b of pool) { const s = scoreRecord(b, parsed); if (s) scored.push({ b, ...s }); }
  scored.sort((a, b) => (b.total - a.total) || String(b.b.savedAt).localeCompare(String(a.b.savedAt)));
  return { searching: true, parsed, items: scored };
}
function render() {
  const c = counts();
  $('views').innerHTML =
    `<span class="view ${state.view === 'all' ? 'active' : ''}" data-view="all">All bookmarks <span class="n">${c.all}</span></span>` +
    `<span class="view toread ${state.view === 'toread' ? 'active' : ''}" data-view="toread">📖 To read <span class="n">${c.toread}</span></span>` +
    `<span class="view archived ${state.view === 'archived' ? 'active' : ''}" data-view="archived">🗄 Archived <span class="n">${c.archived}</span></span>`;
  const labels = labelList();
  $('labelbar').innerHTML = (state.view === 'archived' || !labels.length) ? '' :
    `<span class="lead">Labels:</span><span class="pill ${state.label === null ? 'active' : ''}" data-label="__all">All</span>` +
    labels.map(l => `<span class="pill ${state.label === l ? 'active' : ''}" data-label="${esc(l)}">${esc(l)}</span>`).join('');
  const res = currentResults();
  // scope bar
  const parts = [];
  if (state.view === 'toread') parts.push('your 📖 To read pile');
  if (state.view === 'archived') parts.push('your 🗄 Archive');
  if (state.label) parts.push('label “' + esc(state.label) + '”');
  if (state.query.trim() && parts.length) { $('scope').classList.add('show'); $('scope').innerHTML = `Searching within ${parts.join(' · ')}. <a id="searchAll">Search all bookmarks instead →</a>`; } else $('scope').classList.remove('show');
  // interpretation
  if (res.searching) { const d = describe(res.parsed); $('interp').innerHTML = d.special ? `<span class="lab">Reading your search as:</span>` + d.chips.map(ch => ch.kind === 'either' ? `<span class="icap either">either: ${esc(ch.text)}</span>` : ch.kind === 'phrase' ? `<span class="icap phrase">exact phrase: “${esc(ch.text)}”</span>` : ch.kind === 'without' ? `<span class="icap without">without: ${esc(ch.text)}</span>` : `<span class="icap word">${esc(ch.text)}</span>`).join('') : ''; } else $('interp').innerHTML = '';
  // list
  const terms = res.searching ? termsOf(res.parsed) : [];
  if (!res.searching && state.view === 'all' && !state.label && bookmarks.length === 0) {
    $('count').textContent = '';
    $('list').innerHTML = `<div class="welcome"><div class="big">🔖</div><h2>Your bookmarks live here</h2>
      <p>Coming from a messy browser pile? <b>Move it all in at once</b> — every link, with its date and your folders turned into labels. Or paste a link up top whenever you find one.</p>
      <button class="cta" id="welcomeImport">⇪ Import my existing bookmarks</button>
      <span class="alt">everything stays private, in this browser — and you can Export a backup anytime</span></div>`;
    $('welcomeImport').onclick = openImport; return;
  }
  if (res.items.length === 0) {
    $('count').textContent = '';
    $('list').innerHTML = `<div class="empty">${res.searching ? 'Nothing matched your search here.' : state.view === 'toread' ? 'Your to-read pile is empty — nothing left to get to. 🎉' : state.view === 'archived' ? 'Nothing archived.' : 'Nothing here yet.'}</div>`; return;
  }
  $('count').textContent = res.searching ? `${res.items.length} match${state.view !== 'all' || state.label ? ' in this group' : ''}, best first` : `${c.all} saved`;
  let weak = false;
  $('list').innerHTML = res.items.map((r, i) => {
    let pre = '';
    if (res.searching && !r.strong && !weak && i > 0) { weak = true; pre = '<div class="divider">matched only where your words appear — further down on purpose</div>'; }
    return pre + card(r, terms, res.searching, i);
  }).join('');
}
function termsOf(parsed) { const s = new Set(); parsed.groups.forEach(g => g.forEach(t => s.add(t.text))); return [...s]; }
function card(r, terms, searching, idx) {
  const b = r.b;
  if (b.id === editingId) return editCard(b);
  const needsInfo = !b.title;
  const cls = needsInfo ? 'needsinfo' : b.unread ? 'toread' : b.archived ? 'archived' : '';
  const badges = (b.unread ? '<span class="badge tr">📖 To read</span>' : '') + (b.archived ? '<span class="badge ar">🗄 Archived</span>' : '') + (needsInfo ? '<span class="badge red">needs a title</span>' : '');
  const status = b.unread ? `<button class="tbtn markread" data-act="markread">✓ Mark as read</button>` : `<button class="tbtn toread" data-act="toread">📖 To read</button>`;
  const tools = b.archived ? `<button class="tbtn restore" data-act="restore">⤺ Restore</button><button class="tbtn" data-act="edit">Edit</button>` : `${status}<button class="tbtn" data-act="archive">🗄 Archive</button><button class="tbtn" data-act="edit">Edit</button>`;
  const why = (searching && r.why) ? r.why.map(w => { const label = w.field === 'title' ? 'in title' : w.field === 'summary' ? 'in your notes' : w.field === 'labels' ? 'in label' : 'in link'; return `<span class="hit ${STRONG.has(w.field) ? 'strong' : 'bodyhit'}">“${esc(w.term)}” ${label}</span>`; }).join('') : '';
  return `<div class="card ${cls} ${b.id === flashId ? 'flash' : ''}" data-id="${b.id}">
    ${searching ? `<div class="rankno">${idx + 1}</div>` : ''}
    <div class="thumb clickable" data-act="open">🔗</div>
    <div class="cardtools">${tools}</div>
    <div class="body">
      <div class="clickable" data-act="open">
        <div class="titlerow">${badges}<div class="title ${b.title ? '' : 'untitled'}">${b.title ? highlight(b.title, terms) : 'Untitled — add a title'}</div></div>
        <div class="url">${esc(b.url)}</div>
        <div class="meta">${fmtDate(b.savedAt)}</div>
        ${b.summary ? `<div class="desc">${highlight(b.summary, terms)}</div>` : ''}
        <div class="why">${why}</div>
      </div>
      <div class="tags">${(b.labels || []).map(t => `<span class="tag ${state.label === t ? 'on' : ''}" data-act="filter" data-label="${esc(t)}">${esc(t)}</span>`).join('')}</div>
    </div></div>`;
}
function editCard(b) {
  const chips = draftLabels.map((t, i) => `<span class="chip">${esc(t)}<button data-act="untag" data-i="${i}">×</button></span>`).join('');
  const note = b.id === justSavedId ? '<p class="savenote">Saved. I guessed a title from the link — please check it, add a note or labels, then Save.</p>' : '';
  return `<div class="card" data-id="${b.id}"><div class="thumb">🔗</div>
    <div class="body"><div class="edit-form">${note}
      <div class="lbl">Title</div><input class="e-title" type="text" value="${esc(b.title)}" placeholder="A title you'll recognise">
      <div class="lbl">Web address</div><input class="e-url" type="text" value="${esc(b.url)}">
      <div class="lbl">Notes / summary (searchable)</div><textarea class="e-desc" placeholder="Anything you'll want to search by later">${esc(b.summary)}</textarea>
      <div class="lbl">Labels</div><div class="chipbox" data-act="focustag">${chips}<input class="e-tag" type="text" placeholder="Type a label, press Enter…"></div>
      <div class="edit-actions"><button class="save" data-act="commit">Save changes</button><button class="cancel" data-act="cancel">Cancel</button><button class="delete" data-act="delete">Delete forever</button></div>
    </div></div></div>`;
}
const byId = id => bookmarks.find(b => b.id === id);

/* ---------- persistence-backed operations ---------- */
async function persist(b) { await DB.put(JSON.parse(JSON.stringify(b))); }
function toast(msg, undo) { const t = $('toast'); t.innerHTML = esc(msg) + (undo ? ' <button id="undoBtn">Undo</button>' : ''); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), undo ? 6000 : 2600); if (undo) $('undoBtn').onclick = () => { t.classList.remove('show'); undo(); }; }

async function saveNew() {
  const raw = $('urlInput').value.trim(); if (!raw) return;
  const url = looksLikeUrl(raw);
  if (!url) { $('saveerr').textContent = "That doesn't look like a web address — check it and try again."; $('urlInput').classList.add('err'); return; }
  $('saveerr').textContent = ''; $('urlInput').classList.remove('err');
  const existing = bookmarks.find(b => normUrl(b.url) === normUrl(url));
  $('urlInput').value = ''; const unread = $('saveToRead').checked; $('saveToRead').checked = false;
  $('searchInput').value = ''; state.query = ''; state.label = null; state.view = 'all';
  if (existing) { flashId = existing.id; render(); const el = document.querySelector(`[data-id="${existing.id}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast('You already saved this — here it is.'); return; }
  const b = { id: uid(), url, title: guessTitle(url), summary: '', labels: [], unread, archived: false, savedAt: new Date().toISOString() };
  bookmarks.push(b); await persist(b); bumpChanges();
  editingId = b.id; justSavedId = b.id; draftLabels = [];
  render(); const el = document.querySelector(`[data-id="${b.id}"] .e-title`); if (el) { el.focus(); el.select(); }
  toast(unread ? 'Saved to your to-read pile' : 'Saved');
}

/* ---------- import ---------- */
let pickedText = null, pickedName = '';
function openImport() { pickedText = null; pickedName = ''; stepPick(); $('importModal').classList.add('show'); }
function stepPick() {
  $('importIn').innerHTML = `<p>In your browser, export your bookmarks to a file, then choose it here. (You can also load a backup file you exported from this app.)</p>
    <div class="filepick" id="filepick">📄 Click to choose your bookmarks file<div class="fname" id="fname" style="display:none"></div></div>
    <label class="foldopt"><input type="checkbox" id="foldChk" checked><span>Turn my browser folders into labels (rename or drop them later)</span></label>`;
  $('importActions').innerHTML = `<button id="impCancel">Cancel</button><button class="primary" id="impStart" disabled style="opacity:.5">Import</button>`;
  $('filepick').onclick = () => $('fileInput').click();
  $('impCancel').onclick = () => $('importModal').classList.remove('show');
  $('impStart').onclick = () => { if (pickedText != null) runImport($('foldChk').checked); };
}
$('fileInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  pickedText = await f.text(); pickedName = f.name;
  const fn = $('fname'); if (fn) { fn.style.display = 'block'; fn.textContent = 'Selected: ' + pickedName; }
  const s = $('impStart'); if (s) { s.disabled = false; s.style.opacity = '1'; }
});
async function runImport(foldersAsLabels) {
  const parsed = parseFile(pickedText);
  const total = parsed.items.length;
  $('importIn').innerHTML = `<p>Bringing your bookmarks in, keeping each one's original date…</p><div class="bar"><span id="barfill"></span></div><div class="prog" id="prog">Starting…</div>`;
  $('importActions').innerHTML = '';
  const seen = new Set(bookmarks.map(b => normUrl(b.url)));
  let added = 0, dups = 0, i = 0; const toStore = [];
  function chunk() {
    const end = Math.min(i + 25, total);
    for (; i < end; i++) {
      const it = parsed.items[i]; const url = looksLikeUrl(it.url); if (!url) continue;
      const key = normUrl(url); if (seen.has(key)) { dups++; continue; } seen.add(key);
      let b;
      if (parsed.kind === 'own') { b = Object.assign({ id: uid(), url, title: '', summary: '', labels: [], unread: false, archived: false, savedAt: new Date().toISOString() }, it, { id: uid(), url }); b.labels = Array.isArray(b.labels) ? b.labels : []; }
      else { b = { id: uid(), url, title: it.title || guessTitle(url), summary: '', labels: foldersAsLabels ? foldersToLabels(it.folder) : [], unread: false, archived: false, savedAt: it.date || new Date().toISOString() }; }
      bookmarks.push(b); toStore.push(b); added++;
    }
    $('barfill').style.width = Math.round(i / Math.max(total,1) * 100) + '%';
    $('prog').textContent = `Importing ${i} of ${total}…`;
    if (i < total) setTimeout(chunk, 40); else finish();
  }
  async function finish() {
    await DB.putMany(toStore); bumpChanges(added);
    $('importIn').innerHTML = `<div class="summary">✓ Moved in! <b>${added}</b> bookmarks brought across.<br>
      • Kept each one's <b>original saved date</b>, so your history is intact and newest-first means something.<br>
      ${parsed.kind !== 'own' ? '• Your folders became labels you can rename or drop.<br>' : ''}
      ${dups ? `• Skipped <b>${dups}</b> you already had — no duplicates piled up.<br>` : ''}
      <span class="note">Note: this version doesn't keep readable copies of the pages (that arrives with the installed version). Opening a bookmark takes you to the live page.</span></div>`;
    $('importActions').innerHTML = `<button class="primary" id="impDone">See my bookmarks</button>`;
    $('impDone').onclick = () => { $('importModal').classList.remove('show'); state.view = 'all'; state.label = null; state.query = ''; $('searchInput').value = ''; render(); toast('Welcome in — history and all.'); };
  }
  setTimeout(chunk, 150);
}

/* ---------- export / backup ---------- */
function exportAll() {
  const data = { app: 'bookmarks-app', version: 1, exportedAt: new Date().toISOString(),
    bookmarks: bookmarks.map(b => ({ url: b.url, title: b.title, summary: b.summary, labels: b.labels, unread: b.unread, archived: b.archived, savedAt: b.savedAt })) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const d = new Date().toISOString().slice(0, 10);
  a.download = `my-bookmarks-backup-${d}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  changes = 0; DB.metaPut('changes', 0); refreshBackup();
  toast('Backup saved — a file with everything, kept wherever you like.');
}
$('exportBtn').onclick = exportAll;
$('backupNow').onclick = exportAll;
$('backupLater').onclick = () => $('backup').classList.remove('show');

/* ---------- events ---------- */
$('saveBtn').onclick = saveNew;
$('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveNew(); });
$('urlInput').addEventListener('input', () => { $('saveerr').textContent = ''; $('urlInput').classList.remove('err'); });
$('importBtn').onclick = openImport;
let searchTimer = null;
$('searchInput').addEventListener('input', e => { state.query = e.target.value; editingId = null; clearTimeout(searchTimer); searchTimer = setTimeout(render, 180); });
$('views').addEventListener('click', e => { const v = e.target.closest('[data-view]'); if (!v) return; state.view = v.dataset.view; state.label = null; editingId = null; render(); });
$('labelbar').addEventListener('click', e => { const p = e.target.closest('[data-label]'); if (!p) return; const l = p.dataset.label; state.label = (l === '__all') ? null : (state.label === l ? null : l); editingId = null; render(); });
$('scope').addEventListener('click', e => { if (e.target.id === 'searchAll') { state.view = 'all'; state.label = null; render(); } });
function addDraftTag(raw) { const t = String(raw).trim().replace(/,$/, '').trim(); if (t && !draftLabels.includes(t)) draftLabels.push(t); }
$('list').addEventListener('keydown', e => {
  if (e.target.classList.contains('e-tag') && (e.key === 'Enter' || e.key === ',')) {
    e.preventDefault(); addDraftTag(e.target.value); e.target.value = '';
    const card = e.target.closest('.card'); const b = byId(editingId);
    const cur = { ...b, title: card.querySelector('.e-title').value, url: card.querySelector('.e-url').value, summary: card.querySelector('.e-desc').value };
    card.outerHTML = editCard(cur); const inp = document.querySelector('.e-tag'); if (inp) inp.focus();
  }
});
$('list').addEventListener('click', async e => {
  const w = e.target.closest('#welcomeImport'); if (w) return;
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id; const b = byId(id); const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'open') { if (b) window.open(b.url, '_blank', 'noopener'); return; }
  if (act === 'filter') { const l = e.target.dataset.label; state.label = (state.label === l ? null : l); editingId = null; return render(); }
  if (act === 'edit') { editingId = id; justSavedId = null; draftLabels = [...(b.labels || [])]; render(); const t = document.querySelector(`[data-id="${id}"] .e-title`); if (t) t.focus(); return; }
  if (act === 'cancel') { editingId = null; justSavedId = null; return render(); }
  if (act === 'untag') { draftLabels.splice(Number(e.target.dataset.i), 1); const cur = { ...b, title: card.querySelector('.e-title').value, url: card.querySelector('.e-url').value, summary: card.querySelector('.e-desc').value }; card.outerHTML = editCard(cur); const inp = document.querySelector('.e-tag'); if (inp) inp.focus(); return; }
  if (act === 'focustag') { if (e.target.classList.contains('chipbox')) { const inp = card.querySelector('.e-tag'); if (inp) inp.focus(); } return; }
  if (act === 'toread') { b.unread = true; await persist(b); bumpChanges(); flashId = id; render(); toast('Added to your to-read pile'); return; }
  if (act === 'markread') { b.unread = false; await persist(b); bumpChanges(); render(); toast('Nice — checked off as read', async () => { b.unread = true; await persist(b); render(); }); return; }
  if (act === 'archive') { b.archived = true; await persist(b); bumpChanges(); render(); toast('Tucked away in your archive', async () => { b.archived = false; await persist(b); render(); }); return; }
  if (act === 'restore') { b.archived = false; await persist(b); bumpChanges(); render(); toast('Back in your bookmarks', async () => { b.archived = true; await persist(b); render(); }); return; }
  if (act === 'commit') {
    addDraftTag(card.querySelector('.e-tag').value);
    b.title = card.querySelector('.e-title').value.trim();
    const u = looksLikeUrl(card.querySelector('.e-url').value); if (u) b.url = u;
    b.summary = card.querySelector('.e-desc').value.trim();
    b.labels = [...new Set(draftLabels)];
    await persist(b); bumpChanges(); editingId = null; justSavedId = null; flashId = id; render(); toast('Updated'); return;
  }
  if (act === 'delete') {
    const idx = bookmarks.findIndex(x => x.id === id); lastDeleted = bookmarks[idx];
    bookmarks.splice(idx, 1); await DB.del(id); bumpChanges(); editingId = null; justSavedId = null; render();
    toast('Deleted for good', async () => { bookmarks.splice(Math.min(idx, bookmarks.length), 0, lastDeleted); await persist(lastDeleted); flashId = lastDeleted.id; render(); });
    return;
  }
});

/* ---------- start up ---------- */
(async function start() {
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
  try { bookmarks = (await DB.all()) || []; } catch (e) { bookmarks = []; }
  await loadChanges();
  render();
})();
</script>
</body>
</html>
