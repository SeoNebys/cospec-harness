<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — Folders</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 860px; margin: 0 auto; padding: 32px 20px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .variant { font-size: 12px; color: #2563eb; margin: 0 0 20px; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 180px 1fr; gap: 20px; }
  .folders { list-style: none; padding: 0; margin: 0; }
  .folders li { padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 3px; color: #333; }
  .folders li:hover { background: #eef2ff; }
  .folders li.active { background: #2563eb; color: #fff; font-weight: 600; }
  .folders li .n { float: right; opacity: 0.6; font-size: 12px; }
  .count { font-size: 12px; color: #888; margin: 0 0 10px; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  ul.list li .title { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  ul.list li .folder-tag { display: inline-block; font-size: 11px; background: #eef2ff; color: #4338ca; padding: 1px 8px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
  ul.list li a { color: #2563eb; text-decoration: none; font-size: 13px; word-break: break-all; }
</style>
</head>
<body>
  <h1>📑 My Bookmarks</h1>
  <p class="variant">Version “Folders” — each bookmark lives in exactly one folder</p>
  <div class="layout">
    <ul class="folders" id="folders"></ul>
    <div>
      <p class="count" id="count"></p>
      <ul class="list" id="list"></ul>
    </div>
  </div>

  <script>
    const DATA = [
      { title: 'Bookmark - Wikipedia', url: 'https://en.wikipedia.org/wiki/Bookmark', folder: 'Reference' },
      { title: 'World News - The New York Times', url: 'https://www.nytimes.com/section/world', folder: 'News' },
      { title: 'Classic Banana Bread Recipe', url: 'https://www.seriouseats.com/banana-bread', folder: 'Cooking' },
      { title: 'torvalds/linux - GitHub', url: 'https://github.com/torvalds/linux', folder: 'Tech' },
      { title: 'How to Prune Tomatoes - YouTube', url: 'https://www.youtube.com/watch?v=abc', folder: 'Cooking' },
      { title: 'Technology - BBC News', url: 'https://www.bbc.com/news/technology', folder: 'News' },
    ];
    let active = 'All';
    function folders() {
      const map = {}; DATA.forEach(d => map[d.folder] = (map[d.folder]||0)+1);
      return [['All', DATA.length], ...Object.entries(map)];
    }
    function renderFolders() {
      const ul = document.getElementById('folders');
      ul.innerHTML = '';
      folders().forEach(([name, n]) => {
        const li = document.createElement('li');
        li.textContent = name;
        const s = document.createElement('span'); s.className = 'n'; s.textContent = n; li.appendChild(s);
        if (name === active) li.className = 'active';
        li.onclick = () => { active = name; render(); };
        ul.appendChild(li);
      });
    }
    function render() {
      renderFolders();
      const items = active === 'All' ? DATA : DATA.filter(d => d.folder === active);
      document.getElementById('count').textContent = items.length + (items.length===1?' bookmark':' bookmarks') + (active!=='All'? ' in ' + active : '');
      const list = document.getElementById('list'); list.innerHTML = '';
      items.forEach(it => {
        const li = document.createElement('li');
        li.innerHTML = '<div class="title">' + it.title + '<span class="folder-tag">' + it.folder + '</span></div>' +
          '<a href="' + it.url + '" target="_blank">' + it.url + '</a>';
        list.appendChild(li);
      });
    }
    render();
  </script>
</body>
</html>
