<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — Duplicate Option A</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="mode">Duplicate Option A · Show a notice and jump to the existing bookmark</div>
  <p>If you paste a link you've already saved, it isn't added again — you're pointed to the one you have.</p>
</header>
<main>
  <div class="saver">
    <label for="url">Paste a link to save</label>
    <div class="saver-row">
      <input id="url" type="url" placeholder="https://…" autocomplete="off" />
      <button id="saveBtn" class="btn">Save</button>
    </div>
    <div class="hint">Two links are already saved: the NASA and the ramen pages.</div>
  </div>
  <div id="stage"></div>
  <p class="section-title">Saved</p>
  <div id="list"></div>
  <div id="empty" class="empty">Nothing saved yet.</div>
</main>
<script>window.DUP_MODE = "notice";</script>
<script src="dup.js"></script>
</body>
</html>
