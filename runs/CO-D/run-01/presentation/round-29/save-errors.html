<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keep — Save errors</title><style>:root{--ink:#14251d;--muted:#68736e;--line:#dfe6e2;--brand:#176b4b;--danger:#b0443b}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui;color:var(--ink);background:#f2f5f2}button,input,textarea{font:inherit}.shell{max-width:960px;min-height:100vh;margin:auto;background:#fbfcfa}.head{height:74px;padding:20px 38px;border-bottom:1px solid var(--line);font-size:19px;font-weight:760}.mark{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;color:#fff;background:var(--brand);border-radius:10px 10px 10px 3px}main{max-width:720px;margin:auto;padding:60px 28px}h1{margin:0;font-size:30px}.lead{margin:7px 0 24px;color:var(--muted)}.capture{display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff}.capture.invalid{border-color:#d98e88;box-shadow:0 0 0 3px #f8e5e3}.capture input{flex:1;padding:10px;border:0;outline:0}.capture button,.primary{padding:10px 16px;border:0;border-radius:9px;color:#fff;background:var(--brand);font-weight:700;cursor:pointer}.error{display:none;margin:7px 4px;color:var(--danger);font-size:13px}.error.show{display:block}dialog{width:min(540px,calc(100% - 32px));border:0;border-radius:20px;padding:26px;color:var(--ink);box-shadow:0 24px 80px #12281d47}dialog::backdrop{background:#11231a6b}dialog h2{margin:0}.warning{margin:12px 0 19px;padding:10px 12px;border-radius:9px;color:#76552b;background:#fff6df}label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px;font-weight:700}.field{width:100%;padding:10px;border:1px solid #cad6cf;border-radius:9px}.url{margin-top:12px;color:var(--muted);font-size:12px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{padding:10px 14px;border:0;border-radius:9px;background:#edf1ee;font-weight:700}</style></head><body><div class="shell" data-harness-ready="true"><div class="head"><span class="mark">↗</span>Keep</div><main><h1>Add a bookmark</h1><p class="lead">Paste a web address and Keep will fill in the useful details.</p><form class="capture" id="form" novalidate><input id="url" placeholder="Paste a web address…"><button>Add link</button></form><div class="error" id="error">Enter a complete web address, such as https://example.com</div></main></div><dialog id="dialog"><h2>Add this link manually</h2><div class="warning">We couldn’t collect details from this page. You can still save it by adding a title.</div><label for="title">Title</label><input class="field" id="title" placeholder="Give this link a recognizable name"><label for="desc">Description</label><textarea class="field" id="desc" placeholder="Optional"></textarea><div class="url" id="shownUrl"></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary">Save bookmark</button></div></dialog><script>form.onsubmit=e=>{e.preventDefault();let parsed;try{parsed=new URL(url.value);if(!['http:','https:'].includes(parsed.protocol))throw 0}catch(_){form.classList.add('invalid');error.classList.add('show');return}form.classList.remove('invalid');error.classList.remove('show');shownUrl.textContent=url.value;dialog.showModal()};url.oninput=()=>{form.classList.remove('invalid');error.classList.remove('show')};cancel.onclick=()=>dialog.close();</script></body></html>
