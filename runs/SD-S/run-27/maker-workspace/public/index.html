<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>🔖 Bookmarks</h1>
      <button id="add-btn" class="btn primary">Add bookmark</button>
    </header>

    <main class="container">
      <section class="controls">
        <input
          id="search"
          type="search"
          placeholder="Search title, address, note, or tag…"
          autocomplete="off"
        />
        <div id="tag-filters" class="tag-filters"></div>
      </section>

      <section id="list" class="list" aria-live="polite"></section>
    </main>

    <!-- Add / edit dialog -->
    <dialog id="form-dialog">
      <form id="bookmark-form" method="dialog">
        <h2 id="form-title">Add bookmark</h2>
        <input type="hidden" id="bookmark-id" />

        <label>
          Address <span class="req">*</span>
          <input id="f-address" type="text" placeholder="https://example.com" />
        </label>
        <label>
          Title
          <input id="f-title" type="text" placeholder="Optional title" />
        </label>
        <label>
          Note
          <textarea id="f-note" rows="2" placeholder="Optional note"></textarea>
        </label>
        <label>
          Tags (comma separated)
          <input id="f-tags" type="text" placeholder="reading, web" />
        </label>

        <p id="form-error" class="error" hidden></p>
        <p id="form-warning" class="warning" hidden></p>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn">Cancel</button>
          <button type="button" id="save-btn" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
