<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-text-size="medium">
  <header class="topbar">
    <h1>🔖 Bookmarks</h1>
    <nav class="views">
      <button class="view-tab active" data-view="normal">All</button>
      <button class="view-tab" data-view="unread">Unread</button>
      <button class="view-tab" data-view="archive">Archive</button>
    </nav>
    <button id="prefs-btn" class="ghost" title="Preferences">⚙︎</button>
  </header>

  <section class="save-bar">
    <input id="new-url" type="text" placeholder="Paste a URL to save…" autocomplete="off">
    <button id="preview-btn">Fetch</button>
    <button id="import-btn" class="ghost">Import</button>
    <a id="export-link" class="ghost button" href="/api/export">Export</a>
    <input id="import-file" type="file" accept=".html,text/html" hidden>
  </section>

  <section class="toolbar">
    <input id="search" type="text" placeholder='Search… e.g. #news AND (python OR rust)' autocomplete="off">
    <select id="sort">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="title">Title</option>
      <option value="updated">Last updated</option>
    </select>
    <button id="save-filter-btn" class="ghost">Save filter</button>
  </section>

  <div id="filter-tags-bar" class="filter-tags-bar"></div>
  <div id="saved-filters" class="saved-filters"></div>

  <div id="bulk-bar" class="bulk-bar" hidden></div>
  <div id="message" class="message" hidden></div>

  <main id="list" class="list" aria-live="polite"></main>

  <!-- Modals -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
