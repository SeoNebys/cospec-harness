<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuck — Remove interaction comparison</title>
  <style>
    :root {
      --ink: #18211b;
      --muted: #69736c;
      --paper: #f5f2e9;
      --card: #fffdf8;
      --line: #dedbd1;
      --green: #245b46;
      --mint: #dbe9dd;
      --danger: #a33b32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 88% 5%, #cfdeca, transparent 24rem), var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 70px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: white;
      background: var(--green);
      border-radius: 9px 9px 13px 9px;
    }

    .label { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }

    .intro { max-width: 720px; margin: 0 auto 28px; text-align: center; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 8px 0 9px; font-family: Georgia, "Times New Roman", serif; font-size: 38px; font-weight: 500; letter-spacing: -.03em; }
    .intro p { margin: 0; color: var(--muted); line-height: 1.5; }

    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

    .panel {
      min-width: 0;
      padding: 23px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 16px 42px rgba(38, 51, 41, .08);
    }

    .panel-head { display: flex; justify-content: space-between; align-items: end; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 23px; font-weight: 500; }
    .count { color: var(--muted); font-size: 13px; }

    .bookmark {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 88px;
      padding: 15px 2px;
      border-bottom: 1px solid var(--line);
      transition: opacity .18s, transform .18s;
    }

    .bookmark.removing { opacity: 0; transform: translateX(-8px); }

    .favicon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      color: var(--green);
      background: var(--mint);
      border-radius: 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    .copy { min-width: 0; flex: 1; }
    .title { overflow: hidden; display: block; color: var(--ink); font-weight: 720; text-overflow: ellipsis; white-space: nowrap; }
    .description, .url { overflow: hidden; display: block; margin-top: 3px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }

    .remove-direct {
      flex: 0 0 auto;
      padding: 7px 9px;
      color: var(--danger);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .remove-direct:hover { background: #f8e9e7; border-color: #efd3cf; }

    details { position: relative; flex: 0 0 auto; }
    summary {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover, details[open] summary { background: #eeece5; color: var(--ink); }
    .menu {
      position: absolute;
      z-index: 2;
      right: 0;
      top: 38px;
      width: 130px;
      padding: 5px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: 0 10px 25px rgba(24, 33, 27, .14);
    }
    .menu button { width: 100%; padding: 8px 10px; color: var(--danger); background: transparent; border: 0; border-radius: 6px; text-align: left; cursor: pointer; }
    .menu button:hover { background: #f8e9e7; }

    .notice { min-height: 22px; margin-top: 13px; color: var(--green); font-size: 13px; font-weight: 650; }

    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 1180px); }
      .comparison { grid-template-columns: 1fr; }
      .label { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell" data-harness-ready="true">
    <header><div class="brand"><span class="mark">↘</span> Tuck</div><div class="label">Interaction comparison</div></header>
    <div class="intro">
      <div class="eyebrow">Removing a saved link</div>
      <h1>Same collection, two ways to remove</h1>
      <p>Remove “Example Domain” in each panel to compare the interaction.</p>
    </div>
    <main class="comparison">
      <section class="panel" data-mode="direct">
        <div class="panel-head"><h2>Saved links</h2><span class="count">3 bookmarks</span></div>
        <div class="items"></div>
        <div class="notice" aria-live="polite"></div>
      </section>
      <section class="panel" data-mode="menu">
        <div class="panel-head"><h2>Saved links</h2><span class="count">3 bookmarks</span></div>
        <div class="items"></div>
        <div class="notice" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script>
    const bookmarks = [
      ['E', 'Example Domain', 'A reserved domain used in examples and documentation.', 'https://example.com/'],
      ['M', 'HTML: HyperText Markup Language', 'A reference for the language used to structure web pages.', 'developer.mozilla.org'],
      ['S', 'Serious Eats — Recipes and techniques', 'Reliable recipes, kitchen techniques, and food guides.', 'seriouseats.com']
    ];

    document.querySelectorAll('.panel').forEach((panel) => {
      const mode = panel.dataset.mode;
      const items = panel.querySelector('.items');
      bookmarks.forEach(([icon, title, description, url]) => {
        const row = document.createElement('article');
        row.className = 'bookmark';
        row.dataset.title = title;
        row.innerHTML = `<span class="favicon">${icon}</span><div class="copy"><span class="title">${title}</span><span class="description">${description}</span><span class="url">${url}</span></div>`;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Remove';
        remove.setAttribute('aria-label', `Remove ${title}`);
        if (mode === 'direct') {
          remove.className = 'remove-direct';
          row.append(remove);
        } else {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.setAttribute('aria-label', `Actions for ${title}`);
          summary.textContent = '•••';
          const menu = document.createElement('div');
          menu.className = 'menu';
          menu.append(remove);
          details.append(summary, menu);
          row.append(details);
        }

        remove.addEventListener('click', () => {
          row.classList.add('removing');
          setTimeout(() => {
            row.remove();
            const remaining = items.querySelectorAll('.bookmark').length;
            panel.querySelector('.count').textContent = `${remaining} bookmarks`;
            panel.querySelector('.notice').textContent = `${title} was removed.`;
          }, 180);
        });
        items.append(row);
      });
    });
  </script>
</body>
</html>
