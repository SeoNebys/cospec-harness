<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; --warn:#b45309; --red:#dc2626; --green:#059669; --amber:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:22px 20px 100px; }

  .adder { display:flex; gap:8px; margin-bottom:8px; }
  .adder input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .adder input.bad { border-color:#fca5a5; background:#fef2f2; }
  .adder button { padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .adder button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); font-size:12px; margin:0 0 14px 2px; }
  .flash { background:#fffbeb; border:1px solid #fde68a; color:var(--warn); font-size:13px; border-radius:8px; padding:10px 13px; margin:0 0 16px; display:none; } .flash.show { display:block; }

  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .lens { display:inline-flex; background:#eceef1; border-radius:10px; padding:4px; }
  .lens button { border:0; background:none; padding:8px 14px; border-radius:8px; font-size:14px; cursor:pointer; color:#4b5563; display:flex; align-items:center; gap:6px; }
  .lens button.on { background:#fff; color:#111827; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .lens .badge { background:var(--accent); color:#fff; font-size:11px; border-radius:20px; padding:1px 8px; font-weight:600; } .lens .badge.grey { background:#9ca3af; }
  .selbtn { margin-left:auto; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 13px; font-size:13px; cursor:pointer; color:#374151; } .selbtn.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  .savedbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .savedbar .lead { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-right:2px; }
  .schip { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 7px 6px 13px; font-size:13px; cursor:pointer; }
  .schip:hover { border-color:#c7d2fe; } .schip.on { background:#111827; color:#fff; border-color:#111827; }
  .schip .star { color:#f59e0b; }
  .schip .rm { border:0; background:#f3f4f6; color:#6b7280; border-radius:50%; width:18px; height:18px; cursor:pointer; font-size:12px; line-height:1; display:none; }
  .schip:hover .rm, .schip.on .rm { display:inline-block; } .schip.on .rm { background:#374151; color:#d1d5db; }
  .savebtn { border:1px dashed #c7d2fe; background:#eff6ff; color:var(--accent); border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; font-weight:600; }
  .nameform { display:inline-flex; gap:6px; align-items:center; } .nameform input { border:1px solid #c7d2fe; border-radius:8px; padding:6px 10px; font-size:13px; width:170px; }
  .nameform button { border:0; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; font-weight:600; } .nameform .ok { background:var(--accent); color:#fff; } .nameform .no { background:#f3f4f6; color:#374151; }

  .searchwrap { position:relative; margin-bottom:12px; }
  .searchwrap input { width:100%; padding:11px 38px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; }
  .searchwrap .ico { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .searchwrap .x { position:absolute; right:10px; top:50%; transform:translateY(-50%); border:0; background:#eef0f3; color:#6b7280; border-radius:50%; width:22px; height:22px; cursor:pointer; display:none; } .searchwrap .x.show { display:block; }

  .controls { display:flex; align-items:center; margin:6px 2px 8px; }
  .barlabel { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .sortwrap { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  select.sortsel { font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }

  .topicsbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .t { display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .t .c { color:var(--muted); font-size:11px; }
  .t.inc { background:var(--accent); color:#fff; border-color:var(--accent); } .t.inc .c { color:#dbe3ff; }
  .t.exc { background:#fef2f2; color:var(--red); border-color:#fecaca; text-decoration:line-through; } .t.exc .c { color:#f7a3a3; }
  .t .minus { border:0; background:#f3f4f6; color:#6b7280; border-radius:50%; width:18px; height:18px; cursor:pointer; font-size:12px; line-height:1; } .t.exc .minus { background:#fee2e2; color:var(--red); }
  .topicsbar .none { color:var(--muted); font-size:12px; }

  .active { display:none; background:#f8faff; border:1px solid #c7d2fe; border-radius:8px; padding:9px 13px; font-size:13px; margin-bottom:12px; } .active.show { display:block; }
  .active .inb { color:var(--accent); font-weight:600; } .active .exb { color:var(--red); font-weight:600; }
  .active .clr { margin-left:8px; border:1px solid #c7d2fe; background:#fff; border-radius:7px; padding:3px 9px; font-size:12px; cursor:pointer; }

  .lenshint { display:none; font-size:13px; border-radius:8px; padding:10px 13px; margin-bottom:12px; align-items:center; gap:12px; flex-wrap:wrap; }
  .lenshint.show { display:flex; } .lenshint.blue { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; } .lenshint.grey { background:#f3f4f6; border:1px solid #e5e7eb; color:#4b5563; }
  .lenshint .selall { margin-left:auto; background:#fff; border:1px solid currentColor; border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer; }

  .count { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:2px 2px 10px; }
  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; cursor:pointer; position:relative; transition:box-shadow .15s, border-color .15s, opacity .35s, transform .35s; }
  li.card:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); border-color:#c7d2fe; } li.card:hover .editbtn { opacity:1; }
  li.card.fresh { animation:pop .5s ease; } li.card.pulse { animation:pulse 1.2s ease; }
  li.card.leaving { opacity:0; transform:translateX(30px); }
  li.card.unread { border-left:3px solid var(--accent); } li.card.aside { background:#fafafa; } li.card.picked { background:#f5f8ff; border-color:#c7d2fe; }
  li.card.sel-mode { padding-left:44px; }
  @keyframes pop { from{transform:translateY(-6px);opacity:0} to{transform:none;opacity:1} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0)} 30%{box-shadow:0 0 0 4px rgba(37,99,235,.25);border-color:var(--accent)} }
  .checkbox { position:absolute; left:14px; top:16px; width:20px; height:20px; cursor:pointer; accent-color:var(--accent); }
  .editbtn { position:absolute; top:12px; right:12px; background:#f3f4f6; border:1px solid var(--line); border-radius:7px; font-size:12px; padding:4px 9px; cursor:pointer; opacity:0; transition:opacity .12s; }
  .status { position:absolute; top:12px; right:12px; display:flex; gap:6px; align-items:center; }
  .status .btn { border:1px solid var(--line); background:#fff; border-radius:7px; font-size:12px; padding:5px 9px; cursor:pointer; color:#374151; }
  .status .btn.flag.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .status .btn.done { border-color:#a7f3d0; color:var(--green); background:#ecfdf5; font-weight:600; }
  .status .btn.ghost { color:var(--muted); border-style:dashed; }
  .status .btn.aside { color:var(--amber); border-color:#fde68a; }
  .status .btn.back { color:var(--accent); border-color:#c7d2fe; background:#eff6ff; font-weight:600; }
  .status .btn.more { font-weight:700; padding:5px 8px; }
  .read-badge { font-size:11px; color:var(--green); background:#ecfdf5; border:1px solid #a7f3d0; border-radius:6px; padding:3px 8px; }
  .menuwrap { position:relative; } li.card.menu-open { z-index:30; }
  .menu { position:absolute; right:0; top:100%; margin-top:5px; background:#fff; border:1px solid var(--line); border-radius:9px; box-shadow:0 10px 28px rgba(0,0,0,.16); padding:5px; z-index:31; min-width:160px; }
  .menuitem { display:block; width:100%; text-align:left; border:0; background:none; padding:9px 11px; border-radius:6px; font-size:13px; cursor:pointer; color:#374151; white-space:nowrap; } .menuitem:hover { background:#f3f4f6; } .menuitem.del { color:var(--red); }

  .title { font-size:15px; font-weight:600; margin:0; padding-right:210px; overflow-wrap:anywhere; }
  .title .ext { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .desc.faded { color:var(--muted); font-style:italic; }
  .note { color:#6d5100; background:#fffbeb; border:1px solid #fde68a; border-radius:7px; font-size:12px; margin:8px 0 0; padding:7px 10px; overflow-wrap:anywhere; line-height:1.5; }
  .note .lbl { font-weight:600; display:block; margin-bottom:2px; } .note ul { margin:4px 0 0; padding-left:20px; } .note p { margin:0 0 5px; } .note p:last-child { margin:0; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; overflow-wrap:anywhere; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#eef2ff; color:#3730a3; font-size:11px; border-radius:20px; padding:3px 10px; white-space:nowrap; }
  mark { background:#fde68a; color:inherit; border-radius:3px; padding:0 2px; }
  .where { display:inline-block; margin-top:8px; font-size:11px; color:#3730a3; background:#eef2ff; border-radius:6px; padding:2px 8px; }
  .copyrow { margin-top:9px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .copyrow.muted { font-style:italic; } .copyrow.warn { color:var(--amber); }
  .copyrow .ok { color:var(--green); font-weight:600; }
  .viewcopy { border:1px solid #a7f3d0; background:#ecfdf5; color:var(--green); border-radius:7px; font-size:12px; padding:4px 9px; cursor:pointer; font-weight:600; }
  .pubtag { color:#7c3aed; }
  .hbtn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 13px; font-size:13px; cursor:pointer; color:#374151; font-weight:600; } .hbtn:hover { border-color:#c7d2fe; }
  .drop { border:2px dashed #c7d2fe; border-radius:12px; padding:24px; text-align:center; background:#f8faff; cursor:pointer; } .drop .big { font-weight:600; } .drop .small { color:var(--muted); font-size:12px; margin-top:5px; }
  .try { display:inline-block; margin-top:10px; color:var(--accent); font-size:13px; cursor:pointer; text-decoration:underline; }
  .summary { background:#f7f7f8; border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin:6px 0 12px; } .summary .n { font-weight:600; } .summary ul { margin:8px 0 0; padding-left:2px; list-style:none; } .summary li { font-size:13px; color:#374151; padding:2px 0; }
  .opt { display:flex; align-items:center; gap:9px; font-size:13px; margin:10px 0; padding:10px 12px; border:1px solid var(--line); border-radius:9px; } .opt input { width:18px; height:18px; accent-color:var(--accent); }
  .skipnote { color:var(--muted); font-size:12px; margin:6px 2px; }
  .choice { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:11px; padding:14px; margin-bottom:10px; cursor:pointer; } .choice:hover { border-color:#c7d2fe; background:#f8faff; } .choice .em { font-size:22px; } .choice .ct { font-weight:600; font-size:14px; } .choice .cd { color:var(--muted); font-size:12px; margin-top:3px; line-height:1.45; }
  .pv { font-size:12px; color:var(--muted); background:#faf5ff; border:1px solid #ede9fe; border-radius:8px; padding:10px 12px; margin-top:6px; }
  .lead { color:#4b5563; font-size:13px; line-height:1.5; margin:0 0 12px; }
  .done2 { text-align:center; padding:10px 0; } .done2 .big { font-size:16px; font-weight:600; color:var(--green); }
  .loading { color:var(--muted); font-style:italic; font-size:13px; }
  .empty { text-align:center; padding:40px 16px; color:var(--muted); } .empty .art { font-size:44px; } .empty h2 { margin:12px 0 4px; color:#111827; font-size:18px; } .empty .cheer { color:var(--green); font-weight:600; }

  .batch { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(90px); transition:transform .25s; background:#111827; color:#fff; border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 12px 30px rgba(0,0,0,.3); font-size:13px; flex-wrap:wrap; max-width:94vw; z-index:25; }
  .batch.show { transform:translateX(-50%) translateY(0); }
  .batch button { border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; background:#374151; color:#e5e7eb; }
  .batch .b-read { background:var(--green); color:#fff; } .batch .b-del { background:var(--red); color:#fff; } .batch .b-back { background:var(--accent); color:#fff; } .batch .b-clear { background:none; color:#9ca3af; padding:8px 6px; }
  .batch .lblbox { display:flex; gap:6px; align-items:center; background:#1f2937; border-radius:8px; padding:4px 6px; } .batch .lblbox input { border:0; background:none; color:#fff; outline:0; font-size:13px; width:110px; }
  .batch .sugg button { background:#374151; padding:5px 9px; font-weight:400; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(90px); transition:transform .25s; background:#111827; color:#fff; border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:14px; box-shadow:0 12px 30px rgba(0,0,0,.3); font-size:13px; z-index:40; } .toast.show { transform:translateX(-50%) translateY(0); }
  .toast button { background:none; border:0; color:#93c5fd; font-weight:700; cursor:pointer; font-size:13px; }

  .backdrop { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; } .backdrop.show { display:flex; }
  .dialog { background:#fff; border-radius:12px; padding:20px 22px; width:480px; max-width:95vw; max-height:92vh; overflow:auto; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .dialog h3 { margin:0 0 2px; font-size:16px; } .dialog .did { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .dwarn { display:none; background:#fef2f2; border:1px solid #fecaca; color:var(--red); font-size:13px; border-radius:8px; padding:9px 11px; margin-top:10px; } .dwarn.show { display:block; }
  label.f { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 0 4px; }
  input.f, textarea.f { width:100%; border:1px solid #c7d2fe; border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; } textarea.f { resize:vertical; min-height:48px; }
  .noteToolbar { display:flex; gap:6px; margin-bottom:6px; } .noteToolbar button { border:1px solid var(--line); background:#fff; border-radius:6px; width:32px; height:30px; cursor:pointer; font-size:13px; } .noteToolbar .bb { font-weight:800; }
  .editor { min-height:70px; border:1px solid #c7d2fe; border-radius:8px; padding:9px 11px; font-size:14px; line-height:1.5; outline:none; } .editor:empty:before { content:attr(data-ph); color:#9ca3af; } .editor ul { margin:4px 0; padding-left:22px; }
  .hintline { font-size:11px; color:var(--muted); margin-top:5px; }
  .chipbox { border:1px solid #c7d2fe; border-radius:8px; padding:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; } .chip { background:#eef2ff; color:#3730a3; font-size:12px; border-radius:20px; padding:3px 6px 3px 11px; display:flex; align-items:center; gap:5px; } .chip button { background:none; border:0; color:#6366f1; cursor:pointer; font-size:13px; line-height:1; padding:0; } .chipbox input { border:0; outline:0; flex:1; min-width:120px; font-size:14px; padding:4px; }
  .suggest { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; } .suggest button { background:#f3f4f6; border:1px dashed #c7d2fe; color:#4338ca; font-size:12px; border-radius:20px; padding:3px 10px; cursor:pointer; } .suggest .new { border-style:solid; background:#eef2ff; }
  .row { display:flex; gap:8px; margin-top:18px; justify-content:flex-end; } .row button { border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; } .primary { background:var(--accent); color:#fff; } .ghost { background:#f3f4f6; color:#374151; }

  /* --- Slice 7: text size (zoom the reading area) --- */
  html[data-textsize="s"] main { zoom: 0.92; }
  html[data-textsize="l"] main { zoom: 1.14; }
  /* settings dialog controls */
  .setrow { display:flex; align-items:center; gap:10px; margin:14px 0; } .setrow .lab { font-size:13px; font-weight:600; min-width:110px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; } .seg button { border:0; background:var(--surface,#fff); color:#4b5563; padding:7px 13px; font-size:13px; cursor:pointer; border-left:1px solid var(--line); } .seg button:first-child { border-left:0; } .seg button.on { background:var(--accent); color:#fff; font-weight:600; }
  .toggle { display:flex; align-items:center; gap:9px; font-size:13px; } .toggle input { width:18px; height:18px; accent-color:var(--accent); }

  /* --- Slice 7: dark appearance --- */
  html[data-theme="dark"] body { background:#0f1115; color:#e5e7eb; }
  html[data-theme="dark"] header { background:#161922; border-color:#262a33; }
  html[data-theme="dark"] .sub, html[data-theme="dark"] .barlabel, html[data-theme="dark"] .count, html[data-theme="dark"] .hint, html[data-theme="dark"] .url, html[data-theme="dark"] .sortwrap, html[data-theme="dark"] .savedbar .lead { color:#9aa0aa; }
  html[data-theme="dark"] li.card { background:#161922; border-color:#262a33; }
  html[data-theme="dark"] li.card:hover { border-color:#3b4252; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  html[data-theme="dark"] li.card.aside { background:#12151c; }
  html[data-theme="dark"] li.card.picked { background:#1b2130; }
  html[data-theme="dark"] .title, html[data-theme="dark"] .desc { color:#e5e7eb; }
  html[data-theme="dark"] .hbtn, html[data-theme="dark"] .selbtn, html[data-theme="dark"] .adder input, html[data-theme="dark"] .searchwrap input, html[data-theme="dark"] select.sortsel, html[data-theme="dark"] .t, html[data-theme="dark"] .schip, html[data-theme="dark"] .dialog, html[data-theme="dark"] .editbtn, html[data-theme="dark"] .status .btn, html[data-theme="dark"] .menu { background:#0f1115; color:#e5e7eb; border-color:#2a2d34; }
  html[data-theme="dark"] .lens { background:#0f1115; } html[data-theme="dark"] .lens button.on { background:#262a33; color:#fff; }
  html[data-theme="dark"] .editor, html[data-theme="dark"] input.f, html[data-theme="dark"] textarea.f, html[data-theme="dark"] .chipbox { background:#0f1115; color:#e5e7eb; border-color:#3b4252; }
  html[data-theme="dark"] .note { background:#2a230e; border-color:#4d3f14; color:#f5debf; }
  html[data-theme="dark"] .empty h2 { color:#e5e7eb; }
  html[data-theme="dark"] .menuitem { color:#e5e7eb; } html[data-theme="dark"] .menuitem:hover { background:#262a33; }
</style>
</head>
<body>
<header style="display:flex;align-items:center;gap:14px">
  <div><h1>My Links</h1><div class="sub">Your personal library of saved links — private, on your machine.</div></div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="hbtn" id="importBtn">⬇ Import</button>
    <button class="hbtn" id="exportBtn">⬆ Export</button>
    <button class="hbtn" id="settingsBtn" title="Settings">⚙</button>
  </div>
</header>
<main>
  <div class="adder">
    <input id="url" type="text" placeholder="Paste a link here…" autocomplete="off">
    <button id="save" disabled>Save</button>
  </div>
  <p class="hint">Paste a web address and press Save. Click a link to open it; hover to edit.</p>
  <div class="flash" id="flash"></div>

  <div class="toolbar">
    <div class="lens" id="lens">
      <button data-v="all" class="on">📚 Everything</button>
      <button data-v="toread">📖 To read <span class="badge" id="trbadge">0</span></button>
      <button data-v="aside">🗄 Set aside <span class="badge grey" id="asbadge">0</span></button>
    </div>
    <button class="selbtn" id="selbtn">☑ Select</button>
  </div>

  <div class="savedbar" id="savedbar"></div>
  <div class="searchwrap">
    <span class="ico">🔍</span>
    <input id="q" type="text" placeholder="Search — scraps in any order, or &quot;an exact phrase&quot;" autocomplete="off">
    <button class="x" id="clearq">×</button>
  </div>
  <div class="controls">
    <span class="barlabel">Topics</span>
    <span class="sortwrap">Sort
      <select class="sortsel" id="sortsel">
        <option value="new">Newest first</option><option value="old">Oldest first</option>
        <option value="az">Name A–Z</option><option value="za">Name Z–A</option>
      </select>
    </span>
  </div>
  <div class="topicsbar" id="bar"></div>
  <div class="active" id="active"></div>
  <div class="lenshint" id="lenshint"></div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</main>
<div class="batch" id="batch"></div>
<div class="toast" id="toast"></div>
<div class="backdrop" id="backdrop"><div class="dialog" id="dialog"></div></div>
<script type="module" src="library.js"></script>
</body>
</html>
