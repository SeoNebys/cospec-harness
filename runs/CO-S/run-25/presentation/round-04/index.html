<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Library — Prototype</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --ink: #1c2230; --muted: #6b7385;
    --line: #e4e7ee; --accent: #2f6df6; --accent-soft: #eaf1ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 18px 28px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .tag { font-size: 12px; color: var(--muted); background: var(--bg);
    padding: 3px 9px; border-radius: 20px; border: 1px solid var(--line); }
  main { max-width: 760px; margin: 0 auto; padding: 28px; }

  .saver {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 26px; box-shadow: 0 1px 2px rgba(20,30,60,.04);
  }
  .saver label { font-size: 13px; font-weight: 600; color: var(--muted);
    display: block; margin-bottom: 8px; }
  .saver .row { display: flex; gap: 10px; }
  .saver input {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 15px; outline: none;
  }
  .saver input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .saver button {
    padding: 12px 20px; border: none; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer;
  }
  .saver button:hover { background: #2258d6; }
  .saver button:disabled { opacity: .6; cursor: default; }

  .count { font-size: 13px; color: var(--muted); margin: 0 0 12px 2px; }

  ul.library { list-style: none; padding: 0; margin: 0; display: flex;
    flex-direction: column; gap: 12px; }
  li.item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start;
    animation: pop .25s ease; position: relative;
  }
  @keyframes pop { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .favicon { width: 38px; height: 38px; border-radius: 9px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    color: var(--accent); flex-shrink: 0; font-weight: 700; }
  .item .body { flex: 1; min-width: 0; }
  .item a.title { font-weight: 650; font-size: 16px; margin: 0 0 3px; display: inline-block;
    color: var(--ink); text-decoration: none; }
  .item a.title:hover { color: var(--accent); text-decoration: underline; }
  .item .desc { font-size: 14px; color: #444b5c; margin: 2px 0 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .item .chip { font-size: 12px; color: var(--accent); background: var(--accent-soft);
    padding: 2px 10px; border-radius: 20px; }
  .item .chip.placeholder { color: var(--muted); background: var(--bg);
    border: 1px dashed var(--line); }
  .item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .item .meta a { color: var(--muted); text-decoration: none; }
  .item .meta a:hover { text-decoration: underline; }
  .item .rename { position: absolute; top: 14px; right: 14px; font-size: 12px;
    color: var(--muted); background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 9px; cursor: pointer; }
  .item .rename:hover { color: var(--accent); border-color: var(--accent); }
  .fetching { font-size: 13px; color: var(--muted); font-style: italic; }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px;
    border: 1px dashed var(--line); border-radius: 14px; background: var(--card); }
  .empty .big { font-size: 30px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>Link Library</h1>
  <span class="tag">Prototype</span>
</header>
<main>
  <div class="saver">
    <label for="url">Save a link</label>
    <div class="row">
      <input id="url" type="text" placeholder="Paste a web address, e.g. https://example.com/article" autocomplete="off">
      <button id="saveBtn">Save</button>
    </div>
  </div>

  <p class="count" id="count"></p>
  <ul class="library" id="library"></ul>
</main>

<script>
  // Prototype only — simulates external behaviour for requirement exploration.
  // Fetching the real page title & description is SIMULATED here (no live network).
  const items = [];
  let seq = 0;

  function hostOf(url) {
    try {
      let u = url.trim();
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      return new URL(u).hostname.replace(/^www\./, "");
    } catch (e) { return url.trim(); }
  }
  function normUrl(url) {
    let u = url.trim();
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }
  // Simulated "fetched" metadata by host, with a sensible fallback.
  const KNOWN = {
    "en.wikipedia.org": { t: "Bookmark (digital) - Wikipedia",
      d: "In the context of the World Wide Web, a bookmark is a URI that is stored for later retrieval in any of various storage formats." },
    "developer.mozilla.org": { t: "Web APIs | MDN",
      d: "A reference of all the interfaces (object types) available for building web apps, with examples and browser compatibility data." },
    "github.com": { t: "GitHub - build and ship software",
      d: "GitHub is where over 100 million developers shape the future of software, together." },
    "nytimes.com": { t: "Breaking News, World News & Multimedia - The New York Times",
      d: "Live news, investigations, opinion, photos and video by the journalists of The New York Times." }
  };
  function fetchMeta(url) {
    const host = hostOf(url);
    if (KNOWN[host]) return KNOWN[host];
    const path = url.replace(/^https?:\/\//i, "").split("/").slice(1).join("/");
    const slug = (path.split(/[?#]/)[0].split("/").filter(Boolean).pop() || "")
      .replace(/[-_]+/g, " ").replace(/\.[a-z]+$/i, "").trim();
    const t = slug ? slug.replace(/\b\w/g, c => c.toUpperCase()) + " — " + host : host;
    return { t, d: "A page on " + host + ". A short summary of the page would appear here." };
  }
  function timeNow() {
    return new Date().toLocaleString(undefined, { month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit" });
  }

  function render() {
    const lib = document.getElementById("library");
    const count = document.getElementById("count");
    if (items.length === 0) {
      count.textContent = "";
      lib.innerHTML = '<div class="empty"><div class="big">🔖</div>' +
        "Your library is empty. Save your first link above to get started.</div>";
      return;
    }
    count.textContent = items.length + (items.length === 1 ? " saved link" : " saved links");
    lib.innerHTML = "";
    items.forEach(it => {
      const li = document.createElement("li");
      li.className = "item";
      if (it.loading) {
        li.innerHTML =
          '<div class="favicon">' + it.host.charAt(0).toUpperCase() + "</div>" +
          '<div class="body"><div class="fetching">Fetching page details…</div>' +
          '<div class="meta"><span>' + it.url + "</span></div></div>";
      } else {
        const tags = '<span class="chip placeholder">+ add tags</span>';
        li.innerHTML =
          '<div class="favicon">' + it.host.charAt(0).toUpperCase() + "</div>" +
          '<div class="body">' +
            '<a class="title" href="' + it.url + '" target="_blank" rel="noopener">' + it.title + "</a>" +
            '<div class="desc">' + it.desc + "</div>" +
            '<div class="tags">' + tags + "</div>" +
            '<div class="meta"><a href="' + it.url + '" target="_blank" rel="noopener">' + it.host + "</a>" +
              "<span>Saved " + it.saved + "</span></div>" +
          "</div>" +
          '<button class="rename" data-id="' + it.id + '">Rename</button>';
      }
      lib.appendChild(li);
    });
    document.querySelectorAll(".rename").forEach(btn => {
      btn.addEventListener("click", () => {
        const it = items.find(x => x.id == btn.dataset.id);
        const next = prompt("Rename this link:", it.title);
        if (next !== null && next.trim()) { it.title = next.trim(); render(); }
      });
    });
  }

  function save() {
    const input = document.getElementById("url");
    const raw = input.value.trim();
    if (!raw) return;
    const url = normUrl(raw);
    const it = { id: ++seq, url: url, host: hostOf(url), loading: true, saved: timeNow() };
    items.unshift(it);
    input.value = "";
    input.focus();
    render();
    // Simulate the automatic title/description fetch.
    setTimeout(() => {
      const meta = fetchMeta(url);
      it.loading = false; it.title = meta.t; it.desc = meta.d;
      render();
    }, 650);
  }

  document.getElementById("saveBtn").addEventListener("click", save);
  document.getElementById("url").addEventListener("keydown", e => {
    if (e.key === "Enter") save();
  });

  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
</content>
