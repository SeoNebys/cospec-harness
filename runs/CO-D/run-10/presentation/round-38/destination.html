<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A field guide to ancient libraries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #18241f; background: #f6f1e6; font-family: "DM Sans", sans-serif; }
      header { padding: 22px 7vw; color: #fff; background: #173d35; }
      header strong { font-family: "DM Serif Display", serif; font-size: 23px; font-weight: 400; }
      main { max-width: 860px; margin: 0 auto; padding: 80px 40px; }
      .source { color: #b1533e; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
      h1 { max-width: 700px; margin: 16px 0 20px; font-family: "DM Serif Display", serif; font-size: 58px; font-weight: 400; line-height: 1.04; }
      .deck { max-width: 600px; color: #65716b; font-size: 19px; line-height: 1.55; }
      .hero { height: 270px; display: grid; place-items: center; margin: 48px 0; color: #f8f0de; background: linear-gradient(145deg, #af553f 0 32%, #e69a68 32% 47%, #244f46 47%); font-family: "DM Serif Display", serif; font-size: 25px; letter-spacing: 6px; }
      .notice { display: inline-block; margin-top: 12px; padding: 8px 12px; border-radius: 6px; color: #2d5c50; background: #e6edcb; font-size: 11px; }
      a { color: #2d5c50; }
    </style>
  </head>
  <body>
    <header><strong>Atlas Obscura</strong></header>
    <main data-harness-ready="true">
      <p class="source">Books · History · Field notes</p>
      <h1>A field guide to ancient libraries</h1>
      <p class="deck">Ideas about lost collections and why preserving knowledge matters.</p>
      <div class="hero">FIELD NOTES</div>
      <p class="notice">Prototype of the saved webpage destination</p>
      <p><a href="javascript:history.back()">← Return to the library</a></p>
    </main>
  </body>
</html>
