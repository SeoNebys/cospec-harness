<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — tags & notes (comparison)</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e4e7ec; --text: #1a1d24;
    --muted: #6b7280; --accent: #2563eb; --accent-soft: #eaf1ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 20px; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .mode-banner { background: var(--accent-soft); color: #1e40af; font-size: 13px; padding: 8px 20px; border-bottom: 1px solid var(--line); }
  main { max-width: 720px; margin: 0 auto; padding: 20px; }
  .save-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  .save-row { display: flex; gap: 8px; }
  .save-row input { flex: 1; padding: 12px 14px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; outline: none; }
  .save-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .save-row button { padding: 12px 18px; font-size: 15px; font-weight: 600; color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.saving { color: var(--accent); } .status.saved { color: #059669; } .status.error { color: #dc2626; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; margin-bottom: 16px; }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box .search-icon { color: var(--muted); font-size: 18px; }
  .search-box input { flex: 1; border: none; outline: none; padding: 9px 0; font-size: 15px; background: transparent; }
  .search-box .clear-search { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; padding: 4px; }
  mark { background: #fef3c7; color: inherit; border-radius: 3px; padding: 0 1px; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  .item .title { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .item .title a { color: var(--text); text-decoration: none; }
  .item .title a:hover { text-decoration: underline; }
  .item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .item .favicon { width: 16px; height: 16px; border-radius: 4px; background: var(--accent-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--accent); font-weight: 700; }
  .item .desc { font-size: 14px; color: #384150; margin: 8px 0 0; }
  .item .note { font-size: 13px; color: #4b5563; margin: 8px 0 0; padding: 8px 10px; background: #fafafa; border-left: 3px solid var(--line); border-radius: 4px; white-space: pre-wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 12px; background: var(--accent-soft); color: #1e40af; border-radius: 999px; padding: 3px 10px; }
  .item-actions { margin-top: 10px; }
  .link-btn { border: none; background: transparent; color: var(--accent); font-size: 13px; cursor: pointer; padding: 4px 0; font-weight: 600; }
  .editor { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .editor label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .editor textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; font-size: 14px; resize: vertical; outline: none; }
  .editor textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field { margin-bottom: 14px; }
  .chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .chip-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip-input input { flex: 1; min-width: 120px; border: none; outline: none; font: inherit; font-size: 14px; padding: 4px; }
  .editable-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--accent-soft); color: #1e40af; border-radius: 999px; padding: 3px 8px 3px 10px; }
  .editable-tag button { border: none; background: transparent; color: #1e40af; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
  .text-tags { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; font-size: 14px; outline: none; }
  .text-tags:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .picker .opt { font-size: 12px; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .picker .opt.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .picker-add { display: flex; gap: 6px; margin-top: 8px; }
  .picker-add input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; font-size: 14px; outline: none; }
  .picker-add button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .editor-actions { display: flex; gap: 8px; margin-top: 4px; }
  .editor-actions .save-edit { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .editor-actions .cancel-edit { background: transparent; color: var(--muted); border: none; cursor: pointer; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; border: 1px dashed var(--line); border-radius: 12px; background: var(--card); }
  .empty .big { font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Add tags and a note to a link so it's easier to organise and find.</p>
</header>
<div class="mode-banner" id="modeBanner"></div>
<main>
  <div class="save-box">
    <div class="save-row">
      <input id="url" type="text" placeholder="Paste a link here, e.g. https://…" autocomplete="off">
      <button id="saveBtn">Save</button>
    </div>
    <div class="hint">Tip: paste any web address and press Save.</div>
    <div class="status" id="status"></div>
  </div>

  <div class="search-box" id="searchBox" style="display:none;">
    <span class="search-icon">⌕</span>
    <input id="search" type="text" placeholder="Search by word, site, address, tag, or note…" autocomplete="off">
    <button id="clearSearch" class="clear-search" style="display:none;" title="Clear search">✕</button>
  </div>

  <p class="section-label" id="listLabel" style="display:none;">Saved links</p>
  <ul class="list" id="list"></ul>

  <div class="empty" id="noResults" style="display:none;">
    <div class="big">No matching links</div>
    <div id="noResultsMsg"></div>
  </div>
  <div class="empty" id="empty">
    <div class="big">No links saved yet</div>
    <div>Paste a link above and press Save to add your first bookmark.</div>
  </div>
</main>

<script>
  // Which tag-entry style to show: ?mode=chips | text | picker
  const MODE = (new URLSearchParams(location.search).get("mode") || "chips").toLowerCase();
  const MODE_LABEL = {
    chips: "Version A — type a tag and press Enter; each becomes a removable chip.",
    text: "Version B — type all tags in one box, separated by commas.",
    picker: "Version C — click to pick from tags you've used before, or add a new one."
  };
  document.getElementById("modeBanner").textContent = MODE_LABEL[MODE] || MODE_LABEL.chips;

  function domainOf(url) {
    try { let u = url.trim(); if (!/^https?:\/\//i.test(u)) u = "https://" + u; return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return null; }
  }
  function titleCase(s) { return s.replace(/[-_]/g, " ").replace(/\b\w/g, c => c.toUpperCase()); }
  function lookup(url) {
    const host = domainOf(url); if (!host) return null;
    const root = host.split(".")[0];
    let path = "";
    try { let u = url.trim(); if (!/^https?:\/\//i.test(u)) u = "https://" + u; path = new URL(u).pathname.split("/").filter(Boolean).pop() || ""; } catch (e) {}
    const guessed = path ? titleCase(path.replace(/\.\w+$/, "")) : titleCase(root);
    return { host, title: guessed || host, site: titleCase(root), desc: "" };
  }

  // Separate storage per mode so the three versions don't interfere.
  const KEY = "proto_tags_" + MODE;
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (!items) {
    const now = Date.now();
    const SEED = [
      { url: "https://www.nytimes.com/article", host: "nytimes.com", title: "The Science of a Good Night's Sleep", site: "The New York Times", desc: "What researchers now understand about sleep cycles, and small habits that improve rest.", ago: 2, tags: ["health","reading"], note: "" },
      { url: "https://arstechnica.com/the-history-of-the-web-bookmark", host: "arstechnica.com", title: "The long, strange history of the web bookmark", site: "Ars Technica", desc: "How saving links evolved from a browser afterthought into its own category of tools.", ago: 26, tags: ["reading","tech"], note: "" },
      { url: "https://medium.com/organising-my-reading-list", host: "medium.com", title: "How I Finally Organised My Reading List", site: "Medium", desc: "A personal system for saving articles you actually come back to.", ago: 50, tags: ["productivity","reading"], note: "Try the folder idea from section 3." },
      { url: "https://github.com", host: "github.com", title: "GitHub — Where the world builds software", site: "GitHub", desc: "GitHub is where over 100 million developers shape the future of software, together.", ago: 90, tags: ["tech","tools"], note: "" },
      { url: "https://en.wikipedia.org/wiki/Bookmark_(World_Wide_Web)", host: "wikipedia.org", title: "Bookmark (World Wide Web) — Wikipedia", site: "Wikipedia", desc: "A bookmark is a URI that is stored for later retrieval in any of various storage formats.", ago: 120, tags: ["reference"], note: "" }
    ];
    items = SEED.map((s, i) => ({ id: now - 1000 - i, url: s.url, host: s.host, title: s.title, site: s.site, desc: s.desc, savedAt: now - s.ago * 3600000, tags: s.tags, note: s.note }));
    localStorage.setItem(KEY, JSON.stringify(items));
  }
  let query = "";
  let editingId = null;      // which item's editor is open
  let draftTags = [];        // working copy of tags while editing

  function persist() { localStorage.setItem(KEY, JSON.stringify(items)); }
  function allTags() { const s = new Set(); items.forEach(it => (it.tags || []).forEach(t => s.add(t))); return [...s].sort(); }
  function timeAgo(ts) { const s = Math.floor((Date.now() - ts) / 1000); if (s < 60) return "just now"; const m = Math.floor(s/60); if (m<60) return m+" min ago"; const h = Math.floor(m/60); if (h<24) return h+" h ago"; return Math.floor(h/24)+" d ago"; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }
  function normTag(t) { return t.trim().replace(/\s+/g, " ").toLowerCase(); }
  function addDraftTag(raw) { const t = normTag(raw); if (t && !draftTags.includes(t)) draftTags.push(t); }

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const listLabel = document.getElementById("listLabel");
  const searchBox = document.getElementById("searchBox");
  const noResults = document.getElementById("noResults");
  const noResultsMsg = document.getElementById("noResultsMsg");
  const clearSearchBtn = document.getElementById("clearSearch");

  function matches(it, q) {
    const hay = [it.title, it.site, it.host, it.url, it.desc, (it.tags||[]).join(" "), it.note||""].join(" ").toLowerCase();
    return q.split(/\s+/).filter(Boolean).every(term => hay.includes(term));
  }
  function highlight(text, q) {
    let out = escapeHtml(text); const terms = q.split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (!terms.length) return out; return out.replace(new RegExp("(" + terms.join("|") + ")", "gi"), "<mark>$1</mark>");
  }

  function tagEditorHtml() {
    if (MODE === "text") {
      return `<div class="field"><label>Tags</label>
        <input class="text-tags" id="textTags" placeholder="e.g. reading, health, to-buy" value="${escapeHtml(draftTags.join(", "))}">
        <div class="hint">Separate tags with commas.</div></div>`;
    }
    if (MODE === "picker") {
      const opts = allTags().map(t => `<button type="button" class="opt ${draftTags.includes(t)?"on":""}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("");
      const news = draftTags.filter(t => !allTags().includes(t)).map(t => `<button type="button" class="opt on" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("");
      return `<div class="field"><label>Tags</label>
        <div class="picker" id="picker">${opts}${news}</div>
        <div class="picker-add"><input id="pickerNew" placeholder="Add a new tag"><button type="button" id="pickerAddBtn">Add</button></div></div>`;
    }
    // chips (default)
    const chips = draftTags.map(t => `<span class="editable-tag">${escapeHtml(t)}<button type="button" data-remove="${escapeHtml(t)}">✕</button></span>`).join("");
    return `<div class="field"><label>Tags</label>
      <div class="chip-input" id="chipInput">${chips}<input id="chipEntry" placeholder="Type a tag, press Enter"></div>
      <div class="hint">Press Enter or comma after each tag.</div></div>`;
  }

  function render() {
    listEl.innerHTML = "";
    const q = query.trim().toLowerCase();
    if (items.length === 0) { emptyEl.style.display="block"; noResults.style.display="none"; searchBox.style.display="none"; listLabel.style.display="none"; return; }
    emptyEl.style.display = "none"; searchBox.style.display = "flex"; clearSearchBtn.style.display = q ? "block" : "none";
    const visible = q ? items.filter(it => matches(it, q)) : items;
    if (visible.length === 0) { listLabel.style.display="none"; noResults.style.display="block"; noResultsMsg.textContent = `Nothing matched “${query.trim()}”.`; return; }
    noResults.style.display = "none"; listLabel.style.display = "block";
    listLabel.textContent = q ? `${visible.length} matching link${visible.length>1?"s":""}` : "Saved links";

    visible.forEach(it => {
      const li = document.createElement("li"); li.className = "item";
      const initial = (it.site || it.host || "?").charAt(0).toUpperCase();
      const tagsHtml = (it.tags && it.tags.length) ? `<div class="tags">${it.tags.map(t => `<span class="tag">${highlight(t, q)}</span>`).join("")}</div>` : "";
      const noteHtml = it.note ? `<p class="note">${highlight(it.note, q)}</p>` : "";
      let body = `
        <p class="title"><a href="${it.url}" target="_blank" rel="noopener">${highlight(it.title, q)}</a></p>
        <div class="meta"><span class="favicon">${escapeHtml(initial)}</span><span>${highlight(it.site||it.host,q)}</span><span>·</span><span>${highlight(it.host,q)}</span><span>·</span><span>saved ${timeAgo(it.savedAt)}</span></div>
        ${it.desc ? `<p class="desc">${highlight(it.desc,q)}</p>` : ""}
        ${tagsHtml}${noteHtml}`;
      if (editingId === it.id) {
        body += `<div class="editor">
          ${tagEditorHtml()}
          <div class="field"><label>Note</label><textarea id="noteEntry" rows="2" placeholder="Add a private note to your future self…">${escapeHtml(it.note||"")}</textarea></div>
          <div class="editor-actions"><button class="save-edit" data-save="${it.id}">Save</button><button class="cancel-edit" data-cancel="1">Cancel</button></div>
        </div>`;
      } else {
        body += `<div class="item-actions"><button class="link-btn" data-edit="${it.id}">${(it.tags&&it.tags.length)||it.note ? "Edit tags & note" : "＋ Add tags & note"}</button></div>`;
      }
      li.innerHTML = body;
      listEl.appendChild(li);
    });
    wireEditor();
  }

  function openEditor(id) { const it = items.find(x => x.id === id); editingId = id; draftTags = (it.tags || []).slice(); render(); }
  function closeEditor() { editingId = null; draftTags = []; render(); }
  function saveEditor(id) {
    const it = items.find(x => x.id === id); if (!it) return;
    if (MODE === "text") { const el = document.getElementById("textTags"); draftTags = []; (el ? el.value : "").split(",").forEach(addDraftTag); }
    if (MODE === "chips") { const el = document.getElementById("chipEntry"); if (el && el.value.trim()) addDraftTag(el.value); }
    const noteEl = document.getElementById("noteEntry");
    it.tags = draftTags.slice(); it.note = noteEl ? noteEl.value.trim() : (it.note||"");
    persist(); editingId = null; draftTags = []; render();
  }

  function wireEditor() {
    document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditor(Number(b.dataset.edit)));
    document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = closeEditor);
    document.querySelectorAll("[data-save]").forEach(b => b.onclick = () => saveEditor(Number(b.dataset.save)));
    if (editingId == null) return;
    if (MODE === "chips") {
      const entry = document.getElementById("chipEntry");
      if (entry) {
        entry.focus();
        entry.onkeydown = e => {
          if (e.key === "Enter" || e.key === ",") { e.preventDefault(); if (entry.value.trim()) { addDraftTag(entry.value); entry.value=""; render(); } }
          else if (e.key === "Backspace" && !entry.value && draftTags.length) { draftTags.pop(); render(); }
        };
      }
      document.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { draftTags = draftTags.filter(t => t !== b.dataset.remove); render(); });
    }
    if (MODE === "picker") {
      document.querySelectorAll("#picker .opt").forEach(b => b.onclick = () => { const t = b.dataset.tag; if (draftTags.includes(t)) draftTags = draftTags.filter(x=>x!==t); else draftTags.push(t); render(); });
      const addBtn = document.getElementById("pickerAddBtn"), newEl = document.getElementById("pickerNew");
      const addNew = () => { if (newEl && newEl.value.trim()) { addDraftTag(newEl.value); newEl.value=""; render(); } };
      if (addBtn) addBtn.onclick = addNew;
      if (newEl) newEl.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addNew(); } };
    }
  }

  // Saving new links (kept identical to approved flow)
  const urlEl = document.getElementById("url"), btn = document.getElementById("saveBtn"), statusEl = document.getElementById("status");
  function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = "status " + (cls||""); }
  function save() {
    const raw = urlEl.value.trim(); if (!raw) { setStatus("Please paste a link first.","error"); return; }
    const host = domainOf(raw); if (!host || !host.includes(".")) { setStatus("That doesn't look like a valid link.","error"); return; }
    btn.disabled = true; setStatus("Fetching details…","saving");
    setTimeout(() => {
      const meta = lookup(raw); let normalized = raw; if (!/^https?:\/\//i.test(normalized)) normalized = "https://" + normalized;
      items.unshift({ id: Date.now(), url: normalized, host: meta.host, title: meta.title, site: meta.site, desc: meta.desc, savedAt: Date.now(), tags: [], note: "" });
      persist(); render(); urlEl.value=""; btn.disabled=false; setStatus("Saved — details filled in automatically.","saved"); setTimeout(()=>setStatus("",""),2500); urlEl.focus();
    }, 650);
  }
  btn.onclick = save; urlEl.onkeydown = e => { if (e.key === "Enter") save(); };
  const searchEl = document.getElementById("search");
  searchEl.oninput = e => { query = e.target.value; render(); };
  clearSearchBtn.onclick = () => { query=""; searchEl.value=""; searchEl.focus(); render(); };

  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
