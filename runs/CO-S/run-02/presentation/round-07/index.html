<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — prototype</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 720px; margin: 0 auto; padding: 32px 20px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .save-box { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .save-box label { display: block; font-size: 12px; color: #666; margin: 0 0 4px; }
  .save-box .hint { font-size: 11px; color: #999; margin: -8px 0 12px; min-height: 14px; }
  .save-box input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d5d5d5; border-radius: 7px; margin-bottom: 12px; }
  .save-box button { background: #2563eb; color: #fff; border: 0; border-radius: 7px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .save-box button:hover { background: #1d4ed8; }
  .search { position: relative; margin-bottom: 16px; }
  .search input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid #d5d5d5; border-radius: 9px; }
  .count { font-size: 12px; color: #888; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  li .title { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  li a { color: #2563eb; text-decoration: none; font-size: 13px; word-break: break-all; }
  li a:hover { text-decoration: underline; }
  .empty { color: #999; font-size: 14px; padding: 24px 0; text-align: center; }
  mark { background: #fde68a; padding: 0 1px; border-radius: 2px; }
</style>
</head>
<body>
  <h1>📑 My Bookmarks</h1>

  <div class="save-box">
    <label for="url">Link</label>
    <input id="url" type="text" placeholder="Paste a link here…" />
    <label for="title">Name</label>
    <input id="title" type="text" placeholder="Grabbed automatically — edit if you like" />
    <div class="hint" id="hint"></div>
    <button id="save">Save</button>
  </div>

  <div class="search">
    <input id="search" type="text" placeholder="🔍 Search your bookmarks…" />
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>

  <script>
    const KEY = 'bm_proto_v2';
    const SEED = [
      { url: 'https://en.wikipedia.org/wiki/Bookmark', title: 'Bookmark - Wikipedia', savedAt: 1 },
      { url: 'https://www.nytimes.com/section/world', title: 'World News - The New York Times', savedAt: 2 },
      { url: 'https://www.seriouseats.com/classic-banana-bread-recipe', title: 'Classic Banana Bread Recipe', savedAt: 3 },
      { url: 'https://github.com/torvalds/linux', title: 'torvalds/linux - GitHub', savedAt: 4 },
      { url: 'https://www.youtube.com/watch?v=abc', title: 'How to Prune Tomatoes - YouTube', savedAt: 5 },
      { url: 'https://www.bbc.com/news/technology', title: 'Technology - BBC News', savedAt: 6 },
    ];
    function load() {
      const raw = localStorage.getItem(KEY);
      if (raw === null) { localStorage.setItem(KEY, JSON.stringify(SEED)); return SEED.slice(); }
      return JSON.parse(raw);
    }
    const store = (arr) => localStorage.setItem(KEY, JSON.stringify(arr));

    function fakeFetchTitle(url) {
      const known = { 'en.wikipedia.org': 'Bookmark - Wikipedia', 'nytimes.com': 'The New York Times - Breaking News',
        'github.com': 'GitHub: Let’s build from here', 'youtube.com': 'YouTube' };
      let host = url;
      try { host = new URL(url.match(/^https?:\/\//) ? url : 'https://' + url).hostname.replace(/^www\./, ''); } catch (e) {}
      if (known[host]) return known[host];
      const w = host.split('.')[0].replace(/[-_]/g, ' ');
      return w.charAt(0).toUpperCase() + w.slice(1) + ' — page';
    }

    const urlInput = document.getElementById('url');
    const titleInput = document.getElementById('title');
    const hint = document.getElementById('hint');
    const searchInput = document.getElementById('search');
    let titleTouched = false;
    titleInput.addEventListener('input', () => { titleTouched = true; });

    let debounce;
    urlInput.addEventListener('input', () => {
      const url = urlInput.value.trim();
      clearTimeout(debounce);
      if (!url) { hint.textContent = ''; return; }
      hint.textContent = 'Looking up the page title…';
      debounce = setTimeout(() => {
        if (!titleTouched || !titleInput.value.trim()) { titleInput.value = fakeFetchTitle(url); titleTouched = false; }
        hint.textContent = 'Filled in the page title — edit it if you like.';
      }, 700);
    });

    function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function highlight(text, q) {
      if (!q) return esc(text);
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
    }

    function render() {
      const q = searchInput.value.trim();
      let items = load().slice().sort((a, b) => b.savedAt - a.savedAt);
      if (q) {
        const ql = q.toLowerCase();
        items = items.filter(it => (it.title || '').toLowerCase().includes(ql) || it.url.toLowerCase().includes(ql));
      }
      const list = document.getElementById('list');
      const count = document.getElementById('count');
      list.innerHTML = '';
      if (items.length === 0) {
        count.textContent = '';
        list.innerHTML = q
          ? '<div class="empty">No bookmarks match “' + esc(q) + '”.</div>'
          : '<div class="empty">Nothing saved yet. Add your first link above.</div>';
        return;
      }
      count.textContent = q ? (items.length + ' match') : (items.length + ' bookmarks');
      items.forEach(it => {
        const li = document.createElement('li');
        const t = document.createElement('div');
        t.className = 'title';
        t.innerHTML = highlight(it.title || it.url, q);
        const a = document.createElement('a');
        a.href = it.url; a.target = '_blank'; a.innerHTML = highlight(it.url, q);
        li.appendChild(t); li.appendChild(a);
        list.appendChild(li);
      });
    }

    document.getElementById('save').addEventListener('click', () => {
      const url = urlInput.value.trim();
      const title = titleInput.value.trim();
      if (!url) return;
      const items = load();
      items.push({ url, title, savedAt: Date.now() });
      store(items);
      urlInput.value = ''; titleInput.value = ''; hint.textContent = ''; titleTouched = false;
      render();
    });

    searchInput.addEventListener('input', render);
    render();
  </script>
</body>
</html>
