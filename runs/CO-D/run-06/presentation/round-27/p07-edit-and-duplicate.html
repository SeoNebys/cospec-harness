<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 07 (open to edit + duplicate link)</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#3b5bdb; --bg:#f7f7f9; --note:#8a6d00; --notebg:#fff8e1; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         margin:0; background:var(--bg); color:#1a1a1e; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 20px 80px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }

  .row { display:flex; gap:8px; }
  input[type=url], input[type=text], textarea {
      width:100%; padding:10px 12px; border:1px solid var(--line);
      border-radius:8px; font-size:14px; font-family:inherit; background:#fff; }
  textarea { resize:vertical; min-height:52px; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:8px;
      padding:10px 16px; font-size:14px; cursor:pointer; }
  button.ghost { background:#eee; color:#333; border:0; border-radius:8px;
      padding:10px 16px; font-size:14px; cursor:pointer; }

  .count { font-size:13px; color:var(--muted); margin:18px 2px 12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:box-shadow .12s; }
  .card:hover { box-shadow:0 3px 14px rgba(0,0,0,.08); border-color:#cfd6ef; }
  .card .title { font-size:15px; font-weight:600; margin:0 0 2px; }
  .card .url { font-size:12px; color:var(--accent); word-break:break-all; }
  .card .desc { font-size:13px; color:#3a3a42; margin:8px 0 0; }
  .card .note { font-size:13px; color:var(--note); background:var(--notebg);
          border-left:3px solid #f0cf5a; border-radius:0 6px 6px 0; padding:7px 10px; margin:9px 0 0; }
  .card .lbls { margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; }
  .card .lbls span { background:#eef0f4; color:#444; border-radius:12px; padding:2px 9px; font-size:12px; }
  .hint { font-size:12px; color:#9a9aa2; margin-top:6px; }

  /* editor modal */
  .backdrop { position:fixed; inset:0; background:rgba(20,20,28,.4); display:none;
      align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto; }
  .backdrop.show { display:flex; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width:560px; padding:20px 22px 22px;
      box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin:0 0 4px; font-size:16px; }
  .modal .murl { font-size:12px; color:var(--accent); word-break:break-all; margin-bottom:6px; }
  .banner { background:#eaf7ee; border:1px solid #bfe6cd; color:#1a7f37; border-radius:8px;
      padding:9px 12px; font-size:13px; margin-bottom:14px; display:none; }
  .banner.show { display:block; }
  label.fld { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  label.fld .side { color:#9a9aa2; font-weight:400; }
  .noteField { background:var(--notebg); border-color:#f0e2a8; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:6px; border:1px solid var(--line);
           border-radius:8px; align-items:center; }
  .chips .chip { background:#eaefff; color:var(--accent); border-radius:14px; padding:4px 10px;
           font-size:13px; display:inline-flex; gap:6px; align-items:center; }
  .chips .chip button { border:0; background:transparent; color:var(--accent); cursor:pointer;
           font-size:14px; line-height:1; padding:0; }
  .chips input { border:0; outline:0; flex:1; min-width:120px; padding:6px; font-size:14px; }
  .modal-actions { margin-top:18px; display:flex; gap:8px; align-items:center; }
  .modal-actions .spacer { flex:1; }
  .fetching { font-size:13px; color:var(--muted); padding:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Prototype 07 — click any bookmark to open & edit it; pasting a link you already have opens the existing one</p>

  <div class="row">
    <input id="urlInput" type="url" placeholder="Paste a link here…" autocomplete="off" />
    <button id="addBtn" class="primary">Add</button>
  </div>
  <div class="hint">Tip: try pasting <b>smittenkitchen.com/beans</b> — a link you already have — to see what happens.</div>

  <div class="count" id="count"></div>
  <div id="cards"></div>
</div>

<!-- editor -->
<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="banner" id="banner"></div>
    <h3 id="mTitleHead">Edit bookmark</h3>
    <div class="murl" id="mUrl"></div>
    <div id="mBody">
      <label class="fld">Title <span class="side">— from the page</span></label>
      <input id="mTitle" type="text" />
      <label class="fld">Description <span class="side">— the page's own words</span></label>
      <textarea id="mDesc"></textarea>
      <label class="fld">My notes <span class="side">— your words (optional)</span></label>
      <textarea id="mNote" class="noteField" placeholder="e.g. the sauce needs double the garlic"></textarea>
      <label class="fld">Labels</label>
      <div class="chips" id="mChips"></div>
    </div>
    <div class="modal-actions">
      <button id="mSave" class="primary">Save changes</button>
      <button id="mCancel" class="ghost">Cancel</button>
      <span class="spacer"></span>
    </div>
  </div>
</div>

<script>
  const KNOWN = {
    "seriouseats.com": { title:"The Best Pesto alla Genovese", desc:"Classic basil pesto with pine nuts, garlic, and good olive oil." }
  };
  function lookup(url){ let h=""; try{h=new URL(fix(url)).hostname.replace(/^www\./,"");}catch(e){}
    if(KNOWN[h]) return KNOWN[h];
    const n=h?h.split(".")[0]:"Saved page";
    return {title:n.charAt(0).toUpperCase()+n.slice(1)+" — page", desc:""}; }

  function fix(u){ return /^https?:\/\//i.test(u)?u:"https://"+u; }
  // Normalize a link for "same link?" comparison: drop protocol, leading www, trailing slash, lowercase.
  function normUrl(u){
    let s=u.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/+$/,"");
    return s;
  }

  let saved = [
    {id:1, t:"Simplest Brothy Beans and Rice", u:"smittenkitchen.com/beans",
     d:"A weeknight one-pot dinner: creamy beans simmered with garlic and herbs over rice.",
     note:"Needs double the garlic. Great with crusty bread.", l:["recipes","dinner"]},
    {id:2, t:"how to read more books this year", u:"nytimes.com/read-more-books",
     d:"Practical habits from lifelong readers for fitting more reading into a busy schedule.",
     note:"", l:["reading","articles"]},
    {id:3, t:"ripgrep — recursively search directories for a regex pattern", u:"github.com/BurntSushi/ripgrep",
     d:"A line-oriented search tool that recursively searches your directory for a regex pattern.",
     note:"", l:["tools","coding"]}
  ];
  let nextId=4;

  const el=id=>document.getElementById(id);
  const urlInput=el("urlInput"),addBtn=el("addBtn"),cards=el("cards"),countEl=el("count"),
        backdrop=el("backdrop"),banner=el("banner"),mUrl=el("mUrl"),mTitle=el("mTitle"),
        mDesc=el("mDesc"),mNote=el("mNote"),mChips=el("mChips"),mSave=el("mSave"),
        mCancel=el("mCancel"),mTitleHead=el("mTitleHead");

  let editing=null;        // the bookmark object being edited, or a new draft
  let isNew=false;
  let draftLabels=[];

  function render(){
    countEl.textContent=saved.length+" bookmarks";
    cards.innerHTML="";
    saved.forEach(b=>{
      const c=document.createElement("div"); c.className="card"; c.dataset.id=b.id;
      c.innerHTML='<p class="title"></p><div class="url"></div>'+
        (b.d?'<p class="desc"></p>':'')+
        (b.note?'<div class="note"><b>My note:</b> <span class="noteTxt"></span></div>':'')+
        (b.l.length?'<div class="lbls"></div>':'');
      c.querySelector(".title").textContent=b.t;
      c.querySelector(".url").textContent=b.u;
      if(b.d) c.querySelector(".desc").textContent=b.d;
      if(b.note) c.querySelector(".noteTxt").textContent=b.note;
      if(b.l.length){ const w=c.querySelector(".lbls");
        b.l.forEach(l=>{const s=document.createElement("span"); s.textContent=l; w.appendChild(s);}); }
      c.addEventListener("click",()=>openEditor(b));
      cards.appendChild(c);
    });
  }

  function renderChips(){
    mChips.innerHTML="";
    draftLabels.forEach(l=>{
      const s=document.createElement("span"); s.className="chip";
      s.innerHTML='<span></span> <button title="remove">×</button>';
      s.querySelector("span").textContent=l;
      s.querySelector("button").addEventListener("click",()=>{
        draftLabels=draftLabels.filter(x=>x!==l); renderChips(); });
      mChips.appendChild(s);
    });
    const inp=document.createElement("input"); inp.placeholder="add a label, press Enter…";
    inp.addEventListener("keydown",e=>{ const v=inp.value.trim();
      if(e.key==="Enter"&&v){ if(!draftLabels.some(x=>x.toLowerCase()===v.toLowerCase())) draftLabels.push(v);
        inp.value=""; renderChips(); mChips.querySelector("input").focus(); }});
    mChips.appendChild(inp);
  }

  function openEditor(b,{isNewDraft=false, dupOf=null}={}){
    editing=b; isNew=isNewDraft; draftLabels=[...b.l];
    banner.classList.remove("show"); banner.textContent="";
    if(dupOf){ banner.textContent="You've already saved this link — here it is. Edit and it stays one bookmark, not a copy.";
      banner.classList.add("show"); }
    mTitleHead.textContent = isNewDraft ? "Save new bookmark" : "Edit bookmark";
    mSave.textContent = isNewDraft ? "Save bookmark" : "Save changes";
    mUrl.textContent=b.u; mTitle.value=b.t; mDesc.value=b.d; mNote.value=b.note;
    renderChips(); backdrop.classList.add("show"); mTitle.focus();
  }
  function closeEditor(){ backdrop.classList.remove("show"); editing=null; }

  addBtn.addEventListener("click",()=>{
    const raw=urlInput.value.trim(); if(!raw) return;
    const existing=saved.find(b=>normUrl(b.u)===normUrl(raw));
    if(existing){ openEditor(existing,{dupOf:existing}); urlInput.value=""; return; }
    // new link: simulate reading the page, then open editor as a new draft
    const m=lookup(raw);
    openEditor({id:nextId, t:m.title, u:normUrl(raw), d:m.desc, note:"", l:[]},{isNewDraft:true});
    urlInput.value="";
  });
  urlInput.addEventListener("keydown",e=>{if(e.key==="Enter")addBtn.click();});

  mSave.addEventListener("click",()=>{
    const rec={ id:editing.id, u:editing.u, t:mTitle.value.trim(), d:mDesc.value.trim(),
                note:mNote.value.trim(), l:[...draftLabels] };
    if(isNew){ rec.id=nextId++; saved.unshift(rec); }
    else { const i=saved.findIndex(b=>b.id===editing.id); saved[i]=rec; }
    closeEditor(); render();
  });
  mCancel.addEventListener("click",closeEditor);
  backdrop.addEventListener("click",e=>{ if(e.target===backdrop) closeEditor(); });

  render();
</script>
</body>
</html>
