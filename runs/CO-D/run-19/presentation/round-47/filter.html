<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep — label filtering interaction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" data-harness-ready="true">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Keep home"><span class="brand-mark">K</span><span>Keep</span></a>
      <div class="avatar" aria-label="Personal library">You</div>
    </header>

    <section class="hero search-hero">
      <p class="eyebrow">YOUR LIBRARY</p>
      <h1>Find your way back.</h1>
      <div class="search-box">
        <span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search your bookmarks" autocomplete="off" aria-label="Search bookmarks"><kbd>/</kbd>
      </div>
    </section>

    <section class="library search-library" aria-labelledby="results-heading">
      <div id="label-toolbar" class="label-toolbar" hidden>
        <span>Filter by label</span><div id="toolbar-labels" class="toolbar-labels"></div>
      </div>
      <div id="active-filter" class="active-filter" hidden>
        <span>Showing label <strong id="active-label"></strong></span><button id="clear-filter" type="button">Show all ×</button>
      </div>
      <div class="section-heading">
        <div><p class="eyebrow">ALL BOOKMARKS</p><h2 id="results-heading">Your saved links</h2></div>
        <span id="result-count" class="count">5 bookmarks</span>
      </div>
      <div id="filter-results" class="bookmark-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="filter.js"></script>
</body>
</html>
