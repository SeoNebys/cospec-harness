<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>My Bookmarks</h1>
      <p class="sub">Paste a link. It sorts itself out.</p>
    </header>

    <div class="saver">
      <input id="url" type="text" placeholder="Paste a link and press Save…" autocomplete="off" spellcheck="false">
      <button id="save" class="primary">Save</button>
    </div>
    <p class="inlineerr" id="urlerr"></p>
    <label class="savetoread"><input type="checkbox" id="savetoread"> Add it to my “to read” pile</label>

    <div class="searchwrap">
      <span class="ic">🔍</span>
      <input id="search" type="text" placeholder="Search your bookmarks — a word from the title, summary, or your notes…" autocomplete="off">
      <button class="clr" id="searchclr" title="Clear search" aria-label="Clear search">×</button>
    </div>

    <div class="bars">
      <div class="filterbar" id="filterbar"></div>
      <div class="sortwrap">
        <label>Sort
          <select id="sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="az">By name (A–Z)</option>
          </select>
        </label>
        <button class="line" id="importbtn">⬆ Import</button>
        <button class="line" id="exportbtn">⬇ Export</button>
      </div>
    </div>

    <p class="statusline" id="statusline"></p>
    <div class="notice" id="notice"></div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" style="display:none"></div>
    <div class="more" id="more"></div>
  </div>

  <!-- import dialog -->
  <div class="overlay" id="importoverlay" style="display:none">
    <div class="dialog" id="importdialog"></div>
  </div>

  <input type="file" id="importfile" accept=".html,.htm" style="display:none">
  <div class="toast" id="toast"><span id="toastmsg"></span><button id="toastaction"></button></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
