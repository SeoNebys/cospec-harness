<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks — labels</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#6b7480; --line:#e6e9ee;
    --accent:#2f6df6; --flash:#fff6d6; --chip:#eef1f6; --chipink:#3a4658; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }

  .saver { display:flex; gap:10px; margin-bottom:8px; }
  .saver input { flex:1; padding:13px 15px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); outline:none; }
  .saver input:focus { border-color:var(--accent); }
  .saver button { padding:0 20px; font-size:15px; font-weight:600; color:#fff;
    background:var(--accent); border:none; border-radius:10px; cursor:pointer; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .notice { background:#eef3ff; border:1px solid #d4e0ff; border-radius:10px; padding:10px 14px;
    font-size:13.5px; margin:0 0 16px; display:none; }

  /* filter bar */
  .filterbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 6px; }
  .filterbar .fb { border:1px solid var(--line); background:#fff; color:var(--chipink); border-radius:999px;
    padding:6px 13px; font:inherit; font-size:13px; cursor:pointer; }
  .filterbar .fb:hover { border-color:#cdd3db; }
  .filterbar .fb.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .filterbar .fb .n { opacity:.6; margin-left:5px; }
  .filterstate { color:var(--muted); font-size:13px; margin:0 0 12px; min-height:18px; }
  .filterstate b { color:var(--ink); }

  ul { list-style:none; margin:0; padding:0; }
  li.item { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start;
    transition:background .25s,border-color .25s; }
  li.item.flash { background:var(--flash); border-color:#f0e3a8; }
  .favicon { width:32px; height:32px; border-radius:8px; flex:none; background:#eef1f6;
    display:grid; place-items:center; font-size:16px; }
  .body { min-width:0; flex:1; }
  .title { font-weight:600; font-size:15.5px; margin:0 0 2px; }
  .title a { color:var(--ink); text-decoration:none; }
  .title a:hover { text-decoration:underline; }
  .desc { color:var(--muted); font-size:13.5px; margin:0 0 6px; }
  .meta { color:var(--muted); font-size:12.5px; margin:0 0 6px; }
  .rowlabels { display:flex; flex-wrap:wrap; gap:6px; }
  .lchip { background:var(--chip); color:var(--chipink); border-radius:999px; padding:3px 10px;
    font-size:12.5px; cursor:pointer; border:1px solid transparent; }
  .lchip:hover { border-color:#cdd3db; }
  .actions { flex:none; }
  .btn { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:8px;
    padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
  .btn:hover { border-color:#cdd3db; color:var(--ink); }

  /* edit form */
  .editform { flex:1; }
  .editform label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  .editform label:first-child { margin-top:0; }
  .edit-field { width:100%; font:inherit; color:var(--ink); border:1px solid var(--accent);
    border-radius:6px; padding:6px 8px; outline:none; }
  textarea.edit-field { resize:vertical; min-height:44px; }

  /* label editor */
  .labelbox { border:1px solid var(--accent); border-radius:6px; padding:6px; }
  .labelbox .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .echip { background:var(--chip); color:var(--chipink); border-radius:999px; padding:3px 6px 3px 10px;
    font-size:12.5px; display:inline-flex; align-items:center; gap:4px; }
  .echip button { border:none; background:none; cursor:pointer; color:var(--muted); font-size:14px;
    line-height:1; padding:0 2px; }
  .echip button:hover { color:#c0392b; }
  .labelinput { border:none; outline:none; font:inherit; padding:4px; min-width:120px; flex:1; }
  .suggest { position:relative; }
  .suggest .drop { position:absolute; left:0; right:0; top:4px; background:#fff; border:1px solid var(--line);
    border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); padding:5px; z-index:5; max-height:220px; overflow:auto; }
  .suggest .drop button { display:flex; width:100%; justify-content:space-between; align-items:center;
    text-align:left; border:none; background:none; padding:8px 10px; border-radius:7px; font:inherit;
    cursor:pointer; color:var(--ink); }
  .suggest .drop button:hover, .suggest .drop button.hi { background:#f2f4f8; }
  .suggest .drop .tag { color:var(--muted); font-size:12px; }
  .suggest .drop .create { color:var(--accent); }

  .formbtns { margin-top:12px; display:flex; gap:8px; align-items:center; }
  .formbtns .done { background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:8px 16px; font:inherit; font-weight:600; cursor:pointer; }
  .formbtns .cancel { background:none; border:none; color:var(--muted); font:inherit; cursor:pointer; padding:8px 6px; }
  .formbtns .cancel:hover { color:var(--ink); text-decoration:underline; }

  .spinner { width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Paste a link. It sorts itself out.</p>

    <div class="saver">
      <input id="url" type="text" placeholder="Paste a link and press Save…" autocomplete="off">
      <button id="save">Save</button>
    </div>
    <p class="hint">Open <b>Edit</b> on any link to add labels. Try typing <code>recipe</code> — it should
       offer your existing <b>recipes</b> so you don't make a second pile. Then click a label in the bar above the list to pull up just those.</p>

    <div class="notice" id="notice"></div>
    <div class="filterbar" id="filterbar"></div>
    <p class="filterstate" id="filterstate"></p>
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none">Nothing here.</div>
  </div>

<script>
const KNOWN={ "nytimes.com":{site:"The New York Times",emoji:"🗞️"},
  "cooking.nytimes.com":{site:"NYT Cooking",emoji:"🍝"}, "github.com":{site:"GitHub",emoji:"🐙"},
  "youtube.com":{site:"YouTube",emoji:"▶️"}, "wikipedia.org":{site:"Wikipedia",emoji:"📚"},
  "bbc.com":{site:"BBC",emoji:"📰"}, "stackoverflow.com":{site:"Stack Overflow",emoji:"💬"} };
const JUNK=new Set(["utm_source","utm_medium","utm_campaign","utm_term","utm_content",
  "fbclid","gclid","mc_cid","mc_eid","igshid","ref","ref_src","spm","_hsenc","_hsmi"]);
function titleCase(s){return s.replace(/[-_]+/g," ").replace(/\.[a-z]{2,4}$/i,"").trim()
  .replace(/\s+/g," ").replace(/\b\w/g,c=>c.toUpperCase());}
function parse(raw){ try { return new URL(raw.includes("://")?raw:"https://"+raw); } catch { return null; } }
function normalize(raw){
  const u=parse(raw); if(!u) return null;
  const host=u.hostname.replace(/^www\./,"").toLowerCase();
  const path=u.pathname.replace(/\/+$/,"");
  const kept=[...u.searchParams.entries()].filter(([k])=>!JUNK.has(k.toLowerCase()))
    .sort((a,b)=>a[0]<b[0]?-1:1).map(([k,v])=>k+"="+v).join("&");
  return host+path+(kept?"?"+kept:"");
}
function resolve(raw){
  const u=parse(raw); if(!u) return null;
  const host=u.hostname.replace(/^www\./,"");
  const key=Object.keys(KNOWN).find(k=>host===k||host.endsWith("."+k))||host;
  const known=KNOWN[key]||{site:titleCase(host.split(".")[0]),emoji:"🔖"};
  const seg=u.pathname.split("/").filter(Boolean).pop()||"";
  let title=seg?titleCase(decodeURIComponent(seg)):known.site+" — home";
  if(title.length>70) title=title.slice(0,67)+"…";
  return { id:normalize(raw), url:u.href, host, site:known.site, emoji:known.emoji, title,
    desc:"A page on "+known.site+".", labels:[] };
}

const list=document.getElementById("list"), empty=document.getElementById("empty"),
  notice=document.getElementById("notice"), filterbar=document.getElementById("filterbar"),
  filterstate=document.getElementById("filterstate");

const items=[
  { id:normalize("cooking.nytimes.com/recipes/lemon-pasta"), url:"https://cooking.nytimes.com/recipes/lemon-pasta",
    host:"cooking.nytimes.com", site:"NYT Cooking", emoji:"🍝", title:"Lemon pasta",
    desc:"A page on NYT Cooking.", labels:["recipes"] },
  { id:normalize("bbc.com/news/future-of-work"), url:"https://www.bbc.com/news/future-of-work",
    host:"bbc.com", site:"BBC", emoji:"📰", title:"The future of work",
    desc:"A page on BBC.", labels:["work stuff","articles to read"] },
  { id:normalize("github.com/acme/dashboard"), url:"https://github.com/acme/dashboard",
    host:"github.com", site:"GitHub", emoji:"🐙", title:"Acme Dashboard",
    desc:"A page on GitHub.", labels:["work stuff"] },
];
// Known labels persist for the session so suggestions never vanish.
const knownLabels=new Set();
items.forEach(it=>it.labels.forEach(l=>knownLabels.add(l)));

let editing=null, filter=null;

function showNotice(m){ notice.textContent=m; notice.style.display="block";
  clearTimeout(showNotice._t); showNotice._t=setTimeout(()=>notice.style.display="none",4500); }
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function cssEsc(s){return s.replace(/["\\]/g,"\\$&");}
function countFor(label){ return items.filter(it=>it.labels.includes(label)).length; }

function renderFilterbar(){
  filterbar.innerHTML="";
  const all=document.createElement("button"); all.className="fb"+(filter===null?" on":"");
  all.innerHTML=`All <span class="n">${items.length}</span>`;
  all.addEventListener("click",()=>{ filter=null; render(); });
  filterbar.appendChild(all);
  [...knownLabels].sort().forEach(l=>{
    const b=document.createElement("button"); b.className="fb"+(filter===l?" on":"");
    b.innerHTML=`${esc(l)} <span class="n">${countFor(l)}</span>`;
    b.addEventListener("click",()=>{ filter=(filter===l?null:l); render(); });
    filterbar.appendChild(b);
  });
}

function render(){
  renderFilterbar();
  const shown=filter?items.filter(it=>it.labels.includes(filter)):items;
  filterstate.innerHTML = filter
    ? `Showing <b>${esc(filter)}</b> — ${shown.length} link${shown.length===1?"":"s"}. <a href="#" id="clr">show all</a>`
    : "";
  const clr=document.getElementById("clr"); if(clr) clr.addEventListener("click",e=>{e.preventDefault();filter=null;render();});
  list.innerHTML=""; empty.style.display=shown.length?"none":"block";
  empty.textContent = filter ? `No links labelled "${filter}" yet.` : "Nothing saved yet.";
  shown.forEach(it=>{
    const li=document.createElement("li"); li.className="item"; li.dataset.id=it.id;
    if(editing===it.id){ renderEdit(li,it); list.appendChild(li); return; }
    const chips=it.labels.map(l=>`<span class="lchip" data-l="${esc(l)}">${esc(l)}</span>`).join("");
    li.innerHTML=`<div class="favicon">${it.emoji}</div>
      <div class="body">
        <p class="title"><a href="${it.url}" target="_blank" rel="noopener">${esc(it.title)}</a></p>
        <p class="desc">${esc(it.desc)}</p>
        <p class="meta">${it.site} · ${it.host}</p>
        <div class="rowlabels">${chips||'<span class="meta" style="margin:0">No labels yet</span>'}</div>
      </div>
      <div class="actions"><button class="btn">Edit</button></div>`;
    li.querySelector(".btn").addEventListener("click",()=>{ editing=it.id; render(); });
    li.querySelectorAll(".lchip").forEach(c=>c.addEventListener("click",()=>{ filter=c.dataset.l; render(); }));
    list.appendChild(li);
  });
}

function renderEdit(li,it){
  const draft={ title:it.title, desc:it.desc, labels:[...it.labels] };
  li.innerHTML=`<div class="favicon">${it.emoji}</div>
    <div class="editform">
      <label>Title</label><input class="edit-field t" value="${esc(it.title)}">
      <label>Summary</label><textarea class="edit-field d">${esc(it.desc)}</textarea>
      <label>Labels</label>
      <div class="labelbox"><div class="chips" id="chips"></div></div>
      <div class="suggest" id="suggest"></div>
      <div class="formbtns"><button class="done">Done</button><button class="cancel">Cancel</button></div>
    </div>`;
  const chipsEl=li.querySelector("#chips"), suggestEl=li.querySelector("#suggest");

  function drawChips(){
    chipsEl.innerHTML="";
    draft.labels.forEach(l=>{
      const c=document.createElement("span"); c.className="echip";
      c.innerHTML=`${esc(l)} <button title="remove">×</button>`;
      c.querySelector("button").addEventListener("click",()=>{ draft.labels=draft.labels.filter(x=>x!==l); drawChips(); });
      chipsEl.appendChild(c);
    });
    const inp=document.createElement("input"); inp.className="labelinput";
    inp.placeholder=draft.labels.length?"Add another…":"Add a label…";
    inp.addEventListener("input",()=>drawSuggest(inp));
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){ e.preventDefault(); const first=suggestEl.querySelector(".drop button"); if(first) first.click(); }
      if(e.key==="Backspace" && !inp.value && draft.labels.length){ draft.labels.pop(); drawChips(); inp2focus(); }
      if(e.key==="Escape"){ e.preventDefault(); editing=null; render(); }
    });
    chipsEl.appendChild(inp);
    inp.focus();
  }
  function inp2focus(){ const i=chipsEl.querySelector(".labelinput"); if(i){ i.focus(); drawSuggest(i);} }

  function addLabel(name){
    const clean=name.trim(); if(!clean) return;
    // reuse case-insensitive existing label instead of making a near-duplicate
    const existing=[...knownLabels].find(l=>l.toLowerCase()===clean.toLowerCase());
    const final=existing||clean;
    if(!draft.labels.includes(final)) draft.labels.push(final);
    knownLabels.add(final);
    drawChips();
  }

  function drawSuggest(inp){
    const q=inp.value.trim().toLowerCase();
    suggestEl.innerHTML="";
    if(!q){ return; }
    const matches=[...knownLabels].filter(l=>l.toLowerCase().includes(q) && !draft.labels.includes(l)).sort();
    const drop=document.createElement("div"); drop.className="drop";
    matches.forEach(l=>{
      const b=document.createElement("button");
      b.innerHTML=`<span>${esc(l)}</span><span class="tag">reuse existing</span>`;
      b.addEventListener("click",()=>{ addLabel(l); inp2focus(); });
      drop.appendChild(b);
    });
    const exact=[...knownLabels].some(l=>l.toLowerCase()===q);
    if(!exact){
      const c=document.createElement("button");
      c.innerHTML=`<span class="create">＋ Create “${esc(inp.value.trim())}”</span><span class="tag">new label</span>`;
      c.addEventListener("click",()=>{ addLabel(inp.value); inp2focus(); });
      drop.appendChild(c);
    }
    suggestEl.appendChild(drop);
  }

  li.querySelector(".t").focus();
  drawChips();
  li.querySelector(".done").addEventListener("click",()=>{
    const t=li.querySelector(".t").value.trim(), d=li.querySelector(".d").value.trim();
    if(t) it.title=t; if(d) it.desc=d; it.labels=[...draft.labels]; editing=null; render();
  });
  li.querySelector(".cancel").addEventListener("click",()=>{ editing=null; render(); });
  li.querySelector(".t").addEventListener("keydown",e=>{ if(e.key==="Escape"){ editing=null; render(); } });
  li.querySelector(".d").addEventListener("keydown",e=>{ if(e.key==="Escape"){ editing=null; render(); } });
}

function flash(id){ const li=list.querySelector(`li[data-id="${cssEsc(id)}"]`); if(!li) return;
  li.classList.add("flash"); li.scrollIntoView({behavior:"smooth",block:"center"});
  setTimeout(()=>li.classList.remove("flash"),1600); }

const input=document.getElementById("url"), btn=document.getElementById("save");
function save(){
  const raw=input.value.trim(); if(!raw) return;
  const r=resolve(raw); if(!r){ alert("That doesn't look like a link yet."); return; }
  input.value="";
  const existing=items.find(x=>x.id===r.id);
  if(existing){ filter=null; showNotice("You already saved this one — here it is."); render(); flash(existing.id); return; }
  filter=null; render();
  const li=document.createElement("li"); li.className="item"; empty.style.display="none";
  li.innerHTML=`<div class="favicon"><div class="spinner"></div></div>
    <div class="body"><p class="title">Figuring out this page…</p><p class="meta">Reading the title and summary</p></div>`;
  list.insertBefore(li,list.firstChild);
  setTimeout(()=>{ items.unshift(r); render(); },850);
}
btn.addEventListener("click",save);
input.addEventListener("keydown",e=>{ if(e.key==="Enter") save(); });
render();
</script>
</body>
</html>
