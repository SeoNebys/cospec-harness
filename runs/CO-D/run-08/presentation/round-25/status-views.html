<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Home — Status collection comparison</title>
<style>:root{--ink:#17201d;--muted:#66736e;--line:#dce4df;--green:#236b4b;--soft:#edf6f0}*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{width:min(980px,calc(100% - 32px));margin:38px auto}h1{font:700 30px/1.1 Georgia,serif;margin:0}.sub{color:var(--muted);margin:6px 0 20px}button{cursor:pointer;font:700 14px system-ui}.versions{display:flex;gap:8px;margin-bottom:18px}.versions button,.view-btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--ink)}.versions .active,.view-btn.active{background:var(--green);color:#fff;border-color:var(--green)}.version{display:none}.version.active{display:block}.topnav{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:10px}.layout{display:grid;grid-template-columns:180px 1fr;gap:18px}.sidenav{display:flex;flex-direction:column;gap:7px}.sidenav .view-btn{text-align:left}.panel{min-width:0}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 7px 22px #142a200b}.row{display:flex;justify-content:space-between;gap:16px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.card h2{font-size:19px;margin:6px 0}.card p{color:#46534e;margin:0}.action{border:0;border-radius:9px;padding:10px 13px;background:var(--green);color:#fff;white-space:nowrap}.empty{display:none;padding:44px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.column{background:#eef1ed;border-radius:14px;padding:14px;min-height:260px}.column h2{font-size:17px;margin:0 0 12px}.column .card{box-shadow:none}.hint{font-size:14px;color:var(--muted);margin-top:12px}@media(max-width:680px){.columns,.layout{grid-template-columns:1fr}.sidenav{flex-direction:row}}</style></head><body><main data-harness-ready="true"><h1>Link Home</h1><p class="sub">Move JavaScript | MDN to Done, then find it in its new place.</p><nav class="versions"><button class="active" data-version="a">Version 1</button><button data-version="b">Version 2</button><button data-version="c">Version 3</button></nav>
<section class="version active" id="a"><nav class="topnav"><button class="view-btn active" data-view="read">To read <span>2</span></button><button class="view-btn" data-view="done">Done <span>1</span></button></nav><div class="panel"></div><p class="hint">Move the bookmark, then use the collection tabs to find it.</p></section>
<section class="version" id="b"><div class="layout"><nav class="sidenav"><button class="view-btn active" data-view="read">To read <span>2</span></button><button class="view-btn" data-view="done">Done <span>1</span></button></nav><div class="panel"></div></div><p class="hint">Move the bookmark, then use the collection navigation to find it.</p></section>
<section class="version" id="c"><div class="columns"><div class="column" data-col="read"><h2>To read · <span>2</span></h2><div class="panel"></div></div><div class="column" data-col="done"><h2>Done · <span>1</span></h2><div class="panel"></div></div></div><p class="hint">Move the bookmark and watch it cross to the other pile.</p></section>
<script>const initial=[{id:'mdn',title:'JavaScript | MDN',desc:'Guides and references for the JavaScript language.',status:'read'},{id:'design',title:'Designing for the Web',desc:'Practical principles for clear interfaces.',status:'read'},{id:'eloquent',title:'Eloquent JavaScript',desc:'A modern introduction to programming.',status:'done'}];const state={a:structuredClone(initial),b:structuredClone(initial),c:structuredClone(initial)},views={a:'read',b:'read'};function card(item,v){return `<article class="card"><div class="row"><div><div class="eyebrow">${item.status==='read'?'To read':'Done'}</div><h2>${item.title}</h2></div><button class="action" data-move="${item.id}" data-v="${v}">${item.status==='read'?'Mark done':'Move to To read'}</button></div><p>${item.desc}</p></article>`}function render(v){const root=document.querySelector('#'+v),items=state[v],r=items.filter(x=>x.status==='read'),d=items.filter(x=>x.status==='done');root.querySelectorAll('[data-view="read"] span').forEach(x=>x.textContent=r.length);root.querySelectorAll('[data-view="done"] span').forEach(x=>x.textContent=d.length);if(v==='c'){root.querySelector('[data-col="read"] h2 span').textContent=r.length;root.querySelector('[data-col="done"] h2 span').textContent=d.length;root.querySelector('[data-col="read"] .panel').innerHTML=r.map(x=>card(x,v)).join('');root.querySelector('[data-col="done"] .panel').innerHTML=d.map(x=>card(x,v)).join('')}else{root.querySelector('.panel').innerHTML=items.filter(x=>x.status===views[v]).map(x=>card(x,v)).join('');root.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===views[v]))}bind()}function bind(){document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const x=state[b.dataset.v].find(i=>i.id===b.dataset.move);x.status=x.status==='read'?'done':'read';render(b.dataset.v)});document.querySelectorAll('.version .view-btn').forEach(b=>b.onclick=()=>{const v=b.closest('.version').id;views[v]=b.dataset.view;render(v)})}document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-version],.version').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.version).classList.add('active')});['a','b','c'].forEach(render);</script></main></body></html>
