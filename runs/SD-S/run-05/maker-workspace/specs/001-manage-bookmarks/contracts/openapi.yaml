openapi: 3.1.0
info:
  title: Bookmark Manager Internal API
  version: 1.0.0
  description: Same-origin JSON contract for the single-user bookmark application.
servers:
  - url: /api
paths:
  /bookmarks:
    get:
      operationId: listBookmarks
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 300 }
        - name: tag
          in: query
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: Newest-first matching bookmarks
          content:
            application/json:
              schema:
                type: object
                required: [bookmarks, total]
                properties:
                  bookmarks:
                    type: array
                    items: { $ref: "#/components/schemas/Bookmark" }
                  total: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkInput" }
      responses:
        "201":
          description: Bookmark created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/DuplicateError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /bookmarks/{id}:
    parameters:
      - $ref: "#/components/parameters/BookmarkId"
    put:
      operationId: updateBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkInput" }
      responses:
        "200":
          description: Bookmark updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/DuplicateError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      operationId: deleteBookmark
      responses:
        "204": { description: Bookmark deleted }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /tags:
    get:
      operationId: listTags
      responses:
        "200":
          description: Tags with current bookmark counts, sorted by display name
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/TagSummary" }
  /metadata:
    post:
      operationId: previewMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: Completed, partial, or unavailable metadata preview; retrieval failures use this stable fallback response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataPreview" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429":
          description: Preview rate limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    BookmarkId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    BookmarkInput:
      type: object
      additionalProperties: false
      required: [url, title, tags]
      properties:
        url: { type: string, minLength: 1, maxLength: 4096 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description:
          oneOf:
            - { type: string, maxLength: 300 }
            - { type: "null" }
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 40 }
    Bookmark:
      allOf:
        - $ref: "#/components/schemas/BookmarkInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TagSummary:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        count: { type: integer, minimum: 1 }
    MetadataPreview:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [complete, partial, unavailable]
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 300 }
        finalUrl: { type: string, format: uri, maxLength: 4096 }
        reason:
          type: string
          enum: [invalid_url, blocked_destination, timeout, unsupported_content, unavailable, metadata_missing]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_error, duplicate_url, not_found, unsupported_media_type, rate_limited, internal_error]
            message: { type: string }
            field: { type: string }
            existingBookmarkId: { type: string, format: uuid }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DuplicateError:
      description: A bookmark with the normalized URL already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFoundError:
      description: Bookmark not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Request body must be JSON
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
