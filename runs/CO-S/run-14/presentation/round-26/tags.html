<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — tags exploration</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#e3e6ea; --muted:#6b7280; --faint:#9aa1ac; --accent:#2563eb; --accent-soft:#eff4ff; --chip:#eef2f7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:#1f2430; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 24px; }
  header h1 { margin:0; font-size:19px; }
  .modebar { max-width:760px; margin:0 auto; padding:12px 24px 0; display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); }
  .modebar a { text-decoration:none; padding:5px 11px; border-radius:999px; border:1px solid var(--line); color:#374151; background:#fff; }
  .modebar a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .modedesc { max-width:760px; margin:8px auto 0; padding:0 24px; color:var(--muted); font-size:13px; }
  .wrap { max-width:760px; margin:0 auto; padding:16px 24px 32px; }
  .saver { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .saver .row { display:flex; gap:10px; }
  .saver input.url { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  input:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .btn { padding:11px 18px; background:var(--accent); color:#fff; border:0; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.sm { padding:6px 12px; font-size:13px; }
  .btn.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .hint { color:var(--muted); font-size:12px; margin:8px 2px 0; }
  .savefields { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .listhead { margin:24px 2px 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; display:flex; gap:14px; }
  .card.justadded { animation: pop 1s ease; border-color:var(--accent); }
  @keyframes pop { 0%{background:var(--accent-soft);} 100%{background:var(--card);} }
  .thumb { flex:0 0 96px; width:96px; height:72px; border-radius:8px; overflow:hidden; background:#eef1f5; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb.none { display:none; }
  .body { flex:1; min-width:0; }
  .titlerow { display:flex; align-items:center; gap:8px; }
  .favi { flex:0 0 18px; width:18px; height:18px; border-radius:4px; }
  .title { font-size:15px; font-weight:600; color:#111827; text-decoration:none; }
  .title:hover { text-decoration:underline; }
  .desc { color:#3f4653; font-size:13px; margin-top:5px; line-height:1.45; }
  .note { color:#5b4636; background:#fff8ec; border:1px solid #f1e2c4; border-radius:7px; padding:6px 9px; font-size:12.5px; margin-top:8px; }
  .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { background:var(--chip); color:#374151; border-radius:999px; padding:3px 10px; font-size:12px; display:inline-flex; align-items:center; gap:6px; }
  .chip .x { cursor:pointer; color:var(--faint); font-weight:700; }
  .addtag, .addnote { background:none; border:1px dashed var(--line); color:var(--muted); border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .taginput { border:1px solid var(--accent); border-radius:999px; padding:3px 10px; font-size:12px; width:130px; }
  .noteinput { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; resize:vertical; }
  .sub { color:var(--faint); font-size:12px; margin-top:8px; }
  .sub .site { color:var(--muted); }
  .filling { color:var(--accent); font-size:14px; font-weight:500; }
  .editor { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; }
  .editor .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); margin-bottom:4px; }
  .editrow { margin-bottom:9px; }
  .dismiss { color:var(--muted); font-size:12px; cursor:pointer; margin-left:8px; }
</style>
</head>
<body>
<header><h1>My Bookmarks</h1></header>
<div class="modebar">
  <span>How tags &amp; notes are added:</span>
  <a href="?mode=a" data-m="a">A · After saving</a>
  <a href="?mode=b" data-m="b">B · While saving</a>
  <a href="?mode=c" data-m="c">C · Save then jump in</a>
</div>
<div class="modedesc" id="modedesc"></div>

<div class="wrap">
  <div class="saver">
    <div class="row">
      <input class="url" id="url" type="text" placeholder="Paste a link to save…" autocomplete="off" />
      <button class="btn" id="save">Save</button>
    </div>
    <div class="savefields" id="savefields" style="display:none;">
      <div>
        <div class="lbl" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:4px;">Tags</div>
        <div class="tags" id="saveTags"></div>
      </div>
      <div>
        <div class="lbl" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:4px;">Note</div>
        <textarea class="noteinput" id="saveNote" rows="2" placeholder="Why are you saving this? (optional)"></textarea>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="listhead">Saved</div>
  <div id="list"></div>
</div>

<script>
// ---- shared auto-detail simulation (approved in SCN-001) ----
function ico(bg, glyph){ return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="'+bg+'"/><text x="16" y="22" font-family="Arial" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">'+glyph+'</text></svg>'); }
function prev(c1,c2,l){ return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 144"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><rect width="192" height="144" fill="url(#g)"/><text x="96" y="80" font-family="Arial" font-size="16" fill="#fff" opacity="0.9" text-anchor="middle">'+l+'</text></svg>'); }
const CANNED = {
  "github.com":{title:"torvalds/linux: Linux kernel source tree",site:"GitHub",desc:"The official mirror of the Linux kernel source, maintained by Linus Torvalds and contributors.",icon:ico('#24292f','G'),preview:prev('#2b3137','#57606a','GitHub')},
  "nytimes.com":{title:"How Cities Are Rethinking Public Space",site:"The New York Times",desc:"Planners are turning parking lots and empty lots into parks, plazas and community gardens.",icon:ico('#000','T'),preview:prev('#4b6cb7','#182848','NYT')},
  "en.wikipedia.org":{title:"Photosynthesis — Wikipedia",site:"Wikipedia",desc:"The process by which green plants convert light energy into chemical energy stored in glucose.",icon:ico('#111','W'),preview:null},
  "medium.com":{title:"The Quiet Power of Note-Taking",site:"Medium",desc:"Why writing things down changes how you think, not just what you remember.",icon:ico('#000','M'),preview:prev('#3a3a3a','#111','Medium')},
};
function domainOf(raw){ try{ let u=new URL(raw.includes("://")?raw:"https://"+raw); return u.hostname.replace(/^www\./,""); }catch(e){ return null; } }
function titleCase(s){ return s.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
function guessMeta(raw){ const h=domainOf(raw); if(!h) return null; if(CANNED[h]) return CANNED[h];
  let site=titleCase(h.split(".")[0]); let title;
  try{ const u=new URL(raw.includes("://")?raw:"https://"+raw); const seg=u.pathname.split("/").filter(Boolean).pop(); title=seg?titleCase(decodeURIComponent(seg).replace(/\.\w+$/,""))+" — "+site:site+" — Home"; }catch(e){ title=site; }
  return {title,site,desc:"A page on "+site+". A short description is pulled from the page when available.",icon:ico('#2563eb',site.charAt(0).toUpperCase()),preview:null}; }

// ---- mode ----
const mode = (new URLSearchParams(location.search).get("mode")||"a").toLowerCase();
const DESC = {
  a: "Version A — Saving is one tap. Tags and a note are added afterward, right on the saved item (look for the “＋ Tag” and “＋ Note” buttons).",
  b: "Version B — A Tags field and Note box sit in the save area. You fill them in first, then press Save to store everything at once.",
  c: "Version C — Saving is one tap, and the just-saved item immediately opens a small editor so you can type tags and a note right away — or dismiss it.",
};
document.getElementById("modedesc").textContent = DESC[mode];
document.querySelectorAll(".modebar a").forEach(a=>{ if(a.dataset.m===mode) a.classList.add("on"); });
document.getElementById("hint").textContent = (mode==="b")
  ? "Paste a link, add any tags and a note, then press Save."
  : "Paste a link and press Save.";
if(mode==="b") document.getElementById("savefields").style.display="";

// ---- state ----
let items = [
  { id:2, title:"A Field Guide to Getting Lost", site:"Longreads", desc:"Rebecca Solnit on wandering, uncertainty, and the value of not knowing where you are headed.", url:"https://longreads.com/field-guide", icon:ico('#e2574c','L'), preview:prev('#e2574c','#8a2b24','Longreads'), when:"2 days ago", tags:["reading","essays"], note:"" },
  { id:1, title:"CSS Grid: A Complete Guide", site:"CSS-Tricks", desc:"A comprehensive reference to every property in the CSS Grid layout module, with visual examples.", url:"https://css-tricks.com/snippets/css/complete-guide-grid", icon:ico('#ff7f50','C'), preview:null, when:"5 days ago", tags:["dev","reference"], note:"Bookmark for the grid layout at work." },
];
let nextId=3, openEditor=null;
const listEl=document.getElementById("list");
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// save-area chip input (mode B)
let saveTags=[];
function renderSaveTags(){
  const c=document.getElementById("saveTags"); c.innerHTML="";
  saveTags.forEach((t,i)=>{ const s=document.createElement("span"); s.className="chip"; s.innerHTML=esc(t)+' <span class="x">×</span>'; s.querySelector(".x").onclick=()=>{saveTags.splice(i,1);renderSaveTags();}; c.appendChild(s); });
  const inp=document.createElement("input"); inp.className="taginput"; inp.placeholder="add tag…";
  inp.onkeydown=e=>{ if((e.key==="Enter"||e.key===",")&&inp.value.trim()){ e.preventDefault(); saveTags.push(inp.value.trim().replace(/,$/,"")); renderSaveTags(); c.querySelector("input").focus(); } };
  c.appendChild(inp);
}
if(mode==="b") renderSaveTags();

function chipHtml(it){
  let h='<div class="tags">';
  it.tags.forEach((t,i)=>{ h+='<span class="chip" data-i="'+i+'">'+esc(t)+' <span class="x" data-del="'+i+'">×</span></span>'; });
  if(it._tagediting){ h+='<input class="taginput" data-taginput="1" placeholder="add tag…">'; }
  else { h+='<button class="addtag" data-addtag="1">＋ Tag</button>'; }
  h+='</div>';
  return h;
}
function render(justId){
  listEl.innerHTML="";
  items.forEach(it=>{
    const card=document.createElement("div"); card.className="card"+(it.id===justId?" justadded":"");
    if(it.filling){ card.innerHTML='<div class="thumb none"></div><div class="body"><div class="filling">Getting details…</div></div>'; listEl.appendChild(card); return; }
    const thumb=it.preview?'<div class="thumb"><img alt="" src="'+it.preview+'"></div>':'<div class="thumb none"></div>';
    let inner=thumb+'<div class="body">'+
      '<div class="titlerow"><img class="favi" alt="" src="'+it.icon+'"><a class="title" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></div>'+
      '<div class="desc">'+esc(it.desc)+'</div>';
    if(it.note) inner+='<div class="note">📝 '+esc(it.note)+'</div>';
    else if(mode==="a") inner+='';
    inner+=chipHtml(it);
    if(mode==="a" && !it.note && !it._noteediting) inner+='<div style="margin-top:6px;"><button class="addnote" data-addnote="1">＋ Note</button></div>';
    if(it._noteediting) inner+='<div style="margin-top:8px;"><textarea class="noteinput" data-noteinput="1" rows="2" placeholder="Why did you save this?">'+esc(it.note||"")+'</textarea><button class="btn sm" data-savenote="1" style="margin-top:6px;">Save note</button></div>';
    if(it._editor){ // mode C editor
      inner+='<div class="editor">'+
        '<div class="editrow"><div class="lbl">Tags</div><div class="tags" data-ceditor-tags="1"></div></div>'+
        '<div class="editrow"><div class="lbl">Note</div><textarea class="noteinput" data-ceditor-note="1" rows="2" placeholder="Why did you save this? (optional)">'+esc(it.note||"")+'</textarea></div>'+
        '<button class="btn sm" data-cdone="1">Done</button><span class="dismiss" data-cdismiss="1">skip for now</span>'+
      '</div>';
    }
    inner+='<div class="sub"><span class="site">'+esc(it.site)+'</span> · saved '+(it.when||"just now")+'</div></div>';
    card.innerHTML=inner;
    wire(card,it);
    listEl.appendChild(card);
  });
}
function wire(card,it){
  const del=card.querySelectorAll("[data-del]"); del.forEach(x=>x.onclick=()=>{ it.tags.splice(+x.dataset.del,1); render(); });
  const at=card.querySelector("[data-addtag]"); if(at) at.onclick=()=>{ it._tagediting=true; render(); const i=[...listEl.querySelectorAll("[data-taginput]")].pop(); if(i){i.focus();} };
  const ti=card.querySelector("[data-taginput]"); if(ti) ti.onkeydown=e=>{ if((e.key==="Enter"||e.key===",")&&ti.value.trim()){ e.preventDefault(); it.tags.push(ti.value.trim().replace(/,$/,"")); render(); const n=[...listEl.querySelectorAll("[data-taginput]")].pop(); if(n)n.focus(); } else if(e.key==="Escape"){ it._tagediting=false; render(); } };
  const an=card.querySelector("[data-addnote]"); if(an) an.onclick=()=>{ it._noteediting=true; render(); };
  const sn=card.querySelector("[data-savenote]"); if(sn) sn.onclick=()=>{ const t=card.querySelector("[data-noteinput]"); it.note=t.value.trim(); it._noteediting=false; render(); };
  // mode C editor wiring
  const cts=card.querySelector("[data-ceditor-tags]");
  if(cts){ const draw=()=>{ cts.innerHTML=""; it.tags.forEach((t,i)=>{ const s=document.createElement("span"); s.className="chip"; s.innerHTML=esc(t)+' <span class="x">×</span>'; s.querySelector(".x").onclick=()=>{it.tags.splice(i,1);draw();}; cts.appendChild(s); }); const inp=document.createElement("input"); inp.className="taginput"; inp.placeholder="add tag…"; inp.onkeydown=e=>{ if((e.key==="Enter"||e.key===",")&&inp.value.trim()){ e.preventDefault(); it.tags.push(inp.value.trim().replace(/,$/,"")); draw(); cts.querySelector("input").focus(); } }; cts.appendChild(inp); }; draw(); }
  const cdone=card.querySelector("[data-cdone]"); if(cdone) cdone.onclick=()=>{ const n=card.querySelector("[data-ceditor-note]"); it.note=n.value.trim(); it._editor=false; render(); };
  const cskip=card.querySelector("[data-cdismiss]"); if(cskip) cskip.onclick=()=>{ it._editor=false; render(); };
}

const input=document.getElementById("url"), saveBtn=document.getElementById("save");
function doSave(){
  const raw=input.value.trim(); if(!raw) return; const meta=guessMeta(raw); if(!meta){ input.focus(); return; }
  saveBtn.disabled=true;
  const full=raw.includes("://")?raw:"https://"+raw;
  const item={ id:nextId++, url:full, when:"just now", filling:true, tags:[], note:"" };
  if(mode==="b"){ item.tags=saveTags.slice(); item.note=document.getElementById("saveNote").value.trim(); }
  items.unshift(item); render();
  setTimeout(()=>{
    item.title=meta.title; item.site=meta.site; item.desc=meta.desc; item.icon=meta.icon; item.preview=meta.preview; item.filling=false;
    if(mode==="c") item._editor=true;
    render(item.id);
    input.value=""; saveBtn.disabled=false;
    if(mode==="b"){ saveTags=[]; renderSaveTags(); document.getElementById("saveNote").value=""; }
    if(mode==="c"){ const i=listEl.querySelector("[data-ceditor-tags] input"); if(i) i.focus(); }
  },700);
}
saveBtn.addEventListener("click",doSave);
input.addEventListener("keydown",e=>{ if(e.key==="Enter") doSave(); });

render();
document.body.setAttribute("data-harness-ready","true");
</script>
</body>
</html>
