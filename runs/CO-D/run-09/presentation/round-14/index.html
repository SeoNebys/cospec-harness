<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #2b2b2b; --muted: #9a9a92;
    --line: #e7e7e2; --accent: #4a6b57; --accent-soft: #e9f0ec; --chip: #eef0ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }
  header h1 { font-size: 22px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  header p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

  .save-bar { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    display: flex; gap: 10px; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .save-bar input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: var(--ink); }
  .btn { border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--accent); color: #fff; white-space: nowrap; }
  .btn.secondary { background: var(--chip); color: var(--ink); }

  .flash { background: var(--accent-soft); color: #345444; border-radius: 10px; padding: 10px 14px;
    font-size: 13.5px; margin-top: 14px; display: none; }
  .flash.show { display: block; }
  .url-note { display:none; font-size:12.5px; color:#a84a4a; margin-top:8px; }
  .url-note.show { display:block; }

  .search-bar { display:flex; align-items:center; gap:8px; margin-top:16px; background:#fff;
    border:1px solid var(--line); border-radius:12px; padding:10px 14px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
  .search-bar svg { width:16px; height:16px; color:var(--muted); flex:none; }
  .search-bar input { flex:1; border:none; outline:none; font-size:14.5px; background:transparent; color:var(--ink); }
  .search-clear { border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; display:none; }
  .search-clear.show { display:inline; }
  .controls-row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; }
  .filter { display:inline-flex; background:#eceae4; border-radius:10px; padding:3px; gap:2px; }
  .sort-label { font-size:12.5px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
  .sort-label select { border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; background:#fff; color:var(--ink); font-family:inherit; cursor:pointer; }
  .sort-seg { display:inline-flex; background:#eceae4; border-radius:10px; padding:3px; gap:2px; }
  .sort-seg button { border:none; background:transparent; font-size:13px; color:#6a6a63; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .sort-seg button.active { background:#fff; color:#2b2b2b; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.06); }
  .filter button { border:none; background:transparent; font-size:13px; color:#6a6a63; padding:6px 14px; border-radius:8px; cursor:pointer; }
  .filter button.active { background:#fff; color:#2b2b2b; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.06); }
  .filter .n { color:#a7a7a0; font-weight:400; margin-left:4px; font-size:12px; }
  .item.done { opacity:0.72; }
  .badge.read { background:#e9f0ec; color:#3f6b53; }
  .statusbtn { margin-top:10px; font-size:12.5px; font-weight:600; color:var(--accent); background:var(--accent-soft);
    border:none; border-radius:999px; padding:5px 12px; cursor:pointer; }
  .result-count { font-size:12px; color:var(--muted); margin:14px 2px 0; }
  .no-results { text-align:center; color:var(--muted); padding:48px 20px; }
  .no-results .big { font-size:15px; color:#6a6a63; margin-bottom:4px; }
  .hl { background:#fff2c2; border-radius:3px; padding:0 1px; }

  .list { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03); display: flex; gap: 14px; }
  .item.flash-hit { animation: hit 1.6s ease; }
  @keyframes hit { 0%{ box-shadow:0 0 0 3px var(--accent);} 100%{ box-shadow:0 1px 2px rgba(0,0,0,0.03);} }
  .thumb { width: 82px; min-width: 82px; height: 60px; border-radius: 8px; overflow: hidden; display:flex;
    align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:600; text-align:center; }
  .body { flex: 1; min-width: 0; }
  .titleline { display: flex; align-items: center; gap: 8px; }
  .favicon { width: 18px; height: 18px; min-width:18px; border-radius: 5px; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:10px; font-weight:700; }
  .item .title { font-size: 15.5px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .item .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .openlink { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; min-width: 0; }
  .openlink .title { color: #2b2b2b; }
  .openlink:hover .title { text-decoration: underline; color: #3a5a47; }
  .openlink:hover .favicon { filter: brightness(1.08); }
  .item .desc { font-size: 13.5px; color: #55554e; margin: 6px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items:center; }
  .chip { background: var(--chip); color: #4a4a44; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .item .chip { cursor: pointer; }
  .item .chip:hover { background: #e2e7e3; color: #2b2b2b; }
  .badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #f2ede0; color:#8a7a4a; font-weight:600; }
  /* subdued secondary info */
  .item .url { font-size: 11.5px; color: var(--muted); word-break: break-all; margin: 8px 0 0; }
  .item .note { font-size: 12px; color: #8a8a82; font-style: italic; margin: 4px 0 0; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty .big { font-size: 15px; color: #6a6a63; }

  .overlay { position: fixed; inset: 0; background: rgba(30,30,28,0.35); display: none; align-items: flex-start;
    justify-content: center; padding: 40px 16px; overflow:auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 480px; padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { font-size: 17px; margin: 0 0 4px; }
  .modal .hint { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .preview-row { display:flex; gap:12px; align-items:center; margin-bottom:16px; }
  #mThumb { width: 96px; min-width:96px; height: 64px; border-radius: 8px; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:11px; font-weight:600; text-align:center; }
  #mFav { width: 26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; font-weight:700; }
  .preview-cap { font-size:11.5px; color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px;
    font-size: 14px; font-family: inherit; outline: none; background: #fcfcfa; color: var(--ink); }
  .field textarea { resize: vertical; min-height: 54px; }
  .field .auto { font-size: 11.5px; color: var(--accent); margin-top: 4px; }
  .suggest { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .suggest .s-label { font-size:11.5px; color:var(--muted); width:100%; }
  .suggest .chip { cursor:pointer; border:1px dashed #cdd4cf; background:#f6f8f6; }
  .toggle-row { display:flex; align-items:center; gap:10px; background:#faf9f5; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:16px; }
  .switch { position:relative; width:42px; height:24px; background:#cfcfc7; border-radius:999px; cursor:pointer; transition:.2s; }
  .switch.on { background: var(--accent); }
  .switch .knob { position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.2s; }
  .switch.on .knob { left:20px; }
  .toggle-row .t-text { font-size:13.5px; }
  .toggle-row .t-sub { font-size:11.5px; color:var(--muted); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>My Bookmarks</h1>
    <p>A calm place to save links and find them again.</p>
  </header>

  <div class="save-bar">
    <input id="urlInput" type="text" placeholder="Paste a link to save…" autocomplete="off" />
    <button class="btn" id="saveBtn">Save</button>
  </div>
  <div class="url-note" id="urlNote"></div>
  <div class="flash" id="flash"></div>

  <div class="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Search your bookmarks — a word, a topic, a label…" autocomplete="off" />
    <button class="search-clear" id="searchClear">Clear</button>
  </div>
  <div class="controls-row">
    <div class="filter" id="filter"></div>
    <div id="sortControls"></div>
  </div>
  <div class="result-count" id="resultCount"></div>

  <div class="list" id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Save this link</h2>
    <p class="hint" id="modalHint">We filled in the details from the page. Adjust anything you like.</p>

    <div class="preview-row">
      <div id="mThumb">…</div>
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div id="mFav">…</div>
          <span class="preview-cap" id="previewCap">reading the page…</span>
        </div>
      </div>
    </div>

    <div class="field" id="urlField" style="display:none;">
      <label>Address</label>
      <input id="fUrl" type="text" />
      <div id="urlErr" style="display:none; font-size:12px; color:#a84a4a; margin-top:5px;"></div>
    </div>
    <div class="field">
      <label>Title</label>
      <input id="fTitle" type="text" />
      <div class="auto" id="titleAuto">✓ filled in for you</div>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="fDesc"></textarea>
      <div class="auto" id="descAuto">✓ filled in for you</div>
    </div>

    <div class="toggle-row">
      <div class="switch on" id="rlSwitch"><div class="knob"></div></div>
      <div>
        <div class="t-text">Read later</div>
        <div class="t-sub">Keep it in your "still to read" pile</div>
      </div>
    </div>

    <div class="field">
      <label>Your note (optional)</label>
      <textarea id="fNote" placeholder="Why is this worth keeping?"></textarea>
    </div>
    <div class="field">
      <label>Labels</label>
      <input id="fTags" type="text" placeholder="e.g. reading, work" />
      <div class="suggest" id="suggest"></div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="cancelBtn">Cancel</button>
      <button class="btn" id="confirmBtn">Save to my list</button>
    </div>
  </div>
</div>

<script>
  // --- simulated "fetch page details" (prototype only; real app reads the live page) ---
  const SAMPLES = {
    "smashingmagazine.com": { title: "Designing Calm Interfaces — Smashing Magazine", desc: "Principles for building software that respects a user's attention.", preview: "Calm Interfaces" },
    "developer.mozilla.org": { title: "Array.prototype.reduce() — JavaScript | MDN", desc: "The reduce() method executes a reducer function on each array element, resulting in a single value.", preview: "MDN Web Docs" },
    "nytimes.com": { title: "The Quiet Power of Reading Slowly — The New York Times", desc: "Why unhurried reading may be the antidote to information overload.", preview: "The New York Times" },
    "en.wikipedia.org": { title: "Spaced repetition — Wikipedia", desc: "A learning technique using increasing intervals between reviews of learned material.", preview: null },
    "github.com": { title: "sindresorhus/awesome — curated list of awesome lists", desc: "A community-driven collection of awesome resources on many topics.", preview: "GitHub" }
  };
  const PALETTE = ["#4a6b57","#7a5c8a","#b5713f","#3f6f8a","#8a4a58","#5a7a3f","#8a7a3f"];
  function normUrl(u){ return u.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,''); }
  function domainOf(url){ try { return new URL(url.match(/^https?:\/\//)? url : "https://"+url).hostname.replace(/^www\./,''); } catch(e){ return ""; } }
  function colorFor(s){ let h=0; for(const c of (s||"x")) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
  function monogram(d){ const base=(d||"?").replace(/^www\./,''); return (base[0]||"?").toUpperCase(); }
  function titleCaseFromDomain(d){ const base=(d||"").split(".")[0]; return base? base.charAt(0).toUpperCase()+base.slice(1)+" — saved page" : "Untitled page"; }
  function looksLikeLink(u){ const s=(u||"").trim(); if(!s||/\s/.test(s)) return false; return /^https?:\/\//i.test(s) || /\.[a-z]{2,}/i.test(s); }
  function readable(domain){ return !/\.(local|invalid|internal|test)$/i.test(domain||""); }
  function fetchDetails(url){
    const d = domainOf(url);
    if (!readable(d)) return { failed:true, title:"", desc:"", preview:null, domain:d, auto:false };
    const s = SAMPLES[d];
    if (s) return { title:s.title, desc:s.desc, preview:s.preview, domain:d, auto:true };
    return { title: titleCaseFromDomain(d), desc:"", preview:null, domain:d, auto: !!d };
  }

  // --- state ---
  let bookmarks = JSON.parse(localStorage.getItem("bm_proto_v2")||"[]");
  let pending = null;      // {url, domain, preview}
  let editingId = null;    // id of existing bookmark when updating a duplicate
  let readLater = true;
  let query = "";
  let filter = "all";
  let sortMode = localStorage.getItem("bm_sort") || "newest";  // remembered default
  const SORT_UI = new URLSearchParams(location.search).get("sortui") === "segmented" ? "segmented" : "dropdown";
  const SORT_DEFS = [["newest","Newest added"],["oldest","Oldest added"],["alpha","Title A–Z"]];
  function save(){ localStorage.setItem("bm_proto_v2", JSON.stringify(bookmarks)); }
  function sortCmp(a,b){
    if(sortMode==="alpha") return (a.title||"").toLowerCase().localeCompare((b.title||"").toLowerCase());
    if(sortMode==="oldest") return a.id - b.id;
    return b.id - a.id; // newest
  }

  // --- demo helper: ?demo=empty shows the very-first-use empty state ---
  const DEMO = new URLSearchParams(location.search).get("demo");
  if(DEMO==="empty"){ bookmarks=[]; }

  // --- seed example bookmarks for the search demo (only if empty) ---
  if(DEMO!=="empty" && !bookmarks.length){
    bookmarks = [
      {id:5, url:"https://github.com/sindresorhus/awesome", domain:"github.com", preview:"GitHub",
       title:"sindresorhus/awesome — curated list of awesome lists", desc:"A community-driven collection of awesome resources on many topics.",
       note:"", tags:["tools"], readLater:true},
      {id:4, url:"https://en.wikipedia.org/wiki/Spaced_repetition", domain:"en.wikipedia.org", preview:null,
       title:"Spaced repetition — Wikipedia", desc:"A learning technique using increasing intervals between reviews of learned material.",
       note:"Try this for language study", tags:["learning"], readLater:false},
      {id:3, url:"https://www.nytimes.com/reading-slowly", domain:"nytimes.com", preview:"The New York Times",
       title:"The Quiet Power of Reading Slowly — The New York Times", desc:"Why unhurried reading may be the antidote to information overload.",
       note:"", tags:["reading"], readLater:true},
      {id:2, url:"https://developer.mozilla.org/reduce", domain:"developer.mozilla.org", preview:"MDN Web Docs",
       title:"Array.prototype.reduce() — JavaScript | MDN", desc:"The reduce() method executes a reducer function on each array element, resulting in a single value.",
       note:"", tags:["javascript","reference"], readLater:true},
      {id:1, url:"https://www.smashingmagazine.com/calm-interfaces", domain:"smashingmagazine.com", preview:"Calm Interfaces",
       title:"Designing Calm Interfaces — Smashing Magazine", desc:"Principles for building software that respects a user's attention.",
       note:"Great for the bookmark app", tags:["reading","design"], readLater:true}
    ];
    save();
  }
  function knownTags(){ const t=new Set(); bookmarks.forEach(b=>(b.tags||[]).forEach(x=>t.add(x))); return [...t]; }

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("resultCount");

  function haystack(b){ return [b.title,b.desc,b.note,(b.tags||[]).join(" "),b.url,b.domain].join(" ").toLowerCase(); }

  // --- query language: words, "phrases", #labels, AND/OR/NOT, parentheses ---
  function tokenize(q){
    const toks=[]; let i=0; const stop=' \t()"';
    while(i<q.length){
      const c=q[i];
      if(c===' '||c==='\t'){ i++; continue; }
      if(c==='('){ toks.push({t:'('}); i++; continue; }
      if(c===')'){ toks.push({t:')'}); i++; continue; }
      if(c==='"'){ let j=i+1,s=""; while(j<q.length&&q[j]!=='"'){ s+=q[j]; j++; } i=(j<q.length)?j+1:j; toks.push({t:'TERM',kind:'phrase',v:s}); continue; }
      if(c==='#'){ let j=i+1,s=""; if(q[j]==='"'){ j++; while(j<q.length&&q[j]!=='"'){ s+=q[j]; j++; } i=(j<q.length)?j+1:j; } else { while(j<q.length&&!stop.includes(q[j])){ s+=q[j]; j++; } i=j; } toks.push({t:'TERM',kind:'label',v:s}); continue; }
      let j=i,s=""; while(j<q.length&&!stop.includes(q[j])){ s+=q[j]; j++; } i=j;
      const kw=s.toUpperCase();
      if(kw==='AND') toks.push({t:'AND'});
      else if(kw==='OR') toks.push({t:'OR'});
      else if(kw==='NOT') toks.push({t:'NOT'});
      else toks.push({t:'TERM',kind:'word',v:s});
    }
    return toks;
  }
  function parse(toks){
    let p=0; const peek=()=>toks[p], eat=()=>toks[p++];
    function pOr(){ let l=pAnd(); while(peek()&&peek().t==='OR'){ eat(); l={op:'or',l,r:pAnd()}; } return l; }
    function pAnd(){ let l=pNot(); while(peek()&&(peek().t==='AND'||peek().t==='TERM'||peek().t==='('||peek().t==='NOT')){ if(peek().t==='AND') eat(); l={op:'and',l,r:pNot()}; } return l; }
    function pNot(){ if(peek()&&peek().t==='NOT'){ eat(); return {op:'not',c:pNot()}; } return pPrim(); }
    function pPrim(){ const tk=peek(); if(!tk) throw new Error("end"); if(tk.t==='('){ eat(); const e=pOr(); if(peek()&&peek().t===')') eat(); else throw new Error(")"); return e; } if(tk.t==='TERM'){ eat(); return {op:'term',kind:tk.kind,v:tk.v}; } throw new Error("tok"); }
    const ast=pOr(); if(p!==toks.length) throw new Error("trailing"); return ast;
  }
  function evalAst(n,b,h){
    if(n.op==='or') return evalAst(n.l,b,h)||evalAst(n.r,b,h);
    if(n.op==='and') return evalAst(n.l,b,h)&&evalAst(n.r,b,h);
    if(n.op==='not') return !evalAst(n.c,b,h);
    if(n.op==='term'){ if(n.kind==='label') return (b.tags||[]).some(t=>t.toLowerCase()===n.v.toLowerCase()); return h.includes((n.v||"").toLowerCase()); }
    return false;
  }
  function collectHl(n,neg,out){ if(!n) return; if(n.op==='or'||n.op==='and'){ collectHl(n.l,neg,out); collectHl(n.r,neg,out); } else if(n.op==='not'){ collectHl(n.c,!neg,out); } else if(n.op==='term'){ if(!neg&&n.v) out.push(n.v.toLowerCase()); } }

  let ast=null, astError=false, hlTerms=[];
  function buildQuery(){
    ast=null; astError=false; hlTerms=[];
    const q=query.trim(); if(!q) return;
    try{ ast=parse(tokenize(q)); const out=[]; collectHl(ast,false,out); hlTerms=[...new Set(out.filter(Boolean))]; }
    catch(e){ astError=true; hlTerms=q.toLowerCase().split(/\s+/).filter(w=>!['and','or','not'].includes(w)); }
  }
  function matches(b){
    const q=query.trim(); if(!q) return true; const h=haystack(b);
    if(ast&&!astError){ try{ return evalAst(ast,b,h); }catch(e){} }
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(x=>h.includes(x));
  }
  function hl(text){
    let out=esc(text);
    hlTerms.forEach(t=>{ if(!t) return; const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); out=out.replace(re,'<span class="hl">$1</span>'); });
    return out;
  }

  const sortEl = document.getElementById("sortControls");
  function renderSort(){
    if(SORT_UI==="segmented"){
      sortEl.innerHTML = `<div class="sort-seg">`+SORT_DEFS.map(([k,label])=>`<button data-s="${k}" class="${sortMode===k?'active':''}">${label}</button>`).join("")+`</div>`;
      sortEl.querySelectorAll("button").forEach(btn=> btn.onclick=()=>{ sortMode=btn.dataset.s; localStorage.setItem("bm_sort",sortMode); render(); });
    } else {
      sortEl.innerHTML = `<label class="sort-label">Sort by <select id="sortSelect">`+SORT_DEFS.map(([k,label])=>`<option value="${k}" ${sortMode===k?'selected':''}>${label}</option>`).join("")+`</select></label>`;
      document.getElementById("sortSelect").onchange = (e)=>{ sortMode=e.target.value; localStorage.setItem("bm_sort",sortMode); render(); };
    }
  }

  const filterEl = document.getElementById("filter");
  function renderFilter(searchSet){
    const c = { all:searchSet.length, toread:searchSet.filter(b=>b.readLater).length, finished:searchSet.filter(b=>!b.readLater).length };
    const defs=[["all","All",c.all],["toread","To read",c.toread],["finished","Finished",c.finished]];
    filterEl.innerHTML = defs.map(([k,label,n])=>`<button data-f="${k}" class="${filter===k?'active':''}">${label}<span class="n">${n}</span></button>`).join("");
    filterEl.querySelectorAll("button").forEach(btn=> btn.onclick=()=>{ filter=btn.dataset.f; render(); });
  }

  function render(){
    if(!bookmarks.length){
      countEl.textContent=""; filterEl.innerHTML=""; sortEl.innerHTML="";
      listEl.innerHTML = '<div class="empty"><div class="big">Nothing saved yet.</div><div>Paste a link above to keep your first one.</div></div>';
      return;
    }
    const searchSet = bookmarks.filter(matches);
    renderFilter(searchSet);
    renderSort();
    const filtered = searchSet
      .filter(b=> filter==="all" ? true : filter==="toread" ? b.readLater : !b.readLater)
      .slice().sort(sortCmp);

    countEl.textContent = query.trim() ? (filtered.length===1 ? "1 match" : filtered.length+" matches") : "";

    if(!filtered.length){
      let msg;
      if(query.trim()) msg = `<div class="big">No bookmarks match “${esc(query)}”.</div><div>Try a different word, topic, or label.</div>`;
      else if(filter==="toread") msg = `<div class="big">Nothing left to read — you're all caught up.</div>`;
      else if(filter==="finished") msg = `<div class="big">Nothing finished yet.</div>`;
      else msg = `<div class="big">Nothing here.</div>`;
      listEl.innerHTML = `<div class="no-results">${msg}</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(b => {
      const col = colorFor(b.domain||b.url);
      const thumb = b.preview
        ? `<div class="thumb" style="background:linear-gradient(135deg,${col},${shade(col)})">${esc(b.preview)}</div>`
        : "";
      const dim = (!b.readLater && filter!=="finished") ? " done" : "";
      const statusBtn = b.readLater
        ? `<button class="statusbtn" data-read="${b.id}">Mark as read</button>`
        : `<button class="statusbtn" data-read="${b.id}">Move back to “To read”</button>`;
      const badge = b.readLater ? `<span class="badge">Read later</span>` : `<span class="badge read">Read ✓</span>`;
      return `
      <div class="item${dim}" id="item-${b.id}">
        ${thumb}
        <div class="body">
          <div class="titleline">
            <a class="openlink" href="${esc(b.url)}" target="_blank" rel="noopener" title="Open in a new tab">
              <div class="favicon" style="background:${col}">${esc(monogram(b.domain))}</div>
              <p class="title">${hl(b.title)}</p>
            </a>
          </div>
          ${b.desc? `<p class="desc">${hl(b.desc)}</p>`:""}
          <div class="chips">
            ${badge}
            ${(b.tags||[]).map(t=>`<span class="chip" data-label="${esc(t)}" title="Show everything labelled “${esc(t)}”">${hl(t)}</span>`).join("")}
          </div>
          ${statusBtn}
          <p class="url">${hl(b.url)}</p>
          ${b.note? `<p class="note">“${hl(b.note)}”</p>`:""}
        </div>
      </div>`; }).join("");
    listEl.querySelectorAll("[data-read]").forEach(btn=> btn.onclick=()=>{
      const id=+btn.dataset.read; const bk=bookmarks.find(x=>x.id===id);
      if(bk){ bk.readLater=!bk.readLater; save(); render(); }
    });
    listEl.querySelectorAll("[data-label]").forEach(chip=> chip.onclick=()=>{
      const lab = chip.dataset.label;
      const token = /[\s()"#]/.test(lab) ? `#"${lab}"` : `#${lab}`;
      searchInput.value = token; query = token;
      searchClear.classList.add("show");
      buildQuery(); render();
      window.scrollTo({top:0, behavior:"smooth"});
    });
  }
  function shade(hex){ return hex; }
  function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // --- flash message ---
  const flashEl = document.getElementById("flash");
  function flash(msg){ flashEl.textContent=msg; flashEl.classList.add("show"); setTimeout(()=>flashEl.classList.remove("show"), 4000); }

  // --- save / update flow ---
  const overlay = document.getElementById("overlay");
  const urlInput = document.getElementById("urlInput");
  const rlSwitch = document.getElementById("rlSwitch");
  document.getElementById("saveBtn").onclick = startSave;
  urlInput.addEventListener("keydown", e=>{ if(e.key==="Enter") startSave(); });
  rlSwitch.onclick = ()=>{ readLater=!readLater; rlSwitch.classList.toggle("on", readLater); };

  function setSwitch(v){ readLater=v; rlSwitch.classList.toggle("on", v); }

  function renderSuggest(){
    const box=document.getElementById("suggest");
    const current=document.getElementById("fTags").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
    const opts=knownTags().filter(t=>!current.includes(t.toLowerCase()));
    box.innerHTML = opts.length? `<span class="s-label">Labels you've used:</span>`+opts.map(t=>`<span class="chip" data-t="${esc(t)}">${esc(t)}</span>`).join("") : "";
    box.querySelectorAll(".chip").forEach(c=> c.onclick=()=>{
      const f=document.getElementById("fTags");
      const arr=f.value.split(",").map(s=>s.trim()).filter(Boolean); arr.push(c.dataset.t);
      f.value=arr.join(", "); renderSuggest();
    });
  }
  document.getElementById("fTags").addEventListener("input", renderSuggest);

  function startSave(){
    const url = urlInput.value.trim();
    if(!url) return;
    const note = document.getElementById("urlNote");
    if(!looksLikeLink(url)){
      note.textContent = "That doesn't look like a link — try a web address, like example.com/article.";
      note.classList.add("show");
      return;
    }
    note.classList.remove("show");
    const key = normUrl(url);
    const existing = bookmarks.find(b=>normUrl(b.url)===key);
    if(existing){ openEdit(existing); return; }

    editingId = null;
    pending = { url, domain: domainOf(url), preview:null };
    document.getElementById("urlField").style.display = "none";
    document.getElementById("modalTitle").textContent = "Save this link";
    document.getElementById("modalHint").textContent = "Reading the page…";
    document.getElementById("fTitle").value = "…";
    document.getElementById("fDesc").value = "";
    document.getElementById("fNote").value = "";
    document.getElementById("fTags").value = "";
    setSwitch(true);
    document.getElementById("confirmBtn").textContent = "Save to my list";
    paintPreview(null, pending.domain, "reading the page…");
    document.getElementById("titleAuto").style.display="none";
    document.getElementById("descAuto").style.display="none";
    renderSuggest();
    overlay.classList.add("open");
    setTimeout(()=>{
      const d = fetchDetails(url);
      pending.preview = d.preview; pending.domain=d.domain;
      if(d.failed){
        document.getElementById("fTitle").value = "";
        document.getElementById("fDesc").value = "";
        document.getElementById("modalHint").textContent = "We couldn't read this page automatically — please add a title yourself. You can still save it.";
        document.getElementById("titleAuto").style.display="none";
        document.getElementById("descAuto").style.display="none";
        paintPreview(null, d.domain, "couldn't read this page — you can still save it");
        document.getElementById("fTitle").focus();
        return;
      }
      document.getElementById("fTitle").value = d.title;
      document.getElementById("fDesc").value = d.desc;
      document.getElementById("modalHint").textContent = "We filled in the details from the page. Adjust anything you like.";
      document.getElementById("titleAuto").style.display = d.auto? "block":"none";
      document.getElementById("descAuto").style.display = d.desc? "block":"none";
      paintPreview(d.preview, d.domain, d.preview? "preview image + site icon collected" : "site icon collected (no preview image on this page)");
    }, 650);
  }

  function openEdit(b){
    editingId = b.id;
    pending = { url:b.url, domain:b.domain, preview:b.preview };
    document.getElementById("modalTitle").textContent = "You already saved this";
    document.getElementById("modalHint").textContent = "Here's the one you saved before — update anything you like.";
    document.getElementById("urlField").style.display = "block";
    document.getElementById("urlErr").style.display = "none";
    document.getElementById("fUrl").value = b.url;
    document.getElementById("fTitle").value = b.title;
    document.getElementById("fDesc").value = b.desc||"";
    document.getElementById("fNote").value = b.note||"";
    document.getElementById("fTags").value = (b.tags||[]).join(", ");
    setSwitch(!!b.readLater);
    document.getElementById("confirmBtn").textContent = "Update";
    document.getElementById("titleAuto").style.display="none";
    document.getElementById("descAuto").style.display="none";
    paintPreview(b.preview, b.domain, "already in your list");
    renderSuggest();
    overlay.classList.add("open");
  }

  function paintPreview(preview, domain, cap){
    const col=colorFor(domain||"x");
    const t=document.getElementById("mThumb");
    if(preview){ t.style.display="flex"; t.style.background=`linear-gradient(135deg,${col},${col})`; t.style.color="#fff"; t.textContent=preview; }
    else { t.style.display="none"; }
    const f=document.getElementById("mFav"); f.style.background=col; f.textContent=monogram(domain);
    document.getElementById("previewCap").textContent=cap;
  }

  document.getElementById("cancelBtn").onclick = ()=> overlay.classList.remove("open");
  document.getElementById("confirmBtn").onclick = ()=>{
    const tags = document.getElementById("fTags").value.split(",").map(s=>s.trim()).filter(Boolean);
    const finalUrl = editingId ? (document.getElementById("fUrl").value.trim() || pending.url) : pending.url;
    if(editingId){
      const clash = bookmarks.find(b=>b.id!==editingId && normUrl(b.url)===normUrl(finalUrl));
      const err=document.getElementById("urlErr");
      if(clash){
        err.innerHTML = "Another saved link already uses this address: “"+esc(clash.title)+"”. "
          + "Change the address to keep things unduplicated, or "
          + "<a href='#' id='openClash' style='color:#4a6b57;font-weight:600;'>open that one instead</a>.";
        err.style.display="block";
        document.getElementById("openClash").onclick=(ev)=>{ ev.preventDefault(); openEdit(clash); };
        return;
      }
      err.style.display="none";
    }
    const data = {
      url: finalUrl,
      domain: domainOf(finalUrl),
      preview: pending.preview,
      title: document.getElementById("fTitle").value.trim() || pending.url,
      desc: document.getElementById("fDesc").value.trim(),
      note: document.getElementById("fNote").value.trim(),
      tags: tags,
      readLater: readLater
    };
    if(editingId){
      const i=bookmarks.findIndex(b=>b.id===editingId);
      if(i>=0) bookmarks[i]={...bookmarks[i], ...data};
      save(); render(); overlay.classList.remove("open");
      flash("Updated your saved link.");
      highlight(editingId);
    } else {
      data.id = Date.now();
      bookmarks.unshift(data);
      save(); render(); overlay.classList.remove("open");
      urlInput.value="";
    }
  };
  function highlight(id){ const el=document.getElementById("item-"+id); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("flash-hit"); setTimeout(()=>el.classList.remove("flash-hit"),1600); } }

  // --- search wiring ---
  const searchInput = document.getElementById("searchInput");
  const searchClear = document.getElementById("searchClear");
  searchInput.addEventListener("input", ()=>{
    query = searchInput.value;
    searchClear.classList.toggle("show", !!query);
    buildQuery();
    render();
  });
  searchClear.addEventListener("click", ()=>{ query=""; searchInput.value=""; searchClear.classList.remove("show"); buildQuery(); render(); searchInput.focus(); });

  render();
  document.body.setAttribute("data-harness-ready","true");
</script>
</body>
</html>
