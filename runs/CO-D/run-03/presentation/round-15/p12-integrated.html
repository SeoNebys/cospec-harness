<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — prototype 12 (integrated)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a2e; }
  header { background: #fff; border-bottom: 1px solid #e3e5e8; padding: 18px 28px; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .savebar { display: flex; gap: 8px; align-items: center; }
  .savebar input.url { flex: 1; padding: 11px 14px; font-size: 15px; border: 1px solid #cfd3d8; border-radius: 8px; }
  .savebar input.url.err { border-color: #d9534f; background: #fdf3f2; }
  .savebar .tr-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #6b6455; background: #fdf7e3; border: 1px solid #ecd98f; border-radius: 8px; padding: 10px 12px; cursor: pointer; white-space: nowrap; }
  .savebar button.save { padding: 11px 20px; font-size: 15px; font-weight: 600; background: #2f6fed; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .saveerr { color: #c0392b; font-size: 13px; margin: 8px 2px 0; }
  main { max-width: 900px; margin: 0 auto; padding: 22px 28px 60px; }
  .searchrow { position: relative; margin-bottom: 8px; }
  .searchrow input { width: 100%; padding: 12px 14px 12px 42px; font-size: 15px; border: 1px solid #cfd3d8; border-radius: 10px; background: #fff; }
  .searchrow .mag { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9aa1ab; }
  .help { font-size: 12px; color: #9aa1ab; margin: 0 2px 12px; }
  .help code { background: #eef1f5; border-radius: 4px; padding: 0 5px; color: #1c4fbf; }
  .scope { font-size: 13px; margin: 0 0 12px; padding: 8px 13px; border-radius: 8px; background: #eef4ff; border: 1px solid #cfe0ff; color: #26456e; display: none; }
  .scope.show { display: block; }
  .scope a { color: #2f6fed; cursor: pointer; font-weight: 600; }
  .views { display: flex; gap: 8px; margin-bottom: 14px; }
  .view { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; padding: 8px 15px; border-radius: 9px; border: 1px solid #cfd3d8; background: #fff; color: #3f4b5b; cursor: pointer; }
  .view.active { background: #1a1a2e; border-color: #1a1a2e; color: #fff; }
  .view.toread.active { background: #b8860b; border-color: #b8860b; }
  .view.archived.active { background: #566072; border-color: #566072; }
  .view .n { font-size: 12px; background: rgba(0,0,0,.09); border-radius: 999px; padding: 1px 8px; }
  .view.active .n { background: rgba(255,255,255,.22); }
  .labelbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .labelbar .lead { font-size: 12.5px; color: #6b7280; }
  .pill { font-size: 12.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid #cfd3d8; background: #fff; color: #4b5563; cursor: pointer; }
  .pill.active { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .interp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .interp .lab { font-size: 12px; color: #9aa1ab; }
  .icap { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
  .icap.phrase { color: #7a4bcc; background: #f1eafd; border: 1px solid #ddc9f7; }
  .icap.either { color: #1c7f8f; background: #e2f6f9; border: 1px solid #bfe8ee; }
  .icap.without { color: #b13b36; background: #fdecea; border: 1px solid #f2c4c0; }
  .icap.word { color: #3f4b5b; background: #eef1f5; border: 1px solid #e0e3e8; }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 14px 2px; }
  .card { display: flex; gap: 14px; background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 14px; margin-bottom: 12px; position: relative; }
  .card.toread { border-left: 4px solid #d4a017; } .card.archived { background: #fbfbfc; }
  .rankno { position: absolute; left: -6px; top: 12px; width: 20px; text-align: center; font-size: 12px; font-weight: 700; color: #b3b8c0; }
  .clickable { cursor: pointer; } .clickable:hover .title { text-decoration: underline; }
  .thumb { width: 104px; height: 72px; flex: none; border-radius: 8px; object-fit: cover; background: #e9ebef; }
  .thumb.placeholder { display:flex; align-items:center; justify-content:center; color:#b3b8c0; font-size:24px; background:#eef0f3; border:1px dashed #cfd3d8; }
  .body { min-width: 0; flex: 1; }
  .titlerow { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
  .badge.tr { color: #8a6d0b; background: #fdf3d3; border: 1px solid #ecd98f; }
  .badge.ar { color: #4a5468; background: #e7eaef; border: 1px solid #ccd2db; }
  .title { font-size: 16px; font-weight: 600; } .title.untitled { color:#9aa1ab; font-style:italic; }
  .url { font-size: 12px; color: #2f6fed; margin: 0 0 5px; word-break: break-all; }
  .desc { font-size: 13.5px; color: #4b5563; margin: 0 0 8px; line-height: 1.45; }
  .why { display: flex; flex-wrap: wrap; gap: 6px; }
  .hit { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 9px; }
  .hit.strong { color: #1c4fbf; background: #e2ecff; border: 1px solid #c3d8ff; }
  .hit.bodyhit { color: #6b6455; background: #f3eede; border: 1px solid #e3d9b8; }
  .snippet { font-size: 12.5px; color: #6b7280; margin: 8px 0 0; border-left: 3px solid #e3d9b8; padding: 2px 0 2px 10px; line-height:1.5; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #eef1f5; color: #3f4b5b; cursor: pointer; }
  .tag.on { background: #d9e5ff; color: #1c4fbf; }
  .cardtools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
  .tbtn { font-size: 12px; color: #6b7280; background: #f4f5f7; border: 1px solid #e3e5e8; border-radius: 7px; padding: 5px 9px; cursor: pointer; }
  .tbtn.toread { color: #8a6d0b; border-color: #ecd98f; background: #fdf7e3; }
  .tbtn.markread { color: #1a7a3c; border-color: #b6e0c2; background: #eafaf0; }
  .tbtn.restore { color: #1c4fbf; border-color: #b8ccf5; background: #eef4ff; }
  mark { background: #fff2a8; padding: 0 1px; border-radius: 3px; }
  .divider { display: flex; align-items: center; gap: 10px; color: #9aa1ab; font-size: 12px; margin: 4px 2px 14px; }
  .divider::before, .divider::after { content: ""; height: 1px; background: #e3e5e8; flex: 1; }
  .edit-form input, .edit-form textarea { width: 100%; font-size: 14px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid #cfd3d8; border-radius: 7px; font-family: inherit; }
  .edit-form .lbl { font-size: 11.5px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .edit-form textarea { min-height: 60px; resize: vertical; }
  .refetch { font-size:12.5px; color:#2f6fed; background:#eef4ff; border:1px solid #cfe0ff; border-radius:7px; padding:6px 11px; cursor:pointer; margin:-3px 0 10px; }
  .chipbox { display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid #cfd3d8; border-radius:7px; padding:6px 8px; margin-bottom:8px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 4px 3px 10px; border-radius:999px; background:#d9e5ff; color:#1c4fbf; }
  .chip button { border:none; background:transparent; color:#1c4fbf; cursor:pointer; }
  .chipbox input { border:none; margin:0; padding:4px; flex:1; min-width:120px; font-size:13px; } .chipbox input:focus { outline:none; }
  .savenote { font-size:12.5px; margin:0 0 8px; } .savenote.ok{color:#2f6fed;} .savenote.warn{color:#b13b36;}
  .edit-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .edit-actions .save { background:#2f6fed; color:#fff; border:none; border-radius:7px; padding:7px 16px; font-weight:600; cursor:pointer; }
  .edit-actions .cancel { background:#fff; color:#4b5563; border:1px solid #cfd3d8; border-radius:7px; padding:7px 16px; cursor:pointer; }
  .edit-actions .delete { margin-left:auto; background:#fff; color:#c0392b; border:1px solid #e6c3bd; border-radius:7px; padding:7px 16px; cursor:pointer; }
  .empty { text-align:center; color:#9aa1ab; padding:44px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; display:flex; gap:14px; align-items:center; }
  .toast.show { opacity: 1; pointer-events:auto; } .toast button { background:transparent; color:#ffd54a; border:none; font-weight:700; cursor:pointer; }
  .browser { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: none; align-items: flex-start; justify-content: center; padding: 34px 20px; }
  .browser.show { display: flex; }
  .win { background:#fff; width:100%; max-width:780px; max-height:88vh; border-radius:12px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; }
  .chrome { display:flex; align-items:center; gap:10px; background:#ececf0; padding:10px 14px; border-bottom:1px solid #dcdee3; }
  .dots{display:flex;gap:6px}.dots span{width:11px;height:11px;border-radius:50%;background:#c9ccd2}
  .addr { flex:1; background:#fff; border-radius:7px; padding:6px 12px; font-size:12.5px; color:#4b5563; border:1px solid #dcdee3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .closex{cursor:pointer;color:#6b7280;font-size:18px}
  .vtabs{display:flex;background:#f6f7f9;border-bottom:1px solid #e3e5e8;padding:0 14px}
  .vtab{font-size:13px;font-weight:600;color:#6b7280;padding:11px 16px;cursor:pointer;border-bottom:2px solid transparent}
  .vtab.active{color:#1a1a2e;border-bottom-color:#2f6fed}
  .viewer{overflow-y:auto}
  .banner{font-size:13px;padding:11px 34px}
  .banner.gone{background:#fff6e6;color:#8a5b00;border-bottom:1px solid #f0dca8}
  .banner.copy{background:#eafaf0;color:#1a6b36;border-bottom:1px solid #cde9d7}
  .reader{padding:28px 40px 44px;max-width:680px}.reader h2{margin:0 0 6px;font-size:23px}.reader .meta{font-size:12.5px;color:#9aa1ab;margin-bottom:20px}.reader p{color:#2b3140;line-height:1.7;font-size:15.5px;margin:0 0 15px}
  .gonebox{text-align:center;padding:50px 40px}.gonebox .big{font-size:40px}.gonebox .cta{margin-top:16px;background:#1a7a3c;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="savebar">
    <input class="url" id="urlInput" type="text" placeholder="Paste a link to save…" autocomplete="off">
    <label class="tr-toggle"><input type="checkbox" id="saveToRead"> 📖 To read</label>
    <button class="save" id="saveBtn">Save</button>
  </div>
  <div class="saveerr" id="saveerr"></div>
</header>
<main>
  <div class="searchrow"><span class="mag">⌕</span><input id="searchInput" type="text" placeholder="Search…" autocomplete="off"></div>
  <div class="help">Type loose words · <code>"exact phrase"</code> · <code>coffee or tea</code> · <code>not sourdough</code></div>
  <div class="scope" id="scope"></div>
  <div class="views" id="views"></div>
  <div class="labelbar" id="labelbar"></div>
  <div class="interp" id="interp"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>
<div class="browser" id="browser"><div class="win">
  <div class="chrome"><div class="dots"><span></span><span></span><span></span></div><div class="addr" id="addr"></div><div class="closex" id="closeBrowser">✕</div></div>
  <div class="vtabs" id="vtabs"></div><div class="viewer" id="viewer"></div>
</div></div>

<script>
let bookmarks = [
  { id:1, title:"No-Knead Bread in a Dutch Oven", url:"https://kitchenlab.example/no-knead-bread", desc:"A four-ingredient loaf with a crackly crust and open crumb.", img:"https://picsum.photos/seed/dutchoven/216/152", tags:["cooking"], unread:false, archived:false, gone:false,
    copy:"Stir together flour, water, salt, and a pinch of yeast. The slow rise builds an open crumb, and a covered pot traps steam for a thin, crackly crust." },
  { id:2, title:"The Sourdough Starter Guide for Beginners", url:"https://kitchenlab.example/sourdough-starter", desc:"Feeding schedules and troubleshooting a sourdough starter.", img:"https://picsum.photos/seed/bread/216/152", tags:["cooking"], unread:true, archived:false, gone:false,
    copy:"A healthy sourdough starter is the engine of good bread. Once it doubles you can bake a loaf with a springy crumb and a deeply coloured crust." },
  { id:3, title:"Chocolate Lava Cake in 15 Minutes", url:"https://kitchenlab.example/lava-cake", desc:"A quick molten dessert with a gooey centre.", img:"https://picsum.photos/seed/lava/216/152", tags:["cooking","dessert"], unread:false, archived:false, gone:false,
    copy:"This dessert bakes just long enough to set the edges while the centre stays molten. No sourdough, no crust — just a warm chocolate pudding." },
  { id:4, title:"The Article You Meant to Keep", url:"https://blog.example/great-article", desc:"A long read on focus and attention.", img:"https://picsum.photos/seed/focus/216/152", tags:["read"], unread:true, archived:false, gone:false,
    copy:"We treat attention as if it were infinite. Every notification is a small withdrawal, and willpower is barely needed once distractions are out of reach." },
  { id:5, title:"Why We Sleep — key takeaways", url:"https://readingnook.example/why-we-sleep", desc:"Notes on sleep, memory, and caffeine.", img:"https://picsum.photos/seed/sleep/216/152", tags:["health","read"], unread:false, archived:false, gone:false,
    copy:"Deep sleep consolidates memory. Caffeine has a long half-life that steals from the sleep you need, dulling attention and focus the next day." },
  { id:6, title:"12 Hidden Gems in Lisbon", url:"https://travelmore.example/lisbon", desc:"Viewpoints, a tram cafe, and the best pastel de nata.", img:"https://picsum.photos/seed/lisbon/216/152", tags:["travel"], unread:false, archived:true, gone:false,
    copy:"Away from the crowds, Lisbon rewards wandering: miradouros at golden hour, a family tram cafe, and custard tarts still warm from the oven." },
];
const canned = { "https://kitchenlab.example/no-knead-bread": { title:"No-Knead Bread in a Dutch Oven", desc:"A four-ingredient loaf with a crackly crust and open crumb.", img:"https://picsum.photos/seed/dutchoven/216/152", copy:bookmarks[0].copy } };
const unreadable=new Set(["https://broken.example/unreadable"]);
function looksLikeUrl(raw){ let s=raw.trim(); if(!s||/\s/.test(s)) return null; if(!/^https?:\/\//i.test(s)) s='https://'+s; try{ const u=new URL(s); if(!u.hostname.includes('.')) return null; return s; }catch(e){ return null; } }
function autoCapture(url){ if(canned[url]) return {...canned[url], failed:false}; if(unreadable.has(url)) return {failed:true}; let host="the page"; try{host=new URL(url).hostname.replace(/^www\./,'');}catch(e){} const seed=encodeURIComponent(url).slice(-12)||"link"; return { failed:false, title:"Saved page from "+host, desc:"Grabbed automatically from "+host+".", img:"https://picsum.photos/seed/"+seed+"/216/152", copy:"A readable copy of this page was kept when you saved it." }; }
function normUrl(u){ let s=u.trim().toLowerCase(); s=s.replace(/\/+$/,''); s=s.replace(/^https?:\/\//,''); s=s.replace(/^www\./,''); return s; }

const W={title:100,summary:40,labels:40,url:20,body:10};
const EXCLUDE=new Set(['not','without','except']);
const listEl=document.getElementById('list'),countEl=document.getElementById('count'),searchEl=document.getElementById('searchInput'),
      labelbarEl=document.getElementById('labelbar'),viewsEl=document.getElementById('views'),interpEl=document.getElementById('interp'),
      scopeEl=document.getElementById('scope'),errEl=document.getElementById('saveerr');
let editingId=null,flashId=null,activeLabel=null,view='all',draftTags=[],currentOpen=null;

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hlTerms(text,terms){ let safe=esc(text); terms.forEach(t=>{ if(!t) return; const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); safe=safe.replace(re,'<mark>$1</mark>'); }); return safe; }
function fieldsOf(b){ return {title:b.title,summary:b.desc,labels:(b.tags||[]).join(' '),url:b.url,body:b.copy||''}; }
const active=()=>bookmarks.filter(b=>!b.archived);
function allLabels(){ const s=new Set(); active().forEach(b=>b.tags.forEach(t=>s.add(t))); return [...s].sort(); }

function parse(q){ const raw=q.match(/-?"[^"]*"|\S+/g)||[]; const groups=[],negs=[]; let pOr=false,pNeg=false;
  for(const r0 of raw){ let r=r0,neg=false,phrase=false; if(r[0]==='-'){neg=true;r=r.slice(1);} if(r[0]==='"'){phrase=true;r=r.replace(/^"|"$/g,'');} const text=r.toLowerCase().trim(); if(!text) continue;
    if(!phrase&&!neg){ if(text==='or'&&groups.length){pOr=true;continue;} if(text==='and'){continue;} if(EXCLUDE.has(text)){pNeg=true;continue;} }
    if(neg||pNeg){ negs.push({text}); pNeg=false; continue; }
    const tok={text,phrase}; if(pOr&&groups.length){ groups[groups.length-1].push(tok); pOr=false; } else groups.push([tok]); }
  return {groups,negs}; }
function scoreOf(b,p){ const f=fieldsOf(b); const flat=Object.values(f).join(' ').toLowerCase();
  for(const n of p.negs){ if(flat.includes(n.text)) return null; }
  let total=0; const why=[];
  for(const grp of p.groups){ let best=0,bf=null,bt=null; for(const alt of grp){ for(const k in f){ if(f[k].toLowerCase().includes(alt.text)){ if(W[k]>best){best=W[k];bf=k;bt=alt.text;} } } } if(best===0) return null; total+=best; why.push({term:bt,field:bf}); }
  return {total,why,strong:why.some(w=>['title','summary','labels'].includes(w.field))}; }
function allTerms(p){ const s=new Set(); p.groups.forEach(g=>g.forEach(t=>s.add(t.text))); return [...s]; }
function snippetFor(b,terms){ const body=b.copy||'',low=body.toLowerCase(); for(const t of terms){ const i=low.indexOf(t); if(i>=0){ const s=Math.max(0,i-40),e=Math.min(body.length,i+70); return (s>0?'…':'')+body.slice(s,e)+(e<body.length?'…':''); } } return ''; }

function renderViews(){ viewsEl.innerHTML=
  `<span class="view ${view==='all'?'active':''}" data-view="all">All bookmarks <span class="n">${active().length}</span></span>`+
  `<span class="view toread ${view==='toread'?'active':''}" data-view="toread">📖 To read <span class="n">${active().filter(b=>b.unread).length}</span></span>`+
  `<span class="view archived ${view==='archived'?'active':''}" data-view="archived">🗄 Archived <span class="n">${bookmarks.filter(b=>b.archived).length}</span></span>`; }
function renderLabelbar(){ if(view==='archived'){ labelbarEl.innerHTML=''; return; } const labels=allLabels();
  labelbarEl.innerHTML=`<span class="lead">Labels:</span><span class="pill ${activeLabel===null?'active':''}" data-label="__all">All</span>`+
    labels.map(l=>`<span class="pill ${activeLabel===l?'active':''}" data-label="${esc(l)}">${esc(l)}</span>`).join(''); }
function renderInterp(p){ const chips=[]; p.groups.forEach(g=>{ if(g.length>1) chips.push(`<span class="icap either">either: ${g.map(t=>esc(t.text)).join(' / ')}</span>`); else if(g[0].phrase) chips.push(`<span class="icap phrase">exact phrase: “${esc(g[0].text)}”</span>`); else chips.push(`<span class="icap word">${esc(g[0].text)}</span>`); }); p.negs.forEach(n=>chips.push(`<span class="icap without">without: ${esc(n.text)}</span>`)); const special=p.groups.some(g=>g.length>1||g[0].phrase)||p.negs.length; interpEl.innerHTML=(chips.length&&special)?`<span class="lab">Reading your search as:</span>`+chips.join(''):''; }

function scopeText(){ const parts=[]; if(view==='toread') parts.push('your 📖 To read pile'); if(view==='archived') parts.push('your 🗄 Archive'); if(activeLabel) parts.push('label “'+esc(activeLabel)+'”'); return parts; }

function cardHtml(b,terms,q,rank){
  if(b.id===editingId){ const chips=draftTags.map((t,i)=>`<span class="chip">${esc(t)}<button data-act="untag" data-i="${i}">×</button></span>`).join('');
    let note = b.captureFailed&&!b.title?'<p class="savenote warn">Couldn\'t read this page — add a title and summary so you can find it later.</p>':'';
    return `<div class="card" data-id="${b.id}">${b.img?`<img class="thumb" src="${b.img}">`:'<div class="thumb placeholder">🔗</div>'}
      <div class="body"><div class="edit-form">${note}
        <div class="lbl">Title</div><input class="e-title" type="text" value="${esc(b.title)}" placeholder="Give it a title you'll recognise">
        <div class="lbl">Web address</div><input class="e-url" type="text" value="${esc(b.url)}">
        <button class="refetch" data-act="refetch">↻ Re-fetch info from this link</button>
        <div class="lbl">Summary</div><textarea class="e-desc">${esc(b.desc)}</textarea>
        <div class="lbl">Labels</div><div class="chipbox" data-act="focustag">${chips}<input class="e-tag" type="text" placeholder="Type a label, press Enter…"></div>
        <div class="edit-actions"><button class="save" data-act="commit">Save changes</button><button class="cancel" data-act="cancel">Cancel</button><button class="delete" data-act="delete">Delete forever</button></div>
      </div></div></div>`; }
  const tags=b.tags.map(t=>`<span class="tag ${activeLabel===t?'on':''}" data-act="filter" data-label="${esc(t)}">${esc(t)}</span>`).join('');
  const statusBtn=b.unread?`<button class="tbtn markread" data-act="markread">✓ Mark as read</button>`:`<button class="tbtn toread" data-act="toread">📖 To read</button>`;
  const tools=b.archived?`<button class="tbtn restore" data-act="restore">⤺ Restore</button><button class="tbtn" data-act="edit">Edit</button>`:`${statusBtn}<button class="tbtn" data-act="archive">🗄 Archive</button><button class="tbtn" data-act="edit">Edit</button>`;
  const badges=(b.unread?'<span class="badge tr">📖 To read</span>':'')+(b.archived?'<span class="badge ar">🗄 Archived</span>':'');
  const why=q?(scoreOf(b,parse(q))?.why||[]).map(w=>{const label=w.field==='title'?'in title':w.field==='summary'?'in summary':w.field==='labels'?'in label':w.field==='url'?'in link':'in page text';const cls=['title','summary','labels'].includes(w.field)?'strong':'bodyhit';return `<span class="hit ${cls}">“${esc(w.term)}” ${label}</span>`;}).join(''):'';
  const strong=q?scoreOf(b,parse(q))?.strong:true;
  return `<div class="card ${b.unread?'toread':''} ${b.archived?'archived':''} ${b.id===flashId?'flash':''}" data-id="${b.id}">
    ${rank?`<div class="rankno">${rank}</div>`:''}
    ${b.img?`<img class="thumb clickable" src="${b.img}" data-act="open">`:'<div class="thumb placeholder clickable" data-act="open">🔗</div>'}
    <div class="cardtools">${tools}</div>
    <div class="body"><div class="clickable" data-act="open">
      <div class="titlerow">${badges}<div class="title ${b.title?'':'untitled'}">${b.title?hlTerms(b.title,terms):'Untitled — add a title'}</div></div>
      <div class="url">${esc(b.url)}</div>
      <div class="desc">${b.desc?hlTerms(b.desc,terms):''}</div></div>
      <div class="why">${why}</div>
      ${(q&&!strong)?`<p class="snippet">${hlTerms(snippetFor(b,terms),terms)}</p>`:''}
      <div class="tags">${tags}</div>
    </div></div>`;
}

function render(){
  renderViews(); renderLabelbar();
  const q=searchEl.value.trim(); const p=parse(q); const terms=allTerms(p); renderInterp(p);
  // scope note
  const parts=scopeText();
  if(q && parts.length){ scopeEl.classList.add('show'); scopeEl.innerHTML=`Searching within ${parts.join(' · ')}. <a id="searchAll">Search all bookmarks instead →</a>`; }
  else scopeEl.classList.remove('show');
  // build scope pool
  let pool = view==='archived'? bookmarks.filter(b=>b.archived) : active();
  if(view==='toread') pool=pool.filter(b=>b.unread);
  if(view!=='archived' && activeLabel!==null) pool=pool.filter(b=>b.tags.includes(activeLabel));
  // search within pool
  let results = pool.map(b=>({b,s:q?scoreOf(b,p):{total:0,strong:true}})).filter(r=>r.s!==null);
  results.sort((a,b)=> (b.s.total||0)-(a.s.total||0) || a.b.id-b.b.id);
  if(results.length===0){ countEl.textContent=''; const w=q?'Nothing matched here.':(view==='toread'?'Your to-read pile is empty. 🎉':view==='archived'?'Nothing archived.':'Nothing here.'); listEl.innerHTML='<div class="empty">'+w+'</div>'; return; }
  countEl.textContent = q? results.length+' match'+(parts.length?' in this group':'') : (view==='all'?active().length+' saved':results.length+' shown');
  let weak=false,html='';
  results.forEach((r,i)=>{ if(q && !r.s.strong && !weak && i>0){ weak=true; html+='<div class="divider">matched only inside the page contents — further down</div>'; } html+=cardHtml(r.b,terms,q,q?i+1:0); });
  listEl.innerHTML=html;
}

function toast(m,undo){ const t=document.getElementById('toast'); t.innerHTML=esc(m)+(undo?' <button id="undoBtn">Undo</button>':''); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),undo?5000:2500); if(undo) document.getElementById('undoBtn').onclick=undo; }

function openView(b,tab){ currentOpen=b; tab=tab||(b.gone?'copy':'original'); document.getElementById('addr').textContent=b.url+(tab==='copy'?'  ·  saved copy':'');
  document.getElementById('vtabs').innerHTML=`<div class="vtab ${tab==='original'?'active':''}" data-tab="original">Original page</div><div class="vtab ${tab==='copy'?'active':''}" data-tab="copy">Your saved copy ✓</div>`;
  const v=document.getElementById('viewer'); const paras=(b.copy||'').split('. ').reduce((a,s,i,arr)=>{a.push(s+(i<arr.length-1?'.':''));return a;},[]);
  if(tab==='original'){ if(b.gone){ v.innerHTML=`<div class="gonebox"><div class="big">🚫</div><h2>This page is no longer available</h2><button class="cta" data-tab="copy">Read your saved copy →</button></div>`; } else { v.innerHTML=`<div class="reader"><h2>${esc(b.title)}</h2><div class="meta">Live page — ${esc(b.url)}</div><p>${esc(b.copy||'')}</p></div>`; } }
  else { const banner=b.gone?`<div class="banner gone">The original is gone — this is the readable copy you saved.</div>`:`<div class="banner copy">Your saved copy — stays readable even if the original disappears.</div>`; v.innerHTML=banner+`<div class="reader"><h2>${esc(b.title)}</h2><div class="meta">Saved copy · captured when you bookmarked this</div><p>${esc(b.copy||'')}</p></div>`; }
  document.getElementById('browser').classList.add('show'); }
document.getElementById('closeBrowser').onclick=()=>document.getElementById('browser').classList.remove('show');
document.getElementById('browser').addEventListener('click',e=>{ const t=e.target.closest('[data-tab]'); if(t&&currentOpen){ openView(currentOpen,t.dataset.tab); } else if(e.target.id==='browser'){ document.getElementById('browser').classList.remove('show'); } });

function clearErr(){ errEl.textContent=''; document.getElementById('urlInput').classList.remove('err'); }
document.getElementById('urlInput').addEventListener('input',clearErr);
document.getElementById('saveBtn').addEventListener('click',()=>{
  const raw=document.getElementById('urlInput').value; if(!raw.trim()) return; const url=looksLikeUrl(raw);
  if(!url){ errEl.textContent="That doesn't look like a web address — check it and try again."; document.getElementById('urlInput').classList.add('err'); return; } clearErr();
  const wtr=document.getElementById('saveToRead').checked;
  const ex=bookmarks.find(b=>normUrl(b.url)===normUrl(url));
  if(ex){ document.getElementById('urlInput').value=''; document.getElementById('saveToRead').checked=false; searchEl.value=''; activeLabel=null; view=ex.archived?'archived':'all'; editingId=null; flashId=ex.id; render(); const c=listEl.querySelector('[data-id="'+ex.id+'"]'); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); toast('You already saved this — here it is.'); return; }
  const cap=autoCapture(url); const id=Date.now();
  bookmarks.push({ id,url,title:cap.failed?'':cap.title,desc:cap.failed?'':cap.desc,img:cap.failed?null:cap.img,copy:cap.failed?'A copy could not be captured for this page.':cap.copy,gone:false,tags:[],unread:wtr,archived:false,captureFailed:cap.failed });
  editingId=id; draftTags=[]; activeLabel=null; view='all'; document.getElementById('urlInput').value=''; document.getElementById('saveToRead').checked=false; searchEl.value=''; render();
  toast(cap.failed?"Saved — but we couldn't read the page. Add a title.":(wtr?'Saved to your to-read pile':'Saved — details grabbed automatically'));
});
document.getElementById('urlInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('saveBtn').click(); });
searchEl.addEventListener('input',()=>{ editingId=null; render(); });
viewsEl.addEventListener('click',e=>{ const v=e.target.closest('[data-view]'); if(!v) return; view=v.dataset.view; activeLabel=null; editingId=null; render(); });
labelbarEl.addEventListener('click',e=>{ const pl=e.target.closest('[data-label]'); if(!pl) return; const l=pl.dataset.label; activeLabel=(l==='__all')?null:(activeLabel===l?null:l); editingId=null; render(); });
scopeEl.addEventListener('click',e=>{ if(e.target.id==='searchAll'){ view='all'; activeLabel=null; render(); } });

function addDraftTag(raw){ const t=raw.trim().replace(/,$/,'').trim(); if(t&&!draftTags.includes(t)) draftTags.push(t); }
listEl.addEventListener('keydown',e=>{ if(e.target.classList.contains('e-tag')&&(e.key==='Enter'||e.key===',')){ e.preventDefault(); addDraftTag(e.target.value); e.target.value=''; render(); const inp=listEl.querySelector('.e-tag'); if(inp) inp.focus(); } });
listEl.addEventListener('click',e=>{
  const card=e.target.closest('.card'); if(!card) return; const id=Number(card.dataset.id); const idx=bookmarks.findIndex(x=>x.id===id); const b=bookmarks[idx]; const act=e.target.closest('[data-act]')?.dataset.act;
  if(act==='open') openView(b);
  else if(act==='filter'){ const l=e.target.dataset.label; activeLabel=(activeLabel===l?null:l); editingId=null; render(); }
  else if(act==='edit'){ editingId=id; draftTags=[...b.tags]; render(); }
  else if(act==='cancel'){ editingId=null; render(); }
  else if(act==='untag'){ draftTags.splice(Number(e.target.dataset.i),1); render(); const inp=listEl.querySelector('.e-tag'); if(inp) inp.focus(); }
  else if(act==='focustag'){ const inp=card.querySelector('.e-tag'); if(inp&&e.target.classList.contains('chipbox')) inp.focus(); }
  else if(act==='toread'){ b.unread=true; flashId=id; render(); toast('Added to your to-read pile'); }
  else if(act==='markread'){ b.unread=false; render(); toast('Checked off as read',()=>{ b.unread=true; render(); }); }
  else if(act==='archive'){ b.archived=true; render(); toast('Tucked away in your archive',()=>{ b.archived=false; render(); }); }
  else if(act==='restore'){ b.archived=false; render(); toast('Back in your bookmarks',()=>{ b.archived=true; render(); }); }
  else if(act==='refetch'){ const nu=looksLikeUrl(card.querySelector('.e-url').value)||b.url; const cap=autoCapture(nu); if(cap.failed){ toast("Still couldn't read that page."); return; } card.querySelector('.e-title').value=cap.title; card.querySelector('.e-desc').value=cap.desc; b.img=cap.img; b.copy=cap.copy; b.captureFailed=false; toast('Pulled fresh info from the new link'); }
  else if(act==='commit'){ const pend=card.querySelector('.e-tag').value; addDraftTag(pend); b.title=card.querySelector('.e-title').value.trim(); b.url=card.querySelector('.e-url').value.trim()||b.url; b.desc=card.querySelector('.e-desc').value.trim(); b.tags=[...draftTags]; if(b.title) b.captureFailed=false; editingId=null; flashId=id; render(); toast('Updated'); }
  else if(act==='delete'){ const rm=bookmarks.splice(idx,1)[0]; editingId=null; render(); toast('Deleted for good',()=>{ bookmarks.splice(Math.min(idx,bookmarks.length),0,rm); render(); }); }
});
render();
</script>
</body>
</html>
