<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — Option C</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="mode">Option C · Quick save, tap the text to edit it</div>
  <p>Save a link — details fill in for you. To correct a detail, click the title or description right on the item.</p>
</header>
<main>
  <div class="saver">
    <label for="url">Paste a link to save</label>
    <div class="saver-row">
      <input id="url" type="url" placeholder="https://…" autocomplete="off" />
      <button id="saveBtn" class="btn">Save</button>
    </div>
    <div class="hint">Saving is one step. Click any title or description to edit it in place.</div>
  </div>
  <div id="stage"></div>
  <p class="section-title">Saved</p>
  <div id="list"></div>
  <div id="empty" class="empty">Nothing saved yet.</div>
</main>
<script>window.EDIT_MODE = "c";</script>
<script src="shared.js"></script>
</body>
</html>
