<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — p03c Auto</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a1a; }
  .bar { background:#111827; color:#fff; font-size:13px; padding:6px 16px; text-align:center; }
  .layout { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; display: grid;
    grid-template-columns: 200px 1fr; gap: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; grid-column: 1 / -1; }
  .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: #9ca3af; margin: 0 0 8px; }
  .side .note { font-size:11px; color:#9ca3af; margin:0 0 10px; font-style:italic; }
  .cat { display:flex; justify-content:space-between; align-items:center;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color:#374151; }
  .cat:hover { background: #e9ebef; }
  .cat.active { background: #059669; color: #fff; }
  .cat.active .num { color:#d1fae5; }
  .num { color:#9ca3af; font-size:12px; }
  .main { min-width: 0; }
  .searchbar { position: relative; margin-bottom: 16px; }
  .searchbar input { width:100%; border:1px solid #d1d5db; border-radius:10px;
    padding:11px 14px 11px 38px; font-size:14px; background:#fff; }
  .searchbar .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#9ca3af; }
  .count { color:#6b7280; font-size:13px; margin:0 0 10px; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:13px 15px;
    margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .favicon { width:32px; height:32px; border-radius:8px; background:#ecfdf5; display:flex;
    align-items:center; justify-content:center; font-size:15px; color:#059669; font-weight:700; flex-shrink:0; }
  .meta { min-width:0; flex:1; }
  .title { font-size:15px; font-weight:600; margin:0 0 2px; }
  .title a { color:#111827; text-decoration:none; }
  .url { font-size:12.5px; color:#6b7280; margin:0; }
  .auto-tag { font-size:11px; color:#059669; background:#ecfdf5; border:1px solid #d1fae5;
    padding:2px 8px; border-radius:20px; flex-shrink:0; }
  .auto-tag::before { content:'\2728 '; }
</style>
</head>
<body>
<div class="bar">VERSION C — AUTOMATIC: the app sorts links into topics by itself; you just browse</div>
<div class="layout">
  <h1>My Bookmarks</h1>
  <div class="side">
    <h2>Topics</h2>
    <p class="note">Sorted automatically — nothing to set up</p>
    <div id="cats"></div>
  </div>
  <div class="main">
    <div class="searchbar"><span class="icon">&#128269;</span>
      <input id="search" placeholder="Search…" /></div>
    <p class="count" id="count"></p>
    <ul id="list"></ul>
  </div>
</div>
<script>
  // The app derives the topic itself from the title/site — no manual step.
  const raw = [
    { title:'A 3-Day Guide to Kyoto in Autumn', host:'nytimes.com' },
    { title:'A weekend itinerary for Lisbon on a budget', host:'lonelyplanet.com' },
    { title:'The state of AI agents in 2026', host:'arstechnica.com' },
    { title:'openai/whisper: Speech Recognition', host:'github.com' },
    { title:'Understanding CSS Grid, once and for all', host:'css-tricks.com' },
    { title:'Rust vs Go for backend services in 2026', host:'infoq.com' },
    { title:'How to make Neapolitan pizza dough', host:'seriouseats.com' },
    { title:'The best noise-cancelling headphones of 2026', host:'theverge.com' }
  ];
  const RULES = [
    { cat:'Travel', kw:['kyoto','lisbon','guide','itinerary','travel'] },
    { cat:'AI', kw:['ai agents','whisper','speech','ai'] },
    { cat:'Web Dev', kw:['css','grid','rust','go','backend'] },
    { cat:'Cooking', kw:['pizza','dough','recipe'] },
    { cat:'Gadgets', kw:['headphones','noise-cancelling'] }
  ];
  function classify(b) {
    const hay = (b.title + ' ' + b.host).toLowerCase();
    for (const r of RULES) if (r.kw.some(k => hay.includes(k))) return r.cat;
    return 'Other';
  }
  const data = raw.map(b => ({ ...b, cat: classify(b) }));
  const cats = ['All', ...Array.from(new Set(data.map(d => d.cat)))];
  let active = 'All';
  const catsEl = document.getElementById('cats');
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const search = document.getElementById('search');

  function renderCats() {
    catsEl.innerHTML = '';
    cats.forEach(c => {
      const n = c === 'All' ? data.length : data.filter(d => d.cat === c).length;
      const div = document.createElement('div');
      div.className = 'cat' + (c === active ? ' active' : '');
      div.innerHTML = '<span>' + c + '</span><span class="num">' + n + '</span>';
      div.onclick = () => { active = c; renderCats(); renderList(); };
      catsEl.appendChild(div);
    });
  }
  function renderList() {
    const q = search.value.trim().toLowerCase();
    const items = data.filter(d =>
      (active === 'All' || d.cat === active) &&
      (!q || d.title.toLowerCase().includes(q) || d.host.toLowerCase().includes(q)));
    countEl.textContent = items.length + ' link' + (items.length===1?'':'s') +
      (active==='All'?'':' in ' + active);
    listEl.innerHTML = items.length ? '' : '<li class="url" style="border:none;background:none">No links here.</li>';
    items.forEach(d => {
      const li = document.createElement('li');
      li.innerHTML = '<div class="favicon">'+d.title.charAt(0)+'</div>'+
        '<div class="meta"><p class="title"><a href="#">'+d.title+'</a></p><p class="url">'+d.host+'</p></div>'+
        '<span class="auto-tag">'+d.cat+'</span>';
      listEl.appendChild(li);
    });
  }
  search.addEventListener('input', renderList);
  renderCats(); renderList();
</script>
</body>
</html>
