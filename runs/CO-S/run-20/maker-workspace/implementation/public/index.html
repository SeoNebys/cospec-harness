<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Bookmarks</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>My Bookmarks</h1>
    <p>Your personal place to save links and find them again.</p>
  </header>

  <main id="app" class="layout">
    <section class="card" id="saveCard">
      <h2 id="saveHeading">Save a link</h2>
      <form id="saveForm" autocomplete="off" novalidate>
        <label for="url">Link address</label>
        <input type="url" id="url" name="url" placeholder="Paste a link address here…" required />
        <p class="field-status" id="fieldStatus" role="status" aria-live="polite"></p>

        <div class="details" id="details" hidden>
          <label for="title">Title</label>
          <input type="text" id="title" name="title" />

          <label for="description">Description <span class="hint">(from the page)</span></label>
          <textarea id="description" name="description"></textarea>

          <label for="note">Your note <span class="hint">(optional — your own words)</span></label>
          <textarea id="note" name="note" placeholder="Why you saved it, what to remember…"></textarea>

          <label for="topicInput">Topics <span class="hint">(add as many as you like — press Enter after each)</span></label>
          <input type="text" id="topicInput" list="topicSuggestions" placeholder="e.g. Cooking, then Enter" />
          <datalist id="topicSuggestions"></datalist>
          <div class="edit-chips" id="editChips"></div>
        </div>

        <div class="form-actions">
          <button type="submit" id="saveBtn" disabled>Save</button>
          <button type="button" id="cancelBtn" class="secondary" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 id="listHeading">Saved links</h2>
        <button type="button" class="secondary" id="archiveToggle">View archive</button>
      </div>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="search" placeholder="Search title, description, your note, or address…" aria-label="Search your links" />
      </div>

      <div class="seg" id="statusSeg" role="tablist" aria-label="Reading status">
        <button type="button" data-status="all" class="active">All</button>
        <button type="button" data-status="unread">To read</button>
        <button type="button" data-status="read">Read</button>
      </div>

      <p class="archive-note" id="archiveNote" hidden>
        You're viewing archived links. They're kept out of your main collection but stay fully searchable here. Restore any to bring it back.
      </p>

      <div class="topics-bar" id="topicsBar"></div>
      <p class="count" id="count"></p>
      <ul class="list" id="list"></ul>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
