<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep — archive interaction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="read-later-nav-sidebar">
  <main class="shell" data-harness-ready="true">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Keep home"><span class="brand-mark">K</span><span>Keep</span></a>
      <div class="avatar" aria-label="Personal library">You</div>
    </header>
    <section class="hero compact-hero archive-hero">
      <p class="eyebrow">YOUR LIBRARY</p><h1>Keep what matters, clear the rest.</h1>
      <div class="search-box archive-search-box"><span aria-hidden="true">⌕</span><input id="archive-search" type="search" placeholder="Search this part of your library" autocomplete="off" aria-label="Search current bookmark view"><kbd>/</kbd></div>
    </section>
    <div class="library-layout">
      <nav class="library-tabs" aria-label="Bookmark views">
        <button class="library-tab active" type="button" data-view="all">All bookmarks <span id="all-count">3</span></button>
        <button class="library-tab" type="button" data-view="later">Read later <span id="archive-later-count">1</span></button>
        <button class="library-tab" type="button" data-view="archive">Archive <span id="archive-count">1</span></button>
      </nav>
      <section class="library read-later-library" aria-labelledby="archive-heading">
        <div class="section-heading"><div><p id="archive-eyebrow" class="eyebrow">ALL BOOKMARKS</p><h2 id="archive-heading">Your saved links</h2></div><span id="archive-view-count" class="count">3 bookmarks</span></div>
        <div id="archive-results" class="bookmark-list" aria-live="polite"></div>
        <div id="archive-empty" class="empty-state" hidden><div class="empty-icon">◴</div><h3 id="archive-empty-title">Nothing set aside</h3><p id="archive-empty-copy">Bookmarks you archive will stay safe here until you restore them.</p></div>
      </section>
    </div>
  </main>
  <div id="archive-toast" class="toast" role="status">Moved to Archive.</div>
  <script src="archive.js"></script>
</body>
</html>
