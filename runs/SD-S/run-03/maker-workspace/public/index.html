<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="app__header">
        <h1>Bookmark Manager</h1>
        <p class="app__subtitle">Save, organize, and find your links.</p>
      </header>

      <section class="card add-card">
        <h2>Add a bookmark</h2>
        <form id="add-form" class="bookmark-form" autocomplete="off">
          <div class="field">
            <label for="add-url">Web address</label>
            <input id="add-url" name="url" type="text" placeholder="https://example.com" required />
          </div>
          <div class="field">
            <label for="add-title">Title <span class="muted">(optional)</span></label>
            <input id="add-title" name="title" type="text" placeholder="Auto-filled from the page if left blank" />
          </div>
          <div class="field">
            <label for="add-tags">Tags <span class="muted">(comma-separated)</span></label>
            <input id="add-tags" name="tags" type="text" placeholder="reading, tech" />
          </div>
          <div class="form-row">
            <button type="submit" class="btn btn--primary">Save bookmark</button>
            <p id="add-error" class="form-error" role="alert" hidden></p>
          </div>
        </form>
      </section>

      <section class="controls">
        <input id="search" type="search" class="search" placeholder="Search title, address, or tag…" aria-label="Search bookmarks" />
        <div id="tag-filters" class="tag-filters" aria-label="Filter by tag"></div>
      </section>

      <section id="list-section">
        <div id="empty-state" class="state" hidden>
          <p>No bookmarks yet. Add your first one above.</p>
        </div>
        <div id="no-results" class="state" hidden>
          <p>No bookmarks match your search or filter.</p>
        </div>
        <ul id="bookmark-list" class="bookmark-list"></ul>
      </section>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
