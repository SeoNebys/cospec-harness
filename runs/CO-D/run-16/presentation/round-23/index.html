<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — prototype</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1c2430; --muted:#6b7686;
    --line:#e6e9ef; --accent:#2f6fed; --accent-soft:#eaf1ff; --chip:#eef1f6;
    --warn:#8a5a00; --warn-soft:#fff4e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  .composer{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:28px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .composer label{display:block;font-size:12px;font-weight:600;color:var(--muted);
    margin:0 0 4px;letter-spacing:.02em;text-transform:uppercase}
  .composer input,.composer textarea{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .composer input:focus,.composer textarea:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}
  .row{margin-bottom:12px}
  .two{display:flex;gap:12px}
  .two>div{flex:1}
  textarea{resize:vertical;min-height:52px}
  .readlater{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;color:#37414f;cursor:pointer}
  .readlater input{width:auto}
  .readlater em{color:var(--muted);font-style:normal;font-size:13px}
  .save{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 18px;
    font-size:15px;font-weight:600;cursor:pointer}
  .save:hover{background:#255fd6}

  /* auto-fill preview */
  .preview{display:none;align-items:center;gap:10px;background:#f9fbff;border:1px solid var(--accent-soft);
    border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
  .preview.show{display:flex}
  .spinner{width:14px;height:14px;border:2px solid #cdd7ea;border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .fetchnote{background:var(--warn-soft);color:var(--warn);border:1px solid #f0d9a8;border-radius:10px;
    padding:8px 12px;margin-bottom:12px;font-size:13px}
  .fields{display:none}
  .fields.show{display:block}

  .favicon{width:20px;height:20px;border-radius:4px;flex:0 0 20px;display:inline-flex;
    align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;
    background:var(--accent);overflow:hidden}
  .favicon img{width:100%;height:100%;object-fit:cover}

  .previmg{width:100%;height:120px;border-radius:10px;margin-bottom:12px;
    background-size:cover;background-position:center;border:1px solid var(--line)}
  .item .previmg{height:150px;margin:10px 0 0}

  /* tag input */
  .tagwrap{position:relative}
  .suggest{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);
    border-radius:9px;box-shadow:0 6px 20px rgba(20,30,50,.12);margin-top:4px;z-index:5;overflow:hidden;display:none}
  .suggest.show{display:block}
  .suggest div{padding:8px 12px;font-size:14px;cursor:pointer}
  .suggest div:hover,.suggest div.active{background:var(--accent-soft)}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 16px;
    font-size:14px;color:#41505f;cursor:pointer}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .tc{opacity:.7;font-size:12px;margin-left:4px}
  .tab.active .tc{opacity:.85}

  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;
    border-radius:20px;font-weight:600}
  .status-pill.unread{background:#eaf1ff;color:#2f6fed}
  .status-pill.done{background:#e7f6ec;color:#1f8a4c}
  .status-pill.archived-pill{background:#eef1f6;color:#6b7686}
  .toggle-btn.danger{color:#c0392b}
  .toggle-btn.danger:hover{border-color:#c0392b;color:#c0392b}
  .rowactions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .toggle-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;
    font-size:13px;color:#41505f;cursor:pointer}
  .toggle-btn:hover{border-color:var(--accent);color:var(--accent)}

  .searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:4px 12px;margin-bottom:20px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbar .mag{font-size:14px;opacity:.6}
  .searchbar input{flex:1;border:none;outline:none;font-size:15px;padding:8px 0;background:transparent;color:var(--ink)}
  .clearsearch{border:none;background:none;color:var(--muted);font-size:14px;cursor:pointer;display:none}
  .clearsearch.show{display:block}
  mark{background:#fff1a8;color:inherit;border-radius:3px;padding:0 1px}
  .savesearch{border:none;background:none;color:var(--accent);font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600}
  .savesearch:disabled{color:var(--muted);cursor:default;font-weight:400;opacity:.6}
  .savedsearches{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 18px}
  .savedsearches:empty{margin:0}
  .savedchip{display:inline-flex;align-items:center;gap:6px;background:#eef4ff;border:1px solid var(--accent-soft);
    border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;color:var(--accent);cursor:pointer}
  .savedchip:hover{background:#e0ebff}
  .savedchip .x{border:none;background:none;color:var(--accent);cursor:pointer;font-size:13px;
    width:18px;height:18px;border-radius:50%;line-height:1}
  .savedchip .x:hover{background:#cfe0ff}
  .savedchip .star{opacity:.8}
  .noteview{font-size:14px;color:#37414f;background:#f9fafc;border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;margin:8px 0 0}
  .noteview ul{margin:4px 0;padding-left:20px}
  .noteview div{margin:2px 0}
  .noteview a{color:var(--accent)}
  .noteview ol{margin:4px 0;padding-left:22px}
  .noteview h3{font-size:16px;margin:8px 0 4px}
  .noteview h4{font-size:15px;margin:8px 0 4px}
  .noteview h5{font-size:14px;margin:8px 0 4px}
  .noteview blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--accent-soft);color:#5b6673}
  .noteview code{background:#eef1f6;border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .noteview pre{background:#f2f4f8;border-radius:8px;padding:10px 12px;overflow:auto;margin:6px 0}
  .noteview pre code{background:none;padding:0}
  .snapview{font-size:14px;color:#37414f;background:#f9fafc;border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;margin:8px 0 0}
  .snap-row{margin:2px 0}
  .snap-preview{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;background:#fff}
  .linklike{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0;text-decoration:underline}
  .noteex{font-size:13px;color:#5b6673;background:#f7f8fa;border-left:3px solid var(--line);
    border-radius:6px;padding:6px 10px;margin:8px 0 0;font-style:italic}

  .listhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
  .listhead h2{font-size:15px;margin:0}
  .listhead-right{display:flex;align-items:center;gap:14px}
  .count{color:var(--muted);font-size:13px}
  .sortlabel{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .sortlabel select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;
    background:#fff;color:var(--ink);cursor:pointer}

  .selectrow{margin:0 0 10px}
  .selectall{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}
  .selectall input{width:auto}
  .bulkbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#eef4ff;
    border:1px solid var(--accent-soft);border-radius:11px;padding:10px 14px;margin-bottom:16px}
  .bulkbar.show{display:flex}
  .bulkcount{font-size:14px;font-weight:600;color:var(--accent)}
  .bulkactions{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .bulkactions button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;
    font-size:13px;color:#41505f;cursor:pointer}
  .bulkactions button:hover{border-color:var(--accent);color:var(--accent)}
  .bulkactions button.danger{color:#c0392b}
  .bulkactions button.danger:hover{border-color:#c0392b}
  .bulkclear{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
  .bulktagpanel{flex-basis:100%;display:none}
  .bulktagpanel.show{display:block}
  .bulktagpanel .pnl{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px}
  .bulktagpanel .pl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block}
  .bulktagpanel input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chips .tag{cursor:pointer}
  .chips .tag:hover{background:var(--accent-soft);color:var(--accent)}
  .pnl-actions{display:flex;gap:8px;margin-top:8px}
  .pnl-actions .save{padding:7px 14px;font-size:14px}
  .pnl-actions .cancel{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:#41505f}
  .item .selbox{margin-right:2px}
  .item.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  .empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);
    border-radius:14px;background:#fff}
  .empty .big{font-size:15px;color:var(--ink);margin-bottom:4px}

  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .item .head{display:flex;gap:10px;align-items:flex-start}
  .item .favicon{width:28px;height:28px;flex:0 0 28px;border-radius:6px;font-size:14px;margin-top:2px}
  .item .title{font-size:16px;font-weight:600;margin:0 0 2px}
  .item .title a{color:var(--ink);text-decoration:none}
  .item .title a:hover{text-decoration:underline}
  .item .url{font-size:12px;color:var(--accent);word-break:break-all;margin:0}
  .item .desc{font-size:14px;color:#37414f;margin:8px 0 10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:var(--chip);color:#41505f;font-size:12px;padding:3px 9px;border-radius:20px}
  .tag.clickable{cursor:pointer}
  .tag.clickable:hover{background:var(--accent-soft);color:var(--accent)}
  .edit-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;
    font-size:13px;color:#41505f;cursor:pointer;margin-top:10px}
  .edit-btn:hover{border-color:var(--accent);color:var(--accent)}
  .just-added{animation:flash 1.4s ease}
  .highlight{box-shadow:0 0 0 3px var(--accent-soft),0 1px 2px rgba(20,30,50,.04);border-color:var(--accent)}
  @keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--card)}}

  .dupbanner{display:none;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);
    border:1px solid #f0d9a8;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:14px}
  .dupbanner.show{display:flex}

  /* inline editor */
  .editor{background:#f9fbff;border:1px dashed var(--accent);border-radius:10px;padding:12px;margin-top:10px}
  .editor label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px;text-transform:uppercase}
  .editor input,.editor textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:14px;font-family:inherit;margin-bottom:8px}
  .editor .save{padding:7px 14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Paste a link — the title, description and site icon fill in for you.</p>

  <div class="dupbanner" id="dupbanner"></div>

  <form class="composer" id="composer">
    <div class="row">
      <label for="url">Link</label>
      <input id="url" type="text" placeholder="Paste or type a web address" autocomplete="off">
    </div>

    <div class="preview" id="preview">
      <span class="spinner"></span><span>Fetching page details…</span>
    </div>

    <div class="fetchnote" id="fetchnote" style="display:none"></div>

    <div class="fields" id="fields">
      <div class="previmg" id="previmg" style="display:none"></div>
      <div class="row two" style="align-items:flex-start">
        <div style="flex:0 0 auto">
          <label>Icon</label>
          <span class="favicon" id="favicon" style="width:38px;height:38px;font-size:16px"></span>
        </div>
        <div>
          <label for="title">Title</label>
          <input id="title" type="text" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <label for="desc">Description</label>
        <textarea id="desc"></textarea>
      </div>
      <div class="row tagwrap">
        <label for="tags">Tags</label>
        <input id="tags" type="text" placeholder="Type a tag, comma to add another" autocomplete="off">
        <div class="suggest" id="suggest"></div>
      </div>
      <div class="row">
        <label for="note">Note (private)</label>
        <textarea id="note" placeholder="Optional reminder to yourself"></textarea>
        <div class="hint">Markdown: # headings, **bold**, *italic*, `code`, ``` fenced code ```, &gt; quotes, - bullets, 1. numbered, [link](https://…).</div>
      </div>
      <label class="readlater">
        <input type="checkbox" id="readlater" checked>
        <span>Save to read later <em>(add it to your “To read” list)</em></span>
      </label>
      <button class="save" type="submit">Save bookmark</button>
    </div>
  </form>

  <div class="tabs" id="tabs">
    <button class="tab active" data-f="all">All <span class="tc" id="tc-all"></span></button>
    <button class="tab" data-f="unread">To read <span class="tc" id="tc-unread"></span></button>
    <button class="tab" data-f="done">Finished <span class="tc" id="tc-done"></span></button>
    <button class="tab" data-f="archived">Archived <span class="tc" id="tc-archived"></span></button>
  </div>

  <div class="searchbar">
    <span class="mag">🔍</span>
    <input id="search" type="text" placeholder="Search by title, note, tag, description, or address" autocomplete="off">
    <button class="clearsearch" id="clearsearch" title="Clear">✕</button>
    <button class="savesearch" id="savesearch" title="Save this search">＋ Save search</button>
  </div>

  <div class="savedsearches" id="savedsearches"></div>

  <div class="listhead">
    <h2>Saved</h2>
    <div class="listhead-right">
      <span class="count" id="count"></span>
      <label class="sortlabel">Sort:
        <select id="sortsel">
          <option value="added_desc">Newest first</option>
          <option value="added_asc">Oldest first</option>
          <option value="title_asc">Title A–Z</option>
          <option value="title_desc">Title Z–A</option>
        </select>
      </label>
    </div>
  </div>

  <div class="selectrow">
    <label class="selectall"><input type="checkbox" id="selectall"> <span>Select all in this view</span></label>
  </div>

  <div class="bulkbar" id="bulkbar">
    <span class="bulkcount" id="bulkcount"></span>
    <div class="bulkactions" id="bulkactions"></div>
    <button class="bulkclear" id="bulkclear">Clear selection</button>
    <div class="bulktagpanel" id="bulktagpanel"></div>
  </div>

  <div id="list"></div>
</div>

<script>
  // ---- simulated page-metadata lookup (a prototype fakes the external fetch) ----
  var CANNED = {
    'nytimes.com': {t:'The New York Times — Breaking News', d:'Live coverage of world news, politics, business, and culture.'},
    'wikipedia.org': {t:'Wikipedia, the free encyclopedia', d:'The free encyclopedia that anyone can edit.'},
    'seriouseats.com': {t:'Serious Eats: Recipes & Techniques', d:'Tested recipes and the science of great home cooking.'},
    'github.com': {t:'GitHub', d:'Where the world builds software.'},
    'youtube.com': {t:'YouTube', d:'Watch, share, and discover videos.'}
  };
  function domainOf(url){
    var u = url.replace(/^https?:\/\//i,'').replace(/^www\./i,'');
    return u.split('/')[0].toLowerCase();
  }
  // In the real app the file kind is decided by the content type the link actually returns.
  // This preview simulates that: a "pdf" hint anywhere in the address (with or without a
  // clean .pdf ending) is treated as a PDF; everything else is a normal page.
  function detectFileKind(url){
    var u=url.toLowerCase();
    if(/\.pdf(\b|[/?#]|$)/.test(u) || /[?&](type|format|mime)=pdf\b/.test(u) || /\/pdf\//.test(u)) return 'pdf';
    return 'page';
  }
  function isValidUrl(url){
    if(/\s/.test(url)) return false; // addresses have no spaces
    return /^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(\/[^\s]*)?$/i.test(url);
  }
  function normalize(url){
    return url.replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/+$/,'').toLowerCase();
  }
  function palette(dom){
    var colors=['#2f6fed','#e0663a','#2fa36b','#8a4fd0','#d0434f','#1f8a9c','#c78a1a'];
    var s=0; for(var i=0;i<dom.length;i++) s+=dom.charCodeAt(i);
    return colors[s%colors.length];
  }
  function faviconHTML(dom,cls){
    var letter = dom.charAt(0).toUpperCase();
    var color = palette(dom);
    // try a real favicon, fall back to a colored letter tile
    return '<span class="favicon'+(cls?' '+cls:'')+'" style="background:'+color+'">'+
      '<img src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(dom)+'&sz=64" '+
      'onerror="this.style.display=\'none\'" alt="">'+
      '<span style="position:absolute">'+letter+'</span></span>';
  }
  function previewImg(dom){
    // simulated preview image: a domain-derived gradient stands in for the page's image
    var c1=palette(dom); var c2=palette(dom.split('').reverse().join('')+'x');
    return 'linear-gradient(135deg,'+c1+' 0%,'+c2+' 100%)';
  }
  function lookup(url){
    var dom = domainOf(url);
    var base = CANNED[dom];
    if(base) return {title:base.t, desc:base.d, dom:dom, img:previewImg(dom)};
    var name = dom.split('.')[0];
    name = name.charAt(0).toUpperCase()+name.slice(1);
    return {title:name, desc:'A page saved from '+dom+'.', dom:dom, img:previewImg(dom)};
  }

  var items = [];
  var usedTags = {};
  var listEl=document.getElementById('list'), countEl=document.getElementById('count');
  var urlEl=document.getElementById('url'), previewEl=document.getElementById('preview'),
      fieldsEl=document.getElementById('fields'), faviconEl=document.getElementById('favicon'),
      titleEl=document.getElementById('title'), descEl=document.getElementById('desc'),
      tagsEl=document.getElementById('tags'), noteEl=document.getElementById('note'),
      suggestEl=document.getElementById('suggest'), dupEl=document.getElementById('dupbanner'),
      previmgEl=document.getElementById('previmg');
  var currentDom='', currentImg='';
  var fetchTimer=null;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // safe Markdown-subset note formatting. Editor keeps the raw Markdown; this only renders for viewing.
  // Supports: # headings, - / * bullets, 1. numbered lists, > block quotes, `inline code`,
  //           ``` fenced code ```, **bold**, *italic*, [text](http-url), line breaks.
  function renderNoteInline(s){
    // protect inline code first so its contents aren't further formatted
    var codes=[];
    s=s.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return '␀'+(codes.length-1)+'␀';});
    s=esc(s);
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,function(m,t,u){
      return '<a href="'+u+'" target="_blank" rel="noopener">'+esc(t)+'</a>';});
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s=s.replace(/␀(\d+)␀/g,function(m,i){return '<code>'+esc(codes[+i])+'</code>';});
    return s;
  }
  function renderNote(md){
    if(!md) return '';
    var lines=String(md).split(/\r?\n/), html='', listType=null, inQuote=false, inCode=false, codeBuf=[];
    function closeList(){ if(listType){html+='</'+listType+'>'; listType=null;} }
    function closeQuote(){ if(inQuote){html+='</blockquote>'; inQuote=false;} }
    lines.forEach(function(ln){
      if(/^\s*```/.test(ln)){
        if(inCode){ html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>'; codeBuf=[]; inCode=false; }
        else { closeList(); closeQuote(); inCode=true; }
        return;
      }
      if(inCode){ codeBuf.push(ln); return; }
      var h=ln.match(/^\s*(#{1,3})\s+(.*)$/);
      var ul=ln.match(/^\s*[-*]\s+(.*)$/);
      var ol=ln.match(/^\s*\d+\.\s+(.*)$/);
      var bq=ln.match(/^\s*>\s?(.*)$/);
      if(h){ closeList(); closeQuote(); html+='<h'+(h[1].length+2)+'>'+renderNoteInline(h[2])+'</h'+(h[1].length+2)+'>'; }
      else if(ul){ closeQuote(); if(listType!=='ul'){closeList();html+='<ul>';listType='ul';} html+='<li>'+renderNoteInline(ul[1])+'</li>'; }
      else if(ol){ closeQuote(); if(listType!=='ol'){closeList();html+='<ol>';listType='ol';} html+='<li>'+renderNoteInline(ol[1])+'</li>'; }
      else if(bq){ closeList(); if(!inQuote){html+='<blockquote>';inQuote=true;} html+='<div>'+renderNoteInline(bq[1])+'</div>'; }
      else { closeList(); closeQuote(); if(ln.trim()!=='') html+='<div>'+renderNoteInline(ln)+'</div>'; }
    });
    if(inCode){ html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>'; }
    closeList(); closeQuote();

  var query='';

  // ---- search query language ----
  // tokens: ( ) , "phrase" , #tag , AND/OR/NOT (unquoted) , bare words
  function tokenize(input){
    var toks=[], i=0, n=input.length;
    function isSpace(c){return c===' '||c==='\t'||c==='\n';}
    while(i<n){
      var c=input[i];
      if(isSpace(c)){i++;continue;}
      if(c==='('){toks.push({t:'lp'});i++;continue;}
      if(c===')'){toks.push({t:'rp'});i++;continue;}
      if(c==='"'){ // phrase (literal, even if it's AND/OR/NOT)
        i++; var s='';
        while(i<n && input[i]!=='"'){s+=input[i++];}
        i++; // closing quote
        toks.push({t:'term',kind:'text',v:s.toLowerCase()});
        continue;
      }
      if(c==='#'){ // tag term, allows #"multi word"
        i++; var tg='';
        if(input[i]==='"'){ i++; while(i<n && input[i]!=='"'){tg+=input[i++];} i++; }
        else { while(i<n && !isSpace(input[i]) && input[i]!=='(' && input[i]!==')'){tg+=input[i++];} }
        toks.push({t:'term',kind:'tag',v:tg.toLowerCase()});
        continue;
      }
      // bare word
      var w='';
      while(i<n && !isSpace(input[i]) && input[i]!=='(' && input[i]!==')'){w+=input[i++];}
      var up=w.toUpperCase();
      if(up==='AND'||up==='OR'||up==='NOT') toks.push({t:'op',v:up});
      else toks.push({t:'term',kind:'text',v:w.toLowerCase()});
    }
    return toks;
  }

  function fieldHay(b){return [b.title,b.desc,b.note,b.url].join(' ').toLowerCase();}
  function leafPred(tok){
    if(tok.kind==='tag'){
      return function(b){return (b.tags||[]).some(function(t){return t.toLowerCase()===tok.v;});};
    }
    return function(b){return fieldHay(b).indexOf(tok.v)>=0 ||
      (b.tags||[]).some(function(t){return t.toLowerCase().indexOf(tok.v)>=0;});};
  }

  // recursive-descent: OR (lowest) -> AND (implicit too) -> NOT -> primary
  function parse(toks){
    var pos=0, terms=[];
    function peek(){return toks[pos];}
    function eat(){return toks[pos++];}
    function parseOr(){
      var left=parseAnd();
      while(peek() && peek().t==='op' && peek().v==='OR'){ eat();
        var right=parseAnd(); var l=left,r=right; left=function(b){return l(b)||r(b);}; }
      return left;
    }
    function parseAnd(){
      var left=parseNot();
      while(peek() && !(peek().t==='op'&&peek().v==='OR') && peek().t!=='rp'){
        if(peek().t==='op'&&peek().v==='AND') eat(); // explicit AND
        var right=parseNot(); var l=left,r=right; left=function(b){return l(b)&&r(b);};
      }
      return left;
    }
    function parseNot(){
      if(peek() && peek().t==='op' && peek().v==='NOT'){ eat();
        var p=parseNot(); return function(b){return !p(b);}; }
      return parsePrimary();
    }
    function parsePrimary(){
      var tk=peek();
      if(!tk) return function(){return true;};
      if(tk.t==='lp'){ eat(); var e=parseOr(); if(peek()&&peek().t==='rp') eat(); return e; }
      if(tk.t==='term'){ eat(); terms.push(tk.v); return leafPred(tk); }
      eat(); return function(){return true;}; // stray op/rp
    }
    var pred=parseOr();
    return {pred:pred, terms:terms};
  }

  function buildSearch(raw){
    var q=raw.trim();
    if(!q) return {pred:function(){return true;}, terms:[], active:false};
    try{ var r=parse(tokenize(q)); return {pred:r.pred, terms:r.terms, active:true}; }
    catch(e){ var lc=q.toLowerCase();
      return {pred:function(b){return fieldHay(b).indexOf(lc)>=0;}, terms:[lc], active:true}; }
  }

  function hlMulti(text,terms){
    var s=esc(text||'');
    if(!terms||!terms.length) return s;
    terms.forEach(function(t){
      if(!t) return;
      var re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
      s=s.replace(re,function(m,p1,off,full){
        // avoid double-wrapping inside an existing tag/mark by simple check
        return ''+p1+'';
      });
    });
    return s.replace(//g,'<mark>').replace(//g,'</mark>');
  }

  // note excerpt around the first matching term
  function noteExcerpt(note,terms){
    if(!note||!terms||!terms.length) return '';
    var low=note.toLowerCase(), hit=-1, hitLen=0;
    terms.forEach(function(t){ if(!t) return; var i=low.indexOf(t); if(i>=0 && (hit<0||i<hit)){hit=i;hitLen=t.length;} });
    if(hit<0) return '';
    var pad=50, start=Math.max(0,hit-pad), end=Math.min(note.length,hit+hitLen+pad);
    var frag=(start>0?'…':'')+note.slice(start,end)+(end<note.length?'…':'');
    return '<div class="noteex">📝 '+hlMulti(frag,terms)+'</div>';
  }

        case 'title_asc': return (x.title||x.url).toLowerCase().localeCompare((y.title||y.url).toLowerCase());
        case 'title_desc': return (y.title||y.url).toLowerCase().localeCompare((x.title||x.url).toLowerCase());
        default: return addedOf(y)-addedOf(x); // added_desc
      }
    });
    return a;
  }

        dupEl.innerHTML='That link is already saved as another bookmark. '+
          '<a href="#bm-'+clash.id+'" style="color:inherit;font-weight:600;margin-left:4px">Go to it →</a>';
        dupEl.classList.add('show');
        dupEl.querySelector('a').onclick=function(e){e.preventDefault();openEditor(clash.id,true);};
        openEditor(clash.id,true);
        return;
      }
      b.url=newUrl; b.dom=domainOf(newUrl); b.img=previewImg(b.dom);
    }
    b.title=document.getElementById('e-title').value.trim()||b.url;
    b.desc=document.getElementById('e-desc').value.trim();
    b.tags=parseTags(document.getElementById('e-tags').value);
    b.note=document.getElementById('e-note').value.trim();
    rememberTags(b.tags);
    render(id);
    var el=document.getElementById('bm-'+id);
    if(el){el.classList.add('highlight');setTimeout(function(){el.classList.remove('highlight');},1600);}
  };

  // ---- bulk selection ----
  window.toggleSelect=function(id){
    if(selected[id]) delete selected[id]; else selected[id]=true;
    render();
  };
  function selectedItems(){ return items.filter(function(b){return selected[b.id];}); }

  function updateBulkUI(){
    var bar=document.getElementById('bulkbar');
    var saEl=document.getElementById('selectall');
    var n=selCount();
    // select-all reflects whether every currently shown item is selected
    saEl.checked = lastShown.length>0 && lastShown.every(function(b){return selected[b.id];});
    if(n===0){ bar.classList.remove('show'); return; }
    bar.classList.add('show');
    document.getElementById('bulkcount').textContent=n+' selected';
    var acts=document.getElementById('bulkactions');
    if(currentTab==='archived'){
      acts.innerHTML=
        '<button onclick="bulkRestore()">Restore</button>'+
        '<button class="danger" onclick="bulkDelete()">Delete permanently</button>';
    } else {
      acts.innerHTML=
        '<button onclick="bulkAddTags()">Add tags…</button>'+
        '<button onclick="bulkRemoveTags()">Remove tags…</button>'+
        '<button onclick="bulkMark(\'unread\')">Mark “To read”</button>'+
        '<button onclick="bulkMark(\'done\')">Mark finished</button>'+
        '<button onclick="bulkArchive()">Archive</button>'+
        '<button class="danger" onclick="bulkDelete()">Delete</button>';
    }
  }

  document.getElementById('selectall').addEventListener('change',function(){
    if(this.checked){ lastShown.forEach(function(b){selected[b.id]=true;}); }
    else { lastShown.forEach(function(b){delete selected[b.id];}); }
    render();
  });
  document.getElementById('bulkclear').addEventListener('click',function(){ selected={}; render(); });
  document.getElementById('sortsel').addEventListener('change',function(){ currentSort=this.value; render(); });

  function parseTagList(raw){return raw?raw.split(',').map(function(t){return t.trim();}).filter(Boolean):[];}

  // reusable bulk tag panel with suggestions
  window.bulkAddTags=function(){ openBulkTagPanel('add'); };
  window.bulkRemoveTags=function(){ openBulkTagPanel('remove'); };
  function tagsOnSelected(){
    var seen={}, out=[];
    selectedItems().forEach(function(b){(b.tags||[]).forEach(function(t){
      var k=t.toLowerCase(); if(!seen[k]){seen[k]=true; out.push(t);} });});
    return out.sort();
  }
  function openBulkTagPanel(mode){
    var n=selCount();
    var pool = mode==='add'
      ? Object.keys(usedTags).sort()
      : tagsOnSelected();
    var label = mode==='add' ? 'Add tags to '+n+' bookmark(s)' : 'Remove tags from '+n+' bookmark(s)';
    var hint = mode==='add' ? 'Type a tag (suggestions from your existing tags), comma to add another'
                            : 'Pick tags that appear on the selected bookmarks';
    var panel=document.getElementById('bulktagpanel');
    panel.innerHTML='<div class="pnl">'+
      '<span class="pl">'+label+'</span>'+
      '<input id="btInput" placeholder="'+esc(hint)+'" autocomplete="off">'+
      '<div class="chips" id="btChips">'+
        (pool.length? pool.map(function(t){return '<span class="tag" data-t="'+esc(t)+'">'+(mode==='remove'?'✕ ':'+ ')+esc(t)+'</span>';}).join('')
                    : '<span style="font-size:13px;color:#6b7686">'+(mode==='remove'?'No tags on the selected bookmarks.':'No existing tags yet — type a new one.')+'</span>')+
      '</div>'+
      '<div class="pnl-actions"><button class="save" id="btApply">'+(mode==='add'?'Add':'Remove')+'</button>'+
      '<button class="cancel" id="btCancel">Cancel</button></div>'+
    '</div>';
    panel.classList.add('show');
    var input=document.getElementById('btInput'); input.focus();
    // clicking a suggested chip appends it to the input
    document.getElementById('btChips').querySelectorAll('.tag').forEach(function(el){
      el.onclick=function(){
        var parts=input.value.split(','); parts[parts.length-1]=' '+el.getAttribute('data-t');
        input.value=parts.join(',')+', '; input.focus();
      };
    });
    input.oninput=function(){
      var cur=(input.value.split(',').pop()||'').trim().toLowerCase();
      document.getElementById('btChips').querySelectorAll('.tag').forEach(function(el){
        var t=el.getAttribute('data-t').toLowerCase();
        el.style.display=(!cur || t.indexOf(cur)>=0)?'':'none';
      });
    };
    document.getElementById('btApply').onclick=function(){ applyBulkTags(mode, input.value); };
    input.onkeydown=function(e){ if(e.key==='Enter'){e.preventDefault(); applyBulkTags(mode, input.value);} };
    document.getElementById('btCancel').onclick=function(){ panel.classList.remove('show'); panel.innerHTML=''; };
  }
  function applyBulkTags(mode, raw){
    var list=parseTagList(raw);
    if(list.length){
      if(mode==='add'){
        selectedItems().forEach(function(b){ list.forEach(function(t){
          if(!(b.tags||[]).some(function(x){return x.toLowerCase()===t.toLowerCase();})) b.tags.push(t); }); });
        rememberTags(list);
      } else {
        var rem=list.map(function(t){return t.toLowerCase();});
        selectedItems().forEach(function(b){ b.tags=(b.tags||[]).filter(function(t){return rem.indexOf(t.toLowerCase())<0;}); });
      }
    }
    var panel=document.getElementById('bulktagpanel'); panel.classList.remove('show'); panel.innerHTML='';
    render();
  }
  window.bulkMark=function(status){ selectedItems().forEach(function(b){b.status=status;}); render(); };
  window.bulkArchive=function(){ selectedItems().forEach(function(b){b.archived=true;}); selected={}; render(); };
  window.bulkRestore=function(){ selectedItems().forEach(function(b){b.archived=false;}); selected={}; render(); };
  window.bulkDelete=function(){
    var n=selCount();
    if(!window.confirm('Delete '+n+' bookmark(s) permanently? This cannot be undone.')) return;
    items=items.filter(function(b){return !selected[b.id];}); selected={}; render();
  };

  window.toggleStatus=function(id){
    var b=items.find(function(x){return x.id===id;}); if(!b) return;
    b.status = b.status==='done' ? 'unread' : 'done';
    render();
  };
  window.archiveItem=function(id){
    var b=items.find(function(x){return x.id===id;}); if(!b) return;
    b.archived=true; render();
  };
  window.restoreItem=function(id){
    var b=items.find(function(x){return x.id===id;}); if(!b) return;
    b.archived=false; render();
  };
  window.deleteItem=function(id){
    var b=items.find(function(x){return x.id===id;}); if(!b) return;
    if(!window.confirm('Delete this bookmark permanently? This cannot be undone.\n\n'+(b.title||b.url))) return;
    items=items.filter(function(x){return x.id!==id;});
    render();
  };

  document.getElementById('tabs').addEventListener('click',function(e){
    var btn=e.target.closest('.tab'); if(!btn) return;
    currentTab=btn.getAttribute('data-f');
    Array.prototype.forEach.call(this.children,function(el){el.classList.toggle('active',el===btn);});
    render();
  });

  window.filterByTag=function(tag){
    var q = /\s/.test(tag) ? '#"'+tag+'"' : '#'+tag;
    query=q; searchEl.value=q; clearEl.classList.add('show'); render();
    window.scrollTo({top:0,behavior:'smooth'});
  };

  var searchEl=document.getElementById('search'), clearEl=document.getElementById('clearsearch');
  var saveSearchBtn=document.getElementById('savesearch');
  function syncSearchButtons(){
    clearEl.classList.toggle('show',!!query);
    saveSearchBtn.disabled = !query.trim();
  }
  searchEl.addEventListener('input',function(){
    query=searchEl.value;
    syncSearchButtons();
    render();
  });
  clearEl.addEventListener('click',function(){
    query=''; searchEl.value=''; syncSearchButtons(); render(); searchEl.focus();
  });

  // ---- reusable saved searches ----
  var savedSearches=[];
  saveSearchBtn.addEventListener('click',function(){
    var q=query.trim(); if(!q) return;
    var name=window.prompt('Name this saved search:', q); if(name===null) return;
    name=name.trim()||q;
    savedSearches.push({id:Date.now(), name:name, query:q});
    renderSavedSearches();
  });
  function renderSavedSearches(){
    var wrap=document.getElementById('savedsearches');
    wrap.innerHTML=savedSearches.map(function(s){
      return '<span class="savedchip" onclick="runSaved('+s.id+')" title="'+esc(s.query)+'">'+
        '<span class="star">★</span>'+esc(s.name)+
        '<button class="x" title="Remove" onclick="event.stopPropagation();deleteSaved('+s.id+')">✕</button></span>';
    }).join('');
  }
  window.runSaved=function(id){
    var s=savedSearches.find(function(x){return x.id===id;}); if(!s) return;
    query=s.query; searchEl.value=s.query; syncSearchButtons(); render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
  window.deleteSaved=function(id){
    savedSearches=savedSearches.filter(function(x){return x.id!==id;}); renderSavedSearches();
  };
  syncSearchButtons();

  render();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
