<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tagging — C: quick prompt right after saving</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; background:#f4f5f7; color:#1a1a1a; }
  .bar { background:#111827; color:#fff; font-size:13px; padding:6px 16px; text-align:center; }
  .wrap { max-width:640px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .savebox { display:flex; gap:8px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; margin-bottom:24px; }
  .savebox input { flex:1; border:1px solid #d1d5db; border-radius:8px; padding:10px 12px; font-size:15px; }
  .savebtn { border:0; background:#2563eb; color:#fff; font-size:15px; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:13px 15px; margin-bottom:10px; }
  li.fresh { border-color:#93c5fd; box-shadow:0 0 0 3px #dbeafe; }
  .title { font-size:15px; font-weight:600; margin:0 0 2px; }
  .url { font-size:12.5px; color:#6b7280; margin:0 0 8px; }
  .prompt { font-size:12px; color:#2563eb; margin:0 0 6px; font-weight:600; }
  .rowchips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; position:relative; }
  .chip { background:#eef2ff; color:#4338ca; border:1px solid #dbe1ff; border-radius:20px; font-size:12.5px; padding:2px 8px; display:inline-flex; gap:5px; align-items:center; }
  .chip b { cursor:pointer; color:#818cf8; font-weight:700; }
  .taginput { border:1px solid #93c5fd; border-radius:20px; font-size:12.5px; padding:4px 12px; outline:0; width:160px; }
  .skip { background:none; border:0; color:#9ca3af; font-size:12px; cursor:pointer; text-decoration:underline; }
  .sugg { position:absolute; top:100%; left:0; background:#fff; border:1px solid #e5e7eb; border-radius:8px; margin-top:4px; box-shadow:0 6px 20px rgba(0,0,0,.08); z-index:5; min-width:160px; overflow:hidden; }
  .sugg div { padding:7px 12px; font-size:13.5px; cursor:pointer; }
  .sugg div:hover, .sugg div.hl { background:#eef2ff; }
</style>
</head>
<body>
<div class="bar">VERSION C — save instantly, then a quick tag prompt on the new link (type or skip)</div>
<div class="wrap">
  <h1>Save a link</h1>
  <div class="savebox">
    <input id="url" placeholder="Paste a link…" autofocus />
    <button class="savebtn" id="save">Save</button>
  </div>
  <ul id="list"></ul>
</div>
<script>
  const KNOWN = ['Travel','Japan','Tech','AI','Web Dev','Cooking','Gadgets','Reviews'];
  const items = [
    { title:'A 3-Day Guide to Kyoto in Autumn', host:'nytimes.com', tags:['Travel','Japan'], fresh:false }
  ];
  const listEl = document.getElementById('list');
  let hl = -1;
  function niceTitle(u){ const b=(u.replace(/^https?:\/\//,'').replace(/^www\./,'').split('.')[0])||u; return b.charAt(0).toUpperCase()+b.slice(1); }

  function render(){
    listEl.innerHTML='';
    items.forEach((it,idx)=>{
      const li=document.createElement('li');
      if(it.fresh) li.className='fresh';
      const chips=it.tags.map((t,i)=>'<span class="chip">'+t+' <b data-i="'+i+'">×</b></span>').join('');
      let body='<p class="title">'+it.title+'</p><p class="url">'+it.host+'</p>';
      if(it.fresh){
        body+='<p class="prompt">Add tags for this?</p><div class="rowchips">'+chips+
          '<span style="position:relative"><input class="taginput" id="ti" placeholder="type a tag…" autocomplete="off" /><div class="sugg" id="sugg" style="display:none"></div></span>'+
          '<button class="skip" id="skip">skip</button></div>';
      } else {
        body+='<div class="rowchips">'+(it.tags.length?chips:'<span class="url">no tags</span>')+'</div>';
      }
      li.innerHTML=body; listEl.appendChild(li);
      li.querySelectorAll('.chip b').forEach(b=>b.onclick=()=>{ it.tags.splice(+b.dataset.i,1); render(); });
    });
    wireFresh();
  }
  function wireFresh(){
    const ti=document.getElementById('ti'); if(!ti) return;
    const sugg=document.getElementById('sugg'); const it=items.find(i=>i.fresh);
    function addTag(t){ t=t.trim(); if(t && !it.tags.includes(t)) it.tags.push(t); render(); document.getElementById('ti').focus(); }
    function renderSugg(){
      const q=ti.value.trim().toLowerCase();
      const m=KNOWN.filter(t=>t.toLowerCase().includes(q)&&!it.tags.includes(t));
      if(!q||!m.length){ sugg.style.display='none'; return; }
      sugg.innerHTML=m.map((t,i)=>'<div class="'+(i===hl?'hl':'')+'" data-t="'+t+'">'+t+'</div>').join('');
      sugg.style.display='block';
      sugg.querySelectorAll('div').forEach(d=>d.onmousedown=e=>{e.preventDefault();addTag(d.dataset.t);});
    }
    ti.focus();
    ti.addEventListener('input',()=>{hl=-1;renderSugg();});
    ti.addEventListener('keydown',e=>{
      const opts=sugg.querySelectorAll('div');
      if(e.key==='ArrowDown'){e.preventDefault();hl=Math.min(hl+1,opts.length-1);renderSugg();}
      else if(e.key==='ArrowUp'){e.preventDefault();hl=Math.max(hl-1,0);renderSugg();}
      else if(e.key==='Enter'){e.preventDefault(); if(hl>=0&&opts[hl])addTag(opts[hl].dataset.t); else if(ti.value.trim())addTag(ti.value); else finish();}
      else if(e.key==='Escape'){finish();}
    });
    document.getElementById('skip').onclick=finish;
  }
  function finish(){ items.forEach(i=>i.fresh=false); render(); document.getElementById('url').focus(); }
  document.getElementById('save').onclick=()=>{
    const u=document.getElementById('url').value.trim(); if(!u) return;
    items.forEach(i=>i.fresh=false);
    items.unshift({title:niceTitle(u),host:u.replace(/^https?:\/\//,''),tags:[],fresh:true});
    document.getElementById('url').value=''; render();
  };
  document.getElementById('url').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('save').click(); });
  render();
</script>
</body>
</html>
