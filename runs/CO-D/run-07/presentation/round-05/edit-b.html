<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — Option B</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="mode">Option B · Quick check before it's saved</div>
  <p>Save a link — the details appear in a short editable preview; adjust if needed, then confirm.</p>
</header>
<main>
  <div class="saver">
    <label for="url">Paste a link to save</label>
    <div class="saver-row">
      <input id="url" type="url" placeholder="https://…" autocomplete="off" />
      <button id="saveBtn" class="btn">Save</button>
    </div>
    <div class="hint">You see the details before the item is added, with a chance to fix them.</div>
  </div>
  <div id="stage"></div>
  <p class="section-title">Saved</p>
  <div id="list"></div>
  <div id="empty" class="empty">Nothing saved yet.</div>
</main>
<script>window.EDIT_MODE = "b";</script>
<script src="shared.js"></script>
</body>
</html>
