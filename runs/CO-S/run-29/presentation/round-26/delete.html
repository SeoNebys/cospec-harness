<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarks — Deletion approaches</title>
  <style>
    :root{--ink:#1d2925;--muted:#697772;--paper:#f7f5ef;--card:#fffdfa;--line:#dedbd1;--green:#286851;--green-dark:#174b39;--green-soft:#e4efe8;--red:#a33a34;--red-soft:#f7e8e5;--shadow:0 18px 50px rgba(32,45,40,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 14% 5%,rgba(191,215,198,.36),transparent 27rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.shell{width:min(1080px,calc(100% - 48px));margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;height:88px;border-bottom:1px solid rgba(102,116,109,.18)}.brand{display:flex;align-items:center;gap:11px;font:700 22px/1 Georgia,serif}.brand-mark{display:grid;place-items:center;width:34px;height:34px;color:#fff;background:var(--green);border-radius:11px 11px 11px 4px}.approach-switch{display:flex;gap:5px;padding:4px;background:#ebe9e1;border-radius:12px}.approach-switch a{padding:8px 13px;color:var(--muted);border-radius:9px;font-size:13px;font-weight:800;text-decoration:none}.approach-switch a.active{color:var(--ink);background:var(--card);box-shadow:0 2px 7px rgba(31,43,38,.09)}
    main{padding:56px 0 110px}.eyebrow{margin:0 0 9px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font:500 43px/1.08 Georgia,serif;letter-spacing:-.035em}.intro{margin:13px 0 38px;color:var(--muted);line-height:1.55}.collection-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}h2{margin:0;font:600 24px/1.2 Georgia,serif}.count{color:var(--muted);font-size:14px}
    .selection-toolbar{display:none;align-items:center;justify-content:space-between;gap:16px;margin:0 0 14px;padding:12px 15px;color:var(--green-dark);background:var(--green-soft);border:1px solid #c8ddd0;border-radius:14px}.selection-toolbar.visible{display:flex}.selected-count{font-size:14px;font-weight:800}.danger{padding:10px 14px;color:#fff;background:var(--red);border:0;border-radius:10px;font-weight:800;cursor:pointer}.danger:hover{background:#862f2a}
    .bookmark-list{display:grid;gap:10px}.bookmark-card{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:14px;padding:17px 18px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 16px rgba(45,56,50,.04)}.bookmark-card.with-selection{grid-template-columns:28px 46px minmax(0,1fr) auto}.bookmark-card.selected{border-color:#8fb7a5;box-shadow:0 0 0 2px rgba(40,104,81,.1)}.bookmark-card.removing{opacity:0;transform:translateX(15px);transition:.18s ease}.select-control{width:18px;height:18px;accent-color:var(--green)}.site-icon{display:grid;place-items:center;width:44px;height:44px;color:var(--green);background:var(--green-soft);border-radius:12px;font:700 18px/1 Georgia,serif}.bookmark-title{margin:0 0 4px;font-size:15px;font-weight:800}.bookmark-url{margin:0 0 7px;color:var(--muted);font-size:13px}.collection-chip{display:inline-block;padding:4px 8px;color:var(--green);background:var(--green-soft);border-radius:999px;font-size:11px;font-weight:800}.delete-icon{display:grid;place-items:center;width:38px;height:38px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer}.delete-icon:hover{color:var(--red);background:var(--red-soft);border-color:#ebccc7}.trash{position:relative;width:14px;height:15px;border:2px solid currentColor;border-top:0;border-radius:1px 1px 3px 3px}.trash::before{content:"";position:absolute;left:-3px;top:-5px;width:16px;border-top:2px solid currentColor}.trash::after{content:"";position:absolute;left:3px;top:-8px;width:5px;height:3px;border:2px solid currentColor;border-bottom:0;border-radius:3px 3px 0 0}
    dialog{width:min(450px,calc(100% - 32px));padding:0;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(20,31,27,.46);backdrop-filter:blur(3px)}.dialog-body{padding:28px}.warning-mark{display:grid;place-items:center;width:46px;height:46px;margin-bottom:18px;color:var(--red);background:var(--red-soft);border-radius:14px;font-size:22px;font-weight:900}.dialog-body h2{margin:0 0 8px;font:600 25px/1.2 Georgia,serif}.dialog-body p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}.secondary{padding:10px 14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;font-weight:750;cursor:pointer}
    .toast{position:fixed;right:28px;bottom:28px;display:none;align-items:center;gap:10px;max-width:400px;padding:14px 17px;color:#fff;background:var(--green-dark);border-radius:12px;box-shadow:0 12px 35px rgba(23,75,57,.25);font-size:14px;font-weight:750}.toast.visible{display:flex}.toast-check{display:grid;place-items:center;width:22px;height:22px;color:var(--green-dark);background:#fff;border-radius:50%;font-size:13px;font-weight:900}.empty{display:grid;place-items:center;min-height:285px;padding:40px;text-align:center;background:rgba(255,253,250,.76);border:1px solid var(--line);border-radius:21px}.empty-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;color:var(--green);background:var(--green-soft);border-radius:17px;font-size:27px}.empty h3{margin:0 0 8px}.empty p{margin:0 0 22px;color:var(--muted)}.empty .primary{padding:11px 16px;color:#fff;background:var(--green);border:0;border-radius:10px;font-weight:800;cursor:pointer}
    @media(max-width:650px){.shell{width:min(100% - 28px,1080px)}header{height:auto;min-height:78px;gap:12px;flex-wrap:wrap;padding:12px 0}main{padding-top:42px}.bookmark-card.with-selection{grid-template-columns:25px 42px minmax(0,1fr)}.bookmark-card.with-selection .collection-chip{grid-column:3}.toast{right:14px;bottom:14px;left:14px}}
  </style>
</head>
<body>
  <div class="shell" data-harness-ready="true">
    <header><div class="brand"><span class="brand-mark">B</span> Bookmarks</div><nav class="approach-switch" aria-label="Deletion approach"><a id="approach-one" href="?approach=direct">Approach 1</a><a id="approach-two" href="?approach=select">Approach 2</a></nav></header>
    <main>
      <p class="eyebrow">Remove what you no longer need</p><h1>Keep your collection useful.</h1><p class="intro" id="intro"></p>
      <div class="collection-heading"><h2>All bookmarks</h2><span class="count" id="count">6 bookmarks</span></div>
      <div class="selection-toolbar" id="selection-toolbar"><span class="selected-count" id="selected-count">0 selected</span><button class="danger" id="remove-selected" type="button">Delete selected</button></div>
      <section class="bookmark-list" id="bookmark-list"></section>
    </main>
  </div>
  <dialog id="confirm-dialog">
    <div class="dialog-body"><div class="warning-mark">!</div><h2 id="dialog-title">Delete bookmark?</h2><p id="dialog-copy"></p><div class="actions"><button class="secondary" id="cancel" type="button">Keep it</button><button class="danger" id="confirm-delete" type="button">Delete bookmark</button></div></div>
  </dialog>
  <div class="toast" id="toast" aria-live="polite"><span class="toast-check">✓</span><span id="toast-text"></span></div>
  <script>
    const fullData=[
      ['mdn','MDN Web Docs','developer.mozilla.org','Web development','M'],
      ['recipes','Weeknight recipes','everyday-food.example','Cooking','W'],
      ['css','CSS-Tricks','css-tricks.com','Web development','C'],
      ['travel','Lisbon travel notes','slow-travel.example','Travel','L'],
      ['ddia','Data-Intensive Applications notes','reading-list.example/ddia','Reading','D'],
      ['pasta','Pasta shapes guide','kitchen-reference.example/pasta','Cooking','P']
    ];
    const params=new URLSearchParams(location.search);const approach=params.get('approach')==='select'?'select':'direct';const data=params.get('case')==='last'?[fullData[0]]:fullData;const list=document.querySelector('#bookmark-list');let pending=[];
    document.querySelector(approach==='direct'?'#approach-one':'#approach-two').classList.add('active');
    document.querySelector('#intro').textContent=approach==='direct'?'Remove an individual bookmark from its card when it is no longer useful.':'Select one or more bookmarks, then remove them together.';
    document.querySelector('#count').textContent=`${data.length} ${data.length===1?'bookmark':'bookmarks'}`;
    data.forEach(([id,name,url,collection,letter])=>{const card=document.createElement('article');card.className=`bookmark-card ${approach==='select'?'with-selection':''}`;card.dataset.id=id;card.dataset.name=name;card.innerHTML=`${approach==='select'?`<input class="select-control" type="checkbox" aria-label="Select ${name}">`:''}<div class="site-icon">${letter}</div><div><p class="bookmark-title">${name}</p><p class="bookmark-url">${url}</p><span class="collection-chip">${collection}</span></div>${approach==='direct'?`<button class="delete-icon" type="button" aria-label="Delete ${name}"><span class="trash" aria-hidden="true"></span></button>`:''}`;list.appendChild(card)});
    const cards=()=>[...document.querySelectorAll('.bookmark-card')];
    if(approach==='direct')document.querySelectorAll('.delete-icon').forEach(button=>button.addEventListener('click',()=>openDialog([button.closest('.bookmark-card')])));
    else document.querySelectorAll('.select-control').forEach(box=>box.addEventListener('change',updateSelection));
    function updateSelection(){const selected=cards().filter(card=>card.querySelector('.select-control').checked);cards().forEach(card=>card.classList.toggle('selected',card.querySelector('.select-control').checked));document.querySelector('#selection-toolbar').classList.toggle('visible',selected.length>0);document.querySelector('#selected-count').textContent=`${selected.length} selected`}
    document.querySelector('#remove-selected').addEventListener('click',()=>openDialog(cards().filter(card=>card.querySelector('.select-control')?.checked)));
    function openDialog(targets){pending=targets;if(!pending.length)return;const one=pending.length===1;document.querySelector('#dialog-title').textContent=one?'Delete this bookmark?':`Delete ${pending.length} bookmarks?`;document.querySelector('#dialog-copy').textContent=one?`“${pending[0].dataset.name}” will be removed from your collection.`:'These bookmarks will be removed from your collection.';document.querySelector('#confirm-delete').textContent=one?'Delete bookmark':`Delete ${pending.length} bookmarks`;document.querySelector('#confirm-dialog').showModal()}
    document.querySelector('#cancel').addEventListener('click',()=>document.querySelector('#confirm-dialog').close());
    document.querySelector('#confirm-delete').addEventListener('click',()=>{const amount=pending.length;pending.forEach(card=>{card.classList.add('removing');setTimeout(()=>card.remove(),180)});document.querySelector('#confirm-dialog').close();document.querySelector('#selection-toolbar').classList.remove('visible');const left=cards().length-amount;document.querySelector('#count').textContent=`${left} ${left===1?'bookmark':'bookmarks'}`;document.querySelector('#toast-text').textContent=amount===1?'Bookmark deleted':`${amount} bookmarks deleted`;document.querySelector('#toast').classList.add('visible');if(left===0)setTimeout(()=>{list.innerHTML='<div class="empty"><div><div class="empty-icon">↗</div><h3>Your collection is empty</h3><p>Save a useful page whenever you find one.</p><button class="primary" type="button">Add your first bookmark</button></div></div>'},190)});
  </script>
</body>
</html>
