<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — add to read later</title><style>
:root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--accent:#176b4d;--wash:#eaf3ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(920px,calc(100% - 40px));margin:48px auto}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;letter-spacing:-.04em;margin:9px 0 12px}.intro{color:var(--muted);font-size:17px;margin:0 0 25px}.capture{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 35px rgba(30,55,43,.08)}.row{display:flex;gap:10px}.url{flex:1;border:0;outline:none;font:inherit;font-size:16px;padding:11px 12px}.save{border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:720;padding:12px 20px;cursor:pointer}.extras{display:flex;align-items:center;gap:18px;margin-top:10px;padding:13px 12px 5px;border-top:1px solid var(--line)}.tags{display:flex;align-items:center;gap:7px}.tag{border:0;border-radius:999px;background:var(--wash);color:#10533b;padding:7px 10px;font-size:12px;font-weight:700}.later-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650}.later-label input{width:18px;height:18px;accent-color:var(--accent)}.collection{margin-top:38px}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:14px}.card{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px}.title{font-size:18px;font-weight:730;color:var(--ink);text-decoration:none}.description{color:var(--muted);margin:7px 0 9px}.address{font-size:12px;color:var(--accent)}.later-action{border:1px solid #bcd4c7;background:#fff;color:var(--accent);border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.status{background:var(--wash);color:#10533b;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:720;height:max-content}.after-style .later-label{display:none}.before-style .later-action{display:none}.notice{display:none;margin-top:15px;background:var(--wash);color:#25523f;border:1px solid #cfe1d7;padding:12px 14px;border-radius:10px}.notice.show{display:block}@media(max-width:620px){header{padding:0 20px}.row{flex-direction:column}.extras{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Read later <strong id="queue-count">0</strong></div></header><main data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>Save a link</h1><p class="intro">Paste a link, add anything useful, and let Keepmark handle the rest.</p><form class="capture" id="form"><div class="row"><input class="url" value="https://developer.mozilla.org/en-US/docs/Web/JavaScript" aria-label="Web address"><button class="save">Save link</button></div><div class="extras"><div class="tags"><span style="font-size:13px;color:var(--muted)">Tags</span><button type="button" class="tag">javascript</button><button type="button" class="tag">reference</button></div><label class="later-label"><input id="later" type="checkbox"> Add to Read later</label></div></form><div class="notice" id="notice">Saved to your Read later list.</div><section class="collection"><div class="head"><h2>All bookmarks</h2><span class="count" id="count">0 bookmarks</span></div><div id="result"></div></section></main><script>
const after=new URLSearchParams(location.search).get('style')==='after';document.querySelector('main').classList.add(after?'after-style':'before-style');const form=document.querySelector('#form'),result=document.querySelector('#result'),notice=document.querySelector('#notice'),queue=document.querySelector('#queue-count');form.addEventListener('submit',e=>{e.preventDefault();const queued=!after&&document.querySelector('#later').checked;result.innerHTML=`<article class="card"><div><a class="title" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">JavaScript | MDN</a><p class="description">JavaScript is a scripting language that enables you to create dynamically updating content and much more.</p><div class="address">https://developer.mozilla.org/en-US/docs/Web/JavaScript</div></div>${after?'<button class="later-action">＋ Read later</button>':queued?'<span class="status">Read later</span>':''}</article>`;document.querySelector('#count').textContent='1 bookmark';if(queued){queue.textContent='1';notice.classList.add('show')}const action=document.querySelector('.later-action');if(action)action.onclick=()=>{action.outerHTML='<span class="status">Read later</span>';queue.textContent='1';notice.classList.add('show')}});
</script></body></html>
