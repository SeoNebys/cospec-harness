<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Home — Label suggestions</title>
<style>:root{--ink:#17201d;--muted:#66736e;--line:#dce4df;--green:#236b4b;--soft:#edf6f0}*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{width:min(920px,calc(100% - 32px));margin:48px auto}h1{font:700 30px/1.1 Georgia,serif;margin:0}.sub{color:var(--muted);margin:6px 0 24px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 30px #142a200f}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.card h2{font-size:20px;margin:8px 0 7px}.card p{color:#46534e;margin:0 0 12px}.source{font-size:14px;color:var(--muted)}.labels{display:flex;gap:7px;min-height:30px;margin-top:16px;align-items:center}.chip{background:var(--soft);color:var(--green);padding:5px 9px;border-radius:99px;font-size:13px;font-weight:700}.control{position:relative;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:8px}input{width:260px;padding:10px 12px;border:1px solid #bdcac3;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 16px;background:var(--green);color:#fff;font:700 14px system-ui;cursor:pointer}.suggestions{display:none;position:absolute;left:0;top:65px;width:260px;background:#fff;border:1px solid #aebeb5;border-radius:9px;box-shadow:0 8px 20px #17201d21;padding:5px;z-index:2}.suggestions.open{display:block}.suggestion{width:100%;display:flex;justify-content:space-between;background:#fff;color:var(--ink);padding:10px;text-align:left}.suggestion:hover,.suggestion:focus{background:var(--soft)}.used{font-size:12px;color:var(--muted);font-weight:400}.note{margin-top:18px;color:var(--muted);font-size:14px}</style></head>
<body><main data-harness-ready="true"><h1>Link Home</h1><p class="sub">Add a label to this bookmark.</p><article class="card"><div class="eyebrow">To read</div><h2>JavaScript | MDN</h2><p>JavaScript is a programming language used to make web pages interactive.</p><div class="source">developer.mozilla.org</div><div class="labels" aria-live="polite"></div><div class="control"><input id="label" aria-label="New label" placeholder="Add a label…" autocomplete="off"><button id="add">Add label</button><div class="suggestions" role="listbox"><button class="suggestion" role="option"><span>reference</span><span class="used">used before</span></button></div></div></article><p class="note" id="message">Labels already used in the collection include “reference”, “javascript”, and “reading”.</p>
<script>const input=document.querySelector('#label'),menu=document.querySelector('.suggestions'),choice=document.querySelector('.suggestion'),labels=document.querySelector('.labels'),message=document.querySelector('#message'),existing=['reference','javascript','reading'];input.addEventListener('input',()=>menu.classList.toggle('open','reference'.startsWith(input.value.trim().toLowerCase())&&input.value.trim().length>0));choice.onclick=()=>{input.value='reference';menu.classList.remove('open');input.focus()};document.querySelector('#add').onclick=()=>{let value=input.value.trim();if(!value)return;const established=existing.find(x=>x.toLowerCase()===value.toLowerCase());if(established)value=established;labels.innerHTML='<span class="chip">'+value.replace(/[<>]/g,'')+'</span>';message.textContent=established?'Existing label reused with its established spelling.':'New label added.';menu.classList.remove('open');input.value=''};</script></main></body></html>
