<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keep — Formatted notes</title>
<style>:root{--ink:#14251d;--muted:#68736e;--line:#dfe6e2;--brand:#176b4b;--pale:#e5f4ec}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#f2f5f2}button,textarea{font:inherit}.shell{max-width:1040px;min-height:100vh;margin:auto;background:#fbfcfa;border-inline:1px solid #e8ece9}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:760}.mark{width:32px;height:32px;display:grid;place-items:center;color:#fff;background:var(--brand);border-radius:10px 10px 10px 3px}main{max-width:780px;margin:auto;padding:60px 28px}h1{margin:0;font-size:31px;letter-spacing:-.04em}.lead{margin:7px 0 25px;color:var(--muted)}.card{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.thumb{min-height:105px;border-radius:12px;background:linear-gradient(145deg,#d9eadf,#82b49d);display:grid;place-items:center;color:#fff;font-size:35px}.domain{color:var(--muted);font-size:12px}.title{margin:5px 0 4px;font-size:18px;font-weight:750}.desc{margin:0;color:var(--muted);font-size:14px}.note{margin:13px 0 0;padding:10px 12px;border-left:3px solid #82b49d;background:#f2f8f4;border-radius:0 8px 8px 0;font-size:13px}.note p{margin:0 0 6px}.note ul{margin:4px 0;padding-left:20px}.note a{color:var(--brand)}dialog{width:min(600px,calc(100% - 32px));border:0;border-radius:20px;padding:0;color:var(--ink);box-shadow:0 24px 80px rgba(18,40,29,.28)}dialog::backdrop{background:rgba(17,35,26,.42)}.modal{padding:26px}.modal h2{margin:0;font-size:22px}.sub{margin:6px 0 18px;color:var(--muted)}.toolbar{display:flex;gap:5px;padding:7px;border:1px solid #cad6cf;border-bottom:0;border-radius:10px 10px 0 0;background:#f7f9f7}.toolbar button{min-width:35px;padding:6px 9px;border:0;border-radius:6px;background:transparent;cursor:pointer}.toolbar button:hover{background:#e5eee8}.editor{min-height:160px;padding:12px;border:1px solid #cad6cf;border-radius:0 0 10px 10px;outline:0}.editor:focus{border-color:#68a78e;box-shadow:0 0 0 3px #dff2e9}.md-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pane-label{margin:0 0 5px;color:var(--muted);font-size:12px;font-weight:700}.md{width:100%;min-height:180px;padding:11px;border:1px solid #cad6cf;border-radius:10px;resize:vertical;outline:0}.preview{min-height:180px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#f8faf8;font-size:13px}.preview ul{padding-left:20px}.preview a{color:var(--brand)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.actions button,.open{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:680}.secondary{background:#edf1ee}.primary,.open{color:#fff;background:var(--brand)}.open{margin-top:24px}.tip{margin:8px 0 0;color:var(--muted);font-size:12px}@media(max-width:650px){.md-grid,.card{grid-template-columns:1fr}}</style></head>
<body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark">↗</span> Keep</div><span style="color:var(--muted);font-size:13px">1 bookmark</span></header><main><h1>Your bookmarks</h1><p class="lead">Everything you’ve saved, ready when you need it.</p><article class="card"><div class="thumb">✦</div><div><div class="domain">▣ fortelabs.com</div><div class="title">My PARA reference</div><p class="desc">A simple system for organizing digital information.</p><div class="note" id="cardNote"><p><strong>My note:</strong></p><div id="noteResult">Use this when I reorganize my research folder.</div></div></div></article><button class="open" id="open">Edit note</button></main></div>
<dialog id="dialog"><div class="modal"><h2>Format your note</h2><p class="sub">Capture the details you want to remember.</p><div id="formatArea"></div><div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save note</button></div></div></dialog>
<script>
const version=new URLSearchParams(location.search).get('v')||'a',area=document.querySelector('#formatArea'),dialog=document.querySelector('#dialog');
if(version==='a')area.innerHTML=`<div class="toolbar"><button data-cmd="bold" aria-label="Bold"><b>B</b></button><button data-cmd="italic" aria-label="Italic"><i>I</i></button><button data-cmd="insertUnorderedList" aria-label="Bulleted list">☷</button><button data-cmd="createLink" aria-label="Add link">🔗</button></div><div class="editor" id="editor" contenteditable="true">Use this when I reorganize my research folder.</div><p class="tip">Select some text, then use the formatting buttons.</p>`;
if(version==='b')area.innerHTML=`<div class="md-grid"><div><p class="pane-label">Write</p><textarea class="md" id="markdown">Use this when I reorganize my research folder.\n\n- Review active projects\n- **Archive** old material\n- [PARA guide](https://fortelabs.com)</textarea></div><div><p class="pane-label">Preview</p><div class="preview" id="live"></div></div></div><p class="tip">Use *, ** and - as you write; the result appears beside it.</p>`;
const render=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\[(.*?)\]\((.*?)\)/g,'<a href="$2">$1</a>').replace(/(?:^|\n)- (.*)/g,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>').replace(/\n\n/g,'<br><br>').replace(/\n/g,' ');
if(version==='a')area.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{const cmd=b.dataset.cmd;if(cmd==='createLink'){const url=prompt('Web address','https://');if(url)document.execCommand(cmd,false,url)}else document.execCommand(cmd)});
if(version==='b'){const md=document.querySelector('#markdown'),live=document.querySelector('#live'),refresh=()=>live.innerHTML=render(md.value);md.oninput=refresh;refresh()}
document.querySelector('#open').onclick=()=>dialog.showModal();document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#save').onclick=()=>{document.querySelector('#noteResult').innerHTML=version==='a'?document.querySelector('#editor').innerHTML:render(document.querySelector('#markdown').value);dialog.close()};
</script></body></html>
