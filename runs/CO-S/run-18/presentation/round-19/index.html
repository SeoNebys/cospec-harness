<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepmark — save a link</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #66716c;
      --line: #dfe5e1;
      --paper: #fbfcfa;
      --white: #ffffff;
      --accent: #176b4d;
      --accent-dark: #10533b;
      --wash: #eaf3ee;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    header {
      height: 72px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 760; letter-spacing: -.02em; }
    .brand-mark { width: 31px; height: 36px; background: var(--accent); border-radius: 6px 6px 10px 10px; position: relative; }
    .brand-mark::after { content: ""; position: absolute; bottom: -1px; left: 7px; border: 8px solid transparent; border-bottom-color: var(--white); }
    .scope { font-size: 13px; color: var(--muted); background: #f2f5f3; padding: 6px 10px; border-radius: 999px; }
    main { width: min(920px, calc(100% - 40px)); margin: 64px auto; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    h1 { font-size: clamp(36px, 5vw, 54px); letter-spacing: -.045em; line-height: 1.04; margin: 12px 0 14px; max-width: 650px; }
    .intro { color: var(--muted); font-size: 18px; line-height: 1.55; max-width: 620px; margin: 0 0 30px; }
    .capture { display: flex; gap: 10px; padding: 10px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 35px rgba(30,55,43,.08); }
    input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: var(--ink); padding: 11px 12px; background: transparent; }
    input::placeholder { color: #949d98; }
    button { border: 0; border-radius: 9px; background: var(--accent); color: white; font: inherit; font-weight: 720; padding: 12px 20px; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .65; cursor: wait; }
    .hint { margin: 11px 4px 0; font-size: 13px; color: var(--muted); }
    .collection { margin-top: 54px; }
    .collection-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 13px; }
    h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .count { color: var(--muted); font-size: 14px; }
    .empty { text-align: center; color: var(--muted); padding: 68px 20px; }
    .empty-icon { font-size: 30px; margin-bottom: 12px; opacity: .55; }
    .card { margin-top: 18px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; grid-template-columns: 1fr auto; gap: 18px; box-shadow: 0 8px 24px rgba(30,55,43,.06); animation: arrive .28s ease-out; }
    @keyframes arrive { from { transform: translateY(8px); opacity: 0; } }
    .card a { color: var(--ink); font-size: 19px; font-weight: 730; text-decoration: none; }
    .card a:hover { color: var(--accent); text-decoration: underline; }
    .description { margin: 8px 0 11px; color: var(--muted); line-height: 1.5; }
    .url { color: var(--accent); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 650px; }
    .saved { align-self: start; background: var(--wash); color: var(--accent-dark); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 720; }
    @media (max-width: 620px) { header { padding: 0 20px; } main { margin-top: 40px; } .capture { flex-direction: column; } button { width: 100%; } .card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Keepmark</div>
    <div class="scope">Personal library</div>
  </header>
  <main data-harness-ready="true">
    <section>
      <div class="eyebrow">Your bookmark library</div>
      <h1>Save the good parts of the web.</h1>
      <p class="intro">Paste a link. Keepmark fills in the useful details so it’s ready to find when you need it.</p>
      <form class="capture" id="save-form">
        <input id="url" type="url" required autocomplete="off" aria-label="Web address" placeholder="Paste a web address…">
        <button id="save-button" type="submit">Save link</button>
      </form>
      <p class="hint">Try: https://developer.mozilla.org/en-US/docs/Web/JavaScript</p>
    </section>
    <section class="collection" aria-live="polite">
      <div class="collection-head"><h2>All bookmarks</h2><span class="count" id="count">0 links</span></div>
      <div class="empty" id="empty"><div class="empty-icon">◇</div>Your saved links will appear here.</div>
      <div id="results"></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#save-form');
    const input = document.querySelector('#url');
    const button = document.querySelector('#save-button');
    const empty = document.querySelector('#empty');
    const results = document.querySelector('#results');
    const count = document.querySelector('#count');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Getting details…';
      window.setTimeout(() => {
        const raw = input.value.trim();
        const isMdn = raw.includes('developer.mozilla.org');
        const title = isMdn ? 'JavaScript | MDN' : new URL(raw).hostname.replace(/^www\./, '');
        const description = isMdn
          ? 'JavaScript is a scripting language that enables you to create dynamically updating content and much more.'
          : 'Page details were collected automatically from the web address.';
        results.innerHTML = `<article class="card"><div><a href="${raw}" target="_blank" rel="noopener">${title}</a><p class="description">${description}</p><div class="url">${raw}</div></div><span class="saved">Saved</span></article>`;
        empty.hidden = true;
        count.textContent = '1 link';
        input.value = '';
        button.disabled = false;
        button.textContent = 'Save link';
      }, 650);
    });
  </script>
</body>
</html>
