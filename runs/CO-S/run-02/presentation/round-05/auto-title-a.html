<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — Version A (title grabbed on save)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 720px; margin: 0 auto; padding: 32px 20px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .variant { font-size: 12px; color: #2563eb; margin: 0 0 24px; font-weight: 600; }
  .save-box { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 16px; margin-bottom: 28px; }
  .save-box label { display: block; font-size: 12px; color: #666; margin: 0 0 4px; }
  .save-box input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d5d5d5; border-radius: 7px; margin-bottom: 12px; }
  .save-box button { background: #2563eb; color: #fff; border: 0; border-radius: 7px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .save-box button:hover { background: #1d4ed8; }
  .count { font-size: 12px; color: #888; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  li .title { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  li .title.fetching { color: #aaa; font-weight: 400; font-style: italic; }
  li a { color: #2563eb; text-decoration: none; font-size: 13px; word-break: break-all; }
  li a:hover { text-decoration: underline; }
  .empty { color: #999; font-size: 14px; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
  <h1>📑 My Bookmarks</h1>
  <p class="variant">Version A — the page title is grabbed automatically when you save</p>

  <div class="save-box">
    <label for="url">Link</label>
    <input id="url" type="text" placeholder="Paste a link here…" />
    <label for="title">Name (optional)</label>
    <input id="title" type="text" placeholder="Leave blank and I'll grab the page's title for you" />
    <button id="save">Save</button>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>

  <script>
    const KEY = 'bm_proto_a';
    const load = () => JSON.parse(localStorage.getItem(KEY) || '[]');
    const store = (arr) => localStorage.setItem(KEY, JSON.stringify(arr));

    // Stand-in for a real page-title lookup.
    function fakeFetchTitle(url) {
      const known = {
        'en.wikipedia.org': 'Bookmark - Wikipedia',
        'nytimes.com': 'The New York Times - Breaking News',
        'github.com': 'GitHub: Let’s build from here',
        'youtube.com': 'YouTube',
      };
      let host = url;
      try { host = new URL(url.match(/^https?:\/\//) ? url : 'https://' + url).hostname.replace(/^www\./, ''); } catch (e) {}
      if (known[host]) return known[host];
      const words = host.split('.')[0].replace(/[-_]/g, ' ');
      return words.charAt(0).toUpperCase() + words.slice(1) + ' — page';
    }

    function render() {
      const items = load();
      const list = document.getElementById('list');
      const count = document.getElementById('count');
      list.innerHTML = '';
      if (items.length === 0) { count.textContent = ''; list.innerHTML = '<div class="empty">Nothing saved yet. Add your first link above.</div>'; return; }
      count.textContent = items.length + (items.length === 1 ? ' bookmark' : ' bookmarks');
      items.slice().reverse().forEach(it => {
        const li = document.createElement('li');
        const t = document.createElement('div');
        if (it.title) { t.className = 'title'; t.textContent = it.title; }
        else { t.className = 'title fetching'; t.textContent = 'Looking up title…'; }
        const a = document.createElement('a');
        a.href = it.url; a.target = '_blank'; a.textContent = it.url;
        li.appendChild(t); li.appendChild(a);
        list.appendChild(li);
      });
    }

    document.getElementById('save').addEventListener('click', () => {
      const url = document.getElementById('url').value.trim();
      const title = document.getElementById('title').value.trim();
      if (!url) return;
      const items = load();
      const id = Date.now();
      items.push({ id, url, title, savedAt: id }); // title may be empty -> will be filled
      store(items);
      document.getElementById('url').value = '';
      document.getElementById('title').value = '';
      render();
      if (!title) {
        // simulate async lookup
        setTimeout(() => {
          const arr = load();
          const found = arr.find(x => x.id === id);
          if (found && !found.title) { found.title = fakeFetchTitle(url); store(arr); render(); }
        }, 700);
      }
    });

    render();
  </script>
</body>
</html>
