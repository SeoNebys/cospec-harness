<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Link Library — prototype</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8a83;
    --line: #e7e5df;
    --accent: #5b6cff;
    --accent-soft: #eef0ff;
    --danger: #c0392b;
    --danger-soft: #fdecea;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 96px; }
  header h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.01em; }
  header p { margin: 0 0 28px; color: var(--muted); font-size: 14px; }

  .saver {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 10px;
    align-items: center;
    transition: border-color .15s;
  }
  .saver.invalid { border-color: var(--danger); }
  .saver input {
    flex: 1; border: none; outline: none; font-size: 15px;
    background: transparent; color: var(--ink); padding: 8px 6px;
  }
  .saver input::placeholder { color: #b6b4ac; }
  .saver button {
    border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 10px; cursor: pointer; transition: opacity .15s; white-space: nowrap;
  }
  .saver button:disabled { opacity: .45; cursor: default; }

  .status { min-height: 20px; margin: 12px 2px 0; font-size: 13px; color: var(--muted); }
  .status.error { color: var(--danger); }
  .status.info { color: var(--accent); }

  /* Review / edit panel */
  .draft {
    margin-top: 16px; background: var(--card); border: 1px solid var(--accent);
    border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
    animation: rise .22s ease;
  }
  .draft .banner { background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 8px 18px; letter-spacing: .02em; }
  .draft .body { padding: 18px; }
  .preview { height: 150px; border-radius: 12px; margin-bottom: 16px; display: flex; align-items: flex-end;
    padding: 10px 12px; color: #fff; font-size: 11px; }
  .preview .tag { background: rgba(0,0,0,.28); padding: 3px 8px; border-radius: 20px; backdrop-filter: blur(2px); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .02em; }
  .field input, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: #fcfcfb; outline: none; resize: vertical;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .srcline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .draft .actions { display: flex; gap: 10px; }
  .btn-primary { border: none; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
    padding: 10px 18px; border-radius: 10px; cursor: pointer; }
  .btn-ghost { border: 1px solid var(--line); background: #fff; color: #5f5e57; font-weight: 500; font-size: 14px;
    padding: 10px 16px; border-radius: 10px; cursor: pointer; }

  .favicon { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center;
    justify-content: center; color: #fff; font-size: 10px; font-weight: 700; flex: none; }

  .count { margin: 34px 2px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .empty { margin-top: 40px; text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; }
  .empty .big { font-size: 15px; color: #6f6d66; margin-bottom: 6px; }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  li.item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0;
    box-shadow: var(--shadow); animation: rise .25s ease; overflow: hidden; }
  li.item.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .item .thumb { height: 120px; }
  .item .content { padding: 15px 18px; }
  .item .title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .item .title a { color: var(--ink); text-decoration: none; }
  .item .title a:hover { text-decoration: underline; }
  .item .desc { font-size: 14px; color: #5f5e57; margin: 0 0 10px; }
  .item .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .item .meta .dot { opacity: .5; }
  .item .editlink { margin-left: auto; color: var(--accent); font-size: 12px; font-weight: 600;
    background: none; border: none; cursor: pointer; padding: 2px 4px; }
  .shimmer { height: 12px; border-radius: 6px; background: linear-gradient(90deg,#eee,#f5f5f5,#eee);
    background-size: 200% 100%; animation: sh 1.1s infinite; }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>My Link Library</h1>
      <p>A calm place for links worth keeping.</p>
    </header>

    <form class="saver" id="saver" autocomplete="off">
      <input id="url" type="text" placeholder="Paste a link and press Save…" aria-label="Link address" />
      <button id="saveBtn" type="submit">Save</button>
    </form>
    <div class="status" id="status"></div>

    <div id="draftMount"></div>

    <div class="count" id="count" hidden></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty">
      <div class="big">Your library is empty.</div>
      <div>Paste a link above to save your first one.</div>
    </div>
  </div>

<script>
  const TODAY = "Sep 24, 2026";
  // ---- Simulated page lookup (a prototype stands in for real page fetching) ----
  const KNOWN = {
    "nytimes.com":     { site: "The New York Times", title: "How Deep-Sea Cables Quietly Run the Internet", desc: "A look at the fragile undersea network carrying nearly all of the world's data traffic.", image: true },
    "wikipedia.org":   { site: "Wikipedia", title: "Zettelkasten — the note-taking method", desc: "A system of interconnected notes used by researchers and writers to develop ideas over time.", image: false },
    "github.com":      { site: "GitHub", title: "sqlite/sqlite: the most-deployed database engine", desc: "Source mirror of SQLite, a small, fast, self-contained SQL database engine.", image: false },
    "css-tricks.com":  { site: "CSS-Tricks", title: "A Complete Guide to Flexbox", desc: "Everything you need to lay out elements along a row or column, with clear diagrams.", image: true },
    "arstechnica.com": { site: "Ars Technica", title: "The Quiet Revival of the RSS Reader", desc: "Why a decades-old technology is finding new life among readers tired of algorithms.", image: true }
  };
  function colorFor(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
  function grad(domain){ const h=colorFor(domain); return `linear-gradient(135deg, hsl(${h} 60% 55%), hsl(${(h+40)%360} 55% 42%))`; }

  function normalize(raw){
    raw = raw.trim();
    if(!raw || /\s/.test(raw)) return { ok:false };
    const withScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : "https://" + raw;
    let u;
    try { u = new URL(withScheme); } catch(e){ return { ok:false }; }
    if(!/^https?:$/.test(u.protocol)) return { ok:false };
    if(!u.hostname.includes(".")) return { ok:false };
    if(u.hostname.split(".").some(p => p.length === 0)) return { ok:false };
    return { ok:true, url:u.href, domain:u.hostname.replace(/^www\./,"") };
  }
  function lookup(domain){
    if(KNOWN[domain]) return { ...KNOWN[domain] };
    const name = domain.split(".")[0];
    return { site: domain, title: name.charAt(0).toUpperCase()+name.slice(1)+" — saved page", desc:"", image:false };
  }

  // ---- State ----
  let items = [];               // saved links (newest first)
  let draft = null;             // link under review before confirming
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const urlEl = document.getElementById("url");
  const saverEl = document.getElementById("saver");
  const draftMount = document.getElementById("draftMount");

  function setStatus(msg, kind){ statusEl.textContent = msg || ""; statusEl.className = "status" + (kind ? " "+kind : ""); }

  function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function favEl(it){ return `<span class="favicon" style="background:${grad(it.domain)}">${esc((it.site||"?").charAt(0).toUpperCase())}</span>`; }

  // ---------- Save flow ----------
  saverEl.addEventListener("submit", function(e){
    e.preventDefault();
    const raw = urlEl.value;
    const n = normalize(raw);
    if(!n.ok){
      saverEl.classList.add("invalid");
      setStatus("That doesn't look like a usable web address. Try something like nytimes.com or https://example.com/article.", "error");
      return;
    }
    saverEl.classList.remove("invalid");

    // Duplicate check — same page already saved.
    const existing = items.find(it => it.url === n.url);
    if(existing){
      setStatus("This link is already in your library — opening it so you can edit it.", "info");
      urlEl.value = "";
      draft = null; renderDraft();
      startEdit(existing.id, true);
      return;
    }

    // Simulate the brief background lookup, then open the review panel.
    setStatus("Looking up the page details…");
    urlEl.value = "";
    draft = { url:n.url, domain:n.domain, loading:true };
    renderDraft();
    setTimeout(() => {
      const meta = lookup(n.domain);
      draft = { url:n.url, domain:n.domain, loading:false, title:meta.title, desc:meta.desc, site:meta.site, image:meta.image, savedAt:TODAY };
      setStatus("");
      renderDraft();
      const t = document.getElementById("draftTitle"); if(t) t.focus();
    }, 800);
  });

  function renderDraft(){
    draftMount.innerHTML = "";
    if(!draft) return;
    const d = document.createElement("div");
    d.className = "draft";
    if(draft.loading){
      d.innerHTML = `<div class="banner">Reviewing before saving</div>
        <div class="body">
          <div class="shimmer" style="height:150px;border-radius:12px;margin-bottom:16px"></div>
          <div class="shimmer" style="width:60%;margin-bottom:10px"></div>
          <div class="shimmer" style="width:85%"></div>
        </div>`;
    } else {
      d.innerHTML = `
        <div class="banner">Review &amp; adjust before saving</div>
        <div class="body">
          ${draft.image ? `<div class="preview" style="background:${grad(draft.domain)}"><span class="tag">Preview image from the page</span></div>` : ``}
          <div class="field">
            <label for="draftTitle">Title</label>
            <input id="draftTitle" type="text" value="${esc(draft.title)}" />
          </div>
          <div class="field">
            <label for="draftDesc">Description</label>
            <textarea id="draftDesc" rows="2">${esc(draft.desc)}</textarea>
          </div>
          <div class="srcline">${favEl(draft)}<span>${esc(draft.site)}</span><span class="dot">·</span><span>${esc(draft.domain)}</span><span class="dot">·</span><span>Saved ${draft.savedAt}</span></div>
          <div class="actions">
            <button class="btn-primary" id="draftSave">Save to library</button>
            <button class="btn-ghost" id="draftCancel">Cancel</button>
          </div>
        </div>`;
    }
    draftMount.appendChild(d);
    const s = document.getElementById("draftSave"), c = document.getElementById("draftCancel");
    if(s) s.onclick = confirmDraft;
    if(c) c.onclick = () => { draft = null; renderDraft(); setStatus(""); };
  }

  function confirmDraft(){
    const title = document.getElementById("draftTitle").value.trim() || draft.domain;
    const desc = document.getElementById("draftDesc").value.trim();
    const item = { id: Date.now()+"-"+Math.random().toString(36).slice(2,6),
      url:draft.url, domain:draft.domain, site:draft.site, title, desc, image:draft.image, savedAt:draft.savedAt };
    items.unshift(item);
    draft = null; renderDraft();
    setStatus("Saved to your library.", "info");
    render(item.id);
    setTimeout(() => { if(statusEl.textContent === "Saved to your library.") setStatus(""); }, 2600);
  }

  // ---------- Edit later ----------
  function startEdit(id, flash){
    const it = items.find(x => x.id === id); if(!it) return;
    it.editing = true;
    render(flash ? id : null);
    const t = document.getElementById("edit-title-"+id); if(t){ t.focus(); t.scrollIntoView({behavior:"smooth", block:"center"}); }
  }

  function render(flashId){
    emptyEl.hidden = items.length > 0;
    countEl.hidden = items.length === 0;
    countEl.textContent = items.length + (items.length === 1 ? " link" : " links");
    listEl.innerHTML = "";
    items.forEach(it => {
      const li = document.createElement("li");
      li.className = "item" + (it.id === flashId ? " flash" : "");
      if(it.editing){
        li.innerHTML = `
          <div class="content">
            <div class="field"><label>Title</label><input id="edit-title-${it.id}" type="text" value="${esc(it.title)}" /></div>
            <div class="field"><label>Description</label><textarea id="edit-desc-${it.id}" rows="2">${esc(it.desc)}</textarea></div>
            <div class="srcline">${favEl(it)}<span>${esc(it.site)}</span><span class="dot">·</span><span>${esc(it.domain)}</span><span class="dot">·</span><span>Saved ${it.savedAt}</span></div>
            <div class="actions">
              <button class="btn-primary" data-save="${it.id}">Save changes</button>
              <button class="btn-ghost" data-cancel="${it.id}">Cancel</button>
            </div>
          </div>`;
      } else {
        li.innerHTML = `
          ${it.image ? `<div class="thumb" style="background:${grad(it.domain)}"></div>` : ``}
          <div class="content">
            <div class="title"><a href="${it.url}" target="_blank" rel="noopener">${esc(it.title)}</a></div>
            ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ``}
            <div class="meta">${favEl(it)}<span>${esc(it.site)}</span><span class="dot">·</span><span>Saved ${it.savedAt}</span>
              <button class="editlink" data-edit="${it.id}">Edit</button>
            </div>
          </div>`;
      }
      listEl.appendChild(li);
    });
    listEl.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => startEdit(b.dataset.edit));
    listEl.querySelectorAll("[data-save]").forEach(b => b.onclick = () => {
      const it = items.find(x => x.id === b.dataset.save);
      it.title = (document.getElementById("edit-title-"+it.id).value.trim() || it.domain);
      it.desc = document.getElementById("edit-desc-"+it.id).value.trim();
      it.editing = false; render();
    });
    listEl.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => {
      const it = items.find(x => x.id === b.dataset.cancel); it.editing = false; render();
    });
  }

  // Clear the invalid state as the client edits the address.
  urlEl.addEventListener("input", () => { if(saverEl.classList.contains("invalid")){ saverEl.classList.remove("invalid"); setStatus(""); } });

  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
