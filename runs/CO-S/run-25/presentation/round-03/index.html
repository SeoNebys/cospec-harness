<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Library — Prototype</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --ink: #1c2230; --muted: #6b7385;
    --line: #e4e7ee; --accent: #2f6df6; --accent-soft: #eaf1ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 18px 28px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .tag { font-size: 12px; color: var(--muted); background: var(--bg);
    padding: 3px 9px; border-radius: 20px; border: 1px solid var(--line); }
  main { max-width: 760px; margin: 0 auto; padding: 28px; }

  .saver {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 26px; box-shadow: 0 1px 2px rgba(20,30,60,.04);
  }
  .saver label { font-size: 13px; font-weight: 600; color: var(--muted);
    display: block; margin-bottom: 8px; }
  .saver .row { display: flex; gap: 10px; }
  .saver input {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 15px; outline: none;
  }
  .saver input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .saver button {
    padding: 12px 20px; border: none; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer;
  }
  .saver button:hover { background: #2258d6; }

  .count { font-size: 13px; color: var(--muted); margin: 0 0 12px 2px; }

  ul.library { list-style: none; padding: 0; margin: 0; display: flex;
    flex-direction: column; gap: 12px; }
  li.item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start;
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .favicon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    color: var(--accent); flex-shrink: 0; font-weight: 700; }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-weight: 600; font-size: 15px; margin: 0 0 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .url { font-size: 13px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .item .saved { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px;
    border: 1px dashed var(--line); border-radius: 14px; background: var(--card); }
  .empty .big { font-size: 30px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>Link Library</h1>
  <span class="tag">Prototype</span>
</header>
<main>
  <div class="saver">
    <label for="url">Save a link</label>
    <div class="row">
      <input id="url" type="text" placeholder="Paste a web address, e.g. https://example.com/article" autocomplete="off">
      <button id="saveBtn">Save</button>
    </div>
  </div>

  <p class="count" id="count"></p>
  <ul class="library" id="library"></ul>
</main>

<script>
  // Prototype only — simulates external behaviour for requirement exploration.
  const items = [];

  function hostOf(url) {
    try {
      let u = url.trim();
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      return new URL(u).hostname.replace(/^www\./, "");
    } catch (e) { return url.trim(); }
  }
  function titleGuess(url) {
    const host = hostOf(url);
    const path = url.replace(/^https?:\/\//i, "").split("/").slice(1).join("/");
    if (path) {
      const slug = path.split(/[?#]/)[0].split("/").filter(Boolean).pop() || "";
      const words = slug.replace(/[-_]+/g, " ").replace(/\.[a-z]+$/i, "").trim();
      if (words) return words.replace(/\b\w/g, c => c.toUpperCase()) + " — " + host;
    }
    return host;
  }
  function timeNow() {
    return new Date().toLocaleString(undefined, { month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit" });
  }

  function render() {
    const lib = document.getElementById("library");
    const count = document.getElementById("count");
    if (items.length === 0) {
      count.textContent = "";
      lib.innerHTML = '<div class="empty"><div class="big">🔖</div>' +
        "Your library is empty. Save your first link above to get started.</div>";
      return;
    }
    count.textContent = items.length + (items.length === 1 ? " saved link" : " saved links");
    lib.innerHTML = "";
    items.forEach(it => {
      const li = document.createElement("li");
      li.className = "item";
      li.innerHTML =
        '<div class="favicon">' + it.host.charAt(0).toUpperCase() + "</div>" +
        '<div class="body">' +
          '<p class="title">' + it.title + "</p>" +
          '<div class="url">' + it.url + "</div>" +
          '<div class="saved">Saved ' + it.saved + "</div>" +
        "</div>";
      lib.appendChild(li);
    });
  }

  function save() {
    const input = document.getElementById("url");
    const raw = input.value.trim();
    if (!raw) return;
    items.unshift({
      url: raw, host: hostOf(raw), title: titleGuess(raw), saved: timeNow()
    });
    input.value = "";
    input.focus();
    render();
  }

  document.getElementById("saveBtn").addEventListener("click", save);
  document.getElementById("url").addEventListener("keydown", e => {
    if (e.key === "Enter") save();
  });

  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
</content>
