<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 9 (read-later)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; --green:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:20px 20px 60px; }

  /* lens switch */
  .lens { display:inline-flex; background:#eceef1; border-radius:10px; padding:4px; margin-bottom:18px; }
  .lens button { border:0; background:none; padding:8px 16px; border-radius:8px; font-size:14px; cursor:pointer; color:#4b5563; display:flex; align-items:center; gap:7px; }
  .lens button.on { background:#fff; color:#111827; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .lens .badge { background:var(--accent); color:#fff; font-size:11px; border-radius:20px; padding:1px 8px; font-weight:600; }
  .lens button.on .badge { }

  .searchwrap { position:relative; margin-bottom:8px; }
  .searchwrap input { width:100%; padding:12px 40px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; }
  .searchwrap .ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .barlabel { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 2px 8px; }
  .topicsbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .topicsbar .t { background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .topicsbar .t .c { color:var(--muted); font-size:11px; margin-left:5px; }
  .topicsbar .t.on { background:var(--accent); color:#fff; border-color:var(--accent); } .topicsbar .t.on .c{ color:#dbe3ff; }

  .lenshint { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; font-size:13px; border-radius:8px; padding:10px 13px; margin-bottom:14px; display:none; }
  .lenshint.show { display:block; }
  .count { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:0 2px 10px; }

  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px 14px 16px; margin-bottom:10px; cursor:pointer; position:relative; transition:opacity .35s, transform .35s; }
  li.card.leaving { opacity:0; transform:translateX(30px); }
  li.card.unread { border-left:3px solid var(--accent); }
  .title { font-size:15px; font-weight:600; margin:0; padding-right:130px; } .title .ext { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#eef2ff; color:#3730a3; font-size:11px; border-radius:20px; padding:3px 10px; }

  /* status controls (top-right of card) */
  .status { position:absolute; top:12px; right:12px; display:flex; gap:6px; align-items:center; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:7px; font-size:12px; padding:5px 10px; cursor:pointer; color:#374151; }
  .btn.flag.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.done { border-color:#a7f3d0; color:var(--green); background:#ecfdf5; font-weight:600; }
  .read-badge { font-size:11px; color:var(--green); background:#ecfdf5; border:1px solid #a7f3d0; border-radius:6px; padding:3px 8px; }
  .empty { color:var(--muted); text-align:center; padding:44px 14px; font-size:14px; }
  .cheer { color:var(--green); font-weight:600; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <div class="lens" id="lens">
    <button data-v="all" class="on">📚 Everything</button>
    <button data-v="toread">📖 To read <span class="badge" id="trbadge">0</span></button>
  </div>

  <div class="searchwrap"><span class="ico">🔍</span><input id="q" placeholder="Search…" autocomplete="off"></div>
  <div class="barlabel">Topics</div>
  <div class="topicsbar" id="bar"></div>

  <div class="lenshint" id="lenshint"></div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</main>

<script>
let view='all', q='', selected=[];
// status: 'none' (just in the library) | 'unread' (to read) | 'read' (dealt with)
let items=[
  { url:"https://wikipedia.org/wiki/Sourdough", title:"Sourdough — Wikipedia", desc:"Bread by fermentation of dough.", tags:["recipes","baking"], status:'none' },
  { url:"https://seriouseats.com/pizza-dough", title:"The Best Pizza Dough", desc:"A cold-ferment dough for blistered crust.", tags:["recipes","baking"], status:'none' },
  { url:"https://nytimes.com/2026/travel/kyoto", title:"36 Hours in Kyoto", desc:"Temples at dawn and quiet streets.", tags:["travel"], status:'unread' },
  { url:"https://atlasobscura.com/lisbon", title:"Hidden Lisbon", desc:"Miradouros, trams, and pastel de nata.", tags:["travel"], status:'unread' },
  { url:"https://stripe.com/blog/payment-api", title:"Designing the Stripe Payments API", desc:"Idempotency and versioning at scale.", tags:["work","dev"], status:'unread' },
  { url:"https://linear.app/method", title:"The Linear Method", desc:"How a focused team ships software.", tags:["work"], status:'read' },
  { url:"https://reactjs.org/hooks", title:"Thinking in Hooks", desc:"State and effects without classes.", tags:["dev"], status:'none' },
];
function tagCounts(){ const m={}; items.forEach(i=>i.tags.forEach(t=>m[t]=(m[t]||0)+1)); return m; }
function unreadCount(){ return items.filter(i=>i.status==='unread').length; }

const lens=document.getElementById('lens'), qEl=document.getElementById('q'), bar=document.getElementById('bar'),
      count=document.getElementById('count'), list=document.getElementById('list'),
      lenshint=document.getElementById('lenshint'), trbadge=document.getElementById('trbadge');
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } }
function full(u){ return /^https?:\/\//.test(u)?u:"https://"+u; }

function statusControls(it,i){
  if(view==='toread'){
    return `<div class="status"><button class="btn done" data-done="${i}">✓ Mark as read</button></div>`;
  }
  if(it.status==='unread') return `<div class="status"><button class="btn flag on" data-flag="${i}">📖 To read</button></div>`;
  if(it.status==='read')   return `<div class="status"><span class="read-badge">✓ Read</span><button class="btn" data-reopen="${i}">Read again?</button></div>`;
  return `<div class="status"><button class="btn flag" data-flag="${i}">＋ Read later</button></div>`;
}
function renderBar(){
  const c=tagCounts();
  bar.innerHTML=Object.keys(c).sort().map(t=>`<span class="t ${selected.includes(t)?'on':''}" data-topic="${t}">${t}<span class="c">${c[t]}</span></span>`).join('');
  bar.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>{ const t=el.dataset.topic; selected.includes(t)?selected=selected.filter(x=>x!==t):selected.push(t); render(); }));
}
function passSearch(it){ if(!q) return true; const T=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hay=(it.title+' '+it.desc+' '+it.url).toLowerCase(); return T.every(t=>hay.includes(t)); }
function render(){
  trbadge.textContent=unreadCount();
  let shown=items.filter(it=> selected.every(t=>it.tags.includes(t)) && passSearch(it));
  if(view==='toread') shown=shown.filter(it=>it.status==='unread');
  lenshint.className='lenshint'+(view==='toread'?' show':'');
  if(view==='toread') lenshint.innerHTML='Your read-later pile — just the links you still mean to get to. Check one off and it drops out of the pile.';
  count.textContent = view==='toread' ? `${shown.length} still to read` : `${shown.length} links`;
  if(!shown.length){
    list.innerHTML = view==='toread'
      ? `<div class="empty"><div class="cheer">All caught up 🎉</div>Nothing left in your read-later pile.</div>`
      : `<div class="empty">No links match.</div>`;
    return;
  }
  list.innerHTML=shown.map(it=>{ const i=items.indexOf(it);
    return `<li class="card ${it.status==='unread'?'unread':''}" data-i="${i}">
      ${statusControls(it,i)}
      <p class="title">${it.title}<span class="ext">↗ open</span></p>
      <p class="desc">${it.desc}</p>
      <div class="url"><span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${host(it.url)}</div>
      <div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </li>`; }).join('');
  wire();
}
function wire(){
  list.querySelectorAll('.card').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-flag],[data-done],[data-reopen]')) return;
    window.open(full(items[+el.dataset.i].url),'_blank');
  }));
  list.querySelectorAll('[data-flag]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation();
    const it=items[+b.dataset.flag]; it.status = it.status==='unread' ? 'none' : 'unread'; render(); }));
  list.querySelectorAll('[data-reopen]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation();
    items[+b.dataset.reopen].status='unread'; render(); }));
  list.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation();
    const i=+b.dataset.done; const card=b.closest('.card'); card.classList.add('leaving');
    setTimeout(()=>{ items[i].status='read'; render(); }, 340); }));
}
lens.addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(!b) return;
  view=b.dataset.v; lens.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
qEl.addEventListener('input',()=>{ q=qEl.value.trim(); render(); });
renderBar(); render();
</script>
</body>
</html>
