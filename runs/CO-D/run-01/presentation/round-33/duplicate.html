<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keep — Duplicate link</title><style>:root{--ink:#14251d;--muted:#68736e;--line:#dfe6e2;--brand:#176b4b;--pale:#e5f4ec}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui;color:var(--ink);background:#f2f5f2}button,input{font:inherit}.shell{max-width:1000px;min-height:100vh;margin:auto;background:#fbfcfa}.head{height:74px;padding:20px 38px;border-bottom:1px solid var(--line);font-size:19px;font-weight:760}.mark{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;color:#fff;background:var(--brand);border-radius:10px 10px 10px 3px}main{max-width:760px;margin:auto;padding:55px 28px}h1{margin:0;font-size:30px}.lead{margin:6px 0 24px;color:var(--muted)}.capture{display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff}.capture input{flex:1;min-width:0;padding:10px;border:0;outline:0}.capture button{padding:10px 16px;border:0;border-radius:9px;color:#fff;background:var(--brand);font-weight:700;cursor:pointer}.notice{display:none;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 14px;border:1px solid #a8cdbd;border-radius:11px;color:#215840;background:#eef8f2}.notice.show{display:flex}.notice button{border:0;color:var(--brand);background:transparent;font-weight:720;cursor:pointer}.section{margin-top:40px}.section h2{font-size:18px}.card{display:grid;grid-template-columns:100px 1fr;gap:17px;padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.3s}.card.found{border-color:#4f9878;box-shadow:0 0 0 4px #dff2e9}.thumb{min-height:96px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#d9eadf,#82b49d);font-size:31px}.domain{color:var(--muted);font-size:11px}.title{margin:4px 0;font-size:17px;font-weight:750}.desc{margin:0;color:var(--muted);font-size:13px}.chips{margin-top:9px}.chip{padding:3px 8px;border-radius:99px;color:var(--brand);background:var(--pale);font-size:11px}</style></head><body><div class="shell" data-harness-ready="true"><div class="head"><span class="mark">↗</span>Keep</div><main><h1>Add a bookmark</h1><p class="lead">Paste a web address and Keep will fill in the useful details.</p><form class="capture" id="form"><input id="url" type="url" required placeholder="Paste a web address…"><button>Add link</button></form><div class="notice" id="notice"><span><strong>You already saved this link.</strong> Here’s the existing bookmark.</span><button id="edit" type="button">Edit it</button></div><section class="section"><h2>All bookmarks</h2><article class="card" id="card"><div class="thumb">✦</div><div><div class="domain">fortelabs.com</div><div class="title">My PARA reference</div><p class="desc">A simple system for organizing digital information.</p><div class="chips"><span class="chip">Productivity</span> <span class="chip">Research</span></div></div></article></section></main></div><script>form.onsubmit=e=>{e.preventDefault();notice.classList.add('show');card.classList.add('found');card.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>card.classList.remove('found'),2600)};edit.onclick=()=>alert('The existing bookmark would open for editing.');</script></body></html>
