<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>My Bookmarks</h1>
        <p class="sub">Everything you've saved, all in one place.</p>
      </div>
      <button class="add-btn" id="addBtn">＋ Add bookmark</button>
    </div>

    <div id="storageWarn"></div>
    <div id="asideBar"></div>
    <div id="readBar"></div>

    <div class="adder" id="adder">
      <h2 id="adderTitle">Save a new bookmark</h2>
      <div class="field">
        <label id="urlLabel">Paste the link</label>
        <input id="url" type="text" placeholder="https://…" autocomplete="off" />
        <p id="urlHint" style="font-size:12px; margin:6px 2px 0; display:none;"></p>
      </div>

      <div class="dupe" id="dupe">
        <span id="dupeText"></span>
        <button id="openExisting">Open it to make changes</button>
      </div>

      <div class="preview" id="preview">
        <div class="field">
          <label>Title <span class="autofilled" id="tFill"></span></label>
          <input id="fTitle" type="text" placeholder="Give it a title you'll recognise" />
        </div>
        <div class="field">
          <label>Site <span class="autofilled" id="sFill"></span></label>
          <input id="fSite" type="text" />
        </div>
        <div class="field">
          <label>What it's about, from the page <span class="autofilled" id="dFill"></span></label>
          <textarea id="fDesc"></textarea>
        </div>
        <div class="field">
          <label>Your own note (optional) — in your words, so you can find it your way later</label>
          <textarea id="fNote" placeholder="e.g. the cake I'm making for Sarah's birthday"></textarea>
        </div>
        <div class="field">
          <label>Labels (type and press Enter)</label>
          <div class="chips-in" id="chipsIn">
            <input id="labelInput" type="text" placeholder="e.g. recipe" autocomplete="off" />
          </div>
          <div class="suggest" id="suggest"></div>
        </div>
        <div class="field reading-field">
          <label><input type="checkbox" id="fUnread" /> 📖 I still need to read this</label>
        </div>
      </div>

      <p class="warn" id="warn"></p>
      <div class="row-btns">
        <button class="save" id="saveBtn" disabled>Save it</button>
        <button class="cancel" id="cancelBtn">Cancel</button>
        <button class="aside-btn" id="asideBtn">Set aside</button>
        <button class="delete" id="deleteBtn">Delete for good</button>
      </div>
    </div>

    <div class="search" id="searchBar"><input id="q" type="text" placeholder="Search your bookmarks…" autocomplete="off" /></div>
    <div class="tagbar" id="tagbar"></div>
    <div class="listbar">
      <div class="count" id="count"></div>
      <label class="sort" id="sortWrap">Order&nbsp;
        <select id="sortSel">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">By name (A–Z)</option>
        </select>
      </label>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none;"></div>
  </div>

  <div id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

  <script src="src/core.js"></script>
  <script src="src/store.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
