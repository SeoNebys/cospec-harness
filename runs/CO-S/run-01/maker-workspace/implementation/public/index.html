<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="app">
  <div class="wrap">
    <h1>Bookmarks</h1>
    <p>Save links and find them again with confidence.</p>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-label="Add a bookmark">
    <h2 id="formHeading">Save a link</h2>
    <div class="mode-banner" id="modeBanner" role="status"></div>

    <label for="url">Paste a link</label>
    <div class="row-url">
      <input id="url" type="url" placeholder="https://…" autocomplete="off" />
      <button class="ghost" id="fetchBtn" type="button">Get details</button>
    </div>
    <div class="fetch-state" id="fetchState" role="status"></div>

    <div class="meta-preview" id="metaPreview">
      <div class="site" id="pSite"></div>
      <label for="title">Title</label>
      <input id="title" type="text" />
      <label for="desc">Description</label>
      <textarea id="desc"></textarea>

      <label for="tags">Tags (comma separated) — optional</label>
      <input id="tags" type="text" placeholder="e.g. design, to-read" />

      <label for="note">Note — optional</label>
      <textarea id="note" placeholder="Why you saved it…"></textarea>

      <div class="actions">
        <button class="primary" id="saveBtn" type="button">Save bookmark</button>
        <button class="ghost" id="cancelEditBtn" type="button" hidden>Cancel</button>
        <span class="save-flash" id="saveFlash" role="status"></span>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="Saved bookmarks">
    <div class="list-head">
      <h2>Saved</h2>
      <span class="count" id="count"></span>
    </div>

    <div class="views" role="tablist" aria-label="Which bookmarks to show">
      <button class="view-btn active" data-view="all" type="button" role="tab">All <span class="vcount" id="vc-all"></span></button>
      <button class="view-btn" data-view="later" type="button" role="tab">Read later <span class="vcount" id="vc-later"></span></button>
      <button class="view-btn" data-view="archived" type="button" role="tab">Archived <span class="vcount" id="vc-archived"></span></button>
    </div>

    <label for="search" class="sr-only">Search your bookmarks</label>
    <input id="search" type="text" class="search-box" placeholder="Search by word, #tag, &quot;phrase&quot;, AND/OR/NOT…" autocomplete="off" />

    <div id="list" aria-live="polite"></div>
  </section>
</main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
