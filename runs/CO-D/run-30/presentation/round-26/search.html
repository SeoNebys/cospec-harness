<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarks — Find saved pages</title>
  <style>
    :root{--ink:#20251f;--muted:#687066;--line:#dfe3da;--paper:#fbfcf8;--panel:#fff;--green:#285943;--green-dark:#1d4332;--green-soft:#e8f0e9;--cream:#f4f2e8}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 15% -10%,#eef3e8 0,transparent 34rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 40px));margin:auto}
    header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(223,227,218,.8)}
    .brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.02em;font-size:18px}.brand-mark{width:32px;height:36px;border-radius:7px 7px 10px 10px;display:grid;place-items:center;color:#fff;background:var(--green)}.brand-mark svg{width:17px}
    .primary{border:0;border-radius:10px;padding:11px 17px;background:var(--green);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px}.primary:hover{background:var(--green-dark)}
    main{padding:48px 0 80px}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px}.heading-tools{display:flex;align-items:center;gap:9px}h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(34px,5vw,48px);letter-spacing:-.035em;margin:0 0 8px}.subtitle{color:var(--muted);margin:0;font-size:16px}.count{color:var(--muted);font-size:14px;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:7px 11px}.select-toggle{display:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;color:var(--green);font-weight:700}
    .search-form{display:flex;align-items:center;gap:10px;margin:0 0 27px;max-width:670px}.search-box{position:relative;flex:1}.search-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;color:var(--muted)}
    .search-box input{width:100%;height:48px;border:1px solid #cbd1c7;border-radius:12px;padding:0 44px 0 45px;outline:0;background:#fff;color:var(--ink);box-shadow:0 5px 16px rgba(36,50,40,.04)}.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(40,89,67,.12)}
    .clear{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);width:29px;height:29px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:19px}.clear:hover{background:#f0f2ed}.search-submit{height:48px;padding-inline:20px}
    .label-bar{display:none;gap:8px;flex-wrap:wrap;margin:-5px 0 27px}.label-button{border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:650;border-radius:999px;padding:8px 14px}.label-button:hover{border-color:#b8c4b9;color:var(--green)}.label-button.active{background:var(--green);border-color:var(--green);color:#fff}
    .later-bar,.archive-bar{display:none;gap:8px;flex-wrap:wrap;margin:-5px 0 27px}.later-control{margin-top:15px}.later-button{border:1px solid #cbd6cc;border-radius:8px;padding:7px 10px;background:#fff;color:var(--green);font-size:12px;font-weight:700}.later-button.marked{background:var(--green-soft);border-color:var(--green-soft)}.later-check{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:12px;font-weight:700;cursor:pointer}.later-check input{width:16px;height:16px;accent-color:var(--green)}
    .collection-layout.with-sidebar{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;align-items:start}.label-sidebar{display:none;position:sticky;top:24px;padding:17px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.76)}.label-sidebar h2{margin:0 9px 11px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.label-sidebar .label-button{display:block;width:100%;border:0;border-radius:8px;text-align:left;margin:2px 0;padding:9px 10px;background:transparent}.label-sidebar .label-button.active{background:var(--green-soft);color:var(--green)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;min-height:246px;padding:22px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 8px 26px rgba(36,50,40,.07);animation:enter .22s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .site{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:650;margin-bottom:23px;padding-right:45px}.favicon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-size:16px;font-weight:700;flex:none}.card h2{margin:0 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.22;font-weight:600;letter-spacing:-.018em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.description{margin:0;color:var(--muted);font-size:14px;line-height:1.52;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.url{margin-top:auto;padding-top:19px;color:#7b8378;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edit{position:absolute;right:16px;top:18px;border:1px solid var(--line);background:#fff;color:var(--green);font-weight:700;border-radius:8px;padding:7px 10px;font-size:12px}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px}.tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:4px 8px;font-weight:700}
    .no-results{display:none;min-height:270px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:center;place-items:center;color:var(--muted)}.no-results strong{display:block;color:var(--ink);font-family:Georgia,serif;font-size:23px;margin-bottom:8px;font-weight:500}.empty-copy{margin:0 auto;max-width:390px;line-height:1.55}.empty-icon{width:48px;height:52px;margin:0 auto 18px;border:2px solid #b8c8bb;border-radius:10px 10px 14px 14px;display:grid;place-items:center;color:var(--green);background:var(--green-soft)}.empty-icon svg{width:23px}.empty-action{margin-top:21px}
    .bulk-select{display:flex;align-items:center;gap:7px;margin:-5px 0 15px;color:var(--green);font-size:12px;font-weight:700}.bulk-select input{width:17px;height:17px;accent-color:var(--green)}.bulk-bar{display:none;position:fixed;z-index:4;left:50%;bottom:24px;transform:translateX(-50%);align-items:center;gap:9px;padding:11px 12px 11px 17px;border-radius:13px;background:#26362d;color:#fff;box-shadow:0 14px 40px rgba(25,39,30,.28)}.bulk-bar.visible{display:flex}.bulk-bar span{font-size:14px;font-weight:700;margin-right:9px}.bulk-action{display:none;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:9px 12px;background:transparent;color:#fff;font-weight:700}.bulk-delete{border:0;border-radius:8px;padding:9px 12px;background:#fff;color:#9e392f;font-weight:750}.bulk-label-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:7px 26px}.bulk-label-option{position:relative}.bulk-label-option input{position:absolute;opacity:0}.bulk-label-option span{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-weight:650;cursor:pointer}.bulk-label-option input:checked+span{border-color:var(--green);background:var(--green-soft);color:var(--green)}
    dialog{border:0;border-radius:17px;padding:0;width:min(500px,calc(100% - 30px));color:var(--ink);background:#fff;box-shadow:0 18px 50px rgba(39,54,43,.18)}dialog::backdrop{background:rgba(27,34,27,.52);backdrop-filter:blur(2px)}.dialog-head{padding:25px 26px 12px}.dialog-head h2{margin:0 0 7px;font-family:Georgia,serif;font-size:25px}.dialog-head p{margin:0;color:var(--muted);line-height:1.5}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:20px 26px 26px}.secondary{border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:#fff;color:var(--ink);font-weight:650}.danger{border:0;border-radius:10px;padding:10px 16px;background:#a43d32;color:#fff;font-weight:700}
    .archive-action{margin-right:auto;color:var(--green)}.restore{position:absolute;right:16px;top:18px;border:1px solid var(--line);background:#fff;color:var(--green);font-weight:700;border-radius:8px;padding:7px 10px;font-size:12px}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.collection-layout.with-sidebar{grid-template-columns:145px minmax(0,1fr)}}@media(max-width:600px){.shell{width:calc(100% - 28px)}header{height:72px}header .primary span{display:none}main{padding-top:32px}.heading{align-items:start}.grid{grid-template-columns:1fr}.search-form{align-items:stretch}.search-submit{padding-inline:14px}.collection-layout.with-sidebar{display:block}.label-sidebar{position:static;margin-bottom:18px}.label-sidebar .label-button{display:inline-block;width:auto;margin:3px}.label-sidebar h2{display:none}}
  </style>
</head>
<body>
  <div class="shell" data-harness-ready="true">
    <header>
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 3.8h12v16.4l-6-3.5-6 3.5z"/></svg></span>Bookmarks</div>
      <button class="primary" type="button"><b>＋</b><span>Add bookmark</span></button>
    </header>
    <main>
      <div class="heading"><div><h1>Your collection</h1><p class="subtitle">Everything worth coming back to.</p></div><div class="heading-tools"><button class="select-toggle" id="select-toggle" type="button">Select items</button><span class="count" id="count">6 saved</span></div></div>
      <form class="search-form" id="search-form" role="search">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
          <input id="search" type="search" placeholder="Search your bookmarks" aria-label="Search your bookmarks" autocomplete="off">
          <button class="clear" id="clear" type="button" aria-label="Clear search">×</button>
        </div>
        <button class="primary search-submit" id="search-submit" type="submit">Search</button>
      </form>
      <nav class="label-bar" id="label-bar" aria-label="Filter by label"></nav>
      <nav class="later-bar" id="later-bar" aria-label="Filter by reading status"><button class="label-button active" type="button" data-later-filter="all">All bookmarks</button><button class="label-button" type="button" data-later-filter="later">Read later</button></nav>
      <nav class="archive-bar" id="archive-bar"><button class="label-button active" type="button" data-archive-filter="active">Collection</button><button class="label-button" type="button" data-archive-filter="archived">Archived</button></nav>
      <div class="collection-layout" id="collection-layout">
        <aside class="label-sidebar" id="label-sidebar"><h2>Labels</h2><div id="sidebar-buttons"></div></aside>
        <div>
          <section class="grid" id="grid" aria-live="polite"></section>
          <section class="no-results" id="no-results"><div id="empty-content"><strong>No bookmarks found</strong>Try a different word or phrase.</div></section>
        </div>
      </div>
    </main>
  </div>
  <div class="bulk-bar" id="bulk-bar"><span id="selected-count">0 selected</span><button class="bulk-action" id="bulk-add-label" type="button">Add label</button><button class="bulk-action" id="bulk-read-later" type="button">Mark read later</button><button class="bulk-delete" type="button">Delete selected</button></div>
  <dialog id="bulk-confirm"><div class="dialog-head"><h2>Delete selected bookmarks?</h2><p id="bulk-confirm-copy"></p></div><div class="dialog-actions"><button class="secondary" id="bulk-cancel" type="button">Keep bookmarks</button><button class="danger" id="bulk-confirm-delete" type="button">Delete permanently</button></div></dialog>
  <dialog id="bulk-label-dialog"><div class="dialog-head"><h2>Add a label</h2><p>The existing labels on each bookmark will be kept.</p></div><div class="bulk-label-options"><label class="bulk-label-option"><input type="radio" name="bulk-label" value="Recipes"><span>Recipes</span></label><label class="bulk-label-option"><input type="radio" name="bulk-label" value="Work"><span>Work</span></label><label class="bulk-label-option"><input type="radio" name="bulk-label" value="Travel"><span>Travel</span></label><label class="bulk-label-option"><input type="radio" name="bulk-label" value="Home"><span>Home</span></label></div><div class="dialog-actions"><button class="secondary" id="bulk-label-cancel" type="button">Cancel</button><button class="primary" id="bulk-label-apply" type="button">Apply label</button></div></dialog>
  <dialog id="archive-editor"><div class="dialog-head"><h2>Manage bookmark</h2><p id="archive-name"></p></div><div class="dialog-actions"><button class="secondary archive-action" id="archive-action" type="button">Archive bookmark</button><button class="secondary" id="archive-cancel" type="button">Cancel</button></div></dialog>
  <script>
    const bookmarks=[
      {site:'Serious Eats',letter:'S',color:'#cc2f26',title:'The Best Crispy Roast Potatoes Ever',description:'Crunchy shells and fluffy centers make these the perfect roast potatoes.',url:'seriouseats.com/roast-potatoes',labels:['Recipes'],later:false},
      {site:'Smashing Magazine',letter:'S',color:'#d94432',title:'Making Sense of Color Palettes',description:'A practical guide to building accessible, expressive color systems for digital products.',url:'smashingmagazine.com/color-palettes',labels:['Work'],later:false},
      {site:'Bon Appétit',letter:'B',color:'#253d63',title:'Weeknight Pasta for Tired People',description:'A deeply savory pantry pasta that comes together in less than thirty minutes.',url:'bonappetit.com/weeknight-pasta',labels:['Recipes'],later:false},
      {site:'Wanderlog',letter:'W',color:'#3477db',title:'Planning a Long Weekend in Kyoto',description:'Temples, quiet gardens, coffee shops, and a walkable three-day route.',url:'wanderlog.com/kyoto-weekend',labels:['Travel'],later:true},
      {site:'Cal Newport',letter:'C',color:'#333b43',title:'On Deep Work and Digital Distraction',description:'Notes on protecting your attention and making time for demanding creative work.',url:'calnewport.com/deep-work',labels:['Work'],later:false},
      {site:'The Spruce',letter:'T',color:'#538157',title:'A Calm Guide to Happy Houseplants',description:'How to read the light in your home and water indoor plants with confidence.',url:'thespruce.com/houseplant-guide',labels:['Home'],later:false}
    ];
    const params=new URLSearchParams(location.search);const mode=params.get('mode')||'live';const labelLayout=params.get('labels');const readLaterMode=params.get('readLater');const startLater=params.get('view')==='later';const bulkMode=params.get('bulk');const bulkActions=params.get('bulkActions');const archiveMode=params.get('archive')==='true';const boundary=params.get('boundary');const emptyMode=params.get('empty');let activeLabel='All';let laterOnly=startLater;let archivedOnly=false;let editingItem=null;let selectionMode=bulkMode==='always';const selected=new Set();
    if(boundary==='long'){Object.assign(bookmarks[0],{title:'The Definitive, Exhaustive, Extremely Detailed Guide to Making the Crispiest Roast Potatoes for Every Occasion',description:'A very long description that explains every possible technique, ingredient, variation, serving suggestion, troubleshooting tip, and historical detail anyone might want to remember about this page later.',url:'seriouseats.com/cooking-guides/roast-potatoes/the-complete-and-definitive-method-with-every-possible-variation',labels:['Recipes','Weekend plans','Favorites','Cooking','Vegetarian','Dinner','Techniques','To try']})}
    if(emptyMode==='collection')bookmarks.splice(0);
    const form=document.querySelector('#search-form');const input=document.querySelector('#search');const submit=document.querySelector('#search-submit');const clear=document.querySelector('#clear');const grid=document.querySelector('#grid');const empty=document.querySelector('#no-results');const count=document.querySelector('#count');
    if(mode==='live')submit.remove();
    if(emptyMode==='collection'){
      form.style.display='none';
      document.querySelector('#select-toggle').style.display='none';
      document.querySelector('#empty-content').innerHTML='<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3.8h12v16.4l-6-3.5-6 3.5z"/></svg></div><strong>No bookmarks yet</strong><p class="empty-copy">Save your first link and it’ll appear here with its title, description, and site details.</p><button class="primary empty-action" type="button">＋ Add your first bookmark</button>';
    }
    function card(item){const visibleLabels=boundary==='long'?item.labels.slice(0,3):item.labels;const more=boundary==='long'&&item.labels.length>3?`<span class="tag">+${item.labels.length-3}</span>`:'';const tags=(labelLayout||bulkActions)?`<div class="tags">${visibleLabels.map(label=>`<span class="tag">${label}</span>`).join('')}${more}</div>`:'';let later='';if(readLaterMode==='button')later=`<div class="later-control"><button class="later-button ${item.later?'marked':''}" type="button" data-later-toggle="${item.url}">${item.later?'✓ Saved for later':'＋ Read later'}</button></div>`;if(readLaterMode==='check')later=`<div class="later-control"><label class="later-check"><input type="checkbox" data-later-toggle="${item.url}" ${item.later?'checked':''}> Read later</label></div>`;const selection=bulkMode&&selectionMode?`<label class="bulk-select"><input type="checkbox" data-bulk-select="${item.url}" ${selected.has(item.url)?'checked':''}> Select</label>`:'';const action=archiveMode?(item.archived?`<button class="restore" type="button" data-restore="${item.url}">Restore</button>`:`<button class="edit" type="button" data-archive-edit="${item.url}">Edit</button>`):'<button class="edit" type="button">Edit</button>';return `<article class="card">${selection}<div class="site"><span class="favicon" style="background:${item.color}">${item.letter}</span>${item.site}</div>${action}<h2>${item.title}</h2><p class="description">${item.description}</p>${tags}${later}<div class="url">${item.url}</div></article>`}
    function show(query=''){const term=query.trim().toLowerCase();const matches=bookmarks.filter(item=>(!archiveMode||Boolean(item.archived)===archivedOnly)&&(activeLabel==='All'||item.labels.includes(activeLabel))&&(!laterOnly||item.later)&&`${item.site} ${item.title} ${item.description} ${item.url}`.toLowerCase().includes(term));grid.innerHTML=matches.map(card).join('');grid.style.display=matches.length?'grid':'none';empty.style.display=matches.length?'none':'grid';count.textContent=emptyMode==='collection'?'0 saved':(term||activeLabel!=='All'||laterOnly||archiveMode)?`${matches.length} ${matches.length===1?'result':'results'}`:`${bookmarks.length} saved`;clear.style.display=term?'block':'none'}
    function labelButtons(){return ['All','Recipes','Work','Travel','Home'].map(label=>`<button class="label-button ${label==='All'?'active':''}" type="button" data-label="${label}">${label}</button>`).join('')}
    function chooseLabel(event){const button=event.target.closest('[data-label]');if(!button)return;activeLabel=button.dataset.label;document.querySelectorAll('[data-label]').forEach(item=>item.classList.toggle('active',item.dataset.label===activeLabel));show(input.value)}
    if(labelLayout==='chips'&&emptyMode!=='collection'){const bar=document.querySelector('#label-bar');bar.innerHTML=labelButtons();bar.style.display='flex';bar.addEventListener('click',chooseLabel)}else if(labelLayout==='sidebar'&&emptyMode!=='collection'){const side=document.querySelector('#label-sidebar');side.style.display='block';document.querySelector('#collection-layout').classList.add('with-sidebar');document.querySelector('#sidebar-buttons').innerHTML=labelButtons();side.addEventListener('click',chooseLabel)}
    if(readLaterMode&&emptyMode!=='collection'){const bar=document.querySelector('#later-bar');bar.style.display='flex';if(startLater){const palette=bookmarks.find(item=>item.title.includes('Color Palettes'));if(palette)palette.later=true;bar.querySelectorAll('button').forEach(item=>item.classList.toggle('active',item.dataset.laterFilter==='later'))}bar.addEventListener('click',event=>{const button=event.target.closest('[data-later-filter]');if(!button)return;laterOnly=button.dataset.laterFilter==='later';bar.querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));show(input.value)});grid.addEventListener('click',event=>{const control=event.target.closest('button[data-later-toggle]');if(!control)return;const item=bookmarks.find(bookmark=>bookmark.url===control.dataset.laterToggle);item.later=!item.later;show(input.value)});grid.addEventListener('change',event=>{const control=event.target.closest('input[data-later-toggle]');if(!control)return;const item=bookmarks.find(bookmark=>bookmark.url===control.dataset.laterToggle);item.later=control.checked;show(input.value)})}
    if(bulkMode){const toggle=document.querySelector('#select-toggle'),bar=document.querySelector('#bulk-bar'),selectedCount=document.querySelector('#selected-count'),confirm=document.querySelector('#bulk-confirm'),labelDialog=document.querySelector('#bulk-label-dialog');if(bulkMode==='mode')toggle.style.display='inline-flex';if(bulkActions==='labels'||bulkActions==='all')document.querySelector('#bulk-add-label').style.display='inline-flex';if(bulkActions==='all')document.querySelector('#bulk-read-later').style.display='inline-flex';toggle.addEventListener('click',()=>{selectionMode=!selectionMode;selected.clear();toggle.textContent=selectionMode?'Done selecting':'Select items';bar.classList.remove('visible');show(input.value)});grid.addEventListener('change',event=>{const box=event.target.closest('[data-bulk-select]');if(!box)return;box.checked?selected.add(box.dataset.bulkSelect):selected.delete(box.dataset.bulkSelect);selectedCount.textContent=`${selected.size} selected`;bar.classList.toggle('visible',selected.size>0)});document.querySelector('#bulk-add-label').addEventListener('click',()=>labelDialog.showModal());document.querySelector('#bulk-label-cancel').addEventListener('click',()=>labelDialog.close());document.querySelector('#bulk-label-apply').addEventListener('click',()=>{const choice=document.querySelector('input[name="bulk-label"]:checked');if(!choice)return;bookmarks.filter(item=>selected.has(item.url)).forEach(item=>{if(!item.labels.includes(choice.value))item.labels.push(choice.value)});labelDialog.close();show(input.value)});document.querySelector('#bulk-read-later').addEventListener('click',()=>{bookmarks.filter(item=>selected.has(item.url)).forEach(item=>item.later=true);show(input.value)});document.querySelector('.bulk-delete').addEventListener('click',()=>{document.querySelector('#bulk-confirm-copy').textContent=`This will permanently delete ${selected.size} bookmarks. This cannot be undone.`;confirm.showModal()});document.querySelector('#bulk-cancel').addEventListener('click',()=>confirm.close());document.querySelector('#bulk-confirm-delete').addEventListener('click',()=>{for(let i=bookmarks.length-1;i>=0;i--)if(selected.has(bookmarks[i].url))bookmarks.splice(i,1);selected.clear();bar.classList.remove('visible');confirm.close();show(input.value)})}
    if(archiveMode&&emptyMode!=='collection'){const archiveBar=document.querySelector('#archive-bar'),editor=document.querySelector('#archive-editor');archiveBar.style.display='flex';archiveBar.addEventListener('click',event=>{const button=event.target.closest('[data-archive-filter]');if(!button)return;archivedOnly=button.dataset.archiveFilter==='archived';archiveBar.querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));show(input.value)});grid.addEventListener('click',event=>{const edit=event.target.closest('[data-archive-edit]'),restore=event.target.closest('[data-restore]');if(edit){editingItem=bookmarks.find(item=>item.url===edit.dataset.archiveEdit);document.querySelector('#archive-name').textContent=editingItem.title;editor.showModal()}if(restore){const item=bookmarks.find(entry=>entry.url===restore.dataset.restore);item.archived=false;show(input.value)}});document.querySelector('#archive-cancel').addEventListener('click',()=>editor.close());document.querySelector('#archive-action').addEventListener('click',()=>{editingItem.archived=true;editor.close();show(input.value)})}
    if(mode==='live')input.addEventListener('input',()=>show(input.value));
    form.addEventListener('submit',event=>{event.preventDefault();show(input.value)});
    clear.addEventListener('click',()=>{input.value='';show('');input.focus()});
    show();
