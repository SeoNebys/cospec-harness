[project]
name = "bookmark-manager-backend"
version = "0.1.0"
description = "Local bookmark manager backend (FastAPI + SQLite)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
