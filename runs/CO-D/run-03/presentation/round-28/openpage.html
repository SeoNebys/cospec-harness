<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open original page — prototype</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --line:#e4e7eb; --ink:#1e2430; --muted:#6b7480; --accent:#2f6df6; --green:#1c9d63; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:720px; margin:0 auto; padding:26px 20px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .preview { height:120px; background-size:cover; background-position:center; cursor:pointer; position:relative; }
  .preview .open-hint { position:absolute; right:10px; bottom:10px; background:rgba(20,25,35,.6); color:#fff; font-size:11px; padding:3px 9px; border-radius:999px; opacity:0; transition:opacity .15s; }
  .preview:hover .open-hint { opacity:1; }
  .cbody { padding:14px 16px; position:relative; }
  .title-row { display:flex; align-items:flex-start; gap:8px; }
  a.title { font-size:16px; font-weight:600; line-height:1.35; color:var(--ink); text-decoration:none; cursor:pointer; }
  a.title:hover { color:var(--accent); text-decoration:underline; }
  a.title .ext { font-size:12px; color:var(--muted); }
  .desc { font-size:13px; color:#4a5260; margin:5px 0 9px; }
  .taglist { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 9px; }
  .chip { background:#e7f0ff; color:#245; border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .chip:hover { background:#d4e5ff; }
  .meta { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; }
  .fav { width:16px; height:16px; border-radius:4px; }
  a.urllink { color:var(--muted); font-size:12px; text-decoration:none; word-break:break-all; }
  a.urllink:hover { color:var(--accent); text-decoration:underline; }
  .rowacts { display:flex; gap:8px; margin-top:11px; }
  .act { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 11px; font-size:12.5px; cursor:pointer; color:var(--ink); }
  .act.open { border-color:#bcd0f7; color:var(--accent); font-weight:600; }
  .note { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Getting from a saved bookmark to the real web page.</p>
  <div id="list"></div>
  <p class="note">In this preview, opening a page shows a small confirmation instead of navigating away — so you can stay on this screen. In the real app it opens the actual page in a new browser tab.</p>
</div>
<script>
function color(seed){ let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))%360; return h; }
function favSVG(site){ const h=color(site); const l=site.replace(/^www\./,'')[0].toUpperCase();
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" rx="7" fill="hsl(${h} 70% 55%)"/><text x="16" y="22" font-family="sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">${l}</text></svg>`); }
function previewSVG(site){ const h=color(site);
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 65% 55%)"/><stop offset="1" stop-color="hsl(${(h+40)%360} 65% 42%)"/></linearGradient></defs><rect width="720" height="240" fill="url(#g)"/><text x="34" y="132" font-family="sans-serif" font-size="28" font-weight="700" fill="white">${site}</text></svg>`); }

const DATA=[
  { title:"The Quiet Art of Reading Later", url:"https://www.nytimes.com/2026/01/12/technology/reading-later.html", site:"nytimes.com",
    desc:"Why saving articles to read later can make you a calmer reader.", tags:["reading","focus"] },
  { title:"CSS Flexbox layout — MDN Web Docs", url:"https://developer.mozilla.org/en-US/docs/Web/CSS/Flexbox", site:"developer.mozilla.org",
    desc:"A one-dimensional layout method for rows or columns.", tags:["css","reference"] }
];
const listEl=document.getElementById("list");
function openPage(url){
  const t=document.createElement("div");
  t.textContent="↗ Opening "+url+" in a new tab…";
  t.style.cssText="position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1e2430;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3)";
  document.body.appendChild(t); setTimeout(()=>t.remove(),1600);
}
listEl.innerHTML=DATA.map((b,i)=>
  '<div class="card">'+
    '<div class="preview" data-open="'+i+'" style="background-image:url(\''+previewSVG(b.site)+'\')"><span class="open-hint">↗ Open page</span></div>'+
    '<div class="cbody">'+
      '<div class="title-row"><a class="title" data-open="'+i+'">'+b.title+' <span class="ext">↗</span></a></div>'+
      '<div class="desc">'+b.desc+'</div>'+
      '<div class="taglist">'+b.tags.map(t=>'<span class="chip">#'+t+'</span>').join('')+'</div>'+
      '<div class="meta"><img class="fav" src="'+favSVG(b.site)+'"/> '+
        '<a class="urllink" data-open="'+i+'">'+b.url+'</a></div>'+
      '<div class="rowacts">'+
        '<button class="act open" data-open="'+i+'">↗ Open page</button>'+
        '<button class="act">✎ Edit</button><button class="act">🗄 Archive</button>'+
      '</div>'+
    '</div>'+
  '</div>').join('');
listEl.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{ e.preventDefault(); openPage(DATA[+el.dataset.open].url); });
listEl.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{ const t=document.createElement("div");
  t.textContent="(filters by "+el.textContent+" — does not open the page)";
  t.style.cssText="position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#2f6df6;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:99";
  document.body.appendChild(t); setTimeout(()=>t.remove(),1500); });
document.body.setAttribute("data-harness-ready","true");
</script>
</body>
</html>
