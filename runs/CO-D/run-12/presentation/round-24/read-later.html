<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — Read later</title><style>
:root{--ink:#17231e;--muted:#68736d;--paper:#f5f2e9;--card:#fffdf7;--line:#d9d5ca;--green:#235d45;--pale:#e0eee5;--amber:#8b5c1d;--amberpale:#f7ecd8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}.layout{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{padding:27px 20px;border-right:1px solid var(--line);background:#ece9df}.brand{display:flex;align-items:center;margin:0 8px 38px;font-weight:760}.mark{width:34px;height:34px;margin-right:10px;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:11px}.nav{display:grid;gap:6px}.nav button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:0;border-radius:10px;color:#55615b;background:transparent;font-size:13px;font-weight:700;text-align:left;cursor:pointer}.nav button.active{color:#fff;background:var(--green);box-shadow:0 7px 17px rgba(35,93,69,.18)}.nav .badge{min-width:22px;padding:3px 6px;border-radius:999px;color:var(--muted);background:#dad7cf;font-size:10px;text-align:center}.nav button.active .badge{color:var(--green);background:#fff}.main{background:radial-gradient(circle at 83% 4%,#dce8dd,transparent 30rem),var(--paper)}header{height:78px;padding:0 6vw;display:flex;align-items:center;justify-content:flex-end;border-bottom:1px solid rgba(23,35,30,.1)}.search{width:min(310px,100%);padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}.search input{width:100%;border:0;outline:0;color:var(--ink);background:transparent;font-size:13px}main{width:min(830px,calc(100% - 10vw));margin:0 auto;padding:52px 0 80px}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:27px}h1{margin:0;font:500 48px/1 Georgia,serif;letter-spacing:-.04em}.lead{margin:9px 0 0;color:var(--muted);font-size:15px}.order{color:var(--muted);font-size:12px}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:60px 1fr auto;gap:15px;align-items:start;padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 7px 22px rgba(36,48,41,.05);animation:rise .24s ease both}.thumb{width:60px;height:60px;display:grid;place-items:center;border-radius:12px;background:#dce7ed;font:27px Georgia,serif}.thumb.gold{background:#f1d9b7}.card h2{margin:1px 0 6px;font-size:16px}.card p{margin:0 0 8px;color:var(--muted);font-size:12px;line-height:1.45}.domain{color:var(--green);font-size:11px;font-weight:700}.actions{display:grid;gap:7px}.actions button{padding:8px 10px;border:0;border-radius:8px;font-size:11px;font-weight:720;cursor:pointer}.open{color:#fff;background:var(--green)}.done{color:var(--amber);background:var(--amberpale)}.empty{display:none;padding:55px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}.empty strong{display:block;margin-bottom:6px;color:var(--ink);font:500 22px Georgia,serif}.toast{position:fixed;right:28px;bottom:28px;padding:13px 17px;border-radius:11px;color:#fff;background:var(--ink);font-size:12px;box-shadow:0 10px 28px rgba(0,0,0,.16);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.visible{opacity:1;transform:none}@keyframes rise{from{opacity:0;transform:translateY(6px)}}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{padding:15px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin-bottom:15px}.nav{grid-template-columns:1fr 1fr}.card{grid-template-columns:48px 1fr}.thumb{width:48px;height:48px}.actions{grid-column:2;grid-template-columns:1fr 1fr}.head{align-items:start;flex-direction:column;gap:10px}}
</style></head><body><div class="layout" data-harness-ready="true"><aside class="sidebar"><div class="brand"><span class="mark">T</span>Trove</div><nav class="nav"><button id="all" class="active">All bookmarks <span class="badge">4</span></button><button id="later">◷ Read later <span class="badge" id="laterCount">2</span></button></nav></aside><section class="main"><header><label class="search"><input placeholder="Search saved links" aria-label="Search saved links"></label></header><main><div class="head"><div><h1 id="title">All bookmarks</h1><p class="lead" id="lead">Everything worth finding again.</p></div><span class="order" id="order">4 links · newest first</span></div><div class="list" id="list"></div><div class="empty" id="empty"><strong>You’re all caught up.</strong>Your bookmarks are still safe in the main collection.</div></main></section></div><div class="toast" id="toast">Marked done — still saved in All bookmarks</div><script>
const items=[{id:1,letter:'W',tone:'',title:'The Art of Taking Better Walks',description:'Small observations that make an everyday walk more memorable.',domain:'psyche.co',later:true},{id:2,letter:'R',tone:'gold',title:'My perfect risotto guide',description:'A careful guide to creamy, deeply flavorful risotto.',domain:'seriouseats.com',later:true},{id:3,letter:'D',tone:'',title:'Designing calmer workdays',description:'Practical ideas for focus and sustainable routines.',domain:'nesslabs.com',later:false},{id:4,letter:'B',tone:'gold',title:'A loaf for every weekend',description:'Approachable bread recipes and home baking notes.',domain:'theperfectloaf.com',later:false}];let view='all';const list=document.querySelector('#list'),empty=document.querySelector('#empty');
function render(){const found=view==='later'?items.filter(x=>x.later):items;list.innerHTML=found.map(x=>`<article class="card" data-id="${x.id}"><div class="thumb ${x.tone}">${x.letter}</div><div><h2>${x.title}</h2><p>${x.description}</p><span class="domain">${x.domain}</span></div><div class="actions"><button class="open">Open article</button>${view==='later'?'<button class="done">✓ Mark done</button>':''}</div></article>`).join('');empty.style.display=found.length?'none':'block';document.querySelector('#laterCount').textContent=items.filter(x=>x.later).length;document.querySelector('#order').textContent=`${found.length} ${found.length===1?'link':'links'} · newest first`;list.querySelectorAll('.done').forEach(b=>b.onclick=()=>{const id=Number(b.closest('.card').dataset.id);items.find(x=>x.id===id).later=false;render();const toast=document.querySelector('#toast');toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),2600)})}
document.querySelector('#all').onclick=()=>{view='all';document.querySelector('#all').classList.add('active');document.querySelector('#later').classList.remove('active');document.querySelector('#title').textContent='All bookmarks';document.querySelector('#lead').textContent='Everything worth finding again.';render()};document.querySelector('#later').onclick=()=>{view='later';document.querySelector('#later').classList.add('active');document.querySelector('#all').classList.remove('active');document.querySelector('#title').textContent='Read later';document.querySelector('#lead').textContent='The things you meant to come back to.';render()};render();
</script></body></html>
