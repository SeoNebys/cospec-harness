<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 15 (icons & thumbnails)</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#3b5bdb; --bg:#f7f7f9; --unread:#e8590c; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:0; background:var(--bg); color:#1a1a1e; }
  .wrap { max-width:720px; margin:0 auto; padding:22px 20px 80px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .switch { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .switch button { border:1px solid var(--line); background:#fff; color:#333; border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .switch button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .styleName { font-size:13px; color:var(--muted); margin-bottom:16px; line-height:1.5; }
  .styleName b { color:#1a1a1e; }
  .note { font-size:12px; color:#9a9aa2; margin-bottom:14px; }

  .card { background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; cursor:pointer; overflow:hidden; }
  .card:hover { box-shadow:0 3px 14px rgba(0,0,0,.08); border-color:#cfd6ef; }
  .card.unread { border-left:3px solid var(--unread); }

  /* favicon */
  .fav { width:18px; height:18px; border-radius:4px; flex:none; display:inline-flex; align-items:center;
         justify-content:center; color:#fff; font-size:11px; font-weight:700; vertical-align:-3px; }
  .titleline { display:flex; align-items:center; gap:7px; }
  .title { font-size:15px; font-weight:500; margin:0; }
  .card.unread .title { font-weight:700; }
  .url { font-size:12px; color:var(--accent); word-break:break-all; margin-top:2px; }
  .desc { font-size:13px; color:#3a3a42; margin:7px 0 0; }
  .lbls { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .lbls span { background:#eef0f4; color:#444; border-radius:12px; padding:2px 9px; font-size:12px; }

  /* thumbnail */
  .thumb { flex:none; border-radius:8px; background:#e9ecf4; display:flex; align-items:center;
           justify-content:center; color:#fff; font-weight:700; overflow:hidden; position:relative; }
  .thumb.ph { background:repeating-linear-gradient(45deg,#eef0f5,#eef0f5 8px,#e6e9f0 8px,#e6e9f0 16px); color:#b8bcc8; }
  .thumb .mono { font-size:20px; }

  /* Variant A — thumbnail right */
  .A .inner { display:flex; gap:14px; padding:14px 16px; align-items:flex-start; }
  .A .body { flex:1; min-width:0; }
  .A .thumb { width:84px; height:64px; }

  /* Variant B — thumbnail left, larger */
  .B .inner { display:flex; gap:14px; padding:14px 16px; align-items:stretch; }
  .B .body { flex:1; min-width:0; }
  .B .thumb { width:104px; height:78px; }

  /* Variant C — favicon only, no thumbnail */
  .C .inner { padding:14px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Prototype 15 — adding the site icon and a page thumbnail so the list scans visually</p>

  <div class="switch">
    <button data-v="A" class="on">A — small thumbnail, right</button>
    <button data-v="B">B — larger thumbnail, left</button>
    <button data-v="C">C — icon only, no thumbnail</button>
  </div>
  <div class="styleName" id="styleName"></div>
  <div class="note">Note: real site icons and page images can't be fetched in this sketch, so they're shown as
    coloured stand-ins (letter = site). One item (“ripgrep”) has <b>no page image</b> on purpose, to show the fallback.</div>

  <div id="cards"></div>
</div>

<script>
  let v="A";
  const DESC={
    A:"<b>A — small thumbnail on the right.</b> Text stays the star; a compact page image sits to the side as a visual anchor, plus the site icon by the title.",
    B:"<b>B — larger thumbnail on the left.</b> The image leads the eye; most magazine-like and scannable, but takes more room per card so fewer fit on screen.",
    C:"<b>C — site icon only, no thumbnail.</b> Lightest touch: just the little favicon by each title for a splash of recognition, no page image at all."
  };

  const DATA=[
    {t:"Simplest Brothy Beans and Rice",u:"smittenkitchen.com/beans",d:"A weeknight one-pot dinner over rice.",l:["recipes","dinner"],unread:false,fav:"#e8590c",th:"#f08c00",thumb:true},
    {t:"A Deep Dive into Database Indexes",u:"use-the-index-luke.com",d:"How indexes work and how to design them.",l:["coding"],unread:true,fav:"#1c7ed6",th:"#4263eb",thumb:true},
    {t:"A Perfect Day in Kyoto",u:"nationalgeographic.com/kyoto",d:"A walking itinerary through temples and gardens.",l:["travel"],unread:true,fav:"#2f9e44",th:"#2b8a3e",thumb:true},
    {t:"ripgrep — regex search",u:"github.com/BurntSushi/ripgrep",d:"Recursively searches your directory for a regex pattern.",l:["tools","coding"],unread:false,fav:"#212529",th:null,thumb:false}
  ];

  const el=id=>document.getElementById(id);
  const cards=el("cards"), styleName=el("styleName");
  document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".switch button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); v=b.dataset.v; styleName.innerHTML=DESC[v]; render();
  }));
  styleName.innerHTML=DESC["A"];

  function letter(u){ return u.replace(/^www\./,"")[0].toUpperCase(); }
  function favHtml(b){ return '<span class="fav" style="background:'+b.fav+'">'+letter(b.u)+'</span>'; }
  function thumbHtml(b){
    if(b.thumb) return '<div class="thumb" style="background:linear-gradient(135deg,'+b.th+',#00000022)"><span class="mono">'+letter(b.u)+'</span></div>';
    return '<div class="thumb ph"><span class="mono">'+letter(b.u)+'</span></div>';  // fallback tile
  }
  function bodyHtml(b,withFav){
    return '<div class="body">'+
      '<div class="titleline">'+(withFav?favHtml(b):'')+'<p class="title">'+b.t+'</p></div>'+
      '<div class="url">'+b.u+'</div>'+
      '<p class="desc">'+b.d+'</p>'+
      '<div class="lbls">'+b.l.map(l=>'<span>'+l+'</span>').join('')+'</div>'+
    '</div>';
  }

  function render(){
    cards.innerHTML="";
    DATA.forEach(b=>{
      const c=document.createElement("div"); c.className="card "+v+(b.unread?" unread":"");
      if(v==="A") c.innerHTML='<div class="inner">'+bodyHtml(b,true)+thumbHtml(b)+'</div>';
      else if(v==="B") c.innerHTML='<div class="inner">'+thumbHtml(b)+bodyHtml(b,true)+'</div>';
      else c.innerHTML='<div class="inner">'+bodyHtml(b,true)+'</div>';
      cards.appendChild(c);
    });
  }
  render();
</script>
</body>
</html>
