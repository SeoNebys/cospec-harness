<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepmark — tag interaction</title>
  <style>
    :root { color-scheme: light; --ink:#17211d; --muted:#66716c; --line:#dfe5e1; --paper:#fbfcfa; --white:#fff; --accent:#176b4d; --dark:#10533b; --wash:#eaf3ee; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink) }
    header { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 48px; border-bottom:1px solid var(--line); background:#fff }
    .brand { display:flex; align-items:center; gap:11px; font-weight:760; letter-spacing:-.02em }.brand-mark { width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative }.brand-mark:after { content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white }.scope { font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px }
    main { width:min(920px,calc(100% - 40px));margin:48px auto }.eyebrow { color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase }h1 { font-size:40px;letter-spacing:-.04em;line-height:1.05;margin:10px 0 12px }.intro { color:var(--muted);font-size:17px;margin:0 0 26px }
    .capture { background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 35px rgba(30,55,43,.08) }.main-row { display:flex;gap:10px }.url-input { flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:16px;padding:11px 12px }.primary { border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:720;padding:12px 20px;cursor:pointer }.primary:hover { background:var(--dark) }
    .tag-area { margin-top:10px;padding:15px 12px 7px;border-top:1px solid var(--line) }.tag-label { display:block;font-size:13px;font-weight:700;margin-bottom:9px }.tag-input { width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit;outline:none }.suggestions { display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap }.suggestions span { color:var(--muted);font-size:12px }.tag-choice,.tag { border:0;border-radius:999px;background:var(--wash);color:var(--dark);padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer }.tag-choice:hover { outline:2px solid #bed8ca }
    .collection { margin-top:38px }.collection-head { display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:13px }h2 { margin:0;font-size:20px }.count { color:var(--muted);font-size:14px }.card { margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;box-shadow:0 8px 24px rgba(30,55,43,.06) }.card-title { color:var(--ink);font-size:19px;font-weight:730;text-decoration:none }.description { margin:8px 0 11px;color:var(--muted);line-height:1.5 }.url { color:var(--accent);font-size:13px }.tags { display:flex;gap:7px;margin-top:14px }.saved { align-self:start;background:var(--wash);color:var(--dark);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:720 }.after-box { grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px }.after-title { font-size:13px;font-weight:700;margin-bottom:8px }.hidden { display:none }
  </style>
</head>
<body>
  <header><div class="brand"><span class="brand-mark"></span>Keepmark</div><div class="scope">Personal library</div></header>
  <main data-harness-ready="true">
    <div class="eyebrow">Your bookmark library</div><h1>Save the good parts of the web.</h1><p class="intro">Paste a link. Keepmark fills in the useful details so it’s ready to find when you need it.</p>
    <form class="capture" id="form">
      <div class="main-row"><input class="url-input" value="https://developer.mozilla.org/en-US/docs/Web/JavaScript" aria-label="Web address"><button class="primary">Save link</button></div>
      <div class="tag-area" id="before-tags"><label class="tag-label" for="tag-input">Tags <span style="font-weight:400;color:var(--muted)">— optional</span></label><input class="tag-input" id="tag-input" placeholder="Type or choose a tag"><div class="suggestions"><span>Used before</span><button type="button" class="tag-choice">javascript</button><button type="button" class="tag-choice">reference</button><button type="button" class="tag-choice">work</button></div></div>
    </form>
    <section class="collection"><div class="collection-head"><h2>All bookmarks</h2><span class="count">0 links</span></div><div id="results"></div></section>
  </main>
  <script>
    const after = new URLSearchParams(location.search).get('style') === 'after';
    const beforeTags = document.querySelector('#before-tags');
    const form = document.querySelector('#form');
    const count = document.querySelector('.count');
    let selected = '';
    if (after) beforeTags.classList.add('hidden');
    document.querySelectorAll('#before-tags .tag-choice').forEach(button => button.addEventListener('click', () => {
      selected = button.textContent; document.querySelector('#tag-input').value = selected;
    }));
    form.addEventListener('submit', event => {
      event.preventDefault(); count.textContent = '1 link';
      document.querySelector('#results').innerHTML = `<article class="card"><div><a class="card-title" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">JavaScript | MDN</a><p class="description">JavaScript is a scripting language that enables you to create dynamically updating content and much more.</p><div class="url">https://developer.mozilla.org/en-US/docs/Web/JavaScript</div><div class="tags">${selected ? `<span class="tag">${selected}</span>` : ''}</div></div><span class="saved">Saved</span>${after ? `<div class="after-box"><div class="after-title">Add tags to this bookmark</div><div class="suggestions"><span>Used before</span><button type="button" class="tag-choice post">javascript</button><button type="button" class="tag-choice post">reference</button><button type="button" class="tag-choice post">work</button></div></div>` : ''}</article>`;
      document.querySelectorAll('.post').forEach(button => button.addEventListener('click', () => {
        document.querySelector('.tags').innerHTML = `<span class="tag">${button.textContent}</span>`;
        document.querySelector('.after-box').innerHTML = `<div class="after-title">Tag added</div>`;
      }));
    });
  </script>
</body>
</html>
