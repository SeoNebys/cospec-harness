<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>My Bookmarks</h1>
  </header>

  <main class="wrap">
    <!-- Save (SCN-001): paste a link and Save -->
    <form id="saveForm" class="savebox" autocomplete="off">
      <input id="urlInput" type="text" placeholder="Paste a link here, e.g. https://…" aria-label="Link to save" />
      <button type="submit" id="saveBtn">Save</button>
    </form>
    <p id="saveError" class="inline-err" role="alert"></p>
    <div id="dupeNotice" class="notice" hidden></div>

    <!-- Find (SCN-002): live search -->
    <div class="searchbar">
      <span class="icon" aria-hidden="true">&#128269;</span>
      <input id="searchInput" type="search" placeholder="Search your saved links…" aria-label="Search" />
    </div>

    <div class="layout">
      <aside class="side">
        <h2>Tags</h2>
        <div id="tags" class="tags"></div>
      </aside>
      <section class="main">
        <p id="count" class="count"></p>
        <ul id="list" class="list"></ul>
        <div id="emptyState" class="empty" hidden></div>
      </section>
    </div>
  </main>

  <div id="toastHost" aria-live="polite"></div>

  <script src="/shared.js"></script>
  <script src="/app.js"></script>
</body>
</html>
