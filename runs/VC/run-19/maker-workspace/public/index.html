<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🔖 Bookmarks</h1>
    <div class="search">
      <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" />
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <button id="addBtn" class="primary">+ Add bookmark</button>
      <h2>Tags</h2>
      <ul id="tagList" class="taglist">
        <li><button class="tag-chip active" data-tag="">All</button></li>
      </ul>
    </aside>

    <section class="content">
      <div id="list" class="list"></div>
      <p id="empty" class="empty" hidden>No bookmarks yet. Add your first one!</p>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 id="modalTitle">Add bookmark</h2>
      <form id="form">
        <input type="hidden" id="bmId" />
        <label>URL <input id="url" type="text" placeholder="https://example.com" required /></label>
        <label>Title <input id="title" type="text" placeholder="Optional" /></label>
        <label>Description <textarea id="description" rows="3" placeholder="Optional notes"></textarea></label>
        <label>Tags <input id="tags" type="text" placeholder="comma, separated, tags" /></label>
        <div class="actions">
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
