<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🔖 Bookmarks</h1>
    <input id="search" type="search" placeholder="Search title, URL, or notes…" autocomplete="off" />
  </header>

  <main>
    <aside id="sidebar">
      <form id="add-form">
        <h2>Add bookmark</h2>
        <input id="url" type="text" placeholder="https://example.com" required />
        <input id="title" type="text" placeholder="Title (optional — auto-fetched)" />
        <input id="tags" type="text" placeholder="Tags (comma separated)" />
        <textarea id="description" placeholder="Notes (optional)" rows="2"></textarea>
        <button type="submit">Add</button>
        <p id="add-status" class="status"></p>
      </form>

      <div id="import-box">
        <h2>Import</h2>
        <p class="hint">Import a browser bookmarks export (<code>.html</code>).</p>
        <label class="checkbox">
          <input id="import-folders" type="checkbox" checked />
          Use folders as tags
        </label>
        <label id="import-label" class="file-btn">
          Choose bookmarks file…
          <input id="import-file" type="file" accept=".html,text/html" hidden />
        </label>
        <p id="import-status" class="status"></p>
      </div>

      <div id="tag-filter">
        <h2>Tags</h2>
        <ul id="tag-list"></ul>
      </div>
    </aside>

    <section id="content">
      <div id="active-filter"></div>
      <ul id="bookmark-list"></ul>
      <p id="empty" class="empty" hidden>No bookmarks yet. Add one on the left.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
