<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookmarks — note & sort</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#6b7480; --line:#e6e9ee;
    --accent:#2f6df6; --chip:#eef1f6; --chipink:#3a4658; --mark:#fff1a8; --note:#5a4a1f; --notebg:#fbf6e6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 22px; }
  .searchwrap { position:relative; margin-bottom:14px; }
  .searchwrap .ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .searchwrap input { width:100%; padding:11px 38px 11px 40px; font-size:14.5px; border:1px solid var(--line);
    border-radius:10px; background:#fbfcfe; outline:none; }
  .searchwrap .clr { position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none;
    background:none; color:var(--muted); cursor:pointer; font-size:18px; display:none; }

  .toolrow { display:flex; align-items:center; justify-content:space-between; margin:0 0 12px; gap:12px; }
  .count { color:var(--muted); font-size:13px; }
  .sortwrap { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; }
  .sortwrap select { font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px;
    padding:6px 8px; background:#fff; color:var(--ink); cursor:pointer; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 16px; }

  ul { list-style:none; margin:0; padding:0; }
  li.item { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
  .favicon { width:32px; height:32px; border-radius:8px; flex:none; background:#eef1f6; display:grid; place-items:center; font-size:16px; }
  .body { min-width:0; flex:1; }
  .title { font-weight:600; font-size:15.5px; margin:0 0 2px; }
  .title a { color:var(--ink); text-decoration:none; } .title a:hover { text-decoration:underline; }
  .desc { color:var(--muted); font-size:13.5px; margin:0 0 6px; }
  .note { background:var(--notebg); border-left:3px solid #e4d29a; color:var(--note); border-radius:0 8px 8px 0;
    padding:6px 10px; font-size:13px; margin:0 0 6px; white-space:pre-wrap; }
  .note .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.04em; opacity:.7; display:block; margin-bottom:1px; }
  .meta { color:var(--muted); font-size:12.5px; margin:0 0 6px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; }
  .lchip { background:var(--chip); color:var(--chipink); border-radius:999px; padding:3px 10px; font-size:12.5px; }
  .state.toread { background:#fdf3d6; color:#8a6d1f; font-size:12px; border-radius:999px; padding:2px 9px; }
  mark { background:var(--mark); border-radius:3px; padding:0 1px; }
  .actions { flex:none; } .btn { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:8px;
    padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; } .btn:hover { border-color:#cdd3db; color:var(--ink); }
  .field { width:100%; font:inherit; border:1px solid var(--accent); border-radius:6px; padding:6px 8px; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Paste a link. It sorts itself out.</p>
    <div class="searchwrap"><span class="ic">🔍</span>
      <input id="search" type="text" placeholder="Search — now reads your notes too…" autocomplete="off">
      <button class="clr" id="clr">×</button>
    </div>
    <div class="toolrow">
      <span class="count" id="count"></span>
      <span class="sortwrap">Sort
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">By name (A–Z)</option>
        </select>
      </span>
    </div>
    <p class="hint">Click <b>Edit</b> to jot a private <b>Note</b>. Then search <code>mushroom</code> — it's only in a note,
       and search should still find it. Flip the <b>Sort</b> to see oldest-first or A–Z.</p>
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

<script>
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// order: higher = saved more recently
const items=[
  { id:"a", order:5, url:"https://cooking.nytimes.com/recipes/lemon-pasta", host:"cooking.nytimes.com", site:"NYT Cooking",
    emoji:"🍝", title:"Lemon pasta", desc:"A bright weeknight pasta with lemon and parmesan.",
    note:"The mushroom variation halfway down is the good part — double the garlic.", labels:["recipes"], toRead:false },
  { id:"b", order:4, url:"https://www.bbc.com/news/future-of-work", host:"bbc.com", site:"BBC", emoji:"📰",
    title:"The future of work", desc:"How remote and hybrid patterns are reshaping the office.",
    note:"", labels:["work stuff","articles to read"], toRead:true },
  { id:"c", order:3, url:"https://github.com/acme/dashboard", host:"github.com", site:"GitHub", emoji:"🐙",
    title:"Acme Dashboard", desc:"Internal metrics dashboard repository.",
    note:"Saved for the Q3 review — the chart config is what I need.", labels:["work stuff"], toRead:false },
  { id:"d", order:2, url:"https://en.wikipedia.org/wiki/Espresso", host:"wikipedia.org", site:"Wikipedia", emoji:"📚",
    title:"Espresso", desc:"A concentrated coffee brewing method.", note:"", labels:[], toRead:true },
  { id:"e", order:1, url:"https://medium.com/@w/deep-work", host:"medium.com", site:"Medium", emoji:"✍️",
    title:"Notes on deep work", desc:"Strategies for focused work.", note:"", labels:["articles to read"], toRead:true },
];
const list=document.getElementById("list"), empty=document.getElementById("empty"), countEl=document.getElementById("count");
let editing=null, query="", sort="new";

function tokenize(q){ const t=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(q))!==null){ const s=(m[1]!==undefined?m[1]:m[2]).trim().toLowerCase(); if(s) t.push(s);} return t; }
// NOTE is now part of what search reads:
function haystack(it){ return (it.title+" "+it.desc+" "+it.site+" "+(it.note||"")).toLowerCase(); }
function matches(it,tk){ const h=haystack(it); return tk.every(t=>h.includes(t)); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function hi(text,tk){ if(!tk.length||!text) return esc(text); const re=new RegExp("("+tk.map(reEsc).join("|")+")","gi");
  const out=[]; let last=0,m; while((m=re.exec(text))!==null){ if(m.index===re.lastIndex) re.lastIndex++;
    out.push(esc(text.slice(last,m.index)),"<mark>",esc(m[0]),"</mark>"); last=m.index+m[0].length; } out.push(esc(text.slice(last))); return out.join(""); }

function sorted(arr){ const a=[...arr];
  if(sort==="new") a.sort((x,y)=>y.order-x.order);
  else if(sort==="old") a.sort((x,y)=>x.order-y.order);
  else a.sort((x,y)=>x.title.toLowerCase()<y.title.toLowerCase()?-1:1);
  return a; }

function render(){
  const tk=tokenize(query);
  let shown=query?items.filter(it=>matches(it,tk)):items;
  shown=sorted(shown);
  countEl.textContent = query?`${shown.length} result${shown.length===1?"":"s"} for “${query}”` : `${items.length} links`;
  list.innerHTML=""; empty.style.display=shown.length?"none":"block";
  if(!shown.length) empty.textContent=`No bookmarks match “${query}”.`;
  shown.forEach(it=>{
    const li=document.createElement("li"); li.className="item"; li.dataset.id=it.id;
    if(editing===it.id){ renderEdit(li,it); list.appendChild(li); return; }
    const chips=it.labels.map(l=>`<span class="lchip">${esc(l)}</span>`).join("");
    const tr=it.toRead?`<span class="state toread">📖 To read</span>`:"";
    const noteHtml = it.note ? `<div class="note"><span class="lbl">My note</span>${hi(it.note,tk)}</div>` : "";
    li.innerHTML=`<div class="favicon">${it.emoji}</div>
      <div class="body">
        <p class="title"><a href="${it.url}" target="_blank" rel="noopener">${hi(it.title,tk)}</a></p>
        <p class="desc">${hi(it.desc,tk)}</p>
        ${noteHtml}
        <p class="meta">${esc(it.site)} · ${esc(it.host)}</p>
        <div class="badges">${tr}${chips}</div>
      </div><div class="actions"><button class="btn">Edit</button></div>`;
    li.querySelector(".btn").onclick=()=>{ editing=it.id; render(); };
    list.appendChild(li);
  });
}

function renderEdit(li,it){
  li.innerHTML=`<div class="favicon">${it.emoji}</div>
    <div style="flex:1">
      <label style="display:block;font-size:12px;color:var(--muted);margin:0 0 3px">Title</label>
      <input class="field t" value="${esc(it.title)}">
      <label style="display:block;font-size:12px;color:var(--muted);margin:8px 0 3px">Summary</label>
      <textarea class="field d" style="min-height:40px">${esc(it.desc)}</textarea>
      <label style="display:block;font-size:12px;color:var(--muted);margin:8px 0 3px">My note <span style="opacity:.7">— your own words, just for you</span></label>
      <textarea class="field n" style="min-height:52px" placeholder="Why did you save this? What's the good part?">${esc(it.note)}</textarea>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="done" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer">Done</button>
        <button class="cancel" style="background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:8px 6px">Cancel</button>
      </div>
    </div>`;
  li.querySelector(".t").focus();
  li.querySelector(".done").onclick=()=>{ const t=li.querySelector(".t").value.trim();
    if(t) it.title=t; it.desc=li.querySelector(".d").value.trim(); it.note=li.querySelector(".n").value.trim(); editing=null; render(); };
  li.querySelector(".cancel").onclick=()=>{ editing=null; render(); };
  li.querySelectorAll(".t,.d,.n").forEach(el=>el.addEventListener("keydown",e=>{ if(e.key==="Escape"){editing=null;render();} }));
}

const search=document.getElementById("search"), clrBtn=document.getElementById("clr");
search.addEventListener("input",()=>{ query=search.value.trim(); clrBtn.style.display=query?"block":"none"; render(); });
clrBtn.onclick=()=>{ search.value=""; query=""; clrBtn.style.display="none"; render(); };
document.getElementById("sort").addEventListener("change",e=>{ sort=e.target.value; render(); });
render();
</script>
</body>
</html>
