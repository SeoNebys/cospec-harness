<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <h1>📑 My Bookmarks</h1>
</header>

<nav class="tabs" id="tabs" aria-label="Views">
  <button class="tab" data-view="all" type="button">All</button>
  <button class="tab" data-view="later" type="button">Read later</button>
  <button class="tab" data-view="archive" type="button">Archive</button>
</nav>

<main>
  <section class="card" id="saveCard">
    <label class="fieldlabel" for="url">Paste a link to save</label>
    <div class="inline">
      <input type="url" id="url" placeholder="https://…" autocomplete="off" />
      <button class="btn primary" id="fetchBtn" type="button">Fetch details</button>
    </div>
    <p class="hint">Paste a link and its title &amp; description are filled in automatically.</p>

    <div class="dup" id="dupWarn" hidden>
      <p id="dupMsg"></p>
      <div class="inline">
        <button class="btn primary" id="dupEditBtn" type="button">Edit the saved bookmark</button>
        <button class="btn ghost" id="dupCancelBtn" type="button">Cancel</button>
      </div>
    </div>

    <form class="editor" id="editor" hidden>
      <div class="banner" id="editBanner" hidden>Editing an existing bookmark — your changes update it in place.</div>
      <div class="banner warn" id="failBanner" hidden>We couldn't fetch details automatically — add a title and save anyway.</div>

      <label class="fieldlabel" for="title">Title</label>
      <input type="text" id="title" placeholder="Title for this link" />

      <label class="fieldlabel" for="note">Short note (optional)</label>
      <textarea id="note" rows="2" placeholder="Why is this worth keeping?"></textarea>

      <label class="fieldlabel" for="tagInput">Tags (optional) — type a tag and press Enter</label>
      <input type="text" id="tagInput" placeholder="e.g. design, reference" />
      <div class="chips" id="tagChips"></div>

      <div class="inline actions">
        <button class="btn primary" id="saveBtn" type="submit">Save bookmark</button>
        <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
      </div>
    </form>
  </section>

  <section class="card">
    <label class="fieldlabel" for="search">Find a bookmark</label>
    <input type="text" id="search" placeholder="Search title, note, link or tag…" autocomplete="off" />
    <div class="chips filter" id="filterChips"></div>
    <p class="hint" id="activeFilter" hidden></p>
  </section>

  <section class="card">
    <h2 class="listheading" id="listHeading">Saved</h2>
    <div id="items"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
