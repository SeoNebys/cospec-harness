<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks — Opening approaches</title>
  <style>
    :root{--ink:#1d2925;--muted:#697772;--paper:#f7f5ef;--card:#fffdfa;--line:#dedbd1;--green:#286851;--green-soft:#e4efe8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 14% 5%,rgba(191,215,198,.36),transparent 27rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1080px,calc(100% - 48px));margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;height:88px;border-bottom:1px solid rgba(102,116,109,.18)}.brand{display:flex;align-items:center;gap:11px;font:700 22px/1 Georgia,serif}.brand-mark{display:grid;place-items:center;width:34px;height:34px;color:#fff;background:var(--green);border-radius:11px 11px 11px 4px}.switch{display:flex;gap:5px;padding:4px;background:#ebe9e1;border-radius:12px}.switch a{padding:8px 13px;color:var(--muted);border-radius:9px;font-size:13px;font-weight:800;text-decoration:none}.switch a.active{color:var(--ink);background:var(--card);box-shadow:0 2px 7px rgba(31,43,38,.09)}main{padding:56px 0 90px}.eyebrow{margin:0 0 9px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font:500 43px/1.08 Georgia,serif;letter-spacing:-.035em}.intro{margin:13px 0 37px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}h2{margin:0;font:600 24px/1.2 Georgia,serif}.count{color:var(--muted);font-size:14px}.list{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{display:grid;grid-template-columns:46px minmax(0,1fr) 22px;align-items:center;gap:14px;padding:18px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 16px rgba(45,56,50,.04);text-decoration:none;transition:.15s ease}.card:hover{border-color:#96b9aa;box-shadow:0 9px 24px rgba(45,56,50,.09);transform:translateY(-1px)}.icon{display:grid;place-items:center;width:44px;height:44px;color:var(--green);background:var(--green-soft);border-radius:12px;font:700 18px/1 Georgia,serif}.title{margin:0 0 4px;font-size:15px;font-weight:800}.url{margin:0 0 8px;color:var(--muted);font-size:13px}.chip{display:inline-block;padding:4px 8px;color:var(--green);background:var(--green-soft);border-radius:999px;font-size:11px;font-weight:800}.arrow{color:var(--muted);font-size:19px}@media(max-width:700px){.shell{width:min(100% - 28px,1080px)}header{height:auto;min-height:78px;gap:12px;flex-wrap:wrap;padding:12px 0}.list{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="brand-mark">B</span> Bookmarks</div><nav class="switch" aria-label="Opening approach"><a id="one" href="?approach=newtab">Approach 1</a><a id="two" href="?approach=sametab">Approach 2</a></nav></header><main><p class="eyebrow">Return to a saved page</p><h1>Open the link you came back for.</h1><p class="intro" id="intro"></p><div class="heading"><h2>Web development</h2><span class="count">2 bookmarks</span></div><section class="list"><a class="card" id="mdn" href="opened.html?bookmark=MDN%20Web%20Docs"><div class="icon">M</div><div><p class="title">MDN Web Docs</p><p class="url">developer.mozilla.org</p><span class="chip">Web development</span></div><span class="arrow">↗</span></a><a class="card" href="opened.html?bookmark=CSS-Tricks"><div class="icon">C</div><div><p class="title">CSS-Tricks</p><p class="url">css-tricks.com</p><span class="chip">Web development</span></div><span class="arrow">↗</span></a></section></main></div>
  <script>const approach=new URLSearchParams(location.search).get('approach')==='sametab'?'sametab':'newtab';document.querySelector(approach==='newtab'?'#one':'#two').classList.add('active');document.querySelector('#intro').textContent=approach==='newtab'?'The saved page opens separately, while your bookmark list stays where you left it.':'The saved page replaces the bookmark list, and the browser back action returns you to it.';if(approach==='newtab')document.querySelectorAll('.card').forEach(card=>{card.target='_blank';card.rel='noopener'});</script>
</body>
</html>
