<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Bookmarks</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1>My Bookmarks</h1>
      <p>Save a link, tag it, find it again.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="saver" aria-label="Save a link">
      <label for="saveUrl">Save a link</label>
      <div class="saver__row">
        <input id="saveUrl" type="text" inputmode="url" autocomplete="off"
               placeholder="Paste a link here, e.g. https://…" />
        <button id="saveBtn" class="btn btn--primary" type="button">Save</button>
      </div>
      <div id="saveFetching" class="saver__fetching" hidden>Reading the page details…</div>
      <div id="saveError" class="msg msg--err" hidden></div>
      <div id="saveInfo" class="msg msg--info" hidden></div>
    </section>

    <div class="searchbar">
      <input id="search" type="text" autocomplete="off"
             placeholder="Search title, address, description, tags, notes…" aria-label="Search bookmarks" />
    </div>

    <div id="tagBrowse" class="tag-browse" hidden>
      <span class="tag-browse__label">Browse by tag</span>
      <div id="tagFilters" class="tag-filters"></div>
    </div>

    <nav id="tabs" class="tabs" aria-label="Views"></nav>

    <div id="list" class="list" aria-live="polite"></div>
  </main>

  <script type="module" src="/js/app.mjs"></script>
</body>
</html>
