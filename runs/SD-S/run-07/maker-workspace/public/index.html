<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app">
      <header class="app-header">
        <h1>Bookmark Manager</h1>
        <p class="subtitle">Save, find, and organize your bookmarks.</p>
      </header>

      <section class="save-panel" aria-label="Save a bookmark">
        <form id="save-form" class="save-form" autocomplete="off">
          <div class="field">
            <label for="url-input">Web address</label>
            <input
              id="url-input"
              name="url"
              type="text"
              placeholder="https://example.com/article"
              required
            />
          </div>
          <div class="field">
            <label for="title-input">Title <span class="hint">(optional)</span></label>
            <input
              id="title-input"
              name="title"
              type="text"
              placeholder="Leave blank to fetch automatically"
            />
          </div>
          <div class="field">
            <label for="tags-input">Tags <span class="hint">(comma separated)</span></label>
            <input id="tags-input" name="tags" type="text" placeholder="work, reading" />
          </div>
          <button type="submit" id="save-btn">Save bookmark</button>
        </form>
        <p id="form-message" class="form-message" role="alert" hidden></p>
      </section>

      <section class="controls" aria-label="Find bookmarks">
        <input
          id="search-input"
          type="search"
          placeholder="Search by title or address…"
          aria-label="Search bookmarks"
        />
        <div id="tag-filters" class="tag-filters" aria-label="Filter by tag"></div>
      </section>

      <section class="list-panel" aria-label="Saved bookmarks">
        <ul id="bookmark-list" class="bookmark-list"></ul>
        <div id="empty-state" class="state-message" hidden>
          <p>No bookmarks yet. Save your first one above to get started.</p>
        </div>
        <div id="no-results" class="state-message" hidden>
          <p>No bookmarks match your search or filter.</p>
          <button type="button" id="clear-filters">Clear search &amp; filters</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
