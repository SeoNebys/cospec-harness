<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 2</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color:#111827; background:var(--bg); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; }
  .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:24px 20px 60px; }

  .adder { display:flex; gap:8px; margin-bottom:8px; }
  .adder input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
                 font-size:14px; background:#fff; }
  .adder button { padding:11px 18px; border:0; border-radius:8px; background:var(--accent);
                  color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .adder button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); font-size:12px; margin:0 0 10px 2px; }

  .flash { background:#fffbeb; border:1px solid #fde68a; color:var(--warn); font-size:13px;
           border-radius:8px; padding:10px 13px; margin:0 0 16px; display:none; }
  .flash.show { display:block; }

  .count { color:var(--muted); font-size:12px; text-transform:uppercase;
           letter-spacing:.05em; margin:12px 2px 10px; }

  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px;
            padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:box-shadow .15s, border-color .15s; }
  li.card:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); border-color:#c7d2fe; }
  li.card.fresh { animation: pop .5s ease; }
  li.card.pulse { animation: pulse 1.2s ease; }
  @keyframes pop { from { transform: translateY(-6px); opacity:0 } to { transform:none; opacity:1 } }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(37,99,235,0) } 30%{ box-shadow:0 0 0 4px rgba(37,99,235,.25); border-color:var(--accent) } }
  .title { font-size:15px; font-weight:600; margin:0; color:#111827; }
  .title .ext { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .desc.faded { color:var(--muted); font-style:italic; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block;
         font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .loading { color:var(--muted); font-style:italic; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>My Links</h1>
  <div class="sub">Your personal library of saved links</div>
</header>

<main>
  <div class="adder">
    <input id="url" type="text" placeholder="Paste a link here…" autocomplete="off">
    <button id="save" disabled>Save</button>
  </div>
  <p class="hint">Click any saved link to open the real page in a new tab.</p>

  <div class="flash" id="flash"></div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</main>

<script>
const KNOWN = {
  "stripe.com/blog/payment-api": { t:"Designing the Stripe Payments API",
    d:"How we think about API ergonomics, idempotency, and versioning at scale." },
  "nytimes.com/2026/travel/kyoto": { t:"36 Hours in Kyoto",
    d:"Temples at dawn, a tofu lunch, and where to find the quiet streets." },
  "wikipedia.org/wiki/Sourdough": { t:"Sourdough — Wikipedia",
    d:"Bread made by fermentation of dough using naturally occurring lactobacilli and yeast." },
};
function normalize(raw){ return raw.trim().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'').toLowerCase(); }
function fakeFetch(raw){
  const key = normalize(raw);
  // simulate an unreadable page
  if (key.includes("cant-read") || key.includes("noname")) return Promise.resolve({ fail:true });
  if (KNOWN[key]) return Promise.resolve(KNOWN[key]);
  const host = (key.split('/')[0]||'link').replace(/\.[a-z]+$/,'');
  const slug = (key.split('/').slice(1).join(' ').replace(/[-_]/g,' ')||'').trim();
  const t = slug ? (slug.charAt(0).toUpperCase()+slug.slice(1)).slice(0,70) : host+" page";
  return Promise.resolve({ t, d:"A page saved from "+host+"." });
}

let items = [
  { url:"https://wikipedia.org/wiki/Sourdough", title:KNOWN["wikipedia.org/wiki/Sourdough"].t, desc:KNOWN["wikipedia.org/wiki/Sourdough"].d },
  { url:"https://nytimes.com/2026/travel/kyoto", title:KNOWN["nytimes.com/2026/travel/kyoto"].t, desc:KNOWN["nytimes.com/2026/travel/kyoto"].d },
];

const list=document.getElementById('list'), input=document.getElementById('url'),
      btn=document.getElementById('save'), count=document.getElementById('count'), flash=document.getElementById('flash');

function host(u){ try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u; } }
function fullUrl(u){ return /^https?:\/\//.test(u) ? u : "https://"+u; }
function showFlash(msg){ flash.textContent=msg; flash.classList.add('show'); }
function hideFlash(){ flash.classList.remove('show'); }

function cardHtml(it,i,cls=''){
  if(it._loading) return `<li class="card fresh"><p class="loading">Reading the page to get its name…</p>
     <div class="url">${host(it.url)}</div></li>`;
  const title = it.failed
    ? `${host(it.url)}<span class="ext">· couldn't read the page name</span>`
    : `${it.title}<span class="ext">↗ open</span>`;
  const desc = it.failed
    ? `<p class="desc faded">We couldn't read this page's name. It's saved and will still open — you can rename it later.</p>`
    : `<p class="desc">${it.desc}</p>`;
  return `<li class="card ${cls}" data-i="${i}">
     <p class="title">${title}</p>${desc}
     <div class="url"><span class="fav">${host(it.url)[0]?.toUpperCase()||'•'}</span>${host(it.url)}</div></li>`;
}
function render(freshUrl, pulseIdx){
  count.textContent = items.length + (items.length===1?" link":" links");
  list.innerHTML = items.map((it,i)=> cardHtml(it,i, it.url===freshUrl?'fresh':(i===pulseIdx?'pulse':''))).join('');
  [...list.querySelectorAll('.card[data-i]')].forEach(el=>{
    el.addEventListener('click', ()=>{ const it=items[+el.dataset.i]; window.open(fullUrl(it.url),'_blank'); });
  });
}

input.addEventListener('input', ()=> btn.disabled = input.value.trim().length<4);
function save(){
  const url=input.value.trim(); if(url.length<4) return;
  const dupIdx = items.findIndex(it=> normalize(it.url)===normalize(url));
  if(dupIdx>-1){
    input.value=''; btn.disabled=true;
    showFlash("You already saved this one — here it is. (No duplicate was made.)");
    render(null, dupIdx);
    document.querySelectorAll('.card')[dupIdx]?.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  hideFlash(); input.value=''; btn.disabled=true;
  items.unshift({ url, _loading:true });
  render();
  fakeFetch(url).then(meta=>{
    items[0] = meta.fail ? { url, failed:true } : { url, title:meta.t, desc:meta.d };
    render(url);
  });
}
btn.addEventListener('click', save);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
render();
</script>
</body>
</html>
