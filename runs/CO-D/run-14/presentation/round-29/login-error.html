<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keepwell — Sign-in error prototype</title><style>
  :root{--ink:#1d2722;--muted:#647069;--line:#dce2dd;--paper:#fffef9;--wash:#f2f3ec;--green:#245f49;--dark:#194735;--red:#8a3d38;--redwash:#f7e9e6;--accent:#e6a34c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--wash);color:var(--ink);display:grid;place-items:center;padding:24px}button,input{font:inherit}.card{width:min(410px,100%);padding:34px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 42px rgba(35,56,45,.09)}.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:780;font-size:21px;margin-bottom:25px}.mark{width:25px;height:31px;border-radius:4px 4px 9px 9px;background:var(--green)}h1{margin:0;text-align:center;font:500 31px Georgia,serif}.sub{text-align:center;color:var(--muted);margin:8px 0 23px}.error{margin-bottom:17px;padding:12px 14px;border:1px solid #ebccc6;border-radius:10px;background:var(--redwash);color:#714944;font-size:14px;line-height:1.4}.error strong{display:block;margin-bottom:3px}label{display:block;margin:14px 0 7px;font-size:13px;font-weight:720}input{width:100%;border:1px solid #c8d0ca;border-radius:9px;padding:11px;background:white}input:focus{outline:3px solid rgba(230,163,76,.42);border-color:var(--accent)}.primary{width:100%;margin-top:19px;border:0;border-radius:9px;background:var(--green);color:white;padding:11px 14px;font-weight:700;cursor:pointer}.library{text-align:center}.library h1{margin-bottom:9px}.library p{color:var(--muted)}.library-card{margin-top:22px;padding:15px;border:1px solid var(--line);border-radius:12px;background:white;text-align:left}.library-card strong{display:block;margin-bottom:5px}.library-card span{font-size:13px;color:var(--muted)}[hidden]{display:none!important}
</style></head><body><main class="card" data-harness-ready="true"><form id="login"><div class="brand"><span class="mark"></span>Keepwell</div><h1>Welcome back</h1><p class="sub">Sign in to your personal library.</p><div class="error" id="error" role="alert" hidden><strong>We couldn’t sign you in</strong>Check your email and password, then try again.</div><label for="email">Email</label><input id="email" type="email" value="alex@example.com"><label for="password">Password</label><input id="password" type="password" value="wrong-password"><button class="primary">Sign in</button></form><section class="library" id="library" hidden><div class="brand"><span class="mark"></span>Keepwell</div><h1>Your library</h1><p>Welcome back, Alex.</p><div class="library-card"><strong>A local’s walking guide to Rome</strong><span>Your private bookmarks are ready.</span></div></section></main><script>
  const form=document.querySelector('#login'),email=document.querySelector('#email'),password=document.querySelector('#password'),error=document.querySelector('#error');form.addEventListener('submit',event=>{event.preventDefault();if(password.value!=='bookmarks'){error.hidden=false;password.value='';password.focus();return}form.hidden=true;document.querySelector('#library').hidden=false});
</script></body></html>
