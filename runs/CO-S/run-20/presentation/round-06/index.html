<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Bookmarks — prototype</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6f8;
      color: #1c1e21;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e3e5e8;
      padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: #65676b; font-size: 13px; }
    main { max-width: 720px; margin: 0 auto; padding: 24px; }
    .card {
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 15px; color: #444; }
    label { display: block; font-size: 13px; color: #444; margin: 12px 0 4px; }
    .hint { font-weight: 400; color: #8a8d91; }
    input[type=text], input[type=url], input[type=search], textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #ccd0d5;
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 52px; }
    .details { display: none; }
    .details.show { display: block; }
    .status { font-size: 12px; color: #8a8d91; margin-top: 6px; min-height: 16px; }
    .status.filled { color: #1a7f37; }
    button {
      margin-top: 16px;
      background: #2f6fed;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #255ad0; }
    button:disabled { background: #b7c2d6; cursor: default; }
    .search-wrap { position: relative; margin-bottom: 12px; }
    #search { padding-left: 34px; }
    .search-wrap::before {
      content: '🔍'; position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%); font-size: 13px; opacity: .6;
    }
    .list { list-style: none; margin: 0; padding: 0; }
    .item {
      display: flex;
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid #eceef0;
    }
    .item:first-child { border-top: none; }
    .favicon {
      width: 32px; height: 32px; border-radius: 6px; flex: 0 0 32px;
      background: #eaf0fb; color: #2f6fed;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; overflow: hidden;
    }
    .favicon img { width: 32px; height: 32px; display: block; }
    .body { flex: 1; min-width: 0; }
    .body a { color: #2f6fed; text-decoration: none; font-size: 15px; font-weight: 600; }
    .body a:hover { text-decoration: underline; }
    .desc { color: #3c4043; font-size: 13px; margin-top: 4px; }
    .note {
      color: #6a4b00; font-size: 13px; margin-top: 6px;
      background: #fff8e6; border-left: 3px solid #f0c040;
      padding: 6px 9px; border-radius: 4px;
    }
    .note .tag { font-weight: 600; opacity: .8; }
    .url { color: #65676b; font-size: 12px; margin-top: 6px; word-break: break-all; }
    .meta { color: #8a8d91; font-size: 12px; margin-top: 3px; }
    mark { background: #fff3b0; padding: 0 1px; border-radius: 2px; }
    .count { color: #65676b; font-size: 13px; margin: 0 0 12px; }
    .empty { text-align: center; color: #8a8d91; padding: 30px 10px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>My Bookmarks</h1>
    <p>Your personal place to save links and find them again.</p>
  </header>
  <main id="app">
    <section class="card">
      <h2>Save a link</h2>
      <form id="addForm" autocomplete="off">
        <label for="url">Link address</label>
        <input type="url" id="url" placeholder="Paste a link address here…" required />
        <div class="status" id="status"></div>

        <div class="details" id="details">
          <label for="title">Title</label>
          <input type="text" id="title" />
          <label for="desc">Description <span class="hint">(from the page)</span></label>
          <textarea id="desc"></textarea>
          <label for="note">Your note <span class="hint">(optional — your own words)</span></label>
          <textarea id="note" placeholder="Why you saved it, what to remember…"></textarea>
        </div>

        <button type="submit" id="saveBtn" disabled>Save</button>
      </form>
    </section>

    <section class="card">
      <h2>Saved links</h2>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Search title, description, your note, or address…" />
      </div>
      <p class="count" id="count"></p>
      <ul class="list" id="list"></ul>
    </section>
  </main>

  <script>
    const KEY = 'bm_proto_v4';
    const load = () => JSON.parse(localStorage.getItem(KEY) || 'null');
    const save = (items) => localStorage.setItem(KEY, JSON.stringify(items));

    // Sample collection, pre-loaded once. A few carry a personal note so that
    // searching your own notes (distinct from the page description) can be tried.
    const SEED = [
      { url: 'https://www.seriouseats.com/the-food-lab-perfect-roast-chicken', title: 'The Food Lab: Perfect Roast Chicken — Serious Eats', desc: 'A step-by-step method for a crisp-skinned, juicy roast chicken.', note: 'Try this for Sunday dinner — spatchcock method.', host: 'seriouseats.com' },
      { url: 'https://developer.mozilla.org/en-US/docs/Web/CSS/flexbox', title: 'CSS Flexbox Layout Guide — MDN', desc: 'Reference and examples for laying out elements with CSS flexbox.', note: '', host: 'developer.mozilla.org' },
      { url: 'https://www.nomadicmatt.com/travel-guides/portugal/', title: 'Portugal Travel Guide — Nomadic Matt', desc: 'Budget tips, itineraries, and things to do across Portugal.', note: 'For the trip in spring — read the Lisbon and Porto parts.', host: 'nomadicmatt.com' },
      { url: 'https://www.investopedia.com/terms/i/indexfund.asp', title: 'What Is an Index Fund? — Investopedia', desc: 'An explanation of index funds and how they work for long-term investing.', note: '', host: 'investopedia.com' },
      { url: 'https://overreacted.io/a-complete-guide-to-useeffect/', title: 'A Complete Guide to useEffect — overreacted.io', desc: 'A deep dive into the React useEffect hook and its mental model.', note: 'Re-read before refactoring the dashboard.', host: 'overreacted.io' },
      { url: 'https://www.bonappetit.com/recipe/basically-marinara-sauce', title: 'Basically Marinara Sauce — Bon Appétit', desc: 'A simple weeknight tomato sauce recipe with pantry ingredients.', note: '', host: 'bonappetit.com' },
      { url: 'https://www.nngroup.com/articles/usability-heuristics/', title: '10 Usability Heuristics for UI Design — NN/g', desc: 'Jakob Nielsen’s classic principles for interaction design.', note: '', host: 'nngroup.com' },
      { url: 'https://www.wikipedia.org/wiki/Compound_interest', title: 'Compound Interest — Wikipedia', desc: 'How compound interest works, with formulas and examples.', note: '', host: 'en.wikipedia.org' },
    ];

    function ensureSeed() {
      let items = load();
      if (items === null) {
        const base = Date.now() - SEED.length * 86400000;
        items = SEED.map((s, i) => ({ id: base + i, created: base + i * 86400000, ...s }));
        save(items);
      }
      return items;
    }

    const urlEl = document.getElementById('url');
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const noteEl = document.getElementById('note');
    const saveBtn = document.getElementById('saveBtn');
    const searchEl = document.getElementById('search');

    function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } }
    function titleCase(s) {
      return s.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\w/g, c => c.toUpperCase());
    }
    function deriveMeta(u) {
      const host = hostOf(u);
      let slug = '';
      try {
        const p = new URL(u).pathname.split('/').filter(Boolean).pop() || '';
        slug = decodeURIComponent(p).replace(/\.(html?|php|aspx)$/i, '');
      } catch {}
      const site = titleCase(host.split('.')[0] || 'Site');
      const title = slug ? titleCase(slug) + ' — ' + site : site;
      const desc = slug ? 'An article about ' + titleCase(slug).toLowerCase() + ', from ' + host + '.' : 'A page from ' + host + '.';
      return { host, title, desc };
    }

    let fillTimer = null;
    function tryAutofill() {
      const u = urlEl.value.trim();
      if (!urlEl.checkValidity() || !u) {
        detailsEl.classList.remove('show');
        statusEl.textContent = ''; statusEl.className = 'status';
        saveBtn.disabled = true; return;
      }
      statusEl.textContent = 'Reading the page details…'; statusEl.className = 'status';
      clearTimeout(fillTimer);
      fillTimer = setTimeout(() => {
        const m = deriveMeta(u);
        if (!titleEl.value) titleEl.value = m.title;
        if (!descEl.value) descEl.value = m.desc;
        detailsEl.classList.add('show');
        statusEl.textContent = 'Title and description filled in — edit them if you like.';
        statusEl.className = 'status filled';
        saveBtn.disabled = false;
      }, 500);
    }
    urlEl.addEventListener('input', tryAutofill);
    urlEl.addEventListener('paste', () => setTimeout(tryAutofill, 0));

    function faviconEl(host) {
      const wrap = document.createElement('div');
      wrap.className = 'favicon';
      wrap.textContent = (host[0] || '?').toUpperCase();
      if (host) {
        const img = document.createElement('img');
        img.src = 'https://www.google.com/s2/favicons?domain=' + host + '&sz=64';
        img.alt = '';
        img.onload = () => { wrap.textContent = ''; wrap.appendChild(img); };
      }
      return wrap;
    }
    function fmt(ts) {
      return new Date(ts).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function highlight(text, q) {
      if (!q) return esc(text);
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
    }

    function render() {
      const q = searchEl.value.trim();
      const all = (load() || []).sort((a, b) => b.created - a.created);
      const items = q
        ? all.filter(it => (it.title + ' ' + (it.desc || '') + ' ' + (it.note || '') + ' ' + it.url).toLowerCase().includes(q.toLowerCase()))
        : all;
      const list = document.getElementById('list');
      const count = document.getElementById('count');
      list.innerHTML = '';

      if (all.length === 0) {
        count.textContent = '';
        const li = document.createElement('li'); li.className = 'empty';
        li.textContent = 'No links saved yet. Paste a link above to save your first.';
        list.appendChild(li); return;
      }
      if (items.length === 0) {
        count.textContent = '';
        const li = document.createElement('li'); li.className = 'empty';
        li.textContent = 'No links match “' + q + '”.';
        list.appendChild(li); return;
      }
      count.textContent = q
        ? items.length + (items.length === 1 ? ' link matches' : ' links match')
        : all.length + (all.length === 1 ? ' link saved' : ' links saved');

      for (const it of items) {
        const li = document.createElement('li'); li.className = 'item';
        const body = document.createElement('div'); body.className = 'body';
        const a = document.createElement('a');
        a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
        a.innerHTML = highlight(it.title, q);
        body.appendChild(a);
        if (it.desc) { const d = document.createElement('div'); d.className = 'desc'; d.innerHTML = highlight(it.desc, q); body.appendChild(d); }
        if (it.note) {
          const n = document.createElement('div'); n.className = 'note';
          n.innerHTML = '<span class="tag">Note: </span>' + highlight(it.note, q);
          body.appendChild(n);
        }
        const url = document.createElement('div'); url.className = 'url'; url.innerHTML = highlight(it.url, q);
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = 'Saved ' + fmt(it.created);
        body.append(url, meta);
        li.append(faviconEl(it.host || hostOf(it.url)), body);
        list.appendChild(li);
      }
    }

    searchEl.addEventListener('input', render);

    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const url = urlEl.value.trim();
      const title = titleEl.value.trim() || hostOf(url);
      const desc = descEl.value.trim();
      const note = noteEl.value.trim();
      if (!url) return;
      const items = load() || [];
      items.push({ id: Date.now(), url, title, desc, note, host: hostOf(url), created: Date.now() });
      save(items);
      e.target.reset();
      detailsEl.classList.remove('show');
      statusEl.textContent = ''; statusEl.className = 'status';
      saveBtn.disabled = true;
      urlEl.focus();
      render();
    });

    ensureSeed();
    render();
    document.getElementById('app').setAttribute('data-harness-ready', 'true');
  </script>
</body>
</html>
