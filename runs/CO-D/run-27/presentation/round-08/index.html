<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — prototype</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2f6feb; --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 16px 8px; max-width: 820px; margin: 0 auto; }
  header h1 { font-size: 22px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 60px; }

  .saver { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  .saver input[type=url] { flex: 1 1 260px; min-width: 0; padding: 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 9px; outline: none; }
  .saver input[type=url]:focus { border-color: var(--accent); }
  .saver button { padding: 12px 18px; font-size: 15px; font-weight: 600; border: none; border-radius: 9px; background: var(--accent); color: var(--accent-ink); cursor: pointer; flex: 0 0 auto; }
  .saver button:active { transform: translateY(1px); }

  .searchbar { display: flex; gap: 8px; margin: 0 0 6px; }
  .searchbar input[type=search] { flex: 1 1 auto; min-width: 0; padding: 11px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 9px; outline: none; background: #fff; }
  .searchbar input[type=search]:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin: 0 2px 12px; }
  .hint code { background: #eef2ff; border: 1px solid #dbe4ff; border-radius: 5px; padding: 1px 5px; font-size: 11px; }
  .count { color: var(--muted); font-size: 13px; margin: 0 2px 10px; }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px; }
  li.item.flash-existing { outline: 2px solid var(--accent); outline-offset: 1px; }
  .thumb { width: 92px; height: 62px; flex: 0 0 auto; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--line); }
  .item .body { min-width: 0; flex: 1 1 auto; }
  .item .titleRow { display: flex; align-items: center; gap: 7px; }
  .item .fav { width: 18px; height: 18px; border-radius: 4px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; }
  .item .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .desc { font-size: 13px; color: #374151; margin: 3px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .url { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .actions { margin-top: 6px; }
  .item .actions button { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 2px 0; font-weight: 600; }
  .item a.open { color: inherit; text-decoration: none; }
  .item a.open:hover .title { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--line); border-radius: 12px; background: var(--card); }
  .empty .big { font-size: 32px; margin-bottom: 8px; }

  .flash { border-radius: 9px; font-size: 14px; margin-bottom: 12px; padding: 10px 12px; display: none; }
  .flash.ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
  .flash.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .overlay.show { display: flex; }
  .modal { background: var(--card); border-radius: 14px; width: 100%; max-width: 460px; box-shadow: 0 20px 50px rgba(0,0,0,.25); overflow: hidden; }
  .modal .head { padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 15px; }
  .modal .pad { padding: 16px; }
  .loading { text-align: center; color: var(--muted); padding: 34px 16px; }
  .spinner { width: 26px; height: 26px; border: 3px solid #e5e7eb; border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .previewImg { width: 100%; height: 150px; border-radius: 10px; background-size: cover; background-position: center; border: 1px solid var(--line); margin-bottom: 12px; }
  .fieldLabel { font-size: 12px; color: var(--muted); margin: 10px 0 4px; display: flex; align-items: center; gap: 6px; }
  .fieldLabel .fav { width: 16px; height: 16px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 700; }
  .modal input[type=text], .modal textarea { width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 9px; outline: none; font-family: inherit; }
  .modal input[type=text]:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { resize: vertical; min-height: 62px; }
  .modal .mErr { color: #b91c1c; font-size: 13px; margin-top: 8px; min-height: 1px; }
  .modal .foot { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .modal .foot button { padding: 10px 16px; font-size: 14px; font-weight: 600; border-radius: 9px; cursor: pointer; }
  .btn-primary { border: none; background: var(--accent); color: #fff; }
  .btn-ghost { border: 1px solid var(--line); background: #fff; color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Your one place to save and find links.</p>
</header>
<main>
  <form class="saver" id="saver" autocomplete="off">
    <input type="url" id="urlInput" placeholder="Paste a link here…  e.g. https://en.wikipedia.org/wiki/Bookmark" required />
    <button type="submit">Save</button>
  </form>
  <div class="searchbar">
    <input type="search" id="searchInput" placeholder="Search your saved links…" autocomplete="off" />
  </div>
  <p class="hint">Tip: search matches title, description and address. Combine words with
    <code>AND</code>, <code>OR</code>, <code>NOT</code>, group with <code>( )</code>,
    or wrap an exact phrase in <code>"quotes"</code>.</p>

  <div class="flash" id="flash"></div>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="head" id="modalHead">Review &amp; save</div>
    <div class="loading" id="loadingBox">
      <div class="spinner"></div>
      <div>Fetching page details…</div>
    </div>
    <div class="pad" id="formBox" style="display:none">
      <div class="previewImg" id="mPreview"></div>
      <div class="fieldLabel"><span class="fav" id="mFav"></span> Title</div>
      <input type="text" id="mTitle" />
      <div class="fieldLabel">Description</div>
      <textarea id="mDesc"></textarea>
      <div class="fieldLabel">Address</div>
      <input type="text" id="mUrl" />
      <div class="mErr" id="mErr"></div>
    </div>
    <div class="foot" id="footBox" style="display:none">
      <button class="btn-ghost" id="mCancel">Cancel</button>
      <button class="btn-primary" id="mSave">Save bookmark</button>
    </div>
  </div>
</div>

<script>
  var STORE = "bm_proto_v2";
  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { return []; } }
  function persist(items) { localStorage.setItem(STORE, JSON.stringify(items)); }

  function isValidWebUrl(s) {
    try { var u = new URL(s.trim()); return (u.protocol === "http:" || u.protocol === "https:") && !!u.hostname; }
    catch (e) { return false; }
  }

  // "Same link" rule: lower-case only the scheme and host (which are
  // case-insensitive) and drop a harmless trailing slash. Keep the path and
  // query exactly as typed; keep http vs https and www vs non-www distinct.
  function normalize(url) {
    var raw = url.trim();
    try {
      var u = new URL(raw);
      var path = u.pathname.replace(/\/+$/, "");
      return u.protocol.toLowerCase() + "//" + u.hostname.toLowerCase() +
        (u.port ? ":" + u.port : "") + path + u.search;
    } catch (e) {
      return raw.replace(/\/+$/, "");
    }
  }

  var PALETTE = ["#2f6feb","#e0447a","#16a34a","#d97706","#7c3aed","#0891b2","#dc2626","#4f46e5"];
  function colorFor(host) { var s = 0; for (var i=0;i<host.length;i++) s += host.charCodeAt(i); return PALETTE[s % PALETTE.length]; }

  function svgPreview(label, color) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + color + '"/>' +
      '<stop offset="1" stop-color="#111827"/></linearGradient></defs>' +
      '<rect width="600" height="360" fill="url(#g)"/>' +
      '<text x="30" y="330" font-family="sans-serif" font-size="26" fill="rgba(255,255,255,.9)">' + label + '</text>' +
      '<text x="30" y="70" font-family="sans-serif" font-size="20" fill="rgba(255,255,255,.5)">preview</text>' +
      '</svg>';
    return "url('data:image/svg+xml;utf8," + encodeURIComponent(svg) + "')";
  }

  // Simulated metadata retrieval. Pre-loaded details for a few example sites,
  // with a sensible fallback so any pasted link demonstrates the flow.
  var CATALOG = {
    "en.wikipedia.org": { site: "Wikipedia", desc: "Free encyclopedia article. In-depth background, history, and references on the topic." },
    "github.com":       { site: "GitHub",    desc: "Source code repository with README, issues, and release notes for the project." },
    "www.youtube.com":  { site: "YouTube",   desc: "Online video. Watch, save to playlists, and pick up where you left off." },
    "youtube.com":      { site: "YouTube",   desc: "Online video. Watch, save to playlists, and pick up where you left off." },
    "www.nytimes.com":  { site: "The New York Times", desc: "News article with reporting and analysis from The New York Times." },
    "medium.com":       { site: "Medium",    desc: "Long-form article and personal essay published on Medium." },
    "developer.mozilla.org": { site: "MDN Web Docs", desc: "Reference documentation and guides for web platform technologies." }
  };
  function titleize(seg) {
    seg = decodeURIComponent(seg).replace(/\.[a-z0-9]+$/i, "").replace(/[-_]+/g, " ").trim();
    return seg.split(" ").map(function (w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : w; }).join(" ");
  }
  function fakeFetch(url) {
    var host, path = "";
    try { var u = new URL(url); host = u.hostname; path = u.pathname; }
    catch (e) { host = url.replace(/^https?:\/\//, "").split("/")[0]; }
    var bareHost = host.replace(/^www\./, "");
    var cat = CATALOG[host] || CATALOG[bareHost];
    var site = cat ? cat.site : (bareHost.split(".")[0].charAt(0).toUpperCase() + bareHost.split(".")[0].slice(1));
    var seg = path.split("/").filter(Boolean).pop();
    var topic = seg ? titleize(seg) : site + " home";
    var title = seg ? (topic + " — " + site) : (site + " — home page");
    var desc = cat ? cat.desc.replace("the topic", topic) : ("A page on " + bareHost + " about " + topic + ".");
    var color = colorFor(bareHost);
    return {
      title: title,
      description: desc,
      icon: { letter: site.charAt(0).toUpperCase(), color: color },
      preview: { label: site, color: color }
    };
  }

  // ---- search query language ----
  // Supports quoted phrases ("..."), AND / OR / NOT operators, parentheses for
  // grouping, and implicit AND between adjacent terms. Words are matched
  // case-insensitively as substrings across a bookmark's searchable text.
  // Operator words only act as operators when unquoted; "and" in quotes is literal.
  var currentQuery = "";
  function hayFor(it) { return (it.title + " " + it.description + " " + it.url).toLowerCase(); }

  function tokenize(s) {
    var toks = [], i = 0, n = s.length;
    while (i < n) {
      var c = s[i];
      if (c === " " || c === "\t") { i++; continue; }
      if (c === "(") { toks.push({ type: "LP" }); i++; continue; }
      if (c === ")") { toks.push({ type: "RP" }); i++; continue; }
      if (c === '"') {
        var j = i + 1, buf = "";
        while (j < n && s[j] !== '"') { buf += s[j]; j++; }
        i = (j < n) ? j + 1 : j;
        if (buf.trim().length) toks.push({ type: "TERM", value: buf.toLowerCase() });
        continue;
      }
      var k = i, w = "";
      while (k < n && s[k] !== " " && s[k] !== "\t" && s[k] !== "(" && s[k] !== ")" && s[k] !== '"') { w += s[k]; k++; }
      i = k;
      if (!w.length) continue;
      var up = w.toUpperCase();
      if (up === "AND") toks.push({ type: "AND" });
      else if (up === "OR") toks.push({ type: "OR" });
      else if (up === "NOT") toks.push({ type: "NOT" });
      else toks.push({ type: "TERM", value: w.toLowerCase() });
    }
    return toks;
  }

  function compileQuery(input) {
    var tokens = tokenize(input), pos = 0;
    function peek() { return tokens[pos]; }
    function atom() {
      var t = peek();
      if (!t) return null;
      if (t.type === "LP") { pos++; var e = parseOr(); if (peek() && peek().type === "RP") pos++; return e; }
      if (t.type === "RP") return null;
      if (t.type === "AND" || t.type === "OR") { pos++; return atom(); } // stray operator: skip
      if (t.type === "NOT") { pos++; var a = atom(); return a ? function (h) { return !a(h); } : null; }
      pos++; var term = t.value; return function (h) { return h.indexOf(term) >= 0; };
    }
    function parseAnd() {
      var left = atom();
      while (peek()) {
        var t = peek();
        if (t.type === "RP" || t.type === "OR") break;
        if (t.type === "AND") pos++;
        var right = atom();
        if (right) { var l = left, r = right; left = l ? function (h) { return l(h) && r(h); } : r; }
      }
      return left;
    }
    function parseOr() {
      var left = parseAnd();
      while (peek() && peek().type === "OR") {
        pos++; var right = parseAnd();
        if (right) { var l = left, r = right; left = l ? function (h) { return l(h) || r(h); } : r; }
      }
      return left;
    }
    return parseOr();
  }

  function buildMatcher(raw) {
    try { var m = compileQuery(raw); if (m) return m; } catch (e) {}
    var t = raw.toLowerCase();
    return function (h) { return h.indexOf(t) >= 0; };
  }

  // ---- rendering ----
  function render(highlightId) {
    var all = load();
    var raw = currentQuery.trim();
    var matcher = raw ? buildMatcher(raw) : null;
    var items = matcher ? all.filter(function (it) { return matcher(hayFor(it)); }) : all;
    var list = document.getElementById("list");
    var count = document.getElementById("count");
    list.innerHTML = "";
    if (all.length === 0) {
      count.textContent = "";
      list.innerHTML = '<div class="empty"><div class="big">🔖</div>Nothing saved yet. Paste a link above and press Save.</div>';
      return;
    }
    if (items.length === 0) {
      count.textContent = "";
      list.innerHTML = '<div class="empty"><div class="big">🔍</div><span id="noRes"></span></div>';
      document.getElementById("noRes").textContent = "No saved links match “" + raw + "”.";
      return;
    }
    count.textContent = raw ? (items.length + " of " + all.length + " links match")
                            : (all.length + (all.length === 1 ? " saved link" : " saved links"));
    items.forEach(function (it) {
      var li = document.createElement("li");
      li.className = "item" + (it.id === highlightId ? " flash-existing" : "");
      li.innerHTML =
        '<div class="thumb"></div>' +
        '<div class="body">' +
          '<a class="open" href="' + it.url + '" target="_blank" rel="noopener">' +
            '<div class="titleRow"><span class="fav"></span><span class="title"></span></div>' +
            '<p class="desc"></p>' +
            '<div class="url"></div>' +
          '</a>' +
          '<div class="actions"><button data-edit="' + it.id + '">Edit</button></div>' +
        '</div>';
      li.querySelector(".thumb").style.backgroundImage = svgPreview(it.preview.label, it.preview.color);
      var fav = li.querySelector(".fav");
      fav.textContent = it.icon.letter; fav.style.background = it.icon.color;
      li.querySelector(".title").textContent = it.title;
      li.querySelector(".desc").textContent = it.description;
      li.querySelector(".url").textContent = it.url;
      list.appendChild(li);
    });
    list.querySelectorAll("button[data-edit]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-edit");
        var item = load().filter(function (x) { return x.id === id; })[0];
        if (item) openEditExisting(item);
      });
    });
  }

  function flash(msg, kind) {
    var f = document.getElementById("flash");
    f.className = "flash " + (kind || "ok");
    f.textContent = msg;
    f.style.display = "block";
    clearTimeout(f._t);
    f._t = setTimeout(function () { f.style.display = "none"; }, 3200);
  }

  // ---- modal / editor ----
  var overlay = document.getElementById("overlay");
  var editState = { mode: null, id: null, url: null, meta: null };

  function showModal() { overlay.classList.add("show"); }
  function hideModal() { overlay.classList.remove("show"); }
  function showLoading() {
    document.getElementById("modalHead").textContent = "Review & save";
    document.getElementById("loadingBox").style.display = "block";
    document.getElementById("formBox").style.display = "none";
    document.getElementById("footBox").style.display = "none";
    showModal();
  }
  function fillForm(headText, meta, url) {
    document.getElementById("modalHead").textContent = headText;
    document.getElementById("loadingBox").style.display = "none";
    document.getElementById("formBox").style.display = "block";
    document.getElementById("footBox").style.display = "flex";
    document.getElementById("mPreview").style.backgroundImage = svgPreview(meta.preview.label, meta.preview.color);
    var fav = document.getElementById("mFav");
    fav.textContent = meta.icon.letter; fav.style.background = meta.icon.color;
    document.getElementById("mTitle").value = meta.title;
    document.getElementById("mDesc").value = meta.description;
    document.getElementById("mUrl").value = url;
    document.getElementById("mErr").textContent = "";
  }

  function openAddFlow(url) {
    showLoading();
    setTimeout(function () {
      var meta = fakeFetch(url);
      editState = { mode: "new", id: null, url: url, meta: meta };
      fillForm("Review & save", meta, url);
      document.getElementById("mTitle").focus();
    }, 650);
  }

  function openEditExisting(item) {
    editState = { mode: "edit", id: item.id, url: item.url,
      meta: { title: item.title, description: item.description, icon: item.icon, preview: item.preview } };
    fillForm("Edit bookmark", editState.meta, item.url);
    showModal();
  }

  document.getElementById("mCancel").addEventListener("click", hideModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) hideModal(); });

  document.getElementById("mSave").addEventListener("click", function () {
    var title = document.getElementById("mTitle").value.trim();
    var desc = document.getElementById("mDesc").value.trim();
    var url = document.getElementById("mUrl").value.trim();
    var errBox = document.getElementById("mErr");
    errBox.textContent = "";
    if (!url) { errBox.textContent = "Please enter a web address."; return; }
    if (!isValidWebUrl(url)) {
      errBox.textContent = "That doesn't look like a valid web link. It should start with http:// or https://";
      return;
    }
    var norm = normalize(url);
    var items = load();

    // Guard: the corrected address must not collide with a different saved link.
    var clash = items.filter(function (x) { return x.norm === norm && x.id !== editState.id; })[0];
    if (clash) {
      errBox.textContent = "Another saved bookmark already uses this address (“" + clash.title + "”).";
      return;
    }

    if (editState.mode === "new") {
      items.unshift({
        id: "b" + Date.now(),
        url: url,
        norm: norm,
        title: title || editState.meta.title,
        description: desc,
        icon: editState.meta.icon,
        preview: editState.meta.preview,
        savedAt: Date.now()
      });
      persist(items);
      hideModal();
      render();
      flash("Saved “" + (title || editState.meta.title) + "”.", "ok");
    } else {
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === editState.id) {
          items[i].title = title || items[i].title;
          items[i].description = desc;
          items[i].url = url;
          items[i].norm = norm;
        }
      }
      persist(items);
      hideModal();
      render(editState.id);
      flash("Changes saved.", "ok");
    }
  });

  document.getElementById("saver").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("urlInput");
    var url = input.value.trim();
    if (!url) return;
    var norm = normalize(url);
    var existing = load().filter(function (x) { return x.norm === norm; })[0];
    if (existing) {
      input.value = "";
      flash("You already saved this link — opening it so you can edit.", "info");
      render(existing.id);
      openEditExisting(existing);
      var el = document.querySelector(".flash-existing");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    input.value = "";
    openAddFlow(url);
  });

  document.getElementById("searchInput").addEventListener("input", function (e) {
    currentQuery = e.target.value;
    render();
  });

  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
