<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved copy — My Links</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --amber:#b45309; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:#f2f2f4; display:flex; flex-direction:column; }
  .bar { background:#fff; border-bottom:1px solid var(--line); padding:12px 18px; display:flex; align-items:center; gap:12px; }
  .bar .t { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .s { color:var(--muted); font-size:12px; }
  .bar a.live { margin-left:auto; font-size:13px; color:var(--accent); text-decoration:none; border:1px solid #c7d2fe; padding:6px 11px; border-radius:8px; }
  .snapnote { background:#fffbeb; border-bottom:1px solid #fde68a; color:var(--amber); font-size:13px; padding:9px 18px; }
  .wrap { flex:1; min-height:0; display:flex; }
  iframe { flex:1; border:0; width:100%; height:100%; background:#fff; }
  .reader { max-width:720px; margin:0 auto; padding:30px 40px; background:#fff; }
  .msg { margin:auto; color:var(--muted); padding:40px; text-align:center; }
</style>
</head>
<body>
  <div class="bar">
    <span class="t" id="t">Saved copy</span><span class="s" id="s"></span>
    <a class="live" id="live" target="_blank" rel="noopener">Open live page ↗</a>
  </div>
  <div class="snapnote" id="note" style="display:none"></div>
  <div class="wrap" id="wrap"><div class="msg" id="msg">Loading your saved copy…</div></div>
<script type="module" src="viewer.js"></script>
</body>
</html>
