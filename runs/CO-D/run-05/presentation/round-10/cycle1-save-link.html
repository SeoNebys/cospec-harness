<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — prototype</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1c2330;
    --muted: #6b7480;
    --line: #e6e9ee;
    --accent: #2f6df6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .saver {
    display: flex; gap: 10px; margin-bottom: 8px;
  }
  .saver input {
    flex: 1; padding: 13px 15px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    outline: none;
  }
  .saver input:focus { border-color: var(--accent); }
  .saver button {
    padding: 0 20px; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
  }
  .saver button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 26px; }

  .count { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start;
  }
  .favicon {
    width: 32px; height: 32px; border-radius: 8px; flex: none;
    background: #eef1f6; display: grid; place-items: center; font-size: 16px;
    overflow: hidden;
  }
  .favicon img { width: 100%; height: 100%; object-fit: cover; }
  .body { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: 15.5px; margin: 0 0 2px; }
  .title a { color: var(--ink); text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .desc { color: var(--muted); font-size: 13.5px; margin: 0 0 5px;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--muted); font-size: 12.5px; }

  li.resolving { color: var(--muted); }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Paste a link. It sorts itself out.</p>

    <div class="saver">
      <input id="url" type="text" placeholder="Paste a link and press Save…" autocomplete="off">
      <button id="save">Save</button>
    </div>
    <p class="hint">Try pasting something like <code>https://www.nytimes.com/…/best-pasta-recipes.html</code> — or any real link you have.</p>

    <p class="count" id="count"></p>
    <ul id="list"></ul>
    <div class="empty" id="empty">Nothing saved yet. Paste your first link above.</div>
  </div>

<script>
// --- Prototype-only simulation of "figuring out the page" -------------------
// A real version fetches the page and reads its title/description. Here we
// simulate that resolution so the *behaviour* can be judged.
const KNOWN = {
  "nytimes.com":      { site: "The New York Times", emoji: "🗞️" },
  "cooking.nytimes.com": { site: "NYT Cooking", emoji: "🍝" },
  "github.com":       { site: "GitHub", emoji: "🐙" },
  "youtube.com":      { site: "YouTube", emoji: "▶️" },
  "wikipedia.org":    { site: "Wikipedia", emoji: "📚" },
  "medium.com":       { site: "Medium", emoji: "✍️" },
  "arxiv.org":        { site: "arXiv", emoji: "📄" },
  "bbc.com":          { site: "BBC", emoji: "📰" },
  "stackoverflow.com":{ site: "Stack Overflow", emoji: "💬" },
};

function titleCase(s) {
  return s.replace(/[-_]+/g, " ").replace(/\.[a-z]{2,4}$/i, "").trim()
          .replace(/\s+/g, " ")
          .replace(/\b\w/g, c => c.toUpperCase());
}

function resolve(rawUrl) {
  let url;
  try { url = new URL(rawUrl.includes("://") ? rawUrl : "https://" + rawUrl); }
  catch { return null; }
  const host = url.hostname.replace(/^www\./, "");
  const key = Object.keys(KNOWN).find(k => host === k || host.endsWith("." + k)) || host;
  const known = KNOWN[key] || { site: titleCase(host.split(".")[0]), emoji: "🔖" };

  // Derive a readable title from the last meaningful path segment.
  const seg = url.pathname.split("/").filter(Boolean).pop() || "";
  let title = seg ? titleCase(decodeURIComponent(seg)) : known.site + " — home";
  if (title.length > 70) title = title.slice(0, 67) + "…";

  const desc = "A page on " + known.site + ". (In the real app this line shows the page's own summary.)";
  return { url: url.href, host, site: known.site, emoji: known.emoji, title, desc };
}

// --- List rendering ---------------------------------------------------------
const list = document.getElementById("list");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");
const items = [];

function render() {
  list.innerHTML = "";
  empty.style.display = items.length ? "none" : "block";
  countEl.textContent = items.length ? items.length + (items.length === 1 ? " link saved" : " links saved") : "";
  for (const it of items) {
    const li = document.createElement("li");
    li.className = "item";
    li.innerHTML = `
      <div class="favicon">${it.emoji}</div>
      <div class="body">
        <p class="title"><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a></p>
        <p class="desc">${it.desc}</p>
        <p class="meta">${it.site} · ${it.host}</p>
      </div>`;
    list.appendChild(li);
  }
}

function showResolving() {
  empty.style.display = "none";
  const li = document.createElement("li");
  li.className = "item resolving";
  li.innerHTML = `<div class="favicon"><div class="spinner"></div></div>
    <div class="body"><p class="title">Figuring out this page…</p>
    <p class="meta">Reading the title and summary for you</p></div>`;
  list.insertBefore(li, list.firstChild);
  return li;
}

const input = document.getElementById("url");
const btn = document.getElementById("save");

function save() {
  const raw = input.value.trim();
  if (!raw) return;
  const resolved = resolve(raw);
  if (!resolved) { alert("That doesn't look like a link yet."); return; }
  input.value = "";
  const placeholder = showResolving();
  // Simulate the short moment of fetching the page.
  setTimeout(() => {
    placeholder.remove();
    items.unshift(resolved);
    render();
  }, 850);
}

btn.addEventListener("click", save);
input.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
render();
</script>
</body>
</html>
