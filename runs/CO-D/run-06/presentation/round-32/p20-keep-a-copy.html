<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 20 (keep a copy)</title>
<style>
  :root{--line:#e2e2e6;--muted:#6b6b72;--accent:#3b5bdb;--bg:#f7f7f9;--note:#8a6d00;--notebg:#fff8e1;--dead:#c0392b}
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:#1a1a1e}
  .wrap{max-width:680px;margin:0 auto;padding:22px 20px 80px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .switch{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .switch button{border:1px solid var(--line);background:#fff;color:#333;border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer}
  .switch button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .styleName{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.55}
  .styleName b{color:#1a1a1e} .tradeoff{margin-top:6px;font-size:12.5px}
  .good{color:#1a7f37} .bad{color:#b54708}

  .deadbar{background:#fdecea;border:1px solid #f5c6c0;color:var(--dead);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
  .deadbar .actions{display:flex;gap:6px}
  .deadbar button{border:1px solid #e6a9a2;background:#fff;color:var(--dead);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer}

  .copy{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .copyhead{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;background:#fafafb}
  .copyhead .tag{background:#eef0f4;border-radius:10px;padding:2px 9px}
  .note{font-size:14px;color:var(--note);background:var(--notebg);border-bottom:1px solid #f0e2a8;padding:10px 14px}
  .body{padding:16px 18px}

  /* A: readable */
  .article h2{font-size:19px;margin:0 0 8px} .article p{font-size:14.5px;line-height:1.6;color:#2c2c33;margin:0 0 12px}
  .article .hero{width:100%;height:150px;border-radius:8px;background:linear-gradient(135deg,#f08c00,#00000022);margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  /* B: snapshot */
  .snap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .snap .shot{height:300px;background:repeating-linear-gradient(0deg,#fbfbfd,#fbfbfd 26px,#f1f2f6 26px,#f1f2f6 27px);position:relative}
  .snap .shot .hd{height:52px;background:linear-gradient(135deg,#f08c00,#e8590c);display:flex;align-items:center;padding:0 16px;color:#fff;font-weight:700}
  .snap .shot .ph-img{position:absolute;top:70px;left:16px;width:180px;height:110px;background:#dfe3ee;border-radius:6px}
  /* C: external */
  .ext{text-align:center;padding:8px 0}
  .ext .big{font-size:26px} .ext p{font-size:14px;color:#3a3a42} .ext a{color:var(--accent);font-weight:600;text-decoration:none}
  .ext .disc{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Simplest Brothy Beans and Rice</h1>
  <p class="sub">smittenkitchen.com/beans · saved 6 months ago</p>

  <div class="deadbar">
    <span>⚠ The original page didn't load — it may be gone. But you kept a copy.</span>
    <span class="actions"><button>Try original again</button></span>
  </div>

  <div class="switch">
    <button data-v="A" class="on">A — Readable copy</button>
    <button data-v="B">B — Full page snapshot</button>
    <button data-v="C">C — Archived elsewhere</button>
  </div>
  <div class="styleName" id="styleName"></div>

  <div class="copy" id="copy"></div>
</div>

<script>
  const el=id=>document.getElementById(id);
  const copy=el("copy"), styleName=el("styleName");
  let v="A";
  const DESC={
    A:"<b>A — Readable copy.</b> At save time the app keeps the page's text and main images in a clean reading view, and your note rides on top."+
       "<div class='tradeoff'><span class='good'>+ Light, robust, searchable; survives almost anything; recipes/articles keep perfectly.</span><br><span class='bad'>– Loses the exact layout and any interactive bits (calculators, embedded video).</span></div>",
    B:"<b>B — Full page snapshot.</b> The app keeps a picture of the whole page exactly as it looked."+
       "<div class='tradeoff'><span class='good'>+ Looks exactly like the original; nothing about the layout is lost.</span><br><span class='bad'>– Heavy to store; can't capture pages behind a login/paywall; not really searchable (it's an image).</span></div>",
    C:"<b>C — Archived elsewhere.</b> The app doesn't store the page itself — it points you to a public archived copy on the web (if one exists), and always keeps your note."+
       "<div class='tradeoff'><span class='good'>+ Almost no storage; nothing heavy for the app to do.</span><br><span class='bad'>– Not truly YOURS; depends on someone else having archived it and staying online — so it can also vanish.</span></div>"
  };

  function render(){
    styleName.innerHTML=DESC[v];
    if(v==="A"){
      copy.innerHTML=
        '<div class="copyhead"><span>Your saved copy · readable</span><span class="tag">kept by the app</span></div>'+
        '<div class="note"><b>My note:</b> Needs double the garlic. Great with crusty bread.</div>'+
        '<div class="body article">'+
          '<div class="hero">[ saved photo ]</div>'+
          '<h2>Simplest Brothy Beans and Rice</h2>'+
          '<p>A weeknight one-pot dinner: creamy beans simmered with garlic, herbs, and a parmesan rind until the broth turns silky, then spooned over rice.</p>'+
          '<p><b>Ingredients:</b> 2 cans white beans, 4 cloves garlic, olive oil, a parmesan rind, rice, salt.</p>'+
          '<p><b>Method:</b> Warm the oil, soften the garlic, add beans and their liquid plus the rind, simmer 25 minutes, season, and serve over rice.</p>'+
        '</div>';
    } else if(v==="B"){
      copy.innerHTML=
        '<div class="copyhead"><span>Your saved copy · full snapshot</span><span class="tag">kept by the app</span></div>'+
        '<div class="note"><b>My note:</b> Needs double the garlic. Great with crusty bread.</div>'+
        '<div class="body"><div class="snap"><div class="shot"><div class="hd">smitten kitchen</div><div class="ph-img"></div></div></div></div>';
    } else {
      copy.innerHTML=
        '<div class="copyhead"><span>No copy stored by the app</span><span class="tag">external</span></div>'+
        '<div class="note"><b>My note:</b> Needs double the garlic. Great with crusty bread.</div>'+
        '<div class="body ext"><div class="big">🌐</div>'+
          '<p>We didn\'t keep this one ourselves, but an archived version exists:</p>'+
          '<p><a href="#">View this page on the Internet Archive →</a></p>'+
          '<p class="disc">Note: this copy lives on someone else\'s service. If they don\'t have it, or go down, it can vanish too.</p></div>';
    }
  }
  document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".switch button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); v=b.dataset.v; render();
  }));
  render();
</script>
</body>
</html>
