<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="app-header">
  <div class="hwrap">
    <div>
      <h1>My Bookmarks</h1>
      <p class="tagline">A personal place to save links and find them again.</p>
    </div>
    <button class="ghost-btn" id="prefsBtn">⚙ Preferences</button>
  </div>
</header>

<main class="wrap">
  <section class="saver">
    <div class="saver-row">
      <input class="url-input" id="url" type="text" placeholder="Paste a link to save…" autocomplete="off" />
      <button class="primary-btn" id="saveBtn">Save</button>
    </div>
    <div class="saver-fields">
      <div>
        <div class="field-label">Tags (optional)</div>
        <div class="tag-input" id="saveTags"></div>
      </div>
      <div>
        <div class="field-label">Note (optional · Markdown)</div>
        <textarea class="note-input" id="saveNote" rows="2" placeholder="Why are you saving this?"></textarea>
      </div>
    </div>
    <div class="hint">Paste a link, optionally add tags and a note, then press Save. Existing tags are suggested as you type.</div>
    <div class="save-msg" id="saveMsg" hidden></div>
  </section>

  <nav class="views" id="views" aria-label="Views"></nav>
  <div class="saved-strip" id="savedStrip"></div>

  <section class="findbar">
    <input class="search" id="search" type="text" placeholder='Search — try: dev, "slow living", #reading, dev AND reference, (reading OR essays) NOT design' autocomplete="off" />
    <div class="syntax" id="syntax"></div>
    <div class="tag-filter" id="tagFilter"></div>
    <div class="save-search-row" id="saveSearchRow"></div>
  </section>

  <div class="toolbar">
    <div class="tools-left">
      <button class="ghost-btn" id="importBtn">⬆ Import</button>
      <button class="ghost-btn" id="exportBtn">⬇ Export</button>
    </div>
    <div class="tools-right">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="newest">Newest saved</option>
        <option value="oldest">Oldest saved</option>
        <option value="title">Title A–Z</option>
        <option value="updated">Recently updated</option>
      </select>
    </div>
  </div>

  <div class="bulk-bar" id="bulkBar" hidden></div>
  <div class="page-count" id="pageCount"></div>
  <div id="list" class="list"></div>
  <div class="pager" id="pager"></div>
</main>

<div class="overlay" id="overlay" hidden><div class="overlay-inner" id="overlayInner"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="/lib/query.js"></script>
<script src="/lib/markdown.js"></script>
<script src="/lib/importexport.js"></script>
<script src="/app.js"></script>
</body>
</html>
