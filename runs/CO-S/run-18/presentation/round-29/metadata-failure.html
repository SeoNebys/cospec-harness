<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — unavailable page details</title><style>
:root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--accent:#176b4d;--wash:#eaf3ee;--warn:#815d13;--warnwash:#fff8e3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(920px,calc(100% - 40px));margin:48px auto}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;letter-spacing:-.04em;margin:9px 0 12px}.intro{color:var(--muted);font-size:17px;margin:0 0 25px}.capture{display:flex;gap:10px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 35px rgba(30,55,43,.08)}.capture input{flex:1;border:0;outline:0;font:inherit;font-size:15px;padding:11px 12px}.primary{border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:720;padding:12px 20px;cursor:pointer}.warning{display:none;margin-top:14px;background:var(--warnwash);border:1px solid #eddda9;border-radius:11px;padding:14px 16px;color:#684b0c}.warning.show{display:block}.manual{display:none;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.manual.show{display:block}.manual label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}.manual input,.manual textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.manual textarea{min-height:65px;resize:vertical}.manual .primary{margin-top:12px}.collection{margin-top:38px}.head{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0}.count{font-size:14px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:55px}.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}.title{font-size:18px;font-weight:730;color:var(--ink);text-decoration:none}.description{color:var(--muted);margin:7px 0 9px}.url{font-size:12px;color:var(--accent)}@media(max-width:620px){header{padding:0 20px}.capture{flex-direction:column}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Personal library</div></header><main data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>Save a link</h1><p class="intro">Paste a link. Keepmark fills in the useful details when the page makes them available.</p><form class="capture" id="form"><input value="https://example.com/private-reading" aria-label="Web address"><button class="primary">Save link</button></form><div class="warning" id="warning"></div><form class="manual" id="manual"><strong>Add the details you want to keep</strong><label for="title">Title</label><input id="title" value="Private reading"><label for="description">Description <span style="font-weight:400;color:var(--muted)">— optional</span></label><textarea id="description" placeholder="What is this page about?"></textarea><button class="primary">Save bookmark</button></form><section class="collection"><div class="head"><h2>All bookmarks</h2><span class="count" id="count">0 bookmarks</span></div><div id="result" class="empty">Your saved links will appear here.</div></section></main><script>
const auto=new URLSearchParams(location.search).get('style')==='auto',form=document.querySelector('#form'),manual=document.querySelector('#manual'),warning=document.querySelector('#warning'),result=document.querySelector('#result');function card(title,description='Page details weren’t available.'){document.querySelector('#count').textContent='1 bookmark';result.className='';result.innerHTML=`<article class="card"><a class="title" href="https://example.com/private-reading">${title}</a><p class="description">${description}</p><div class="url">https://example.com/private-reading</div></article>`}form.onsubmit=e=>{e.preventDefault();warning.classList.add('show');if(auto){warning.textContent='Page details weren’t available, so the link was saved using its address.';card('example.com/private-reading')}else{warning.textContent='We couldn’t get details from this page. The link has not been saved yet.';manual.classList.add('show')}};manual.onsubmit=e=>{e.preventDefault();manual.classList.remove('show');warning.textContent='Saved with the details you provided.';card(document.querySelector('#title').value,document.querySelector('#description').value||'No description')};
</script></body></html>
