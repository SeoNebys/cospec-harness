<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — Browse by label</title><style>
:root{--ink:#17231e;--muted:#68736d;--paper:#f5f2e9;--card:#fffdf7;--line:#d9d5ca;--green:#235d45;--pale:#e0eee5}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 82% 5%,#dce8dd,transparent 30rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}.shell{width:min(1060px,calc(100% - 44px));margin:auto;padding-bottom:70px}header{height:78px;display:flex;align-items:center;gap:32px;border-bottom:1px solid rgba(23,35,30,.1)}.brand{display:flex;align-items:center;font-weight:760}.mark{width:34px;height:34px;margin-right:10px;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:11px}.search{margin-left:auto;width:290px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}main{padding-top:52px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:27px}h1{margin:0;font:500 48px/1 Georgia,serif;letter-spacing:-.04em}.lead{margin:10px 0 0;color:var(--muted);font-size:15px}.count{color:var(--muted);font-size:13px}.labels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:27px}.label{display:flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:#506058;background:rgba(255,253,247,.7);font-size:12px;font-weight:700;cursor:pointer}.label span{display:grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#eae7df;color:var(--muted);font-size:9px}.label.active{border-color:var(--green);color:#fff;background:var(--green);box-shadow:0 6px 16px rgba(35,93,69,.18)}.label.active span{color:var(--green);background:#fff}.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 7px 22px rgba(36,48,41,.045);animation:rise .2s ease both}.card h2{margin:0 0 6px;font-size:16px}.card>p{min-height:35px;margin:0 0 9px;color:var(--muted);font-size:12px;line-height:1.45}.domain{color:var(--green);font-size:11px;font-weight:700}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid #ebe8e0}.tag{padding:4px 7px;border-radius:999px;background:var(--pale);color:var(--green);font-size:9px;font-weight:750}.note{min-height:0!important;margin-top:11px!important;padding:8px 10px;border-left:2px solid #a7c4b3;background:#f1f6f2;color:#41584c!important;border-radius:0 7px 7px 0}.empty{display:none;padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}@keyframes rise{from{opacity:0;transform:translateY(5px)}}@media(max-width:700px){.search{display:none}.list{grid-template-columns:1fr}.top{align-items:start;flex-direction:column;gap:14px}}
</style></head><body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark">T</span>Trove</div><label class="search"><input aria-label="Search saved links" placeholder="Search saved links"></label></header><main><div class="top"><div><h1>All bookmarks</h1><p class="lead">Everything worth finding again.</p></div><span class="count" id="count">4 links · newest first</span></div><nav class="labels" aria-label="Filter by label"><button class="label active" data-label="All">All <span>4</span></button><button class="label" data-label="Cooking">Cooking <span>2</span></button><button class="label" data-label="Work">Work <span>1</span></button><button class="label" data-label="Ideas">Ideas <span>2</span></button></nav><div class="list" id="list"></div><div class="empty" id="empty">No bookmarks have this label.</div></main></div><script>
const items=[{title:'My perfect risotto guide',description:'A careful guide to creamy, deeply flavorful risotto.',domain:'seriouseats.com',note:'Try this for Sunday dinner.',labels:['Cooking','Ideas']},{title:'A loaf for every weekend',description:'Approachable bread recipes and home baking notes.',domain:'theperfectloaf.com',note:'Scale this down for weeknight cooking.',labels:['Cooking']},{title:'Designing calmer workdays',description:'Practical ideas for focus, attention, and sustainable routines.',domain:'nesslabs.com',note:'Discuss with the team next month.',labels:['Work','Ideas']},{title:'A field guide to urban trees',description:'Notice and identify the trees that shape city streets.',domain:'street-tree.info',note:'',labels:[]}];
const list=document.querySelector('#list'),count=document.querySelector('#count'),empty=document.querySelector('#empty'),search=document.querySelector('.search input');let active='All';
function render(){const q=search.value.toLowerCase();const found=items.filter(x=>(active==='All'||x.labels.includes(active))&&[x.title,x.description,x.note,x.domain].join(' ').toLowerCase().includes(q));list.innerHTML=found.map(x=>`<article class="card"><h2>${x.title}</h2><p>${x.description}</p><span class="domain">${x.domain}</span>${x.note?`<p class="note">${x.note}</p>`:''}<div class="tags">${x.labels.map(t=>`<span class="tag">${t}</span>`).join('')}</div></article>`).join('');count.textContent=`${found.length} ${found.length===1?'link':'links'} · newest first`;empty.style.display=found.length?'none':'block'}
document.querySelectorAll('.label').forEach(b=>b.onclick=()=>{document.querySelector('.label.active').classList.remove('active');b.classList.add('active');active=b.dataset.label;render()});search.oninput=render;render();
</script></body></html>
