<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype p01</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a1a;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; margin: 0 0 20px; }
  .hint { background: #eef2ff; border: 1px solid #dbe1ff; color: #3730a3;
    font-size: 13px; border-radius: 10px; padding: 10px 12px; margin: 0 0 20px; }
  .hint code { background: #fff; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .addbar {
    display: flex; gap: 8px; background: #fff; padding: 12px;
    border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 24px;
  }
  .addbar input {
    flex: 1; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 10px 12px; font-size: 15px;
  }
  .addbar button {
    border: 0; background: #2563eb; color: #fff; font-size: 15px;
    padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .addbar button:hover { background: #1d4ed8; }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  li.loading { opacity: 0.7; }
  .favicon {
    width: 32px; height: 32px; border-radius: 8px; background: #eef2ff;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    color: #4f46e5; font-weight: 700; flex-shrink: 0;
  }
  .meta { min-width: 0; }
  .title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .title a { color: #111827; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .title .fetching { color: #9ca3af; font-weight: 500; font-style: italic; }
  .url { font-size: 12.5px; color: #6b7280; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Paste a link — the app grabs the page's real title for you.</p>

  <p class="hint">
    Prototype note: title-fetching is simulated for these example links —
    try pasting <code>nytimes.com/2026/travel/kyoto-guide</code>,
    <code>arstechnica.com/ai-agents-2026</code>, or
    <code>github.com/openai/whisper</code>. Any other link works too.
  </p>

  <div class="addbar">
    <input id="urlInput" type="text" placeholder="Paste a link here, e.g. https://…" autofocus />
    <button id="addBtn">Save</button>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
</div>

<script>
  const list = document.getElementById('list');
  const input = document.getElementById('urlInput');
  const countEl = document.getElementById('count');
  const bookmarks = [];

  // Simulated "page titles" the fetch would return for known example links.
  const KNOWN_TITLES = {
    'nytimes.com/2026/travel/kyoto-guide': 'A 3-Day Guide to Kyoto in Autumn',
    'arstechnica.com/ai-agents-2026': 'The state of AI agents in 2026: what actually works',
    'github.com/openai/whisper': 'openai/whisper: Robust Speech Recognition via Large-Scale Weak Supervision'
  };

  function normalize(raw) {
    let u = raw.trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function hostOf(href) {
    try { return new URL(href).hostname.replace(/^www\./, ''); }
    catch (e) { return href; }
  }

  // Simulates fetching the page title. Returns a promise resolving to a title.
  function fetchTitle(href) {
    const key = href.replace(/^https?:\/\//i, '').replace(/^www\./, '').replace(/\/$/, '');
    return new Promise(resolve => {
      setTimeout(() => {
        if (KNOWN_TITLES[key]) return resolve(KNOWN_TITLES[key]);
        // Fallback for unknown links: readable guess from the domain.
        const host = hostOf(href);
        const base = host.split('.')[0];
        resolve(base.charAt(0).toUpperCase() + base.slice(1));
      }, 600);
    });
  }

  function render() {
    countEl.textContent = bookmarks.length
      ? bookmarks.length + (bookmarks.length === 1 ? ' saved link' : ' saved links')
      : '';
    if (!bookmarks.length) {
      list.innerHTML = '<li class="empty">Nothing saved yet.</li>';
      return;
    }
    list.innerHTML = '';
    bookmarks.forEach(b => {
      const li = document.createElement('li');
      if (b.loading) li.className = 'loading';
      const titleHtml = b.loading
        ? '<span class="fetching">Fetching title…</span>'
        : '<a href="' + b.href + '" target="_blank">' + b.title + '</a>';
      const letter = (b.loading ? b.host : b.title).charAt(0).toUpperCase();
      li.innerHTML =
        '<div class="favicon">' + letter + '</div>' +
        '<div class="meta">' +
          '<p class="title">' + titleHtml + '</p>' +
          '<p class="url">' + b.host + '</p>' +
        '</div>';
      list.appendChild(li);
    });
  }

  function add() {
    const raw = input.value.trim();
    if (!raw) return;
    const href = normalize(raw);
    const b = { href, host: hostOf(href), title: '', loading: true };
    bookmarks.unshift(b);
    input.value = '';
    input.focus();
    render();
    fetchTitle(href).then(title => {
      b.title = title;
      b.loading = false;
      render();
    });
  }

  document.getElementById('addBtn').addEventListener('click', add);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  render();
</script>
</body>
</html>
