<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rename — Version C (click title)</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--muted:#6b7684;--line:#e3e7ec;--accent:#2f6bff;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;}
  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
  header.top h1{font-size:18px;margin:0;}
  header.top .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);}
  .badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
  main{max-width:760px;margin:0 auto;padding:20px;}
  .section-label{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:0 2px 12px;}
  .tip{font-size:12px;color:var(--muted);margin:0 2px 12px;}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  li.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;}
  li.item .title{font-size:16px;font-weight:600;color:var(--ink);cursor:text;border-radius:6px;padding:2px 4px;margin:-2px -4px;display:inline-block;}
  li.item .title:hover{background:#eef1f5;}
  li.item .openlink{font-size:12px;color:var(--accent);text-decoration:none;margin-left:8px;}
  li.item .url{font-size:13px;color:var(--muted);word-break:break-all;margin-top:2px;}
  li.item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .editrow{display:flex;gap:8px;align-items:center;}
  .editrow input{flex:1;padding:9px 11px;font-size:15px;border:1px solid var(--accent);border-radius:9px;outline:none;box-shadow:0 0 0 3px rgba(47,107,255,.12);}
  .editrow .hintk{font-size:12px;color:var(--muted);white-space:nowrap;}
</style>
</head>
<body>
  <header class="top"><div class="dot"></div><h1>My Bookmarks</h1><span class="badge">Version C</span></header>
  <main>
    <div class="section-label">Recent</div>
    <p class="tip">Tip: click a title to edit it. Use the small “open” link to visit the page.</p>
    <ul class="list" id="list"></ul>
  </main>
<script>
  const items=[
    {url:'https://en.wikipedia.org/wiki/Bookmark',title:'Bookmark - Wikipedia',when:'just now',editing:false},
    {url:'https://developer.mozilla.org/en-US/docs/Web/JavaScript',title:'JavaScript | MDN',when:'2 minutes ago',editing:false},
  ];
  const listEl=document.getElementById('list');
  function render(){
    listEl.innerHTML='';
    items.forEach((it,i)=>{
      const li=document.createElement('li');li.className='item';
      if(it.editing){
        li.innerHTML=`<div class="editrow"><input type="text" value="${it.title.replace(/"/g,'&quot;')}" /><span class="hintk">Enter to save · Esc to cancel</span></div><div class="url">${it.url}</div>`;
        const inp=li.querySelector('input');
        const commit=()=>{const v=inp.value.trim();if(v)it.title=v;it.editing=false;render();};
        inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){it.editing=false;render();}});
        inp.addEventListener('blur',commit);
        setTimeout(()=>{inp.focus();inp.select();},0);
      }else{
        li.innerHTML=`<div><span class="title" title="Click to rename">${it.title}</span><a class="openlink" href="${it.url}" target="_blank" rel="noopener">open ↗</a></div><div class="url">${it.url}</div><div class="meta">Saved ${it.when}</div>`;
        li.querySelector('.title').onclick=()=>{items.forEach(x=>x.editing=false);it.editing=true;render();};
      }
      listEl.appendChild(li);
    });
  }
  render();
  document.body.setAttribute('data-harness-ready','true');
</script>
</body>
</html>
