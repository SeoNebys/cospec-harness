<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>A private place for your links — prototype for review</p>
</header>
<main>
  <div id="flash" class="flash"></div>

  <section class="panel">
    <h2>Save a link</h2>
    <label for="url">Web address</label>
    <div class="row-url">
      <input id="url" type="url" placeholder="Paste a web address, e.g. https://example.com/article" autocomplete="off" />
      <button id="fetchBtn" class="btn-ghost" type="button">Get details</button>
    </div>
    <div id="fetchNote" class="fetch-note"></div>
    <div id="auto" class="auto">
      <div class="auto-label">Collected automatically</div>
      <div class="auto-body">
        <div id="autoPreview"></div>
        <div class="site-row"><span id="autoFavicon"></span><span id="autoSite" class="site"></span></div>
      </div>
    </div>
    <label for="title">Title</label>
    <input id="title" type="text" placeholder="The page title will appear here — edit if you like" />
    <label for="desc">Description</label>
    <textarea id="desc" placeholder="A short summary of the page"></textarea>
    <label for="tags">Tags (comma separated)</label>
    <div class="tagwrap">
      <input id="tags" type="text" placeholder="Start typing — e.g. re…" autocomplete="off" />
      <div id="tagSuggest" class="tagsuggest"></div>
    </div>
    <label for="note">Your note</label>
    <textarea id="note" placeholder="Why you saved this, or anything to remember"></textarea>
    <div class="save-row"><button id="saveBtn" class="btn-primary" type="button" disabled>Save bookmark</button></div>
  </section>

  <section class="panel">
    <div id="viewTabs" class="viewtabs">
      <button type="button" data-view="all" class="active">All bookmarks</button>
      <button type="button" data-view="later">Read later</button>
    </div>
    <div id="activeFilter" class="activefilter"></div>
    <div class="searchwrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search your bookmarks — title, site, address, tag or note" autocomplete="off" />
    </div>
    <div class="sortrow">
      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="az">Title A–Z</option>
        <option value="za">Title Z–A</option>
      </select>
    </div>
    <div class="list-head"><h2 style="margin:0">Your bookmarks</h2><span id="count" class="count"></span></div>
    <div id="empty" class="empty" style="display:none"></div>
    <ul id="list" class="bm"></ul>
  </section>
</main>

<script src="tags-shared.js"></script>
<script src="app-core.js"></script>
<script>
// Main screen: Version B tag filtering + sort control + read-later view.
window.TAGS_CLICKABLE = true;
window.SHOW_READLATER = true;
window.onRender = function(){
  const el=$("activeFilter");
  if (activeTag){
    el.style.display="flex";
    el.innerHTML = 'Showing only tag: <strong>'+escapeHtml(activeTag)+'</strong><button id="clearFilter" type="button" title="Clear">✕ clear</button>';
    $("clearFilter").addEventListener("click", ()=>{ activeTag=null; render(); });
  } else { el.style.display="none"; el.innerHTML=""; }
};
initCore();
</script>
</body>
</html>
