<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — prototype 1</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#2f6fed; --bg:#fafafb; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: var(--bg); color: #1c1c20; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  .adder { display: flex; gap: 8px; margin-bottom: 8px; }
  .adder input { flex: 1; padding: 12px 14px; font-size: 15px;
         border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .adder input:focus { outline: none; border-color: var(--accent); }
  .adder button { padding: 0 18px; font-size: 15px; font-weight: 600;
         color: #fff; background: var(--accent); border: none;
         border-radius: 8px; cursor: pointer; }
  .adder button:hover { background: #255fd4; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 28px; min-height: 16px; }
  .hint.err { color: #c0392b; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 14px 4px;
       border-bottom: 1px solid var(--line); }
  li:first-child { border-top: 1px solid var(--line); }
  .favicon { width: 18px; height: 18px; flex: none; border-radius: 4px;
       background: #dfe3ea; display: grid; place-items: center;
       font-size: 10px; color: #7a8395; font-weight: 700; }
  .meta { min-width: 0; }
  .title { font-size: 15px; font-weight: 600; white-space: nowrap;
       overflow: hidden; text-overflow: ellipsis; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .url { font-size: 12.5px; color: var(--muted); white-space: nowrap;
       overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); font-size: 14px; padding: 32px 0;
       text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
  .count { font-size: 12.5px; color: var(--muted); text-transform: uppercase;
       letter-spacing: .04em; margin: 0 0 10px; }
  .flash { animation: flash 1.1s ease; }
  @keyframes flash { from { background: #fff7d6; } to { background: transparent; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Save a link so you can find it again later.</p>

  <form class="adder" id="adder" autocomplete="off">
    <input id="url" type="text" placeholder="Paste a link  (e.g. example.com/article)" aria-label="Link to save">
    <button type="submit">Save</button>
  </form>
  <p class="hint" id="hint"></p>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <div class="empty" id="empty">Nothing saved yet. Paste a link above to get started.</div>
</div>

<script>
  // Prototype-only: in-memory list, starts empty so the client experiences saving.
  const items = [];
  const listEl  = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const hintEl  = document.getElementById('hint');
  const urlEl   = document.getElementById('url');

  function hostOf(u){
    try { return new URL(u.match(/^https?:\/\//) ? u : 'https://' + u).hostname.replace(/^www\./,''); }
    catch(e){ return null; }
  }
  // Assumption: until we discuss it, the "title" shown is derived from the link's
  // page name guess (last path segment) or the site name.
  function titleGuess(u){
    const host = hostOf(u);
    const path = u.replace(/^https?:\/\//,'').split('?')[0].split('#')[0]
                  .split('/').filter(Boolean).slice(1).join(' / ');
    if (path) return decodeURIComponent(path.replace(/[-_]/g,' ')).replace(/\.\w+$/,'');
    return host || u;
  }

  function render(flashFirst){
    listEl.innerHTML = '';
    countEl.textContent = items.length ? items.length + (items.length===1?' link':' links') : '';
    emptyEl.style.display = items.length ? 'none' : 'block';
    items.forEach((it, i) => {
      const li = document.createElement('li');
      if (flashFirst && i===0) li.className = 'flash';
      const initial = (it.host || '?').charAt(0).toUpperCase();
      li.innerHTML =
        '<div class="favicon">'+initial+'</div>'+
        '<div class="meta">'+
          '<div class="title"><a href="'+it.url+'" target="_blank" rel="noreferrer">'+it.title+'</a></div>'+
          '<div class="url">'+it.host+'</div>'+
        '</div>';
      listEl.appendChild(li);
    });
  }

  document.getElementById('adder').addEventListener('submit', function(e){
    e.preventDefault();
    const raw = urlEl.value.trim();
    hintEl.className = 'hint';
    if (!raw){ return; }
    const host = hostOf(raw);
    if (!host){ hintEl.textContent = "That doesn't look like a link. Try something like example.com/page."; hintEl.className='hint err'; return; }
    const url = raw.match(/^https?:\/\//) ? raw : 'https://' + raw;
    items.unshift({ url, host, title: titleGuess(raw) });
    urlEl.value = '';
    hintEl.textContent = 'Saved.';
    render(true);
    urlEl.focus();
  });

  render(false);
</script>
</body>
</html>
