<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — prototype 6 (archive + save-to-read)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a2e; }
  header { background: #fff; border-bottom: 1px solid #e3e5e8; padding: 18px 28px; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .savebar { display: flex; gap: 8px; align-items: center; }
  .savebar input.url { flex: 1; padding: 11px 14px; font-size: 15px; border: 1px solid #cfd3d8; border-radius: 8px; }
  .savebar .toread-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: #6b6455; background: #fdf7e3; border: 1px solid #ecd98f; border-radius: 8px; padding: 10px 12px; cursor: pointer; user-select: none; white-space: nowrap; }
  .savebar .toread-toggle input { accent-color: #b8860b; width: 15px; height: 15px; }
  .savebar button.save { padding: 11px 20px; font-size: 15px; font-weight: 600; background: #2f6fed; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .savebar button.save:hover { background: #235bce; }
  main { max-width: 900px; margin: 0 auto; padding: 22px 28px 60px; }
  .searchrow { position: relative; margin-bottom: 16px; }
  .searchrow input { width: 100%; padding: 12px 14px 12px 40px; font-size: 15px; border: 1px solid #cfd3d8; border-radius: 10px; background: #fff; }
  .searchrow .mag { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9aa1ab; font-size: 16px; }
  .views { display: flex; gap: 8px; margin-bottom: 14px; }
  .view { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; padding: 8px 15px; border-radius: 9px; border: 1px solid #cfd3d8; background: #fff; color: #3f4b5b; cursor: pointer; }
  .view:hover { background: #eef1f5; }
  .view.active { background: #1a1a2e; border-color: #1a1a2e; color: #fff; }
  .view.toread.active { background: #b8860b; border-color: #b8860b; }
  .view.archived.active { background: #566072; border-color: #566072; }
  .view .n { font-size: 12px; background: rgba(0,0,0,.09); border-radius: 999px; padding: 1px 8px; }
  .view.active .n { background: rgba(255,255,255,.22); }
  .labelbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .labelbar .lead { font-size: 12.5px; color: #6b7280; margin-right: 2px; }
  .pill { font-size: 12.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid #cfd3d8; background: #fff; color: #4b5563; cursor: pointer; }
  .pill:hover { background: #eef1f5; } .pill.active { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .archnote { font-size: 12.5px; color: #6b7280; background: #eef0f3; border: 1px solid #e0e3e8; border-radius: 8px; padding: 9px 13px; margin-bottom: 14px; }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 14px 2px; }
  .card { display: flex; gap: 14px; background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 14px; margin-bottom: 12px; animation: pop .25s ease; position: relative; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px);} to {opacity:1;transform:none;} }
  .card.new { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47,111,237,.12); }
  .card.toread { border-left: 4px solid #d4a017; }
  .card.archived { background: #fbfbfc; }
  .card.flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%,100%{box-shadow:none;} 30%{box-shadow:0 0 0 4px rgba(255,180,0,.55);} }
  .card.leaving { opacity: 0; transform: translateX(20px); transition: all .35s ease; }
  .clickable { cursor: pointer; } .clickable:hover .title { text-decoration: underline; }
  .thumb { width: 108px; height: 76px; flex: none; border-radius: 8px; object-fit: cover; background: #e9ebef; }
  .card.archived .thumb { filter: grayscale(.7); opacity: .8; }
  .body { min-width: 0; flex: 1; }
  .titlerow { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .badge.tr { color: #8a6d0b; background: #fdf3d3; border: 1px solid #ecd98f; }
  .badge.ar { color: #4a5468; background: #e7eaef; border: 1px solid #ccd2db; }
  .body .title { font-size: 16px; font-weight: 600; }
  .body .url { font-size: 12.5px; color: #2f6fed; margin: 0 0 6px; word-break: break-all; }
  .body .desc { font-size: 13.5px; color: #4b5563; margin: 0 0 8px; line-height: 1.45; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #eef1f5; color: #3f4b5b; cursor: pointer; } .tag:hover { background: #dfe4ea; } .tag.on { background: #d9e5ff; color: #1c4fbf; }
  .cardtools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
  .tbtn { font-size: 12.5px; color: #6b7280; background: #f4f5f7; border: 1px solid #e3e5e8; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  .tbtn:hover { background: #e9ebef; }
  .tbtn.toread { color: #8a6d0b; border-color: #ecd98f; background: #fdf7e3; }
  .tbtn.markread { color: #1a7a3c; border-color: #b6e0c2; background: #eafaf0; }
  .tbtn.archive { color: #4a5468; }
  .tbtn.restore { color: #1c4fbf; border-color: #b8ccf5; background: #eef4ff; }
  .edit-form input, .edit-form textarea { width: 100%; font-size: 14px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid #cfd3d8; border-radius: 7px; font-family: inherit; }
  .edit-form .lbl { font-size: 11.5px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .edit-form textarea { min-height: 62px; resize: vertical; }
  .chipbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid #cfd3d8; border-radius: 7px; padding: 6px 8px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px; background: #d9e5ff; color: #1c4fbf; }
  .chip button { border: none; background: transparent; color: #1c4fbf; cursor: pointer; font-size: 13px; line-height: 1; padding: 0 3px; }
  .chipbox input { border: none; margin: 0; padding: 4px; flex: 1; min-width: 120px; font-size: 13px; } .chipbox input:focus { outline: none; }
  .hintline { font-size: 11.5px; color: #9aa1ab; margin: -4px 0 8px; }
  .edit-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .edit-actions .save { background: #2f6fed; color: #fff; border: none; border-radius: 7px; padding: 7px 16px; font-weight: 600; cursor: pointer; }
  .edit-actions .cancel { background: #fff; color: #4b5563; border: 1px solid #cfd3d8; border-radius: 7px; padding: 7px 16px; cursor: pointer; }
  .edit-actions .delete { margin-left: auto; background: #fff; color: #c0392b; border: 1px solid #e6c3bd; border-radius: 7px; padding: 7px 16px; cursor: pointer; } .edit-actions .delete:hover { background: #fdeeec; }
  .savenote { font-size: 12.5px; color: #2f6fed; margin: 0 0 8px; }
  .empty { text-align: center; color: #9aa1ab; padding: 50px 0; font-size: 15px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; display: flex; align-items: center; gap: 14px; }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: transparent; color: #ffd54a; border: none; font-weight: 700; cursor: pointer; font-size: 14px; }
  .browser { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; }
  .browser.show { display: flex; }
  .win { background: #fff; width: 100%; max-width: 760px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .chrome { display: flex; align-items: center; gap: 10px; background: #ececf0; padding: 10px 14px; border-bottom: 1px solid #dcdee3; }
  .dots { display: flex; gap: 6px; } .dots span { width: 11px; height: 11px; border-radius: 50%; background: #c9ccd2; }
  .addr { flex: 1; background: #fff; border-radius: 7px; padding: 6px 12px; font-size: 12.5px; color: #4b5563; border: 1px solid #dcdee3; }
  .closex { cursor: pointer; color: #6b7280; font-size: 18px; padding: 0 4px; }
  .page { padding: 34px 40px 46px; } .page h2 { margin: 0 0 10px; } .page p { color: #4b5563; line-height: 1.6; }
  .page .hint { color: #9aa1ab; font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <div class="savebar">
    <input class="url" id="urlInput" type="text" placeholder="Paste a link to save…" autocomplete="off">
    <label class="toread-toggle"><input type="checkbox" id="saveToRead"> 📖 To read</label>
    <button class="save" id="saveBtn">Save</button>
  </div>
</header>

<main>
  <div class="searchrow">
    <span class="mag">⌕</span>
    <input id="searchInput" type="text" placeholder="Search everything you saved…" autocomplete="off">
  </div>
  <div class="views" id="views"></div>
  <div class="labelbar" id="labelbar"></div>
  <div id="archnote"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>
<div class="browser" id="browser">
  <div class="win">
    <div class="chrome"><div class="dots"><span></span><span></span><span></span></div>
      <div class="addr" id="addr"></div><div class="closex" id="closeBrowser">✕</div></div>
    <div class="page"><h2 id="pageTitle"></h2><p id="pageBody"></p>
      <p class="hint">(Simulated: in the real app this is the actual web page opening. Close this to go back.)</p></div>
  </div>
</div>

<script>
let bookmarks = [
  { id:1, title:"The Sourdough Starter Guide for Beginners", url:"https://kitchenlab.example/sourdough-starter", desc:"How to make and maintain a wild-yeast starter. Covers feeding schedules, the float test, and troubleshooting a starter that won't rise.", img:"https://picsum.photos/seed/bread/216/152", tags:["cooking"], unread:false, archived:false },
  { id:2, title:"Understanding CSS Grid Layout", url:"https://webnotes.example/css-grid-deep-dive", desc:"A visual walkthrough of grid-template-areas, fractional units, and building a responsive photo gallery without media queries.", img:"https://picsum.photos/seed/grid/216/152", tags:["web dev"], unread:true, archived:false },
  { id:3, title:"Why We Sleep — key takeaways", url:"https://readingnook.example/why-we-sleep-notes", desc:"Notes on Matthew Walker's book. The role of deep sleep in memory, caffeine's half-life, and the danger of chronic sleep debt.", img:"https://picsum.photos/seed/sleep/216/152", tags:["health"], unread:true, archived:false },
  { id:4, title:"12 Hidden Gems in Lisbon", url:"https://travelmore.example/lisbon-hidden-gems", desc:"Neighbourhood viewpoints, a family-run tram cafe, and the best pastel de nata away from the tourist crowds.", img:"https://picsum.photos/seed/lisbon/216/152", tags:["travel"], unread:false, archived:true },
  { id:5, title:"A Practical Guide to Index Funds", url:"https://moneywise.example/index-funds-101", desc:"What an expense ratio really costs you over 30 years, dollar-cost averaging, and why most active funds underperform.", img:"https://picsum.photos/seed/money/216/152", tags:["finance"], unread:false, archived:false },
];

const canned = { "https://kitchenlab.example/no-knead-bread": { title:"No-Knead Bread in a Dutch Oven", desc:"A four-ingredient loaf with a crackly crust and open crumb. Long overnight rise, no kneading, baked in a covered pot.", img:"https://picsum.photos/seed/dutchoven/216/152" } };
function autoCapture(url){ if(canned[url]) return canned[url]; let host="the page"; try{host=new URL(url).hostname.replace(/^www\./,'');}catch(e){} const seed=encodeURIComponent(url).slice(-12)||"link"; return { title:"Saved page from "+host, desc:"We grabbed this automatically from "+host+". You didn't have to type any of it in.", img:"https://picsum.photos/seed/"+seed+"/216/152" }; }
function normUrl(u){ let s=u.trim().toLowerCase(); s=s.replace(/\/+$/,''); s=s.replace(/^https?:\/\//,''); s=s.replace(/^www\./,''); return s; }

const listEl=document.getElementById('list'), countEl=document.getElementById('count'),
      searchEl=document.getElementById('searchInput'), labelbarEl=document.getElementById('labelbar'),
      viewsEl=document.getElementById('views'), archnoteEl=document.getElementById('archnote');
let lastNewId=null, editingId=null, flashId=null, activeLabel=null, view='all';
let draftTags=[];

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function highlight(text,q){ const safe=esc(text); if(!q) return safe; const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return safe.replace(re,'<mark>$1</mark>'); }
const active = () => bookmarks.filter(b=>!b.archived);
function allLabels(){ const s=new Set(); active().forEach(b=>b.tags.forEach(t=>s.add(t))); return [...s].sort(); }
function toReadCount(){ return active().filter(b=>b.unread).length; }
function archivedCount(){ return bookmarks.filter(b=>b.archived).length; }

function renderViews(){
  viewsEl.innerHTML =
    `<span class="view ${view==='all'?'active':''}" data-view="all">All bookmarks <span class="n">${active().length}</span></span>`+
    `<span class="view toread ${view==='toread'?'active':''}" data-view="toread">📖 To read <span class="n">${toReadCount()}</span></span>`+
    `<span class="view archived ${view==='archived'?'active':''}" data-view="archived">🗄 Archived <span class="n">${archivedCount()}</span></span>`;
}
function renderLabelbar(){
  if(view==='archived'){ labelbarEl.innerHTML=''; return; }
  const labels=allLabels();
  let html=`<span class="lead">Labels:</span>`;
  html+=`<span class="pill ${activeLabel===null?'active':''}" data-label="__all">All</span>`;
  html+=labels.map(l=>`<span class="pill ${activeLabel===l?'active':''}" data-label="${esc(l)}">${esc(l)} <span style="opacity:.6">${active().filter(b=>b.tags.includes(l)).length}</span></span>`).join('');
  labelbarEl.innerHTML=html;
}

function cardHtml(b,q,isNew){
  if(b.id===editingId){
    const chips=draftTags.map((t,i)=>`<span class="chip">${esc(t)}<button data-act="untag" data-i="${i}">×</button></span>`).join('');
    return `
    <div class="card ${isNew?'new':''} ${b.unread?'toread':''}" data-id="${b.id}">
      <img class="thumb" src="${b.img}" alt="">
      <div class="body">
        ${isNew?'<p class="savenote">Saved — the details below were filled in for you. Fix anything you like, and add your own labels.</p>':''}
        <div class="edit-form">
          <div class="lbl">Title</div><input class="e-title" type="text" value="${esc(b.title)}">
          <div class="lbl">Web address</div><input class="e-url" type="text" value="${esc(b.url)}">
          <div class="lbl">Summary</div><textarea class="e-desc">${esc(b.desc)}</textarea>
          <div class="lbl">Labels</div>
          <div class="chipbox" data-act="focustag">${chips}<input class="e-tag" type="text" placeholder="Type a label, press Enter…" list="labelsuggest"></div>
          <div class="hintline">Press Enter or comma to add. Your own words — group things any way you like.</div>
          <div class="edit-actions">
            <button class="save" data-act="commit">Save changes</button>
            <button class="cancel" data-act="cancel">Cancel</button>
            <button class="delete" data-act="delete">Delete forever</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  const tags=b.tags.map(t=>`<span class="tag ${activeLabel===t?'on':''}" data-act="filter" data-label="${esc(t)}">${esc(t)}</span>`).join('');
  let tools;
  if(b.archived){
    tools = `<button class="tbtn restore" data-act="restore">⤺ Restore</button><button class="tbtn" data-act="edit">Edit</button>`;
  } else {
    const statusBtn = b.unread ? `<button class="tbtn markread" data-act="markread">✓ Mark as read</button>` : `<button class="tbtn toread" data-act="toread">📖 To read</button>`;
    tools = `${statusBtn}<button class="tbtn archive" data-act="archive">🗄 Archive</button><button class="tbtn" data-act="edit">Edit</button>`;
  }
  const badges = (b.unread?'<span class="badge tr">📖 To read</span>':'') + (b.archived?'<span class="badge ar">🗄 Archived</span>':'');
  return `
    <div class="card ${isNew?'new':''} ${b.unread?'toread':''} ${b.archived?'archived':''} ${b.id===flashId?'flash':''}" data-id="${b.id}">
      <img class="thumb clickable" src="${b.img}" alt="" data-act="open">
      <div class="cardtools">${tools}</div>
      <div class="body">
        <div class="clickable" data-act="open">
          <div class="titlerow">${badges}<div class="title">${highlight(b.title,q)}</div></div>
          <div class="url">${highlight(b.url,q)}</div>
          <div class="desc">${highlight(b.desc,q)}</div>
        </div>
        <div class="tags">${tags}</div>
      </div>
    </div>`;
}

function render(){
  renderViews(); renderLabelbar();
  archnoteEl.innerHTML = (view==='archived')
    ? '<div class="archnote">Archived items are tucked away here — kept out of your everyday list and to-read pile, but not deleted. Restore any of them anytime.</div>' : '';
  const q=searchEl.value.trim(), ql=q.toLowerCase();
  let pool = (view==='archived') ? bookmarks.filter(b=>b.archived) : active();
  let matches=pool.filter(b=> !ql || b.title.toLowerCase().includes(ql)||b.url.toLowerCase().includes(ql)||b.desc.toLowerCase().includes(ql)||b.tags.some(t=>t.toLowerCase().includes(ql)));
  if(view==='toread') matches=matches.filter(b=>b.unread);
  if(view!=='archived' && activeLabel!==null) matches=matches.filter(b=>b.tags.includes(activeLabel));
  if(matches.length===0){
    countEl.textContent='';
    const where = view==='toread' ? 'Your to-read pile is empty — nothing left to get to. 🎉'
      : view==='archived' ? 'Nothing archived.' : 'Nothing to show here.';
    listEl.innerHTML='<div class="empty">'+where+'</div>'; return;
  }
  countEl.textContent = view==='toread' ? matches.length+' to read'
    : view==='archived' ? matches.length+' archived'
    : ((q||activeLabel!==null)? matches.length+' of '+active().length+' shown' : active().length+' saved');
  listEl.innerHTML=matches.slice().reverse().map(b=>cardHtml(b,q,b.id===lastNewId)).join('');
  flashId=null;
}

function toast(msg,undo){ const t=document.getElementById('toast'); t.innerHTML=esc(msg)+(undo?' <button id="undoBtn">Undo</button>':''); t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'), undo?5000:2600); if(undo) document.getElementById('undoBtn').addEventListener('click',undo); }
function openPage(b){ document.getElementById('addr').textContent=b.url; document.getElementById('pageTitle').textContent=b.title; document.getElementById('pageBody').textContent=b.desc; document.getElementById('browser').classList.add('show'); }
document.getElementById('closeBrowser').addEventListener('click',()=>document.getElementById('browser').classList.remove('show'));

document.getElementById('saveBtn').addEventListener('click',()=>{
  const url=document.getElementById('urlInput').value.trim(); if(!url) return;
  const wantToRead=document.getElementById('saveToRead').checked;
  const existing=bookmarks.find(b=>normUrl(b.url)===normUrl(url));
  if(existing){ document.getElementById('urlInput').value=''; document.getElementById('saveToRead').checked=false; searchEl.value=''; activeLabel=null; view= existing.archived?'archived':'all'; lastNewId=null; editingId=null; flashId=existing.id; render(); const c=listEl.querySelector('[data-id="'+existing.id+'"]'); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); toast("You already saved this — here it is."); return; }
  const cap=autoCapture(url); const id=Date.now();
  bookmarks.push({ id, url, title:cap.title, desc:cap.desc, img:cap.img, tags:[], unread:wantToRead, archived:false });
  lastNewId=id; editingId=id; draftTags=[]; activeLabel=null; view='all';
  document.getElementById('urlInput').value=''; document.getElementById('saveToRead').checked=false; searchEl.value=''; render();
  toast(wantToRead ? 'Saved to your to-read pile — details grabbed automatically' : 'Saved — title and image grabbed automatically');
});
document.getElementById('urlInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('saveBtn').click(); });
searchEl.addEventListener('input',()=>{ lastNewId=null; editingId=null; render(); });

viewsEl.addEventListener('click',e=>{ const v=e.target.closest('[data-view]'); if(!v) return; view=v.dataset.view; activeLabel=null; editingId=null; render(); });
labelbarEl.addEventListener('click',e=>{ const p=e.target.closest('[data-label]'); if(!p) return; const l=p.dataset.label; activeLabel=(l==='__all')?null:(activeLabel===l?null:l); editingId=null; render(); });

function addDraftTag(raw){ const t=raw.trim().replace(/,$/,'').trim(); if(t && !draftTags.includes(t)) draftTags.push(t); }
listEl.addEventListener('keydown',e=>{ if(e.target.classList.contains('e-tag') && (e.key==='Enter'||e.key===',')){ e.preventDefault(); addDraftTag(e.target.value); e.target.value=''; render(); const inp=listEl.querySelector('.e-tag'); if(inp) inp.focus(); } });

listEl.addEventListener('click',e=>{
  const card=e.target.closest('.card'); if(!card) return;
  const id=Number(card.dataset.id); const idx=bookmarks.findIndex(x=>x.id===id); const b=bookmarks[idx];
  const act=e.target.closest('[data-act]')?.dataset.act;
  if(act==='open'){ openPage(b); }
  else if(act==='filter'){ const l=e.target.dataset.label; activeLabel=(activeLabel===l?null:l); editingId=null; render(); }
  else if(act==='edit'){ editingId=id; draftTags=[...b.tags]; lastNewId=null; render(); }
  else if(act==='cancel'){ editingId=null; lastNewId=null; render(); }
  else if(act==='untag'){ draftTags.splice(Number(e.target.dataset.i),1); render(); const inp=listEl.querySelector('.e-tag'); if(inp) inp.focus(); }
  else if(act==='focustag'){ const inp=card.querySelector('.e-tag'); if(inp && e.target.classList.contains('chipbox')) inp.focus(); }
  else if(act==='toread'){ b.unread=true; flashId=id; render(); toast('Added to your to-read pile'); }
  else if(act==='markread'){ b.unread=false; if(view==='toread'){ card.classList.add('leaving'); setTimeout(render,320);} else { flashId=id; render(); } toast('Nice — checked off as read', ()=>{ b.unread=true; render(); document.getElementById('toast').classList.remove('show'); }); }
  else if(act==='archive'){ b.archived=true; card.classList.add('leaving'); setTimeout(render,320); toast('Tucked away in your archive', ()=>{ b.archived=false; render(); document.getElementById('toast').classList.remove('show'); }); }
  else if(act==='restore'){ b.archived=false; card.classList.add('leaving'); setTimeout(render,320); toast('Back in your bookmarks', ()=>{ b.archived=true; render(); document.getElementById('toast').classList.remove('show'); }); }
  else if(act==='commit'){
    const pend=card.querySelector('.e-tag').value; addDraftTag(pend);
    b.title=card.querySelector('.e-title').value.trim()||b.title;
    b.url=card.querySelector('.e-url').value.trim()||b.url;
    b.desc=card.querySelector('.e-desc').value.trim()||b.desc;
    b.tags=[...draftTags];
    editingId=null; lastNewId=null; flashId=id; render(); toast('Updated');
  }
  else if(act==='delete'){ const removed=bookmarks.splice(idx,1)[0]; editingId=null; lastNewId=null; render();
    toast('Deleted “'+removed.title+'” for good', ()=>{ bookmarks.splice(Math.min(idx,bookmarks.length),0,removed); flashId=removed.id; render(); document.getElementById('toast').classList.remove('show'); }); }
});

render();
</script>
<datalist id="labelsuggest"></datalist>
<script>
  const dl=document.getElementById('labelsuggest');
  const refresh=()=>{ const s=new Set(); bookmarks.forEach(b=>b.tags.forEach(t=>s.add(t))); dl.innerHTML=[...s].sort().map(t=>`<option value="${t.replace(/"/g,'&quot;')}">`).join(''); };
  const obs=new MutationObserver(refresh); obs.observe(document.getElementById('list'),{childList:true,subtree:true}); refresh();
</script>
</body>
