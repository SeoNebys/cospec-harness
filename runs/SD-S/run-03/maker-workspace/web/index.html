<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Bookmarks</h1>
    </header>

    <main>
      <form id="add-form" autocomplete="off">
        <div class="row">
          <input
            id="url-input"
            type="text"
            placeholder="Paste a web address (https://…)"
            aria-label="Web address"
            required
          />
          <input
            id="title-input"
            type="text"
            placeholder="Title (optional — fetched automatically if left blank)"
            aria-label="Title"
          />
        </div>
        <div class="row">
          <input id="tags-input" type="text" placeholder="Tags (comma separated)" aria-label="Tags" />
          <input id="note-input" type="text" placeholder="Note (optional)" aria-label="Note" />
          <button type="submit">Save</button>
        </div>
      </form>

      <p id="message" class="message" role="status" hidden></p>

      <div class="controls">
        <input id="search-input" type="search" placeholder="Search bookmarks…" aria-label="Search" />
        <select id="tag-filter" aria-label="Filter by tag">
          <option value="">All tags</option>
        </select>
      </div>

      <ul id="bookmark-list"></ul>

      <p id="empty-state" class="empty" hidden>
        No bookmarks yet. Paste a link above to save your first one.
      </p>
      <p id="no-results" class="empty" hidden>No bookmarks match your search.</p>
    </main>

    <!-- Edit dialog -->
    <dialog id="edit-dialog">
      <form id="edit-form" method="dialog">
        <h2>Edit bookmark</h2>
        <label>Address<input id="edit-url" type="text" required /></label>
        <label>Title<input id="edit-title" type="text" /></label>
        <label>Tags<input id="edit-tags" type="text" placeholder="comma separated" /></label>
        <label>Note<input id="edit-note" type="text" /></label>
        <p id="edit-message" class="message error" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="edit-cancel">Cancel</button>
          <button type="submit" id="edit-save">Save changes</button>
        </div>
      </form>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
