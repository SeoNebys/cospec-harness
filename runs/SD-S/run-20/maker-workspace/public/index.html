<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="app-header">
        <h1>Bookmarks</h1>
        <p class="tagline">Save a link, find it later.</p>
      </header>

      <main>
        <section class="save-panel" aria-label="Add a bookmark">
          <form id="save-form" class="save-form" autocomplete="off" novalidate>
            <div class="field">
              <label for="url-input">Web address</label>
              <input
                id="url-input"
                name="url"
                type="text"
                placeholder="example.com"
                required
              />
            </div>
            <div class="field">
              <label for="title-input">Title <span class="hint">(optional)</span></label>
              <input
                id="title-input"
                name="title"
                type="text"
                placeholder="A friendly name"
              />
            </div>
            <div class="field">
              <label for="tags-input">Tags <span class="hint">(comma-separated, optional)</span></label>
              <input
                id="tags-input"
                name="tags"
                type="text"
                placeholder="reading, tech"
              />
            </div>
            <button type="submit" class="btn primary">Save bookmark</button>
            <p id="form-message" class="form-message" role="alert" hidden></p>
          </form>
        </section>

        <section class="controls" aria-label="Find bookmarks">
          <input
            id="search-input"
            type="search"
            class="search"
            placeholder="Search title or address…"
            aria-label="Search bookmarks"
          />
          <label class="tag-filter-label" for="tag-filter">Tag:</label>
          <select id="tag-filter" class="tag-filter" aria-label="Filter by tag">
            <option value="">All tags</option>
          </select>
          <button id="clear-filters" type="button" class="btn subtle" hidden>
            Clear
          </button>
        </section>

        <section class="list-panel" aria-label="Saved bookmarks">
          <ul id="bookmark-list" class="bookmark-list"></ul>

          <div id="empty-state" class="state-message" hidden>
            <h2>No bookmarks yet</h2>
            <p>Add your first bookmark using the form above.</p>
          </div>

          <div id="no-results" class="state-message" hidden>
            <h2>No matching bookmarks</h2>
            <p>Try a different search or clear the filters.</p>
          </div>
        </section>
      </main>
    </div>

    <!-- Edit dialog -->
    <dialog id="edit-dialog" class="edit-dialog">
      <form id="edit-form" method="dialog" class="save-form">
        <h2>Edit bookmark</h2>
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label for="edit-url">Web address</label>
          <input id="edit-url" name="url" type="text" required />
        </div>
        <div class="field">
          <label for="edit-title">Title</label>
          <input id="edit-title" name="title" type="text" />
        </div>
        <div class="field">
          <label for="edit-tags">Tags <span class="hint">(comma-separated)</span></label>
          <input id="edit-tags" name="tags" type="text" />
        </div>
        <p id="edit-message" class="form-message" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="edit-cancel" class="btn subtle">Cancel</button>
          <button type="submit" id="edit-save" class="btn primary">Save changes</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
