<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔖</span>
      <h1>Bookmarks</h1>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" />
    </div>
    <button id="add-btn" class="btn btn-primary">+ Add bookmark</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <nav class="filters">
        <button class="filter active" data-filter="all">All bookmarks</button>
        <button class="filter" data-filter="favorites">★ Favorites</button>
      </nav>
      <div class="tags-section">
        <h2>Tags</h2>
        <ul id="tag-list" class="tag-list"></ul>
      </div>
    </aside>

    <section class="content">
      <div class="content-header">
        <h2 id="list-title">All bookmarks</h2>
        <span id="count" class="count"></span>
      </div>
      <div id="bookmarks" class="bookmarks-grid"></div>
      <div id="empty" class="empty hidden">
        <p class="empty-emoji">📭</p>
        <p class="empty-title">No bookmarks yet</p>
        <p class="empty-sub">Add your first bookmark to get started.</p>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">Add bookmark</h2>
      <form id="bookmark-form">
        <input type="hidden" id="bookmark-id" />
        <label>
          URL
          <input type="text" id="f-url" placeholder="https://example.com" required />
        </label>
        <label>
          Title
          <input type="text" id="f-title" placeholder="Example site" required />
        </label>
        <label>
          Description
          <textarea id="f-description" rows="3" placeholder="Optional notes…"></textarea>
        </label>
        <label>
          Tags <span class="hint">(comma-separated)</span>
          <input type="text" id="f-tags" placeholder="reading, work, tools" />
        </label>
        <label class="checkbox">
          <input type="checkbox" id="f-favorite" />
          Mark as favorite
        </label>
        <p id="form-error" class="form-error hidden"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
