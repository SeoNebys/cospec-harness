<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 3 (editing styles)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; }
  .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:20px 20px 60px; }

  /* prototype-only comparison control */
  .switch { background:#111827; color:#fff; border-radius:10px; padding:12px 14px; margin-bottom:22px; }
  .switch .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; opacity:.7; margin-bottom:8px; }
  .switch button { background:#374151; color:#d1d5db; border:0; border-radius:7px; padding:8px 12px;
                   font-size:13px; cursor:pointer; margin-right:6px; }
  .switch button.on { background:var(--accent); color:#fff; font-weight:600; }
  .switch .desc { font-size:12px; opacity:.85; margin-top:9px; }

  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px;
            cursor:pointer; position:relative; }
  li.card.editing { cursor:default; border-color:#c7d2fe; }
  li.card:hover .editbtn { opacity:1; }
  .editbtn { position:absolute; top:12px; right:12px; background:#f3f4f6; border:1px solid var(--line);
             border-radius:7px; font-size:12px; padding:4px 9px; cursor:pointer; opacity:0; transition:opacity .12s; }
  .title { font-size:15px; font-weight:600; margin:0; padding-right:60px; }
  .title .ext { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .desc.faded { color:var(--muted); font-style:italic; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px;
         text-align:center; line-height:14px; color:#3552b5; font-weight:700; }

  /* editing fields */
  label.f { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:10px 0 3px; }
  input.f, textarea.f { width:100%; border:1px solid #c7d2fe; border-radius:7px; padding:8px 10px; font-size:14px;
                        font-family:inherit; background:#fff; }
  textarea.f { resize:vertical; min-height:52px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row button { border:0; border-radius:7px; padding:8px 15px; font-size:13px; font-weight:600; cursor:pointer; }
  .save { background:var(--accent); color:#fff; }
  .cancel { background:#f3f4f6; color:#374151; }

  /* per-field inline (style C) */
  .fieldedit { display:flex; gap:6px; align-items:flex-start; }
  .fieldedit input, .fieldedit textarea { flex:1; }
  .pen { color:var(--accent); font-size:12px; cursor:pointer; margin-left:6px; opacity:0; }
  li.card:hover .pen { opacity:.7; }
  .ok { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; }

  /* dialog (style B) */
  .backdrop { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; }
  .backdrop.show { display:flex; }
  .dialog { background:#fff; border-radius:12px; padding:20px 22px; width:440px; max-width:92vw; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .dialog h3 { margin:0 0 4px; font-size:16px; }
  .dialog .did { color:var(--muted); font-size:12px; margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <h1>My Links</h1>
  <div class="sub">Your personal library of saved links</div>
</header>

<main>
  <div class="switch">
    <div class="lbl">Prototype control · try editing three ways</div>
    <button data-m="A" class="on">A · Edit in place</button>
    <button data-m="B">B · Edit in a pop-up</button>
    <button data-m="C">C · Edit each field</button>
    <div class="desc" id="modeDesc"></div>
  </div>

  <ul id="list"></ul>
</main>

<div class="backdrop" id="backdrop"><div class="dialog" id="dialog"></div></div>

<script>
let mode='A';
let items=[
  { url:"https://nytimes.com/2026/travel/kyoto", title:"36 Hours in Kyoto",
    desc:"Temples at dawn, a tofu lunch, and where to find the quiet streets." },
  { url:"https://medium.com/@dev/p/9f3a2b-untitled-draft-copy-2",
    title:"9f3a2b untitled draft copy 2", desc:"A page saved from medium." },
  { url:"https://cant-read.example.com/page", failed:true },
];
const MODES={
  A:"Hover a link, click Edit, and the card turns into a little form right where it sits.",
  B:"Hover a link, click Edit, and a focused pop-up opens with the fields; the library dims behind it.",
  C:"Hover a link and a small pencil appears next to each piece of text — click to fix just that one thing."
};

const list=document.getElementById('list'), backdrop=document.getElementById('backdrop'),
      dialog=document.getElementById('dialog'), modeDesc=document.getElementById('modeDesc');
let editing=null; // {i} for A, {i,field} for C

function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } }
function full(u){ return /^https?:\/\//.test(u)?u:"https://"+u; }
function esc(s){ return (s||'').replace(/</g,'&lt;'); }

function view(it,i){
  const title = it.failed
    ? `${host(it.url)}<span class="ext">· name couldn't be read</span>`
    : `${esc(it.title)}<span class="ext">↗ open</span>`;
  const desc = it.failed
    ? `<p class="desc faded">We couldn't read this page's name. It's saved and will still open — rename it below.</p>`
    : `<p class="desc">${esc(it.desc)}</p>`;
  if(mode==='C'){
    return `<li class="card editing" data-i="${i}">
      <div class="title">${fieldC(it,i,'title',title)}</div>
      <div>${fieldC(it,i,'desc',desc)}</div>
      <div class="url">${fieldC(it,i,'url',`<span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${host(it.url)}`)}</div>
    </li>`;
  }
  return `<li class="card" data-i="${i}" data-open="1">
    <button class="editbtn" data-edit="${i}">✎ Edit</button>
    <p class="title">${title}</p>${desc}
    <div class="url"><span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${host(it.url)}</div>
  </li>`;
}
function fieldC(it,i,field,shown){
  if(editing && editing.i===i && editing.field===field){
    const val = field==='url'?it.url:(it[field]||'');
    const inp = field==='desc'
      ? `<textarea class="f" id="fe">${esc(val)}</textarea>`
      : `<input class="f" id="fe" value="${esc(val)}">`;
    return `<div class="fieldedit">${inp}<button class="ok" data-ok="1">Save</button></div>`;
  }
  return `${shown}<span class="pen" data-pen="${i}|${field}">✎</span>`;
}
function formA(it,i){
  return `<li class="card editing" data-i="${i}">
    <label class="f">Name</label><input class="f" id="a-title" value="${esc(it.title||'')}">
    <label class="f">Description</label><textarea class="f" id="a-desc">${esc(it.desc||'')}</textarea>
    <label class="f">Web address</label><input class="f" id="a-url" value="${esc(it.url||'')}">
    <div class="row"><button class="save" data-save="${i}">Save</button><button class="cancel" data-cancel="1">Cancel</button></div>
  </li>`;
}
function render(){
  modeDesc.textContent=MODES[mode];
  list.innerHTML=items.map((it,i)=> (mode==='A'&&editing&&editing.i===i)? formA(it,i) : view(it,i)).join('');
  const feEl=document.getElementById('fe'); if(feEl) feEl.focus();
}
function openDialogB(i){
  const it=items[i];
  dialog.innerHTML=`<h3>Edit this link</h3><div class="did">${host(it.url)}</div>
    <label class="f">Name</label><input class="f" id="b-title" value="${esc(it.title||'')}">
    <label class="f">Description</label><textarea class="f" id="b-desc">${esc(it.desc||'')}</textarea>
    <label class="f">Web address</label><input class="f" id="b-url" value="${esc(it.url||'')}">
    <div class="row"><button class="save" data-bsave="${i}">Save</button><button class="cancel" data-bcancel="1">Cancel</button></div>`;
  backdrop.classList.add('show');
}

document.querySelector('.switch').addEventListener('click',e=>{
  const b=e.target.closest('button[data-m]'); if(!b) return;
  mode=b.dataset.m; editing=null; backdrop.classList.remove('show');
  document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
list.addEventListener('click',e=>{
  const edit=e.target.closest('[data-edit]'), save=e.target.closest('[data-save]'),
        cancel=e.target.closest('[data-cancel]'), pen=e.target.closest('[data-pen]'),
        ok=e.target.closest('[data-ok]'), card=e.target.closest('[data-open]');
  if(edit){ e.stopPropagation();
    if(mode==='A'){ editing={i:+edit.dataset.edit}; render(); }
    else if(mode==='B'){ openDialogB(+edit.dataset.edit); }
    return; }
  if(save){ const i=+save.dataset.save;
    items[i]={ url:document.getElementById('a-url').value.trim(),
      title:document.getElementById('a-title').value, desc:document.getElementById('a-desc').value, failed:false };
    editing=null; render(); return; }
  if(cancel){ editing=null; render(); return; }
  if(pen){ const [i,field]=pen.dataset.pen.split('|'); editing={i:+i,field}; render(); return; }
  if(ok){ const {i,field}=editing; const v=document.getElementById('fe').value;
    if(field==='url'){ items[i].url=v.trim(); } else { items[i][field]=v; items[i].failed=false; }
    editing=null; render(); return; }
  if(card){ window.open(full(items[+card.dataset.i].url),'_blank'); }
});
dialog.addEventListener('click',e=>{
  const s=e.target.closest('[data-bsave]'), c=e.target.closest('[data-bcancel]');
  if(s){ const i=+s.dataset.bsave;
    items[i]={ url:document.getElementById('b-url').value.trim(),
      title:document.getElementById('b-title').value, desc:document.getElementById('b-desc').value, failed:false };
    backdrop.classList.remove('show'); render(); }
  if(c){ backdrop.classList.remove('show'); }
});
backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.classList.remove('show'); });
render();
</script>
</body>
</html>
