<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — add a note</title><style>
:root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--accent:#176b4d;--wash:#eaf3ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(920px,calc(100% - 40px));margin:45px auto}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:40px;letter-spacing:-.04em;margin:9px 0 12px}.intro{color:var(--muted);font-size:17px;margin:0 0 24px}.capture{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 35px rgba(30,55,43,.08)}.mainrow{display:flex;gap:10px}.url{flex:1;border:0;outline:none;font:inherit;font-size:15px;padding:11px 12px}.save{border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:720;padding:12px 20px;cursor:pointer}.details{border-top:1px solid var(--line);margin-top:10px;padding:13px 12px 5px}.note-label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.note-label span{font-weight:400;color:var(--muted)}textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;outline:none}.extras{display:flex;align-items:center;gap:18px;margin-top:11px}.tag{border:0;border-radius:999px;background:var(--wash);color:#10533b;padding:7px 10px;font-size:12px;font-weight:700}.later{display:flex;align-items:center;gap:7px;font-size:13px}.later input{accent-color:var(--accent)}.reveal{border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:5px 0;cursor:pointer}.reveal-style .note-wrap{display:none}.visible-style .reveal{display:none}.collection{margin-top:36px}.head{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:14px}.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}.title{font-weight:730;font-size:18px;color:var(--ink);text-decoration:none}.description{margin:6px 0 9px;color:var(--muted)}.address{font-size:12px;color:var(--accent)}.card-note{margin-top:13px;padding:11px 13px;border-left:3px solid #9ec2af;background:#f5f8f6;color:#46534d;font-size:14px}@media(max-width:620px){header{padding:0 20px}.mainrow{flex-direction:column}.extras{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Personal library</div></header><main data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>Save a link</h1><p class="intro">Paste a link, add anything useful, and let Keepmark handle the rest.</p><form class="capture" id="form"><div class="mainrow"><input class="url" value="https://developer.mozilla.org/en-US/docs/Web/JavaScript" aria-label="Web address"><button class="save">Save link</button></div><div class="details"><button type="button" class="reveal">＋ Add a note</button><div class="note-wrap"><label class="note-label" for="note">Your note <span>— optional</span></label><textarea id="note" placeholder="What do you want to remember?"></textarea></div><div class="extras"><div><span style="font-size:13px;color:var(--muted);margin-right:7px">Tags</span><button type="button" class="tag">javascript</button><button type="button" class="tag">reference</button></div><label class="later"><input type="checkbox"> Add to Read later</label></div></div></form><section class="collection"><div class="head"><h2>All bookmarks</h2><span class="count" id="count">0 bookmarks</span></div><div id="result"></div></section></main><script>
const reveal=new URLSearchParams(location.search).get('style')==='reveal';document.querySelector('main').classList.add(reveal?'reveal-style':'visible-style');document.querySelector('.reveal').onclick=()=>{document.querySelector('.note-wrap').style.display='block';document.querySelector('.reveal').style.display='none';document.querySelector('#note').focus()};document.querySelector('#form').onsubmit=e=>{e.preventDefault();const note=document.querySelector('#note').value;document.querySelector('#count').textContent='1 bookmark';document.querySelector('#result').innerHTML=`<article class="card"><a class="title" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript">JavaScript | MDN</a><p class="description">JavaScript is a scripting language that enables you to create dynamically updating content and much more.</p><div class="address">https://developer.mozilla.org/en-US/docs/Web/JavaScript</div>${note?`<div class="card-note">${note}</div>`:''}</article>`};
</script></body></html>
