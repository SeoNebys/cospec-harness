<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 19 (saved views)</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#3b5bdb; --bg:#f7f7f9; --danger:#c0392b; --gold:#e8a90c; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:0; background:var(--bg); color:#1a1a1e; }
  .top { background:#fff; border-bottom:1px solid var(--line); padding:16px 22px; }
  .top h1 { font-size:19px; margin:0 0 12px; }
  .searchbar { position:relative; max-width:520px; }
  #search { width:100%; padding:10px 14px 10px 36px; border:1px solid var(--line); border-radius:20px; font-size:14px; }
  .searchbar .icon { position:absolute; left:12px; top:9px; color:var(--muted); }
  .active { margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; min-height:32px; }
  .fchip { border-radius:14px; padding:3px 10px; display:inline-flex; gap:6px; align-items:center; }
  .fchip.inc { background:#eaefff; color:var(--accent); } .fchip.exc { background:#fdecea; color:var(--danger); }
  .fchip button { border:0; background:transparent; cursor:pointer; font-size:14px; line-height:1; padding:0; color:inherit; }
  .modeSwitch { display:inline-flex; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .modeSwitch button { border:0; background:#fff; color:#555; font-size:12px; padding:4px 10px; cursor:pointer; }
  .modeSwitch button.on { background:var(--accent); color:#fff; }
  .saveView { border:1px solid var(--gold); background:#fff9ec; color:#9a7407; border-radius:14px; padding:4px 11px; font-size:12.5px; cursor:pointer; }
  .clear { border:0; background:transparent; color:var(--accent); cursor:pointer; text-decoration:underline; font-size:13px; }
  .muted { color:var(--muted); }

  .layout { display:flex; max-width:1040px; margin:0 auto; gap:24px; padding:22px; align-items:flex-start; }
  .side { width:230px; flex:none; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; position:sticky; top:22px; }
  .side h2 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:4px 6px 8px; }
  .views { margin-bottom:8px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .view { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:8px; font-size:13.5px; cursor:pointer; }
  .view:hover { background:#f2f3f7; } .view.on { background:#fff4d6; }
  .view .star { color:var(--gold); } .view .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .view .rm { border:0; background:transparent; color:#bbb; cursor:pointer; font-size:13px; opacity:0; }
  .view:hover .rm { opacity:1; }
  .noviews { font-size:12px; color:#a0a0a8; padding:2px 8px 4px; line-height:1.4; }
  .lbl { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-radius:8px; font-size:14px; }
  .lbl:hover { background:#f2f3f7; } .lbl .name { cursor:pointer; flex:1; }
  .lbl.inc { background:var(--accent); color:#fff; } .lbl.exc { background:#fdecea; color:var(--danger); }
  .lbl .n { font-size:12px; color:var(--muted); margin:0 6px; } .lbl.inc .n { color:#dfe6ff; }
  .lbl .ex { border:1px solid var(--line); background:#fff; color:#bcbcc4; border-radius:6px; font-size:11px; padding:1px 7px; cursor:pointer; opacity:.55; }
  .lbl .ex::before { content:"–"; } .lbl:hover .ex { opacity:1; color:var(--danger); }
  .lbl.exc .ex { opacity:1; background:var(--danger); color:#fff; border-color:var(--danger); }

  .main { flex:1; min-width:0; }
  .count { font-size:13px; color:var(--muted); margin:2px 2px 14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:9px; }
  .card .title { font-size:15px; font-weight:600; margin:0 0 2px; } .card .url { font-size:12px; color:var(--accent); }
  .card .lbls { margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; } .card .lbls span { background:#eef0f4; color:#444; border-radius:12px; padding:2px 9px; font-size:12px; }
  .empty { background:#fff; border:1px dashed var(--line); border-radius:10px; padding:26px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
  <div class="top">
    <h1>My Bookmarks</h1>
    <div class="searchbar"><span class="icon">⌕</span><input id="search" type="text" placeholder="Search…" autocomplete="off"></div>
    <div class="active" id="activeRow"></div>
  </div>
  <div class="layout">
    <div class="side">
      <h2>Your views</h2>
      <div class="views" id="views"></div>
      <h2>Labels</h2>
      <div id="labels"></div>
    </div>
    <div class="main">
      <div class="count" id="count"></div>
      <div id="cards"></div>
    </div>
  </div>

<script>
  const DATA=[
    {t:"Simplest Brothy Beans and Rice",u:"smittenkitchen.com/beans",l:["recipes","dinner"]},
    {t:"Sheet-Pan Chicken",u:"cooking.nytimes.com/sheet-pan",l:["recipes","dinner"]},
    {t:"The Best Banana Bread",u:"kingarthurbaking.com/banana-bread",l:["recipes","baking"]},
    {t:"Homemade Pizza Dough",u:"kingarthurbaking.com/pizza",l:["recipes","baking","dinner"]},
    {t:"Weeknight Dal",u:"food52.com/dal",l:["recipes","dinner"]},
    {t:"ripgrep — regex search",u:"github.com/ripgrep",l:["tools","coding"]},
    {t:"A Perfect Day in Kyoto",u:"natgeo.com/kyoto",l:["travel"]}
  ];
  const counts={}; DATA.forEach(b=>b.l.forEach(l=>counts[l]=(counts[l]||0)+1));
  const allLabels=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));

  let include=new Set(), exclude=new Set(), mode="all", query="";
  let savedViews=[{name:"Dinner, no baking", inc:["recipes","dinner"], exc:["baking"], mode:"all", q:""}];
  let activeView=null;

  const el=id=>document.getElementById(id);
  const labelsEl=el("labels"),viewsEl=el("views"),cardsEl=el("cards"),countEl=el("count"),activeRow=el("activeRow"),searchEl=el("search");

  const filterActive = ()=> include.size||exclude.size||query.trim();

  function toggleInclude(l){ include.has(l)?include.delete(l):(include.add(l),exclude.delete(l)); activeView=null; render(); }
  function toggleExclude(l){ exclude.has(l)?exclude.delete(l):(exclude.add(l),include.delete(l)); activeView=null; render(); }

  function applyView(v){ include=new Set(v.inc); exclude=new Set(v.exc); mode=v.mode; query=v.q; searchEl.value=v.q; activeView=v.name; render(); }
  function saveCurrent(){
    const name=prompt("Name this view:", suggestName()); if(!name||!name.trim()) return;
    savedViews.push({name:name.trim(), inc:[...include], exc:[...exclude], mode, q:query.trim()});
    activeView=name.trim(); render();
  }
  function suggestName(){ const inc=[...include].join(", "); const exc=[...exclude].map(x=>"not "+x).join(", ");
    return [inc,exc].filter(Boolean).join(", ")||(query.trim()?('“'+query.trim()+'”'):""); }

  function renderViews(){
    viewsEl.innerHTML="";
    if(!savedViews.length){ viewsEl.innerHTML='<div class="noviews">Build a filter, then “Save this view” to pin it here.</div>'; return; }
    savedViews.forEach((v,i)=>{
      const d=document.createElement("div"); d.className="view"+(activeView===v.name?" on":"");
      d.innerHTML='<span class="star">★</span><span class="nm"></span><button class="rm" title="remove">×</button>';
      d.querySelector(".nm").textContent=v.name;
      d.querySelector(".nm").addEventListener("click",()=>applyView(v));
      d.querySelector(".star").addEventListener("click",()=>applyView(v));
      d.querySelector(".rm").addEventListener("click",e=>{e.stopPropagation(); savedViews.splice(i,1); if(activeView===v.name) activeView=null; render();});
      viewsEl.appendChild(d);
    });
  }
  function renderLabels(){
    labelsEl.innerHTML="";
    allLabels.forEach(l=>{
      const d=document.createElement("div"); d.className="lbl"+(include.has(l)?" inc":"")+(exclude.has(l)?" exc":"");
      d.innerHTML='<span class="name">'+l+'</span><span class="n">'+counts[l]+'</span><button class="ex" title="exclude"></button>';
      d.querySelector(".name").addEventListener("click",()=>toggleInclude(l));
      d.querySelector(".ex").addEventListener("click",e=>{e.stopPropagation(); toggleExclude(l);});
      labelsEl.appendChild(d);
    });
  }
  function pass(b,q){
    if(q && !q.split(/\s+/).filter(Boolean).every(t=>[b.t,b.u,...b.l].join(" ").toLowerCase().includes(t))) return false;
    for(const l of exclude) if(b.l.includes(l)) return false;
    if(include.size){ if(mode==="all"){ for(const l of include) if(!b.l.includes(l)) return false; }
      else if(![...include].some(l=>b.l.includes(l))) return false; }
    return true;
  }
  function renderActive(){
    activeRow.innerHTML="";
    if(!filterActive()){ activeRow.innerHTML='<span class="muted">Showing everything.</span>'; return; }
    [...include].forEach(l=>{ const c=document.createElement("span"); c.className="fchip inc"; c.innerHTML=l+' <button>×</button>';
      c.querySelector("button").addEventListener("click",()=>toggleInclude(l)); activeRow.appendChild(c); });
    if(include.size>=2){ const ms=document.createElement("span"); ms.className="modeSwitch";
      ms.innerHTML='<button data-m="all" class="'+(mode==="all"?"on":"")+'">all</button><button data-m="any" class="'+(mode==="any"?"on":"")+'">any</button>';
      ms.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.m; activeView=null; render();})); activeRow.appendChild(ms); }
    [...exclude].forEach(l=>{ const c=document.createElement("span"); c.className="fchip exc"; c.innerHTML='not '+l+' <button>×</button>';
      c.querySelector("button").addEventListener("click",()=>toggleExclude(l)); activeRow.appendChild(c); });
    const sv=document.createElement("button"); sv.className="saveView"; sv.textContent= activeView? "★ Saved as “"+activeView+"”" : "☆ Save this view";
    if(!activeView) sv.addEventListener("click",saveCurrent); activeRow.appendChild(sv);
    const clr=document.createElement("button"); clr.className="clear"; clr.textContent="clear";
    clr.addEventListener("click",()=>{include.clear();exclude.clear();query="";searchEl.value="";activeView=null;render();}); activeRow.appendChild(clr);
  }
  function render(){
    const q=query.trim().toLowerCase(); const res=DATA.filter(b=>pass(b,q));
    renderViews(); renderActive();
    countEl.textContent=res.length+(res.length===1?" bookmark":" bookmarks")+(filterActive()?" match":"");
    if(!res.length){ cardsEl.innerHTML='<div class="empty">Nothing matches.</div>'; renderLabels(); return; }
    cardsEl.innerHTML="";
    res.forEach(b=>{ const c=document.createElement("div"); c.className="card";
      c.innerHTML='<p class="title"></p><div class="url"></div><div class="lbls">'+b.l.map(l=>'<span>'+l+'</span>').join('')+'</div>';
      c.querySelector(".title").textContent=b.t; c.querySelector(".url").textContent=b.u; cardsEl.appendChild(c); });
    renderLabels();
  }
  searchEl.addEventListener("input",e=>{query=e.target.value; activeView=null; render();});
  render();
</script>
</body>
</html>
