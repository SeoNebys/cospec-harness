<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; background: #f5f6f8; color: #1c2330;
  }
  header {
    background: #fff; border-bottom: 1px solid #e3e6ea;
    padding: 18px 20px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: #6b7480; font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 20px; }
  .save-box {
    background: #fff; border: 1px solid #e3e6ea; border-radius: 10px;
    padding: 16px; display: flex; gap: 10px; flex-wrap: wrap;
  }
  .save-box input {
    flex: 1 1 260px; min-width: 0; padding: 11px 12px; font-size: 15px;
    border: 1px solid #cfd4da; border-radius: 8px;
  }
  .save-box button {
    padding: 11px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: #2f6fed; color: #fff; border: none; border-radius: 8px;
  }
  .save-box button:hover { background: #2258c9; }
  .hint { color: #6b7480; font-size: 12px; margin: 8px 2px 0; }
  .err { color: #c0392b; font-size: 13px; margin: 8px 2px 0; display: none; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em;
       color: #6b7480; margin: 26px 2px 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.card {
    background: #fff; border: 1px solid #e3e6ea; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  li.card .title { font-size: 16px; font-weight: 600; }
  li.card a { color: #2f6fed; text-decoration: none; word-break: break-all;
              font-size: 13px; }
  li.card .meta { color: #94a0ad; font-size: 12px; margin-top: 6px; }
  .empty {
    text-align: center; color: #94a0ad; padding: 40px 20px;
    border: 1px dashed #cfd4da; border-radius: 10px; background: #fff;
  }
</style>
</head>
<body>
<header>
  <h1>My Bookmarks</h1>
  <p>Save a link and it will appear in your list below.</p>
</header>
<main>
  <div class="save-box">
    <input id="url" type="text" placeholder="Paste or type a link (e.g. https://example.com/article)" />
    <button id="saveBtn">Save link</button>
  </div>
  <div class="err" id="err"></div>
  <p class="hint">Tip: paste a web address and press Save. We'll show its name so you can recognise it later.</p>

  <h2>Saved links (<span id="count">0</span>)</h2>
  <ul id="list"></ul>
  <div class="empty" id="empty">No links saved yet. Paste a link above to get started.</div>
</main>

<script>
  var links = [];

  function nameFromUrl(raw) {
    // Derive a friendly name from the URL's last meaningful path segment.
    try {
      var u = new URL(raw);
      var seg = u.pathname.split('/').filter(Boolean).pop();
      if (seg) {
        seg = decodeURIComponent(seg).replace(/[-_]+/g, ' ').replace(/\.[a-z0-9]+$/i, '');
        if (seg.trim()) return seg.trim().replace(/\b\w/g, function(c){ return c.toUpperCase(); });
      }
      return u.hostname.replace(/^www\./, '');
    } catch (e) {
      return raw;
    }
  }

  function normalise(raw) {
    var v = raw.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { new URL(v); } catch (e) { return null; }
    return v;
  }

  function render() {
    var list = document.getElementById('list');
    var empty = document.getElementById('empty');
    document.getElementById('count').textContent = links.length;
    list.innerHTML = '';
    if (links.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    links.forEach(function (item) {
      var host = '';
      try { host = new URL(item.url).hostname.replace(/^www\./, ''); } catch (e) {}
      var li = document.createElement('li');
      li.className = 'card';
      li.innerHTML =
        '<div class="title"></div>' +
        '<a href="' + item.url + '" target="_blank" rel="noopener"></a>' +
        '<div class="meta">' + host + ' · saved just now</div>';
      li.querySelector('.title').textContent = item.title;
      li.querySelector('a').textContent = item.url;
      list.appendChild(li);
    });
  }

  function save() {
    var input = document.getElementById('url');
    var err = document.getElementById('err');
    var url = normalise(input.value);
    if (!url) {
      err.textContent = 'That doesn\'t look like a valid link. Try something like example.com/page.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    links.unshift({ url: url, title: nameFromUrl(url) });
    input.value = '';
    input.focus();
    render();
  }

  document.getElementById('saveBtn').addEventListener('click', save);
  document.getElementById('url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') save();
  });

  render();
  document.body.setAttribute('data-harness-ready', 'true');
</script>
</body>
</html>
