<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — a large library</title><style>
:root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--accent:#176b4d;--wash:#eaf3ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(980px,calc(100% - 40px));margin:40px auto}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:38px;letter-spacing:-.04em;margin:8px 0 20px}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 15px;font:inherit;background:#fff}.head{display:flex;justify-content:space-between;margin:26px 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:14px}.cards{display:grid;gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 18px}.title{font-weight:730;color:var(--ink);text-decoration:none}.meta{display:flex;gap:10px;margin-top:6px;color:var(--muted);font-size:12px}.tag{background:var(--wash);color:#10533b;padding:3px 7px;border-radius:999px}.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin:23px 0 50px}.controls button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer}.controls .primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}.load-style .pages{display:none}.page-style .load{display:none}.status{text-align:center;color:var(--muted);font-size:13px;margin-top:-12px}@media(max-width:620px){header{padding:0 20px}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Personal library</div></header><main data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>All bookmarks</h1><input class="search" placeholder="Search titles, notes, addresses, and tags…"><div class="head"><h2>Recently saved</h2><span class="count">428 bookmarks</span></div><div class="cards" id="cards"></div><div class="controls pages"><button disabled>Previous</button><span id="page-label">Page 1 of 54</span><button class="primary" id="next">Next</button></div><div class="controls load"><button class="primary" id="load">Show older bookmarks</button></div><div class="status" id="status"></div></main><script>
const loadStyle=new URLSearchParams(location.search).get('style')==='load';document.querySelector('main').classList.add(loadStyle?'load-style':'page-style');const names=['Patterns.dev','JavaScript | MDN','A Complete Guide to Flexbox','The Marginalian','Linear Method','Designing Data-Intensive Applications','Refactoring UI','Web Content Accessibility Guidelines'];const cards=document.querySelector('#cards');function render(offset=0,append=false){const html=names.map((n,i)=>`<article class="card"><a class="title" href="#">${n}${offset?' — older save':''}</a><div class="meta"><span>Saved ${offset?'last month':'recently'}</span><span class="tag">${i%2?'reference':'reading'}</span></div></article>`).join('');if(append)cards.insertAdjacentHTML('beforeend',html);else cards.innerHTML=html}render();document.querySelector('#next').onclick=()=>{render(1);document.querySelector('#page-label').textContent='Page 2 of 54';document.querySelector('#status').textContent='Showing bookmarks 9–16 of 428';window.scrollTo({top:0})};document.querySelector('#load').onclick=()=>{render(1,true);document.querySelector('#status').textContent='Showing 16 of 428 bookmarks';document.querySelector('#load').textContent='Show more'};
</script></body></html>
