<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Bookmarks</h1>
    </header>

    <main class="container">
      <section class="add-panel">
        <form id="add-form" class="add-form" autocomplete="off">
          <input
            type="text"
            id="add-url"
            name="url"
            placeholder="Paste a link (e.g. example.com/article)"
            aria-label="Bookmark address"
            required
          />
          <input
            type="text"
            id="add-tags"
            name="tags"
            list="tag-suggestions"
            placeholder="tags, comma separated"
            aria-label="Tags"
          />
          <datalist id="tag-suggestions"></datalist>
          <button type="submit" id="add-btn">Save</button>
        </form>
        <p id="add-error" class="error" role="alert" hidden></p>
      </section>

      <section class="controls">
        <input
          type="search"
          id="search"
          placeholder="Search title, description, address or tag…"
          aria-label="Search bookmarks"
        />
        <select id="tag-filter" aria-label="Filter by tag">
          <option value="">All tags</option>
        </select>
      </section>

      <section id="list-region" aria-live="polite">
        <ul id="bookmark-list" class="bookmark-list"></ul>
        <p id="empty-state" class="empty" hidden>
          No bookmarks yet. Save your first link above.
        </p>
        <p id="no-results" class="empty" hidden>
          No bookmarks match your search or filter.
        </p>
      </section>
    </main>

    <!-- Edit dialog -->
    <dialog id="edit-dialog">
      <form id="edit-form" method="dialog">
        <h2>Edit bookmark</h2>
        <label>Address<input type="text" id="edit-url" required /></label>
        <label>Title<input type="text" id="edit-title" /></label>
        <label>Description<textarea id="edit-description" rows="3"></textarea></label>
        <label>Tags (comma separated)
          <input type="text" id="edit-tags" list="tag-suggestions" />
        </label>
        <p id="edit-error" class="error" role="alert" hidden></p>
        <menu class="dialog-actions">
          <button type="button" id="edit-cancel" value="cancel">Cancel</button>
          <button type="submit" id="edit-save" value="save">Save changes</button>
        </menu>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
