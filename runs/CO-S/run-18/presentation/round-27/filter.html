<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — filter by tag</title><style>
:root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--white:#fff;--accent:#176b4d;--wash:#eaf3ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(1080px,calc(100% - 40px));margin:42px auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:38px;letter-spacing:-.04em;margin:8px 0 0}.save{color:var(--accent);font-weight:700;border:1px solid #bcd4c7;background:#fff;border-radius:9px;padding:10px 14px}.search{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 16px;font:inherit;font-size:15px}.layout{display:grid;grid-template-columns:190px 1fr;gap:28px;margin-top:27px}.side{border-right:1px solid var(--line);padding-right:22px}.side h2,.bar strong{font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 11px;color:var(--muted)}.filter{display:flex;width:100%;border:0;background:transparent;border-radius:8px;padding:9px 10px;margin:2px 0;font:inherit;color:var(--ink);cursor:pointer;justify-content:space-between}.filter:hover{background:#f0f4f2}.filter.active{background:var(--wash);color:#10533b;font-weight:720}.num{color:var(--muted);font-size:12px}.bar{display:none;margin:24px 0 4px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.active{border-color:var(--accent);background:var(--accent);color:#fff}.content-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0}.count{font-size:14px;color:var(--muted)}.cards{display:grid;gap:12px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px}.title{font-weight:730;font-size:18px;color:var(--ink);text-decoration:none}.description{margin:6px 0 9px;color:var(--muted)}.url{font-size:12px;color:var(--accent)}.tags{display:flex;gap:6px;margin-top:12px}.tag{background:var(--wash);color:#10533b;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.chip-style .layout{display:block;margin-top:12px}.chip-style .side{display:none}.chip-style .bar{display:block}.hidden{display:none}@media(max-width:650px){header{padding:0 20px}.layout{display:block}.side{border:0;padding:0;margin-bottom:20px}}
</style></head><body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Personal library</div></header><main data-harness-ready="true"><div class="top"><div><div class="eyebrow">Your bookmark library</div><h1>All bookmarks</h1></div><button class="save">＋ Save a link</button></div><input class="search" placeholder="Search titles, notes, addresses, and tags…" aria-label="Search bookmarks"><div class="bar"><strong>Filter by tag</strong><div class="chips" id="chips"></div></div><div class="layout"><aside class="side"><h2>Tags</h2><div id="side-filters"></div></aside><section><div class="content-head"><h2 id="heading">All bookmarks</h2><span class="count" id="count"></span></div><div class="cards" id="cards"></div></section></div></main><script>
const items=[{title:'Patterns.dev',description:'A free book on design patterns for powerful web apps.',url:'https://www.patterns.dev/',tags:['javascript','reference']},{title:'JavaScript | MDN',description:'A guide to the JavaScript scripting language.',url:'https://developer.mozilla.org/en-US/docs/Web/JavaScript',tags:['javascript','reference']},{title:'A Complete Guide to Flexbox',description:'A visual guide to CSS flexbox.',url:'https://css-tricks.com/snippets/css/a-guide-to-flexbox/',tags:['css','reference']},{title:'The Marginalian',description:'Long-form writing on books, philosophy, and creativity.',url:'https://www.themarginalian.org/',tags:['reading']},{title:'Linear Method',description:'Practices for building product and creating momentum.',url:'https://linear.app/method',tags:['product','work']}];const all=['All','javascript','reference','css','reading','product','work'];let active='All';const side=document.querySelector('#side-filters'),chips=document.querySelector('#chips'),cards=document.querySelector('#cards'),heading=document.querySelector('#heading'),count=document.querySelector('#count');if(new URLSearchParams(location.search).get('style')==='chips')document.querySelector('main').classList.add('chip-style');function controls(){const html=all.map(t=>`<button class="filter ${t===active?'active':''}" data-tag="${t}"><span>${t}</span><span class="num">${t==='All'?items.length:items.filter(i=>i.tags.includes(t)).length}</span></button>`).join('');side.innerHTML=html;chips.innerHTML=all.map(t=>`<button class="chip ${t===active?'active':''}" data-tag="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{active=b.dataset.tag;render()})}function render(){const shown=active==='All'?items:items.filter(i=>i.tags.includes(active));heading.textContent=active==='All'?'All bookmarks':active;count.textContent=`${shown.length} ${shown.length===1?'bookmark':'bookmarks'}`;cards.innerHTML=shown.map(i=>`<article class="card"><a class="title" href="${i.url}" target="_blank">${i.title}</a><p class="description">${i.description}</p><div class="url">${i.url}</div><div class="tags">${i.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></article>`).join('');controls()}render();
</script></body></html>
