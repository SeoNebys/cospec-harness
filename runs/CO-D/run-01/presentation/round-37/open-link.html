<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keep — Open bookmark</title><style>:root{--ink:#14251d;--muted:#68736e;--line:#dfe6e2;--brand:#176b4b;--pale:#e5f4ec}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui;color:var(--ink);background:#f2f5f2}.shell{max-width:1040px;min-height:100vh;margin:auto;background:#fbfcfa}.head{height:74px;padding:20px 38px;border-bottom:1px solid var(--line);font-size:19px;font-weight:760}.mark{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;color:#fff;background:var(--brand);border-radius:10px 10px 10px 3px}main{max-width:760px;margin:auto;padding:60px 28px}h1{margin:0 0 20px;font-size:28px}.card{position:relative;display:grid;grid-template-columns:110px 1fr auto;gap:18px;padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff}.card.clickable{cursor:pointer}.card.clickable:hover{border-color:#92bba9;box-shadow:0 8px 24px #173a2914}.thumb{min-height:105px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#d9eadf,#82b49d);font-size:34px}.domain{color:var(--muted);font-size:11px}.title{display:inline-block;margin:4px 0;font-size:18px;font-weight:750;color:var(--ink)}a.title:hover{text-decoration-color:var(--brand)}.desc{margin:0;color:var(--muted);font-size:13px}.cue{margin-top:11px;color:var(--brand);font-size:12px;font-weight:700}.controls{display:flex;gap:7px}.controls button{width:38px;height:38px;border:0;border-radius:9px;background:#eef2ef;cursor:pointer;font-size:17px}</style></head><body><div class="shell" data-harness-ready="true"><div class="head"><span class="mark">↗</span>Keep</div><main><h1>All bookmarks</h1><article class="card" id="card"><div class="thumb">✦</div><div><div class="domain">fortelabs.com</div><div id="titleSlot"></div><p class="desc">A simple system for organizing digital information.</p><div class="cue" id="cue"></div></div><div class="controls"><button aria-label="Read later">▣</button><button aria-label="More actions">•••</button></div></article></main></div><script>const v=new URLSearchParams(location.search).get('v')||'a',slot=document.querySelector('#titleSlot');if(v==='a')slot.innerHTML='<a class="title" href="original.html" target="_blank">My PARA reference ↗</a>';else{slot.innerHTML='<span class="title">My PARA reference</span>';cue.textContent='Open original ↗';card.classList.add('clickable');card.onclick=e=>{if(!e.target.closest('button'))window.open('original.html','_blank')}};</script></body></html>
