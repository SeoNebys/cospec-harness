<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Links — prototype 5 (narrow by topic)</title>
<style>
  :root { --line:#e3e3e6; --muted:#6b7280; --accent:#2563eb; --bg:#f7f7f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#111827; background:var(--bg); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:13px; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:20px 20px 60px; }

  .switch { background:#111827; color:#fff; border-radius:10px; padding:12px 14px; margin-bottom:18px; }
  .switch .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; opacity:.7; margin-bottom:8px; }
  .switch button { background:#374151; color:#d1d5db; border:0; border-radius:7px; padding:8px 12px; font-size:13px; cursor:pointer; margin-right:6px; }
  .switch button.on { background:var(--accent); color:#fff; font-weight:600; }
  .switch .desc { font-size:12px; opacity:.85; margin-top:9px; }

  /* control B: topics bar */
  .topicsbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .topicsbar .t { background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .topicsbar .t .c { color:var(--muted); font-size:11px; margin-left:5px; }
  .topicsbar .t.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .topicsbar .t.on .c { color:#dbe3ff; }

  /* control C: dropdown */
  .dropwrap { margin-bottom:16px; }
  select { font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }

  .active { display:none; align-items:center; gap:10px; background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; border-radius:8px; padding:9px 13px; margin-bottom:14px; font-size:13px; }
  .active.show { display:flex; }
  .active button { margin-left:auto; background:#fff; border:1px solid #c7d2fe; color:#3730a3; border-radius:7px; padding:5px 11px; cursor:pointer; font-size:12px; }

  .count { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:0 2px 10px; }
  ul { list-style:none; margin:0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; position:relative; cursor:pointer; }
  .title { font-size:15px; font-weight:600; margin:0; }
  .title .ext { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .desc { color:#374151; font-size:13px; margin:5px 0 0; line-height:1.45; }
  .url { color:var(--muted); font-size:12px; margin-top:7px; display:flex; align-items:center; gap:6px; }
  .fav { width:14px; height:14px; border-radius:3px; background:#dbe3ff; display:inline-block; font-size:9px; text-align:center; line-height:14px; color:#3552b5; font-weight:700; }
  .tags { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#eef2ff; color:#3730a3; font-size:11px; border-radius:20px; padding:3px 10px; }
  .tag.click { cursor:pointer; }
  .tag.click:hover { background:#c7d2fe; }
  .tag.act { background:var(--accent); color:#fff; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; font-size:14px; }
</style>
</head>
<body>
<header><h1>My Links</h1><div class="sub">Your personal library of saved links</div></header>
<main>
  <div class="switch">
    <div class="lbl">Prototype control · try narrowing three ways</div>
    <button data-m="A" class="on">A · Click a pill on a card</button>
    <button data-m="B">B · Topics bar</button>
    <button data-m="C">C · Dropdown</button>
    <div class="desc" id="modeDesc"></div>
  </div>

  <div id="controls"></div>
  <div class="active" id="active"></div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</main>

<script>
let mode='A', filter=null;
const MODES={
  A:"The label pills already on each card become clickable. Click \"recipes\" on any card and everything else falls away. Nothing new on screen.",
  B:"A bar of all your topics sits above the library, each with a count. Click one to narrow. You see every topic at a glance — even ones not currently on screen.",
  C:"A single \"Filter by topic\" dropdown. Compact, but topics are hidden until you open it."
};
let items=[
  { url:"https://wikipedia.org/wiki/Sourdough", title:"Sourdough — Wikipedia", desc:"Bread by fermentation of dough.", tags:["recipes","baking"] },
  { url:"https://seriouseats.com/pizza-dough", title:"The Best Pizza Dough", desc:"A cold-ferment dough for blistered crust.", tags:["recipes","baking"] },
  { url:"https://nytimes.com/2026/travel/kyoto", title:"36 Hours in Kyoto", desc:"Temples at dawn and quiet streets.", tags:["travel"] },
  { url:"https://atlasobscura.com/lisbon", title:"Hidden Lisbon", desc:"Miradouros, trams, and pastel de nata.", tags:["travel"] },
  { url:"https://stripe.com/blog/payment-api", title:"Designing the Stripe Payments API", desc:"Idempotency and versioning at scale.", tags:["work","dev"] },
  { url:"https://linear.app/method", title:"The Linear Method", desc:"How a focused team ships software.", tags:["work"] },
  { url:"https://reactjs.org/hooks", title:"Thinking in Hooks", desc:"State and effects without classes.", tags:["dev"] },
];
function tagCounts(){ const m={}; items.forEach(i=>i.tags.forEach(t=>m[t]=(m[t]||0)+1)); return m; }

const modeDesc=document.getElementById('modeDesc'), controls=document.getElementById('controls'),
      active=document.getElementById('active'), count=document.getElementById('count'), list=document.getElementById('list');
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } }
function full(u){ return /^https?:\/\//.test(u)?u:"https://"+u; }

function renderControls(){
  if(mode==='B'){
    const c=tagCounts();
    controls.innerHTML=`<div class="topicsbar">
      ${Object.keys(c).sort().map(t=>`<span class="t ${filter===t?'on':''}" data-topic="${t}">${t}<span class="c">${c[t]}</span></span>`).join('')}
    </div>`;
    controls.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>{ filter=(filter===el.dataset.topic)?null:el.dataset.topic; renderAll(); }));
  } else if(mode==='C'){
    const c=tagCounts();
    controls.innerHTML=`<div class="dropwrap"><select id="drop">
      <option value="">All topics (${items.length})</option>
      ${Object.keys(c).sort().map(t=>`<option value="${t}" ${filter===t?'selected':''}>${t} (${c[t]})</option>`).join('')}
    </select></div>`;
    document.getElementById('drop').addEventListener('change',e=>{ filter=e.target.value||null; renderAll(); });
  } else { controls.innerHTML=''; }
}
function renderActive(){
  if(filter){ active.className='active show';
    active.innerHTML=`Showing only <b style="margin:0 2px">&nbsp;${filter}&nbsp;</b> <button id="clr">Show all again</button>`;
    document.getElementById('clr').addEventListener('click',()=>{ filter=null; renderAll(); });
  } else active.className='active';
}
function renderList(){
  const shown=filter? items.filter(i=>i.tags.includes(filter)) : items;
  count.textContent = filter ? `${shown.length} in “${filter}”` : `${items.length} links`;
  if(!shown.length){ list.innerHTML=`<div class="empty">Nothing labelled “${filter}”.</div>`; return; }
  list.innerHTML=shown.map(it=>{
    const i=items.indexOf(it);
    return `<li class="card" data-open="${i}">
      <p class="title">${it.title}<span class="ext">↗ open</span></p>
      <p class="desc">${it.desc}</p>
      <div class="url"><span class="fav">${(host(it.url)[0]||'•').toUpperCase()}</span>${host(it.url)}</div>
      <div class="tags">${it.tags.map(t=>`<span class="tag ${mode==='A'?'click':''} ${filter===t?'act':''}" data-tag="${t}">${t}</span>`).join('')}</div>
    </li>`;
  }).join('');
  list.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>window.open(full(items[+el.dataset.open].url),'_blank')));
  if(mode==='A'){
    list.querySelectorAll('.tag.click').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); const t=el.dataset.tag; filter=(filter===t)?null:t; renderAll(); }));
  }
}
function renderAll(){ modeDesc.textContent=MODES[mode]; renderControls(); renderActive(); renderList(); }
document.querySelector('.switch').addEventListener('click',e=>{
  const b=e.target.closest('button[data-m]'); if(!b) return;
  mode=b.dataset.m; filter=null;
  document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));
  renderAll();
});
renderAll();
</script>
</body>
</html>
