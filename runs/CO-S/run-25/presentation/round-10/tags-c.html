<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tags — Version C (details panel)</title>
<link rel="stylesheet" href="tags-base.css">
</head>
<body>
<header>
  <h1>Link Library</h1>
  <span class="tag">Prototype</span>
  <span class="variant">Tags · Version C — open a details panel</span>
</header>
<main>
  <p class="count" id="count"></p>
  <ul class="library" id="library"></ul>
</main>

<div class="panel" id="panel">
  <button class="close" id="closePanel">×</button>
  <h2 id="pTitle"></h2>
  <div class="psite" id="pSite"></div>
  <div class="lbl">Tags</div>
  <div class="tags" id="pTags"></div>
  <input class="tagfield" id="pField" placeholder="Type a tag and press Enter">
  <div class="hint">Manage everything for this link in one place.</div>
</div>

<script>
  const items = [
    { id: 1, url: "https://en.wikipedia.org/wiki/Bookmark_(digital)", host: "en.wikipedia.org",
      title: "Bookmark (digital) - Wikipedia",
      desc: "In the context of the World Wide Web, a bookmark is a URI stored for later retrieval.",
      saved: "Sep 26, 9:14 AM", tags: ["reference"] },
    { id: 2, url: "https://developer.mozilla.org/en-US/docs/Web/API", host: "developer.mozilla.org",
      title: "Web APIs | MDN",
      desc: "A reference of all the interfaces available for building web apps.",
      saved: "Sep 26, 9:02 AM", tags: ["dev", "reference"] }
  ];
  let current = null;

  function render() {
    const lib = document.getElementById("library");
    document.getElementById("count").textContent = items.length + " saved links";
    lib.innerHTML = "";
    items.forEach(it => {
      const li = document.createElement("li");
      li.className = "item opencard";
      li.dataset.id = it.id;
      const chips = it.tags.length
        ? it.tags.map(t => '<span class="chip">' + t + "</span>").join("")
        : '<span class="addtag">click to add tags</span>';
      li.innerHTML =
        '<div class="favicon">' + it.host.charAt(0).toUpperCase() + "</div>" +
        '<div class="body">' +
          '<a class="title" href="' + it.url + '" target="_blank" rel="noopener">' + it.title + "</a>" +
          '<div class="desc">' + it.desc + "</div>" +
          '<div class="tags">' + chips + "</div>" +
          '<div class="meta"><a href="' + it.url + '" target="_blank" rel="noopener">' + it.host + "</a>" +
            "<span>Saved " + it.saved + "</span></div>" +
        "</div>";
      lib.appendChild(li);
    });
    document.querySelectorAll("li.item").forEach(li => {
      li.addEventListener("click", e => {
        if (e.target.closest("a")) return; // let title/site links open normally
        openPanel(+li.dataset.id);
      });
    });
  }

  function renderPanelTags() {
    const it = items.find(x => x.id === current);
    document.getElementById("pTags").innerHTML = it.tags.map(t =>
      '<span class="chip">' + t + ' <span class="x" data-tag="' + t + '">×</span></span>'
    ).join("") || '<span class="hint">No tags yet.</span>';
    document.querySelectorAll("#pTags .x").forEach(x =>
      x.addEventListener("click", () => {
        it.tags = it.tags.filter(t => t !== x.dataset.tag);
        renderPanelTags(); render();
      }));
  }
  function openPanel(id) {
    current = id;
    const it = items.find(x => x.id === id);
    document.getElementById("pTitle").textContent = it.title;
    document.getElementById("pSite").textContent = it.host;
    renderPanelTags();
    document.getElementById("panel").classList.add("open");
    document.getElementById("pField").focus();
  }
  document.getElementById("closePanel").addEventListener("click", () => {
    document.getElementById("panel").classList.remove("open"); render();
  });
  document.getElementById("pField").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.value.trim()) {
      const it = items.find(x => x.id === current);
      const v = e.target.value.trim().toLowerCase();
      if (!it.tags.includes(v)) it.tags.push(v);
      e.target.value = "";
      renderPanelTags(); render();
    }
  });

  render();
  document.body.setAttribute("data-harness-ready", "true");
</script>
</body>
</html>
</content>
