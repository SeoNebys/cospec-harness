<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keep — New bookmark status</title>
  <style>
    :root{color-scheme:light;--ink:#17211d;--muted:#68736e;--line:#dce3df;--paper:#fbfcfa;--green:#245c45;--green-soft:#e7f1eb;--cream:#f3f0e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:68px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.shell{width:min(920px,calc(100% - 48px));margin:0 auto}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px}.mark{width:29px;height:34px;border-radius:4px 4px 9px 9px;background:var(--green)}main{padding:58px 0}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.11em;text-transform:uppercase}h1{margin:8px 0 28px;font:600 40px/1.08 Georgia,serif;letter-spacing:-.03em}.add-panel{padding:18px;border:1px solid var(--line);border-radius:14px;background:white}.add-panel label{display:block;margin-bottom:8px;font-weight:680}.row{display:flex;gap:10px}.row input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid #bdc9c2;border-radius:9px;font:inherit}.row button{height:48px;padding:0 18px;border:0;border-radius:9px;background:var(--green);color:white;font:700 14px inherit;cursor:pointer}.views{display:flex;gap:8px;margin:34px 0 12px}.view{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:white;color:var(--muted);font:680 13px inherit}.view.active{border-color:var(--green);background:var(--green);color:white}.library-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px}h2{margin:0;font-size:17px}.count{color:var(--muted);font-size:13px}.empty{padding:36px;text-align:center;color:var(--muted)}.card{display:none;grid-template-columns:54px 1fr auto;gap:15px;padding:21px 4px;border-bottom:1px solid var(--line);align-items:start}.card.visible{display:grid}.thumb{width:54px;height:54px;display:grid;place-items:center;border-radius:11px;background:var(--cream);color:var(--green);font:700 20px Georgia,serif}.domain{color:var(--green);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.title{margin:2px 0;font:600 19px/1.25 Georgia,serif}.summary{margin:0;color:var(--muted);font-size:14px}.status{height:34px;padding:0 11px;border:1px solid #bdc9c2;border-radius:8px;background:white;color:var(--ink);font:650 12px inherit}.status.unread{border-color:#8fb8a2;background:var(--green-soft);color:var(--green)}@media(max-width:620px){.shell{width:min(100% - 28px,920px)}.row{flex-direction:column}.row button{width:100%}.card{grid-template-columns:48px 1fr}.status{grid-column:2;justify-self:start}}
  </style>
</head>
<body><header><div class="shell brand"><span class="mark"></span><span>Keep</span></div></header><main class="shell" data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>Save a bookmark</h1><form class="add-panel" id="form"><label for="url">Web address</label><div class="row"><input id="url" value="https://example.com/designing-calm-interfaces"><button type="submit">Save bookmark</button></div></form><div class="views"><button class="view active">All · <span id="all-count">0</span></button><button class="view">Unread · <span id="unread-count">0</span></button><button class="view">Archived · 0</button></div><section><div class="library-head"><h2>All bookmarks</h2><span class="count" id="count">0 bookmarks</span></div><div class="empty" id="empty">Your saved bookmarks will appear here.</div><article class="card" id="card"><div class="thumb">D</div><div><div class="domain">example.com</div><h3 class="title">Designing calm interfaces</h3><p class="summary">Practical ideas for reducing noise and helping important actions stand out.</p></div><button class="status" id="status"></button></article></section></main>
  <script>const startsUnread=(new URLSearchParams(location.search).get('default')||'unread')==='unread';document.querySelector('#form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#card').classList.add('visible');document.querySelector('#empty').hidden=true;document.querySelector('#count').textContent='1 bookmark';document.querySelector('#all-count').textContent='1';const status=document.querySelector('#status');status.textContent=startsUnread?'Unread — mark read':'Mark unread';status.classList.toggle('unread',startsUnread);document.querySelector('#unread-count').textContent=startsUnread?'1':'0';});</script>
</body></html>
