<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8a82;
    --line: #e8e6e0;
    --accent: #4a6b57;
    --accent-soft: #eef2ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 14px;
  }
  .saver {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    gap: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .saver input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    padding: 10px 8px;
    background: transparent;
    color: var(--ink);
  }
  .saver button {
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  .saver button:active { transform: translateY(1px); }
  .hint {
    color: var(--muted);
    font-size: 13px;
    margin: 10px 4px 0;
    min-height: 18px;
  }
  .list { margin-top: 34px; display: flex; flex-direction: column; gap: 12px; }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 20px;
  }
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    animation: rise 0.28s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .item .title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    word-break: break-word;
    margin: 0 0 3px;
  }
  .item .url {
    font-size: 13px;
    color: var(--accent);
    word-break: break-all;
    text-decoration: none;
    display: inline-block;
  }
  .item .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .domain-chip {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bookmarks</h1>
      <p>One calm place for the links you want to keep.</p>
    </header>

    <form class="saver" id="saver">
      <input id="url" type="text" placeholder="Paste a link to save…" autocomplete="off" autofocus />
      <button type="submit">Save</button>
    </form>
    <div class="hint" id="hint"></div>

    <div class="list" id="list">
      <div class="empty" id="empty">Nothing saved yet. Paste a link above to begin.</div>
    </div>
  </div>

<script>
  const form = document.getElementById('saver');
  const input = document.getElementById('url');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const hint = document.getElementById('hint');

  function normalise(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { return new URL(v); } catch (e) { return null; }
  }

  function titleFrom(u) {
    // Assumption: derive a readable title from the address until real titles exist.
    let path = decodeURIComponent(u.pathname).replace(/\/+$/,'');
    let last = path.split('/').filter(Boolean).pop();
    if (last) {
      last = last.replace(/[-_]+/g, ' ').replace(/\.[a-z0-9]+$/i,'');
      return last.charAt(0).toUpperCase() + last.slice(1);
    }
    return u.hostname.replace(/^www\./,'');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const u = normalise(input.value);
    if (!u) {
      hint.textContent = "Hmm, that doesn't look like a link yet.";
      return;
    }
    hint.textContent = 'Saved.';
    if (empty) empty.remove();

    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML =
      '<span class="domain-chip">' + u.hostname.replace(/^www\./,'') + '</span>' +
      '<div class="title"></div>' +
      '<a class="url" target="_blank" rel="noopener"></a>' +
      '<div class="meta"><span>Saved just now</span></div>';
    item.querySelector('.title').textContent = titleFrom(u);
    const a = item.querySelector('.url');
    a.textContent = u.href;
    a.href = u.href;

    list.insertBefore(item, list.firstChild);
    input.value = '';
    input.focus();
    setTimeout(function(){ if (hint.textContent === 'Saved.') hint.textContent = ''; }, 2000);
  });

  document.body.setAttribute('data-harness-ready', 'true');
</script>
</body>
</html>
