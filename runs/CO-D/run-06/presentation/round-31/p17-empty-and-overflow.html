<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype 17 (empty states & overflow)</title>
<style>
  :root { --line:#e2e2e6; --muted:#6b6b72; --accent:#3b5bdb; --bg:#f7f7f9; --unread:#e8590c; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:0; background:var(--bg); color:#1a1a1e; }
  .wrap { max-width:680px; margin:0 auto; padding:22px 20px 80px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .switch { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .switch button { border:1px solid var(--line); background:#fff; color:#333; border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .switch button.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  .row { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:14px; cursor:pointer; }

  /* empty state */
  .empty { text-align:center; padding:48px 24px; color:var(--muted); }
  .empty .big { font-size:34px; margin-bottom:10px; }
  .empty h2 { font-size:17px; color:#1a1a1e; margin:0 0 6px; }
  .empty p { font-size:14px; margin:0 auto; max-width:380px; line-height:1.5; }
  .empty .arrow { margin-top:14px; font-size:13px; color:var(--accent); }

  /* card */
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  .card .inner { display:flex; gap:14px; padding:14px 16px; align-items:flex-start; }
  .card .body { flex:1; min-width:0; }
  .titleline { display:flex; align-items:flex-start; gap:7px; }
  .fav { width:18px; height:18px; border-radius:4px; flex:none; background:#2f9e44; color:#fff;
         font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; margin-top:1px; }
  .title { font-size:15px; font-weight:600; margin:0;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .url { font-size:12px; color:var(--accent); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .desc { font-size:13px; color:#3a3a42; margin:7px 0 0;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .note { font-size:13px; color:#8a6d00; background:#fff8e1; border-left:3px solid #f0cf5a;
          border-radius:0 6px 6px 0; padding:6px 9px; margin:8px 0 0;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .lbls { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .lbls span.l { background:#eef0f4; color:#444; border-radius:12px; padding:2px 9px; font-size:12px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lbls .more { color:var(--muted); font-size:12px; cursor:pointer; }
  .thumb { width:84px; height:64px; border-radius:8px; flex:none; background:linear-gradient(135deg,#2b8a3e,#00000022);
           display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
  .expl { font-size:12px; color:#9a9aa2; margin:10px 2px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Prototype 17 — the empty first run, and a card overstuffed with text</p>

  <div class="switch">
    <button data-s="empty" class="on">First run (nothing saved)</button>
    <button data-s="overflow">Overstuffed card</button>
    <button data-s="normal">Normal (for contrast)</button>
  </div>

  <div class="row"><input type="text" placeholder="Paste a link here…"><button class="primary">Add</button></div>

  <div id="stage"></div>
  <div class="expl" id="expl"></div>
</div>

<script>
  const el=id=>document.getElementById(id);
  const stage=el("stage"), expl=el("expl");
  let s="empty";
  document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".switch button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); s=b.dataset.s; render();
  }));

  const longTitle="The Absolutely Comprehensive, Definitive, No-Stone-Unturned Field Guide to Growing, Harvesting, Storing, and Cooking Heirloom Tomatoes in Small Urban Spaces Throughout Every Season of the Year";
  const longDesc="This exhaustive guide covers everything you could possibly want to know, beginning with soil preparation and seed selection, moving through transplanting, staking, pruning, watering schedules, pest management, companion planting, and finally harvesting at peak ripeness, with an extended appendix on canning, drying, and fermenting your surplus harvest for the winter months ahead.";
  const longUrl="https://www.example-gardening-megasite.com/guides/2026/heirloom-tomatoes/complete/urban/seasonal/part-one-soil-and-seeds?ref=frontpage&section=intro";
  const manyLabels=["gardening","tomatoes","urban","seasonal","cooking","canning","reference","hobbies","summer","weekend-projects"];

  function card(t,u,d,note,labels){
    const shown=labels.slice(0,5), extra=labels.length-shown.length;
    return '<div class="card"><div class="inner"><div class="body">'+
      '<div class="titleline"><span class="fav">E</span><p class="title">'+t+'</p></div>'+
      '<div class="url">'+u+'</div>'+
      (d?'<p class="desc">'+d+'</p>':'')+
      (note?'<div class="note"><b>My note:</b> '+note+'</div>':'')+
      '<div class="lbls">'+shown.map(l=>'<span class="l">'+l+'</span>').join('')+
        (extra>0?'<span class="more">+'+extra+' more</span>':'')+'</div>'+
      '</div><div class="thumb">E</div></div></div>';
  }

  function render(){
    if(s==="empty"){
      stage.innerHTML='<div class="empty"><div class="big">🔖</div>'+
        '<h2>Nothing saved yet</h2>'+
        '<p>Paste a link in the box above and press Add. The title and a short description fill in for you — it takes a second.</p>'+
        '<div class="arrow">↑ start with your first link</div></div>';
      expl="Absence of data — the very first run. Instead of a blank void, a calm welcome that points at the one thing to do: save a link.";
    } else if(s==="overflow"){
      stage.innerHTML=card(longTitle,longUrl,longDesc,
        "Remember to try the fermenting method from the appendix — I keep meaning to and forgetting every single summer without fail, so this note is a bit of a nag to myself.",
        manyLabels);
      expl="Boundary — a monster title, wall-of-text description, long address, and ten labels. Title clamps to 2 lines, description/note clamp too, the address truncates with …, and labels cap at 5 with “+N more”. The card stays the same tidy height as any other.";
    } else {
      stage.innerHTML=card("The Best Banana Bread","kingarthurbaking.com/banana-bread",
        "A moist, deeply banana-flavored loaf using very ripe bananas.","",["recipes","baking"]);
      expl="A normal card, for height comparison against the overstuffed one.";
    }
    expl && (document.getElementById("expl").textContent=expl);
  }
  render();
</script>
</body>
</html>
