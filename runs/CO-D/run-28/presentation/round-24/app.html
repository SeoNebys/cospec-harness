<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Bookmarks — prototype</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --ink:#1c2330; --muted:#6b7280; --accent:#2f6df6; --chip:#eef2f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 24px; }
  header h1 { margin:0; font-size:18px; }
  main { max-width:820px; margin:0 auto; padding:20px 16px 64px; }
  .btn { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:500; }
  .btn:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .status { min-height:20px; margin:8px 2px 0; font-size:13px; color:var(--muted); }
  /* save panel */
  .addrow { display:flex; gap:8px; }
  .addrow input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .draft { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .draft label { font-size:12px; color:var(--muted); }
  .draft input, .draft textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  .draft textarea { resize:vertical; min-height:56px; }
  .hint { font-size:11.5px; color:var(--muted); margin-top:-4px; }
  .previewbox { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fafafa; min-height:20px; font-size:13px; }
  .row { display:flex; gap:8px; }
  .fetchline { font-size:12.5px; color:#16794b; }
  .fetchwarn { font-size:12.5px; color:#92400e; background:#fef3c7; border:1px solid #fde68a; border-radius:8px; padding:8px 10px; }
  /* tag input */
  .taginput { display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .taginput input { border:0; outline:0; flex:1; min-width:120px; padding:4px; font-size:14px; }
  .tag { background:var(--chip); border-radius:999px; padding:3px 10px; font-size:12.5px; color:#38445c; display:inline-flex; align-items:center; gap:6px; }
  .tag .x { cursor:pointer; color:var(--muted); font-weight:700; }
  .tag.click { cursor:pointer; } .tag.click:hover{ background:#e2e9f5; }
  .tag.on { background:var(--accent); color:#fff; }
  /* search */
  .views { display:flex; gap:6px; margin:16px 0 0; }
  .views button { border:1px solid var(--line); background:#fff; color:#42506a; padding:7px 14px; border-radius:999px; font-size:13px; cursor:pointer; }
  .views button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .collections { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
  .collections .clbl { font-size:12px; color:var(--muted); margin-right:2px; }
  .collections .coll { background:#eef4ff; color:#1f3d7a; border:1px solid #d3e0fb; border-radius:999px; padding:5px 8px 5px 12px; font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .collections .coll.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .collections .coll .x { cursor:pointer; opacity:.7; font-weight:700; }
  .collections .save { background:#fff; border:1px dashed var(--line); border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer; color:#42506a; }
  .collections form { display:inline-flex; gap:6px; align-items:center; }
  .collections form input { padding:5px 9px; border:1px solid var(--line); border-radius:999px; font-size:12.5px; }
  .collections form button { padding:5px 11px; border:0; border-radius:999px; font-size:12.5px; cursor:pointer; background:var(--accent); color:#fff; }
  .searchbar { display:flex; gap:8px; align-items:center; margin:12px 0 10px; }
  .searchbar input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .searchbar select { padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .searchbar #gear { padding:10px 12px; }
  .sortnote { font-size:12px; color:var(--muted); min-height:16px; margin:2px 2px; }
  .sortnote a { color:var(--accent); cursor:pointer; }
  .setrow { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  .setrow select { padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
  .filters .lbl { font-size:12px; color:var(--muted); margin-right:2px; }
  .searcherr { font-size:12.5px; color:#b91c1c; min-height:16px; margin:2px 2px; }
  .resultcount { font-size:12.5px; color:var(--muted); margin:2px 2px 10px; }
  /* tag suggestions */
  .tagslot { position:relative; }
  .suggest { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(20,25,35,.12); z-index:5; overflow:hidden; }
  .suggest div { padding:8px 11px; font-size:13.5px; cursor:pointer; }
  .suggest div:hover, .suggest div.active { background:var(--chip); }
  .suggest .new { color:var(--muted); }
  /* list */
  .list { display:flex; flex-direction:column; gap:10px; }
  .empty { text-align:center; color:var(--muted); padding:44px 12px; border:1px dashed var(--line); border-radius:12px; }
  .empty strong{ display:block; color:var(--ink); margin-bottom:5px; }
  .bm { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; gap:12px; }
  .bm.selected { border-color:var(--accent); background:#f6f9ff; }
  .selbox { flex:0 0 18px; margin-top:6px; }
  .selbox input { width:16px; height:16px; cursor:pointer; }
  .bulkbar { position:sticky; top:8px; z-index:6; background:var(--ink); color:#fff; border-radius:10px; padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; box-shadow:0 6px 18px rgba(20,25,35,.18); }
  .bulkbar .n { font-weight:600; }
  .bulkbar button { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:7px; padding:6px 11px; font-size:12.5px; cursor:pointer; }
  .bulkbar button:hover { background:rgba(255,255,255,.26); }
  .bulkbar button.danger { background:#7f1d1d; }
  .bulkbar input.tagin { border:0; border-radius:7px; padding:6px 9px; font-size:12.5px; width:130px; }
  .bulkbar .sep { width:1px; align-self:stretch; background:rgba(255,255,255,.22); margin:0 2px; }
  .bulkbar .link { background:none; text-decoration:underline; padding:6px 2px; }
  .fav { flex:0 0 34px; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; margin-top:2px; }
  .body { flex:1; min-width:0; }
  .title a { font-size:15px; font-weight:600; color:var(--ink); text-decoration:none; }
  .title a:hover { text-decoration:underline; }
  .desc { font-size:13px; color:#4b5563; margin:5px 0 0; }
  .note { font-size:13px; color:#374151; margin:8px 0 0; background:#fafafa; border:1px solid var(--line); border-radius:7px; padding:8px 10px; }
  .note :first-child{margin-top:0;} .note :last-child{margin-bottom:0;} .note ul{margin:4px 0;padding-left:18px;} .note a{color:var(--accent);}
  .note-label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:3px; }
  .tagrow { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; }
  .copies { margin-top:9px; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .copies .cp-sep { color:var(--line); }
  .copies .ok { color:#16794b; }
  .copies .pending { color:#92400e; }
  .copies .failed { color:#b91c1c; }
  .copies .warn { color:#92400e; }
  .copies .linkb { background:none; border:0; color:var(--accent); font-size:12px; cursor:pointer; padding:0; text-decoration:none; }
  .copies .linkb:hover { text-decoration:underline; }
  .url { font-size:11.5px; color:var(--muted); word-break:break-all; margin-top:8px; }
  .actions { margin-top:9px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; } .actions button { background:none; border:0; color:var(--accent); font-size:12.5px; cursor:pointer; padding:0; }
  .actions .del { margin-left:auto; color:var(--muted); }
  .actions .del:hover { color:#b91c1c; text-decoration:underline; }
  .actions .confirm-yes { color:#b91c1c; font-weight:600; }
  .actions .confirm { font-size:12.5px; color:#92400e; }
  .bm.flash { border-color:#c7dbff; background:#f4f8ff; }
  mark { background:#fff3ba; padding:0 1px; border-radius:2px; }
  .hidden{ display:none; }
  /* Block G: font-size preference */
  body.fs-small .title a{font-size:14px} body.fs-small .desc,body.fs-small .note{font-size:12px} body.fs-small .url{font-size:11px} body.fs-small .tag{font-size:11.5px}
  body.fs-large .title a{font-size:17.5px} body.fs-large .desc,body.fs-large .note{font-size:15px} body.fs-large .url{font-size:13px} body.fs-large .tag{font-size:14px} body.fs-large .copies{font-size:13px}
  .pager { display:flex; gap:10px; align-items:center; justify-content:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .pager button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header><h1>My Bookmarks</h1></header>
<main>
  <div class="card">
    <div class="addrow">
      <input id="url" type="text" placeholder="Paste a link, e.g. https://…" autocomplete="off">
      <button class="btn" id="add">Add</button>
    </div>
    <div id="slot"></div>
  </div>
  <div class="status" id="status"></div>

  <div class="views" id="views"></div>
  <div class="collections" id="collections"></div>
  <div class="searchbar">
    <input id="search" type="text" placeholder="Search — try:  css   |   #read-later   |   grid AND #css   |   &quot;grid layout&quot; OR figma   |   design NOT tools">
    <select id="sort" title="Sort">
      <option value="newest">Newest first</option>
      <option value="recent">Recently updated</option>
      <option value="oldest">Oldest first</option>
      <option value="title-az">Title A–Z</option>
      <option value="title-za">Title Z–A</option>
    </select>
    <button class="btn ghost" id="gear" title="Settings">⚙</button>
  </div>
  <div class="sortnote" id="sortnote"></div>
  <div class="searcherr" id="searcherr"></div>
  <div class="filters" id="filters"></div>
  <div class="resultcount" id="count"></div>
  <div class="bulkbar hidden" id="bulkbar"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pager"></div>
</main>

<script>
const KNOWN = {
  "developer.mozilla.org": { title:"MDN Web Docs", desc:"Resources for developers, by developers." },
  "github.com": { title:"GitHub", desc:"Let's build from here — the world's largest developer platform." },
  "en.wikipedia.org": { title:"Wikipedia, the free encyclopedia", desc:"The free encyclopedia anyone can edit." },
  "news.ycombinator.com": { title:"Hacker News", desc:"News and discussion for the tech community." },
  "www.figma.com": { title:"Figma: The Collaborative Interface Design Tool", desc:"Design, prototype, and gather feedback all in one place." }
};
function normalizeUrl(raw){ let s=raw.trim(); if(!s) return null; if(!/^https?:\/\//i.test(s)) s="https://"+s; try{return new URL(s);}catch(e){return null;} }
// dedupe key: ignore scheme, lowercase host, drop a single trailing slash on the path
function dupKey(u){ try{ const x=(typeof u==='string')?new URL(u):u;
  const path=x.pathname.replace(/\/$/,''); return x.hostname.replace(/^www\./,'').toLowerCase()+path+x.search; }catch(e){ return String(u); } }
function fakeFetchInfo(u){
  const host=u.hostname.replace(/^www\./,'');
  // edge: simulate a page that can't be read automatically
  if(/\.(example|test|invalid)$/.test(host) || host.startsWith('no-such')) return null;
  const k=KNOWN[u.hostname]||KNOWN[host]; if(k) return {...k};
  const path=u.pathname.replace(/\/$/,'').split('/').filter(Boolean).pop()||host;
  const pretty=decodeURIComponent(path).replace(/[-_]/g,' ').replace(/\.\w+$/,'');
  return { title: pretty.charAt(0).toUpperCase()+pretty.slice(1)+" — "+host, desc:"" };
}
const FAV_COLORS=["#2f6df6","#e2528b","#12a150","#f59e0b","#8b5cf6","#0891b2","#dc2626"];
function faviconFor(u){ const host=u.hostname.replace(/^www\./,''); let s=0; for(const c of host)s+=c.charCodeAt(0); return {letter:host.charAt(0).toUpperCase(), color:FAV_COLORS[s%FAV_COLORS.length]}; }
function renderNote(txt){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const link=s=>esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return txt.split(/\n{2,}/).map(b=>{ const lines=b.split('\n');
    return lines.every(l=>/^\s*-\s+/.test(l)) ? '<ul>'+lines.map(l=>'<li>'+link(l.replace(/^\s*-\s+/,''))+'</li>').join('')+'</ul>'
                                              : '<p>'+lines.map(link).join('<br>')+'</p>'; }).join('');
}
let highlightTerms=[];
function hl(text){ if(!highlightTerms.length) return escapeHtml(text);
  const low=text.toLowerCase(); const marks=[];
  highlightTerms.forEach(term=>{ let from=0,idx; while((idx=low.indexOf(term,from))>=0){ marks.push([idx,idx+term.length]); from=idx+term.length; } });
  if(!marks.length) return escapeHtml(text);
  marks.sort((a,b)=>a[0]-b[0]); const merged=[]; for(const m of marks){ if(merged.length&&m[0]<=merged[merged.length-1][1]) merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],m[1]); else merged.push([...m]); }
  let out='',pos=0; for(const [s,e] of merged){ out+=escapeHtml(text.slice(pos,s))+'<mark>'+escapeHtml(text.slice(s,e))+'</mark>'; pos=e; } out+=escapeHtml(text.slice(pos)); return out;
}
function termsFromQuery(s){ const t=tokenize(s); return t.filter(x=>x.k==='term'&&x.text!==undefined).map(x=>x.text).filter(Boolean); }
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// seed a few so search/tags are explorable immediately
const bookmarks=[
  { url:"https://developer.mozilla.org/en-US/docs/Web/CSS/grid", fav:faviconFor(new URL("https://developer.mozilla.org")), title:"CSS grid layout — MDN", desc:"A guide to two-dimensional grid layouts in CSS.", note:"", tags:["css","reference"], readLater:true, archived:false },
  { url:"https://news.ycombinator.com/item?id=12345", fav:faviconFor(new URL("https://news.ycombinator.com")), title:"Show HN: A tiny bookmark manager", desc:"News and discussion for the tech community.", note:"- compare with our idea\n- [thread](https://news.ycombinator.com)", tags:["inspiration"], readLater:false, archived:false },
  { url:"https://www.figma.com/", fav:faviconFor(new URL("https://www.figma.com")), title:"Figma: The Collaborative Interface Design Tool", desc:"Design, prototype, and gather feedback all in one place.", note:"", tags:["design","tools"], readLater:false, archived:false },
  { url:"https://en.wikipedia.org/wiki/Bookmark_(digital)", fav:faviconFor(new URL("https://en.wikipedia.org")), title:"Bookmark (digital) — Wikipedia", desc:"The free encyclopedia anyone can edit.", note:"old research, keep for reference", tags:["reference"], readLater:false, archived:true },
  { url:"https://www.w3.org/TR/PNG/png.pdf", fav:faviconFor(new URL("https://www.w3.org")), title:"PNG Specification (PDF)", desc:"A downloadable PDF specification.", note:"", tags:["reference","spec"], readLater:false, archived:false }
];

// extra sample bookmarks so pagination is visible during review
for(let i=1;i<=22;i++){ const u=new URL(`https://example${i}.org/article/topic-${i}`);
  bookmarks.push({ url:u.href, fav:faviconFor(u), title:`Sample article ${i} — example${i}.org`, desc:`A sample bookmark number ${i} for browsing.`, note:'', tags:[ i%2?'sample':'reading', i%3===0?'longread':'quick' ], readLater:i%5===0, archived:false }); }
bookmarks.forEach((b,i)=>{ b.addedAt = Date.now() - i*86400000; b.updatedAt = b.addedAt; }); // seed dates
let query="";
let view="all"; // all | toread | archived
let selected=new Set(); // bulk selection (bookmark references)
// saved searches (collections): {name, query, tags:[]} — persisted
let collections=(()=>{ try{ return JSON.parse(localStorage.getItem('bm_collections')||'[]'); }catch(e){ return []; } })();
let activeColl=null; // name of applied collection, if the current search/tags match it
// default sort is an explicit, persisted setting; the dropdown is a temporary override for the session
const SORT_LABELS={newest:'Newest first',recent:'Recently updated',oldest:'Oldest first','title-az':'Title A–Z','title-za':'Title Z–A'};
let defaultSort = (()=>{ try{ return localStorage.getItem('bm_default_sort')||'newest'; }catch(e){ return 'newest'; } })();
let autoCopy = (()=>{ try{ return localStorage.getItem('bm_autocopy')==='1'; }catch(e){ return false; } })();
let fontSize = (()=>{ try{ return localStorage.getItem('bm_fontsize')||'medium'; }catch(e){ return 'medium'; } })();
let pageSize = (()=>{ try{ return Number(localStorage.getItem('bm_pagesize')||'25'); }catch(e){ return 25; } })();
let page = 1;
function applyFontSize(){ document.body.classList.remove('fs-small','fs-medium','fs-large'); document.body.classList.add('fs-'+fontSize); }
let sortBy = defaultSort;
let activeTags=new Set();
const listEl=document.getElementById('list'), statusEl=document.getElementById('status'),
      slot=document.getElementById('slot'), filtersEl=document.getElementById('filters'), countEl=document.getElementById('count');

function allTags(){ const m=new Map(); bookmarks.forEach(b=>b.tags.forEach(t=>m.set(t,(m.get(t)||0)+1))); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }

// ---- query parser: words, "phrases", #tags, AND/OR/NOT, parentheses, implicit AND ----
function tokenize(s){
  const toks=[]; const re=/\s*(\(|\)|"[^"]*"|#[^\s()]+|[^\s()]+)/g; let m;
  while((m=re.exec(s))!==null){ let t=m[1];
    const up=t.toUpperCase();
    if(t==='('||t===')') toks.push({k:t});
    else if(up==='AND'||up==='OR'||up==='NOT') toks.push({k:up});
    else if(t[0]==='#') toks.push({k:'term', tag:t.slice(1).toLowerCase()});
    else if(t[0]==='"') toks.push({k:'term', text:t.slice(1,-1).toLowerCase()});
    else toks.push({k:'term', text:t.toLowerCase()});
  }
  return toks;
}
// grammar: OR > AND > NOT > primary ; implicit AND between adjacent operands
function parseQuery(s){
  const toks=tokenize(s); let i=0;
  const peek=()=>toks[i], next=()=>toks[i++];
  function primary(){
    const t=peek(); if(!t) throw 0;
    if(t.k==='('){ next(); const e=orExpr(); if(!peek()||peek().k!==')') throw 0; next(); return e; }
    if(t.k==='term'){ next(); return t.tag!==undefined ? b=>b.tags.includes(t.tag)
                                                        : b=>hay(b).includes(t.text); }
    throw 0;
  }
  function notExpr(){ if(peek()&&peek().k==='NOT'){ next(); const e=notExpr(); return b=>!e(b); } return primary(); }
  function isOperandStart(t){ return t&&(t.k==='term'||t.k==='('||t.k==='NOT'); }
  function andExpr(){ let l=notExpr();
    while(peek()&&(peek().k==='AND'||isOperandStart(peek()))){ if(peek().k==='AND') next(); const r=notExpr(); const a=l,b2=r; l=b=>a(b)&&b2(b); }
    return l; }
  function orExpr(){ let l=andExpr(); while(peek()&&peek().k==='OR'){ next(); const r=andExpr(); const a=l,b2=r; l=b=>a(b)||b2(b); } return l; }
  if(toks.length===0) return {ok:true, pred:()=>true};
  try{ const e=orExpr(); if(i!==toks.length) throw 0; return {ok:true, pred:e}; }
  catch(_){ return {ok:false}; }
}
function hay(b){ return [b.url,b.title,b.desc,b.note].join('\n').toLowerCase(); }

let compiled={ok:true, pred:()=>true};
function inView(b){
  if(view==='archived') return b.archived;
  if(b.archived) return false;            // archived hidden from All and To read
  if(view==='toread') return b.readLater;
  return true;                            // all (non-archived)
}
function matches(b){
  if(!inView(b)) return false;
  if(activeTags.size){ for(const t of activeTags) if(!b.tags.includes(t)) return false; }
  if(!compiled.ok) return false;
  return compiled.pred(b);
}
function counts(){ return {
  all: bookmarks.filter(b=>!b.archived).length,
  toread: bookmarks.filter(b=>!b.archived && b.readLater).length,
  archived: bookmarks.filter(b=>b.archived).length }; }
function renderViews(){
  const c=counts(); const defs=[['all',`All (${c.all})`],['toread',`To read (${c.toread})`],['archived',`Archived (${c.archived})`]];
  const v=document.getElementById('views'); v.innerHTML='';
  defs.forEach(([k,label])=>{ const b=document.createElement('button'); b.textContent=label; if(view===k)b.className='on';
    b.addEventListener('click',()=>{ view=k; update(); }); v.appendChild(b); });
}

function renderFilters(){
  const tags=allTags();
  filtersEl.innerHTML = tags.length ? '<span class="lbl">Tags:</span>' : '';
  tags.forEach(([t,c])=>{
    const el=document.createElement('span'); el.className='tag click'+(activeTags.has(t)?' on':'');
    el.textContent=`${t} (${c})`;
    el.addEventListener('click',()=>{ activeTags.has(t)?activeTags.delete(t):activeTags.add(t); update(); });
    filtersEl.appendChild(el);
  });

    clr.addEventListener('click',()=>{ activeTags.clear(); update(); }); filtersEl.appendChild(clr); }
}

function renderBulkBar(){
  const bar=document.getElementById('bulkbar');
  const sel=[...selected];
  if(sel.length===0){ bar.className='bulkbar hidden'; bar.innerHTML=''; return; }
  bar.className='bulkbar';
  const shown=bookmarks.filter(matches);
  const allShownSelected = shown.length>0 && shown.every(b=>selected.has(b));
  bar.innerHTML=`<span class="n">${sel.length} selected</span>`+
    `<button class="link" data-a="selall">${allShownSelected?'Deselect':'Select'} all ${shown.length} shown</button>`+
    `<button class="link" data-a="clear">Clear</button>`+
    `<span class="sep"></span>`+
    `<input class="tagin" placeholder="tag name…">`+
    `<button data-a="addtag">Add tag</button>`+
    `<button data-a="rmtag">Remove tag</button>`+
    `<span class="sep"></span>`+
    `<button data-a="read">Mark read later</button>`+
    `<button data-a="unread">Mark as read</button>`+
    `<button data-a="arch">Archive</button>`+
    `<button data-a="unarch">Unarchive</button>`+
    `<span class="sep"></span>`+
    `<button class="danger" data-a="del">Delete…</button>`;
  const tagin=bar.querySelector('.tagin');
  const norm=s=>s.trim().toLowerCase();
  bar.querySelectorAll('button[data-a]').forEach(btn=>btn.addEventListener('click',()=>{
    const a=btn.dataset.a; const sel2=[...selected];
    if(a==='selall'){ if(allShownSelected) shown.forEach(b=>selected.delete(b)); else shown.forEach(b=>selected.add(b)); update(); return; }
    if(a==='clear'){ selected.clear(); update(); return; }
    // apply the mutation, then keep the selection only if every affected item still
    // matches the current search/tags/view; otherwise clear it (items left the view).
    const finalize=()=>{ if(!sel2.every(b=>bookmarks.includes(b) && matches(b))) selected.clear(); update(); };
    if(a==='addtag'){ const t=norm(tagin.value); if(!t){ statusEl.textContent="Type a tag name to add."; return; }
      let n=0; sel2.forEach(b=>{ if(!b.tags.includes(t)){ b.tags.push(t); b.updatedAt=Date.now(); n++; } });
      statusEl.textContent=`Added “${t}” to ${n} bookmark(s).`; finalize(); return; }
    if(a==='rmtag'){ const t=norm(tagin.value); if(!t){ statusEl.textContent="Type a tag name to remove."; return; }
      let n=0; sel2.forEach(b=>{ const i=b.tags.indexOf(t); if(i>=0){ b.tags.splice(i,1); b.updatedAt=Date.now(); n++; } });
      statusEl.textContent=`Removed “${t}” from ${n} bookmark(s).`; finalize(); return; }
    if(a==='read'){ sel2.forEach(b=>b.readLater=true); statusEl.textContent=`Marked ${sel2.length} to read later.`; finalize(); return; }
    if(a==='unread'){ sel2.forEach(b=>b.readLater=false); statusEl.textContent=`Marked ${sel2.length} as read.`; finalize(); return; }
    if(a==='arch'){ sel2.forEach(b=>b.archived=true); statusEl.textContent=`Archived ${sel2.length}.`; finalize(); return; }
    if(a==='unarch'){ sel2.forEach(b=>b.archived=false); statusEl.textContent=`Unarchived ${sel2.length}.`; finalize(); return; }
    if(a==='del'){
      bar.innerHTML=`<span class="n">Delete ${sel2.length} bookmark(s) permanently? This can't be undone.</span>`+
        `<button class="danger" data-y>Delete permanently</button><button class="link" data-n>Keep</button>`;
      bar.querySelector('[data-y]').addEventListener('click',()=>{ sel2.forEach(b=>{ const i=bookmarks.indexOf(b); if(i>=0)bookmarks.splice(i,1); }); statusEl.textContent=`Deleted ${sel2.length} bookmark(s).`; selected.clear(); update(); });
      bar.querySelector('[data-n]').addEventListener('click',renderBulkBar);
      return; }
  }));
}
function currentSig(){ return JSON.stringify({ q:query.trim(), t:[...activeTags].sort() }); }
function collSig(c){ return JSON.stringify({ q:(c.query||'').trim(), t:[...(c.tags||[])].sort() }); }
function persistColls(){ try{ localStorage.setItem('bm_collections', JSON.stringify(collections)); }catch(_){} }
function applyCollection(c){
  query=c.query||''; const se=document.getElementById('search'); if(se) se.value=query;
  compiled=parseQuery(query); highlightTerms=termsFromQuery(query);
  activeTags=new Set(c.tags||[]);
  const en=document.getElementById('searcherr'); if(en) en.textContent = compiled.ok?'':"That search isn't complete yet — check quotes and parentheses.";
  update(); if(typeof refreshSortNote==='function') {}
}
function renderCollections(){
  const box=document.getElementById('collections'); box.innerHTML='';
  const sig=currentSig();
  if(collections.length){ const l=document.createElement('span'); l.className='clbl'; l.textContent='Collections:'; box.appendChild(l); }
  collections.forEach((c,idx)=>{
    const on = collSig(c)===sig;
    const el=document.createElement('span'); el.className='coll'+(on?' on':'');
    el.innerHTML=`${escapeHtml(c.name)} <span class="x" title="Remove collection">×</span>`;
    el.addEventListener('click',e=>{ if(e.target.classList.contains('x')){ collections.splice(idx,1); persistColls(); renderCollections(); statusEl.textContent=`Removed collection “${c.name}”.`; return; }
      applyCollection(c); statusEl.textContent=`Showing collection “${c.name}”.`; });
    box.appendChild(el);
  });
  // save-current control (only when there is something to save and it isn't already an existing collection)
  const hasCriteria = query.trim() || activeTags.size;
  const alreadySaved = collections.some(c=>collSig(c)===sig);
  if(hasCriteria && !alreadySaved){
    const save=document.createElement('button'); save.className='save'; save.textContent='＋ Save current search';
    save.addEventListener('click',()=>{
      const form=document.createElement('form');
      form.innerHTML=`<input placeholder="Name this collection…" maxlength="40"><button type="submit">Save</button>`;
      const inp=form.querySelector('input');
      form.addEventListener('submit',e=>{ e.preventDefault(); const name=inp.value.trim(); if(!name){ inp.focus(); return; }
        collections.push({ name, query:query, tags:[...activeTags] }); persistColls(); renderCollections();
        statusEl.textContent=`Saved collection “${name}”.`; });
      box.replaceChild(form, save); inp.focus();
    });

function update(){ renderViews(); renderCollections(); renderFilters(); renderBulkBar(); render(); }

function sortShown(arr){
  const a=[...arr];
  if(sortBy==='newest') a.sort((x,y)=>y.addedAt-x.addedAt);
  else if(sortBy==='recent') a.sort((x,y)=>y.updatedAt-x.updatedAt);
  else if(sortBy==='oldest') a.sort((x,y)=>x.addedAt-y.addedAt);
  else if(sortBy==='title-az') a.sort((x,y)=>x.title.localeCompare(y.title,undefined,{sensitivity:'base'}));
  else if(sortBy==='title-za') a.sort((x,y)=>y.title.localeCompare(x.title,undefined,{sensitivity:'base'}));
  return a;
}
let lastFilterSig='';
function render(){
  const fsig=JSON.stringify({q:query,t:[...activeTags],view,sortBy,pageSize});
  if(fsig!==lastFilterSig){ page=1; lastFilterSig=fsig; }
  const shown=sortShown(bookmarks.filter(matches));
  countEl.textContent = (query||activeTags.size) ? `${shown.length} of ${bookmarks.length} shown` : `${bookmarks.length} bookmark(s)`;
  if(shown.length===0){
    let msg;
    if(query||activeTags.size){ msg='<strong>No matches</strong>Nothing matches your search or the selected tags. Try different words or clear a tag.'; }
    else if(view==='toread'){ msg="<strong>Nothing to read later</strong>Mark a bookmark with ☆ Read later and it will show up here."; }
    else if(view==='archived'){ msg="<strong>Archive is empty</strong>Archived bookmarks are kept here, out of your main list."; }
    else { msg='<strong>No bookmarks yet</strong>Paste a link above to save your first one.'; }
    listEl.innerHTML='<div class="empty">'+msg+'</div>';
    document.getElementById('pager').innerHTML='';
    return;
  }
  // pagination
  const pager=document.getElementById('pager');
  let pageItems=shown;
  if(pageSize>0 && shown.length>pageSize){
    const totalPages=Math.ceil(shown.length/pageSize);
    if(page>totalPages) page=totalPages; if(page<1) page=1;
    const start=(page-1)*pageSize;
    pageItems=shown.slice(start, start+pageSize);
    pager.innerHTML='';
    const prev=document.createElement('button'); prev.textContent='‹ Previous'; prev.disabled=page<=1;
    prev.addEventListener('click',()=>{ page--; render(); });
    const info=document.createElement('span'); info.textContent=`Page ${page} of ${totalPages} · showing ${start+1}–${start+pageItems.length} of ${shown.length}`;
    const next=document.createElement('button'); next.textContent='Next ›'; next.disabled=page>=totalPages;
    next.addEventListener('click',()=>{ page++; render(); });
    pager.appendChild(prev); pager.appendChild(info); pager.appendChild(next);
  } else { pager.innerHTML=''; }
  listEl.innerHTML='';
  pageItems.forEach(b=>{
    const el=document.createElement('div'); el.className='bm'+(b.flash?' flash':'')+(selected.has(b)?' selected':''); el.dataset.url=b.url;
    const sel=document.createElement('div'); sel.className='selbox';

    sel.appendChild(cb); el.appendChild(sel);
    const fav=document.createElement('div'); fav.className='fav'; fav.style.background=b.fav.color; fav.textContent=b.fav.letter; el.appendChild(fav);
    const body=document.createElement('div'); body.className='body'; el.appendChild(body);
    body.innerHTML =
      `<p class="title"><a href="${b.url}" target="_blank" rel="noopener">${hl(b.title)}</a></p>`+
      (b.desc?`<p class="desc">${hl(b.desc)}</p>`:``)+
      (b.note?`<div class="note"><div class="note-label">My note</div><div class="note-body">${renderNote(b.note)}</div></div>`:``)+
      (b.tags.length?`<div class="tagrow"></div>`:``)+
      `<div class="copies"></div>`+
      `<div class="url">${hl(b.url)}</div>`+
      `<div class="actions">`+
        `<button class="edit">Edit details</button>`+
        `<button class="star">${b.readLater?'★ To read':'☆ Read later'}</button>`+
        `<button class="arch">${b.archived?'Unarchive':'Archive'}</button>`+
        `<button class="del danger">Delete</button>`+
      `</div>`;
    if(b.tags.length){ const tr=body.querySelector('.tagrow');
      b.tags.forEach(t=>{ const s=document.createElement('span'); s.className='tag click'+(activeTags.has(t)?' on':''); s.textContent=t;
        s.addEventListener('click',()=>{ activeTags.has(t)?activeTags.delete(t):activeTags.add(t); update(); }); tr.appendChild(s); }); }
    renderCopies(b, body.querySelector('.copies'));
    body.querySelector('.edit').addEventListener('click',()=>openEditor(b, body));
    body.querySelector('.star').addEventListener('click',()=>{ b.readLater=!b.readLater;
      statusEl.textContent=b.readLater?"Marked to read later.":"Removed from To read."; update(); });
    body.querySelector('.arch').addEventListener('click',()=>{ b.archived=!b.archived;
      statusEl.textContent=b.archived?"Archived — hidden from your main list.":"Restored to your main list."; update(); });

      act.querySelector('.confirm-no').addEventListener('click',update);
    });
    listEl.appendChild(el); b.flash=false;
  });
}

function isPdf(url){ return /\.pdf(\?|#|$)/i.test(url); }
function fmtDate(ms){ const d=new Date(ms); return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function openSimCopy(b){
  const w=window.open('','_blank'); if(!w) return;
  const pdf=isPdf(b.url);
  w.document.write(`<!doctype html><meta charset=utf-8><title>Saved copy — ${escapeHtml(b.title)}</title>`+
    `<body style="font-family:system-ui;max-width:640px;margin:40px auto;padding:0 16px;color:#1c2330">`+
    `<div style="background:#fef3c7;border:1px solid #fde68a;padding:10px 12px;border-radius:8px;font-size:13px">Prototype: this is a simulated locally-stored ${pdf?'PDF':'page copy'} for review, not a real capture.</div>`+
    `<h1 style="font-size:20px">${escapeHtml(b.title)}</h1>`+
    `<p style="color:#6b7280;font-size:13px">Locally stored ${pdf?'PDF':'copy'} · captured ${fmtDate(b.snapshot.at)}<br>Original: ${escapeHtml(b.url)}</p>`+
    `<p>${pdf?'The saved PDF file would open here.':'The saved readable copy of the page would appear here, viewable even if the original goes offline.'}</p></body>`);
  w.document.close();
}
function renderCopies(b, host){
  host.innerHTML='';
  const pdf=isPdf(b.url);
  // local copy / PDF
  const c1=document.createElement('span'); c1.className='copy-item';
  if(b.snapshot && b.snapshot.at){
    c1.innerHTML=`<span class="ok">✓ ${pdf?'PDF stored':'Local copy'} (${fmtDate(b.snapshot.at)})</span> · <button class="linkb view">View</button> · <button class="linkb re">Update</button>`;
    c1.querySelector('.view').addEventListener('click',()=>openSimCopy(b));
    c1.querySelector('.re').addEventListener('click',()=>captureSnapshot(b));
  } else if(b.snapshot && b.snapshot.status==='saving'){
    c1.innerHTML=`<span class="pending">Saving ${pdf?'PDF':'local copy'}…</span>`;
  } else if(b.snapshot && b.snapshot.status==='failed'){
    c1.innerHTML=`<span class="failed">Couldn't save a copy — ${escapeHtml(b.snapshot.reason)}.</span> · <button class="linkb save-copy">Try again</button>`;
    c1.querySelector('.save-copy').addEventListener('click',()=>captureSnapshot(b));
  } else {
    c1.innerHTML=`<button class="linkb save-copy">${pdf?'Save the PDF':'Save a local copy'}</button>`;
    c1.querySelector('.save-copy').addEventListener('click',()=>captureSnapshot(b));
  }
  host.appendChild(c1);
  const sep=document.createElement('span'); sep.className='cp-sep'; sep.textContent='·'; host.appendChild(sep);
  // internet archive
  const c2=document.createElement('span'); c2.className='copy-item';
  if(b.archiveUrl){
    c2.innerHTML=`<span class="ok">✓ Internet Archive</span> · <a class="linkb" href="${b.archiveUrl}" target="_blank" rel="noopener">Open archived</a>`;
  } else if(b.archiveStatus==='saving'){
    c2.innerHTML=`<span class="pending">Creating Internet Archive copy…</span>`;
  } else if(b.archiveStatus==='confirm'){
    c2.innerHTML=`<span class="warn">This creates a <b>public</b> copy on archive.org, visible to anyone. Continue?</span> · <button class="linkb go">Create public copy</button> · <button class="linkb no">Cancel</button>`;
    c2.querySelector('.go').addEventListener('click',()=>makeArchive(b));
    c2.querySelector('.no').addEventListener('click',()=>{ b.archiveStatus=null; update(); });
  } else {
    c2.innerHTML=`<button class="linkb make-arch">Create Internet Archive copy</button>`;
    c2.querySelector('.make-arch').addEventListener('click',()=>{ b.archiveStatus='confirm'; update(); });
  }
  host.appendChild(c2);
}
function captureReason(url){
  try{ const h=new URL(url).hostname.replace(/^www\./,'');
    if(/\.(example|test|invalid)$/.test(h)||h.startsWith('no-such')) return "the page couldn't be reached";
    if(/login|signin|account/i.test(url)) return "the page requires signing in";
  }catch(e){}
  return null;
}
function captureSnapshot(b){
  b.snapshot={status:'saving'}; update();
  setTimeout(()=>{ const reason=captureReason(b.url);
    if(reason){ b.snapshot={status:'failed', reason}; statusEl.textContent=`Couldn't save a local copy — ${reason}. The bookmark is unchanged.`; update(); return; }
    b.snapshot={status:'done', at:Date.now(), pdf:isPdf(b.url)}; b.updatedAt=Date.now();
    statusEl.textContent=isPdf(b.url)?"PDF stored locally (simulated).":"Self-contained local copy saved (simulated)."; update(); }, 700);
}
function makeArchive(b){
  b.archiveStatus='saving'; update();
  setTimeout(()=>{ b.archiveStatus='done'; b.archiveUrl='https://web.archive.org/web/*/'+encodeURI(b.url);
    statusEl.textContent="Internet Archive copy created (simulated link to archive.org)."; update(); }, 800);
}

// ---- Block F: import / export standard (Netscape) bookmark HTML ----
function exportBookmarksHtml(){
  const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let out='<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n';
  bookmarks.forEach(b=>{
    const add=Math.floor((b.addedAt||Date.now())/1000), mod=Math.floor((b.updatedAt||b.addedAt||Date.now())/1000);
    const tags=(b.tags||[]).join(',');
    out+=`    <DT><A HREF="${esc(b.url)}" ADD_DATE="${add}" LAST_MODIFIED="${mod}"${tags?` TAGS="${esc(tags)}"`:''}>${esc(b.title)}</A>\n`;
    if(b.desc) out+=`    <DD>${esc(b.desc)}\n`;
  });
  out+='</DL><p>\n';
  const blob=new Blob([out],{type:'text/html'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='bookmarks.html'; document.body.appendChild(a); a.click(); a.remove();
  statusEl.textContent=`Exported ${bookmarks.length} bookmark(s) as a standard bookmarks.html file.`;
}
function importBookmarksHtml(text){
  const doc=new DOMParser().parseFromString(text,'text/html');
  const anchors=[...doc.querySelectorAll('a[href]')];
  let added=0, skipped=0;
  anchors.forEach(a=>{
    const href=a.getAttribute('href'); const u=normalizeUrl(href||''); if(!u) { return; }
    if(bookmarks.some(b=>dupKey(b.url)===dupKey(u))){ skipped++; return; }
    const addAttr=a.getAttribute('add_date'); const modAttr=a.getAttribute('last_modified');
    const tagsAttr=a.getAttribute('tags')||'';
    const addedAt=addAttr?Number(addAttr)*1000:Date.now();
    bookmarks.push({ url:u.href, fav:faviconFor(u), title:(a.textContent||u.hostname).trim(),
      desc:'', note:'', tags:tagsAttr.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean),
      readLater:false, archived:false, addedAt, updatedAt: modAttr?Number(modAttr)*1000:addedAt });
    added++;
  });
  update();
  statusEl.textContent=`Imported ${added} bookmark(s)${skipped?`, skipped ${skipped} already-saved`:''}.`;
}

// ---- tag chip input ----
function tagEditor(initial){
  const wrap=document.createElement('div'); wrap.className='taginput';
  const tags=[...initial];
  const input=document.createElement('input'); input.placeholder=tags.length?'add a tag…':'type a tag and press Enter';
  let sug=null, active=-1, cands=[];
  function draw(){ [...wrap.querySelectorAll('.tag')].forEach(n=>n.remove());
    tags.forEach((t,i)=>{ const s=document.createElement('span'); s.className='tag'; s.innerHTML=`${escapeHtml(t)} <span class="x">×</span>`;
      s.querySelector('.x').addEventListener('click',()=>{ tags.splice(i,1); draw(); }); wrap.insertBefore(s,input); }); }
  function add(v){ v=v.trim().toLowerCase().replace(/,$/,''); if(v&&!tags.includes(v)) tags.push(v); input.value=''; draw(); closeSug(); }
  function closeSug(){ if(sug){ sug.remove(); sug=null; } active=-1; cands=[]; }
  function showSug(){
    const q=input.value.trim().toLowerCase();
    const existing=allTags().map(([t])=>t).filter(t=>!tags.includes(t));
    cands = q ? existing.filter(t=>t.includes(q)) : existing;
    closeSug(); if(!cands.length && !q) return;
    sug=document.createElement('div'); sug.className='suggest';
    cands.slice(0,6).forEach((t,idx)=>{ const d=document.createElement('div'); d.textContent=t;
      d.addEventListener('mousedown',e=>{ e.preventDefault(); add(t); }); sug.appendChild(d); });
    if(q && !existing.includes(q)){ const d=document.createElement('div'); d.className='new'; d.textContent=`Create new tag “${q}”`;
      d.addEventListener('mousedown',e=>{ e.preventDefault(); add(q); }); sug.appendChild(d); }
    wrap.parentElement.appendChild(sug); active=-1;
  }
  function move(dir){ const items=sug?[...sug.children]:[]; if(!items.length) return;
    items.forEach(x=>x.classList.remove('active')); active=(active+dir+items.length)%items.length; items[active].classList.add('active'); }
  input.addEventListener('input',showSug);
  input.addEventListener('focus',showSug);
  input.addEventListener('blur',()=>setTimeout(closeSug,120));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); move(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
    else if(e.key==='Enter'||e.key===','){ e.preventDefault();
      if(sug && active>=0){ add(sug.children[active].classList.contains('new')?input.value:sug.children[active].textContent); }
      else add(input.value); }
    else if(e.key==='Escape'){ closeSug(); }
    else if(e.key==='Backspace'&&!input.value&&tags.length){ tags.pop(); draw(); } });
  wrap.appendChild(input); draw();
  return { el:wrap, get:()=>[...tags] };
}

function openEditor(b, body){
  const wrap=draftFields(b); body.innerHTML=''; body.appendChild(wrap);
  wrap.querySelector('.d-save').textContent='Save changes';
  wrap.querySelector('.d-save').addEventListener('click',()=>{

    if(!nd._validUrl){ statusEl.textContent="That address doesn't look like a valid link — please fix it."; return; }
    const clash=bookmarks.find(x=>x!==b && dupKey(x.url)===dupKey(nd.url));
    if(clash){ statusEl.textContent=`That address is already used by “${clash.title}”${clash.archived?' (in Archive)':''} — both bookmarks are left unchanged.`; return; }
    delete nd._validUrl; Object.assign(b, nd); b.updatedAt=Date.now(); statusEl.textContent="Your changes are saved."; update(); });
  wrap.querySelector('.d-cancel').addEventListener('click',update);
}

// ---- add flow (Option C) ----
const urlEl=document.getElementById('url'), addBtn=document.getElementById('add');
function revealExisting(dup){
  // clear filters so the existing bookmark is visible, switch to a view that shows it, flash it
  query=''; document.getElementById('search').value=''; compiled=parseQuery(''); highlightTerms=[]; activeTags.clear();
  view = dup.archived ? 'archived' : 'all';
  dup.flash=true; update();
  const node=[...listEl.children].find(n=>n.dataset.url===dup.url);
  if(node){ node.scrollIntoView({behavior:'smooth', block:'center'});
    openEditor(dup, node.querySelector('.body')); }
}
function startAdd(){
  const u=normalizeUrl(urlEl.value); if(!u){ statusEl.textContent="That doesn't look like a valid link yet."; return; }
  const dup=bookmarks.find(b=>dupKey(b.url)===dupKey(u));
  if(dup){ urlEl.value=''; slot.innerHTML='';
    // prefer the secure address if this attempt is https and the stored one is http
    if(u.protocol==='https:' && dup.url.startsWith('http://')) dup.url='https://'+dup.url.slice('http://'.length);
    statusEl.textContent = dup.archived
      ? "You already saved this link (it's in your Archive) — here it is."
      : "You already saved this link — here it is.";
    revealExisting(dup); return; }
  addBtn.disabled=true; statusEl.textContent="Fetching page details…";
  setTimeout(()=>{ const info=fakeFetchInfo(u); addBtn.disabled=false;
    const host=u.hostname.replace(/^www\./,'');
    const failed=!info;
    const base = failed
      ? { url:u.href, fav:faviconFor(u), title:host, desc:'', note:'', tags:[], fetched:false }
      : { url:u.href, fav:faviconFor(u), title:info.title, desc:info.desc, note:'', tags:[], fetched:true };
    const wrap=draftFields(base); slot.innerHTML=''; slot.appendChild(wrap);
    if(failed){ const w=document.createElement('div'); w.className='fetchwarn';
      w.textContent="Couldn't read this page automatically — we used the site address as the title. Add or correct the details, then save.";
      wrap.insertBefore(w, wrap.firstChild); }
    statusEl.textContent = failed ? "Page details couldn't be fetched — fill them in and save." : "Review and add tags, then confirm.";
    wrap.querySelector('.d-save').addEventListener('click',()=>{
      const nb=readDraft(wrap,base);
      if(!nb._validUrl){ statusEl.textContent="That address doesn't look like a valid link — please fix it."; return; }
      const clash=bookmarks.find(x=>dupKey(x.url)===dupKey(nb.url));
      if(clash){ statusEl.textContent="You already saved this link — opening it instead."; slot.innerHTML=''; urlEl.value=''; revealExisting(clash); return; }
      delete nb._validUrl; nb.readLater=false; nb.archived=false; nb.addedAt=Date.now(); nb.updatedAt=Date.now(); nb.flash=true; bookmarks.unshift(nb); urlEl.value=''; slot.innerHTML=''; statusEl.textContent="Saved."; urlEl.focus(); update(); if(autoCopy) captureSnapshot(nb); });
    wrap.querySelector('.d-cancel').addEventListener('click',()=>{ slot.innerHTML=''; statusEl.textContent=''; });
    wrap.querySelector('.d-title').focus();
  },550);
}
addBtn.addEventListener('click',startAdd); urlEl.addEventListener('keydown',e=>{if(e.key==='Enter')startAdd();});
const searchErr=document.getElementById('searcherr');
document.getElementById('search').addEventListener('input',e=>{
  query=e.target.value; compiled=parseQuery(query); highlightTerms=termsFromQuery(query);
  searchErr.textContent = compiled.ok ? '' : "That search isn't complete yet — check quotes and parentheses.";
  renderCollections(); render();
});
const sortEl=document.getElementById('sort'), sortNote=document.getElementById('sortnote');
function refreshSortNote(){
  if(sortBy===defaultSort){ sortNote.innerHTML=`Sorted by your default (${SORT_LABELS[defaultSort]}).`; }
  else { sortNote.innerHTML=`Temporary sort — <a id="resetsort">return to default (${SORT_LABELS[defaultSort]})</a>.`;
    sortNote.querySelector('#resetsort').addEventListener('click',()=>{ sortBy=defaultSort; sortEl.value=sortBy; render(); refreshSortNote(); }); }
}
sortEl.value=sortBy;
sortEl.addEventListener('change',e=>{ sortBy=e.target.value; render(); refreshSortNote(); }); // temporary only, not persisted
refreshSortNote();

// settings: explicit default sort
document.getElementById('gear').addEventListener('click',()=>{
  const ov=document.createElement('div'); ov.className='overlay';
  const card=document.createElement('div'); card.className='card'; card.style.maxWidth='420px';
  card.innerHTML=`<div style="font-weight:600;margin-bottom:4px">Settings</div>
    <div class="setrow"><label>Default sort — how the list is ordered when you open the app</label>
      <select id="defsort">${Object.entries(SORT_LABELS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="hint" style="margin-top:8px">Changing the sort dropdown only affects this session; your default stays until you change it here.</div>
    <div class="setrow" style="margin-top:12px"><label>Text size</label>
      <select id="setfont"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></div>
    <div class="setrow" style="margin-top:12px"><label>Bookmarks shown per page</label>
      <select id="setpage"><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="0">All</option></select></div>
    <div class="setrow" style="margin-top:12px"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="setautocopy"> Automatically save a local copy when I save a bookmark</label></div>
    <div class="setrow" style="margin-top:12px"><label>Import / export (standard browser bookmarks file)</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn ghost" id="setexport" type="button">Export bookmarks.html</button>
        <button class="btn ghost" id="setimportbtn" type="button">Import bookmarks.html…</button>
        <input type="file" id="setimport" accept=".html,text/html" style="display:none">
      </div>
      <div class="hint">Keeps titles, tags and original dates. Already-saved links are skipped.</div>
    </div>
    <div class="row" style="margin-top:14px;display:flex;gap:8px"><button class="btn" id="setsave">Save</button><button class="btn ghost" id="setclose">Close</button></div>`;
  ov.appendChild(card); document.body.appendChild(ov);
  card.querySelector('#defsort').value=defaultSort;
  card.querySelector('#setautocopy').checked=autoCopy;
  card.querySelector('#setfont').value=fontSize;
  card.querySelector('#setpage').value=String(pageSize);
  card.querySelector('#setsave').addEventListener('click',()=>{ defaultSort=card.querySelector('#defsort').value;
    autoCopy=card.querySelector('#setautocopy').checked;
    fontSize=card.querySelector('#setfont').value; pageSize=Number(card.querySelector('#setpage').value);
    try{ localStorage.setItem('bm_default_sort',defaultSort); localStorage.setItem('bm_autocopy',autoCopy?'1':'0'); localStorage.setItem('bm_fontsize',fontSize); localStorage.setItem('bm_pagesize',String(pageSize)); }catch(_){}
    applyFontSize(); sortBy=defaultSort; sortEl.value=sortBy; page=1; render(); refreshSortNote(); ov.remove(); statusEl.textContent="Settings saved."; });
  card.querySelector('#setclose').addEventListener('click',()=>ov.remove());
  card.querySelector('#setexport').addEventListener('click',exportBookmarksHtml);
  const fileInput=card.querySelector('#setimport');
  card.querySelector('#setimportbtn').addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ importBookmarksHtml(String(r.result)); ov.remove(); }; r.readAsText(f); });
});

applyFontSize();
update();
document.body.setAttribute('data-harness-ready','true');
</script>
</body>
