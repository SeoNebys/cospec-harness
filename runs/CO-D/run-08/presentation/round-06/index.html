<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Home — Save flow prototype</title>
  <style>
    :root { color-scheme: light; --ink:#17201d; --muted:#66736e; --line:#dce4df; --paper:#fbfcfa; --green:#236b4b; --soft:#edf6f0; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f3f5f1; color:var(--ink); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(920px,calc(100% - 32px)); margin:56px auto; }
    header { display:flex; align-items:end; justify-content:space-between; margin-bottom:28px; }
    h1 { margin:0; font:700 30px/1.1 Georgia,serif; }
    header p { margin:6px 0 0; color:var(--muted); }
    .count { color:var(--muted); font-size:14px; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 30px rgba(20,42,32,.06); padding:22px; }
    form { display:flex; gap:10px; }
    label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    input { flex:1; min-width:0; padding:13px 15px; border:1px solid #bdcac3; border-radius:10px; background:white; font:inherit; }
    input:focus { outline:3px solid #cfe5d6; border-color:var(--green); }
    button { border:0; border-radius:10px; padding:0 19px; background:var(--green); color:white; font:700 15px/1 system-ui; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #message { min-height:24px; margin:12px 2px 0; color:var(--muted); font-size:14px; }
    .empty { padding:72px 24px; text-align:center; color:var(--muted); }
    .empty strong { display:block; color:var(--ink); font:700 23px/1.2 Georgia,serif; margin-bottom:7px; }
    .card { display:none; position:relative; margin-top:18px; background:white; border:1px solid var(--line); border-radius:14px; padding:20px; transition:border-color .15s,transform .15s; }
    .card.visible { display:block; }
    .card:hover { border-color:#91aa9c; transform:translateY(-1px); }
    .card.recalled { animation:recall 1.1s ease; }
    @keyframes recall { 0%,100%{box-shadow:none} 35%{box-shadow:0 0 0 5px #cfe5d6;border-color:var(--green)} }
    .card a { color:inherit; text-decoration:none; }
    .card a::after { content:""; position:absolute; inset:0; border-radius:14px; }
    .card a:focus-visible { outline:3px solid #cfe5d6; outline-offset:4px; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h2 { margin:8px 0 7px; font-size:20px; }
    .description { margin:0 0 14px; color:#46534e; }
    .source { color:var(--muted); font-size:14px; }
    @media (max-width:600px) { main{margin:28px auto} form{flex-direction:column} button{padding:14px} header{align-items:start;flex-direction:column;gap:8px} }
  </style>
</head>
<body>
  <main data-harness-ready="true">
    <header>
      <div><h1>Link Home</h1><p>Your personal collection</p></div>
      <div class="count" id="count">0 saved links</div>
    </header>
    <section class="panel" aria-labelledby="save-heading">
      <h2 id="save-heading" style="margin-top:0">Save a link</h2>
      <form id="save-form">
        <label for="url">Web address</label>
        <input id="url" type="url" required placeholder="Paste a web address…" autocomplete="off">
        <button id="save" type="submit">Save link</button>
      </form>
      <div id="message" role="status"></div>
    </section>
    <section id="empty" class="empty">
      <strong>No saved links yet</strong>
      Paste your first web address above to begin your collection.
    </section>
    <article id="card" class="card" tabindex="-1">
      <div class="eyebrow">To read</div>
      <h2><a id="title" target="_blank" rel="noopener"></a></h2>
      <p id="description" class="description"></p>
      <div id="source" class="source"></div>
    </article>
  </main>
  <script>
    const form = document.querySelector('#save-form');
    const input = document.querySelector('#url');
    const button = document.querySelector('#save');
    const message = document.querySelector('#message');
    const presets = {
      'developer.mozilla.org': ['JavaScript | MDN', 'JavaScript is a programming language used to make web pages interactive. Explore guides, references, and learning resources.'],
      'www.nationalgeographic.com': ['National Geographic', 'Explore stories about science, history, nature, and the world around us.'],
      'en.wikipedia.org': ['Wikipedia, the free encyclopedia', 'A free online encyclopedia, created and edited by volunteers around the world.']
    };
    let savedUrl = null;
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      let parsed;
      try { parsed = new URL(input.value); } catch { message.textContent = 'Enter a complete web address to save it.'; return; }
      if (savedUrl === parsed.href) {
        const card = document.querySelector('#card');
        message.textContent = 'You already saved this link. Here it is.';
        card.scrollIntoView({behavior:'smooth', block:'center'});
        card.focus({preventScroll:true});
        card.classList.remove('recalled');
        requestAnimationFrame(() => card.classList.add('recalled'));
        return;
      }
      button.disabled = true;
      message.textContent = 'Getting the page details…';
      setTimeout(() => {
        const fallbackName = parsed.hostname.replace(/^www\./,'').split('.')[0];
        const details = presets[parsed.hostname] || [fallbackName.charAt(0).toUpperCase()+fallbackName.slice(1), `A saved page from ${parsed.hostname}.`];
        const title = document.querySelector('#title');
        title.textContent = details[0];
        title.href = parsed.href;
        savedUrl = parsed.href;
        document.querySelector('#description').textContent = details[1];
        document.querySelector('#source').textContent = parsed.hostname;
        document.querySelector('#empty').style.display = 'none';
        document.querySelector('#card').classList.add('visible');
        document.querySelector('#count').textContent = '1 saved link';
        message.textContent = 'Saved with its page details.';
        button.disabled = false;
      }, 550);
    });
  </script>
</body>
</html>
