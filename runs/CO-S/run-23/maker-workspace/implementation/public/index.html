<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ea">
  <title>Trove — keep what matters</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Trove home">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span>Trove</span>
    </a>
    <nav class="views" aria-label="Bookmark views">
      <button class="view-button active" type="button" data-view="all">All bookmarks</button>
      <button class="view-button" type="button" data-view="later">Read later <span class="count-badge" id="later-count">0</span></button>
    </nav>
  </header>

  <main id="app">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Your personal web library</p>
      <h1 id="page-title">Keep what’s worth finding again.</h1>
      <p class="lede">Drop in a page. Trove saves the useful context so you can return to it when it matters.</p>

      <form class="save-form" id="save-form" novalidate>
        <label class="sr-only" for="save-url">Web address</label>
        <input id="save-url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="Paste a web address…" required>
        <button class="primary-button" id="save-button" type="submit">
          <span class="button-label">Save bookmark</span>
          <span class="button-progress" hidden>Collecting details…</span>
        </button>
      </form>
      <p class="form-message" id="save-message" aria-live="polite"></p>
    </section>

    <section class="collection" aria-labelledby="collection-title">
      <div class="toolbar">
        <div class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <label class="sr-only" for="search">Search saved pages</label>
          <input id="search" type="search" placeholder="Search titles, descriptions, and sites">
        </div>
        <p class="result-count" id="result-count" aria-live="polite">Loading…</p>
      </div>

      <div class="collection-heading">
        <div>
          <p class="section-kicker" id="section-kicker">Collection</p>
          <h2 id="collection-title">All bookmarks</h2>
        </div>
        <button class="filter-chip" id="clear-tag" type="button" hidden></button>
      </div>

      <div class="loading-state" id="loading-state" role="status">Opening your collection…</div>
      <div class="bookmark-list" id="bookmark-list"></div>
    </section>
  </main>

  <dialog class="edit-dialog" id="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit-form" method="dialog" novalidate>
      <div class="dialog-heading">
        <div>
          <p class="section-kicker">Saved bookmark</p>
          <h2 id="edit-heading">Edit details</h2>
        </div>
        <button class="icon-button" id="close-edit" type="button" aria-label="Close edit form">×</button>
      </div>

      <label>Web address<input id="edit-url" type="url" required></label>
      <label>Title<input id="edit-title" type="text" maxlength="500" required></label>
      <label>Description<textarea id="edit-description" maxlength="3000" rows="4"></textarea></label>
      <label>Tags<input id="edit-tags" type="text" aria-describedby="tag-help"><span class="field-help" id="tag-help">Separate tags with commas</span></label>
      <p class="dialog-message" id="edit-message" aria-live="polite"></p>

      <div class="dialog-actions">
        <button class="secondary-button" id="cancel-edit" type="button">Cancel</button>
        <button class="primary-button" id="save-edit" type="submit">Save changes</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
