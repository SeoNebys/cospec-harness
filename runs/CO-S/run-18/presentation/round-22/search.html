<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keepmark — search</title>
  <style>
    :root{color-scheme:light;--ink:#17211d;--muted:#66716c;--line:#dfe5e1;--paper:#fbfcfa;--white:#fff;--accent:#176b4d;--wash:#eaf3ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:760;letter-spacing:-.02em}.mark{width:31px;height:36px;background:var(--accent);border-radius:6px 6px 10px 10px;position:relative}.mark:after{content:"";position:absolute;bottom:-1px;left:7px;border:8px solid transparent;border-bottom-color:white}.scope{font-size:13px;color:var(--muted);background:#f2f5f3;padding:6px 10px;border-radius:999px}main{width:min(1040px,calc(100% - 40px));margin:46px auto}.topline{display:flex;justify-content:space-between;align-items:end;margin-bottom:23px}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}h1{font-size:38px;letter-spacing:-.04em;margin:8px 0 0}.save{color:var(--accent);font-weight:700;border:1px solid #bcd4c7;background:#fff;border-radius:9px;padding:10px 14px}.search-wrap{position:relative}.search-icon{position:absolute;left:17px;top:16px;color:var(--muted);font-size:19px}.search{width:100%;height:54px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 18px 0 49px;font:inherit;font-size:16px;outline:none;box-shadow:0 8px 24px rgba(30,55,43,.06)}.search:focus{border-color:#78a68f;box-shadow:0 0 0 3px #e1eee7}.meta{display:flex;justify-content:space-between;align-items:center;margin:28px 0 11px;padding-bottom:12px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0}.result-count{color:var(--muted);font-size:14px}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px 21px;display:grid;grid-template-columns:1fr auto;gap:16px}.title{font-weight:730;font-size:18px;color:var(--ink);text-decoration:none}.title:hover{color:var(--accent);text-decoration:underline}.description{margin:6px 0 9px;color:var(--muted);line-height:1.45}.url{font-size:12px;color:var(--accent)}.tags{display:flex;gap:6px;margin-top:13px}.tag{background:var(--wash);color:#10533b;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.note{margin-top:12px;padding-top:11px;border-top:1px solid #edf0ee;font-size:13px;color:#56615c}.date{font-size:12px;color:var(--muted);white-space:nowrap}.empty{text-align:center;padding:70px;color:var(--muted)}mark{background:#fff0a8;border-radius:2px;padding:0 1px}@media(max-width:620px){header{padding:0 20px}.topline{align-items:start;gap:12px}.card{grid-template-columns:1fr}.date{display:none}}
  </style>
</head>
<body><header><div class="brand"><span class="mark"></span>Keepmark</div><div class="scope">Personal library</div></header>
  <main data-harness-ready="true"><div class="topline"><div><div class="eyebrow">Your bookmark library</div><h1>All bookmarks</h1></div><button class="save">＋ Save a link</button></div>
    <label class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="Search titles, notes, addresses, and tags…" aria-label="Search bookmarks"></label>
    <div class="meta"><h2 id="heading">Recently saved</h2><span id="count" class="result-count">4 bookmarks</span></div>
    <div id="cards" class="cards"></div>
  </main>
  <script>
    const bookmarks=[
      {title:'Patterns.dev',description:'A free book on design patterns and component patterns for building powerful web apps.',url:'https://www.patterns.dev/',tags:['javascript','reference'],note:'Revisit the rendering patterns chapter.',date:'Today'},
      {title:'A Complete Guide to Flexbox',description:'A complete guide to CSS flexbox, including properties for parents and children.',url:'https://css-tricks.com/snippets/css/a-guide-to-flexbox/',tags:['css','reference'],note:'Useful diagrams for layout work.',date:'Yesterday'},
      {title:'The Marginalian',description:'Long-form writing on books, philosophy, creativity, and the search for meaning.',url:'https://www.themarginalian.org/',tags:['reading'],note:'Read the piece on attention later.',date:'Sep 20'},
      {title:'Linear Method',description:'Practices for building product and creating momentum in modern software teams.',url:'https://linear.app/method',tags:['product','work'],note:'Share planning section with the team.',date:'Sep 18'}
    ];
    const cards=document.querySelector('#cards'),input=document.querySelector('#search'),heading=document.querySelector('#heading'),count=document.querySelector('#count');
    function render(){const q=input.value.trim().toLowerCase();const found=bookmarks.filter(b=>[b.title,b.description,b.url,b.note,...b.tags].some(v=>v.toLowerCase().includes(q)));heading.textContent=q?`Results for “${input.value.trim()}”`:'Recently saved';count.textContent=`${found.length} ${found.length===1?'bookmark':'bookmarks'}`;cards.innerHTML=found.map(b=>`<article class="card"><div><a class="title" href="${b.url}" target="_blank">${b.title}</a><p class="description">${b.description}</p><div class="url">${b.url}</div><div class="tags">${b.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="note">Note: ${b.note}</div></div><span class="date">${b.date}</span></article>`).join('')||'<div class="empty">No bookmarks match that search.</div>'}
    input.addEventListener('input',render);render();
  </script>
</body></html>
