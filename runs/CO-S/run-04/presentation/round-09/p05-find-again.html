<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — prototype 05 (find again)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; background: #f4f5f7; color: #1c1e21;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 36px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #65676b; margin: 0 0 24px; font-size: 14px; }
  .adder {
    display: flex; gap: 8px; background: #fff; padding: 12px;
    border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .adder input {
    flex: 1; border: 1px solid #d0d3d8; border-radius: 8px;
    padding: 10px 12px; font-size: 15px;
  }
  .adder button {
    border: 0; background: #2d6cdf; color: #fff; font-size: 15px;
    padding: 0 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .searchbar { position: relative; margin-top: 18px; }
  .searchbar input {
    width: 100%; border: 1px solid #d0d3d8; border-radius: 10px;
    padding: 11px 14px 11px 38px; font-size: 15px; background: #fff;
  }
  .searchbar::before {
    content: '🔍'; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 14px; opacity: .6;
  }
  .count { margin: 22px 0 12px; font-size: 13px; color: #65676b; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { background: #fff; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .titlerow { display: flex; align-items: center; gap: 6px; }
  .title {
    font-size: 15px; font-weight: 600; color: #2d6cdf; cursor: pointer;
    border-radius: 4px; padding: 1px 3px; margin-left: -3px;
  }
  .title:hover { text-decoration: underline; }
  .title mark { background: #ffe58a; color: inherit; border-radius: 2px; }
  .link-url { font-size: 12px; color: #90949c; word-break: break-all; margin-top: 3px; }
  .link-url mark { background: #ffe58a; color: inherit; border-radius: 2px; }
  .pencil { opacity: 0; border: 0; background: transparent; cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 5px; color: #65676b; transition: opacity .12s; }
  li:hover .pencil { opacity: 1; }
  .pencil:hover { background: #eef1f6; }
  input.edit { font-size: 15px; font-weight: 600; border: 1px solid #2d6cdf; border-radius: 6px; padding: 4px 6px; width: 100%; font-family: inherit; }
  .empty { color: #90949c; font-size: 14px; padding: 24px 0; text-align: center; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c1e21; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Your one spot for links.</p>

    <form class="adder" id="adder">
      <input id="url" type="text" placeholder="Paste a link here…" autocomplete="off">
      <button type="submit">Save</button>
    </form>

    <div class="searchbar">
      <input id="search" type="text" placeholder="Search your links…" autocomplete="off">
    </div>

    <div class="count" id="count"></div>
    <ul id="list"></ul>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  // Pre-loaded sample library (newest first).
  const items = [
    { title: 'How to Pull the Perfect Shot of Espresso — Coffee Weekly', url: 'https://coffeeweekly.com/perfect-espresso' },
    { title: 'Understanding TCP Congestion Control', url: 'https://networking.example.edu/tcp-congestion' },
    { title: 'The 50 Best Sci-Fi Books of the Decade — The Verge', url: 'https://theverge.com/best-scifi-books' },
    { title: 'Sourdough Starter: A Beginner Guide', url: 'https://bakingschool.example.com/sourdough-starter' },
    { title: '2ku83jd — Longreads', url: 'https://longreads.example.net/a/2ku83jd?ref=share' },
    { title: 'Rust Ownership Explained — GitHub', url: 'https://github.com/rust-lang/book/ch04' },
    { title: 'Cheap Flights to Lisbon in October', url: 'https://flightdeals.example.com/lisbon-oct' },
    { title: 'The Science of a Good Night’s Sleep', url: 'https://health.example.org/sleep-science' },
    { title: 'Design Systems at Scale — Medium', url: 'https://medium.com/design-systems-at-scale' },
    { title: 'Home Espresso Machine Buying Guide', url: 'https://coffeegear.example.com/espresso-buying-guide' },
    { title: 'Introduction to Watercolor Painting', url: 'https://artclass.example.com/watercolor-intro' },
    { title: 'How Interest Rates Affect the Housing Market', url: 'https://finance.example.com/rates-housing' },
    { title: 'The Best Hiking Trails Near Portland', url: 'https://trailfinder.example.com/portland' },
    { title: 'JavaScript Async/Await Deep Dive — Medium', url: 'https://medium.com/js-async-await' }
  ];

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const form = document.getElementById('adder');
  const urlEl = document.getElementById('url');
  let query = '';

  function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function highlight(text, q) {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }
  function matches(it, q) {
    if (!q) return true;
    const s = q.toLowerCase();
    return it.title.toLowerCase().includes(s) || it.url.toLowerCase().includes(s);
  }

  function render() {
    const shown = items.filter(it => matches(it, query));
    if (items.length === 0) {
      countEl.textContent = '';
      listEl.innerHTML = '<li class="empty">Nothing saved yet. Paste a link above to get started.</li>';
      return;
    }
    if (shown.length === 0) {
      countEl.textContent = 'No matches';
      listEl.innerHTML = '<li class="empty">No links match “' + esc(query) + '”.</li>';
      return;
    }
    countEl.textContent = query
      ? shown.length + ' of ' + items.length + ' links'
      : items.length + ' links saved';
    listEl.innerHTML = '';
    shown.forEach(it => {
      const idx = items.indexOf(it);
      const li = document.createElement('li');
      const row = document.createElement('div'); row.className = 'titlerow';
      const t = document.createElement('span'); t.className = 'title';
      t.innerHTML = highlight(it.title, query);
      t.addEventListener('click', () => showToast('Opening: ' + it.title));
      const pencil = document.createElement('button'); pencil.className = 'pencil'; pencil.textContent = '✎'; pencil.title = 'Rename';
      pencil.addEventListener('click', () => {
        const input = document.createElement('input'); input.className = 'edit'; input.value = it.title;
        row.replaceChild(input, t); setTimeout(() => { input.focus(); input.select(); }, 0);
        function commit() { const v = input.value.trim(); if (v) items[idx].title = v; render(); }
        input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') render(); });
        input.addEventListener('blur', commit);
      });
      row.appendChild(t); row.appendChild(pencil);
      const u = document.createElement('div'); u.className = 'link-url'; u.innerHTML = highlight(it.url, query);
      li.appendChild(row); li.appendChild(u);
      listEl.appendChild(li);
    });
  }

  searchEl.addEventListener('input', () => { query = searchEl.value.trim(); render(); });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const url = urlEl.value.trim(); if (!url) return;
    items.unshift({ title: url, url: url });
    urlEl.value = ''; render();
  });

  render();
</script>
</body>
</html>
