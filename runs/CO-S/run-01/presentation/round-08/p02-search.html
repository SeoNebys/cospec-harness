<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookmarks — prototype p02</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a1a;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; margin: 0 0 20px; }
  .addbar {
    display: flex; gap: 8px; background: #fff; padding: 12px;
    border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 16px;
  }
  .addbar input {
    flex: 1; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 10px 12px; font-size: 15px;
  }
  .addbar button {
    border: 0; background: #2563eb; color: #fff; font-size: 15px;
    padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .addbar button:hover { background: #1d4ed8; }
  .searchbar { position: relative; margin-bottom: 20px; }
  .searchbar input {
    width: 100%; border: 1px solid #d1d5db; border-radius: 10px;
    padding: 12px 14px 12px 40px; font-size: 15px; background: #fff;
  }
  .searchbar .icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: #9ca3af; font-size: 15px;
  }
  .count { color: #6b7280; font-size: 13px; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .favicon {
    width: 32px; height: 32px; border-radius: 8px; background: #eef2ff;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    color: #4f46e5; font-weight: 700; flex-shrink: 0;
  }
  .meta { min-width: 0; }
  .title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .title a { color: #111827; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .url { font-size: 12.5px; color: #6b7280; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  mark { background: #fde68a; padding: 0 1px; border-radius: 2px; }
  .empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Bookmarks</h1>
  <p class="sub">Paste to save. Type in the search box to find something later.</p>

  <div class="addbar">
    <input id="urlInput" type="text" placeholder="Paste a link here, e.g. https://…" />
    <button id="addBtn">Save</button>
  </div>

  <div class="searchbar">
    <span class="icon">&#128269;</span>
    <input id="searchInput" type="text" placeholder="Search your saved links…" autofocus />
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
</div>

<script>
  // Pre-seeded "pile" of already-saved links so search is meaningful.
  const bookmarks = [
    { title: 'A 3-Day Guide to Kyoto in Autumn', host: 'nytimes.com', href: 'https://nytimes.com/2026/travel/kyoto-guide' },
    { title: 'The state of AI agents in 2026: what actually works', host: 'arstechnica.com', href: 'https://arstechnica.com/ai-agents-2026' },
    { title: 'openai/whisper: Robust Speech Recognition', host: 'github.com', href: 'https://github.com/openai/whisper' },
    { title: 'How to make a proper Neapolitan pizza dough', host: 'seriouseats.com', href: 'https://seriouseats.com/neapolitan-pizza' },
    { title: 'The best noise-cancelling headphones of 2026', host: 'theverge.com', href: 'https://theverge.com/best-headphones-2026' },
    { title: 'Understanding CSS Grid layout, once and for all', host: 'css-tricks.com', href: 'https://css-tricks.com/css-grid' },
    { title: 'A weekend itinerary for Lisbon on a budget', host: 'lonelyplanet.com', href: 'https://lonelyplanet.com/lisbon-weekend' },
    { title: 'Rust vs Go for backend services in 2026', host: 'infoq.com', href: 'https://infoq.com/rust-vs-go-2026' }
  ];

  const list = document.getElementById('list');
  const urlInput = document.getElementById('urlInput');
  const searchInput = document.getElementById('searchInput');
  const countEl = document.getElementById('count');

  function hostOf(href) {
    try { return new URL(href).hostname.replace(/^www\./, ''); }
    catch (e) { return href; }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  function highlight(text, q) {
    const safe = escapeHtml(text);
    if (!q) return safe;
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return safe;
    const before = escapeHtml(text.slice(0, i));
    const match = escapeHtml(text.slice(i, i + q.length));
    const after = escapeHtml(text.slice(i + q.length));
    return before + '<mark>' + match + '</mark>' + after;
  }

  function render() {
    const q = searchInput.value.trim();
    const ql = q.toLowerCase();
    const visible = bookmarks.filter(b =>
      !ql || b.title.toLowerCase().includes(ql) || b.host.toLowerCase().includes(ql)
    );

    if (!q) {
      countEl.textContent = bookmarks.length + ' saved links';
    } else {
      countEl.textContent = visible.length + ' match' + (visible.length === 1 ? '' : 'es') +
        ' for "' + escapeHtml(q) + '"';
    }

    if (!visible.length) {
      list.innerHTML = '<li class="empty">No matches.</li>';
      return;
    }
    list.innerHTML = '';
    visible.forEach(b => {
      const li = document.createElement('li');
      li.innerHTML =
        '<div class="favicon">' + b.title.charAt(0).toUpperCase() + '</div>' +
        '<div class="meta">' +
          '<p class="title"><a href="' + b.href + '" target="_blank">' + highlight(b.title, q) + '</a></p>' +
          '<p class="url">' + highlight(b.host, q) + '</p>' +
        '</div>';
      list.appendChild(li);
    });
  }

  function add() {
    const raw = urlInput.value.trim();
    if (!raw) return;
    let href = raw;
    if (!/^https?:\/\//i.test(href)) href = 'https://' + href;
    const host = hostOf(href);
    const base = host.split('.')[0];
    bookmarks.unshift({ title: base.charAt(0).toUpperCase() + base.slice(1), host, href });
    urlInput.value = '';
    searchInput.value = '';
    render();
  }

  document.getElementById('addBtn').addEventListener('click', add);
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  searchInput.addEventListener('input', render);
  render();
</script>
</body>
</html>
