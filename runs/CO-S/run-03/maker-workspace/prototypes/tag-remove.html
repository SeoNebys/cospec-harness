<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keep — Remove tags</title>
<style>
:root{color-scheme:light;--ink:#17211d;--muted:#68736e;--line:#dce3df;--paper:#fbfcfa;--green:#245c45;--green-soft:#e7f1eb;--cream:#f3f0e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:68px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.shell{width:min(920px,calc(100% - 48px));margin:0 auto}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px}.mark{width:29px;height:34px;border-radius:4px 4px 9px 9px;background:var(--green)}main{padding:58px 0}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.11em;text-transform:uppercase}h1{margin:8px 0 32px;font:600 40px/1.08 Georgia,serif;letter-spacing:-.03em}.library-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px}h2{margin:0;font-size:17px}.count{color:var(--muted);font-size:13px}.card{display:grid;grid-template-columns:58px 1fr;gap:16px;padding:22px 4px;border-bottom:1px solid var(--line);align-items:start}.thumb{width:58px;height:58px;display:grid;place-items:center;border-radius:12px;background:var(--cream);color:var(--green);font:700 22px Georgia,serif}.domain{color:var(--green);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.title{margin:3px 0;font:600 20px/1.25 Georgia,serif}.summary{margin:0;color:var(--muted)}.tags{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:12px}.tag{display:inline-flex;align-items:center;height:27px;padding:0 10px;border:0;border-radius:999px;background:var(--green-soft);color:var(--green);font:680 12px inherit}.remove-tag{cursor:pointer}.remove-tag[hidden]{display:none}.remove-tag .x{margin-left:7px;font-size:15px;line-height:1}.secondary{height:29px;padding:0 10px;border:1px solid #c6d6cd;border-radius:999px;background:white;color:var(--green);font:680 12px inherit;cursor:pointer}.manager{display:none;margin-top:13px;padding:14px;border-radius:10px;background:#f3f6f4}.manager.visible{display:block}.checks{display:flex;gap:18px}.checks label{display:flex;align-items:center;gap:6px;font-weight:650}.save{height:36px;margin-top:13px;padding:0 13px;border:0;border-radius:8px;background:var(--green);color:white;font:700 13px inherit;cursor:pointer}.chip-mode .manage{display:none}.manage-mode .remove-tag{pointer-events:none}.manage-mode .remove-tag .x{display:none}@media(max-width:620px){.shell{width:min(100% - 28px,920px)}.card{grid-template-columns:48px 1fr}.thumb{width:48px;height:48px}}
</style></head>
<body><header><div class="shell brand"><span class="mark"></span><span>Keep</span></div></header><main class="shell" data-harness-ready="true"><div class="eyebrow">Your bookmark library</div><h1>All bookmarks</h1><section><div class="library-head"><h2>Saved</h2><span class="count">1 bookmark</span></div><article class="card"><div class="thumb">D</div><div><div class="domain">example.com</div><h3 class="title">Design systems, without the jargon</h3><p class="summary">A practical guide to reusable foundations and shared patterns.</p><div class="tags" id="tags"><button class="tag remove-tag" data-tag="design" aria-label="Remove design tag"><span>design</span><span class="x">×</span></button><button class="tag remove-tag" data-tag="work" aria-label="Remove work tag"><span>work</span><span class="x">×</span></button><button class="secondary">+ Add tags</button><button class="secondary manage" id="manage">Manage tags</button></div><form class="manager" id="manager"><div class="checks"><label><input type="checkbox" value="design" checked>design</label><label><input type="checkbox" value="work" checked>work</label></div><button class="save" type="submit">Save tags</button></form></div></article></section></main>
<script>const mode=new URLSearchParams(location.search).get('mode')||'chip';document.body.classList.add(mode==='manage'?'manage-mode':'chip-mode');document.querySelectorAll('.remove-tag').forEach(button=>button.addEventListener('click',()=>{if(mode==='chip')button.remove()}));document.querySelector('#manage').addEventListener('click',()=>document.querySelector('#manager').classList.add('visible'));document.querySelector('#manager').addEventListener('submit',event=>{event.preventDefault();const kept=[...event.currentTarget.querySelectorAll('input:checked')].map(input=>input.value);document.querySelectorAll('.remove-tag').forEach(button=>button.hidden=!kept.includes(button.dataset.tag));event.currentTarget.classList.remove('visible')});</script>
</body></html>
