<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks — Large collection boundary</title>
  <style>
    :root{--ink:#1d2925;--muted:#697772;--paper:#f7f5ef;--card:#fffdfa;--line:#dedbd1;--green:#286851;--green-soft:#e4efe8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 14% 5%,rgba(191,215,198,.36),transparent 27rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1080px,calc(100% - 48px));margin:0 auto}header{display:flex;align-items:center;height:88px;border-bottom:1px solid rgba(102,116,109,.18)}.brand{display:flex;align-items:center;gap:11px;font:700 22px/1 Georgia,serif}.brand-mark{display:grid;place-items:center;width:34px;height:34px;color:#fff;background:var(--green);border-radius:11px 11px 11px 4px}main{padding:56px 0 90px}.eyebrow{margin:0 0 9px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font:500 43px/1.08 Georgia,serif;letter-spacing:-.035em}.intro{margin:13px 0 28px;color:var(--muted)}.search-wrap{position:relative;margin-bottom:36px}.search-icon{position:absolute;left:15px;top:50%;color:var(--muted);transform:translateY(-50%)}#search{width:100%;height:52px;padding:0 15px 0 43px;color:var(--ink);background:#fff;border:1px solid #cbc9c0;border-radius:12px;font:inherit}#search:focus{outline:3px solid rgba(40,104,81,.18);border-color:var(--green)}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}h2{margin:0;font:600 24px/1.2 Georgia,serif}.count{color:var(--muted);font-size:14px}.list{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:13px;min-width:0;padding:17px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 16px rgba(45,56,50,.04)}.card.hidden{display:none}.icon{display:grid;place-items:center;width:42px;height:42px;color:var(--green);background:var(--green-soft);border-radius:11px;font:700 17px/1 Georgia,serif}.details{min-width:0}.title{display:-webkit-box;overflow:hidden;margin:0 0 4px;font-size:15px;font-weight:800;line-height:1.3;-webkit-box-orient:vertical;-webkit-line-clamp:2}.url{overflow:hidden;margin:0 0 8px;color:var(--muted);font-size:13px;text-overflow:ellipsis;white-space:nowrap}.chip{display:block;overflow:hidden;width:max-content;max-width:100%;padding:4px 8px;color:var(--green);background:var(--green-soft);border-radius:999px;font-size:11px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.empty{display:none;padding:45px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:15px}.empty.visible{display:block}@media(max-width:700px){.shell{width:min(100% - 28px,1080px)}.list{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="shell" id="shell"><header><div class="brand"><span class="brand-mark">B</span> Bookmarks</div></header><main><p class="eyebrow">A well-used collection</p><h1>Find one link among many.</h1><p class="intro">This sample collection contains ordinary entries and one bookmark with unusually long details.</p><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" type="search" aria-label="Search bookmarks" placeholder="Search 121 bookmarks"></div><div class="heading"><h2 id="heading">All bookmarks</h2><span class="count" id="count">121 bookmarks</span></div><section class="list" id="list"></section><div class="empty" id="empty">No bookmarks match that search.</div></main></div>
  <script>
    const special={name:'A comprehensive accessibility checklist for inclusive web interfaces, keyboard navigation, readable content, and assistive technology support',url:'https://knowledge.example.org/design-and-development/accessibility/a-very-long-reference-address-for-inclusive-web-interface-checklists-and-practical-examples',collection:'Design systems, inclusive interfaces, and accessibility research'};
    const items=[special,...Array.from({length:120},(_,i)=>({name:`Saved reference guide ${String(i+1).padStart(3,'0')}`,url:`https://reference.example.org/guides/${i+1}`,collection:['Reading','Cooking','Travel','Web development'][i%4]}))];const list=document.querySelector('#list');
    items.forEach((item,index)=>{const card=document.createElement('article');card.className='card';card.dataset.search=`${item.name} ${item.url}`.toLowerCase();card.innerHTML=`<div class="icon">${item.name[0]}</div><div class="details"><p class="title" title="${item.name}">${item.name}</p><p class="url" title="${item.url}">${item.url}</p><span class="chip" title="${item.collection}">${item.collection}</span></div>`;list.appendChild(card)});const cards=[...document.querySelectorAll('.card')];document.querySelector('#shell').setAttribute('data-harness-ready','true');
    document.querySelector('#search').addEventListener('input',event=>{const raw=event.target.value.trim(),term=raw.toLowerCase();let count=0;cards.forEach(card=>{const show=card.dataset.search.includes(term);card.classList.toggle('hidden',!show);if(show)count++});document.querySelector('#count').textContent=`${count} ${count===1?'result':'results'}`;document.querySelector('#heading').textContent=term?`Results for “${raw}”`:'All bookmarks';document.querySelector('#empty').classList.toggle('visible',count===0)});
  </script>
</body>
</html>
