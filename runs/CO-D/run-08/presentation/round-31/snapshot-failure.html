<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Home — Page copy unavailable</title><style>:root{--ink:#17201d;--muted:#66736e;--line:#dce4df;--green:#236b4b;--soft:#edf6f0;--amber:#8a5a12}*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{width:min(920px,calc(100% - 32px));margin:48px auto}h1{font:700 30px/1.1 Georgia,serif;margin:0}.sub{color:var(--muted);margin:6px 0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.card h2{font-size:20px;margin:7px 0}.card p{color:#46534e;margin:0 0 10px}.source{font-size:13px;color:var(--muted)}.copy{font-size:13px;color:var(--amber);margin-top:14px}.copy.ready{color:var(--green)}.copy button{border:0;background:none;color:inherit;padding:0;text-decoration:underline;font:700 13px system-ui;cursor:pointer}.notice{margin-top:16px;padding:12px 14px;border-radius:10px;background:#fff7e8;color:#70490f;font-size:14px}.notice.success{background:var(--soft);color:var(--green)}</style></head><body><main data-harness-ready="true"><h1>Link Home</h1><p class="sub">Your personal collection</p><article class="card"><div class="eyebrow">To read</div><h2>Example private article</h2><p>A bookmark whose page did not allow a copy to be captured.</p><div class="source">example.com</div><div class="copy">Page copy unavailable · <button id="retry">Try again</button></div></article><div class="notice" role="status">The bookmark is safe, but Link Home couldn’t capture a readable copy. You can try again later.</div></main><script>document.querySelector('#retry').onclick=()=>{const copy=document.querySelector('.copy'),notice=document.querySelector('.notice');copy.classList.add('ready');copy.innerHTML='Saved with page copy · <button>Open copy</button>';notice.classList.add('success');notice.textContent='Readable page copy captured.'}</script></body></html>
