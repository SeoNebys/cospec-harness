<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔖</span>
      <h1>Bookmarks</h1>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off" />
    </div>
    <button id="new-btn" class="btn primary">+ New bookmark</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <nav class="filters">
        <button class="filter active" data-filter="all">All bookmarks</button>
        <button class="filter" data-filter="favorites">★ Favorites</button>
      </nav>
      <div class="tags-section">
        <h2>Tags</h2>
        <ul id="tag-list" class="tag-list"></ul>
      </div>
    </aside>

    <section class="content">
      <div id="active-filter" class="active-filter-bar" hidden></div>
      <div id="list" class="bookmark-grid"></div>
      <div id="empty" class="empty-state" hidden></div>
    </section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">New bookmark</h2>
      <form id="bookmark-form">
        <input type="hidden" id="bm-id" />
        <label>Title
          <input id="bm-title" type="text" required maxlength="300" />
        </label>
        <label>URL
          <input id="bm-url" type="text" required placeholder="https://example.com" />
        </label>
        <label>Description
          <textarea id="bm-description" rows="3" maxlength="2000"></textarea>
        </label>
        <label>Tags <span class="hint">(comma separated)</span>
          <input id="bm-tags" type="text" placeholder="work, reading, tools" />
        </label>
        <label class="checkbox">
          <input id="bm-favorite" type="checkbox" /> Mark as favorite
        </label>
        <div id="form-errors" class="form-errors" hidden></div>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
