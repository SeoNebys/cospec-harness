<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keepwell — Invalid address prototype</title><style>
  :root{--ink:#1d2722;--muted:#647069;--line:#dce2dd;--paper:#fffef9;--wash:#f2f3ec;--green:#245f49;--dark:#194735;--red:#8a3d38;--redwash:#f7e9e6;--accent:#e6a34c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--wash);color:var(--ink)}button,input{font:inherit}.shell{min-height:100vh}header{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--paper)}.brand{display:flex;align-items:center;gap:10px;font-weight:780;font-size:20px}.mark{width:28px;height:34px;border-radius:4px 4px 10px 10px;background:var(--green)}.profile{width:34px;height:34px;border:0;border-radius:50%;background:#dce9e1;color:var(--dark);font-weight:750}main{width:min(860px,90vw);margin:0 auto;padding:40px 0 70px}h1{margin:0;font:500 clamp(34px,5vw,50px)/1 Georgia,serif}.lead{margin:9px 0 24px;color:var(--muted)}.savebar{display:flex;gap:9px;padding:9px;border:1px solid var(--line);border-radius:13px;background:var(--paper)}.savebar.invalid{border-color:#c77b72;outline:3px solid rgba(164,72,61,.12)}.savebar input{min-width:0;flex:1;border:0;padding:7px}.savebar input:focus{outline:0}.savebar:focus-within{outline:3px solid rgba(230,163,76,.42)}.primary{border:0;border-radius:9px;background:var(--green);color:white;padding:10px 14px;font-weight:700;cursor:pointer}.error{margin:8px 3px 0;color:var(--red);font-size:14px}.empty{margin-top:28px;padding:55px 25px;text-align:center;border:1px dashed #bdc8c0;border-radius:15px;background:rgba(255,254,249,.65)}.empty h2{margin:0 0 7px;font:500 26px Georgia,serif}.empty p{margin:0;color:var(--muted)}.checking{margin-top:20px;padding:14px;border-radius:10px;background:#e4f1e8;color:var(--dark);font-weight:680}[hidden]{display:none!important}@media(max-width:620px){header{padding:0 18px}main{width:calc(100vw - 28px)}.savebar{flex-wrap:wrap}.savebar input{flex-basis:100%}.savebar .primary{width:100%}}
</style></head><body><div class="shell" data-harness-ready="true"><header><div class="brand"><span class="mark"></span>Keepwell</div><button class="profile" aria-label="Profile">AM</button></header><main><h1>Your library</h1><p class="lead">Paste a web address to save something worth finding again.</p><div class="savebar" id="savebar"><input id="address" aria-label="Web address" placeholder="Paste a web address"><button class="primary" id="continue">Continue</button></div><p class="error" id="error" role="alert" hidden></p><div class="checking" id="checking" hidden>Address accepted. Gathering page details…</div><section class="empty"><h2>Your first good find belongs here</h2><p>Nothing is added until the address can be understood.</p></section></main></div><script>
  const input=document.querySelector('#address'),error=document.querySelector('#error'),bar=document.querySelector('#savebar'),checking=document.querySelector('#checking');document.querySelector('#continue').addEventListener('click',()=>{const value=input.value.trim();checking.hidden=true;if(!value){error.textContent='Paste a web address to continue.';error.hidden=false;bar.classList.add('invalid');input.focus();return}let valid=false;try{const url=new URL(value);valid=url.protocol==='http:'||url.protocol==='https:'}catch{}if(!valid){error.textContent='This doesn’t look like a complete web address. Try one beginning with http:// or https://.';error.hidden=false;bar.classList.add('invalid');input.focus();return}error.hidden=true;bar.classList.remove('invalid');checking.hidden=false});input.addEventListener('keydown',event=>{if(event.key==='Enter')document.querySelector('#continue').click()});
</script></body></html>
