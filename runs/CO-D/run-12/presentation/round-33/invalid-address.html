<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — Check the address</title><style>
:root{--ink:#17231e;--muted:#68736d;--paper:#f5f2e9;--card:#fffdf7;--line:#d9d5ca;--green:#235d45;--red:#8b3f31;--redpale:#f7e8e3}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 80% 10%,#dce8dd,transparent 30rem),var(--paper);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}.shell{width:min(860px,calc(100% - 44px));margin:auto}header{height:78px;display:flex;align-items:center;border-bottom:1px solid rgba(23,35,30,.1);font-weight:760}.mark{width:34px;height:34px;margin-right:10px;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:11px}main{padding:70px 0}h1{margin:0;font:500 50px/1 Georgia,serif;letter-spacing:-.04em}.lead{margin:12px 0 32px;color:var(--muted);font-size:16px}.savebox{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 14px 40px rgba(36,48,41,.08)}.savebox.invalid{border-color:#c88170;box-shadow:0 0 0 3px rgba(139,63,49,.1)}.savebox input{flex:1;min-width:0;padding:11px;border:0;outline:0;color:var(--ink);background:transparent}.savebox button{padding:11px 16px;border:0;border-radius:9px;color:#fff;background:var(--green);font-weight:730;cursor:pointer}.error{display:none;margin:9px 12px 0;color:var(--red);font-size:12px;font-weight:650}.error.visible{display:block}.example{font-weight:500;color:var(--muted)}@media(max-width:620px){.savebox{flex-direction:column}}
</style></head><body><div class="shell" data-harness-ready="true"><header><span class="mark">T</span>Trove</header><main><h1>Save a link.</h1><p class="lead">Paste an address and Trove will get the details ready.</p><form class="savebox" id="form" novalidate><input aria-label="Web address" value="my favorite cooking page"><button>Get details</button></form><p class="error" id="error" role="alert">That doesn’t look like a complete web address. <span class="example">Try something like https://example.com/page</span></p></main></div><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();e.currentTarget.classList.add('invalid');document.querySelector('#error').classList.add('visible');e.currentTarget.querySelector('input').focus()}</script></body></html>
