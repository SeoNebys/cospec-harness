<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks — prototype 02</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; background: #f4f5f7; color: #1c1e21;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #65676b; margin: 0 0 28px; font-size: 14px; }
  .adder {
    display: flex; gap: 8px; background: #fff; padding: 12px;
    border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .adder input {
    flex: 1; border: 1px solid #d0d3d8; border-radius: 8px;
    padding: 10px 12px; font-size: 15px;
  }
  .adder input:focus { outline: 2px solid #2d6cdf; border-color: transparent; }
  .adder button {
    border: 0; background: #2d6cdf; color: #fff; font-size: 15px;
    padding: 0 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .count { margin: 30px 0 12px; font-size: 13px; color: #65676b; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .title { font-size: 15px; font-weight: 600; color: #1c1e21; margin-bottom: 3px; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .link-url { font-size: 12px; color: #90949c; word-break: break-all; }
  .fetching .title { color: #90949c; font-style: italic; }
  .empty { color: #90949c; font-size: 14px; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>My Bookmarks</h1>
    <p class="sub">Your one spot for links.</p>

    <form class="adder" id="adder">
      <input id="url" type="text" placeholder="Paste a link here…" autocomplete="off" autofocus>
      <button type="submit">Save</button>
    </form>

    <div class="count" id="count"></div>
    <ul id="list"></ul>
  </div>

<script>
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const form = document.getElementById('adder');
  const input = document.getElementById('url');
  const items = [];  // { url, title, fetching }

  // --- Prototype simulation of "the app figures out the page name for you" ---
  // (In the real app this would come from the actual page. Here we fake a
  //  believable title so you can judge the experience.)
  const KNOWN = {
    'nytimes.com': 'The New York Times',
    'wikipedia.org': 'Wikipedia — the free encyclopedia',
    'youtube.com': 'YouTube',
    'github.com': 'GitHub',
    'medium.com': 'Medium',
    'bbc.com': 'BBC News',
    'stackoverflow.com': 'Stack Overflow'
  };
  function prettify(seg) {
    return seg.replace(/[-_]+/g, ' ').replace(/\.[a-z]+$/, '')
      .replace(/\b\w/g, c => c.toUpperCase()).trim();
  }
  function guessTitle(url) {
    let host = url, path = '';
    try {
      const u = new URL(url.match(/^https?:\/\//) ? url : 'https://' + url);
      host = u.hostname.replace(/^www\./, '');
      path = u.pathname.replace(/\/$/, '');
    } catch (e) { /* leave as-is */ }
    const base = host.split('.').slice(-2).join('.');
    const lastSeg = path.split('/').filter(Boolean).pop();
    if (lastSeg && lastSeg.length > 2) {
      const site = KNOWN[base] || prettify(host.split('.')[0]);
      return prettify(lastSeg) + ' — ' + site;
    }
    return KNOWN[base] || prettify(host.split('.')[0]);
  }

  function render() {
    if (items.length === 0) {
      count.textContent = '';
      list.innerHTML = '<li class="empty">Nothing saved yet. Paste a link above to get started.</li>';
      return;
    }
    count.textContent = items.length + (items.length === 1 ? ' link saved' : ' links saved');
    list.innerHTML = '';
    items.forEach(function (it) {
      const li = document.createElement('li');
      if (it.fetching) li.className = 'fetching';
      const t = document.createElement('div');
      t.className = 'title';
      if (it.fetching) {
        t.textContent = 'Getting the page name…';
      } else {
        const a = document.createElement('a');
        a.href = it.url; a.textContent = it.title; a.target = '_blank'; a.rel = 'noopener';
        t.appendChild(a);
      }
      const u = document.createElement('div');
      u.className = 'link-url';
      u.textContent = it.url;
      li.appendChild(t); li.appendChild(u);
      list.appendChild(li);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const url = input.value.trim();
    if (!url) return;
    const it = { url: url, title: '', fetching: true };
    items.unshift(it);
    input.value = '';
    input.focus();
    render();
    // Simulate the brief moment the app looks up the page name.
    setTimeout(function () {
      it.title = guessTitle(url);
      it.fetching = false;
      render();
    }, 700);
  });

  render();
</script>
</body>
</html>
